t swap_endian32(uint32_t n) {\n    return ((n >> 24) & 0x000000FFu) |\n           ((n >> 8)  & 0x0000FF00u) |\n           ((n \u003c\u003c 8)  & 0x00FF0000u) |\n           ((n \u003c\u003c 24) & 0xFF000000u);\n}", "explanation_ko": "byte0\u003c->byte3, byte1\u003c->byte2 를 맞바꾼다. 바깥 두 바이트는 24비트, 안쪽 두 바이트는 8비트씩 이동하고 각자 마스크로 다른 바이트 오염을 막는다.", "complexity": "O(1) time, O(1) space", "pitfalls": ["마스크 누락 시 부호확장/중첩 오염", "host가 이미 big-endian이면 불필요 — union으로 런타임 감지 가능"], "anduril_context": "MAVLink/네트워크 프로토콜 파싱 — network byte order(big) 를 ARM host(little)로 변환."}, {"num": 22, "slug": "bitfield-get-set", "title_ko": "레지스터 비트필드 read/write", "title_en": "get_field/set_field", "difficulty": "medium", "tags": ["register", "bitfield", "MMIO"], "prompt_ko": "pos에서 width비트 크기의 필드를 읽고(get) 쓰라(set).", "prompt_en": "Read/write a width-bit field located at bit position pos.", "signature": "uint32_t get_field(uint32_t reg, uint8_t pos, uint8_t width); uint32_t set_field(uint32_t reg, uint8_t pos, uint8_t width, uint32_t value)", "examples": [{"in": "get(0xF0F0,4,4)", "out": "0xF"}, {"in": "set(0x0000,4,4,0xF)", "out": "0xF0"}], "hints": ["field mask = (1u\u003c\u003cwidth)-1 (width\u003c32).", "get: (reg>>pos) & fieldmask.", "set: (reg & ~(fieldmask\u003c\u003cpos)) | ((value\u003c\u003cpos)&(fieldmask\u003c\u003cpos))."], "solution": "uint32_t get_field(uint32_t reg, uint8_t pos, uint8_t width) {\n    uint32_t fm = (width >= 32) ? 0xFFFFFFFFu : ((1u \u003c\u003c width) - 1u);\n    return (reg >> pos) & fm;\n}\nuint32_t set_field(uint32_t reg, uint8_t pos, uint8_t width, uint32_t value) {\n    uint32_t fm = (width >= 32) ? 0xFFFFFFFFu : ((1u \u003c\u003c width) - 1u);\n    uint32_t mask = fm \u003c\u003c pos;\n    return (reg & ~mask) | ((value \u003c\u003c pos) & mask);\n}", "explanation_ko": "C struct bit-field 대신 직접 마스킹으로 이식성/명확성 확보. get은 필드를 LSB로 내려 마스크, set은 read-modify-write (기존 clear 후 OR).", "complexity": "O(1) time, O(1) space", "pitfalls": ["width==32 시 1u\u003c\u003c32 UB", "실제 MMIO는 volatile 필요 + ISR race", "value가 width 초과 시 mask로 잘라야 인접 필드 안전"], "anduril_context": "STM32/Cortex-M 주변장치 레지스터 (타이머 프리스케일러, ADC 채널, GPIO 모드) 필드 조작."}, {"num": 23, "slug": "binary-to-gray", "title_ko": "이진수 -> 그레이 코드", "title_en": "binary_to_gray", "difficulty": "easy", "tags": ["gray-code", "encoder", "xor"], "prompt_ko": "이진수를 그레이 코드로 변환하라 (연속 값이 1비트만 다름).", "prompt_en": "Convert binary to Gray code.", "signature": "uint32_t binary_to_gray(uint32_t n)", "examples": [{"in": "0b1011", "out": "0b1110"}], "hints": ["공식은 한 줄이다.", "각 비트를 바로 위 비트와 XOR.", "gray = n ^ (n>>1)."], "solution": "uint32_t binary_to_gray(uint32_t n) {\n    return n ^ (n >> 1);\n}", "explanation_ko": "그레이 코드의 각 비트 = 원본 비트 XOR 상위 비트. n>>1 로 상위 비트를 정렬해 XOR하면 인접 값이 정확히 1비트만 다른 코드가 나온다.", "complexity": "O(1) time, O(1) space", "pitfalls": ["역변환과 혼동 금지 (역은 누적 XOR 필요)"], "anduril_context": "기계식 회전 엔코더/앱솔루트 엔코더 위치 인코딩, CDC FIFO 포인터."}, {"num": 24, "slug": "gray-to-binary", "title_ko": "그레이 코드 -> 이진수", "title_en": "gray_to_binary", "difficulty": "medium", "tags": ["gray-code", "encoder", "xor-scan"], "prompt_ko": "그레이 코드를 이진수로 역변환하라.", "prompt_en": "Convert Gray code back to binary.", "signature": "uint32_t gray_to_binary(uint32_t n)", "examples": [{"in": "0b1110", "out": "0b1011"}], "hints": ["역변환은 누적 XOR이 필요.", "res=n; 그다음 n을 계속 오른쪽 시프트하며 res에 XOR.", "while (n >>= 1) res ^= n;"], "solution": "uint32_t gray_to_binary(uint32_t n) {\n    uint32_t res = n;\n    while (n >>= 1) res ^= n;\n    return res;\n}", "explanation_ko": "각 이진 비트는 자신 이상의 그레이 비트들의 XOR 누적이다. n을 오른쪽으로 밀며 XOR를 누적하면 상위->하위로 전파되어 원본 이진수를 복원한다.", "complexity": "O(log n) time, O(1) space", "pitfalls": ["단순 n^(n>>1) 로는 역변환 안 됨 (그건 정변환)", "while 조건에서 대입=비교 혼동 주의"], "anduril_context": "엔코더에서 읽은 그레이 코드를 각도/위치 정수로 디코딩."}, {"num": 25, "slug": "shift-mul-div", "title_ko": "시프트로 곱셈/나눗셈", "title_en": "mul_pow2/div_pow2", "difficulty": "easy", "tags": ["shift", "optimization", "power-of-two"], "prompt_ko": "2^k 곱셈/나눗셈을 시프트로 구현하라.", "prompt_en": "Multiply/divide by 2^k using shifts.", "signature": "uint32_t mul_pow2(uint32_t n, uint8_t k); uint32_t div_pow2(uint32_t n, uint8_t k)", "examples": [{"in": "mul(3,2)", "out": "12"}, {"in": "div(12,2)", "out": "3"}], "hints": ["곱은 왼쪽 시프트, 나눗셈은 오른쪽 시프트.", "k>=32 는 UB -> 가드.", "부호없는 값에만 안전."], "solution": "uint32_t mul_pow2(uint32_t n, uint8_t k) {\n    return (k >= 32) ? 0u : (n \u003c\u003c k);\n}\nuint32_t div_pow2(uint32_t n, uint8_t k) {\n    return (k >= 32) ? 0u : (n >> k);\n}", "explanation_ko": "n\u003c\u003ck = n*2^k, n>>k = n/2^k (부호없는 floor). k>=32 는 시프트 UB라 0으로 가드. 음수(signed)는 산술 시프트로 -1>>1==-1 이 되어 나눗셈 의미가 깨지므로 unsigned 전제.", "complexity": "O(1) time, O(1) space", "pitfalls": ["k>=32 UB 가드 누락", "signed 음수에서 >> 는 구현정의/산술 시프트", "mul 오버플로는 wrap-around (unsigned)"], "anduril_context": "DSP/고정소수점 스케일링, 나눗셈기 없는 MCU에서 2^k 스케일 최적화."}]}, {"id": "strings", "order": 3, "range": "Q26-40", "icon": "🔤", "title_en": "String Functions", "title_ko": "문자열 함수", "summary_ko": "strlen/strcpy/strncpy/strcat/strcmp/strstr/strchr/atoi/itoa, 대소문자 변환, 단어 뒤집기, 중복 제거, 회문, strtok(static 상태), 축소판 sprintf를 libc 없이 직접 재구현한다. 핵심은 포인터 순회, 버퍼 안전, 널 종료, 엣지케이스 방어.", "summary_en": "Reimplement core libc string functions from scratch: strlen/strcpy/strncpy/strcat/strcmp/strstr/strchr/atoi/itoa, case conversion, reverse_words, remove_duplicates, palindrome, strtok (static state), and a tiny sprintf. Emphasis on pointer traversal, buffer safety, null-termination, and edge cases.", "anduril_relevance_ko": "펌웨어에선 \u003cstring.h>가 있어도 바운드 검사가 없어 오버플로/널 미종료가 실무 최다 버그다. 인터뷰어는 한 줄짜리 재구현을 시켜놓고 NULL·빈 문자열·버퍼 경계·오버플로·종료 널 같은 엣지케이스를 파고든다. 드론/자율체에서는 명령 파싱, 텔레메트리·로그 포맷팅, NMEA/AT 커맨드 처리에 문자열이 쓰이며, 힙이 없거나 제한적이라 고정 버퍼 + 직접 포맷팅(tiny sprintf)과 상태 있는 토크나이저 이해가 실제로 필요하다.", "concepts": [{"term": "null-termination", "ko": "C 문자열은 '\\0'로 끝나며 길이를 저장하지 않음 → 매번 스캔, 종료 널 누락은 OOB read", "en": "C strings end with '\\0'; length isn't stored, so missing the terminator causes OOB reads"}, {"term": "buffer safety", "ko": "dest 버퍼 크기는 호출자 책임. strcpy/strcat은 검사하지 않아 오버플로 주범", "en": "Destination size is the caller's responsibility; strcpy/strcat don't check, the top overflow source"}, {"term": "strncpy trap", "ko": "src>=n이면 널 종료 안 됨; 짧으면 나머지를 '\\0'로 패딩", "en": "No NUL if src>=n; pads remainder with '\\0' when src is shorter"}, {"term": "unsigned char compare", "ko": "strcmp는 unsigned char로 비교해야 고바이트에서 부호가 뒤집히지 않음", "en": "Compare as unsigned char so high bytes don't flip the sign of the result"}, {"term": "strtok static state", "ko": "static 포인터로 위치 기억 → 스레드 안전 X, 재진입 X, 원본 파괴", "en": "Static pointer remembers position: not thread-safe, not reentrant, destroys input"}, {"term": "atoi overflow", "ko": "표준은 오버플로 시 UB; INT_MAX/INT_MIN으로 saturate가 안전", "en": "Standard atoi is UB on overflow; saturating to INT_MAX/INT_MIN is safe"}, {"term": "INT_MIN abs", "ko": "-INT_MIN은 오버플로 → unsigned 승격 후 -(long)n 처리", "en": "-INT_MIN overflows; promote to unsigned via -(long)n"}, {"term": "in-place reverse", "ko": "reverse_words = 전체 뒤집기 → 각 단어 되뒤집기(추가 버퍼 0)", "en": "reverse_words = reverse whole, then reverse each word (zero extra buffer)"}], "study_note_md": "# 03. String Functions (문자열 함수) · Q26-40 🔤\n\n> libc 문자열 함수를 **직접** 재구현하는 드릴. Anduril 펌웨어 인터뷰의 단골 —\n> \"표준 라이브러리 없이 이거 짜보세요\"는 사실상 **포인터 + 버퍼 안전 + 널 종료**를\n> 제대로 이해하는지 보는 시험이다.\n\n---\n\n## 왜 이 토픽이 인터뷰에 나오나\n\n- 임베디드/펌웨어에서 `\u003cstring.h>`는 흔하지만, **바운드 검사가 없다**. 실무 버그의 상당수가\n  strcpy/strcat 오버플로, strncpy 널 미종료, strtok 재진입 문제에서 나온다.\n- 인터뷰어는 `my_strcpy` 한 줄짜리를 시켜놓고 **엣지케이스**(NULL, 빈 문자열, 버퍼 경계,\n  오버플로, 종료 널)를 파고든다. \"이거 언제 깨지나요?\"가 진짜 질문이다.\n- 드론/자율체 펌웨어에서 문자열은 **명령 파싱, 텔레메트리 포맷팅, 로그, NMEA/AT 커맨드**\n  등에 쓰인다. 힙이 없거나 제한적이라 **고정 버퍼 + 직접 포맷팅**이 기본이다.\n\n---\n\n## 핵심 개념 치트시트\n\n| 개념 | 요점 |\n|---|---|\n| **null-termination** | C 문자열은 `'\\0'`로 끝난다. 길이는 저장 안 됨 → 매번 스캔. 종료 널 빼먹으면 OOB read. |\n| **buffer safety** | dest 버퍼 크기는 **호출자 책임**. `strcpy`/`strcat`은 검사 안 함 → 오버플로 주범. |\n| **strncpy 함정** | src ≥ n 이면 **널 종료 안 됨**. 짧으면 나머지를 `'\\0'`로 패딩(성능 비용). |\n| **unsigned char 비교** | `strcmp`는 `unsigned char`로 비교해야 부호 있는 char 에서 결과 부호가 뒤집히지 않음. |\n| **strtok 상태** | `static` 포인터로 위치 기억 → **스레드 안전 X, 재진입 X**. 원본 문자열을 파괴(널 삽입). |\n| **overflow(atoi)** | 표준 `atoi`는 오버플로 시 UB. 안전하게 **INT_MAX/INT_MIN saturate** 권장. |\n| **INT_MIN abs** | `-INT_MIN`은 오버플로. `unsigned`로 승격 후 `-(long)n` 처리. |\n| **in-place 기법** | reverse_words = 전체 뒤집기 → 각 단어 되뒤집기. 추가 버퍼 0. |\n\n---\n\n## 문제별 요점 & 함정\n\n### 26-29. strlen / strcpy / strncpy / strcat\n- `strlen`: 포인터 차(`p - s`)로 O(n).\n- `strcpy`: `while ((*d++ = *src++));` — 널까지 복사되고 0이 루프를 끝냄.\n- `strncpy`: **libc 시맨틱을 정확히** — 짧으면 널 패딩, 길면 종료 안 함. 인터뷰에서 이걸\n  물어보면 \"그래서 저는 항상 `dst[n-1]='\\0'`를 직접 넣습니다\"라고 답하면 가점.\n- `strcat`: dest 끝(`while(*d) d++;`)까지 간 뒤 거기서부터 복사. **매번 dest 전체 스캔**\n  → 반복 strcat 은 O(n²)(이른바 \"Shlemiel the painter\").\n\n### 30-32. strcmp / strstr / strchr\n- `strcmp`: 마지막에 `(unsigned char)*s1 - (unsigned char)*s2`.\n- `strstr`: 순진한 O(n·m). 빈 needle → haystack 반환(libc 규약).\n- `strchr`: `c`는 `int`지만 `char`로 캐스팅해 비교. `c=='\\0'`이면 **종료 널 주소** 반환.\n\n### 33-34. atoi / itoa\n- `atoi`: 공백 skip → 부호 → 숫자. 오버플로 **saturate**. 반복마다 clamp 하면 long long 도 안전.\n- `itoa`: base 2..16. 뒤에서부터 자리수 뽑아 `tmp`에 담고 **뒤집어** 복사. `INT_MIN`은\n  `unsigned`로 처리. base 10 에서만 부호.\n\n### 35-38. case / reverse_words / remove_duplicates / palindrome\n- 대소문자: ASCII 범위 체크 후 `± ('a'-'A')`. (로케일/UTF-8 은 범위 밖.)\n- reverse_words: **전체 뒤집고 → 단어별 되뒤집기**. 공백 위치 보존, 추가 메모리 없음.\n- remove_duplicates: `bool seen[256]` 룩업 + write-index compaction, O(n).\n- palindrome: 투 포인터 `i\u003cj`. 빈 문자열은 회문으로 간주.\n\n### 39. strtok\n```c\nstatic char *save = NULL;      // ← 상태 유지의 핵심\nif (str) save = str;\n// 앞쪽 구분자 skip → 토큰 시작 → 다음 구분자를 '\\0'로 잘라내고 save 전진\n```\n- **원본을 파괴**하고 **static** 을 쓴다 → 멀티스레드/중첩 토큰화에서 깨짐.\n  실무 대안: `strtok_r`(reentrant), 또는 직접 인덱스 관리.\n\n### 40. tiny sprintf\n- `va_list` / `va_start` / `va_arg` / `va_end`. `%d %u %x %X %c %s %%` 지원.\n- `%d` 음수는 `-` 출력 후 `unsigned`로 승격(`-(long)v`)해서 자리수 처리.\n- 반환값은 **쓴 문자 수(널 제외)**. 실무판은 반드시 **버퍼 크기 인자**(snprintf류)를 받아야 안전.\n\n---\n\n## 인터뷰 팔로업 (자주 나오는 꼬리질문)\n\n1. **\"strcpy 어디서 깨지나요?\"** → dest 버퍼가 src+1 보다 작으면 오버플로. NULL 포인터. 겹치는 메모리(overlap)는 memmove 영역.\n2. **\"strncpy 는 왜 위험?\"** → 널 종료를 보장 안 함. 이후 strlen/printf 가 OOB read.\n3. **\"strtok 를 ISR/스레드에서 쓰면?\"** → static 상태 공유로 레이스. strtok_r 써야 함.\n4. **\"atoi vs strtol?\"** → strtol 은 에러/오버플로/진법/끝 포인터를 알려줌. 실무는 strtol.\n5. **\"반복 strcat 이 느린 이유?\"** → 매번 끝을 다시 찾음 → O(n²). 끝 포인터를 유지하면 O(n).\n6. **\"UTF-8 이면?\"** → 바이트 길이 ≠ 문자 수. tolower/upper 는 ASCII 전용.\n\n---\n\n## 빌드 & 실행\n\n```sh\n# 연습(직접 채우기)\ncc -std=c11 -Wall -Wextra problems/03_strings.c -o /tmp/andb_strings && /tmp/andb_strings\n# 정답 확인\ncc -std=c11 -Wall -Wextra solutions/03_strings.c -o /tmp/andb_strings && /tmp/andb_strings\n# 또는\nmake prob N=03_strings      #  연습\nmake sol  N=03_strings      #  정답 (전부 PASS)\n```\n\n> **핵심 한 줄**: C 문자열 함수의 90%는 \"포인터로 널까지 스캔 + 버퍼 크기는 내 책임 +\n> 종료 널 잊지 마라\"로 요약된다. 나머지는 엣지케이스 방어다.\n", "problems": [{"num": 26, "slug": "my_strlen", "title_ko": "문자열 길이", "title_en": "String length", "difficulty": "easy", "tags": ["pointers", "scan"], "prompt_ko": "널 종료 문자열의 길이(널 제외)를 반환하라.", "prompt_en": "Return the length of a NUL-terminated string, excluding the terminator.", "signature": "size_t my_strlen(const char *s)", "examples": [{"in": "\"hello\"", "out": "5"}, {"in": "\"\"", "out": "0"}], "hints": ["원본 포인터를 보존하고 별도 포인터로 순회하라.", "'\\0'를 만나면 멈춘다.", "포인터 차이가 곧 길이다."], "solution": "size_t my_strlen(const char *s) {\n    const char *p = s;\n    while (*p) p++;\n    return (size_t)(p - s);\n}", "explanation_ko": "포인터 p를 널까지 전진시키고 p-s로 길이를 구한다. 길이 정보를 저장하지 않는 C 문자열의 본질.", "complexity": "O(n) time, O(1) space", "pitfalls": ["s가 NULL이면 역참조 크래시(실무는 방어).", "길이를 캐싱하지 않아 반복 호출 시 매번 O(n)."], "anduril_context": "텔레메트리/로그 버퍼에서 문자열 크기 계산, 전송 길이 산정."}, {"num": 27, "slug": "my_strcpy", "title_ko": "문자열 복사", "title_en": "String copy", "difficulty": "easy", "tags": ["pointers", "buffer-safety"], "prompt_ko": "src(널 포함)를 dest로 복사하고 dest를 반환하라. 버퍼 크기는 호출자 책임.", "prompt_en": "Copy src (including NUL) into dest and return dest.", "signature": "char *my_strcpy(char *dest, const char *src)", "examples": [{"in": "dest,\"abc\"", "out": "dest==\"abc\""}], "hints": ["`while ((*d++ = *src++));` 한 줄로 가능.", "대입식의 값이 복사된 문자 → 0이면 종료.", "dest 원본 포인터를 반환용으로 보관."], "solution": "char *my_strcpy(char *dest, const char *src) {\n    char *d = dest;\n    while ((*d++ = *src++))\n        ;\n    return dest;\n}", "explanation_ko": "대입식 (*d++ = *src++)의 결과가 복사된 문자다. '\\0'을 복사하는 순간 값 0이 되어 루프가 끝난다.", "complexity": "O(n) time, O(1) space", "pitfalls": ["dest 버퍼가 작으면 오버플로(검사 없음).", "src와 dest가 겹치면 UB → memmove 영역.", "dest/src NULL 미방어."], "anduril_context": "고정 크기 명령/설정 버퍼에 문자열 세팅. 오버플로가 실무 최다 버그."}, {"num": 28, "slug": "my_strncpy", "title_ko": "제한 복사", "title_en": "Bounded copy", "difficulty": "medium", "tags": ["buffer-safety", "null-termination"], "prompt_ko": "최대 n바이트 복사. src가 짧으면 나머지를 '\\0'로 패딩, src가 n 이상이면 널 종료하지 않는다(libc 시맨틱).", "prompt_en": "Copy at most n bytes; pad with '\\0' if src is shorter; do NOT NUL-terminate if src length >= n.", "signature": "char *my_strncpy(char *dest, const char *src, size_t n)", "examples": [{"in": "dest,\"ab\",5", "out": "\"ab\\0\\0\\0\""}, {"in": "dest,\"abcdef\",3", "out": "\"abc\"(종료 안 됨)"}], "hints": ["복사 루프와 패딩 루프를 나눠라.", "src가 먼저 끝나면 남은 자리를 0으로 채운다.", "src가 n 이상이면 널을 넣지 않는다 — 이게 함정."], "solution": "char *my_strncpy(char *dest, const char *src, size_t n) {\n    size_t i = 0;\n    for (; i \u003c n && src[i] != '\\0'; i++) dest[i] = src[i];\n    for (; i \u003c n; i++) dest[i] = '\\0';\n    return dest;\n}", "explanation_ko": "libc strncpy는 널 종료를 보장하지 않는다. 짧으면 0 패딩, 길면 잘리되 종료 안 함. 안전하려면 호출자가 dest[n-1]='\\0'을 직접 넣어야 한다.", "complexity": "O(n) time, O(1) space", "pitfalls": ["src>=n일 때 널 미종료 → 이후 strlen/printf가 OOB read.", "0 패딩 때문에 큰 n에 성능 비용.", "'안전한 strcpy'로 오해하기 쉬움."], "anduril_context": "고정 필드(예: 콜사인, 장비 ID)로 문자열 복사 시. 널 미종료 함정 필수 인지."}, {"num": 29, "slug": "my_strcat", "title_ko": "문자열 이어붙이기", "title_en": "String concatenate", "difficulty": "easy", "tags": ["pointers", "buffer-safety"], "prompt_ko": "dest 끝에 src를 이어붙이고 dest를 반환하라.", "prompt_en": "Append src to the end of dest and return dest.", "signature": "char *my_strcat(char *dest, const char *src)", "examples": [{"in": "\"hello\",\"world\"", "out": "\"helloworld\""}], "hints": ["먼저 dest의 '\\0' 위치로 이동.", "그 자리부터 strcpy와 동일하게 복사.", "반복 strcat은 O(n²)임에 유의."], "solution": "char *my_strcat(char *dest, const char *src) {\n    char *d = dest;\n    while (*d) d++;\n    while ((*d++ = *src++))\n        ;\n    return dest;\n}", "explanation_ko": "dest 끝(널)을 찾은 뒤 그 지점부터 src를 복사한다. 매 호출마다 dest 전체를 다시 스캔하므로 반복 이어붙이기는 O(n²)('Shlemiel the painter').", "complexity": "O(n+m) time, O(1) space", "pitfalls": ["dest 버퍼가 총합보다 작으면 오버플로.", "반복 strcat의 O(n²) 성능 함정.", "dest가 널 종료 안 됐으면 끝을 못 찾음."], "anduril_context": "로그 라인/텔레메트리 문자열 조립. 끝 포인터를 유지해 O(n)로 만드는 게 실무 팁."}, {"num": 30, "slug": "my_strcmp", "title_ko": "문자열 비교", "title_en": "String compare", "difficulty": "easy", "tags": ["comparison", "signedness"], "prompt_ko": "사전식 비교. \u003c0 / 0 / >0을 반환하라.", "prompt_en": "Lexicographic compare; return \u003c0, 0, or >0.", "signature": "int my_strcmp(const char *s1, const char *s2)", "examples": [{"in": "\"abc\",\"abd\"", "out": "negative"}, {"in": "\"abc\",\"abc\"", "out": "0"}], "hints": ["두 문자가 같고 널이 아닌 동안 전진.", "멈춘 지점의 문자 차이를 반환.", "unsigned char로 캐스팅해 비교하라."], "solution": "int my_strcmp(const char *s1, const char *s2) {\n    while (*s1 && (*s1 == *s2)) { s1++; s2++; }\n    return (int)(unsigned char)*s1 - (int)(unsigned char)*s2;\n}", "explanation_ko": "첫 불일치 지점에서 unsigned char 값의 차이를 반환한다. signed char로 비교하면 0x80 이상 바이트에서 결과 부호가 뒤집힐 수 있어 unsigned가 정답.", "complexity": "O(min(n,m)) time, O(1) space", "pitfalls": ["signed char 비교 시 고바이트에서 부호 오류.", "길이만 다른 경우('abc' vs 'ab')는 '\\0'-문자 차이로 자연히 처리됨."], "anduril_context": "명령어/토큰 매칭, 프로토콜 키워드 비교(예: AT 커맨드 디스패치)."}, {"num": 31, "slug": "my_strstr", "title_ko": "부분 문자열 탐색", "title_en": "Substring search", "difficulty": "medium", "tags": ["search", "pointers"], "prompt_ko": "haystack에서 needle의 첫 등장 포인터를 반환. 없으면 NULL, 빈 needle이면 haystack.", "prompt_en": "Return pointer to first occurrence of needle in haystack; NULL if none; empty needle -> haystack.", "signature": "char *my_strstr(const char *haystack, const char *needle)", "examples": [{"in": "\"hello world\",\"world\"", "out": "\"world\""}, {"in": "\"abc\",\"xyz\"", "out": "NULL"}], "hints": ["각 시작 위치에서 needle 전체를 맞춰본다.", "needle을 끝까지 소진하면 매칭 성공.", "빈 needle은 haystack 반환(libc 규약)."], "solution": "char *my_strstr(const char *haystack, const char *needle) {\n    if (*needle == '\\0') return (char *)haystack;\n    for (; *haystack; haystack++) {\n        const char *h = haystack, *n = needle;\n        while (*h && *n && *h == *n) { h++; n++; }\n        if (*n == '\\0') return (char *)haystack;\n    }\n    return NULL;\n}", "explanation_ko": "haystack의 각 위치를 후보 시작점으로 두고 needle을 맞춰본다. needle이 '\\0'까지 소진되면 매칭. 순진한 O(n·m)이며 KMP로 O(n+m) 개선 가능(팔로업).", "complexity": "O(n·m) time, O(1) space", "pitfalls": ["빈 needle 규약 누락.", "const 입력에 char* 반환(libc처럼 캐스팅 필요).", "성능 최적화(KMP/Boyer-Moore) 질문 대비."], "anduril_context": "노이즈 바이트 스트림에서 프레임 헤더/마커 탐색, 로그 grep."}, {"num": 32, "slug": "my_strchr", "title_ko": "문자 탐색", "title_en": "Character search", "difficulty": "easy", "tags": ["search", "edge-case"], "prompt_ko": "s에서 문자 c의 첫 등장 포인터. c는 char로 취급하며, c=='\\0'이면 종료 널의 주소를 반환.", "prompt_en": "First occurrence of c in s; c is treated as char; c=='\\0' returns address of the terminating NUL.", "signature": "char *my_strchr(const char *s, int c)", "examples": [{"in": "\"abc\",'b'", "out": "\"bc\""}, {"in": "\"abc\",'z'", "out": "NULL"}], "hints": ["c를 char로 캐스팅해 비교.", "루프는 '\\0' 전까지 순회.", "c=='\\0'이면 종료 널 위치를 반환해야 함."], "solution": "char *my_strchr(const char *s, int c) {\n    char target = (char)c;\n    while (*s) {\n        if (*s == target) return (char *)s;\n        s++;\n    }\n    return (target == '\\0') ? (char *)s : NULL;\n}", "explanation_ko": "문자열을 순회하며 일치를 찾는다. c가 널 문자인 특수 케이스는 종료 널의 주소를 반환하는 libc 규약을 지킨다.", "complexity": "O(n) time, O(1) space", "pitfalls": ["c=='\\0' 케이스 누락(가장 흔한 실수).", "int c를 그대로 비교하면 부호/폭 이슈."], "anduril_context": "구분자/개행 위치 찾기, 파서에서 다음 필드 경계 탐색."}, {"num": 33, "slug": "my_atoi", "title_ko": "문자열→정수", "title_en": "ASCII to int", "difficulty": "medium", "tags": ["parsing", "overflow"], "prompt_ko": "앞 공백 skip, 선택적 부호, 십진 숫자를 파싱. 오버플로는 INT_MAX/INT_MIN으로 saturate.", "prompt_en": "Skip leading whitespace, optional sign, parse decimal digits; saturate on overflow.", "signature": "int my_atoi(const char *str)", "examples": [{"in": "\"  -42\"", "out": "-42"}, {"in": "\"9999999999\"", "out": "INT_MAX"}], "hints": ["공백 → 부호 → 숫자 순서로 처리.", "누산은 long long, 매 반복 clamp.", "비숫자를 만나면 멈춘다."], "solution": "int my_atoi(const char *str) {\n    if (!str) return 0;\n    const char *p = str;\n    while (*p==' '||*p=='\\t'||*p=='\\n'||*p=='\\r'||*p=='\\v'||*p=='\\f') p++;\n    int sign = 1;\n    if (*p=='+'||*p=='-') { if (*p=='-') sign = -1; p++; }\n    long long acc = 0;\n    while (*p>='0' && *p\u003c='9') {\n        acc = acc*10 + (*p-'0');\n        if (sign==1 && acc > INT_MAX) return INT_MAX;\n        if (sign==-1 && -acc \u003c INT_MIN) return INT_MIN;\n        p++;\n    }\n    return (int)(sign*acc);\n}", "explanation_ko": "공백/부호/숫자를 순서대로 처리한다. 표준 atoi는 오버플로 시 UB지만, 매 반복 clamp로 INT_MAX/INT_MIN에 saturate해 안전하게 만든다. long long 누산도 조기 반환으로 오버플로 안 남.", "complexity": "O(n) time, O(1) space", "pitfalls": ["오버플로 미처리 시 UB.", "부호/공백 순서 실수.", "실무는 오류를 알려주는 strtol 선호."], "anduril_context": "명령 인자/설정값 파싱, 텍스트 프로토콜의 수치 필드 해석."}, {"num": 34, "slug": "my_itoa", "title_ko": "정수→문자열", "title_en": "Int to ASCII", "difficulty": "medium", "tags": ["conversion", "edge-case"], "prompt_ko": "정수 n을 base(2..16) 문자열로 s에 쓰고 s를 반환. base 10에서만 음수 부호를 붙인다.", "prompt_en": "Convert n to a base(2..16) string in s and return s. Minus sign only for base 10.", "signature": "char *my_itoa(int n, char *s, int base)", "examples": [{"in": "255,buf,16", "out": "\"ff\""}, {"in": "-45,buf,10", "out": "\"-45\""}], "hints": ["뒤에서부터 자리수를 뽑아 임시 버퍼에 담고 뒤집어라.", "INT_MIN은 unsigned로 승격해 처리.", "base 범위/0 케이스를 먼저 처리."], "solution": "char *my_itoa(int n, char *s, int base) {\n    if (base \u003c 2 || base > 16) { s[0] = '\\0'; return s; }\n    static const char digits[] = \"0123456789abcdef\";\n    bool neg = false;\n    unsigned int u;\n    if (base == 10 && n \u003c 0) { neg = true; u = (unsigned int)(-(long)n); }\n    else u = (unsigned int)n;\n    char tmp[35];\n    int i = 0;\n    if (u == 0) tmp[i++] = '0';\n    while (u) { tmp[i++] = digits[u % (unsigned)base]; u /= (unsigned)base; }\n    int j = 0;\n    if (neg) s[j++] = '-';\n    while (i > 0) s[j++] = tmp[--i];\n    s[j] = '\\0';\n    return s;\n}", "explanation_ko": "u%base로 최하위 자리부터 뽑아 tmp에 역순으로 담고, 마지막에 뒤집어 s에 쓴다. INT_MIN은 -(long)n으로 unsigned에 안전히 담아 abs 오버플로를 피한다. 비-10진수는 비트패턴을 그대로 unsigned 처리.", "complexity": "O(log n) time, O(1) space", "pitfalls": ["INT_MIN에서 -n 오버플로(unsigned 승격 필요).", "n==0 케이스 누락 시 빈 문자열.", "자리수 뒤집기 잊음.", "버퍼 크기 부족(2진수는 최대 32자리)."], "anduril_context": "레지스터 값/에러 코드를 hex 문자열로 로깅, 텔레메트리 포맷."}, {"num": 35, "slug": "str_case", "title_ko": "대소문자 변환", "title_en": "Case conversion", "difficulty": "easy", "tags": ["ascii", "in-place"], "prompt_ko": "ASCII 기준으로 문자열을 in-place 소문자/대문자로 변환하라.", "prompt_en": "In-place ASCII lower/upper case conversion.", "signature": "void str_to_lower(char *s); void str_to_upper(char *s)", "examples": [{"in": "\"ABC\"", "out": "\"abc\" (lower)"}, {"in": "\"abc\"", "out": "\"ABC\" (upper)"}], "hints": ["대상 범위(A-Z / a-z)만 변환.", "차이값은 'a'-'A' = 32.", "비알파벳/숫자는 건드리지 않는다."], "solution": "void str_to_lower(char *s) {\n    for (; *s; s++) if (*s >= 'A' && *s \u003c= 'Z') *s = (char)(*s + ('a' - 'A'));\n}\nvoid str_to_upper(char *s) {\n    for (; *s; s++) if (*s >= 'a' && *s \u003c= 'z') *s = (char)(*s - ('a' - 'A'));\n}", "explanation_ko": "알파벳 범위 안에서만 32(=`'a'-'A'`)를 더하거나 빼서 변환한다. ASCII 전용이며 로케일/UTF-8은 범위 밖.", "complexity": "O(n) time, O(1) space", "pitfalls": ["범위 검사 없이 무조건 ±32 하면 숫자/기호 깨짐.", "UTF-8 멀티바이트에는 부적합.", "\u003cctype.h> tolower는 int/EOF 계약 주의."], "anduril_context": "명령 파서에서 대소문자 무시 매칭, 사용자 입력 정규화."}, {"num": 36, "slug": "reverse_words", "title_ko": "단어 뒤집기", "title_en": "Reverse words", "difficulty": "medium", "tags": ["in-place", "two-pointer"], "prompt_ko": "문자열의 단어 순서를 in-place로 뒤집어라.", "prompt_en": "Reverse the order of words in place.", "signature": "void reverse_words(char *s)", "examples": [{"in": "\"hello world\"", "out": "\"world hello\""}, {"in": "\"a b c d\"", "out": "\"d c b a\""}], "hints": ["먼저 문자열 전체를 뒤집는다.", "그다음 각 단어를 다시 뒤집는다.", "공백을 단어 경계로 사용."], "solution": "static void reverse_range(char *s, size_t lo, size_t hi) {\n    while (lo \u003c hi) { char t = s[lo]; s[lo] = s[hi]; s[hi] = t; lo++; hi--; }\n}\nvoid reverse_words(char *s) {\n    size_t len = my_strlen(s);\n    if (len == 0) return;\n    reverse_range(s, 0, len - 1);\n    size_t start = 0;\n    for (size_t i = 0; i \u003c= len; i++) {\n        if (i == len || s[i] == ' ') {\n            if (i > start) reverse_range(s, start, i - 1);\n            start = i + 1;\n        }\n    }\n}", "explanation_ko": "전체를 뒤집으면 단어 순서는 맞지만 각 단어의 글자가 거꾸로다. 그래서 각 단어를 다시 뒤집는다. 추가 버퍼 없이 O(n), 공백 위치도 보존.", "complexity": "O(n) time, O(1) space", "pitfalls": ["빈 문자열/단일 단어 엣지케이스.", "연속 공백/앞뒤 공백 처리 방침 명확히.", "len-1 언더플로(size_t) 주의 → len==0 조기 반환."], "anduril_context": "간단한 명령 라인 토큰 재배열, 로그 필드 순서 뒤집기 데모."}, {"num": 37, "slug": "remove_duplicates", "title_ko": "중복 문자 제거", "title_en": "Remove duplicates", "difficulty": "medium", "tags": ["hash-set", "in-place"], "prompt_ko": "이미 등장한 문자를 제거하고 첫 등장만 유지하라(in-place).", "prompt_en": "Remove characters already seen, keeping only the first occurrence (in place).", "signature": "void remove_duplicates(char *s)", "examples": [{"in": "\"banana\"", "out": "\"ban\""}, {"in": "\"aaaa\"", "out": "\"a\""}], "hints": ["bool seen[256] 룩업 배열 사용.", "read/write 두 인덱스로 compaction.", "마지막에 '\\0'로 종료."], "solution": "void remove_duplicates(char *s) {\n    bool seen[256] = { false };\n    size_t w = 0;\n    for (size_t r = 0; s[r]; r++) {\n        unsigned char c = (unsigned char)s[r];\n        if (!seen[c]) { seen[c] = true; s[w++] = s[r]; }\n    }\n    s[w] = '\\0';\n}", "explanation_ko": "256칸 bool 배열로 각 바이트를 봤는지 O(1)에 판단하고, write 인덱스로 유지할 문자만 앞으로 당긴다(compaction). 전체 O(n), 추가 메모리는 고정 256B.", "complexity": "O(n) time, O(1) space (고정 256B)", "pitfalls": ["char 인덱싱 시 부호 확장 → unsigned char 캐스팅 필수.", "종료 널을 마지막에 다시 넣어야 함.", "순서 유지 요구를 놓치기 쉬움."], "anduril_context": "센서 ID/채널 집합 중복 제거, 간단한 dedup 유틸."}, {"num": 38, "slug": "is_palindrome", "title_ko": "회문 검사", "title_en": "Palindrome check", "difficulty": "easy", "tags": ["two-pointer"], "prompt_ko": "문자열이 회문인지 검사하라(문자 그대로 비교).", "prompt_en": "Check whether a string is a palindrome (as-is).", "signature": "bool is_palindrome(const char *s)", "examples": [{"in": "\"level\"", "out": "true"}, {"in": "\"abc\"", "out": "false"}], "hints": ["양 끝에서 좁혀오는 투 포인터.", "i\u003cj인 동안 s[i]==s[j] 확인.", "빈 문자열은 회문으로 간주."], "solution": "bool is_palindrome(const char *s) {\n    size_t len = my_strlen(s);\n    if (len == 0) return true;\n    size_t i = 0, j = len - 1;\n    while (i \u003c j) {\n        if (s[i] != s[j]) return false;\n        i++; j--;\n    }\n    return true;\n}", "explanation_ko": "양 끝 포인터를 가운데로 좁히며 대칭을 확인한다. 하나라도 다르면 즉시 false. 정규화(대소문자/공백 무시)는 팔로업으로 확장 가능.", "complexity": "O(n) time, O(1) space", "pitfalls": ["빈 문자열/한 글자 엣지케이스.", "len==0에서 len-1 언더플로 주의.", "대소문자/영숫자 정규화 요구 시 tolower+skip 필요."], "anduril_context": "간단한 대칭 검증, 프로토콜 magic 패턴 확인 데모."}, {"num": 39, "slug": "my_strtok", "title_ko": "토큰 분리", "title_en": "Tokenize", "difficulty": "hard", "tags": ["static-state", "stateful"], "prompt_ko": "strtok을 재구현하라. 첫 호출은 str, 이후는 NULL로 이어서 토큰화한다. static 상태를 유지하며 원본을 파괴한다.", "prompt_en": "Reimplement strtok using static state; first call passes str, subsequent calls pass NULL.", "signature": "char *my_strtok(char *str, const char *delim)", "examples": [{"in": "\"a,b,c\" / \",\"", "out": "\"a\",\"b\",\"c\""}, {"in": "\",,x,,yy,,\" / \",\"", "out": "\"x\",\"yy\""}], "hints": ["static char* 로 다음 시작 위치를 기억.", "앞쪽 구분자를 skip한 뒤 토큰 시작.", "다음 구분자를 '\\0'로 바꾸고 포인터를 그 다음으로 전진."], "solution": "static bool in_delim(char c, const char *delim) {\n    for (; *delim; delim++) if (c == *delim) return true;\n    return false;\n}\nchar *my_strtok(char *str, const char *delim) {\n    static char *save = NULL;\n    if (str) save = str;\n    if (!save) return NULL;\n    while (*save && in_delim(*save, delim)) save++;\n    if (*save == '\\0') { save = NULL; return NULL; }\n    char *token = save;\n    while (*save && !in_delim(*save, delim)) save++;\n    if (*save) { *save = '\\0'; save++; }\n    return token;\n}", "explanation_ko": "static 포인터 save가 다음 탐색 위치를 기억한다. 앞쪽 구분자를 건너뛰어 토큰 시작을 찾고, 토큰 끝의 구분자를 '\\0'로 덮어써 잘라낸 뒤 save를 전진시킨다. 원본 문자열을 파괴하고 static을 쓰므로 스레드 안전하지 않고 재진입 불가.", "complexity": "O(n) total time, O(1) space", "pitfalls": ["static 상태 → 멀티스레드/중첩 토큰화에서 레이스.", "원본 문자열을 변경(리터럴 전달 시 크래시).", "연속/앞뒤 구분자 처리 누락.", "실무는 strtok_r 사용."], "anduril_context": "명령/설정 라인 파싱(예: CSV 형태 파라미터, NMEA 필드 분리)."}, {"num": 40, "slug": "my_sprintf", "title_ko": "축소판 sprintf", "title_en": "Tiny sprintf", "difficulty": "hard", "tags": ["varargs", "formatting"], "prompt_ko": "축소판 sprintf를 구현하라. 최소 %d %u %x %X %c %s %% 지원, 쓴 문자 수(널 제외)를 반환한다.", "prompt_en": "Implement a tiny sprintf supporting at least %d %u %x %X %c %s %%; return count written.", "signature": "int my_sprintf(char *str, const char *format, ...)", "examples": [{"in": "buf,\"num=%d\",123", "out": "buf==\"num=123\", 7"}, {"in": "buf,\"0x%X\",4093", "out": "\"0xFFD\""}], "hints": ["va_start/va_arg/va_end로 가변 인자 처리.", "정수는 뒤집힌 임시 버퍼에 담아 출력하는 헬퍼로.", "%d 음수는 '-' 먼저, 그다음 unsigned로 승격."], "solution": "static int emit_uint(char *out, unsigned int v, unsigned base, bool upper) {\n    char tmp[32];\n    const char *digs = upper ? \"0123456789ABCDEF\" : \"0123456789abcdef\";\n    int i = 0;\n    if (v == 0) tmp[i++] = '0';\n    while (v) { tmp[i++] = digs[v % base]; v /= base; }\n    int n = 0;\n    while (i > 0) out[n++] = tmp[--i];\n    return n;\n}\nint my_sprintf(char *str, const char *format, ...) {\n    va_list ap; va_start(ap, format);\n    char *out = str;\n    for (const char *f = format; *f; f++) {\n        if (*f != '%') { *out++ = *f; continue; }\n        f++;\n        switch (*f) {\n            case 'd': { int v = va_arg(ap, int); unsigned int mag;\n                if (v \u003c 0) { *out++ = '-'; mag = (unsigned int)(-(long)v); }\n                else mag = (unsigned int)v;\n                out += emit_uint(out, mag, 10, false); break; }\n            case 'u': out += emit_uint(out, va_arg(ap, unsigned int), 10, false); break;\n            case 'x': out += emit_uint(out, va_arg(ap, unsigned int), 16, false); break;\n            case 'X': out += emit_uint(out, va_arg(ap, unsigned int), 16, true);  break;\n            case 'c': *out++ = (char)va_arg(ap, int); break;\n            case 's': { const char *sv = va_arg(ap, const char *);\n                if (!sv) sv = \"(null)\";\n                while (*sv) *out++ = *sv++; break; }\n            case '%': *out++ = '%'; break;\n            case '\\0': f--; break;\n            default: *out++ = '%'; *out++ = *f; break;\n        }\n    }\n    *out = '\\0';\n    va_end(ap);\n    return (int)(out - str);\n}", "explanation_ko": "format를 훑다가 '%'를 만나면 지정자에 따라 va_arg로 인자를 꺼내 변환한다. 정수는 emit_uint 헬퍼가 자리수를 역순으로 뽑아 뒤집어 쓴다. %d 음수는 '-'를 먼저 찍고 unsigned로 승격해 자리수를 만든다. 반환값은 쓴 문자 수(널 제외).", "complexity": "O(출력 길이) time, O(1) space", "pitfalls": ["버퍼 크기 미검사 → 오버플로. 실무는 snprintf류로 크기 인자 필수.", "char/short 가변 인자는 int로 승격됨(va_arg(int)).", "포맷 문자열 끝의 잘린 '%' 처리.", "미지원 지정자 처리 방침."], "anduril_context": "힙/전체 printf 없는 환경에서 텔레메트리/로그 문자열 포맷팅."}]}, {"id": "memory", "order": 4, "range": "Q41-55", "icon": "🧠", "title_en": "Memory & Pointers", "title_ko": "메모리 & 포인터", "summary_ko": "mem* 계열 직접 구현(memmove 겹침 안전 포함), 포인터 스왑/문자열 뒤집기, 그리고 const/volatile/함수 포인터 디스패치/정적 메모리 풀/dangling/void*/구조체 패딩/포인터 배열 vs 배열 포인터를 돌아가는 데모로 정리한 임베디드 C 핵심 세트.", "summary_en": "Hand-rolled mem* functions (overlap-safe memmove included), pointer swaps, and runnable demos of const/volatile/function-pointer dispatch/static allocator/dangling/void*/struct padding/pointer-vs-array-pointer.", "anduril_relevance_ko": "드론/자율 시스템 펌웨어는 힙을 거의 안 쓰고 고정 버퍼 위에서 동작한다. DMA/이중버퍼/패킷 재조립에서 memmove 겹침과 정렬, 메모리맵 레지스터/ISR 플래그의 volatile, 명령 디코더의 함수 포인터 테이블, 결정적 정적 할당기가 실무 그 자체다. 면접관은 '왜 unsigned 비교? 왜 뒤에서 복사? 패딩 몇 바이트?'를 근거까지 파고든다.", "concepts": [{"term": "memmove 복사 방향", "ko": "dest>src면 뒤에서부터, dest\u003csrc면 앞에서부터. 겹침 안전의 핵심.", "en": "Copy back-to-front when dest>src, else front-to-back."}, {"term": "memcmp unsigned 비교", "ko": "반드시 unsigned char로 비교해야 0x80 vs 0x01 부호가 맞다.", "en": "Compare as unsigned char so byte sign is correct."}, {"term": "const 위치", "ko": "const int*=값 읽기전용, int* const=포인터 고정. * 기준 좌/우.", "en": "pointer-to-const vs const-pointer; const left/right of *."}, {"term": "volatile", "ko": "매 접근 실제 메모리 재로드. HW 레지스터/ISR 플래그. 원자성은 보장 안 함.", "en": "Forces re-read each access; not atomicity."}, {"term": "함수 포인터 디스패치", "ko": "typedef한 함수 포인터 배열로 O(1) 분기. 인덱스 범위 검사 필수.", "en": "Function-pointer table for O(1) branch; bounds-check the index."}, {"term": "정적 풀 할당기", "ko": "블록 헤더+first-fit+split+coalesce. 정렬 필수. 결정적 할당.", "en": "Header+first-fit+split+coalesce over a fixed pool."}, {"term": "dangling 방어", "ko": "free 후 포인터를 NULL로. 지역변수 주소 반환 금지.", "en": "NULL the pointer after free; never return local addresses."}, {"term": "구조체 패딩", "ko": "멤버는 정렬 경계에, 큰 멤버부터 두면 패딩 최소.", "en": "Members align to size; order big-to-small to shrink padding."}], "study_note_md": "# 04. 메모리 & 포인터 (Memory & Pointers) — Q41–55 🧠\n\n> Anduril 펌웨어 인터뷰의 **가장 기초이자 가장 자주 파고드는** 영역.\n> `mem*` 계열 직접 구현, 포인터 조작, 그리고 `const`/`volatile`/함수 포인터/\n> 정적 할당기 같은 **임베디드 C 정통 개념**을 \"돌아가는 데모 + 정확한 설명\"으로 정리한다.\n>\n> 빌드: `cc -std=c11 -Wall -Wextra solutions/04_memory.c -o /tmp/andb_memory && /tmp/andb_memory`\n\n---\n\n## 왜 이 주제가 Anduril에서 중요한가\n\n- 드론/자율 시스템 펌웨어는 **힙을 거의 안 쓰고** 고정 버퍼 위에서 돈다 → `memcpy/memmove`,\n  정적 풀 할당기, 정렬(alignment)이 실무 그 자체.\n- **DMA 버퍼, 이중 버퍼(ping-pong), 패킷 재조립**에서 `memmove` 겹침 처리와 정렬은 단골.\n- **메모리맵 레지스터/ISR 공유 플래그**는 `volatile` 없이는 최적화로 사라진다 → 버그.\n- 명령 디코더/프로토콜 핸들러는 **함수 포인터 디스패치 테이블**로 짠다.\n- 면접관은 \"동작\"에서 멈추지 않고 **왜 unsigned로 비교? 왜 뒤에서부터 복사? 패딩은 몇 바이트?**\n  를 계속 파고든다. 근거를 말로 설명할 수 있어야 한다.\n\n---\n\n## mem* 계열 — 구현 핵심\n\n| 함수 | 한 줄 요약 | 반드시 짚을 것 |\n|------|-----------|---------------|\n| `my_memset` | n바이트를 `(unsigned char)c`로 채움 | `c`는 하위 1바이트만. `void*`→`unsigned char*` 캐스팅 |\n| `my_memcpy` | 겹침 **미보장** 복사 | `restrict`로 non-overlap 계약. dest 반환 |\n| `my_memmove` | 겹쳐도 안전 | **dest>src면 뒤에서부터**, dest\u003csrc면 앞에서부터 |\n| `my_memcmp` | 첫 불일치 부호 | **반드시 unsigned char로 비교** (0x80 vs 0x01) |\n| `my_memchr` | 첫 바이트 위치 | 못 찾으면 NULL. const 벗겨 반환 |\n\n### memmove 방향 결정 — 이게 핵심 함정\n\n```c\nvoid *my_memmove(void *dest, const void *src, size_t n) {\n    unsigned char *d = dest;\n    const unsigned char *s = src;\n    if (d == s || n == 0) return dest;\n    if (d \u003c s) {                       // 앞→뒤: dest가 src보다 앞이면 안전\n        for (size_t i = 0; i \u003c n; ++i) d[i] = s[i];\n    } else {                           // 뒤→앞: dest가 src 뒤와 겹칠 때 원본 보존\n        for (size_t i = n; i > 0; --i) d[i-1] = s[i-1];\n    }\n    return dest;\n}\n```\n\n- `memcpy`로 겹친 영역을 복사하면 **UB**. 실제로 뒤쪽이 먼저 덮여 원본이 깨진다.\n- \"왜 memcpy는 restrict인가?\" → 컴파일러가 겹침 없다고 가정하고 벡터화/재정렬 최적화를 하기 때문.\n\n### memcmp 부호 함정\n\n```c\nreturn (int)a[i] - (int)b[i];   // a,b는 unsigned char*. signed char면 0x80이 음수가 됨\n```\n\n---\n\n## 개념 문제 — 데모로 이해하기\n\n### 48. `const` 위치별 의미 (오른쪽→왼쪽으로 읽기)\n\n```c\nconst int *p;        // p가 가리키는 int는 읽기전용. p는 재지정 가능.   (pointer-to-const)\nint * const p;       // p 자체가 const. *p는 수정 가능, p 재지정 불가.  (const pointer)\nconst int * const p; // 둘 다 불가.\n```\n\n- 읽는 법: `const` 왼쪽에 타입이 있으면 그 값이 const, `*` 오른쪽에 `const`면 포인터가 const.\n- 임베디드에서 `const volatile uint32_t *` = **읽기전용 상태 레지스터**(내가 못 쓰지만 HW가 바꿈).\n\n### 49. `volatile` — HW 레지스터 / ISR / 폴링\n\n```c\nbool wait_ready(volatile const uint32_t *status, uint32_t mask, int max_iters) {\n    for (int i = 0; i \u003c max_iters; ++i)\n        if (*status & mask) return true;   // volatile: 매 반복 실제 메모리 재로드\n    return false;\n}\n```\n\n- `volatile` 없으면 컴파일러가 `*status`를 **한 번만 읽고 레지스터에 캐싱** → 무한 루프 or 값 안 바뀜.\n- 쓰는 곳: ① 메모리맵 주변장치 레지스터, ② ISR과 main이 공유하는 플래그, ③ 하드웨어가 바꾸는 메모리.\n- ⚠️ `volatile`은 **원자성/메모리 순서를 보장하지 않는다**. 멀티코어 동기화는 atomic/배리어가 필요.\n  (single-writer ISR 플래그 정도에만 안전.)\n\n### 50. 함수 포인터 디스패치 테이블\n\n```c\ntypedef int32_t (*alu_fn_t)(int32_t, int32_t);\nint32_t dispatch(uint8_t opcode, int32_t a, int32_t b) {\n    static const alu_fn_t table[] = { op_add, op_sub, op_mul, op_and };\n    if (opcode >= sizeof table / sizeof table[0]) return INT32_MIN;  // 범위 방어\n    return table[opcode](a, b);\n}\n```\n\n- `switch`보다 확장성 좋고 O(1) 분기. 명령 디코더/프로토콜 커맨드 핸들러 패턴.\n- **반드시 인덱스 범위 체크** — 안 하면 임의 코드 실행/크래시.\n\n### 51. 정적 메모리 풀 malloc/free\n\n- 아이디어: `static uint8_t pool[N]` 위에 **블록 헤더(size, used, next)** + first-fit + split + free 시 인접 병합(coalesce).\n- 왜? 임베디드는 힙 파편화/비결정성을 싫어함. 정적 풀은 **결정적**이고 컴파일 타임에 크기 확정.\n- 함정: **정렬**(payload를 8/16바이트 경계로), split 최소 블록 크기, free 시 coalesce 안 하면 파편화.\n\n### 52. Dangling pointer (허상 포인터)\n\n```c\nvoid safe_free(void **pp) {       // free 후 즉시 NULL 로 → 이후 사용/이중free 차단\n    if (!pp || !*pp) return;\n    free(*pp);\n    *pp = NULL;\n}\n```\n\n- 원인: ① `free` 후 그 포인터 사용, ② **지역변수 주소 반환**, ③ 이중 free.\n- 방어: free 즉시 NULL, 소유권 명확히, 지역변수 주소 절대 반환 금지.\n\n### 53. `void*` — 타입 소거(generic)\n\n```c\nvoid generic_swap(void *a, void *b, size_t size) {\n    unsigned char *pa = a, *pb = b;\n    for (size_t i = 0; i \u003c size; ++i) { unsigned char t = pa[i]; pa[i] = pb[i]; pb[i] = t; }\n}\n```\n\n- `void*`는 타입 정보를 버린 \"주소만\". 크기를 따로 넘겨줘야 함(`qsort` 시그니처가 그 예).\n- 안전 규칙: **정확한 원래 타입으로만 다시 캐스팅**. `void*` 산술은 표준 C에서 불가(GCC 확장뿐).\n\n### 54. 구조체 패딩 / 정렬\n\n```c\nstruct Unpacked  { uint8_t a; uint32_t b; uint8_t c; }; // 1 +3pad +4 +1 +3pad = 12\nstruct Reordered { uint32_t b; uint8_t a; uint8_t c; }; // 4 +1 +1 +2pad       = 8\n```\n\n- 각 멤버는 **자기 크기(정렬 요구)의 배수 주소**에 놓임 → 사이/끝에 padding.\n- 구조체 전체 크기는 **가장 큰 멤버 정렬의 배수**(배열로 놓을 때 정렬 유지).\n- 최적화: **큰 멤버부터 배치**하면 패딩 최소. 와이어 포맷은 `#pragma pack`/직렬화로 강제(단, 정렬 안 된 접근은 일부 MCU에서 fault).\n\n### 55. 포인터 배열 vs 배열 포인터\n\n```c\nint *pa[4];      // 포인터 4개를 원소로 갖는 \"배열\"        (array of pointers)\nint (*pp)[4];    // \"int[4] 배열 전체\"를 가리키는 \"포인터\"  (pointer to array)\n```\n\n- `int (*pp)[4] = &arr;` 이면 `(*pp)[i]`로 접근. `pp+1`은 **16바이트**(int[4] 하나) 점프.\n- 문자열 테이블(`char *argv[]`)이 대표적 포인터 배열. 2D 배열 파라미터 전달엔 배열 포인터.\n\n---\n\n## 인터뷰 팔로업 (실제로 자주 나오는 것)\n\n- \"`memcpy`와 `memmove` 차이? 언제 어느 걸?\" → 겹침 가능성 있으면 무조건 `memmove`.\n- \"`memcpy`를 워드 단위로 최적화하려면?\" → 정렬 확인 후 `uint32_t/uint64_t` 단위 복사 + 잔여 바이트 처리.\n- \"`volatile`이 스레드 동기화에 충분한가?\" → **아니다.** atomic/뮤텍스/배리어 필요.\n- \"이 구조체 `sizeof`는?\" → 멤버 정렬 규칙으로 손으로 계산 시연.\n- \"정적 할당기에서 파편화를 어떻게 줄이나?\" → coalesce, size class, 고정 블록 풀.\n- \"dangling을 어떻게 예방?\" → free 후 NULL, 소유권 규칙, 지역 주소 반환 금지, sanitizer(ASan).\n\n## 자주 나오는 버그 / 함정 체크리스트\n\n- [ ] `memcmp`를 `signed char`로 비교 (부호 뒤집힘)\n- [ ] `memmove`에서 방향 안 나눔 (겹침 시 데이터 손상)\n- [ ] `memset`의 `c`를 int 전체로 씀 (하위 1바이트만 유효)\n- [ ] 디스패치 테이블 **인덱스 범위 미검사**\n- [ ] ISR 공유 플래그에 `volatile` 누락\n- [ ] free 후 포인터 재사용 / 이중 free\n- [ ] 구조체 패딩을 무시하고 `sizeof` 대신 멤버 합으로 계산\n- [ ] `n == 0` / `NULL` 인자 미방어\n", "problems": [{"num": 41, "slug": "my_memset", "title_ko": "my_memset 구현", "title_en": "Implement my_memset", "difficulty": "easy", "tags": ["mem*", "byte-fill"], "prompt_ko": "s의 앞 n바이트를 (unsigned char)c 값으로 채우고 s를 반환하라.", "prompt_en": "Fill the first n bytes of s with (unsigned char)c and return s.", "signature": "void *my_memset(void *s, int c, size_t n)", "examples": [{"in": "my_memset(buf, 0xAA, 4)", "out": "buf = {AA,AA,AA,AA}"}], "hints": ["void*를 unsigned char*로 캐스팅해 바이트 단위로 접근.", "c는 하위 1바이트만 유효 — (unsigned char)c로 잘라 쓴다.", "계약상 dest(s)를 그대로 반환한다."], "solution": "void *my_memset(void *s, int c, size_t n) {\n    unsigned char *p = (unsigned char *)s;\n    unsigned char v = (unsigned char)c;\n    for (size_t i = 0; i \u003c n; ++i) p[i] = v;\n    return s;\n}", "explanation_ko": "메모리는 바이트 배열이므로 unsigned char*로 보고 v를 n번 쓴다. c를 int로 그대로 쓰면 안 되고 하위 1바이트만 유효하다는 점이 포인트.", "complexity": "O(n) time, O(1) space", "pitfalls": ["c 전체를 쓰려 함 (하위 1바이트만 유효)", "n==0/NULL 미고려", "반환값을 void로 두어 dest 반환 계약 위반"], "anduril_context": "DMA/센서 버퍼를 0 또는 패턴으로 초기화, 패킷 페이로드 클리어."}, {"num": 42, "slug": "my_memcpy", "title_ko": "my_memcpy 구현", "title_en": "Implement my_memcpy", "difficulty": "easy", "tags": ["mem*", "copy", "restrict"], "prompt_ko": "src의 n바이트를 dest로 복사(영역 겹침 미보장)하고 dest를 반환하라.", "prompt_en": "Copy n bytes from src to dest (no overlap) and return dest.", "signature": "void *my_memcpy(void *restrict dest, const void *restrict src, size_t n)", "examples": [{"in": "my_memcpy(dst, \"abcdef\", 4)", "out": "dst[0..3] = \"abcd\""}], "hints": ["바이트 단위로 앞에서부터 복사.", "restrict = dest/src가 겹치지 않는다는 약속(최적화 허용).", "dest 반환."], "solution": "void *my_memcpy(void *restrict dest, const void *restrict src, size_t n) {\n    unsigned char *d = (unsigned char *)dest;\n    const unsigned char *s = (const unsigned char *)src;\n    for (size_t i = 0; i \u003c n; ++i) d[i] = s[i];\n    return dest;\n}", "explanation_ko": "겹침이 없다고 가정하므로 앞에서부터 단순 복사. restrict 덕분에 컴파일러가 벡터화 등 공격적 최적화를 할 수 있다.", "complexity": "O(n) time, O(1) space", "pitfalls": ["겹치는 영역에 memcpy 사용 → UB", "src를 const로 안 받음", "워드 정렬 최적화 시 잔여 바이트 처리 누락"], "anduril_context": "정렬된 프레임/레지스터 블록을 이중 버퍼로 옮길 때."}, {"num": 43, "slug": "my_memmove", "title_ko": "my_memmove 구현 (겹침 안전)", "title_en": "Implement my_memmove (overlap-safe)", "difficulty": "medium", "tags": ["mem*", "overlap", "copy-direction"], "prompt_ko": "영역이 겹쳐도 올바르게 n바이트를 복사하라. dest>src면 뒤에서부터, dest\u003csrc면 앞에서부터.", "prompt_en": "Copy n bytes correctly even when regions overlap.", "signature": "void *my_memmove(void *dest, const void *src, size_t n)", "examples": [{"in": "buf=\"abcdef\"; my_memmove(buf+2, buf, 4)", "out": "\"ababcd\""}], "hints": ["겹치면 복사 방향이 결과를 좌우한다.", "dest\u003csrc: 앞→뒤가 안전. dest>src: 뒤→앞이 안전.", "dest==src 또는 n==0이면 조기 반환."], "solution": "void *my_memmove(void *dest, const void *src, size_t n) {\n    unsigned char *d = (unsigned char *)dest;\n    const unsigned char *s = (const unsigned char *)src;\n    if (d == s || n == 0) return dest;\n    if (d \u003c s) { for (size_t i = 0; i \u003c n; ++i) d[i] = s[i]; }\n    else       { for (size_t i = n; i > 0; --i) d[i-1] = s[i-1]; }\n    return dest;\n}", "explanation_ko": "dest가 src보다 앞이면 앞에서 복사해도 아직 안 읽은 뒤쪽 원본이 안전. dest가 뒤면 뒤에서부터 복사해야 아직 안 읽은 앞쪽 원본이 안전하다. 방향을 나누는 게 핵심.", "complexity": "O(n) time, O(1) space", "pitfalls": ["방향 분기 없이 항상 앞에서 복사 → 겹침 시 손상", "포인터 대소 비교를 서로 다른 객체에 적용", "n==0 미처리"], "anduril_context": "링버퍼 재정렬, 인플레이스 프레임 시프트, 패킷 헤더 스트립."}, {"num": 44, "slug": "my_memcmp", "title_ko": "my_memcmp 구현", "title_en": "Implement my_memcmp", "difficulty": "easy", "tags": ["mem*", "compare", "unsigned"], "prompt_ko": "앞 n바이트를 unsigned char로 비교해 첫 불일치의 부호(\u003c0/0/>0)를 반환하라.", "prompt_en": "Compare n bytes as unsigned char; return the sign of the first difference.", "signature": "int my_memcmp(const void *s1, const void *s2, size_t n)", "examples": [{"in": "my_memcmp(\"abc\", \"abd\", 3)", "out": "\u003c 0 (음수)"}], "hints": ["반드시 unsigned char로 비교해야 부호가 정확하다.", "첫 불일치에서 즉시 차이를 반환.", "끝까지 같으면 0."], "solution": "int my_memcmp(const void *s1, const void *s2, size_t n) {\n    const unsigned char *a = (const unsigned char *)s1;\n    const unsigned char *b = (const unsigned char *)s2;\n    for (size_t i = 0; i \u003c n; ++i)\n        if (a[i] != b[i]) return (int)a[i] - (int)b[i];\n    return 0;\n}", "explanation_ko": "signed char로 비교하면 0x80(-128) 같은 값이 음수가 되어 부호가 뒤집힌다. unsigned char로 승격 후 빼면 표준이 요구하는 부호가 나온다.", "complexity": "O(n) time, O(1) space", "pitfalls": ["signed char 비교로 부호 뒤집힘", "차이 대신 -1/1 하드코딩", "n==0 시 0 반환 안 함"], "anduril_context": "체크섬/매직바이트 비교, 설정 블록 동일성 검사."}, {"num": 45, "slug": "my_memchr", "title_ko": "my_memchr 구현", "title_en": "Implement my_memchr", "difficulty": "easy", "tags": ["mem*", "search"], "prompt_ko": "앞 n바이트에서 (unsigned char)c가 처음 나오는 위치의 포인터를 반환하고, 없으면 NULL.", "prompt_en": "Return pointer to first (unsigned char)c within n bytes, else NULL.", "signature": "void *my_memchr(const void *s, int c, size_t n)", "examples": [{"in": "my_memchr(\"abcabc\", 'b', 6)", "out": "&s[1]"}], "hints": ["바이트 단위로 스캔.", "c는 (unsigned char)로 비교.", "못 찾으면 NULL, 찾으면 const를 벗겨 void*로 반환."], "solution": "void *my_memchr(const void *s, int c, size_t n) {\n    const unsigned char *p = (const unsigned char *)s;\n    unsigned char v = (unsigned char)c;\n    for (size_t i = 0; i \u003c n; ++i)\n        if (p[i] == v) return (void *)(p + i);\n    return NULL;\n}", "explanation_ko": "strchr과 달리 NUL에서 멈추지 않고 정확히 n바이트만 본다. 이진 데이터(프레임 구분자 탐색)에 적합.", "complexity": "O(n) time, O(1) space", "pitfalls": ["NUL에서 멈춤(그건 strchr)", "범위 n을 넘어 탐색", "const 반환 캐스팅 누락으로 경고"], "anduril_context": "바이트 스트림에서 프레임 시작/구분자(sync byte) 탐색."}, {"num": 46, "slug": "swap_int", "title_ko": "포인터로 정수 스왑", "title_en": "Swap ints via pointers", "difficulty": "easy", "tags": ["pointer", "swap"], "prompt_ko": "포인터로 두 정수를 교환하라. 같은 주소를 넘겨도 안전해야 한다.", "prompt_en": "Swap two ints through pointers; must be alias-safe.", "signature": "void swap_int(int32_t *a, int32_t *b)", "examples": [{"in": "a=1,b=2; swap_int(&a,&b)", "out": "a=2, b=1"}], "hints": ["임시 변수를 쓰는 게 가장 명확·안전.", "XOR 스왑은 a==b일 때 0이 되어 위험.", "a==b면 조기 반환."], "solution": "void swap_int(int32_t *a, int32_t *b) {\n    if (a == b) return;\n    int32_t tmp = *a; *a = *b; *b = tmp;\n}", "explanation_ko": "포인터 역참조로 값 교환. XOR 트릭은 성능 이점도 없고 aliasing에서 버그가 나므로 임시변수가 정석.", "complexity": "O(1) time, O(1) space", "pitfalls": ["XOR 스왑에서 a==b 미처리로 0됨", "NULL 미방어", "값이 아닌 포인터를 교환"], "anduril_context": "이중 버퍼 포인터 스왑(ping-pong), 정렬 루프."}, {"num": 47, "slug": "reverse_string", "title_ko": "문자열 in-place 뒤집기", "title_en": "Reverse string in place", "difficulty": "easy", "tags": ["pointer", "string", "two-pointer"], "prompt_ko": "NUL 종료 문자열을 추가 버퍼 없이 제자리에서 뒤집어라.", "prompt_en": "Reverse a NUL-terminated string in place.", "signature": "void reverse_string(char *s)", "examples": [{"in": "\"hello\"", "out": "\"olleh\""}], "hints": ["먼저 길이를 구한다.", "양끝 투 포인터로 교환하며 가운데로 수렴.", "빈 문자열/NULL/한 글자 엣지케이스."], "solution": "void reverse_string(char *s) {\n    if (s == NULL) return;\n    size_t len = 0; while (s[len]) ++len;\n    for (size_t i = 0, j = (len ? len-1 : 0); i \u003c j; ++i, --j) {\n        char t = s[i]; s[i] = s[j]; s[j] = t;\n    }\n}", "explanation_ko": "투 포인터로 i\u003cj 동안 교환. len==0일 때 len-1 언더플로우(size_t는 unsigned)를 피하려 j 초기화를 방어한다.", "complexity": "O(n) time, O(1) space", "pitfalls": ["len==0에서 len-1 언더플로우(거대한 j)", "NUL을 포함해 뒤집음", "NULL 미방어"], "anduril_context": "엔디안 변환 보조, 표시용 문자열 처리."}, {"num": 48, "slug": "const_pointer", "title_ko": "const 위치별 의미 실증", "title_en": "const int* vs int* const", "difficulty": "medium", "tags": ["concept", "const", "pointer"], "prompt_ko": "const int*(값 읽기전용), int* const(포인터 고정), const int* const(둘 다)의 차이를 코드로 실증하라. int* const로 값 수정, const int*로 재지정을 보이고 합(49)을 반환.", "prompt_en": "Demonstrate the three const placements; return 49.", "signature": "int demo_pointer_const(void)", "examples": [{"in": "demo_pointer_const()", "out": "49"}], "hints": ["오른쪽→왼쪽으로 선언을 읽는다.", "int* const cp=&x; *cp=42; 는 OK, cp=&y;는 컴파일 에러.", "const int* pc=&x; pc=&y;는 OK, *pc=1;은 에러."], "solution": "int demo_pointer_const(void) {\n    int x = 10, y = 7;\n    int *const cp = &x;   // 포인터 고정, *cp 수정 가능\n    *cp = 42;\n    const int *pc = &x;   // 값 읽기전용, 재지정 가능\n    pc = &y;\n    return *cp + *pc;     // 42 + 7 = 49\n}", "explanation_ko": "const가 * 왼쪽이면 가리키는 값이 const, * 오른쪽이면 포인터가 const. int* const는 값 수정 가능/재지정 불가, const int*는 그 반대.", "complexity": "O(1) time, O(1) space", "pitfalls": ["선언 읽는 방향 혼동", "const volatile 조합(읽기전용 HW 레지스터)을 놓침", "top-level vs low-level const 혼동"], "anduril_context": "읽기전용 상태 레지스터는 const volatile uint32_t*, 고정 LUT 테이블은 const 포인터."}, {"num": 49, "slug": "volatile_poll", "title_ko": "volatile — HW 레지스터 폴링", "title_en": "volatile HW register poll", "difficulty": "medium", "tags": ["concept", "volatile", "ISR", "hardware"], "prompt_ko": "mask 비트가 set될 때까지 최대 max_iters회 status를 폴링한다. set이면 true, timeout이면 false. status는 volatile로 매 접근 재로드.", "prompt_en": "Poll *status until (*status & mask) or timeout; volatile forces re-read.", "signature": "bool wait_ready(volatile const uint32_t *status, uint32_t mask, int max_iters)", "examples": [{"in": "ready=0x1; wait_ready(&ready,0x1,10)", "out": "true"}], "hints": ["volatile 없으면 컴파일러가 *status를 캐싱해 무한루프.", "매 반복 (*status & mask) 검사.", "NULL이면 false."], "solution": "bool wait_ready(volatile const uint32_t *status, uint32_t mask, int max_iters) {\n    if (status == NULL) return false;\n    for (int i = 0; i \u003c max_iters; ++i)\n        if ((*status & mask) != 0u) return true;\n    return false;\n}", "explanation_ko": "volatile은 '값이 코드 밖(HW/ISR)에서 바뀔 수 있으니 매번 실제 메모리를 읽어라'는 지시. 없으면 최적화가 첫 읽기값을 레지스터에 고정해 버린다. 단, 원자성/순서는 보장하지 않는다.", "complexity": "O(max_iters) time, O(1) space", "pitfalls": ["volatile 누락 → 최적화로 캐싱/무한루프", "volatile을 스레드 동기화용으로 오해(원자성 X)", "타임아웃 없이 무한 폴링"], "anduril_context": "메모리맵 주변장치 상태 비트 폴링, ISR-main 공유 플래그, DMA 완료 대기."}, {"num": 50, "slug": "dispatch_table", "title_ko": "함수 포인터 디스패치 테이블", "title_en": "Function-pointer dispatch table", "difficulty": "medium", "tags": ["concept", "function-pointer", "dispatch"], "prompt_ko": "opcode(0=ADD,1=SUB,2=MUL,3=AND)로 ALU 함수를 골라 a,b에 적용. 함수 포인터 배열 사용, 잘못된 opcode는 INT32_MIN.", "prompt_en": "Dispatch a,b through a function-pointer table indexed by opcode.", "signature": "int32_t dispatch(uint8_t opcode, int32_t a, int32_t b)", "examples": [{"in": "dispatch(2,3,4)", "out": "12"}, {"in": "dispatch(99,1,1)", "out": "INT32_MIN"}], "hints": ["typedef int32_t (*alu_fn_t)(int32_t,int32_t);", "static const 배열에 함수들을 나열.", "인덱스 범위를 반드시 검사."], "solution": "typedef int32_t (*alu_fn_t)(int32_t, int32_t);\nstatic int32_t op_add(int32_t a,int32_t b){return a+b;}\nstatic int32_t op_sub(int32_t a,int32_t b){return a-b;}\nstatic int32_t op_mul(int32_t a,int32_t b){return a*b;}\nstatic int32_t op_and(int32_t a,int32_t b){return a&b;}\nint32_t dispatch(uint8_t opcode, int32_t a, int32_t b) {\n    static const alu_fn_t table[] = { op_add, op_sub, op_mul, op_and };\n    if (opcode >= sizeof table / sizeof table[0]) return INT32_MIN;\n    return table[opcode](a, b);\n}", "explanation_ko": "switch 대신 함수 포인터 배열로 O(1) 분기. 명령/커맨드 핸들러 확장이 쉽다. 인덱스 범위 검사를 빼면 배열 밖 함수 포인터 호출로 임의 실행/크래시.", "complexity": "O(1) time, O(1) space", "pitfalls": ["인덱스 범위 미검사 → 임의 함수 포인터 호출", "테이블 크기를 하드코딩(sizeof로 계산할 것)", "함수 시그니처 불일치"], "anduril_context": "프로토콜 커맨드 핸들러, 상태머신 액션 테이블, opcode 디코더."}, {"num": 51, "slug": "static_pool", "title_ko": "정적 메모리 풀 malloc/free", "title_en": "Static memory pool malloc/free", "difficulty": "hard", "tags": ["concept", "allocator", "static", "alignment"], "prompt_ko": "힙 없이 static 배열 위에서 first-fit 할당기를 구현하라. 블록 헤더(size/used/next)+split+free 시 인접 병합(coalesce). size==0/공간부족은 NULL, free(NULL)은 no-op.", "prompt_en": "First-fit allocator over a fixed static pool; free coalesces adjacent blocks.", "signature": "void *static_malloc(size_t size); void static_free(void *ptr)", "examples": [{"in": "p=static_malloc(100)", "out": "풀 내부 정렬된 포인터"}, {"in": "static_malloc(POOL_SIZE*2)", "out": "NULL"}], "hints": ["static uint8_t pool[N]을 하나의 free 블록으로 초기화.", "요청 크기를 8바이트로 정렬, 남으면 split.", "free는 used=false 후 인접 free 블록을 coalesce."], "solution": "#define POOL_SIZE 1024u\n#define ALIGN 8u\ntypedef struct blk { size_t size; bool used; struct blk *next; } blk_t;\nstatic _Alignas(16) uint8_t g_pool[POOL_SIZE];\nstatic blk_t *g_head = NULL;\nstatic size_t align_up(size_t v,size_t a){return (v+(a-1))&~(a-1);}\nstatic void pool_init(void){ g_head=(blk_t*)(void*)g_pool; g_head->size=POOL_SIZE-sizeof(blk_t); g_head->used=false; g_head->next=NULL; }\nvoid *static_malloc(size_t size){\n    if(!g_head) pool_init();\n    if(size==0) return NULL;\n    size=align_up(size,ALIGN);\n    for(blk_t *b=g_head;b;b=b->next){\n        if(b->used||b->size\u003csize) continue;\n        if(b->size>=size+sizeof(blk_t)+ALIGN){\n            blk_t *nb=(blk_t*)(void*)((uint8_t*)b+sizeof(blk_t)+size);\n            nb->size=b->size-size-sizeof(blk_t); nb->used=false; nb->next=b->next;\n            b->size=size; b->next=nb;\n        }\n        b->used=true; return (uint8_t*)b+sizeof(blk_t);\n    }\n    return NULL;\n}\nstatic void pool_coalesce(void){\n    for(blk_t *b=g_head;b&&b->next;){\n        if(!b->used&&!b->next->used){ b->size+=sizeof(blk_t)+b->next->size; b->next=b->next->next; }\n        else b=b->next;\n    }\n}\nvoid static_free(void *ptr){\n    if(!ptr) return;\n    blk_t *b=(blk_t*)(void*)((uint8_t*)ptr-sizeof(blk_t));\n    b->used=false; pool_coalesce();\n}", "explanation_ko": "풀 전체를 하나의 free 블록으로 시작. malloc은 first-fit으로 충분한 free 블록을 찾아 필요시 split. free는 헤더를 되짚어 used를 내리고 인접 free 블록을 병합해 파편화를 줄인다. 정렬(_Alignas, align_up)이 핵심.", "complexity": "O(blocks) per malloc/free, O(1) extra space", "pitfalls": ["정렬 무시로 unaligned 접근 fault", "split 최소 블록 미검사로 헤더가 payload보다 커짐", "free 시 coalesce 누락 → 파편화", "free(NULL)/이중free 미방어"], "anduril_context": "힙 금지 환경의 결정적 할당, 패킷 풀/버퍼 풀, 부트로더."}, {"num": 52, "slug": "dangling_pointer", "title_ko": "Dangling pointer 방어", "title_en": "Dangling pointer defense", "difficulty": "easy", "tags": ["concept", "memory-safety", "double-free"], "prompt_ko": "**pp를 받아 실제 free 후 *pp=NULL로 만들어 dangling/이중free를 차단하는 안전 idiom을 구현하라.", "prompt_en": "free(*pp) then set *pp=NULL to prevent dangling/double-free.", "signature": "void safe_free(void **pp)", "examples": [{"in": "safe_free(&p)", "out": "p == NULL (free됨)"}], "hints": ["pp와 *pp의 NULL을 방어.", "free 후 *pp=NULL.", "이후 이중 호출도 no-op이 되어야 함."], "solution": "void safe_free(void **pp) {\n    if (pp == NULL || *pp == NULL) return;\n    free(*pp);\n    *pp = NULL;\n}", "explanation_ko": "dangling은 해제된 메모리를 가리키는 포인터. free 직후 NULL로 만들면 이후 사용은 즉시 NULL 크래시(디버깅 쉬움)로 드러나고 이중 free도 막힌다. 포인터의 포인터를 받아야 호출자 변수를 실제로 NULL로 바꿀 수 있다.", "complexity": "O(1) time, O(1) space", "pitfalls": ["값 포인터만 받으면 호출자 변수가 안 바뀜", "지역변수 주소 반환(또 다른 dangling 원인)", "free 후 재사용/이중 free"], "anduril_context": "동적 자원 해제 규칙, RAII 없는 C에서의 소유권 관리."}, {"num": 53, "slug": "generic_swap", "title_ko": "void* 제네릭 swap", "title_en": "void* generic swap", "difficulty": "medium", "tags": ["concept", "void-pointer", "generic"], "prompt_ko": "임의 타입/크기 객체를 size 바이트만큼 바이트 단위로 교환하라(void* 사용).", "prompt_en": "Swap two objects of arbitrary size byte-by-byte via void*.", "signature": "void generic_swap(void *a, void *b, size_t size)", "examples": [{"in": "generic_swap(&x,&y,sizeof x) (int,double,struct)", "out": "두 객체 값 교환"}], "hints": ["void*를 unsigned char*로 캐스팅.", "임시버퍼 없이 바이트별로 세 줄 교환.", "a==b/NULL 방어."], "solution": "void generic_swap(void *a, void *b, size_t size) {\n    if (a == b || a == NULL || b == NULL) return;\n    unsigned char *pa = (unsigned char *)a, *pb = (unsigned char *)b;\n    for (size_t i = 0; i \u003c size; ++i) {\n        unsigned char t = pa[i]; pa[i] = pb[i]; pb[i] = t;\n    }\n}", "explanation_ko": "void*는 타입을 지운 '주소만'이라 크기를 따로 받아야 한다(qsort 시그니처와 같은 발상). 바이트 단위 교환이면 int/double/struct 무엇이든 동작한다.", "complexity": "O(size) time, O(1) space", "pitfalls": ["void* 산술(표준 C 아님)", "고정 크기 임시버퍼로 큰 객체 오버플로", "겹치는 a,b(같은 객체) 미고려"], "anduril_context": "제네릭 자료구조(정렬/큐)의 요소 교환, 타입 무관 유틸."}, {"num": 54, "slug": "struct_padding", "title_ko": "구조체 패딩/정렬", "title_en": "Struct padding / alignment", "difficulty": "medium", "tags": ["concept", "alignment", "padding", "layout"], "prompt_ko": "멤버 순서가 sizeof를 바꾼다. Unpacked{u8,u32,u8}의 sizeof(12), Reordered{u32,u8,u8}의 sizeof(8), offsetof(Unpacked,b)(4)를 반환하는 함수를 구현하라.", "prompt_en": "Return sizeof/offsetof values that reflect padding/alignment rules.", "signature": "size_t sizeof_unpacked(void); size_t sizeof_reordered(void); size_t offset_of_b_unpacked(void)", "examples": [{"in": "sizeof_unpacked()", "out": "12"}, {"in": "sizeof_reordered()", "out": "8"}], "hints": ["각 멤버는 자기 정렬(크기)의 배수 주소에 놓인다.", "구조체 크기는 최대 멤버 정렬의 배수로 올림.", "sizeof/offsetof를 직접 반환하면 됨."], "solution": "struct Unpacked  { uint8_t a; uint32_t b; uint8_t c; }; // 1+3+4+1+3 = 12\nstruct Reordered { uint32_t b; uint8_t a; uint8_t c; }; // 4+1+1+2  = 8\nsize_t sizeof_unpacked(void)      { return sizeof(struct Unpacked); }\nsize_t sizeof_reordered(void)     { return sizeof(struct Reordered); }\nsize_t offset_of_b_unpacked(void) { return offsetof(struct Unpacked, b); }", "explanation_ko": "u8,u32,u8 순이면 a 뒤 3바이트 패딩(b를 4정렬), c 뒤 3바이트 패딩(구조체를 4의 배수로)으로 12. 큰 멤버부터(u32,u8,u8) 두면 끝 2바이트 패딩만 남아 8. 순서만 바꿔 33% 절약.", "complexity": "O(1) time, O(1) space", "pitfalls": ["멤버 합으로 크기 계산(패딩 무시)", "packed 구조체의 unaligned 접근 fault(일부 MCU)", "ABI/컴파일러별 차이 무시"], "anduril_context": "와이어 프로토콜/레지스터 맵 레이아웃, 메시지 구조체 크기 최적화."}, {"num": 55, "slug": "ptr_array_vs_array_ptr", "title_ko": "포인터 배열 vs 배열 포인터", "title_en": "Pointer array vs array pointer", "difficulty": "medium", "tags": ["concept", "pointer", "array"], "prompt_ko": "int (*p)[4](배열 포인터)로 (*p)[i]를 반환하고, const char *const *arr(NULL 종료 포인터 배열)의 원소 개수를 반환하라.", "prompt_en": "Deref an array-pointer and count a NULL-terminated pointer array.", "signature": "int deref_array_pointer(int (*p)[4], size_t i); size_t count_strings(const char *const *arr)", "examples": [{"in": "arr={10,20,30,40}; deref_array_pointer(&arr,2)", "out": "30"}, {"in": "count_strings({\"IMU\",\"GPS\",\"BARO\",NULL})", "out": "3"}], "hints": ["int (*p)[4]는 int[4] 전체를 가리킴 → (*p)[i].", "int *pa[4]는 포인터 4개의 배열(다른 것).", "NULL 종료 표는 NULL 만날 때까지 카운트."], "solution": "int deref_array_pointer(int (*p)[4], size_t i) {\n    if (p == NULL || i >= 4) return -1;\n    return (*p)[i];\n}\nsize_t count_strings(const char *const *arr) {\n    if (arr == NULL) return 0;\n    size_t n = 0; while (arr[n] != NULL) ++n; return n;\n}", "explanation_ko": "int (*p)[4]는 배열 포인터라 p+1이 16바이트(int[4]) 점프하고 (*p)[i]로 접근. int *pa[4]는 포인터들의 배열(argv 같은 문자열 테이블). 선언에서 ()의 위치가 의미를 가른다.", "complexity": "deref O(1), count O(n)", "pitfalls": ["int *p[4]와 int (*p)[4] 혼동", "괄호 없이 우선순위 오해", "NULL 종료 없는 배열을 카운트(오버런)"], "anduril_context": "센서/명령 이름 테이블(포인터 배열), 2D 배열 파라미터 전달(배열 포인터)."}]}, {"id": "circular_buffer", "order": 5, "range": "Q56-65", "icon": "🔄", "title_en": "Circular / Ring Buffer", "title_ko": "원형 버퍼 (링 버퍼)", "summary_ko": "고정 크기 배열을 논리적으로 원형으로 써서 head(쓰기)·tail(읽기) 두 인덱스로 O(1) push/pop 하는 FIFO. 임베디드 최다 빈출 자료구조로, 핵심은 full/empty 구분(count 필드 / 한 칸 희생 / 자유증가 인덱스)과 동시성(SPSC 무락 ISR↔main, MPMC mutex+condvar)이다.", "summary_en": "A fixed-size array used logically as a circle, giving O(1) FIFO push/pop via a write index (head) and read index (tail). The most common embedded data structure; the real depth lies in distinguishing full vs empty (count field / sacrificed slot / free-running indices) and in concurrency (lock-free SPSC for ISR-to-main, mutex+condvar for MPMC).", "anduril_relevance_ko": "Anduril 펌웨어 인터뷰에서 링 버퍼는 최다 빈출 자료구조로 명시된다(회사 후기 다수). UART/RS422 로 들어오는 MAVLink 유사 텔레메트리·GPS·IMU 바이트 스트림이 RX ISR(생산자)에서 링 버퍼에 쌓이고 main loop(소비자)가 꺼내 FSM 파서로 프레임을 조립하는 구조가 드론 펌웨어의 표준 파이프라인이다. 400Hz IMU→100Hz 제어 루프처럼 레이트가 다른 producer/consumer 를 디커플링하고, 넘칠 때 덮어쓰기+drop 카운터로 최신 비행 데이터를 보존한다. 온사이트에서는 'volatile 이 왜 필요한가', '무락이 왜 성립하는가', '링크 저하(degraded/contested) 시 버퍼가 어떻게 우아하게 저하되는가(overrun 정책)'까지 파고든다.", "concepts": [{"term": "head / tail", "ko": "head=다음에 쓸 자리(생산자), tail=다음에 읽을 자리(소비자). 끝에서 0으로 되돌아온다(wrap-around).", "en": "head is the next write slot (producer); tail is the next read slot (consumer); both wrap to 0 at the end."}, {"term": "full vs empty", "ko": "head==tail 은 empty·full 둘 다 가능 → 구분법 3가지: ①count 필드 ②한 칸 희생(용량 size-1) ③자유증가 인덱스(count=head-tail).", "en": "head==tail is ambiguous; resolve with a count field, by sacrificing one slot (capacity size-1), or with free-running indices (count = head - tail)."}, {"term": "% vs & mask", "ko": "size 가 2의 거듭제곱이면 (idx & (size-1)) 로 나눗셈(%) 없이 감싼다 — ISR 지연 예산에 유리.", "en": "When size is a power of two, wrap with (idx & (size-1)) instead of modulo, saving a division in the ISR path."}, {"term": "SPSC 무락(lock-free)", "ko": "생산자만 head, 소비자만 tail 을 써서 write-write 경합이 없다 → 락 불필요. ISR↔main 정석. 멀티코어는 acquire/release atomics 필요.", "en": "Producer writes only head, consumer only tail, so there is no write-write contention and no lock is needed; the canonical ISR-to-main pattern. Multicore needs acquire/release atomics."}, {"term": "volatile vs atomic", "ko": "volatile 은 컴파일러의 캐시/재정렬만 막고 원자성·메모리순서는 보장하지 않는다. 멀티코어 무락엔 원자연산/배리어가 필요.", "en": "volatile only blocks compiler caching/reordering; it guarantees neither atomicity nor memory ordering. Lock-free on multicore needs atomics/barriers."}, {"term": "MPMC mutex+condvar", "ko": "다중 생산자/소비자는 mutex 로 임계구역 보호, full/empty 대기는 condition variable. while(조건) cond_wait 로 spurious wakeup 방어.", "en": "Multi-producer/consumer guards the critical section with a mutex and waits on condition variables; use a while loop around cond_wait to survive spurious wakeups."}, {"term": "오버런(overrun) 정책", "ko": "꽉 찼을 때 거부(push false) vs 덮어쓰기(최신 우선, drop 카운터). 데이터 종류마다 다르게.", "en": "On full: reject (push returns false) or overwrite oldest (latest-wins with a drop counter); policy differs per data type."}, {"term": "정적 할당", "ko": "버퍼 저장소를 외부 정적 배열로 받아 heap/malloc 을 피한다 — 임베디드 관례.", "en": "Take storage as an external static array to avoid heap/malloc, per embedded practice."}], "study_note_md": "# 🔄 원형 버퍼 / 링 버퍼 (Circular / Ring Buffer) — Q56~65\n\n> 임베디드 인터뷰에서 **가장 자주 나오는 단일 자료구조**. UART/SPI 수신, 로깅,\n> 센서 스트림, 오디오 DMA — 고정 크기 메모리 위에서 producer/consumer 를 잇는\n> FIFO 는 전부 링 버퍼다. \"구현해봐\"는 기본, 진짜 난이도는 **동시성(ISR ↔ main)**\n> 과 **full/empty 구분**에서 갈린다.\n\n---\n\n## 1. 핵심 아이디어\n\n고정 크기 배열을 **논리적으로 원형**으로 쓴다. 두 인덱스:\n\n- `head` (write / 생산자): 다음에 **쓸** 자리\n- `tail` (read / 소비자): 다음에 **읽을** 자리\n\n인덱스가 끝에 도달하면 0 으로 되돌아온다(**wrap-around**). 그래서 `push`/`pop`\n모두 데이터 이동 없이 **O(1)**. 힙도, memmove 도 없다 — 임베디드에 완벽.\n\n```\nsize = 8\n idx: 0   1   2   3   4   5   6   7\n     [ ] [4] [5] [6] [7] [ ] [ ] [ ]\n          ^tail            ^head\n```\n\n### wrap-around 하는 법\n\n```c\nhead = (head + 1) % size;          // 일반\nhead = (head + 1) & (size - 1);    // size 가 2의 거듭제곱일 때 (빠름)\n```\n\n---\n\n## 2. Full vs Empty — 인터뷰의 핵심 함정\n\n`head == tail` 은 **비었을 때**도 **꽉 찼을 때**도 발생한다. 구분하는 3가지 방법:\n\n| 방법 | full 판정 | empty 판정 | 용량 | 비고 |\n|---|---|---|---|---|\n| **① count 필드** | `count == size` | `count == 0` | `size` | 가장 직관적. 단, count 를 양쪽이 갱신하면 동시성 문제 |\n| **② 한 칸 희생** | `(head+1)%size == tail` | `head == tail` | `size-1` | count 불필요 → **SPSC 무락**에 이상적 |\n| **③ 자유 증가(free-running) 인덱스** | `head-tail == size` | `head == tail` | `size` | head/tail 을 마스킹 안 하고 계속 증가, 접근 시 `& mask`. count 필드 없이 전용량 |\n\n> **면접 답변 팁**: \"count 를 쓰면 간단하지만 SPSC 무락에서는 count 를 양쪽이\n> 써서 경합이 생긴다. 그래서 무락 버전은 한 칸을 희생하거나(②) 자유 증가\n> 인덱스(③)를 쓴다\"고 말하면 깊이가 드러난다.\n\n### ③ 자유 증가 트릭이 왜 안전한가\n\n`head`, `tail` 을 `uint32_t` 로 계속 증가시키고 버퍼 인덱스는 `head & mask`\n로만 계산한다. `count = head - tail` 은 **부호 없는 뺄셈**이라 `head` 가\n2³²에서 랩되어도 정확하다(예: `head=1, tail=0xFFFFFFFF` → `count=2`). 단\n`size \u003c= 2³¹` 이어야 하고 **size 는 2의 거듭제곱**이어야 마스킹이 성립한다.\n\n```c\nbool is_pow2(uint32_t x) { return x && (x & (x - 1)) == 0; }\n```\n\n---\n\n## 3. SPSC 무락(lock-free) — ISR ↔ main 정석 패턴 ⭐\n\n임베디드에서 제일 중요한 그림: **UART RX ISR 이 생산자, main loop 가 소비자.**\n\n```\n   [UART 하드웨어] --IRQ--> [RX ISR: spsc_push()] --ring--> [main: spsc_pop()] --> 파싱\n        생산자 1개                                    소비자 1개\n```\n\n**왜 락이 필요 없나?**\n\n- 생산자(ISR)만 `head` 를 **쓴다**. 소비자(main)만 `tail` 을 **쓴다**.\n- 서로 상대 인덱스는 **읽기만** 한다 → **write-write 경합이 구조적으로 없다.**\n- 그래서 mutex 불필요. ISR 안에서 절대 락을 잡으면 안 되므로(우선순위 역전/\n  데드락) 이 성질이 결정적이다.\n\n**주의 (이식성):**\n\n- **단일코어 베어메탈**: `head`/`tail` 을 `volatile` 로 두고 \"**데이터를 먼저 쓰고\n  그 다음 인덱스를 증가**\" 순서만 지키면 전통적으로 충분하다. (컴파일러 재정렬만\n  막으면 됨. 단일코어라 하드웨어 재정렬로 인한 문제는 없음.)\n- **멀티코어(SMP)**: CPU 메모리 재정렬 때문에 `volatile` 만으로는 부족.\n  **acquire/release 원자연산**(C11 `\u003cstdatomic.h>` 또는 하드웨어 배리어)이 필요.\n  - producer: `head` relaxed load(내 것) → `tail` **acquire** load(상대 것) →\n    데이터 쓰기 → `head` **release** store.\n  - consumer: `tail` relaxed load → `head` **acquire** load → 데이터 읽기 →\n    `tail` **release** store.\n  - release store 는 \"데이터 쓰기가 인덱스 공개보다 먼저 보이도록\" 보장하고,\n    acquire load 는 짝을 이뤄 반대편이 그 순서를 관측하게 한다.\n\n```c\n// producer (한 스레드만)\nuint32_t h = atomic_load_explicit(&q->head, memory_order_relaxed);\nuint32_t t = atomic_load_explicit(&q->tail, memory_order_acquire);\nif (((h + 1) & q->mask) == (t & q->mask)) return false;   // full (한 칸 희생)\nq->buf[h & q->mask] = data;                                // 1) 데이터 먼저\natomic_store_explicit(&q->head, h + 1, memory_order_release); // 2) 인덱스 공개\n```\n\n---\n\n## 4. MPMC — 다중 생산자/소비자 (mutex + condvar)\n\n생산자·소비자가 **여럿**이면 `head`/`tail`/`count` 를 모두 여러 스레드가 갱신 →\n무락 SPSC 트릭이 깨진다. 이때는 정직하게 **mutex 로 임계구역 보호**:\n\n```c\nvoid mpmc_push(mpmc_t *q, uint8_t data) {\n    pthread_mutex_lock(&q->m);\n    while (q->count == q->size)                 // ← if 아니라 while!\n        pthread_cond_wait(&q->not_full, &q->m);\n    q->buf[q->head] = data;\n    q->head = (q->head + 1) % q->size;\n    q->count++;\n    pthread_cond_signal(&q->not_empty);\n    pthread_mutex_unlock(&q->m);\n}\n```\n\n- **`while` (not `if`)**: `pthread_cond_wait` 는 **spurious wakeup**(엉뚱한 깨어남)\n  이 가능하고, 깨어난 뒤 다른 스레드가 먼저 슬롯을 채갔을 수도 있으니 조건을\n  **재확인**해야 한다.\n- `cond_wait` 는 대기 중 mutex 를 **자동으로 놓았다가** 깨어날 때 다시 잡는다.\n- 넣은 뒤 `not_empty` 를 signal, 뺀 뒤 `not_full` 을 signal.\n\n블로킹이 싫으면 락드(locked) but non-blocking `try_push`/`try_pop` 으로 만들 수도\n있고, 진짜 고성능이면 MPMC 무락 큐(예: Michael-Scott, LMAX Disruptor)를 쓰지만\n인터뷰에선 mutex+condvar 로 충분하다.\n\n---\n\n## 5. 오버런(overrun) 정책\n\n버퍼가 꽉 찼는데 새 데이터가 오면?\n\n- **거부(reject)**: `push` 가 false 반환 — 기본. 손실을 상위에서 감지.\n- **덮어쓰기(overwrite)**: 가장 오래된 것을 버리고 `tail` 도 밀기 — 실시간 센서/\n  오디오처럼 \"최신값이 더 중요\"할 때. 오버런 카운터를 두어 몇 개 잃었는지 기록.\n\n> 드론 텔레메트리에서 링크가 느려 버퍼가 넘칠 때: 로그는 덮어쓰기 + drop 카운터,\n> 제어 명령은 거부 후 에러 처리 — **데이터 종류마다 정책이 다르다**는 점을 언급.\n\n---\n\n## 6. 인터뷰 팔로업(follow-up) 대비\n\n- **\"volatile 이 왜 필요?\"** → ISR 이 바꾸는 값을 main 이 레지스터에 캐시하지\n  못하게. 단, `volatile` 은 **원자성·메모리순서를 보장하지 않는다**(멀티코어에선\n  atomics 필요).\n- **\"count 를 안 쓰고 full/empty 구분?\"** → 한 칸 희생(②) 또는 자유 증가(③).\n- **\"인덱스를 왜 % 대신 & mask?\"** → `%` 는 나눗셈(수십 사이클), 2의 거듭제곱이면\n  `& (size-1)` 한 사이클. ISR 지연 예산에 유리.\n- **\"size 가 2의 거듭제곱 아니면?\"** → `%` 로 폴백하거나, 마스킹 변형을 못 씀.\n- **\"버퍼 크기 산정?\"** → 최악 인입률 × 소비자 최대 지연(latency). UART 라면\n  보드레이트·인터럽트 지연·main loop 주기로 계산.\n- **\"멀티코어에서 이 SPSC 안전?\"** → acquire/release 없으면 아니오. 배리어 필요.\n\n---\n\n## 7. 흔한 버그 체크리스트\n\n- [ ] `size == 0` 에서 `% size` → **0으로 나누기**. init 에서 방어.\n- [ ] full 인데 덮어써서 소비자 데이터 손상.\n- [ ] `head==tail` 을 무조건 empty 로 처리 → 꽉 찬 걸 비었다고 오판(count/희생칸 없을 때).\n- [ ] MPMC 에서 `if (count==0) cond_wait` (while 아님) → spurious wakeup 시 빈 큐 pop.\n- [ ] SPSC 에서 `count` 를 양쪽이 갱신 → 경합. (무락이라며 count 쓰면 모순)\n- [ ] 인덱스 증가 후 데이터 쓰기(순서 뒤바뀜) → 소비자가 쓰레기 읽음. **데이터 먼저.**\n- [ ] pop 의 `out`/`cb` NULL 미검사 → 크래시.\n\n---\n\n## 8. 이 문제 세트 (Q56~65)\n\n| # | 함수 | 스타일 | 포인트 |\n|---|---|---|---|\n| 56 | `cb_init` | count 기반 | 초기화, NULL 방어 |\n| 57 | `cb_push` | count 기반 | full 시 거부, wrap-around |\n| 58 | `cb_pop` | count 기반 | FIFO, empty 시 false |\n| 59 | `cb_is_empty` | count 기반 | `count==0` |\n| 60 | `cb_is_full` | count 기반 | `count==size` |\n| 61 | `cb_count` | count 기반 | O(1) 개수 |\n| 62 | `cb_flush` | count 기반 | 인덱스 리셋 |\n| 63 | `cbp2_*` | pow2 마스킹 | 자유 증가 + `& mask`, 전용량 |\n| 64 | `spsc_*` | 무락 SPSC | acquire/release, ISR↔main |\n| 65 | `mpmc_*` | mutex+condvar | while-wait, spurious wakeup |\n\n---\n\n## 9. Anduril / 드론 펌웨어 맥락\n\n- **UART/RS422 수신**: MAVLink 유사 텔레메트리·GPS·IMU 바이트 스트림이 RX ISR\n  로 들어와 링 버퍼에 쌓이고, main loop 의 FSM 파서가 꺼내 프레임을 조립한다.\n  (다음 토픽인 프로토콜 파싱 FSM 과 직결.)\n- **센서 → 제어 루프**: 400Hz IMU 샘플을 링 버퍼로 100Hz 제어 루프에 전달,\n  레이트가 다른 producer/consumer 를 디커플링.\n- **로깅/블랙박스**: 넘칠 때 덮어쓰기 + drop 카운터로 최신 비행 데이터 보존.\n- **경합(contested)·저하(degraded) 환경**: 링크가 끊겨 소비자가 느려질 때 버퍼가\n  어떻게 우아하게 저하(graceful degradation)되는가 — 오버런 정책 설계가 곧\n  실패 모드 사고다. Anduril 이 온사이트에서 즐겨 파고드는 지점.\n```\n", "problems": [{"num": 56, "slug": "cb_init", "title_ko": "원형 버퍼 초기화", "title_en": "Initialize ring buffer", "difficulty": "easy", "tags": ["ring-buffer", "init", "embedded"], "prompt_ko": "cb 를 주어진 buffer/size 로 초기화하고 head=tail=count=0 으로 리셋한다. cb 가 NULL 이면 아무 것도 하지 않는다.", "prompt_en": "Initialize the ring buffer with external storage and capacity; reset head/tail/count. No-op if cb is NULL.", "signature": "void cb_init(cb_t *cb, uint8_t *buffer, size_t size)", "examples": [{"in": "cb_init(&cb, buf, 8)", "out": "count=0, is_empty=true"}], "hints": ["head/tail/count 를 모두 0 으로.", "buffer 포인터와 size 를 저장(heap 할당 없음 — 정적 저장소를 받는다).", "NULL 방어를 습관화."], "solution": "void cb_init(cb_t *cb, uint8_t *buffer, size_t size) {\n    if (!cb) return;\n    cb->buffer = buffer;\n    cb->size = size;\n    cb->head = cb->tail = cb->count = 0;\n}", "explanation_ko": "구조체 필드만 세팅하는 O(1) 초기화. 저장소는 외부에서 받아 heap 을 피한다(임베디드 정적 할당 관례). NULL 방어로 방어적 프로그래밍.", "complexity": "O(1) time, O(1) space", "pitfalls": ["size=0 을 그대로 두면 이후 % size 에서 0 나누기 — 사용 측에서 크기>0 보장 필요.", "NULL cb 미검사 시 크래시."], "anduril_context": "드론 부팅 시 UART RX 링 버퍼를 정적 배열로 한 번 초기화."}, {"num": 57, "slug": "cb_push", "title_ko": "push / enqueue", "title_en": "Push / enqueue", "difficulty": "easy", "tags": ["ring-buffer", "enqueue", "wrap-around"], "prompt_ko": "head 위치에 data 를 쓰고 head 를 랩어라운드 증가시키며 count++. 가득 차 있으면(또는 cb NULL) 덮어쓰지 말고 false 반환.", "prompt_en": "Enqueue one byte at head; advance head with wrap-around; increment count. Return false if full (or cb NULL) without overwriting.", "signature": "bool cb_push(cb_t *cb, uint8_t data)", "examples": [{"in": "빈 버퍼 push(5)", "out": "true, count=1"}, {"in": "가득 찬 버퍼 push(9)", "out": "false"}], "hints": ["cb_is_full 로 먼저 확인.", "head = (head+1) % size 로 감싼다.", "성공 시에만 count++."], "solution": "bool cb_push(cb_t *cb, uint8_t data) {\n    if (!cb || cb_is_full(cb)) return false;\n    cb->buffer[cb->head] = data;\n    cb->head = (cb->head + 1) % cb->size;\n    cb->count++;\n    return true;\n}", "explanation_ko": "head 는 '다음에 쓸 자리'. 데이터 저장 후 모듈로로 감싸 원형성을 유지. count 를 늘려 full/empty 판정을 O(1) 로.", "complexity": "O(1) time, O(1) space", "pitfalls": ["full 인데 덮어쓰면 아직 안 읽은 소비자 데이터 파괴.", "count 갱신 누락 시 full/empty 오판.", "% 0 방지(size>0)."], "anduril_context": "UART RX ISR 이 수신 바이트를 링 버퍼에 push."}, {"num": 58, "slug": "cb_pop", "title_ko": "pop / dequeue", "title_en": "Pop / dequeue", "difficulty": "easy", "tags": ["ring-buffer", "dequeue", "FIFO"], "prompt_ko": "tail 위치의 값을 *out 에 담고 tail 을 랩어라운드 증가, count--. 비어 있으면(또는 cb/out NULL) false.", "prompt_en": "Dequeue one byte into *out in FIFO order; advance tail; decrement count. Return false if empty (or cb/out NULL).", "signature": "bool cb_pop(cb_t *cb, uint8_t *out)", "examples": [{"in": "[1,2,3] pop", "out": "*out=1, true"}, {"in": "빈 버퍼 pop", "out": "false"}], "hints": ["cb_is_empty 로 먼저 확인.", "tail 위치를 읽고 tail=(tail+1)%size.", "out 이 NULL 인지도 검사."], "solution": "bool cb_pop(cb_t *cb, uint8_t *out) {\n    if (!cb || !out || cb_is_empty(cb)) return false;\n    *out = cb->buffer[cb->tail];\n    cb->tail = (cb->tail + 1) % cb->size;\n    cb->count--;\n    return true;\n}", "explanation_ko": "tail 은 '다음에 읽을 자리'. FIFO 순서 보장. 읽은 뒤 감싸고 count 감소. push 와 대칭.", "complexity": "O(1) time, O(1) space", "pitfalls": ["empty 미검사 시 쓰레기/과거 데이터 반환.", "out NULL 역참조 크래시.", "count 언더플로(unsigned) 주의."], "anduril_context": "main loop 가 링 버퍼에서 바이트를 꺼내 프로토콜 파서(FSM)로 공급."}, {"num": 59, "slug": "cb_is_empty", "title_ko": "비었는가?", "title_en": "Is empty?", "difficulty": "easy", "tags": ["ring-buffer", "predicate"], "prompt_ko": "원소가 하나도 없으면 true. cb 가 NULL 이면 안전하게 true.", "prompt_en": "Return true if the buffer holds no elements (true also if cb is NULL).", "signature": "bool cb_is_empty(const cb_t *cb)", "examples": [{"in": "init 직후", "out": "true"}, {"in": "1개 push 후", "out": "false"}], "hints": ["count 필드로 O(1).", "NULL 은 빈 것으로 취급."], "solution": "bool cb_is_empty(const cb_t *cb) {\n    if (!cb) return true;\n    return cb->count == 0;\n}", "explanation_ko": "count 필드 덕분에 head/tail 비교 없이 즉시 판정. count 방식의 장점.", "complexity": "O(1) time, O(1) space", "pitfalls": ["count 없이 head==tail 만으로 판정하면 full 과 구분 불가.", "NULL 처리 누락."], "anduril_context": "제어 루프가 새 센서 샘플 유무를 매 주기 확인."}, {"num": 60, "slug": "cb_is_full", "title_ko": "가득 찼는가?", "title_en": "Is full?", "difficulty": "easy", "tags": ["ring-buffer", "predicate"], "prompt_ko": "count == size 이면 true. cb 가 NULL 이면 false.", "prompt_en": "Return true if count == size; false if cb is NULL.", "signature": "bool cb_is_full(const cb_t *cb)", "examples": [{"in": "size 8 에 8개 push 후", "out": "true"}, {"in": "7개일 때", "out": "false"}], "hints": ["count == size 비교.", "NULL 은 full 아님(false)."], "solution": "bool cb_is_full(const cb_t *cb) {\n    if (!cb) return false;\n    return cb->count == cb->size;\n}", "explanation_ko": "count 방식은 full 을 size 와의 단순 비교로 판정 — 한 칸 희생 트릭이 불필요.", "complexity": "O(1) time, O(1) space", "pitfalls": ["head==tail 을 full 로 오판(empty 와 혼동).", "off-by-one 으로 한 칸 못 쓰거나 오버런."], "anduril_context": "ISR 이 push 전 오버런 여부를 확인해 drop 카운터를 올릴지 결정."}, {"num": 61, "slug": "cb_count", "title_ko": "현재 원소 수", "title_en": "Element count", "difficulty": "easy", "tags": ["ring-buffer", "accessor"], "prompt_ko": "저장된 원소 수를 반환. cb 가 NULL 이면 0.", "prompt_en": "Return the number of stored elements (0 if cb is NULL).", "signature": "size_t cb_count(const cb_t *cb)", "examples": [{"in": "3개 저장", "out": "3"}, {"in": "빈 버퍼", "out": "0"}], "hints": ["count 필드를 그대로 반환.", "NULL → 0."], "solution": "size_t cb_count(const cb_t *cb) {\n    return cb ? cb->count : 0;\n}", "explanation_ko": "count 필드를 유지하므로 개수 조회가 O(1). 인덱스 뺄셈조차 불필요.", "complexity": "O(1) time, O(1) space", "pitfalls": ["count 없이 (head-tail+size)%size 로 계산할 때 부호/랩 실수."], "anduril_context": "버퍼 점유율을 텔레메트리로 보고해 백프레셔(backpressure) 판단."}, {"num": 62, "slug": "cb_flush", "title_ko": "flush (논리적 비우기)", "title_en": "Flush", "difficulty": "easy", "tags": ["ring-buffer", "reset"], "prompt_ko": "데이터는 지우지 않고 head/tail/count 만 0 으로 리셋. cb 가 NULL 이면 무시.", "prompt_en": "Logically empty the buffer by resetting indices and count (data left intact). No-op if cb is NULL.", "signature": "void cb_flush(cb_t *cb)", "examples": [{"in": "2개 있는 버퍼 flush", "out": "is_empty=true, count=0"}], "hints": ["head=tail=count=0.", "실제 바이트를 0 으로 지울 필요 없음(논리적)."], "solution": "void cb_flush(cb_t *cb) {\n    if (!cb) return;\n    cb->head = cb->tail = cb->count = 0;\n}", "explanation_ko": "인덱스만 리셋하면 논리적으로 빈 상태가 된다. memset 불필요 — O(1).", "complexity": "O(1) time, O(1) space", "pitfalls": ["동시성 환경에서 소비자가 읽는 중 flush 하면 경합 — 락/정지 하에 호출해야.", "민감 데이터라면 논리 flush 로는 안 지워짐(보안)."], "anduril_context": "링크 재동기화(resync)나 파서 리셋 시 수신 버퍼를 비운다."}, {"num": 63, "slug": "cbp2_masking", "title_ko": "2의 거듭제곱 마스킹 변형", "title_en": "Power-of-two masking variant", "difficulty": "medium", "tags": ["ring-buffer", "bit-mask", "power-of-two", "free-running"], "prompt_ko": "용량이 2의 거듭제곱인 링 버퍼. head/tail 을 자유 증가(free-running)시키고 접근 시에만 & mask 로 감싼다. % 대신 AND 한 번. count = head-tail(부호없는 뺄셈), full=(count==size), empty=(head==tail). init 은 size 가 2의 거듭제곱이 아니면 false. slot 낭비 없이 전용량 사용.", "prompt_en": "Ring buffer whose capacity is a power of two: free-running head/tail masked with & (size-1) on access, replacing modulo. count = head - tail (unsigned), full when count==size, empty when head==tail. init returns false for non-pow2 size. Uses full capacity, no wasted slot.", "signature": "bool cbp2_init(cbp2_t*, uint8_t*, uint32_t size); uint32_t cbp2_count(const cbp2_t*); bool cbp2_push(cbp2_t*, uint8_t); bool cbp2_pop(cbp2_t*, uint8_t*)", "examples": [{"in": "cbp2_init(&q,buf,4)", "out": "true"}, {"in": "cbp2_init(&q,buf,3)", "out": "false (non-pow2)"}, {"in": "size4 에 4 push", "out": "모두 성공(전용량), 5번째 false"}], "hints": ["2의 거듭제곱 검사: (size & (size-1)) == 0 (size>0).", "인덱스는 마스킹하지 말고 계속 증가시키고, buf[head & mask] 로만 접근.", "count = head - tail 은 unsigned 라 랩되어도 정확.", "full 은 count==size, empty 는 head==tail."], "solution": "bool cbp2_init(cbp2_t *q, uint8_t *buf, uint32_t size) {\n    if (!q || !buf) return false;\n    if (size \u003c 2 || (size & (size - 1)) != 0) return false;  // pow2\n    q->buf = buf; q->size = size; q->mask = size - 1;\n    q->head = q->tail = 0;\n    return true;\n}\nuint32_t cbp2_count(const cbp2_t *q) {\n    return q ? q->head - q->tail : 0;   // unsigned 뺄셈\n}\nbool cbp2_push(cbp2_t *q, uint8_t data) {\n    if (!q || cbp2_count(q) == q->size) return false;\n    q->buf[q->head & q->mask] = data;   // % 대신 & mask\n    q->head++;\n    return true;\n}\nbool cbp2_pop(cbp2_t *q, uint8_t *out) {\n    if (!q || !out || q->head == q->tail) return false;\n    *out = q->buf[q->tail & q->mask];\n    q->tail++;\n    return true;\n}", "explanation_ko": "인덱스를 마스킹하지 않고 자유 증가시키면 head==tail 은 오직 empty 만 의미하고(뺄셈으로 개수를 알 수 있으므로 full 과 혼동 없음), 별도 count 필드 없이 전용량을 쓴다. 버퍼 접근만 & mask 로 하니 나눗셈(%) 대신 AND 한 사이클로 끝나 ISR 지연 예산에 유리.", "complexity": "O(1) time, O(1) space", "pitfalls": ["size 가 2의 거듭제곱이 아니면 & mask 가 틀린 인덱스를 준다 — init 에서 반드시 검사.", "인덱스를 매번 마스킹해 저장하면 count=head-tail 트릭이 깨진다(감싼 값끼리 빼면 부호 오류).", "size 가 2^31 초과면 count 뺄셈이 오버플로."], "anduril_context": "고속 UART/SPI DMA 링 버퍼 — % 를 피해 ISR 을 최소 사이클로 유지."}, {"num": 64, "slug": "spsc_lockfree", "title_ko": "SPSC 무락(lock-free) 링 버퍼", "title_en": "SPSC lock-free ring buffer", "difficulty": "hard", "tags": ["ring-buffer", "lock-free", "SPSC", "atomics", "ISR", "concurrency"], "prompt_ko": "단일 생산자/단일 소비자 전용 무락 링. 생산자만 head 를 store, 소비자만 tail 을 store → write-write 경합 없음 → 락 불필요. 사용 가능 용량 = size-1(한 칸 희생). 멀티코어 재정렬 방지를 위해 C11 acquire/release 원자연산 사용: push 는 데이터를 먼저 쓰고 head 를 release store, pop 은 head 를 acquire load 로 확인 후 데이터를 읽고 tail 을 release store.", "prompt_en": "Lock-free single-producer/single-consumer ring: producer only stores head, consumer only stores tail, so there is no write-write contention and no lock is needed. Usable capacity = size-1 (one slot sacrificed). Use C11 acquire/release atomics to prevent multicore reordering: publish data before advancing head (release), read peer index with acquire.", "signature": "bool spsc_init(spsc_t*, uint8_t*, uint32_t size); bool spsc_push(spsc_t*, uint8_t); bool spsc_pop(spsc_t*, uint8_t*)", "examples": [{"in": "size 4", "out": "최대 3개 저장, 4번째 push false"}, {"in": "ISR push / main pop", "out": "락 없이 안전"}], "hints": ["각 인덱스를 '한 스레드만 쓴다'는 게 무락의 핵심 — count 를 공유하면 깨진다.", "full 은 한 칸 희생: ((head+1)&mask)==(tail&mask). empty 는 head==tail.", "producer: head relaxed load, tail acquire load, 데이터 쓰기, head release store.", "consumer: tail relaxed load, head acquire load, 데이터 읽기, tail release store."], "solution": "bool spsc_init(spsc_t *q, uint8_t *buf, uint32_t size) {\n    if (!q || !buf || size \u003c 2 || (size & (size-1))) return false;\n    q->buf = buf; q->size = size; q->mask = size - 1;\n    atomic_init(&q->head, 0u); atomic_init(&q->tail, 0u);\n    return true;\n}\nbool spsc_push(spsc_t *q, uint8_t data) {   // 생산자 컨텍스트만\n    if (!q) return false;\n    uint32_t h = atomic_load_explicit(&q->head, memory_order_relaxed);\n    uint32_t t = atomic_load_explicit(&q->tail, memory_order_acquire);\n    if (((h + 1) & q->mask) == (t & q->mask)) return false;   // full\n    q->buf[h & q->mask] = data;                                // 1) 데이터\n    atomic_store_explicit(&q->head, h + 1, memory_order_release); // 2) 공개\n    return true;\n}\nbool spsc_pop(spsc_t *q, uint8_t *out) {   // 소비자 컨텍스트만\n    if (!q || !out) return false;\n    uint32_t t = atomic_load_explicit(&q->tail, memory_order_relaxed);\n    uint32_t h = atomic_load_explicit(&q->head, memory_order_acquire);\n    if (h == t) return false;                                  // empty\n    *out = q->buf[t & q->mask];\n    atomic_store_explicit(&q->tail, t + 1, memory_order_release);\n    return true;\n}", "explanation_ko": "생산자와 소비자가 서로 다른 인덱스만 '쓰고' 상대 것은 '읽기만' 하므로 mutex 없이도 데이터 레이스가 없다. ISR 안에서는 절대 락을 잡으면 안 되므로(우선순위 역전/데드락) 이 무락 성질이 UART RX ISR↔main 파이프라인에 필수다. release store 는 '데이터 쓰기가 인덱스 공개보다 먼저 관측되게', 짝을 이루는 acquire load 는 '반대편이 그 순서를 보게' 보장한다. 단일코어 베어메탈이라면 atomics 대신 volatile head/tail + 접근 순서(데이터 먼저)만으로도 전통적으로 충분.", "complexity": "O(1) time, O(1) space, lock-free (wait-free 는 아님)", "pitfalls": ["count 를 공유 갱신하면 무락이 깨진다 — 그래서 한 칸 희생 방식을 쓴다.", "데이터보다 인덱스를 먼저 증가시키면 소비자가 쓰레기를 읽는다 — 반드시 데이터 먼저, 인덱스(release) 나중.", "멀티코어에서 acquire/release(또는 배리어) 없이 volatile 만 쓰면 재정렬로 깨진다.", "생산자·소비자가 각각 1개라는 전제가 무너지면(예: 2 생산자) 즉시 불안전."], "anduril_context": "UART/RS422 RX ISR(생산자)이 바이트를 넣고 main loop(소비자)가 빼는 정석 임베디드 파이프라인 — Anduril 링버퍼 질문의 핵심."}, {"num": 65, "slug": "mpmc_mutex_condvar", "title_ko": "MPMC 블로킹 큐 (mutex+condvar)", "title_en": "MPMC blocking queue", "difficulty": "hard", "tags": ["ring-buffer", "MPMC", "mutex", "condition-variable", "concurrency"], "prompt_ko": "다중 생산자/다중 소비자 블로킹 큐. head/tail/count 를 여럿이 갱신하므로 mutex 로 임계구역 전체를 보호. 가득 차면 not_full 조건변수에서 대기, 비면 not_empty 에서 대기. spurious wakeup 대비 반드시 while 루프로 조건 재확인. 성공 후 반대편 조건변수를 signal.", "prompt_en": "Blocking multi-producer/multi-consumer queue. Guard the whole critical section with a mutex; wait on not_full while the buffer is full and on not_empty while empty (in a while loop to survive spurious wakeups); signal the opposite condvar after mutating.", "signature": "void mpmc_init(mpmc_t*, uint8_t*, size_t size); void mpmc_push(mpmc_t*, uint8_t); uint8_t mpmc_pop(mpmc_t*); void mpmc_destroy(mpmc_t*)", "examples": [{"in": "버퍼 full 에서 push", "out": "소비자가 pop 할 때까지 스레드가 잠듦"}, {"in": "2P/2C", "out": "합계/개수 보존"}], "hints": ["mutex_lock → while(full) cond_wait(not_full, m) → 수정 → signal(not_empty) → unlock.", "cond_wait 는 대기 중 mutex 를 자동으로 놓았다 다시 잡는다.", "if 가 아니라 while: spurious wakeup + 다른 스레드가 슬롯을 채감."
