<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anduril FW Prep — Console</title>
<style>
/* ============================================================= *
 *  ANDURIL FIRMWARE PREP · MISSION CONSOLE
 *  Identity: avionics / telemetry HUD. Cool charcoal ground,
 *  instrument-cyan accent, mono readouts. Semantic color
 *  (easy/med/hard, solved) is separate from the accent hue.
 * ============================================================= */
:root{
  --font-ui: ui-sans-serif, system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Menlo", "Cascadia Code", monospace;

  /* dark (default) — cool charcoals, slight blue bias */
  --bg:#0b0f15;
  --bg-grid: rgba(120,160,190,.045);
  --panel:#111823;
  --panel-2:#141d2a;
  --panel-3:#182333;
  --line:#22303f;
  --line-2:#2c3d50;
  --ink:#eef4fb;
  --ink-2:#c3d0df;
  --muted:#7f8ea3;
  --accent:#4fc9d8;         /* instrument cyan */
  --accent-2:#7fe3ee;
  --accent-ink:#04202a;
  --accent-dim: rgba(79,201,216,.14);
  --accent-line: rgba(79,201,216,.42);

  --good:#5cc98d;  --good-bg:rgba(92,201,141,.13); --good-line:rgba(92,201,141,.4);
  --warn:#e0a53f;  --warn-bg:rgba(224,165,63,.13); --warn-line:rgba(224,165,63,.4);
  --crit:#e56b52;  --crit-bg:rgba(229,107,82,.14); --crit-line:rgba(229,107,82,.42);

  --c-kw:#78b6ff; --c-ty:#4fc9d8; --c-str:#8fd08a; --c-num:#e0a53f; --c-cmt:#61718a; --c-pre:#c98ce0;

  --r:7px; --r-sm:4px; --r-lg:12px;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 30px rgba(0,0,0,.28);
  --rail-w:288px;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#eef2f7; --bg-grid: rgba(20,60,90,.04);
    --panel:#ffffff; --panel-2:#f4f7fb; --panel-3:#eaf0f6;
    --line:#d8e0ea; --line-2:#c4d0dd;
    --ink:#0e1620; --ink-2:#31414f; --muted:#5d6b7c;
    --accent:#0e8fa0; --accent-2:#0b7482; --accent-ink:#ffffff;
    --accent-dim: rgba(14,143,160,.1); --accent-line: rgba(14,143,160,.35);
    --good:#1f9d63; --good-bg:rgba(31,157,99,.1); --good-line:rgba(31,157,99,.35);
    --warn:#b5791a; --warn-bg:rgba(181,121,26,.11); --warn-line:rgba(181,121,26,.35);
    --crit:#c9482f; --crit-bg:rgba(201,72,47,.1); --crit-line:rgba(201,72,47,.34);
    --c-kw:#0b62c4; --c-ty:#0e8fa0; --c-str:#297a2a; --c-num:#9a5a00; --c-cmt:#7b8794; --c-pre:#8a3fb0;
    --shadow:0 1px 2px rgba(20,40,60,.08), 0 8px 26px rgba(20,40,60,.08);
  }
}
:root[data-theme="dark"]{
  --bg:#0b0f15; --bg-grid: rgba(120,160,190,.045);
  --panel:#111823; --panel-2:#141d2a; --panel-3:#182333;
  --line:#22303f; --line-2:#2c3d50; --ink:#eef4fb; --ink-2:#c3d0df; --muted:#7f8ea3;
  --accent:#4fc9d8; --accent-2:#7fe3ee; --accent-ink:#04202a;
  --accent-dim: rgba(79,201,216,.14); --accent-line: rgba(79,201,216,.42);
  --good:#5cc98d; --good-bg:rgba(92,201,141,.13); --good-line:rgba(92,201,141,.4);
  --warn:#e0a53f; --warn-bg:rgba(224,165,63,.13); --warn-line:rgba(224,165,63,.4);
  --crit:#e56b52; --crit-bg:rgba(229,107,82,.14); --crit-line:rgba(229,107,82,.42);
  --c-kw:#78b6ff; --c-ty:#4fc9d8; --c-str:#8fd08a; --c-num:#e0a53f; --c-cmt:#61718a; --c-pre:#c98ce0;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 30px rgba(0,0,0,.28);
}
:root[data-theme="light"]{
  --bg:#eef2f7; --bg-grid: rgba(20,60,90,.04);
  --panel:#ffffff; --panel-2:#f4f7fb; --panel-3:#eaf0f6;
  --line:#d8e0ea; --line-2:#c4d0dd; --ink:#0e1620; --ink-2:#31414f; --muted:#5d6b7c;
  --accent:#0e8fa0; --accent-2:#0b7482; --accent-ink:#ffffff;
  --accent-dim: rgba(14,143,160,.1); --accent-line: rgba(14,143,160,.35);
  --good:#1f9d63; --good-bg:rgba(31,157,99,.1); --good-line:rgba(31,157,99,.35);
  --warn:#b5791a; --warn-bg:rgba(181,121,26,.11); --warn-line:rgba(181,121,26,.35);
  --crit:#c9482f; --crit-bg:rgba(201,72,47,.1); --crit-line:rgba(201,72,47,.34);
  --c-kw:#0b62c4; --c-ty:#0e8fa0; --c-str:#297a2a; --c-num:#9a5a00; --c-cmt:#7b8794; --c-pre:#8a3fb0;
  --shadow:0 1px 2px rgba(20,40,60,.08), 0 8px 26px rgba(20,40,60,.08);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  background-image:linear-gradient(var(--bg-grid) 1px, transparent 1px), linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
  background-size:34px 34px;
  color:var(--ink-2);
  font-family:var(--font-ui);
  font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--accent-dim)}

/* mono eyebrow/label */
.eyebrow{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted)}
.mono{font-family:var(--font-mono)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------------- layout ---------------- */
.app{display:grid; grid-template-columns:var(--rail-w) 1fr; min-height:100vh}

/* ---------------- rail ---------------- */
.rail{
  position:sticky; top:0; align-self:start; height:100vh; overflow-y:auto;
  background:linear-gradient(180deg, var(--panel-2), var(--panel));
  border-right:1px solid var(--line);
  display:flex; flex-direction:column;
}
.brand{padding:18px 18px 14px; border-bottom:1px solid var(--line)}
.brand-row{display:flex; align-items:center; gap:11px}
.reticle{flex:none}
.brand-t{font-weight:700; color:var(--ink); font-size:15px; letter-spacing:.02em; line-height:1.15}
.brand-s{margin-top:1px}
.brand-meta{margin-top:12px; display:flex; align-items:center; gap:12px}
.ring{flex:none}
.brand-stat{display:flex; flex-direction:column; gap:2px}
.brand-stat b{color:var(--ink); font-size:19px; font-family:var(--font-mono); line-height:1}
.railscroll{padding:10px 10px 24px; flex:1}
.nav-h{padding:14px 8px 6px}
.nav-item{
  width:100%; text-align:left; cursor:pointer; border:1px solid transparent; background:transparent;
  color:var(--ink-2); font-family:inherit; font-size:13.5px;
  display:grid; grid-template-columns:22px 1fr auto; align-items:center; gap:9px;
  padding:8px 9px; border-radius:var(--r); margin-bottom:2px;
}
.nav-item:hover{background:var(--panel-3)}
.nav-item.active{background:var(--accent-dim); border-color:var(--accent-line); color:var(--ink)}
.nav-ico{font-size:15px; text-align:center; filter:saturate(.9)}
.nav-main{min-width:0}
.nav-title{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600}
.nav-sub{font-family:var(--font-mono); font-size:10px; color:var(--muted); letter-spacing:.04em}
.nav-count{font-family:var(--font-mono); font-size:10.5px; color:var(--muted); text-align:right}
.nav-count b{color:var(--good)}
.nav-bar{grid-column:1 / -1; height:3px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:7px}
.nav-bar > i{display:block; height:100%; background:var(--good); width:0}
.nav-sec{margin-top:6px}
.nav-plain{display:flex; align-items:center; gap:9px}
.nav-plain .nav-title{font-weight:600}

/* ---------------- main ---------------- */
.main{min-width:0; display:flex; flex-direction:column}
.hud{
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:11px 24px;
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
}
.hud .search{position:relative; flex:1; min-width:190px; max-width:420px}
.hud .search input{
  width:100%; background:var(--panel); border:1px solid var(--line); color:var(--ink);
  border-radius:var(--r); padding:8px 11px 8px 32px; font-family:var(--font-mono); font-size:12.5px;
}
.hud .search input:focus{outline:none; border-color:var(--accent-line); box-shadow:0 0 0 3px var(--accent-dim)}
.hud .search svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:.55}
.hud .search kbd{position:absolute; right:8px; top:50%; transform:translateY(-50%); font-family:var(--font-mono);
  font-size:10px; color:var(--muted); border:1px solid var(--line-2); border-radius:4px; padding:1px 5px}

.metrics{display:flex; gap:8px; align-items:stretch}
.metric{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  padding:6px 11px; min-width:64px; display:flex; flex-direction:column; gap:1px;
}
.metric .k{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.metric .v{font-family:var(--font-mono); font-size:17px; color:var(--ink); line-height:1.1}
.metric.easy .v{color:var(--good)} .metric.med .v{color:var(--warn)} .metric.hard .v{color:var(--crit)}
.metric.pct{background:var(--accent-dim); border-color:var(--accent-line)}
.metric.pct .v{color:var(--accent)}

.iconbtn{background:var(--panel); border:1px solid var(--line); color:var(--ink-2); border-radius:var(--r);
  width:34px; height:34px; cursor:pointer; display:grid; place-items:center}
.iconbtn:hover{border-color:var(--accent-line); color:var(--ink)}

/* content */
.content{padding:26px 24px 90px; max-width:1120px; width:100%; margin:0 auto}
.view-head{margin-bottom:20px}
.view-head h1{font-size:26px; color:var(--ink); margin:6px 0 4px; letter-spacing:-.01em; text-wrap:balance; line-height:1.15}
.view-head .en{color:var(--muted); font-family:var(--font-mono); font-size:12.5px; letter-spacing:.03em}
.view-head p{margin:12px 0 0; max-width:74ch; color:var(--ink-2)}

.toolbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:18px 0 14px}
.chip{cursor:pointer; font-family:var(--font-mono); font-size:11.5px; letter-spacing:.04em;
  border:1px solid var(--line); background:var(--panel); color:var(--ink-2); border-radius:20px; padding:5px 12px}
.chip:hover{border-color:var(--line-2)}
.chip.on{color:var(--ink); border-color:var(--accent-line); background:var(--accent-dim)}
.chip.d-easy.on{color:var(--good); border-color:var(--good-line); background:var(--good-bg)}
.chip.d-medium.on{color:var(--warn); border-color:var(--warn-line); background:var(--warn-bg)}
.chip.d-hard.on{color:var(--crit); border-color:var(--crit-line); background:var(--crit-bg)}
.tb-spacer{flex:1}
.tb-note{font-family:var(--font-mono); font-size:11px; color:var(--muted)}

/* concept cheatsheet */
.concepts{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; margin:14px 0 22px}
.concept{background:var(--panel); border:1px solid var(--line); border-left:2px solid var(--accent-line);
  border-radius:var(--r); padding:11px 13px}
.concept .term{font-family:var(--font-mono); font-size:12.5px; color:var(--accent); font-weight:600}
.concept .ko{font-size:12.5px; color:var(--ink-2); margin-top:4px}
.concept .en{font-size:11px; color:var(--muted); margin-top:3px; font-style:italic}

/* problem card */
.cards{display:flex; flex-direction:column; gap:11px}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden}
.card.solved{border-color:var(--good-line)}
.card.solved .chead{background:linear-gradient(90deg, var(--good-bg), transparent 60%)}
.chead{display:grid; grid-template-columns:auto auto 1fr auto auto; align-items:center; gap:12px;
  padding:13px 15px; cursor:pointer; user-select:none}
.pnum{font-family:var(--font-mono); font-size:11px; color:var(--muted); border:1px solid var(--line);
  border-radius:5px; padding:2px 7px; letter-spacing:.03em}
.diff{font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  padding:3px 8px; border-radius:20px; border:1px solid}
.diff.easy{color:var(--good); background:var(--good-bg); border-color:var(--good-line)}
.diff.medium{color:var(--warn); background:var(--warn-bg); border-color:var(--warn-line)}
.diff.hard{color:var(--crit); background:var(--crit-bg); border-color:var(--crit-line)}
.ctitles{min-width:0}
.ctitle{color:var(--ink); font-weight:650; font-size:15px; line-height:1.25}
.csub{color:var(--muted); font-family:var(--font-mono); font-size:11px; margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ctags{display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; max-width:230px}
.tag{font-family:var(--font-mono); font-size:9.5px; color:var(--muted); background:var(--panel-3);
  border:1px solid var(--line); border-radius:4px; padding:2px 6px}
.solvebox{width:22px; height:22px; border-radius:6px; border:1.5px solid var(--line-2); background:transparent;
  cursor:pointer; display:grid; place-items:center; color:transparent}
.solvebox:hover{border-color:var(--good-line)}
.card.solved .solvebox{background:var(--good); border-color:var(--good); color:#04140b}
.cchevron{transition:transform .18s ease; opacity:.6}
.card.open .cchevron{transform:rotate(90deg)}

.cbody{display:none; padding:2px 15px 16px; border-top:1px solid var(--line)}
.card.open .cbody{display:block}
.sec{margin-top:15px}
.sec > .lbl{display:block; margin-bottom:6px}
.prompt-ko{color:var(--ink); font-size:14.5px}
.prompt-en{color:var(--muted); font-size:12.5px; margin-top:5px; font-family:var(--font-mono); line-height:1.55}

.sig{font-family:var(--font-mono); font-size:12.5px; color:var(--c-ty); background:var(--panel-2);
  border:1px solid var(--line); border-left:2px solid var(--accent-line); border-radius:var(--r);
  padding:9px 12px; overflow-x:auto; white-space:pre-wrap; word-break:break-word}

table.ex{border-collapse:collapse; width:100%; font-size:12.5px; font-family:var(--font-mono)}
table.ex th,table.ex td{border:1px solid var(--line); padding:6px 10px; text-align:left; vertical-align:top}
table.ex th{color:var(--muted); font-weight:600; background:var(--panel-2); letter-spacing:.05em; font-size:10px; text-transform:uppercase}
table.ex td{color:var(--ink-2)}

.hints{display:flex; flex-direction:column; gap:7px}
.hint{display:flex; gap:10px; align-items:flex-start}
.hint .hb{flex:none; font-family:var(--font-mono); font-size:10px; color:var(--accent); border:1px solid var(--accent-line);
  background:var(--accent-dim); border-radius:5px; padding:3px 7px; cursor:pointer}
.hint .ht{color:var(--ink-2); font-size:13.5px; display:none}
.hint.rev .ht{display:block}
.hint.rev .hb{opacity:.5; cursor:default}

.reveal-sol{font-family:var(--font-mono); font-size:12px; letter-spacing:.03em; cursor:pointer;
  border:1px solid var(--accent-line); background:var(--accent-dim); color:var(--accent);
  border-radius:var(--r); padding:8px 14px}
.reveal-sol:hover{background:color-mix(in srgb, var(--accent-dim) 60%, var(--accent) 12%)}
.solwrap{display:none; margin-top:10px}
.solwrap.show{display:block}

.codebox{position:relative; background:var(--panel-2); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.codebar{display:flex; align-items:center; justify-content:space-between; padding:6px 10px; border-bottom:1px solid var(--line);
  background:var(--panel-3)}
.codebar .fn{font-family:var(--font-mono); font-size:10.5px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase}
.copybtn{font-family:var(--font-mono); font-size:10.5px; cursor:pointer; border:1px solid var(--line-2);
  background:var(--panel); color:var(--ink-2); border-radius:5px; padding:3px 9px}
.copybtn:hover{border-color:var(--accent-line); color:var(--accent)}
pre.code{margin:0; padding:13px 14px; overflow-x:auto; font-family:var(--font-mono); font-size:12.5px; line-height:1.62; color:var(--ink-2)}
pre.code code{font-family:inherit}
.c-kw{color:var(--c-kw)} .c-ty{color:var(--c-ty)} .c-str{color:var(--c-str)}
.c-num{color:var(--c-num)} .c-cmt{color:var(--c-cmt); font-style:italic} .c-pre{color:var(--c-pre)}

.callout{border:1px solid var(--line); border-left:3px solid var(--accent-line); background:var(--accent-dim);
  border-radius:var(--r); padding:10px 13px; font-size:13px; color:var(--ink-2)}
.callout .lbl{color:var(--accent)}
ul.pit{margin:0; padding-left:0; list-style:none; display:flex; flex-direction:column; gap:6px}
ul.pit li{position:relative; padding-left:20px; font-size:13.5px; color:var(--ink-2)}
ul.pit li::before{content:"▲"; position:absolute; left:0; top:1px; color:var(--crit); font-size:9px}
.complexity{font-family:var(--font-mono); font-size:12px; color:var(--ink-2); background:var(--panel-2);
  border:1px solid var(--line); border-radius:var(--r); padding:7px 11px; display:inline-block}

/* markdown note */
.note{background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); padding:6px 26px 22px; margin-bottom:8px}
.note h1,.note h2,.note h3,.note h4{color:var(--ink); line-height:1.25; text-wrap:balance}
.note h1{font-size:21px; border-bottom:1px solid var(--line); padding-bottom:8px; margin:22px 0 12px}
.note h2{font-size:17px; margin:22px 0 8px}
.note h3{font-size:14.5px; margin:18px 0 6px; color:var(--accent)}
.note h4{font-size:13px; margin:14px 0 5px; color:var(--ink-2)}
.note p{margin:9px 0}
.note ul,.note ol{margin:9px 0; padding-left:22px}
.note li{margin:3px 0}
.note code{font-family:var(--font-mono); font-size:.86em; background:var(--panel-3); border:1px solid var(--line);
  border-radius:4px; padding:1px 5px; color:var(--c-ty)}
.note pre.code{border:1px solid var(--line); border-radius:var(--r); margin:11px 0}
.note pre.code code{background:none; border:none; padding:0; color:inherit; font-size:12.5px}
.note blockquote{margin:11px 0; padding:2px 14px; border-left:3px solid var(--accent-line); background:var(--accent-dim);
  border-radius:0 var(--r) var(--r) 0; color:var(--ink-2)}
.note table{border-collapse:collapse; width:100%; font-size:12.5px; margin:12px 0; display:block; overflow-x:auto}
.note th,.note td{border:1px solid var(--line); padding:6px 10px; text-align:left}
.note th{background:var(--panel-2); color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em}
.note hr{border:none; border-top:1px solid var(--line); margin:18px 0}

/* overview */
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); padding:16px 18px}
.panel h3{margin:0 0 4px; color:var(--ink); font-size:15px}
.panel .cap{margin:0 0 12px}
.rolecard{border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; margin-bottom:10px; background:var(--panel-2)}
.rolecard .rt{display:flex; justify-content:space-between; gap:10px; align-items:baseline; flex-wrap:wrap}
.rolecard .rn{color:var(--ink); font-weight:650; font-size:14.5px}
.rolecard .rl{font-family:var(--font-mono); font-size:10.5px; color:var(--accent); border:1px solid var(--accent-line);
  background:var(--accent-dim); border-radius:20px; padding:2px 9px}
.rolecard .rmeta{font-family:var(--font-mono); font-size:11px; color:var(--muted); margin:5px 0 8px}
.rolecard .rmeta b{color:var(--good)}
.rolecard ul{margin:0; padding-left:18px; font-size:13px}
.rolecard li{margin:2px 0}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.pill{font-family:var(--font-mono); font-size:11px; color:var(--ink-2); background:var(--panel-2);
  border:1px solid var(--line); border-radius:20px; padding:4px 10px}
.pill.hi{color:var(--accent); border-color:var(--accent-line); background:var(--accent-dim)}

.flow{display:flex; flex-direction:column; gap:10px}
.stage{display:grid; grid-template-columns:auto 1fr; gap:13px}
.stage .sn{font-family:var(--font-mono); font-size:12px; color:var(--accent); border:1px solid var(--accent-line);
  background:var(--accent-dim); border-radius:8px; width:30px; height:30px; display:grid; place-items:center; font-weight:700}
.stage .st{color:var(--ink); font-weight:650; font-size:14px}
.stage .sw{color:var(--ink-2); font-size:13px; margin-top:3px}
.stage .sk{color:var(--muted); font-family:var(--font-mono); font-size:11px; margin-top:2px}

.themerow{display:grid; grid-template-columns:1fr; gap:8px}
.themeitem{border:1px solid var(--line); border-radius:var(--r); padding:10px 12px; background:var(--panel-2)}
.themeitem .tt{color:var(--ink); font-weight:600; font-size:13.5px}
.themeitem .td{color:var(--ink-2); font-size:12.5px; margin-top:3px}
.themeitem .te{color:var(--muted); font-family:var(--font-mono); font-size:11px; margin-top:5px}

ul.clean{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
ul.clean li{position:relative; padding-left:20px; font-size:13.5px; color:var(--ink-2)}
ul.clean li::before{content:"›"; position:absolute; left:4px; top:-1px; color:var(--accent); font-size:15px}
ul.warn li::before{content:"⚑"; color:var(--crit); font-size:11px; left:2px; top:1px}

.srcgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:7px}
.srclink{font-size:12px; padding:7px 10px; border:1px solid var(--line); border-radius:var(--r); background:var(--panel-2);
  display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.confbadge{display:inline-block; font-family:var(--font-mono); font-size:10.5px; color:var(--muted);
  border:1px solid var(--line); border-radius:20px; padding:3px 10px; margin-top:8px}

.empty{padding:40px; text-align:center; color:var(--muted); font-family:var(--font-mono); font-size:13px}
.foot{margin-top:30px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; font-family:var(--font-mono)}

.section-band{display:flex; align-items:center; gap:12px; margin:34px 0 4px}
.section-band .bar{height:1px; background:var(--line); flex:1}

/* résumé */
.resume-head{border:1px solid var(--line); border-radius:var(--r-lg); padding:22px 24px;
  background:linear-gradient(180deg,var(--panel-2),var(--panel)); margin-bottom:16px; position:relative; overflow:hidden}
.resume-head::after{content:""; position:absolute; right:-40px; top:-40px; width:150px; height:150px;
  background:radial-gradient(circle, var(--accent-dim), transparent 70%); pointer-events:none}
.resume-head .nm{font-size:31px; color:var(--ink); font-weight:800; letter-spacing:-.01em; line-height:1.05; margin-top:6px}
.resume-head .hl{color:var(--accent); font-family:var(--font-mono); font-size:13px; margin-top:7px}
.resume-head .hl2{color:var(--muted); font-family:var(--font-mono); font-size:11px; margin-top:3px}
.resume-head .rmeta2{display:flex; flex-wrap:wrap; gap:16px; margin-top:14px; color:var(--muted); font-family:var(--font-mono); font-size:11.5px}
.xp{border-left:2px solid var(--line-2); padding-left:18px; margin:4px 0 4px 6px}
.xp .job{position:relative; padding-bottom:18px}
.xp .job:last-child{padding-bottom:0}
.xp .job::before{content:""; position:absolute; left:-23px; top:5px; width:9px; height:9px; border-radius:50%;
  background:var(--accent); box-shadow:0 0 0 3px var(--bg)}
.xp .jt{display:flex; justify-content:space-between; gap:12px; align-items:baseline; flex-wrap:wrap}
.xp .co{color:var(--ink); font-weight:700; font-size:16px}
.xp .ti{color:var(--accent); font-size:13px; font-family:var(--font-mono)}
.xp .pr{font-family:var(--font-mono); font-size:11px; color:var(--muted); white-space:nowrap}
.xp .jnote{font-family:var(--font-mono); font-size:10.5px; color:var(--muted); margin-top:4px}
.xp ul{margin:9px 0 0; padding-left:18px} .xp li{margin:5px 0; font-size:13.5px; color:var(--ink-2)}
.fitrow{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); border:1px solid var(--line);
  border-radius:var(--r); overflow:hidden; margin-bottom:8px}
.fitrow > div{padding:12px 15px}
.fitrow .need{background:var(--panel-2); border-right:1px solid var(--line); font-size:12.5px; color:var(--ink-2)}
.fitrow .need b{color:var(--warn); font-family:var(--font-mono); font-size:11px; letter-spacing:.04em}
.fitrow .str{font-size:12.5px; color:var(--ink)}
.fitrow .str::before{content:"▹ "; color:var(--good)}
@media (max-width:640px){ .fitrow{grid-template-columns:1fr} .fitrow .need{border-right:none; border-bottom:1px solid var(--line)} }

/* target companies */
.coGrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:12px; margin-bottom:10px; }
.coCard{ background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); padding:15px 17px; display:flex; flex-direction:column; }
.coCard.fit3{ border-left:3px solid var(--good-line); }
.coCard.fit2{ border-left:3px solid var(--accent-line); }
.coCard.fit1{ border-left:3px solid var(--line-2); }
.coHead{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.coName{ font-size:17px; font-weight:700; color:var(--ink); }
.coStars{ font-size:13px; color:var(--warn); letter-spacing:1.5px; font-family:var(--font-mono); white-space:nowrap; }
.coMeta{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin:9px 0; }
.coVal{ font-family:var(--font-mono); font-size:12.5px; color:var(--ink); font-weight:600; }
.coHq{ font-family:var(--font-mono); font-size:11px; color:var(--muted); }
.stbadge{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:20px; border:1px solid; }
.sb-preipo{ color:var(--accent); border-color:var(--accent-line); background:var(--accent-dim); }
.sb-soon{ color:var(--warn); border-color:var(--warn-line); background:var(--warn-bg); }
.sb-filed{ color:var(--good); border-color:var(--good-line); background:var(--good-bg); }
.sb-public{ color:var(--muted); border-color:var(--line-2); background:var(--panel-2); }
.sb-ma{ color:var(--crit); border-color:var(--crit-line); background:var(--crit-bg); }
.coStage{ font-family:var(--font-mono); font-size:11px; color:var(--ink-2); margin-bottom:7px; line-height:1.5; }
.coStage b{ color:var(--muted); font-weight:600; }
.coDesc{ font-size:13px; color:var(--ink-2); margin:2px 0 9px; }
.coFit{ font-size:12.5px; color:var(--ink); background:var(--panel-2); border:1px solid var(--line); border-radius:var(--r); padding:8px 11px; }
.coFit .eyebrow{ color:var(--accent); display:block; margin-bottom:3px; }
.coCaution{ margin-top:8px; font-size:12px; color:var(--crit); }

/* timed mock */
.mockbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); padding:14px 20px; margin-bottom:14px; }
.clockwrap{ display:flex; align-items:baseline; gap:12px; }
.clock{ font-family:var(--font-mono); font-size:40px; font-weight:700; color:var(--ink); letter-spacing:.02em;
  font-variant-numeric:tabular-nums; line-height:1; }
.clock.warn{ color:var(--warn); } .clock.over{ color:var(--crit); }
#mockState{ color:var(--muted); }
.mockbtns{ display:flex; gap:8px; }
.tbtn{ font-family:var(--font-mono); font-size:12px; cursor:pointer; border:1px solid var(--line-2);
  background:var(--panel-2); color:var(--ink-2); border-radius:var(--r); padding:8px 14px; }
.tbtn:hover{ border-color:var(--accent-line); color:var(--accent); }
.tbtn.start{ border-color:var(--good-line); color:var(--good); background:var(--good-bg); }
.mocklabel{ margin:14px 0 -4px 2px; color:var(--accent); }

@media (max-width:920px){
  .app{grid-template-columns:1fr}
  .rail{position:static; height:auto; border-right:none; border-bottom:1px solid var(--line)}
  .railscroll{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .metrics{order:3; width:100%}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

date", "secure_boot_crypto", "memory_map_linker"]}, {"skill": "Debug tooling (JTAG/SWD, GDB, scope)", "ko": "JTAG/SWD, GDB/OpenOCD, 오실로스코프·로직분석기 기반 디버깅", "maps_to_topics": ["jtag_swd_debug", "gdb_openocd", "trace_profiling", "hardware_debug"]}, {"skill": "Rust for embedded", "ko": "임베디드 Rust (Anduril이 적극 채택) — 메모리 안전 시스템 코드", "maps_to_topics": ["rust_embedded", "memory_safety", "no_std", "hal_abstraction"]}], "protocols": ["I2C", "SPI", "QSPI", "UART / RS-232 / RS-422 / RS-485", "CAN", "CAN-FD", "USB", "Ethernet (TSN / gigE)", "PCIe", "MIL-STD-1553", "ARINC-429", "ARINC-825 (CAN)", "MAVLink", "DDS", "gRPC / Protobuf"], "mcu_cores": ["ARM Cortex-M (STM32, NXP i.MX RT)", "ARM Cortex-A (embedded Linux)", "ARM Cortex-R (safety/real-time)", "Xilinx Zynq / Zynq UltraScale+ (FPGA + ARM SoC)", "TI C2000 (motor/real-time control)", "NXP i.MX (Linux SoC)", "RISC-V (일부 신규)"], "debug_tools": ["JTAG / SWD", "SEGGER J-Link", "ST-Link", "OpenOCD", "GDB", "Oscilloscope", "Logic analyzer (Saleae)", "Lauterbach TRACE32", "CAN analyzer (PCAN / Vector)", "Yocto / Buildroot", "HIL (Hardware-in-the-Loop) test rigs"], "clearance_ko": "대부분의 역할이 US Person(시민 또는 영주권자)을 요구하며, 다수 포지션이 Secret 또는 Top Secret 보안 인가(clearance)를 취득할 수 있는 자격을 요구한다. 일부 프로그램은 채용 시점에 기존 clearance 보유를 필수로 한다.", "itar_ko": "Anduril 제품은 ITAR(International Traffic in Arms Regulations) 및 수출통제 대상이다. 따라서 지원자는 미국 시민권자, 영주권자, 또는 지정 보호 개인(protected individual) 등 'US Person' 자격을 충족해야 관련 기술 데이터에 접근할 수 있다.", "summary_ko": "Anduril의 펌웨어/임베디드 엔지니어링은 자율 무기·감시 시스템(드론, 요격체, AUV, CCA, 순항미사일, 감시탑)의 하드웨어를 실제로 동작시키는 저수준 소프트웨어를 만든다. 핵심은 C/C++(그리고 점점 Rust)로 베어메탈·RTOS·임베디드 리눅스 위에서 모터·전력·센서·통신 서브시스템을 제어하고, I2C/SPI/CAN/UART/이더넷/1553 같은 버스를 브링업하며, JTAG·오실로스코프·로직분석기로 하드웨어를 디버깅하는 일이다. 실시간 결정성, 안전·고신뢰(watchdog, fail-safe), secure boot/OTA, HIL 테스트가 반복적으로 등장한다. Don의 SSD 펌웨어 7년 경력과 PCIe/I2C/SPI/RFFE 브링업·시스템 디버깅 경험이 직결되므로, 준비는 (1) C 포인터/메모리/동시성과 RTOS 스케줄링 복습, (2) 각 버스 프로토콜의 레지스터 레벨·타이밍·엣지케이스 정리, (3) 부트로더/secure boot/OTA 흐름, (4) 실시간·안전 상태머신 설계 패턴, (5) 임베디드 Rust 기초, (6) 방산 특화 버스(MIL-STD-1553, ARINC)와 ITAR/clearance 요건 숙지 순으로 진행하는 것이 효율적이다."}, "interview": {"meta": {"last_updated": "2026-08-01", "confidence_ko": "아래 내용은 Blind, Glassdoor, interviewing.io, 여러 인터뷰 가이드 사이트의 지원자 후기를 종합한 것. [확인됨]=복수 출처 일치, [추정]=단일/2차 출처 또는 일반화. 팀·직무·연도별 편차가 크므로 리크루터가 주는 공식 안내를 항상 우선할 것."}, "process": [{"stage": "리크루터 스크린 (Recruiter Screen)", "ko": "약 30분 전화. [확인됨]", "what": "배경/경력, 지원 동기, 방위산업(국방)에 대한 거부감 여부 확인. 'mission alignment(미션 정합성)'를 초반부터 강하게 검증 — 국방 업무를 실제로 원하는 사람만 통과시키려 함. 급여 기대치, 온사이트 가능 여부(대부분 Irvine 본사 온사이트 필요)도 이 단계에서."}, {"stage": "기술 폰스크린 (Technical Phone Screen / HM Call)", "ko": "약 45~60분(가이드에 따라 60~90분), Zoom + CoderPad. 역할에 따라 HM(하이어링 매니저) 콜과 병행되거나 대체됨. [확인됨]", "what": "인트로/이력 5~10분 → 라이브 코딩 35~40분 → 질문 5~10분. C++로 라이브 코딩(임베디드/로보틱스 역할은 C++ 선호, Flight/Embedded C 역할은 C). LeetCode Medium 수준이나 'Medium 중에서도 어려운 쪽'으로 흐르는 경우 있음. 회사는 '리트코드 안 낸다'고 말하지만 실제 문제는 표준 LC 포맷과 유사하다는 후기 다수. [확인됨]"}, {"stage": "온사이트 / 페어링 데이 (Onsite / Pairing Day)", "ko": "약 4~6시간, 대개 Irvine 본사 온사이트(가상 온사이트도 존재). 라운드 60~90분씩 3~4개(가이드에 따라 4~6). [확인됨: 코딩2+시스템설계1+행동1 구조가 가장 흔함]", "what": "① 코딩 1~2라운드(CoderPad) — 알고리즘이지만 임베디드/실시간 색채, 시간·공간 트레이드오프와 엣지케이스 추론 중시. ② 시스템/임베디드 설계 1라운드 — 자율 시스템, 분산 센서, 실시간 아키텍처, 실패 모드·대역폭 한계·노드/링크 단절 시 저하(degradation). ③ 도메인 심화 1~2라운드(펌웨어 직무) — 과거 프로젝트 설계 결정을 구체적으로 방어, 표면적 답 넘어 파고듦. ④ 행동/미션 정합성 1라운드 — 국방 업무 동기를 직접 질문."}], "question_style_ko": "순수 LeetCode와 실무형 임베디드 문제의 '하이브리드'. 폰스크린은 C/C++ 라이브 코딩으로 LC Medium(가끔 Medium-Hard)이 나오지만, 문제 배경이 드론/로봇/센서 등 도메인으로 포장되는 경우가 많음(예: 로봇 무리의 우선순위 작업 추적 = 힙/우선순위큐). 온사이트로 갈수록 '동작하는 코드'보다 시간·공간 트레이드오프, 엣지케이스, 고정 메모리·지연(latency) 예산·센서 제약 하에서의 추론을 봄. 펌웨어 직무는 여기에 임베디드 C 정통 주제(비트 조작, 링버퍼, ISR/volatile, RTOS, 프로토콜 파싱, 엔디안)와 하드웨어 인지형 시스템 설계(FSM 파서, 비행 제어 루프 타이밍, CAN/RS422 버스)가 추가됨. 임베디드 지원자가 하드웨어·C 기본만 공부하고 알고리즘/자료구조를 소홀히 해 떨어지는 경우가 흔하다는 경고 다수. AI 도구 사용은 인터뷰 중 엄격 금지.", "themes": [{"theme": "비트 조작 (Bit manipulation)", "ko": "레지스터 비트 set/clear/toggle, 마스킹. [확인됨]", "example": "32비트 레지스터에서 특정 비트를 set/clear/toggle하는 함수 구현. 니블(nibble)↔텍스트 변환."}, {"theme": "링 버퍼 / 원형 큐 (Ring buffer)", "ko": "임베디드 최다 빈출 자료구조. UART 수신 버퍼, 로깅. [확인됨]", "example": "UART로 들어오는 데이터를 담는 C 링버퍼 구현. full/empty 구분, 인터럽트 안전(producer=ISR, consumer=main) 처리."}, {"theme": "ISR 안전성 / volatile / 동시성", "ko": "인터럽트 핸들러를 짧고 안전하게. [확인됨]", "example": "volatile이 언제 왜 필요한가, 최소한의 ISR 작성, 인터럽트-세이프 큐, priority inversion/deadlock 방지."}, {"theme": "프로토콜 파싱 / FSM", "ko": "노이즈 있는 바이트 스트림 파싱을 상태머신으로. [확인됨: Blind 온사이트 후기]", "example": "GPS류 프레임(예: NMEA 유사)을 노이즈 스트림에서 파싱하는 FSM 파서. 엔디안 관리, 체크섬, 재동기화(resync)."}, {"theme": "실시간 제어 루프 설계", "ko": "다중 레이트 스케줄링과 타이밍 예산. [확인됨: Blind]", "example": "고정익 항공기 비행 컨트롤러: 제어 루프 100Hz, 추진 10Hz, IMU 400Hz, GPS 1Hz를 한 시스템에서 스케줄링. RTOS 스레드 모델 vs 슈퍼루프 논의."}, {"theme": "하드웨어 버스 / 통신", "ko": "버스 선택과 메시징 프로토콜. [확인됨: Blind]", "example": "CAN vs RS422 트레이드오프, CAN 메시징 프로토콜, 저하(degraded)/경합(contested) 환경에서의 에러 처리."}, {"theme": "표준 알고리즘/자료구조 (LC Medium)", "ko": "C/C++ 라이브 코딩. [확인됨]", "example": "product of array except self, atoi, 링크드리스트 조작, 배열/문자열, 해시맵, 그래프, 정렬. 우선순위큐/힙(로봇 작업 우선순위). 실제 폰스크린 후기: 정수 배열 2개가 주어지고 각 원소에 대해 다른 배열에서 가장 가까운 '센서' 매치를 찾아 최대 거리를 구하는 문제(도메인 포장된 배열/투포인터 유형). [확인됨: Blind]"}, {"theme": "시스템/임베디드 아키텍처", "ko": "전체 시스템을 이해하는지. [확인됨]", "example": "센서 노드 펌웨어 아키텍처, HW 주변장치 API 설계, 전력 관리. (일반 SWE 트랙에서는 Design TinyURL, Tetris, '드론 무리 신호 전송 관리' 같은 실무형도 등장)."}], "tips_ko": ["임베디드 정통 주제(비트, 링버퍼, ISR, volatile, RTOS, 파싱)와 LC Medium 알고리즘을 '둘 다' 준비. 한쪽만 하면 탈락 사유가 됨.", "C/C++로 라이브 코딩 연습. 임베디드/로보틱스는 C++ 선호, Flight/Embedded C 역할은 C. 손에 익은 언어로 컴파일·엣지케이스까지 빠르게.", "'동작하는 코드'에서 멈추지 말고 시간/공간 복잡도, 엣지케이스, 고정 메모리·지연 예산·센서 제약 하의 트레이드오프를 소리 내어 설명.", "폰스크린 준비에 최소 2주 확보 권장(후기). 며칠은 부족하다는 커뮤니티 조언 다수.", "미션/국방 동기를 구체적으로 준비. '멋진 기술이라서'는 약하게 보임. 국가안보 우선순위 정합성, 레거시 방산업체의 느린 속도에 대한 불만, 군 관련 개인/가족 인연 등 구체적 서사가 높게 평가됨.", "과거 프로젝트의 설계 결정을 아주 구체적으로 방어할 수 있게 준비 — 면접관이 표면적 답을 넘어 계속 파고듦(왜 이 버스? 왜 이 스케줄링? 왜 이 메모리 레이아웃?).", "제품/역할을 사전 조사. Lattice, Ghost, Bolt, Fury 등 담당 제품군과 자기 역할의 관계를 말할 수 있게.", "실패 모드 사고: 노드가 죽거나 링크가 끊길 때 시스템이 어떻게 '우아하게 저하(graceful degradation)'되는지 설계에 반영.", "인터뷰 중 AI 도구 사용 절대 금지. 적발 시 즉시 탈락.", "온사이트는 대부분 Irvine 본사 대면 — 이동/일정(왕복 거리)까지 미리 계획."], "sample_behavioral": ["왜 방위산업/국방에서 일하고 싶은가? (미션 정합성 — 가장 중요, 구체적 답 필수)", "가장 도전적이었던 기술 프로젝트와 그 규모, 마주친 기술적 난제는?", "설계 결정에서 팀원/이해관계자와 의견이 충돌했을 때 어떻게 해결했나?", "이 특정 역할·팀에 왜 적합하다고 생각하나?", "촉박한 마감/스트레스 상황에서 어떻게 대응하고 우선순위를 정했나?", "하드웨어·시스템·소프트 등 다분야 팀과 어떻게 협업했나?", "본인이 오너십을 갖고 끝까지 책임진 사례는?"], "red_flags_ko": ["국방 동기가 모호함('멋진 기술이라서', '돈 때문에')은 초반 리크루터 단계부터 감점/탈락 신호.", "임베디드 하드웨어·C 기본만 공부하고 알고리즘/자료구조(LC Medium)를 소홀히 하면 코딩 라운드에서 탈락하는 대표적 실패 패턴.", "과거 프로젝트 설계 결정을 구체적으로 방어하지 못하고 표면적으로만 답하면 도메인 심화 라운드에서 걸림.", "인터뷰 중 AI 도구 사용은 즉시 탈락 사유.", "폰스크린을 며칠 벼락치기로 준비 — 후기상 부족. 감을 잃은 상태면 일정을 미루라는 조언.", "면접관/일부 후기에서 '기업 문화가 강도 높고 요구가 많다(intense, demanding)'는 언급 — 스트레스 내성과 오너십을 보려 함. 워라밸 기대와 미스매치 가능.", "'리트코드 안 낸다'는 회사 안내를 곧이곧대로 믿고 알고리즘 준비를 건너뛰는 것 — 실제로는 LC 유사 문제가 나옴."], "sources": [{"title": "Blind — Anduril firmware engineer interview process", "url": "https://www.teamblind.com/post/anduril-firmware-engineer-interview-process-rke0bj0g"}, {"title": "Blind — Anduril Interview: Technical Phone Screen", "url": "https://www.teamblind.com/post/anduril-interview-technical-phone-screen-wnlmgfpm"}, {"title": "Blind — Anduril C++ interviews", "url": "https://www.teamblind.com/post/anduril-c-interviews-okqaq6go"}, {"title": "Blind — Anduril Software Interview (phone screen 센서 배열 문제 후기)", "url": "https://www.teamblind.com/post/Anduril-Software-Interview-SUOhG3nC"}, {"title": "Blind — Had my worst phone screen experience with Anduril", "url": "https://www.teamblind.com/post/had-my-worst-phone-screen-experience-with-anduril-oswm1hmp"}, {"title": "interviewing.io — Anduril's Interview Process & Questions", "url": "https://interviewing.io/anduril-interview-questions"}, {"title": "techinterview.org — Anduril Industries Interview Guide 2026", "url": "https://www.techinterview.org/companies/anduril-interview-guide/"}, {"title": "Dataford — Anduril Embedded Engineer Interview Guide", "url": "https://dataford.io/interview-guides/anduril/embedded-engineer"}, {"title": "InterviewQuery — Anduril Software Engineer Interview Guide", "url": "https://www.interviewquery.com/interview-guides/andurilindustries-software-engineer"}, {"title": "Snubber — Anduril Interview Questions (Hardware) 2026", "url": "https://snubber.ai/blog/anduril-interview-questions"}, {"title": "Glassdoor — Anduril Firmware Engineer Interview Questions", "url": "https://www.glassdoor.com/Interview/Anduril-Firmware-Engineer-Interview-Questions-EI_IE3546800.0,7_KO8,25.htm"}, {"title": "Anduril Careers — Firmware Engineer, Embedded Systems (JD)", "url": "https://job-boards.greenhouse.io/andurilindustries/jobs/5052359007"}]}, "mocks": [{"title_ko": "워밍업 · 임베디드 기본기", "theme_ko": "폰스크린 워밍업 감각. 비트 조작 → atoi 파싱 → 리스트 뒤집기. 45분 안에 3개를 손이 기억하는 속도로 끝내는 게 목표.", "problems": [{"topic": "bit_basics", "num": 1}, {"topic": "strings", "num": 33}, {"topic": "linked_list", "num": 69}]}, {"title_ko": "배열 & 해싱 (실제 출제)", "theme_ko": "해시맵 / prefix / top-k 패턴. product_except_self 와 top_k_frequent 는 안두릴에서 실제 보고된 문제. hashmap을 C로 즉석에서 짜는 감각이 핵심.", "problems": [{"topic": "11_arrays_hashing", "num": 1}, {"topic": "11_arrays_hashing", "num": 3}, {"topic": "11_arrays_hashing", "num": 10}]}, {"title_ko": "링버퍼 + 스택 (ISR & 파싱)", "theme_ko": "임베디드 최빈출 원형버퍼 + 단조/후위 스택. ISR↔main 파이프라인과 표현식 평가. 마지막 SPSC 무락은 시간 관리 훈련용 stretch.", "problems": [{"topic": "circular_buffer", "num": 57}, {"topic": "12_stack_queue", "num": 5}, {"topic": "circular_buffer", "num": 64}]}, {"title_ko": "프로토콜 파서 FSM (실제 출제 유형)", "theme_ko": "신호등 FSM → 고정소수점 → UART 패킷 파서 FSM. 안두릴 실제 출제(노이즈 섞인 GPS 바이트 스트림 파서, 리싱크/엔디안)와 같은 결.", "problems": [{"topic": "fsm", "num": 79}, {"topic": "data_processing", "num": 91}, {"topic": "fsm", "num": 78}]}, {"title_ko": "힙 & 우선순위 큐 (로봇 스웜 · 실제 출제)", "theme_ko": "이진탐색 → k번째 최대 → 로봇 스웜 우선순위 스케줄러. 힙/우선순위 큐와 '로봇 무리 우선순위 작업'은 안두릴 실제 보고 문제.", "problems": [{"topic": "17_sorting_searching", "num": 1}, {"topic": "14_hea , "study_note_md": "# 01. 비트 조작 기초 (Bit Manipulation Basics) 🔧\n\n> MCU 레지스터 조작(register manipulation)의 기본 어휘. 드론 펌웨어에서 GPIO,\n> 타이머, ADC, 통신 페리페럴(SPI/I2C/UART) 레지스터의 특정 비트를 켜고·끄고·읽는\n> 일은 매 제어 루프마다 수백 번 일어난다. 이 10개는 그 \"손가락 근육\"이다.\n\n---\n\n## 왜 Anduril 펌웨어 인터뷰에 나오나\n\n- 디바이스 드라이버는 결국 **메모리 맵드 레지스터(memory-mapped register)** 에 마스크를\n  씌워 비트를 조작하는 일이다. `GPIOA->BSRR |= (1 \u003c\u003c pin)` 같은 코드가 곧 `set_bit`.\n- 화이트보드에서 \"레지스터의 3번 비트만 켜라\", \"부호 없이 절대값 구해라(분기 없이)\",\n  \"패리티 비트 계산해라\" 같은 문제로 **UB 감각과 2의 보수 이해**를 본다.\n- 실기체 예: 비행 컨트롤러의 IMU 인터럽트 상태 레지스터 폴링, 모터 ESC의 폴트 플래그\n  비트 판독, 텔레메트리 패킷의 패리티 검사.\n\n---\n\n## 핵심 치트시트 (cheatsheet)\n\n| 연산 | 관용구 (idiom) | 메모 |\n|------|----------------|------|\n| Set bit n | `v \\|=  (1u \u003c\u003c n)` | OR |\n| Clear bit n | `v &= ~(1u \u003c\u003c n)` | 반전 마스크 AND |\n| Toggle bit n | `v ^=  (1u \u003c\u003c n)` | XOR |\n| Test bit n | `(v >> n) & 1u` 또는 `v & (1u\u003c\u003cn)` | !=0 으로 bool 변환 |\n| 최하위 1비트 지우기 | `v & (v - 1)` | popcount 루프에 사용 |\n| 최하위 1비트만 남기기 | `v & (-v)` = `v & (~v + 1)` | isolate LSB |\n| 부호 다름? | `(a ^ b) \u003c 0` | 부호비트(MSB) 비교 |\n| 분기 없는 abs | `(v ^ (v>>31)) - (v>>31)` | 아래 UB 주의 |\n\n---\n\n## 문제별 요점\n\n### 1–4. Set / Clear / Toggle / Test\n```c\nvalue |  (1u \u003c\u003c bit);   // set\nvalue & ~(1u \u003c\u003c bit);   // clear\nvalue ^  (1u \u003c\u003c bit);   // toggle\nvalue &  (1u \u003c\u003c bit);   // test (0 or non-zero)\n```\n**가장 흔한 함정:** `1 \u003c\u003c bit` 는 `int`(부호 있음) 리터럴이라 `bit == 31`이면\n부호비트를 건드려 **UB**. 항상 `1u`(또는 `1UL`)로 쓴다. 또 `bit >= 32`면\n시프트 폭이 타입 폭 이상이라 그 자체가 UB — 드라이버 코드에선 방어적으로 guard.\n\n### 5. swap_nibbles\n```c\n(uint8_t)((value \u003c\u003c 4) | (value >> 4));\n```\n`uint8_t`는 연산 시 `int`로 승격되므로 `value \u003c\u003c 4`의 상위 비트가 살아있다.\n반드시 `(uint8_t)` 캐스트로 잘라준다. (BCD 코덱, LED 세그먼트 매핑에 흔함.)\n\n### 6. parity_even — 짝수 패리티\n1의 개수가 **짝수면 true**(0개도 짝수). 순진한 루프도 되지만 **XOR-folding**이\n브랜치리스 O(log n):\n```c\nvalue ^= value >> 16;\nvalue ^= value >> 8;\nvalue ^= value >> 4;\nvalue ^= value >> 2;\nvalue ^= value >> 1;\nreturn (value & 1u) == 0u;   // 최하위=1 이면 1의 개수 홀수\n```\n> 원본 소스의 주석/기대값이 서로 어긋나 있었다(어떤 곳은 0, 어떤 곳은 1).\n> 여기서는 **\"짝수 개 → true\"** 로 정의를 고정했다. `parity_even(0x5)` = 1이 2개 = **true**.\n\n### 7. clear_lsb — `v & (v-1)`\n1을 빼면 최하위 1은 0이 되고 그 아래는 전부 1로 바뀐다. AND 하면 그 자리만 지워진다.\n`v == 0`이면 `0u - 1 = 0xFFFFFFFF`, `0 & ... = 0` 이라 안전. Brian Kernighan\npopcount의 핵심 스텝.\n\n### 8. rightmost_set_bit — `v & (-v)`\n2의 보수에서 `-v == ~v + 1`. AND 하면 최하위 1비트만 남는다. **unsigned에서\n`0u - v`로 쓰면** 부정(negation) wrap이 well-defined. 인터럽트 우선순위에서\n\"가장 낮은 대기 IRQ\" 뽑기 같은 데 쓴다.\n\n### 9. is_opposite_sign — `(a ^ b) \u003c 0`\n부호가 다르면 XOR의 MSB(부호비트)가 1 → 음수. 0은 부호비트 0이라 양수 취급.\n분기·곱셈 없이 한 줄.\n\n### 10. abs_no_branch\n```c\nuint32_t uv = (uint32_t)value;\nuint32_t mask = 0u - (uv >> 31);   // 음수면 0xFFFFFFFF, 양수면 0\nreturn (int32_t)((uv ^ mask) - mask);\n```\n`value >> 31`(signed)은 음수 우측 시프트라 **구현 정의(implementation-defined)**.\n그래서 unsigned로 부호비트를 뽑아 `0u - bit`로 마스크를 만들고, 전 과정을\nunsigned로 계산해 **signed overflow UB를 회피**한다.\n**주의:** `INT32_MIN`의 절대값은 `int32_t`로 표현 불가 → 그대로 `INT32_MIN` 반환(수학적 오류지만 UB는 아님).\n\n---\n\n## 인터뷰 팔로업 (follow-ups)\n\n- **\"왜 `1` 대신 `1u`?\"** → 31번 비트 시프트 시 부호비트 UB 회피.\n- **\"`bit`가 32 이상이면?\"** → 시프트 폭 ≥ 타입 폭은 UB. guard 하거나 문서화.\n- **\"`x & (x-1) == 0`은 무엇을 판별?\"** → 2의 거듭제곱(또는 0) 여부.\n- **\"popcount는?\"** → `while(v){ v &= v-1; cnt++; }` (set 비트 수만큼 반복) 또는 하드웨어 `__builtin_popcount`.\n- **\"volatile 레지스터에 read-modify-write 할 때 주의점?\"** → 컴파일러 재정렬/최적화 방지 위해 `volatile`, ISR과 공유 시 원자성(레지스터 세트/클리어 전용 레지스터 BSRR 사용) 고려.\n\n## 흔한 버그 (gotchas)\n\n- `1 \u003c\u003c 31` 부호 UB, `1 \u003c\u003c 32` 폭 초과 UB.\n- `uint8_t` 니블 스왑에서 캐스트 누락 → 상위 비트 잔존.\n- signed `>>`를 논리 시프트로 착각(구현 정의).\n- `abs(INT32_MIN)` 오버플로.\n- 패리티 정의(짝수=true vs 홀수=true) 혼동 — 반드시 명세를 물어라.\n", "problems": [{"num": 1, "slug": "set_bit", "title_ko": "특정 비트 설정(Set)", "title_en": "Set a specific bit", "difficulty": "easy", "tags": ["register", "mask", "gpio"], "prompt_ko": "value 의 bit 번째 비트를 1로 설정해 반환하라. bit >= 32 는 UB 이므로 방어하라.", "prompt_en": "Set bit `bit` of `value` to 1 and return the result. Guard bit >= 32 (shift-width UB).", "signature": "uint32_t set_bit(uint32_t value, uint8_t bit)", "examples": [{"in": "set_bit(0x00, 3)", "out": "0x8"}, {"in": "set_bit(0x00, 31)", "out": "0x80000000"}], "hints": ["OR 연산으로 원하는 비트만 1로 만든다.", "마스크는 (1u \u003c\u003c bit).", "bit >= 32u 이면 그대로 value 반환(no-op)."], "solution": "uint32_t set_bit(uint32_t value, uint8_t bit) {\n    if (bit >= 32u) return value;\n    return value | (1u \u003c\u003c bit);\n}", "explanation_ko": "OR 는 대응 비트가 1이면 결과도 1, 나머지는 원본 유지. (1u\u003c\u003cbit) 로 해당 자리에만 1을 세워 OR 하면 그 비트만 켜진다. 1u 로 써야 bit==31 에서 부호비트 UB 를 피한다.", "complexity": "O(1) time, O(1) space", "pitfalls": ["1 (signed) 로 쓰면 1\u003c\u003c31 부호 UB", "bit>=32 시프트 폭 초과 UB"], "anduril_context": "GPIO 출력 세트: GPIOA->BSRR = (1u\u003c\u003cpin) 처럼 핀 활성화."}, {"num": 2, "slug": "clear_bit", "title_ko": "특정 비트 클리어(Clear)", "title_en": "Clear a specific bit", "difficulty": "easy", "tags": ["register", "mask"], "prompt_ko": "value 의 bit 번째 비트를 0으로 클리어해 반환하라.", "prompt_en": "Clear bit `bit` of `value` to 0 and return the result.", "signature": "uint32_t clear_bit(uint32_t value, uint8_t bit)", "examples": [{"in": "clear_bit(0xFF, 4)", "out": "0xEF"}], "hints": ["반전 마스크가 필요하다.", "~(1u \u003c\u003c bit) 는 해당 비트만 0, 나머지 1.", "AND 로 그 비트만 끈다."], "solution": "uint32_t clear_bit(uint32_t value, uint8_t bit) {\n    if (bit >= 32u) return value;\n    return value & ~(1u \u003c\u003c bit);\n}", "explanation_ko": "~(1u\u003c\u003cbit) 는 해당 위치만 0이고 나머지가 1인 마스크. AND 하면 그 비트만 0으로 떨어지고 나머지는 유지된다.", "complexity": "O(1) time, O(1) space", "pitfalls": ["~ 를 빼먹고 그냥 AND 하면 반대로 나머지가 다 지워짐", "부호/시프트 폭 UB"], "anduril_context": "인터럽트 플래그 클리어, 페리페럴 enable 비트 off."}, {"num": 3, "slug": "toggle_bit", "title_ko": "특정 비트 토글(Toggle)", "title_en": "Toggle a specific bit", "difficulty": "easy", "tags": ["register", "xor"], "prompt_ko": "value 의 bit 번째 비트를 반전해 반환하라.", "prompt_en": "Flip bit `bit` of `value` and return the result.", "signature": "uint32_t toggle_bit(uint32_t value, uint8_t bit)", "examples": [{"in": "toggle_bit(0x10, 4)", "out": "0x0"}, {"in": "toggle_bit(0x00, 4)", "out": "0x10"}], "hints": ["XOR 은 같은 비트와 연산 시 반전.", "마스크는 (1u \u003c\u003c bit)."], "solution": "uint32_t toggle_bit(uint32_t value, uint8_t bit) {\n    if (bit >= 32u) return value;\n    return value ^ (1u \u003c\u003c bit);\n}", "explanation_ko": "XOR 은 1과 만나면 반전, 0과 만나면 유지. 마스크의 해당 자리만 1이므로 그 비트만 상태가 뒤집힌다.", "complexity": "O(1) time, O(1) space", "pitfalls": ["부호/시프트 폭 UB", "두 번 토글하면 원상복귀(속성 활용/함정)"], "anduril_context": "LED heartbeat 토글, 디버그 핀 스트로브."}, {"num": 4, "slug": "is_bit_set", "title_ko": "특정 비트 확인(Test)", "title_en": "Test if a bit is set", "difficulty": "easy", "tags": ["register", "polling"], "prompt_ko": "value 의 bit 번째 비트가 1이면 true 를 반환하라.", "prompt_en": "Return true if bit `bit` of `value` is set.", "signature": "bool is_bit_set(uint32_t value, uint8_t bit)", "examples": [{"in": "is_bit_set(0x10, 4)", "out": "true"}, {"in": "is_bit_set(0x10, 3)", "out": "false"}], "hints": ["AND 로 해당 비트만 추출.", "결과를 != 0 으로 명시 변환해 bool 로."], "solution": "bool is_bit_set(uint32_t value, uint8_t bit) {\n    if (bit >= 32u) return false;\n    return (value & (1u \u003c\u003c bit)) != 0u;\n}", "explanation_ko": "value & (1u\u003c\u003cbit) 는 그 비트가 1이면 (1\u003c\u003cbit), 아니면 0. bool 반환이라 !=0 으로 0/1 로 정규화한다(bit>0 자리를 그냥 bool 캐스트하면 값이 커도 true 지만 명시성이 떨어짐).", "complexity": "O(1) time, O(1) space", "pitfalls": ["bool 반환에 int 마스크 그대로 넣으면 컴파일러/린트 경고 가능", "시프트 폭 UB"], "anduril_context": "센서 DATA_READY 비트 폴링, ESC 폴트 플래그 판독."}, {"num": 5, "slug": "swap_nibbles", "title_ko": "니블 스왑", "title_en": "Swap nibbles", "difficulty": "easy", "tags": ["nibble", "byte", "cast"], "prompt_ko": "바이트의 상위 4비트와 하위 4비트를 맞바꿔 반환하라.", "prompt_en": "Swap the upper and lower 4-bit nibbles of a byte.", "signature": "uint8_t swap_nibbles(uint8_t value)", "examples": [{"in": "swap_nibbles(0xAB)", "out": "0xBA"}, {"in": "swap_nibbles(0x0F)", "out": "0xF0"}], "hints": ["상위로 올릴 니블은 \u003c\u003c 4, 내릴 니블은 >> 4.", "OR 로 합친다.", "uint8_t 승격 때문에 (uint8_t) 캐스트로 상위 비트를 자른다."], "solution": "uint8_t swap_nibbles(uint8_t value) {\n    return (uint8_t)((value \u003c\u003c 4) | (value >> 4));\n}", "explanation_ko": "value\u003c\u003c4 는 하위 니블을 상위로, value>>4 는 상위 니블을 하위로 옮긴다. uint8_t 는 연산 시 int 로 승격되어 \u003c\u003c4 의 상위 비트가 살아있으므로 (uint8_t) 로 하위 8비트만 취한다.", "complexity": "O(1) time, O(1) space", "pitfalls": ["캐스트 누락 시 상위 비트 잔존으로 값 오염", "16/32비트로 확장하면 마스크 필요"], "anduril_context": "BCD 코덱, 세븐세그먼트 매핑, 바이트 내 필드 재배치."}, {"num": 6, "slug": "parity_even", "title_ko": "짝수 패리티", "title_en": "Even parity", "difficulty": "medium", "tags": ["parity", "xor-fold", "popcount"], "prompt_ko": "value 의 1비트 개수가 짝수면 true(0개도 짝수), 홀수면 false 를 반환하라.", "prompt_en": "Return true if the number of set bits is EVEN (zero counts as even).", "signature": "bool parity_even(uint32_t value)", "examples": [{"in": "parity_even(0x5)", "out": "true (1이 2개)"}, {"in": "parity_even(0x7)", "out": "false (3개)"}], "hints": ["순진하게 비트를 하나씩 XOR 누적해도 된다.", "브랜치리스: 상위 절반을 하위로 XOR-fold 반복.", "최종 최하위 비트가 1이면 1의 개수가 홀수."], "solution": "bool parity_even(uint32_t value) {\n    value ^= value >> 16;\n    value ^= value >> 8;\n    value ^= value >> 4;\n    value ^= value >> 2;\n    value ^= value >> 1;\n    return (value & 1u) == 0u;\n}", "explanation_ko": "XOR 은 교환·결합법칙이 성립하고 1 XOR 1 = 0 이므로 전체 비트를 XOR 로 접으면 최하위 비트에 1의 개수의 홀짝(패리티)이 모인다. 절반씩 접어 O(log n). 최하위=1 이면 홀수 → 짝수 판정은 그 반대.", "complexity": "O(1) time (32비트 고정, 5 스텝), O(1) space", "pitfalls": ["패리티 정의(짝수=true vs 홀수=true) 명세 확인 필수", "원본 소스는 기대값이 서로 어긋나 있었음 — 여기선 짝수=true 로 고정"], "anduril_context": "UART 프레임 패리티 비트, 텔레메트리/통신 링크 오류 검출."}, {"num": 7, "slug": "clear_lsb", "title_ko": "최하위 설정 비트 클리어", "title_en": "Clear lowest set bit", "difficulty": "easy", "tags": ["bit-trick", "kernighan"], "prompt_ko": "가장 낮은 설정 비트(LSB) 하나를 0으로 만들어 반환하라.", "prompt_en": "Clear the lowest set bit of value.", "signature": "uint32_t clear_lsb(uint32_t value)", "examples": [{"in": "clear_lsb(0x18)", "out": "0x10"}, {"in": "clear_lsb(0x1)", "out": "0x0"}], "hints": ["value 에서 1을 빼면 어떤 비트가 바뀌나 관찰.", "value & (value-1)."], "solution": "uint32_t clear_lsb(uint32_t value) {\n    return value & (value - 1u);\n}", "explanation_ko": "value-1 은 최하위 1을 0으로, 그 아래 0들을 1로 바꾼다. AND 하면 최하위 1 자리만 지워지고 나머지는 유지. value==0 이면 0u-1=0xFFFFFFFF, 0&... =0 이라 안전.", "complexity": "O(1) time, O(1) space", "pitfalls": ["부호 있는 타입에서 0-1 은 UB 아님이나 해석 주의", "이 트릭 반복으로 popcount 구현 가능"], "anduril_context": "set 비트 순회 popcount, 대기 이벤트 마스크 소비."}, {"num": 8, "slug": "rightmost_set_bit", "title_ko": "최하위 1비트 분리", "title_en": "Isolate lowest set bit", "difficulty": "easy", "tags": ["bit-trick", "twos-complement"], "prompt_ko": "가장 오른쪽 1비트만 남기고 나머지는 0으로 만들어 반환하라.", "prompt_en": "Return only the lowest set bit of value.", "signature": "uint32_t rightmost_set_bit(uint32_t value)", "examples": [{"in": "rightmost_set_bit(0x18)", "out": "0x8"}, {"in": "rightmost_set_bit(0x80000000)", "out": "0x80000000"}], "hints": ["2의 보수에서 -v = ~v + 1.", "value & (-value).", "unsigned 부정은 0u - value 로 명시하면 wrap 이 정의됨."], "solution": "uint32_t rightmost_set_bit(uint32_t value) {\n    return value & (uint32_t)(0u - value);\n}", "explanation_ko": "-value 는 최하위 1비트 아래는 0, 그 위는 value 의 반전 형태가 되어, AND 하면 최하위 1비트만 공통으로 살아남는다. unsigned 부정(0u-value)은 well-defined wrap.", "complexity": "O(1) time, O(1) space", "pitfalls": ["signed 로 -INT_MIN 하면 UB — unsigned 로 계산", "value==0 이면 0 반환(정상)"], "anduril_context": "가장 낮은 대기 IRQ 선택, 스케줄러 ready 마스크에서 최우선 태스크 추출."}, {"num": 9, "slug": "is_opposite_sign", "title_ko": "부호 다름 판별", "title_en": "Opposite signs", "difficulty": "easy", "tags": ["sign", "xor", "branchless"], "prompt_ko": "두 정수의 부호가 서로 다르면 true 를 반환하라(분기 없이).", "prompt_en": "Return true if a and b have opposite signs, without branching.", "signature": "bool is_opposite_sign(int32_t a, int32_t b)", "examples": [{"in": "is_opposite_sign(-5, 7)", "out": "true"}, {"in": "is_opposite_sign(0, -1)", "out": "true"}], "hints": ["부호는 최상위 비트(MSB)에 있다.", "XOR 하면 부호가 다를 때만 MSB=1.", "결과가 음수인지 보면 된다."], "solution": "bool is_opposite_sign(int32_t a, int32_t b) {\n    return (a ^ b) \u003c 0;\n}", "explanation_ko": "부호가 다르면 두 부호비트 중 정확히 하나가 1이라 XOR 의 MSB=1 → 결과가 음수. 0은 부호비트 0이라 양수로 취급된다. 비교/곱셈 없이 한 줄.", "complexity": "O(1) time, O(1) space", "pitfalls": ["(a^b) 를 unsigned 로 다루면 \u003c0 항상 false — signed 유지", "0 의 부호 취급 정의를 물어라"], "anduril_context": "PID 제어 오차 부호 전환 감지, 짐벌/모터 방향 반전 검출."}, {"num": 10, "slug": "abs_no_branch", "title_ko": "분기 없는 절대값", "title_en": "Branchless absolute value", "difficulty": "medium", "tags": ["abs", "branchless", "twos-complement"], "prompt_ko": "분기문 없이 정수의 절대값을 반환하라.", "prompt_en": "Compute |value| without branching.", "signature": "int32_t abs_no_branch(int32_t value)", "examples": [{"in": "abs_no_branch(-123)", "out": "123"}, {"in": "abs_no_branch(123)", "out": "123"}], "hints": ["부호비트를 전 비트로 확장한 mask 를 만든다(음수면 -1, 양수면 0).", "(v ^ mask) - mask.", "signed >> 는 구현 정의 — unsigned 로 mask 를 만들어 UB 회피."], "solution": "int32_t abs_no_branch(int32_t value) {\n    uint32_t uv   = (uint32_t)value;\n    uint32_t mask = 0u - (uv >> 31);\n    return (int32_t)((uv ^ mask) - mask);\n}", "explanation_ko": "mask 는 음수면 0xFFFFFFFF(-1), 양수면 0. 음수면 (v ^ -1) - (-1) = ~v + 1 = -v = |v|, 양수면 (v ^ 0) - 0 = v. 부호비트를 unsigned 시프트로 뽑고 전 과정을 unsigned 로 계산해 signed overflow UB 를 피한다.", "complexity": "O(1) time, O(1) space", "pitfalls": ["signed value>>31 은 구현 정의(논리 시프트 가정 위험)", "INT32_MIN 은 절대값 표현 불가 — 결과가 그대로 INT32_MIN"], "anduril_context": "센서 오차 크기 계산, DSP 필터에서 부호 없는 크기 비교(연산 지연 균일화)."}, {"num": 11, "slug": "range_mask", "title_ko": "범위 마스크 만들기 [lo, hi]", "title_en": "Build a bit-range mask", "difficulty": "easy", "tags": ["mask", "bit-range", "UB"], "prompt_ko": "lo번째부터 hi번째 비트까지(양 끝 포함) 1인 32비트 마스크를 반환하라. 잘못된 범위(lo>hi, hi>31)면 0.", "prompt_en": "Return a 32-bit mask with bits lo..hi (inclusive) set; 0 for an invalid range.", "signature": "uint32_t range_mask(uint8_t lo, uint8_t hi)", "examples": [{"in": "range_mask(4, 7)", "out": "0xF0"}, {"in": "range_mask(0, 31)", "out": "0xFFFFFFFF"}], "hints": ["폭 width = hi - lo + 1 개의 1을 만들고 lo 만큼 올린다.", "width==32 이면 (1u \u003c\u003c 32) 는 UB — 분기하거나 다른 방법이 필요하다.", "(~0u >> (31 - hi)) & (~0u \u003c\u003c lo) — 시프트 폭이 항상 0..31 이라 UB 없음."], "solution": "uint32_t range_mask(uint8_t lo, uint8_t hi) {\n    if (hi > 31u || lo > hi) return 0u;\n    /* 함정: width==32 일 때 (1u \u003c\u003c 32) - 1 은 UB.\n       해법 A: width 로 분기.   해법 B(아래): 양쪽에서 잘라내기 — 시프트 폭이 항상 0..31.\n         ~0u >> (31 - hi)  : hi 위쪽 비트를 0 으로\n         ~0u \u003c\u003c lo         : lo 아래쪽 비트를 0 으로\n       두 개를 AND 하면 [lo, hi] 만 남는다. */\n    return (~0u >> (31u - hi)) & (~0u \u003c\u003c lo);\n}", "explanation_ko": "~0u >> (31-hi) 는 hi 위쪽을, ~0u \u003c\u003c lo 는 lo 아래쪽을 0으로 만든다. 둘을 AND 하면 [lo, hi] 만 남는다. (1u\u003c\u003cwidth)-1 방식은 width==32 에서 UB 이므로 면접에서 이 함정을 먼저 말하면 가점.", "complexity": "O(1) time, O(1) space", "pitfalls": ["(1u \u003c\u003c 32) - 1 은 UB (전체 32비트 범위)", "1 대신 1u — 31번 비트에서 signed UB", "inclusive/exclusive 범위 정의를 먼저 확인할 것"], "anduril_context": "레지스터의 한 필드(예: 클럭 분주비 bit[7:4], ADC 채널 선택 bit[4:0])를 다루는 드라이버 코드. 온사이트에서 가장 자주 나오는 비트 문제 유형."}, {"num": 12, "slug": "set_bits_range", "title_ko": "범위 비트 세우기", "title_en": "Set a bit range", "difficulty": "easy", "tags": ["mask", "set", "bit-range"], "prompt_ko": "value의 lo~hi 비트를 전부 1로 만들어 반환하라.", "prompt_en": "Set bits lo..hi of value.", "signature": "uint32_t set_bits_range(uint32_t value, uint8_t lo, uint8_t hi)", "examples": [{"in": "set_bits_range(0x00, 4, 7)", "out": "0xF0"}, {"in": "set_bits_range(0x0F, 2, 5)", "out": "0x3F"}], "hints": ["range_mask 를 재사용한다.", "OR 로 세운다."], "solution": "uint32_t set_bits_range(uint32_t value, uint8_t lo, uint8_t hi) {\n    return value | range_mask(lo, hi);     /* 잘못된 범위면 mask=0 -> value 그대로 */\n}", "explanation_ko": "value | mask. 잘못된 범위면 mask=0 이라 value 가 그대로 나온다.", "complexity": "O(1)", "pitfalls": ["루프로 비트 하나씩 세우기 — 동작은 하지만 면접에선 마스크 한 번을 기대"], "anduril_context": "레지스터의 한 필드(예: 클럭 분주비 bit[7:4], ADC 채널 선택 bit[4:0])를 다루는 드라이버 코드. 온사이트에서 가장 자주 나오는 비트 문제 유형."}, {"num": 13, "slug": "clear_bits_range", "title_ko": "범위 비트 끄기", "title_en": "Clear a bit range", "difficulty": "easy", "tags": ["mask", "clear", "bit-range"], "prompt_ko": "value의 lo~hi 비트를 전부 0으로 만들어 반환하라.", "prompt_en": "Clear bits lo..hi of value.", "signature": "uint32_t clear_bits_range(uint32_t value, uint8_t lo, uint8_t hi)", "examples": [{"in": "clear_bits_range(0xFFFFFFFF, 8, 15)", "out": "0xFFFF00FF"}, {"in": "clear_bits_range(0xFF, 0, 3)", "out": "0xF0"}], "hints": ["마스크를 반전(~)해서 AND."], "solution": "uint32_t clear_bits_range(uint32_t value, uint8_t lo, uint8_t hi) {\n    return value & ~range_mask(lo, hi);    /* 잘못된 범위면 ~0 과 AND -> value 그대로 */\n}", "explanation_ko": "value & ~mask. 잘못된 범위면 ~0 과 AND 라 value 가 그대로 나온다.", "complexity": "O(1)", "pitfalls": ["~ 를 빼먹고 value & mask 로 쓰면 오히려 범위만 남는다"], "anduril_context": "레지스터의 한 필드(예: 클럭 분주비 bit[7:4], ADC 채널 선택 bit[4:0])를 다루는 드라이버 코드. 온사이트에서 가장 자주 나오는 비트 문제 유형."}, {"num": 14, "slug": "toggle_bits_range", "title_ko": "범위 비트 뒤집기", "title_en": "Toggle a bit range", "difficulty": "easy", "tags": ["mask", "toggle", "xor"], "prompt_ko": "value의 lo~hi 비트를 전부 반전해 반환하라.", "prompt_en": "Toggle bits lo..hi of value.", "signature": "uint32_t toggle_bits_range(uint32_t value, uint8_t lo, uint8_t hi)", "examples": [{"in": "toggle_bits_range(0xF0, 0, 7)", "out": "0x0F"}, {"in": "toggle_bits_range(0xAAAA, 4, 11)", "out": "0xA55A"}], "hints": ["XOR 는 마스크가 1인 자리만 뒤집는다."], "solution": "uint32_t toggle_bits_range(uint32_t value, uint8_t lo, uint8_t hi) {\n    return value ^ range_mask(lo, hi);\n}", "explanation_ko": "value ^ mask.", "complexity": "O(1)", "pitfalls": ["레지스터에서 토글은 read-modify-write — ISR과 공유하면 원자성 문제"], "anduril_context": "레지스터의 한 필드(예: 클럭 분주비 bit[7:4], ADC 채널 선택 bit[4:0])를 다루는 드라이버 코드. 온사이트에서 가장 자주 나오는 비트 문제 유형."}, {"num": 15, "slug": "get_bits_range", "title_ko": "범위 필드 읽기", "title_en": "Extract a bit field", "difficulty": "easy", "tags": ["mask", "extract", "field"], "prompt_ko": "value의 lo~hi 비트 값을 읽어, 0번 비트부터 정렬된 값으로 반환하라.", "prompt_en": "Return bits lo..hi of value, right-aligned.", "signature": "uint32_t get_bits_range(uint32_t value, uint8_t lo, uint8_t hi)", "examples": [{"in": "get_bits_range(0xABCD, 4, 11)", "out": "0xBC"}, {"in": "get_bits_range(0xDEADBEEF, 16, 23)", "out": "0xAD"}], "hints": ["마스크로 자른 뒤 lo 만큼 오른쪽으로 내린다.", "또는 먼저 내리고 폭 마스크로 자른다 — 폭 32 UB 주의."], "solution": "uint32_t get_bits_range(uint32_t value, uint8_t lo, uint8_t hi) {\n    if (hi > 31u || lo > hi) return 0u;\n    return (value & range_mask(lo, hi)) >> lo;   /* 마스크로 잘라낸 뒤 아래로 내린다 */\n}", "explanation_ko": "(value & mask) >> lo. 순서를 '내리고 자르기'로 하면 폭 마스크 (1u\u003c\u003cwidth)-1 이 필요해 width==32 UB 함정이 다시 생긴다.", "complexity": "O(1)", "pitfalls": ["시프트를 빼먹고 마스크만 적용 — 값이 lo 만큼 올라간 채로 나옴"], "anduril_context": "레지스터의 한 필드(예: 클럭 분주비 bit[7:4], ADC 채널 선택 bit[4:0])를 다루는 드라이버 코드. 온사이트에서 가장 자주 나오는 비트 문제 유형."}, {"num": 16, "slug": "set_field", "title_ko": "범위 필드에 값 쓰기 (RMW)", "title_en": "Write a bit field (read-modify-write)", "difficulty": "medium", "tags": ["mask", "field", "register", "rmw"], "prompt_ko": "value의 lo~hi 필드에 field 값을 쓰고 나머지 비트는 유지하라. field가 폭보다 크면 넘치는 비트는 잘라낸다.", "prompt_en": "Write field into bits lo..hi, preserving all other bits; truncate field to the field width.", "signature": "uint32_t set_field(uint32_t value, uint8_t lo, uint8_t hi, uint32_t field)", "examples": [{"in": "set_field(0xFFFF, 4, 7, 0x0)", "out": "0xFF0F"}, {"in": "set_field(0x1234, 8, 11, 0x1F)", "out": "0x1F34"}], "hints": ["① 필드 자리를 비운다: value & ~mask", "② 새 값을 lo 만큼 올린다: field \u003c\u003c lo", "③ 마스크로 잘라서 OR: ((field \u003c\u003c lo) & mask) — 넘친 비트가 이웃 필드를 오염시키지 않게."], "solution": "uint32_t set_field(uint32_t value, uint8_t lo, uint8_t hi, uint32_t field) {\n    uint32_t mask = range_mask(lo, hi);\n    if (mask == 0u) return value;\n    /* ① 필드 자리를 0으로 비우고  ② 새 값을 lo 만큼 올린 뒤 마스크로 잘라 OR.\n       (field \u003c\u003c lo) & mask 순서가 중요: 넘치는 상위 비트가 이웃 필드를 오염시키지 않는다. */\n    return (value & ~mask) | ((field \u003c\u003c lo) & mask);\n}", "explanation_ko": "(value & ~mask) | ((field \u003c\u003c lo) & mask). 실제 드라이버의 레지스터 필드 쓰기와 똑같다. 마스크로 자르지 않으면 폭보다 큰 field 가 옆 필드를 덮어쓴다 — 면접관이 일부러 넘치는 값을 넣어본다.", "complexity": "O(1)", "pitfalls": ["field 를 마스크로 자르지 않아 이웃 필드 오염", "필드 자리를 비우지 않고 OR 만 함 — 1→0 이 안 됨", "volatile 레지스터면 읽기 1회·쓰기 1회로 끝낼 것"], "anduril_context": "레지스터의 한 필드(예: 클럭 분주비 bit[7:4], ADC 채널 선택 bit[4:0])를 다루는 드라이버 코드. 온사이트에서 가장 자주 나오는 비트 문제 유형."}, {"num": 17, "slug": "set_bits_n", "title_ko": "pos부터 n개 비트 세우기", "title_en": "Set n bits starting at pos", "difficulty": "easy", "tags": ["mask", "bit-range", "kandr"], "prompt_ko": "pos번째 비트부터 count개 비트를 1로 만들어 반환하라. 31번 비트를 넘어가거나 count가 0이면 value 그대로.", "prompt_en": "Set count bits starting at bit pos; return value unchanged if out of range or count is 0.", "signature": "uint32_t set_bits_n(uint32_t value, uint8_t pos, uint8_t count)", "examples": [{"in": "set_bits_n(0x0, 4, 4)", "out": "0xF0"}, {"in": "set_bits_n(0x0, 0, 32)", "out": "0xFFFFFFFF"}], "hints": ["[pos, pos+count-1] 범위로 바꾸면 range_mask 로 환원된다.", "범위 검사: count > 32 - pos 이면 넘어간다 (pos+count 오버플로 없이 비교)."], "solution": "uint32_t set_bits_n(uint32_t value, uint8_t pos, uint8_t count) {\n    if (count == 0u || pos > 31u || count > 32u - pos) return value;\n    /* 위치+개수 -> [lo, hi] 로 바꾸면 11번 문제로 환원된다: hi = pos + count - 1 */\n    return value | range_mask(pos, (uint8_t)(pos + count - 1u));\n}", "explanation_ko": "위치+개수 표기(K&R getbits 스타일)를 [lo, hi] 로 바꿔 11번을 재사용. 면접에서는 '양 끝 포함 범위'로 묻는지 '위치+개수'로 묻는지를 먼저 확인하는 게 포인트.", "complexity": "O(1)", "pitfalls": ["pos + count > 32 를 그대로 쓰면 uint8_t 승격은 안전하지만 타입에 따라 오버플로 가능", "count==0 처리 누락 시 hi = pos-1 로 뒤집힘"], "anduril_context": "레지스터의 한 필드(예: 클럭 분주비 bit[7:4], ADC 채널 선택 bit[4:0])를 다루는 드라이버 코드. 온사이트에서 가장 자주 나오는 비트 문제 유형."}]}, {"id": "bit_advanced", "order": 2, "range": "Q11-25", "icon": "🧮", "title_en": "Bit Manipulation Advanced", "title_ko": "비트 조작 심화", "summary_ko": "레지스터 필드, 엔디안, gray code, popcount, 회전 등 드론 펌웨어의 저수준 비트 연산 15문제. 시프트 UB 가드가 핵심.", "summary_en": "15 low-level bit-manipulation problems (register fields, endianness, gray code, popcount, rotation) with a focus on avoiding shift UB.", "anduril_relevance_ko": "Anduril FW 인터뷰는 하드웨어 레지스터 read/modify/write, MAVLink류 프로토콜의 network byte order 변환, 엔코더 gray code 디코딩, 활성 채널 popcount 같은 실무 비트 연산을 직접 손코딩시킨다. 특히 rotate/시프트의 UB(k>=width)와 레지스터 필드 마스킹 정확성이 드론 비행제어/센서 드라이버 신뢰성에 직결된다.", "concepts": [{"term": "shift UB", "ko": "시프트량이 타입 폭(32) 이상이면 정의되지 않은 동작 — rotate/필드에서 반드시 가드", "en": "Shifting by >= type width is undefined behavior; guard rotate and field ops."}, {"term": "n & (n-1)", "ko": "최하위 set bit 제거 — popcount와 2의 거듭제곱 판정의 뿌리", "en": "Clears the lowest set bit; basis of popcount and power-of-two test."}, {"term": "field mask", "ko": "(1u\u003c\u003cwidth)-1 로 width개의 1 생성 (width\u003c32에서만 안전)", "en": "(1u\u003c\u003cwidth)-1 builds a width-bit mask; safe only for width\u003c32."}, {"term": "read-modify-write", "ko": "필드 갱신은 clear(& ~mask) 후 삽입(| value) — MMIO면 volatile+race 주의", "en": "Update a field by clearing then OR-ing; MMIO needs volatile and race care."}, {"term": "endianness", "ko": "network(big) vs host(ARM little) 바이트 순서 — 프로토콜 파싱 필수", "en": "Byte order network(big) vs host(little); essential for protocol parsing."}, {"term": "gray code", "ko": "연속 값이 1비트만 다름 (n^(n>>1)) — 엔코더 전이 오류 방지", "en": "Adjacent values differ by one bit; prevents encoder transition glitches."}, {"term": "rotate", "ko": "밀려난 비트를 반대편으로 넣기; k&=31 정규화 + k==0 가드", "en": "Bits wrap around; normalize k&=31 and guard k==0."}, {"term": "SWAR", "ko": "마스크 병렬 처리로 반복문 없이 O(1) (reverseBits, popcount)", "en": "Parallel masked ops give O(1) without loops (reverseBits, popcount)."}], "study_note_md": "# 비트 조작 심화 (Bit Manipulation Advanced) — Q11-25 🧮\n\n> 레지스터 필드, 프로토콜 바이트 순서, 엔코더 gray code, popcount 등 드론/무기체계 펌웨어의 저수준 비트 연산 총정리. Anduril FW 인터뷰 단골 주제.\n\n---\n\n## 0. 왜 이게 인터뷰에 나오나\n\n임베디드/펌웨어는 결국 **레지스터에 비트를 쓰고, 버스에서 바이트를 읽는** 일이다. Anduril 같은 방산 드론 회사의 FW 인터뷰에서는:\n\n- **하드웨어 레지스터 필드** read/modify/write (`set_field`/`get_field`)\n- **프로토콜 파서** — MAVLink/커스텀 텔레메트리의 network byte order 처리 (`swap_endian32`)\n- **엔코더/ADC** — 기계식 회전 엔코더의 gray code 디코딩\n- **상태 비트마스크** — 활성 채널 수 세기 (`hamming_weight`)\n- **버퍼/DMA 정렬** — 2의 거듭제곱 크기 정렬 (`next_power_of_two`)\n\n이 15문제는 그 근육을 만드는 드릴이다.\n\n---\n\n## 1. 반드시 기억할 UB(정의되지 않은 동작) 함정\n\nC에서 **시프트량이 타입 폭 이상이면 UB**다. 32비트에서:\n\n```c\nuint32_t x;\nx >> 32;   // UB! (0 이 아님)\nx \u003c\u003c 32;   // UB!\n1u \u003c\u003c 32;  // UB!\n```\n\n이 때문에 원본 코드의 두 버그가 나온다:\n\n| 함수 | 원본 버그 | 수정 |\n|------|-----------|------|\n| `rotate_left/right` | `k==0` 이면 `n >> (32-0)` = `n >> 32` UB. `k>=32` 도 UB. | `k &= 31; if(k==0) return n;` |\n| `next_power_of_two` | 스텁 미구현 (`if(n==0){} return 0;`) | 채움-후-+1 알고리즘 |\n| `prev_power_of_two` | `p\u003c\u003c=1` 루프가 `n>=2^31` 에서 오버플로 → 무한루프 | 최상위 비트만 남기는 비트 채움 |\n| `width==32` 필드 | `(1u\u003c\u003c32)-1` UB | `width>=32 ? 0xFFFFFFFF : ...` 분기 |\n\n---\n\n## 2. 문제별 핵심\n\n### 11. reverseBits — 비트 순서 뒤집기\n```c\nuint32_t reverseBits(uint32_t n) {\n    n = ((n >> 1) & 0x55555555u) | ((n & 0x55555555u) \u003c\u003c 1);\n    n = ((n >> 2) & 0x33333333u) | ((n & 0x33333333u) \u003c\u003c 2);\n    n = ((n >> 4) & 0x0F0F0F0Fu) | ((n & 0x0F0F0F0Fu) \u003c\u003c 4);\n    n = ((n >> 8) & 0x00FF00FFu) | ((n & 0x00FF00FFu) \u003c\u003c 8);\n    n = (n >> 16) | (n \u003c\u003c 16);\n    return n;\n}\n```\n- **반복문 방식**은 코드가 단순(32회 루프), **SWAR**는 O(1) 상수 시간이라 임베디드에서 선호.\n- lookup table(256B)은 빠르지만 작은 MCU에선 ROM 부담.\n\n### 12. hamming_weight (popcount)\n```c\nwhile (n) { n &= (n - 1); count++; }   // Kernighan: 1의 개수만큼만 반복\n```\n- GCC/Clang은 `__builtin_popcount` 제공(하드웨어 popcnt 명령). 인터뷰에선 손으로.\n\n### 13. is_power_of_two\n```c\nreturn n && !(n & (n - 1));   // 0 을 반드시 걸러라!\n```\n- 함정: `n==0` 이면 `!(0 & -1)` = true 가 되어버림 → `n &&` 필수.\n\n### 14. swap_odd_even_bits\n```c\nreturn ((n & 0xAAAAAAAAu) >> 1) | ((n & 0x55555555u) \u003c\u003c 1);\n```\n\n### 15-17. extract / set / invert bit range (`[start, end]` 포함)\n```c\nuint8_t width = end - start + 1;\nuint32_t mask = (width >= 32) ? 0xFFFFFFFFu : (((1u \u003c\u003c width) - 1u) \u003c\u003c start);\n// extract: (n & mask) >> start\n// set:     (n & ~mask) | ((value \u003c\u003c start) & mask)\n// invert:  n ^ mask\n```\n- **핵심 마스크 관용구**: `(1u \u003c\u003c width) - 1` = width개의 1. `width==32` 만 분기.\n\n### 18. next / prev power of two\n```c\nuint32_t next_power_of_two(uint32_t n) {   // 올림\n    if (n == 0) return 1;\n    n--; n|=n>>1; n|=n>>2; n|=n>>4; n|=n>>8; n|=n>>16;\n    return n + 1;\n}\nuint32_t prev_power_of_two(uint32_t n) {   // 내림 = 최상위 set bit\n    if (n == 0) return 0;\n    n|=n>>1; n|=n>>2; n|=n>>4; n|=n>>8; n|=n>>16;\n    return n - (n >> 1);\n}\n```\n- `n--` 을 먼저 하는 이유: 이미 2의 거듭제곱이면 자기 자신을 반환하기 위해.\n- `next`: `n > 2^31` 이면 결과가 32비트 초과 → 0 오버플로 (호출측 책임).\n\n### 19. xor_swap\n```c\nif (a == NULL || b == NULL || a == b) return;   // a==b 가드 필수 (0 됨)\n*a ^= *b; *b ^= *a; *a ^= *b;\n```\n- 실무에선 임시변수가 더 빠르고 안전. **인터뷰 트릭**으로만 의미.\n\n### 20. rotate_left / rotate_right\n```c\nuint32_t rotate_left(uint32_t n, uint8_t k) {\n    k &= 31u; if (k == 0) return n;\n    return (n \u003c\u003c k) | (n >> (32 - k));\n}\n```\n- **원본 버그**: `k==0`/`k>=32` UB. `k &= 31` + `k==0` early return 으로 해결.\n\n### 21. swap_endian32 (프로토콜 byte order!)\n```c\nreturn ((n>>24)&0xFF) | ((n>>8)&0xFF00) | ((n\u003c\u003c8)&0xFF0000) | ((n\u003c\u003c24)&0xFF000000);\n```\n- network(big-endian) ↔ host(대개 little-endian ARM). `__builtin_bswap32` 도 있음.\n\n### 22. get_field / set_field (레지스터 비트필드)\n```c\nuint32_t get_field(uint32_t reg, uint8_t pos, uint8_t width) {\n    uint32_t fm = (width>=32) ? 0xFFFFFFFFu : ((1u\u003c\u003cwidth)-1u);\n    return (reg >> pos) & fm;\n}\nuint32_t set_field(uint32_t reg, uint8_t pos, uint8_t width, uint32_t value) {\n    uint32_t fm = (width>=32) ? 0xFFFFFFFFu : ((1u\u003c\u003cwidth)-1u);\n    uint32_t mask = fm \u003c\u003c pos;\n    return (reg & ~mask) | ((value \u003c\u003c pos) & mask);\n}\n```\n- C의 `struct` bit-field 대신 직접 마스킹 → 이식성/명확성. MMIO는 `volatile` 필수(실무).\n\n### 23-24. gray code (엔코더 오류 방지)\n```c\nuint32_t binary_to_gray(uint32_t n) { return n ^ (n >> 1); }\nuint32_t gray_to_binary(uint32_t n) {\n    uint32_t res = n;\n    while (n >>= 1) res ^= n;\n    return res;\n}\n```\n- 연속 값이 **정확히 1비트만** 바뀜 → 기계식 엔코더 전이 오류 최소화.\n\n### 25. mul_pow2 / div_pow2\n```c\nuint32_t mul_pow2(uint32_t n, uint8_t k) { return (k>=32) ? 0u : (n \u003c\u003c k); }\nuint32_t div_pow2(uint32_t n, uint8_t k) { return (k>=32) ? 0u : (n >> k); }\n```\n- **부호없는** 값에만 안전. 음수 나눗셈은 산술 시프트라 `-1 >> 1 == -1`(0 아님) → 별개 함정.\n\n---\n\n## 3. 인터뷰 팔로우업 (자주 나오는 꼬리질문)\n\n1. **\"popcount를 O(1)로 하려면?\"** → SWAR 병렬 합산 또는 하드웨어 `popcnt`/`__builtin_popcount`.\n2. **\"rotate가 왜 UB가 될 수 있나?\"** → `n >> (32-k)` 에서 `k==0` → shift by 32. `k &= 31` 로 정규화하되 `k==0` 별도 처리.\n3. **\"endianness를 런타임에 어떻게 감지?\"** → `union { uint32_t u; uint8_t b[4]; }` 로 `b[0]` 확인.\n4. **\"MMIO 레지스터 read/modify/write의 위험?\"** → 비원자적. ISR/DMA와 race → `volatile` + 인터럽트 마스킹 or 하드웨어 bit-band(Cortex-M).\n5. **\"gray code를 왜 쓰나?\"** → 다중 비트 동시 전이 시 중간 글리치 값 방지 (엔코더, 클럭 도메인 크로싱 FIFO 포인터).\n6. **\"`n & (n-1)` 의 의미는?\"** → 최하위 set bit 하나 제거. popcount, is_power_of_two 둘 다 여기서 파생.\n\n---\n\n## 4. 치트시트\n\n| 관용구 | 의미 |\n|--------|------|\n| `n & (n-1)` | 최하위 1비트 제거 |\n| `n & -n` | 최하위 1비트만 남김 (isolate) |\n| `n \\| (n-1)` | 최하위 0비트들 채움 |\n| `n && !(n & (n-1))` | 2의 거듭제곱 판정 |\n| `(1u \u003c\u003c w) - 1` | w개의 1 마스크 (w\u003c32 만!) |\n| `x ^ (x>>1)` | binary → gray |\n| `k &= 31` | 회전량 mod 32 정규화 |\n\n빌드/실행:\n```sh\ncc -std=c11 -Wall -Wextra 02_bit_advanced.c -o /tmp/andb_bit_advanced && /tmp/andb_bit_advanced\n```\n", "problems": [{"num": 11, "slug": "reverse-bits", "title_ko": "비트 순서 뒤집기", "title_en": "reverseBits", "difficulty": "medium", "tags": ["bit-reverse", "SWAR", "O(1)"], "prompt_ko": "32비트 정수의 비트 순서를 MSB\u003c->LSB로 완전히 뒤집어라.", "prompt_en": "Reverse the full bit order of a 32-bit integer (MSB\u003c->LSB).", "signature": "uint32_t reverseBits(uint32_t n)", "examples": [{"in": "0xF0F0F0F0", "out": "0x0F0F0F0F"}, {"in": "1", "out": "0x80000000"}], "hints": ["반복문: 32번 돌며 res\u003c\u003c1, res|=(n&1), n>>1.", "더 빠르게: 1-2-4-8-16 단위 그룹을 마스크로 병렬 교환(SWAR).", "SWAR는 반복문 없이 O(1) 상수 시간 — 임베디드에서 선호."], "solution": "uint32_t reverseBits(uint32_t n) {\n    n = ((n >> 1) & 0x55555555u) | ((n & 0x55555555u) \u003c\u003c 1);\n    n = ((n >> 2) & 0x33333333u) | ((n & 0x33333333u) \u003c\u003c 2);\n    n = ((n >> 4) & 0x0F0F0F0Fu) | ((n & 0x0F0F0F0Fu) \u003c\u003c 4);\n    n = ((n >> 8) & 0x00FF00FFu) | ((n & 0x00FF00FFu) \u003c\u003c 8);\n    n = (n >> 16) | (n \u003c\u003c 16);\n    return n;\n}", "explanation_ko": "인접 비트 쌍부터 시작해 그룹 크기를 2배씩 키우며 좌우를 맞바꾼다. 각 단계는 마스크 AND 후 시프트로 두 반쪽을 교환. 5단계로 32비트 전체가 뒤집힌다.", "complexity": "O(1) time, O(1) space", "pitfalls": ["반복문 방식은 정답이지만 32회 루프로 느림", "부호있는 int로 하면 산술 시프트 함정 — uint32_t 사용"], "anduril_context": "SPI/센서 스트림에서 LSB-first 하드웨어 데이터를 MSB-first로 정렬할 때."}, {"num": 12, "slug": "hamming-weight", "title_ko": "해밍 가중치 (popcount)", "title_en": "hamming_weight", "difficulty": "easy", "tags": ["popcount", "kernighan", "bitcount"], "prompt_ko": "정수에서 1로 설정된 비트의 개수를 세라.", "prompt_en": "Count the number of set bits (Hamming weight / popcount).", "signature": "uint32_t hamming_weight(uint32_t n)", "examples": [{"in": "0xF0F0F0F0", "out": "16"}, {"in": "0", "out": "0"}], "hints": ["단순: n의 LSB를 확인하고 오른쪽 시프트 반복.", "Kernighan: n &= (n-1) 은 최하위 1비트를 지운다.", "그러면 1의 개수만큼만 루프가 돈다 (조기 종료)."], "solution": "uint32_t hamming_weight(uint32_t n) {\n    uint32_t count = 0;\n    while (n) { n &= (n - 1); count++; }\n    return count;\n}", "explanation_ko": "n & (n-1) 은 가장 낮은 1비트를 0으로 바꾼다. 이를 0이 될 때까지 반복하면 set bit 수만큼만 순회하므로 32회 고정 루프보다 빠르다.", "complexity": "O(set bits) time, O(1) space", "pitfalls": ["빌트인 __builtin_popcount 가 있지만 인터뷰에선 직접 구현 요구", "부호있는 타입에서 n>>1 하면 sign extension 위험"], "anduril_context": "활성 채널/센서 비트마스크에서 켜진 개수 카운팅, 에러정정 코드의 해밍 거리."}, {"num": 13, "slug": "is-power-of-two", "title_ko": "2의 거듭제곱 판정", "title_en": "is_power_of_two", "difficulty": "easy", "tags": ["power-of-two", "bit-trick"], "prompt_ko": "주어진 부호없는 정수가 2의 거듭제곱인지 판정하라. (0은 false)", "prompt_en": "Check if an unsigned integer is a power of two (0 is false).", "signature": "bool is_power_of_two(uint32_t n)", "examples": [{"in": "16", "out": "true"}, {"in": "18", "out": "false"}, {"in": "0", "out": "false"}], "hints": ["2의 거듭제곱은 비트가 정확히 1개.", "n & (n-1) 로 최하위 1비트를 지우면 0 이 되어야 한다.", "n==0 을 반드시 별도로 걸러라 (!(0 & -1) 은 true)."], "solution": "bool is_power_of_two(uint32_t n) {\n    return n && !(n & (n - 1));\n}", "explanation_ko": "2^k 는 단 하나의 set bit를 가진다. n & (n-1) 은 그 비트를 지워 0을 만든다. n==0 은 비트가 없으므로 n && 로 명시적으로 배제한다.", "complexity": "O(1) time, O(1) space", "pitfalls": ["n==0 가드 누락 — 가장 흔한 버그", "n-1 언더플로 걱정은 불필요 (unsigned, n!=0 보장됨)"], "anduril_context": "DMA 버퍼/정렬 크기 검증, 링버퍼 용량이 2의 거듭제곱인지 확인해 & 마스크 최적화."}, {"num": 14, "slug": "swap-odd-even-bits", "title_ko": "홀수/짝수 비트 스왑", "title_en": "swap_odd_even_bits", "difficulty": "easy", "tags": ["mask", "swap"], "prompt_ko": "짝수 위치 비트와 홀수 위치 비트를 서로 교환하라.", "prompt_en": "Swap adjacent even-position and odd-position bits.", "signature": "uint32_t swap_odd_even_bits(uint32_t n)", "examples": [{"in": "0xAAAAAAAA", "out": "0x55555555"}, {"in": "0x55555555", "out": "0xAAAAAAAA"}], "hints": ["짝수 비트 마스크는 0x55555555, 홀수 비트 마스크는 0xAAAAAAAA.", "홀수 비트를 오른쪽으로 1칸, 짝수 비트를 왼쪽으로 1칸.", "두 결과를 OR."], "solution": "uint32_t swap_odd_even_bits(uint32_t n) {\n    return ((n & 0xAAAAAAAAu) >> 1) | ((n & 0x55555555u) \u003c\u003c 1);\n}", "explanation_ko": "0xAAAA...는 홀수 인덱스(1,3,5..) 비트, 0x5555...는 짝수 인덱스 비트를 고른다. 각각 반대 방향으로 1비트 이동 후 합치면 인접 쌍이 교환된다.", "complexity": "O(1) time, O(1) space", "pitfalls": ["마스크 방향 헷갈림 — 0xA는 1010, 상위(홀수)쪽", "시프트 후 OR 대신 XOR 쓰면 오답"], "anduril_context": "특정 인터리브된 센서 데이터 포맷 재배열, 비트평면 조작."}, {"num": 15, "slug": "extract-bit-range", "title_ko": "비트 범위 추출", "title_en": "extract_bit_range", "difficulty": "easy", "tags": ["mask", "field", "shift"], "prompt_ko": "비트 [start, end] (end 포함)를 추출해 LSB 정렬로 반환하라.", "prompt_en": "Extract bits [start, end] inclusive, right-aligned.", "signature": "uint32_t extract_bit_range(uint32_t n, uint8_t start, uint8_t end)", "examples": [{"in": "0xF0F0, 4, 7", "out": "0xF"}, {"in": "0x12345678, 0, 31", "out": "0x12345678"}], "hints": ["width = end - start + 1.", "마스크 = ((1u\u003c\u003cwidth)-1) \u003c\u003c start.", "width==32 이면 1u\u003c\u003c32 는 UB → 분기로 0xFFFFFFFF 처리."], "solution": "uint32_t extract_bit_range(uint32_t n, uint8_t start, uint8_t end) {\n    uint8_t width = (uint8_t)(end - start + 1);\n    uint32_t mask = (width >= 32) ? 0xFFFFFFFFu\n                                  : (((1u \u003c\u003c width) - 1u) \u003c\u003c start);\n    return (n & mask) >> start;\n}", "explanation_ko": "width개의 1을 만들어(2^width-1) start만큼 밀어 마스크 생성. AND로 범위만 남기고 start만큼 오른쪽으로 밀어 LSB 정렬.", "complexity": "O(1) time, O(1) space", "pitfalls": ["width==32 시 1u\u003c\u003c32 UB", "start+width>32 오버시프트", "end\u003cstart 방어는 호출측 계약"], "anduril_context": "레지스터에서 상태/모드 필드 추출, 패킹된 텔레메트리 언패킹."}, {"num": 16, "slug": "set-bit-range", "title_ko": "비트 범위 설정", "title_en": "set_bit_range", "difficulty": "medium", "tags": ["mask", "field", "read-modify-write"], "prompt_ko": "비트 [start, end]에 value를 기록하고 나머지 비트는 보존하라.", "prompt_en": "Write value into bits [start, end], preserving the rest.", "signature": "uint32_t set_bit_range(uint32_t n, uint8_t start, uint8_t end, uint32_t value)", "examples": [{"in": "0x0000, 4, 7, 0xF", "out": "0xF0"}, {"in": "0xFFFF, 4, 7, 0x0", "out": "0xFF0F"}], "hints": ["마스크를 만들고 기존 비트를 clear: n & ~mask.", "value를 start만큼 밀고 mask로 잘라서 OR.", "value가 범위를 넘어도 mask가 초과 비트를 제거한다."], "solution": "uint32_t set_bit_range(uint32_t n, uint8_t start, uint8_t end, uint32_t value) {\n    uint8_t width = (uint8_t)(end - start + 1);\n    uint32_t field = (width >= 32) ? 0xFFFFFFFFu : ((1u \u003c\u003c width) - 1u);\n    uint32_t mask  = field \u003c\u003c start;\n    return (n & ~mask) | ((value \u003c\u003c start) & mask);\n}", "explanation_ko": "read-modify-write의 정석. ~mask로 대상 필드만 0으로 지우고, value를 자리로 옮겨 mask로 잘라 OR. 나머지 비트는 & ~mask 에서 보존된다.", "complexity": "O(1) time, O(1) space", "pitfalls": ["value를 mask로 안 자르면 인접 필드 오염", "clear 단계 누락 시 OR로 잔여 비트 남음", "MMIO면 volatile + non-atomic race 주의"], "anduril_context": "하드웨어 레지스터의 특정 제어 필드만 갱신 (모터 PWM 모드, GPIO 설정)."}, {"num": 17, "slug": "invert-bit-range", "title_ko": "비트 범위 반전", "title_en": "invert_bit_range", "difficulty": "easy", "tags": ["mask", "xor", "toggle"], "prompt_ko": "비트 [start, end]만 토글(반전)하고 나머지는 그대로 두라.", "prompt_en": "Toggle only bits [start, end], leaving the rest unchanged.", "signature": "uint32_t invert_bit_range(uint32_t n, uint8_t start, uint8_t end)", "examples": [{"in": "0xF0F0, 4, 7", "out": "0xF000"}, {"in": "0x0, 0, 31", "out": "0xFFFFFFFF"}], "hints": ["토글은 XOR와 마스크 조합.", "마스크 = ((1u\u003c\u003cwidth)-1) \u003c\u003c start.", "n ^ mask 로 해당 비트만 반전."], "solution": "uint32_t invert_bit_range(uint32_t n, uint8_t start, uint8_t end) {\n    uint8_t width = (uint8_t)(end - start + 1);\n    uint32_t mask = (width >= 32) ? 0xFFFFFFFFu\n                                  : (((1u \u003c\u003c width) - 1u) \u003c\u003c start);\n    return n ^ mask;\n}", "explanation_ko": "XOR의 성질: 1과 XOR하면 반전, 0과 XOR하면 유지. mask가 1인 범위만 뒤집힌다.", "complexity": "O(1) time, O(1) space", "pitfalls": ["width==32 UB 가드", "AND/OR로 착각하면 토글이 아닌 clear/set"], "anduril_context": "상태 플래그 토글, 특정 GPIO 그룹 반전, 테스트용 비트 뒤집기."}, {"num": 18, "slug": "power-of-two-round", "title_ko": "가장 가까운 2의 거듭제곱 (올림/내림)", "title_en": "next/prev_power_of_two", "difficulty": "medium", "tags": ["power-of-two", "bit-fill", "rounding"], "prompt_ko": "n 이상의 최소 2의 거듭제곱(올림)과 n 이하의 최대 2의 거듭제곱(내림)을 구하라.", "prompt_en": "Round up/down to the nearest power of two.", "signature": "uint32_t next_power_of_two(uint32_t n); uint32_t prev_power_of_two(uint32_t n)", "examples": [{"in": "next(17)", "out": "32"}, {"in": "prev(17)", "out": "16"}, {"in": "next(0)", "out": "1"}], "hints": ["next: n-- 후 하위 비트를 모두 1로 채우고(n|=n>>1..>>16) +1.", "n-- 을 먼저 하는 이유: 이미 2^k이면 자기 자신 반환.", "prev: 하위비트 채운 뒤 n - (n>>1) 로 최상위 비트만 남긴다."], "solution": "uint32_t next_power_of_two(uint32_t n) {\n    if (n == 0) return 1;\n    n--;\n    n |= n >> 1; n |= n >> 2; n |= n >> 4;\n    n |= n >> 8; n |= n >> 16;\n    return n + 1;\n}\nuint32_t prev_power_of_two(uint32_t n) {\n    if (n == 0) return 0;\n    n |= n >> 1; n |= n >> 2; n |= n >> 4;\n    n |= n >> 8; n |= n >> 16;\n    return n - (n >> 1);\n}", "explanation_ko": "OR-시프트 반복은 최상위 1비트 아래를 전부 1로 채운다. next는 +1로 다음 자리올림을 만들고, prev는 채운 값에서 절반을 빼 최상위 비트만 남긴다. 원본의 prev는 p\u003c\u003c=1 루프라 n>=2^31에서 오버플로 무한루프 버그가 있어 비트채움으로 교체.", "complexity": "O(1) time, O(1) space", "pitfalls": ["next(n): n>2^31 이면 32비트 초과로 0 오버플로 (문서화 필요)", "원본 prev의 곱셈 루프는 대입력에서 무한루프", "n-- 누락 시 이미 2^k인 입력이 2배로 올라감"], "anduril_context": "메모리 풀/버퍼 크기 정렬(17바이트 -> 32바이트 할당), 해시테이블 버킷 크기."}, {"num": 19, "slug": "xor-swap", "title_ko": "임시변수 없는 XOR 스왑", "title_en": "xor_swap", "difficulty": "easy", "tags": ["xor", "swap", "pointer"], "prompt_ko": "임시 변수 없이 두 정수를 XOR로 교환하라.", "prompt_en": "Swap two integers via XOR without a temporary variable.", "signature": "void xor_swap(uint32_t *a, uint32_t *b)", "examples": [{"in": "a=5, b=7", "out": "a=7, b=5"}], "hints": ["*a ^= *b; *b ^= *a; *a ^= *b; 순서.", "a와 b가 같은 주소면 0이 되어버린다 — 반드시 가드.", "NULL 포인터도 방어."], "solution": "void xor_swap(uint32_t *a, uint32_t *b) {\n    if (a == NULL || b == NULL || a == b) return;\n    *a ^= *b;\n    *b ^= *a;   /* = (a^b)^b = a */\n    *a ^= *b;   /* = (a^b)^a = b */\n}", "explanation_ko": "XOR의 가역성(x^y^y=x)을 3단계로 이용. 두 번째 줄에서 *b가 원래 *a가 되고, 세 번째 줄에서 *a가 원래 *b가 된다. 같은 주소면 첫 줄에서 0이 되어 값 손실 -> a==b 가드 필수.", "complexity": "O(1) time, O(1) space", "pitfalls": ["a==b 앨리어싱 시 데이터 소실 (가장 유명한 함정)", "NULL 역참조", "실무에선 임시변수가 더 빠르고 안전 — 트릭용"], "anduril_context": "레지스터 제약 극한 최적화 어셈블리 관용구, 인터뷰 단골. 실무 코드엔 잘 안 씀."}, {"num": 20, "slug": "rotate", "title_ko": "비트 회전 (좌/우)", "title_en": "rotate_left/rotate_right", "difficulty": "medium", "tags": ["rotate", "shift", "UB-guard"], "prompt_ko": "32비트 값을 k비트 좌/우로 회전하라 (밀려난 비트는 반대쪽 끝으로).", "prompt_en": "Rotate a 32-bit value left/right by k bits (bits wrap around).", "signature": "uint32_t rotate_left(uint32_t n, uint8_t k); uint32_t rotate_right(uint32_t n, uint8_t k)", "examples": [{"in": "rol(0x80000001, 1)", "out": "0x00000003"}, {"in": "ror(0x80000001, 1)", "out": "0xC0000000"}], "hints": ["rol = (n\u003c\u003ck) | (n>>(32-k)).", "k==0 이면 n>>32 는 UB! 조기 반환.", "k>=32 도 UB -> k &= 31 로 정규화."], "solution": "uint32_t rotate_left(uint32_t n, uint8_t k) {\n    k &= 31u;\n    if (k == 0) return n;\n    return (n \u003c\u003c k) | (n >> (32 - k));\n}\nuint32_t rotate_right(uint32_t n, uint8_t k) {\n    k &= 31u;\n    if (k == 0) return n;\n    return (n >> k) | (n \u003c\u003c (32 - k));\n}", "explanation_ko": "회전은 한쪽으로 민 비트를 반대쪽에서 다시 넣는 것. 두 시프트를 OR로 합친다. 핵심은 32-k 시프트가 k==0/k>=32 에서 UB가 되는 점 — k&=31 과 k==0 early return 으로 방어. 원본 코드의 대표 버그.", "complexity": "O(1) time, O(1) space", "pitfalls": ["k==0 -> n>>32 UB (원본 버그)", "k>=32 미정규화 UB", "return 문 누락(원본은 res 계산만 하고 return 없음)"], "anduril_context": "CRC/해시(SHA, ChaCha) 라운드 함수, 스크램블러, 암호 프리미티브."}, {"num": 21, "slug": "swap-endian32", "title_ko": "엔디안 변환 (바이트 순서)", "title_en": "swap_endian32", "difficulty": "easy", "tags": ["endianness", "byte-order", "protocol"], "prompt_ko": "32비트 값의 바이트 순서를 반전하라 (big\u003c->little).", "prompt_en": "Reverse the byte order of a 32-bit value (big\u003c->little endian).", "signature": "uint32_t swap_endian32(uint32_t n)", "examples": [{"in": "0x12345678", "out": "0x78563412"}, {"in": "0x000000FF", "out": "0xFF000000"}], "hints": ["4바이트를 각각 반대 위치로 옮긴다.", "각 바이트를 시프트 후 0xFF 계열 마스크로 자른다.", "__builtin_bswap32 도 있지만 손으로 구현."], "solution": "uint32_
