, "pop 은 대칭: while(empty) cond_wait(not_empty, m), signal(not_full)."], "solution": "void mpmc_init(mpmc_t *q, uint8_t *buf, size_t size) {\n    q->buf = buf; q->size = size; q->head = q->tail = q->count = 0;\n    pthread_mutex_init(&q->m, NULL);\n    pthread_cond_init(&q->not_full, NULL);\n    pthread_cond_init(&q->not_empty, NULL);\n}\nvoid mpmc_push(mpmc_t *q, uint8_t data) {\n    pthread_mutex_lock(&q->m);\n    while (q->count == q->size)\n        pthread_cond_wait(&q->not_full, &q->m);   // while!\n    q->buf[q->head] = data;\n    q->head = (q->head + 1) % q->size;\n    q->count++;\n    pthread_cond_signal(&q->not_empty);\n    pthread_mutex_unlock(&q->m);\n}\nuint8_t mpmc_pop(mpmc_t *q) {\n    pthread_mutex_lock(&q->m);\n    while (q->count == 0)\n        pthread_cond_wait(&q->not_empty, &q->m);\n    uint8_t data = q->buf[q->tail];\n    q->tail = (q->tail + 1) % q->size;\n    q->count--;\n    pthread_cond_signal(&q->not_full);\n    pthread_mutex_unlock(&q->m);\n    return data;\n}\nvoid mpmc_destroy(mpmc_t *q) {\n    pthread_mutex_destroy(&q->m);\n    pthread_cond_destroy(&q->not_full);\n    pthread_cond_destroy(&q->not_empty);\n}", "explanation_ko": "여러 스레드가 동시에 head/tail/count 를 갱신하므로 SPSC 무락 트릭이 성립하지 않는다. mutex 로 직렬화하고, 버퍼가 가득/비었을 때 바쁜 대기(busy-wait) 대신 조건변수로 잠들어 CPU 를 양보한다. while 루프는 (1) pthread_cond_wait 의 spurious wakeup, (2) 깨어난 사이 다른 스레드가 상태를 바꿔버린 경우를 모두 방어한다. cond_wait 진입 시 mutex 를 자동으로 해제하므로 다른 스레드가 진입해 상태를 바꾸고 signal 할 수 있다.", "complexity": "O(1) time per op (락 경합 제외), O(1) space", "pitfalls": ["if (count==0) cond_wait — while 아님 → spurious wakeup 시 빈 큐에서 pop.", "signal 대상 조건변수를 반대로(넣고 not_full signal) → 대기 스레드가 안 깨어남.", "cond_wait 를 락 밖에서 호출 → 미정의 동작.", "ISR 에서 mutex 사용 금지 — MPMC 블로킹 큐는 스레드 컨텍스트 전용."], "anduril_context": "여러 태스크가 공유 로그/텔레메트리 큐에 동시에 쓰는 RTOS 멀티스레드 환경(예: 지상국 소프트웨어, 다중 센서 융합 노드)."}]}, {"id": "linked_list", "order": 6, "range": "Q66-75", "icon": "🔗", "title_en": "Linked Lists (incl. no-malloc)", "title_ko": "연결 리스트 (malloc 없이 포함)", "summary_ko": "단일/이중 연결 리스트의 삽입·삭제·뒤집기·중앙·사이클·병합·끝에서N번째, 그리고 힙 없는 정적 노드 풀(free-list)까지. 이중 포인터 삭제 관용구와 slow/fast 포인터가 핵심.", "summary_en": "Singly/doubly linked-list insert, delete, reverse, middle, cycle detect, merge, and Nth-from-end, plus a heap-free static node pool (free-list). The double-pointer delete idiom and slow/fast pointers are the core techniques.", "anduril_relevance_ko": "드론/무장 펌웨어는 malloc 을 금지하는 경우가 많아 '힙 없이 리스트를 어떻게 만드나(정적 노드 풀 + free-list)'가 단골 질문이다. 이벤트/타이머/커맨드 큐, 핸들러 체인이 실제로 연결 리스트이고, 인터뷰어는 포인터 경계(head/꼬리/NULL/사이클) 처리로 C 실력을 가늠한다.", "concepts": [{"term": "double-pointer delete", "ko": "node** 로 head/중간/꼬리 삭제를 한 코드로", "en": "*pp is the incoming link; head and mid deletion share one path"}, {"term": "slow/fast pointer", "ko": "중앙 찾기: fast 2칸, slow 1칸", "en": "fast moves 2, slow moves 1; slow ends at the middle"}, {"term": "Floyd cycle detection", "ko": "토끼-거북이 재회 시 사이클, O(1) 공간", "en": "if slow meets fast there is a cycle, no visited-set"}, {"term": "two-pointer gap", "ko": "끝에서 N번째: lead 를 n 칸 앞세워 함께 이동", "en": "advance lead by n then move both; trail lands on answer"}, {"term": "stack dummy node", "ko": "병합/삽입에서 head 특수 케이스 제거", "en": "node_t dummy; removes head special-case, no malloc"}, {"term": "static node pool + free-list", "ko": "정적 배열 + free-list 로 힙 없이 O(1) alloc/free", "en": "compile-time array + free-list, deterministic, no heap"}, {"term": "doubly linked prev/next", "ko": "삽입·삭제 시 양쪽 링크 모두 갱신", "en": "update both prev and next on every insert/delete"}], "study_note_md": "# 06. 연결 리스트 (Linked List, malloc 없이 포함) — Q66~Q75 🔗\n\n> 배열과 함께 임베디드 코딩 인터뷰의 양대 산맥. 특히 **이중 포인터 삭제 관용구**,\n> **slow/fast 포인터**, 그리고 **힙 없는 정적 노드 풀**은 Anduril 류 방산 펌웨어에서\n> 실제로 나오는 주제다.\n\n---\n\n## 왜 Anduril 펌웨어 인터뷰에 나오나\n\n- 드론/무장 시스템 펌웨어는 **동적 할당(malloc)을 금지**하는 경우가 많다 (MISRA-C,\n  실시간 결정성, 힙 단편화 회피). 그래서 \"리스트를 힙 없이 어떻게 만들까?\"가 단골 질문 →\n  **정적 노드 풀 + free-list** (Q75).\n- 이벤트 큐, 타이머 콜백 리스트, 센서 핸들러 체인, 커맨드 큐 등은 노드를 삽입/삭제하는\n  자료구조다. 배열 링버퍼로 안 되는(중간 삭제, 가변 길이) 곳에 연결 리스트를 쓴다.\n- 인터뷰어는 포인터 조작 정확도(특히 **head/꼬리 경계, NULL, 사이클**)로 지원자의\n  C 실력을 빠르게 가늠한다.\n\n---\n\n## 핵심 개념 치트시트\n\n| 개념 | 한 줄 요약 |\n|------|-----------|\n| 이중 포인터 삭제 (`node **`) | `*pp` = \"현재 노드로 들어오는 링크\". head/중간/꼬리 삭제를 **한 코드**로. |\n| slow/fast 중앙 찾기 | fast 2칸, slow 1칸 → fast 끝나면 slow 가 중앙. 한 번 순회, O(1) 공간. |\n| Floyd 사이클 탐지 | slow/fast 가 **만나면** 순환. 노드 주소 저장 불필요 → 메모리 0. |\n| two-pointer 간격 | lead 를 n 칸 앞세우고 함께 이동 → 끝에서 N번째를 한 번에. |\n| 스택 더미 노드 | 병합/삽입에서 head 특수 케이스 제거용. `node_t dummy;` (malloc 불필요). |\n| 정적 노드 풀 | 컴파일 타임 배열 + free-list. `pool_alloc/pool_free` = O(1), 힙 0. |\n\n---\n\n## (A) 단일 연결 리스트 Singly\n\n### 삭제는 무조건 이중 포인터로\n\n```c\nbool list_delete_value(node_t **head, int value) {\n    node_t **pp = head;                 // pp: \"다음 노드를 가리키는 링크\"의 주소\n    while (*pp) {\n        if ((*pp)->data == value) {\n            node_t *dead = *pp;\n            *pp = dead->next;           // 들어오는 링크를 건너뛰게 재연결\n            free(dead);\n            return true;\n        }\n        pp = &(*pp)->next;\n    }\n    return false;\n}\n```\n\n- `head` 삭제와 중간 삭제가 **동일 코드**가 되는 게 포인트. 단일 포인터로 짜면 `prev`\n  추적 + head 특수 케이스가 생겨 버그가 난다.\n\n### 중앙 / 사이클 = slow·fast 쌍\n\n```c\nnode_t *slow = head, *fast = head;\nwhile (fast && fast->next) {            // 이 조건이 짝수/홀수/NULL 모두 커버\n    slow = slow->next;\n    fast = fast->next->next;\n    // if (slow == fast) return true;   // 사이클 탐지면 이 줄 추가\n}\n// 여기서 slow = 중앙 (짝수 길이면 뒤쪽 중앙)\n```\n\n- **가드 순서 주의**: `fast && fast->next` — `fast`를 먼저 검사해야 `fast->next`\n  역참조가 안전 (short-circuit). 순서 바꾸면 NULL 역참조 UB.\n\n### 끝에서 N번째 = 간격 고정 two-pointer\n\n```c\nnode_t *lead = head;\nfor (size_t i = 0; i \u003c n; ++i) { if (!lead) return NULL; lead = lead->next; }\nnode_t *trail = head;\nwhile (lead) { lead = lead->next; trail = trail->next; }\nreturn trail;   // n=1 이면 마지막 노드\n```\n\n### 병합은 스택 더미로\n\n```c\nnode_t dummy; dummy.next = NULL;       // 힙 안 씀\nnode_t *tail = &dummy;\nwhile (a && b) {\n    if (a->data \u003c= b->data) { tail->next = a; a = a->next; }  // \u003c= 라야 안정\n    else                    { tail->next = b; b = b->next; }\n    tail = tail->next;\n}\ntail->next = a ? a : b;\nreturn dummy.next;\n```\n\n---\n\n## (B) 이중 연결 리스트 Doubly (Q74)\n\n- 삽입/삭제 시 **prev 와 next 를 둘 다** 갱신해야 한다. 하나라도 빠지면 역방향 순회가\n  깨진다.\n- 삭제 정석:\n\n```c\nif (cur->prev) cur->prev->next = cur->next;  // 앞쪽 재연결\nelse           *head = cur->next;            // head 삭제\nif (cur->next) cur->next->prev = cur->prev;  // 뒤쪽 재연결 (꼬리면 생략)\n```\n\n- 뒤집기는 각 노드에서 `prev ↔ next` 를 맞바꾸고, 마지막에 `head` 를 옛 꼬리로.\n- 검증 팁: 앞으로 훑으며 `node->prev == 직전노드` 인지 확인하는 헬퍼(`dlist_prev_ok`)로\n  링크 무결성을 테스트한다.\n\n---\n\n## (C) malloc 없는 정적 노드 풀 (Q75) — 임베디드 핵심\n\n```c\n#define POOL_SIZE 8\nstatic pnode_t  g_pool[POOL_SIZE];   // 컴파일 타임 정적 저장 (heap 아님)\nstatic pnode_t *g_free_list = NULL;  // 안 쓰는 노드들의 연결 리스트\n\nvoid pool_init(void) {               // 리셋 시 한 번\n    for (int i = 0; i \u003c POOL_SIZE - 1; ++i) g_pool[i].next = &g_pool[i + 1];\n    g_pool[POOL_SIZE - 1].next = NULL;\n    g_free_list = &g_pool[0];\n}\npnode_t *pool_alloc(void) {          // O(1)\n    if (!g_free_list) return NULL;   // 고갈 → NULL (우아한 실패)\n    pnode_t *n = g_free_list; g_free_list = n->next; n->next = NULL; return n;\n}\nvoid pool_free(pnode_t *n) {         // O(1) — free-list 머리에 반납\n    if (!n) return; n->next = g_free_list; g_free_list = n;\n}\n```\n\n**왜 이렇게?**\n\n- 힙 없음 → **결정론적 지연시간** (ISR/RTOS 에서 `malloc` 은 잠재적 블로킹/단편화).\n- 고갈 시 크래시 대신 `NULL/false` 로 실패 → 방어적. 상위에서 back-pressure 처리.\n- `pool_free` 는 실제로 메모리를 반환하지 않고 **재사용 링에 되돌릴** 뿐 → 누수 개념이\n  \"free-list 개수\"로 환원된다. 테스트에서 `pool_free_count()` 로 검증.\n\n---\n\n## 인터뷰 팔로업 & 임베디드 함정\n\n- **Q. 왜 삭제에 `node **` 를 쓰나?** → head 특수 케이스 제거, prev 추적 불필요. 코드 절반.\n- **Q. slow/fast 에서 짝수 길이면 어느 중앙?** → `while(fast && fast->next)` 는 뒤쪽\n  중앙. 앞쪽을 원하면 `while(fast->next && fast->next->next)`.\n- **Q. Floyd 대신 방문 노드 집합을 쓰면?** → O(n) 메모리. 임베디드에선 금물. Floyd 는 O(1).\n- **함정: 병합 시 `\u003c` vs `\u003c=`** → `\u003c=` 라야 동일 키의 상대 순서 보존(안정성).\n- **함정: 사이클 있는 리스트를 print/free** → 무한 루프. 사이클 가능성 있으면 먼저 탐지.\n- **함정: 정적 풀을 여러 리스트가 공유** → `pool_free` 를 빠뜨리면 풀만 마르고 힙 오류는\n  안 뜬다. \"왜 alloc 이 갑자기 NULL?\" 디버깅의 흔한 원인.\n- **함정: 노드 풀 + 인터럽트** → ISR 와 main 이 같은 free-list 를 만지면 경쟁. 임계구역\n  보호(인터럽트 마스킹) 또는 SPSC 설계 필요.\n\n---\n\n## 복잡도 요약\n\n| 연산 | 시간 | 공간 |\n|------|------|------|\n| push_front | O(1) | O(1) |\n| push_back (꼬리 순회) | O(n) | O(1) |\n| delete_value | O(n) | O(1) |\n| reverse | O(n) | O(1) |\n| find_middle / has_cycle | O(n) | O(1) |\n| merge_sorted | O(n+m) | O(1) |\n| nth_from_end | O(n) | O(1) |\n| pool_alloc / pool_free | O(1) | O(1) |\n", "problems": [{"num": 66, "slug": "list_push_front", "title_ko": "앞쪽 삽입 (push_front)", "title_en": "Push to front of singly list", "difficulty": "easy", "tags": ["singly", "insert", "double-pointer"], "prompt_ko": "단일 연결 리스트의 head 앞에 새 노드를 O(1)로 삽입한다. head 는 node**(이중 포인터)로 받아 빈 리스트/갱신을 호출자에 반영한다.", "prompt_en": "Insert a new node at the front of a singly linked list in O(1). Take head as node** so an empty list and head update propagate to the caller.", "signature": "void list_push_front(node_t **head, int data);", "examples": [{"in": "head=[], push_front 1,2,3", "out": "[3 2 1]"}], "hints": ["새 노드의 next 를 현재 *head 로 설정.", "그 다음 *head 를 새 노드로 교체.", "head 가 NULL 인 호출도 안전하게 무시(guard)."], "solution": "void list_push_front(node_t **head, int data) {\n    if (!head) return;\n    node_t *n = malloc(sizeof *n);\n    if (!n) return;\n    n->data = data;\n    n->next = *head;\n    *head = n;\n}", "explanation_ko": "새 노드가 기존 head 를 가리키게 한 뒤 head 포인터 자체를 새 노드로 바꾼다. 순서를 반대로 하면 기존 리스트를 잃는다.", "complexity": "O(1) time, O(1) space", "pitfalls": ["n->next = *head 를 *head 갱신보다 먼저 해야 함", "malloc 실패(NULL) 미처리", "head==NULL 역참조"], "anduril_context": "커맨드/이벤트 큐 맨 앞 우선 삽입, 인터럽트 핸들러 체인 등록."}, {"num": 67, "slug": "list_push_back", "title_ko": "뒤쪽 삽입 (push_back)", "title_en": "Push to back of singly list", "difficulty": "easy", "tags": ["singly", "insert", "traversal"], "prompt_ko": "꼬리까지 순회한 뒤 새 노드를 연결한다. 이중 포인터로 '채울 링크 슬롯'을 추적하면 빈 리스트도 특수 케이스 없이 처리된다.", "prompt_en": "Traverse to the tail and append. Tracking the empty link slot with a double pointer removes the empty-list special case.", "signature": "void list_push_back(node_t **head, int data);", "examples": [{"in": "[3 2 1] push_back 4,5", "out": "[3 2 1 4 5]"}, {"in": "[] push_back 7", "out": "[7]"}], "hints": ["node **pp = head 에서 *pp 가 NULL 이 될 때까지 이동.", "그 슬롯에 새 노드를 넣으면 빈 리스트/비어있지 않음 모두 커버.", "새 노드 next 는 NULL."], "solution": "void list_push_back(node_t **head, int data) {\n    if (!head) return;\n    node_t *n = malloc(sizeof *n);\n    if (!n) return;\n    n->data = data; n->next = NULL;\n    node_t **pp = head;\n    while (*pp) pp = &(*pp)->next;\n    *pp = n;\n}", "explanation_ko": "*pp 는 '다음 노드를 가리키는 링크'의 주소다. 꼬리의 next(=NULL) 슬롯에 도달하면 거기에 새 노드를 꽂는다.", "complexity": "O(n) time, O(1) space", "pitfalls": ["꼬리 포인터 캐시 없으면 매번 O(n)", "빈 리스트를 별도 분기로 짜다 버그", "새 노드 next=NULL 누락"], "anduril_context": "FIFO 텔레메트리/로그 큐 뒤에 이벤트 적재."}, {"num": 68, "slug": "list_delete_value", "title_ko": "값으로 삭제 (이중 포인터)", "title_en": "Delete node by value", "difficulty": "medium", "tags": ["singly", "delete", "double-pointer"], "prompt_ko": "특정 값의 첫 번째 노드를 삭제한다. 이중 포인터 관용구로 head/중간/꼬리 삭제를 하나의 코드로 처리한다. 삭제 시 true.", "prompt_en": "Delete the first node with a given value. Use the double-pointer idiom so head/middle/tail deletion share one code path. Return true if deleted.", "signature": "bool list_delete_value(node_t **head, int value);", "examples": [{"in": "delete 3 from [3 2 1 4 5]", "out": "[2 1 4 5], true"}, {"in": "delete 99 (missing)", "out": "false"}], "hints": ["node **pp = head; 로 시작.", "(*pp)->data == value 면 *pp = (*pp)->next 로 링크를 건너뛴다.", "끊어낸 노드는 free 하고 true 반환."], "solution": "bool list_delete_value(node_t **head, int value) {\n    if (!head) return false;\n    node_t **pp = head;\n    while (*pp) {\n        if ((*pp)->data == value) {\n            node_t *dead = *pp;\n            *pp = dead->next;\n            free(dead);\n            return true;\n        }\n        pp = &(*pp)->next;\n    }\n    return false;\n}", "explanation_ko": "*pp 는 현재 노드로 '들어오는 링크'라서, 그 링크만 다음 노드로 바꾸면 head 삭제든 중간 삭제든 동일하게 처리된다. prev 추적이 필요 없다.", "complexity": "O(n) time, O(1) space", "pitfalls": ["단일 포인터로 짜다 head 특수 케이스 버그", "free 전에 next 저장 안 함 → use-after-free", "값 없음 시 false 반환 누락"], "anduril_context": "타이머/구독 리스트에서 취소된 항목 제거."}, {"num": 69, "slug": "list_reverse", "title_ko": "제자리 뒤집기", "title_en": "Reverse singly list in place", "difficulty": "medium", "tags": ["singly", "reverse", "pointers"], "prompt_ko": "추가 메모리 없이 링크 방향을 반전한다(prev/cur/next 3-포인터). O(n) 시간, O(1) 공간.", "prompt_en": "Reverse the link direction in place using three pointers (prev/cur/next). O(n) time, O(1) space.", "signature": "void list_reverse(node_t **head);", "examples": [{"in": "[2 1 4]", "out": "[4 1 2]"}, {"in": "[42]", "out": "[42]"}], "hints": ["cur 를 훑으며 각 노드의 next 를 prev 로 돌린다.", "끊기 전에 nxt = cur->next 로 다음 노드를 저장.", "끝나면 *head = prev (옛 꼬리)."], "solution": "void list_reverse(node_t **head) {\n    if (!head) return;\n    node_t *prev = NULL, *cur = *head;\n    while (cur) {\n        node_t *nxt = cur->next;\n        cur->next = prev;\n        prev = cur;\n        cur = nxt;\n    }\n    *head = prev;\n}", "explanation_ko": "매 반복에서 다음 노드를 먼저 보관한 뒤 링크를 반전하고 prev/cur 를 한 칸 전진시킨다. 반복 종료 시 prev 가 새 head.", "complexity": "O(n) time, O(1) space", "pitfalls": ["nxt 저장 전에 cur->next 를 바꿔 리스트 유실", "*head 갱신 누락", "빈/단일 노드 경계 미확인"], "anduril_context": "버퍼에 역순으로 쌓인 패킷/스택 프레임을 순방향으로 재배열."}, {"num": 70, "slug": "list_find_middle", "title_ko": "중앙 노드 (slow/fast)", "title_en": "Find middle node", "difficulty": "easy", "tags": ["singly", "two-pointer", "slow-fast"], "prompt_ko": "한 번의 순회로 중앙 노드를 찾는다. fast 는 2칸, slow 는 1칸. 짝수 길이면 뒤쪽 중앙을 반환. 빈 리스트는 NULL.", "prompt_en": "Find the middle in a single pass: fast moves 2, slow moves 1. For even length return the upper middle. Empty list returns NULL.", "signature": "node_t *list_find_middle(node_t *head);", "examples": [{"in": "[1 2 3 4 5]", "out": "3"}, {"in": "[1 2 3 4]", "out": "3"}], "hints": ["slow=fast=head.", "while (fast && fast->next): slow 1칸, fast 2칸.", "루프 종료 시 slow 가 중앙."], "solution": "node_t *list_find_middle(node_t *head) {\n    node_t *slow = head, *fast = head;\n    while (fast && fast->next) {\n        slow = slow->next;\n        fast = fast->next->next;\n    }\n    return slow;\n}", "explanation_ko": "fast 가 리스트 끝을 두 배 속도로 지나므로 fast 가 멈출 때 slow 는 정확히 절반 지점에 있다.", "complexity": "O(n) time, O(1) space", "pitfalls": ["가드 순서: fast 를 먼저 검사(short-circuit)", "짝수 길이 중앙 정의 혼동", "빈 리스트 NULL 처리"], "anduril_context": "리스트 이진 분할(merge sort), 스트림 중앙값 근사."}, {"num": 71, "slug": "list_has_cycle", "title_ko": "사이클 탐지 (Floyd)", "title_en": "Detect cycle (Floyd)", "difficulty": "medium", "tags": ["singly", "cycle", "floyd", "slow-fast"], "prompt_ko": "Floyd 토끼-거북이로 사이클을 O(1) 공간에 탐지한다. slow/fast 가 만나면 순환. 방문 노드를 저장하지 않는다.", "prompt_en": "Detect a cycle with Floyd's tortoise & hare in O(1) space. If slow meets fast there is a cycle. No visited-set storage.", "signature": "bool list_has_cycle(node_t *head);", "examples": [{"in": "acyclic [1..5]", "out": "false"}, {"in": "tail->3rd node", "out": "true"}], "hints": ["slow 1칸, fast 2칸.", "매 스텝 후 slow == fast 면 사이클.", "fast 가 NULL 에 도달하면 무순환."], "solution": "bool list_has_cycle(node_t *head) {\n    node_t *slow = head, *fast = head;\n    while (fast && fast->next) {\n        slow = slow->next;\n        fast = fast->next->next;\n        if (slow == fast) return true;\n    }\n    return false;\n}", "explanation_ko": "순환이 있으면 fast 가 slow 를 반드시 따라잡아 같은 노드에서 만난다. 순환이 없으면 fast 가 NULL 에 먼저 닿는다.", "complexity": "O(n) time, O(1) space", "pitfalls": ["방문 집합 사용 → O(n) 메모리(임베디드 금물)", "이동 전에 비교하면 항상 true", "fast->next 가드 없이 역참조 UB"], "anduril_context": "손상된 링크(잘못된 포인터로 인한 순환) 안전 진단, 워치독 무결성 검사."}, {"num": 72, "slug": "list_merge_sorted", "title_ko": "정렬 리스트 병합", "title_en": "Merge two sorted lists", "difficulty": "medium", "tags": ["singly", "merge", "dummy-node"], "prompt_ko": "정렬된 두 리스트를 하나의 정렬 리스트로 병합한다. 스택 더미 노드로 head 특수 케이스를 제거하고 노드를 재사용한다(입력 소비).", "prompt_en": "Merge two sorted lists into one. Use a stack dummy node to drop the head special case and reuse nodes (inputs are consumed).", "signature": "node_t *list_merge_sorted(node_t *a, node_t *b);", "examples": [{"in": "[1 3 5] + [2 4 6]", "out": "[1 2 3 4 5 6]"}, {"in": "NULL + [8]", "out": "[8]"}], "hints": ["node_t dummy; tail=&dummy 로 시작.", "a,b 중 작은 쪽을 tail->next 로 이어붙이고 전진.", "한쪽이 비면 나머지를 통째로 붙인다."], "solution": "node_t *list_merge_sorted(node_t *a, node_t *b) {\n    node_t dummy; dummy.next = NULL;\n    node_t *tail = &dummy;\n    while (a && b) {\n        if (a->data \u003c= b->data) { tail->next = a; a = a->next; }\n        else                    { tail->next = b; b = b->next; }\n        tail = tail->next;\n    }\n    tail->next = a ? a : b;\n    return dummy.next;\n}", "explanation_ko": "더미 노드 덕분에 결과 head 를 특수 처리할 필요가 없다. \u003c= 비교라야 같은 키의 상대 순서(안정성)가 보존된다.", "complexity": "O(n+m) time, O(1) space", "pitfalls": ["\u003c 로 비교하면 안정성 깨짐", "남은 꼬리 붙이기 누락", "새 노드 malloc 하려다 불필요한 할당"], "anduril_context": "여러 정렬된 센서 스트림/로그를 시간순 병합."}, {"num": 73, "slug": "list_nth_from_end", "title_ko": "끝에서 N번째", "title_en": "Nth node from end", "difficulty": "medium", "tags": ["singly", "two-pointer", "gap"], "prompt_ko": "한 번의 순회로 끝에서 N번째 노드를 찾는다(n=1 이 마지막). lead 를 n 칸 앞세운 뒤 함께 이동. n 이 길이보다 크면 NULL.", "prompt_en": "Find the Nth node from the end in one pass (n=1 is last). Advance lead by n, then move both together. Return NULL if n exceeds length.", "signature": "node_t *list_nth_from_end(node_t *head, size_t n);", "examples": [{"in": "[4 1 2], n=1", "out": "2"}, {"in": "[4 1 2], n=3", "out": "4"}, {"in": "n=4 (too big)", "out": "NULL"}], "hints": ["lead 를 n 칸 전진. 도중 NULL 이면 리스트가 짧음 → NULL.", "trail=head 를 lead 와 같은 속도로 이동.", "lead 가 NULL 되면 trail 이 정답."], "solution": "node_t *list_nth_from_end(node_t *head, size_t n) {\n    if (n == 0) return NULL;\n    node_t *lead = head;\n    for (size_t i = 0; i \u003c n; ++i) {\n        if (!lead) return NULL;\n        lead = lead->next;\n    }\n    node_t *trail = head;\n    while (lead) { lead = lead->next; trail = trail->next; }\n    return trail;\n}", "explanation_ko": "lead 와 trail 사이 간격을 n 으로 고정하면, lead 가 끝(NULL)에 도달했을 때 trail 은 끝에서 n번째에 있다.", "complexity": "O(n) time, O(1) space", "pitfalls": ["n=0 미정의 처리 누락", "n > 길이 시 lead 역참조 UB", "간격을 n-1 로 잘못 두는 off-by-one"], "anduril_context": "최근 N개 로그/샘플 롤백, 슬라이딩 윈도우 접근."}, {"num": 74, "slug": "dlist_core_ops", "title_ko": "이중 연결 리스트 핵심 연산", "title_en": "Doubly linked list core ops", "difficulty": "medium", "tags": ["doubly", "insert", "delete", "reverse"], "prompt_ko": "prev/next 양방향 리스트의 push_front/push_back/delete_value/reverse 를 구현한다. 삽입·삭제 시 prev 와 next 를 모두 갱신해야 링크가 깨지지 않는다.", "prompt_en": "Implement push_front/push_back/delete_value/reverse for a doubly linked list. Every insert/delete must update both prev and next to keep links intact.", "signature": "void dlist_push_front(dnode_t **head, int data); bool dlist_delete_value(dnode_t **head, int value); void dlist_reverse(dnode_t **head);", "examples": [{"in": "build [3 2 1 4 5], delete 3", "out": "[2 1 4 5]"}, {"in": "reverse [4 1 2]", "out": "[2 1 4]"}], "hints": ["push_front: 기존 head 의 prev 를 새 노드로 갱신.", "delete: prev 있으면 prev->next 갱신, 없으면 head 갱신; next 있으면 next->prev 갱신.", "reverse: 각 노드 prev↔next 를 swap 하고 head 를 옛 꼬리로."], "solution": "bool dlist_delete_value(dnode_t **head, int value) {\n    if (!head) return false;\n    dnode_t *cur = *head;\n    while (cur && cur->data != value) cur = cur->next;\n    if (!cur) return false;\n    if (cur->prev) cur->prev->next = cur->next;\n    else           *head = cur->next;\n    if (cur->next) cur->next->prev = cur->prev;\n    free(cur);\n    return true;\n}\n\nvoid dlist_reverse(dnode_t **head) {\n    if (!head) return;\n    dnode_t *cur = *head, *newhead = *head;\n    while (cur) {\n        dnode_t *nxt = cur->next;\n        cur->next = cur->prev;\n        cur->prev = nxt;\n        newhead = cur;\n        cur = nxt;\n    }\n    *head = newhead;\n}", "explanation_ko": "이중 리스트는 삭제 시 앞뒤 두 링크를, 뒤집기 시 각 노드의 prev/next 를 맞바꾼다. head 와 꼬리 경계에서 NULL 검사를 빠뜨리면 역방향 순회가 깨진다.", "complexity": "insert front O(1), delete/reverse O(n), O(1) space", "pitfalls": ["prev 갱신 누락 → 역방향 순회 깨짐", "head 삭제 시 *head 갱신 누락", "reverse 후 head 를 옛 꼬리로 안 바꿈"], "anduril_context": "LRU 캐시, 양방향 스크롤 로그, 상태 이력(앞뒤 탐색) 관리."}, {"num": 75, "slug": "pool_no_malloc", "title_ko": "malloc 없는 정적 노드 풀", "title_en": "Static node pool (no malloc)", "difficulty": "hard", "tags": ["embedded", "no-heap", "free-list", "pool"], "prompt_ko": "정적 배열을 노드 풀로 쓰고 free-list 로 미사용 노드를 관리해 힙 없이 연결 리스트를 구현한다. pool_init/alloc/free 는 O(1), 고갈 시 NULL/false 로 우아하게 실패.", "prompt_en": "Implement a linked list without the heap: a static array node pool plus a free-list for unused nodes. pool_init/alloc/free are O(1); on exhaustion fail gracefully with NULL/false.", "signature": "void pool_init(void); pnode_t *pool_alloc(void); void pool_free(pnode_t *n); bool pool_push_front(pnode_t **head, int data);", "examples": [{"in": "POOL_SIZE=8, push 5 nodes", "out": "free_count 8->3"}, {"in": "alloc when free-list empty", "out": "NULL / false"}], "hints": ["pool_init: 배열을 next 로 엮어 free-list 만들고 head 를 [0] 으로.", "pool_alloc: free-list 머리 노드를 떼어 반환, 없으면 NULL.", "pool_free: 노드를 free-list 머리에 되돌림(실제 반환 아님)."], "solution": "#define POOL_SIZE 8\nstatic pnode_t g_pool[POOL_SIZE];\nstatic pnode_t *g_free_list = NULL;\n\nvoid pool_init(void) {\n    for (int i = 0; i \u003c POOL_SIZE - 1; ++i) g_pool[i].next = &g_pool[i+1];\n    g_pool[POOL_SIZE - 1].next = NULL;\n    g_free_list = &g_pool[0];\n}\npnode_t *pool_alloc(void) {\n    if (!g_free_list) return NULL;\n    pnode_t *n = g_free_list;\n    g_free_list = n->next;\n    n->next = NULL;\n    return n;\n}\nvoid pool_free(pnode_t *n) {\n    if (!n) return;\n    n->next = g_free_list;\n    g_free_list = n;\n}\nbool pool_push_front(pnode_t **head, int data) {\n    if (!head) return false;\n    pnode_t *n = pool_alloc();\n    if (!n) return false;\n    n->data = data; n->next = *head; *head = n;\n    return true;\n}", "explanation_ko": "컴파일 타임 배열이 저장소, free-list 는 '지금 비어있는 슬롯들'의 단일 연결 리스트다. alloc 은 머리에서 떼고 free 는 머리에 붙여 둘 다 O(1). 힙 단편화가 없고 지연시간이 결정론적이다.", "complexity": "alloc/free O(1), push_back O(n), O(1) extra space (풀은 정적)", "pitfalls": ["pool_free 누락 → 풀만 마름(힙 오류는 안 뜸)", "고갈 시 NULL 미처리 후 역참조", "ISR 와 main 이 free-list 공유 시 경쟁(임계구역 필요)"], "anduril_context": "malloc 금지 방산 펌웨어의 이벤트/메시지 노드 할당(MISRA, 결정성)."}]}, {"id": "fsm", "order": 7, "range": "Q76-85", "icon": "🚦", "title_en": "Finite State Machines", "title_ko": "유한 상태 기계 (FSM)", "summary_ko": "임베디드 제어 흐름의 뼈대: 버튼 디바운스, 함수 포인터 상태 테이블, UART 패킷 파서(SYNC/LEN/DATA/CHECKSUM), 신호등, Mealy vs Moore, 계층적 상태(HSM), entry/exit 액션, guard 조건, 이벤트 큐, 타임아웃.", "summary_en": "The backbone of embedded control flow: button debounce, function-pointer state table, UART packet parser (SYNC/LEN/DATA/CHECKSUM), traffic light, Mealy vs Moore, hierarchical state machines, entry/exit actions, guard conditions, event queue, and timeout events.", "anduril_relevance_ko": "드론 펌웨어의 통신 링크는 링 버퍼로 바이트를 모아 FSM 으로 프레임을 조립한다 — UART 패킷 파서 FSM(재동기화·길이검증·checksum 폐기)은 국방/드론 펌웨어 면접의 단골이다. 비행 모드 관리(ARMED 하위 TAKEOFF/MISSION/RTL), 어디서든 가로채는 FAILSAFE 는 HSM 버블링의 전형이고, 링크 유실/센서 무응답은 타임아웃 FSM 으로 안전 상태 복귀를 유도한다. FSM 은 입력→출력이 결정적이라 단위 테스트/HIL 에 잘 맞아 '검증 가능한 펌웨어' 를 중시하는 Anduril 과 직결된다.", "concepts": [{"term": "3 styles", "ko": "switch(≤5상태) / 함수포인터 테이블(확장) / 2D 전이표", "en": "switch, function-pointer table, or 2D transition table"}, {"term": "Moore", "ko": "출력=f(상태). 상태 많음, 레지스터드, 글리치 없음", "en": "Output is a function of state only; more states, glitch-free"}, {"term": "Mealy", "ko": "출력=f(상태,입력). 상태 적음, 조합, 즉각 반응", "en": "Output depends on state+input; fewer states, faster"}, {"term": "HSM bubbling", "ko": "자식 미처리 이벤트를 부모 superstate 로 위임 → 공통 전이 중복 제거", "en": "Unhandled child events bubble to parent superstate"}, {"term": "UART framing", "ko": "SYNC→LEN(검증)→DATA(러닝XOR)→CHECKSUM, 완료 후 재동기화", "en": "SYNC->LEN(validate)->DATA(running XOR)->CHECKSUM, then resync"}, {"term": "Length validation", "ko": "원격 len 을 1..MAX 로 검증해 data[] 오버플로 방지", "en": "Validate remote length to prevent buffer overflow"}, {"term": "entry/exit", "ko": "exit(old)→상태변경→entry(new), 자기전이 무동작", "en": "exit(old)->change->entry(new); self-transition no-op"}, {"term": "guard", "ko": "부수효과 없는 순수 술어로 같은 이벤트를 분기", "en": "Pure side-effect-free predicate branching the same event"}, {"term": "event queue", "ko": "ISR push / main pop → FSM 디커플, 짧은 ISR", "en": "ISR pushes, main pops; decouples FSM from ISR"}, {"term": "timeout", "ko": "무활동 tick 누적 limit 도달 시 TIMEOUT → 워치독/복구", "en": "Idle ticks reaching limit -> TIMEOUT; watchdog/recovery"}], "study_note_md": "# 🚦 유한 상태 기계 (Finite State Machine, FSM) — Q76~85\n\n> 임베디드 펌웨어의 **제어 흐름 뼈대**. 버튼 디바운스, 프로토콜 파서, 통신 링크,\n> 모터/미션 상태, 워치독까지 — \"지금 무슨 상태이고, 이 입력에 어떻게 반응하나\"를\n> 명시적으로 표로 만든 것이 FSM 이다. Anduril 같은 국방/드론 펌웨어 면접에서\n> **UART 패킷 파서 FSM** 은 거의 단골. 링 버퍼(이전 토픽)로 바이트를 모으고,\n> FSM 으로 프레임을 조립한다.\n\n---\n\n## 1. FSM 란 무엇인가\n\n유한한 **상태(state)** 집합 + **전이(transition)** 규칙 + (선택) **동작(action)**.\n매 tick 또는 매 이벤트마다: `현재상태 × 입력 -> 다음상태 (+ 출력/동작)`.\n\n세 가지 구현 스타일:\n\n| 스타일 | 언제 | 장단점 |\n|---|---|---|\n| **switch/case** | 상태 ≤ 5~6개 | 가장 명료, 디버깅 쉬움. 커지면 case 폭발 |\n| **함수 포인터 테이블** | 상태 많음 / 런타임 재구성 | `table[state](evt)` O(1) 디스패치, 확장 쉬움 |\n| **상태 전이 표(2D)** | 규칙이 데이터로 표현 | `next[state][evt]`, 매우 조밀하지만 action 얹기 번거로움 |\n\n---\n\n## 2. Mealy vs Moore ⭐ (개념 단골)\n\n| | **Moore** | **Mealy** |\n|---|---|---|\n| 출력 | `f(상태)` — 상태만의 함수 | `f(상태, 입력)` — 상태+입력 |\n| 상태 수 | 보통 더 많음 (출력용 상태 필요) | 더 적음 |\n| 타이밍 | 출력이 **레지스터드**(클럭 동기), 1클럭 지연 가능, **글리치 없음** | **조합 출력**, 더 빠름, 입력 글리치가 출력에 샐 수 있음 |\n| 예 | \"11 검출됨\" 전용 상태 S2 를 두고 출력=1 | S1 에서 입력 1 오면 즉시 출력=1 |\n\n> **한 줄 답변**: \"Moore 는 출력이 상태만의 함수라 글리치가 없고 예측 가능하지만\n> 상태가 더 필요하다. Mealy 는 상태+입력이라 같은 동작을 더 적은 상태로 하고\n> 반응이 한 박자 빠르지만, 입력 글리치가 출력에 반영될 수 있다.\"\n\n이 문제 세트(Q80)는 overlapping **\"11\" 검출기**를 Moore(3상태)·Mealy(2상태)\n양쪽으로 구현해 같은 검출 벡터가 나오는지 비교한다.\n\n---\n\n## 3. 계층적 상태 기계 (HSM) — 개념 (Q81)\n\n상태가 많아지면 **공통 전이**가 중복된다(예: 어느 상태에서든 POWER_OFF → OFF).\nHSM 은 상태를 **중첩(superstate/substate)** 시켜, 자식이 처리 못 한 이벤트를\n**부모로 버블링**한다. 공통 동작을 부모 한 곳에만 쓰면 되므로 중복 제거.\n\n```\n   [ON]  (superstate)  ── EVT_POWER 를 여기서 처리 → OFF\n    ├─ IDLE  ── EVT_START → RUN\n    └─ RUN   ── EVT_STOP  → IDLE\n   [OFF]     ── EVT_POWER → IDLE\n```\n\n- RUN 에서 `EVT_POWER` → RUN 은 모름 → **부모 ON 이 처리** → OFF (버블링).\n- IDLE 에서 `EVT_START` → 자식이 직접 처리 (leaf).\n- UML statechart, QP/QF 프레임워크의 핵심 개념.\n\n---\n\n## 4. 실무 FSM 4대 요소\n\n### (a) entry / exit action (Q82)\n상태 **진입 시 entry**, **이탈 시 exit** 액션 자동 호출.\n리소스 init/cleanup(타이머 시작/정지, DMA enable/disable)을 전이 로직과 분리 →\n상태를 추가해도 대칭적으로 관리, 누락 방지.\n```\n전이(old→new):  exit(old)  →  state=new  →  entry(new)\n자기전이(new==old): 무동작 (또는 정책에 따라 재진입)\n```\n\n### (b) guard condition (Q83)\n같은 이벤트라도 **조건(guard)** 에 따라 다른 전이.\n```\nIDLE + RUN 이벤트:  value > 0 ?  → RUN\n                                  → ERROR\n```\nguard 는 부수효과 없는 **순수 술어**여야 한다(면접 팁: guard 안에서 상태 바꾸지 말 것).\n\n### (c) event queue (Q84)\n**ISR 이 이벤트를 큐에 push, main loop 가 pop 해서 FSM 주입.**\nISR 문맥에서 무거운 FSM 로직을 떼어내 → 짧은 ISR + 결정적 처리 + 재진입 안전.\n원형 버퍼(이전 토픽)가 그대로 이벤트 큐가 된다. full 이면 push 거부(또는 오버런 정책).\n\n### (d) timeout event (Q85)\nACTIVE 상태에서 일정 tick 동안 활동이 없으면 TIMEOUT 으로 → **무응답 감지/복구**.\n워치독, 링크 유실(link loss), 핸드셰이크 타임아웃의 전형. `event=1`(활동)이면\n타이머 리셋, `0`(무활동)이면 증가시켜 limit 도달 시 전이.\n\n---\n\n## 5. UART 패킷 파서 FSM ⭐⭐ (Q78 — 이 토픽의 핵심)\n\n바이트 스트림에서 프레임을 뽑아내는 **바이트 단위 FSM**. 드론 텔레메트리/명령\n링크의 심장. 프레임:\n\n```\n[0xAA sync][ len (1..MAX) ][ data × len ][ checksum = XOR(data) ]\n```\n\n```\n IDLE  ──(byte==0xAA)──▶ LEN\n LEN   ──(1..MAX)──────▶ DATA        (그 외 길이는 폐기 → IDLE)\n DATA  ──(idx==len)────▶ CKSUM       (각 바이트 저장 + 러닝 XOR)\n CKSUM ──(match)───────▶ IDLE + 패킷 완료(good++)\n       ──(mismatch)────▶ IDLE + bad++\n```\n\n**설계 포인트 (면접에서 파고드는 곳):**\n\n- **재동기화(resync)**: IDLE 에서 sync 바이트 아니면 그냥 버린다 → 스트림 중간\n  진입/노이즈에도 다음 프레임을 잡는다.\n- **길이 검증**: `len` 을 그대로 믿지 말 것. `1..MAX` 범위 밖이면 폐기해야\n  **버퍼 오버플로**를 막는다 (`data[idx++]` 가 배열을 넘지 않도록).\n- **checksum/CRC**: 예제는 XOR(간단). 실무는 CRC-16/CRC-32. 불일치 시 프레임\n  폐기 + 통계 카운트(bad_packets).\n- **back-to-back / partial**: 한 바이트씩 들어오는(부분 수신) 상황에서도 상태가\n  보존돼야 하고, 패킷이 끝나면 곧장 다음 sync 를 받을 수 있어야 한다.\n- **payload 소비**: 완료 시 `out_data/out_len` 에 복사해 호출자가 안전하게\n  꺼내가도록. 다음 패킷이 조립 버퍼를 덮어써도 무방.\n\n> 확장 질문: \"escape/byte-stuffing(SLIP, HDLC)은?\", \"가변 길이 필드/타입-길이-값\n> (TLV)은?\", \"CRC 를 스트리밍으로 갱신하려면?\", \"sync 가 payload 에 나타나면?\"\n> → 길이 프리픽스 방식은 payload 안의 0xAA 를 신경 안 써도 된다(길이만큼만 읽으므로).\n\n---\n\n## 6. 버튼 디바운싱 FSM (Q76)\n\n기계식 접점은 누를/뗄 때 수 ms 채터링. **N개 연속 동일 샘플**로 확정하는 4-상태 FSM:\n\n```\n RELEASED ──high──▶ BOUNCE_PRESS ──(N tick 연속 high)──▶ PRESSED\n PRESSED  ──low ──▶ BOUNCE_RELEASE ──(N tick 연속 low)──▶ RELEASED\n BOUNCE_* 중 반대 입력 → 글리치로 판단, 원래 상태 복귀 (카운트 취소)\n```\n\n- `pressed`(bool) 만 확정된 출력 → 상위 로직은 채터링을 못 본다.\n- 대안: **시프트 레지스터/카운터 적분기** (raw 를 `history\u003c\u003c=1|bit`, 특정 패턴이면 확정).\n- 인터뷰 팁: \"몇 tick? 샘플 주기?\" → 접점 안정화 시간(예 5~20ms) / 폴링 주기로 산정.\n\n---\n\n## 7. 신호등 FSM (Q79) — 타이머 기반 실시간 제어\n\n각 상태가 **자기 지속시간(tick)** 을 가지고 `RED→GREEN→YELLOW→RED` 순환.\n```\ntl_tick(): if (--timer \u003c= 0) { 다음 상태로 전이; timer = 다음상태_지속시간; }\n```\n확장: 보행자 버튼(비동기 이벤트 삽입), 야간 점멸(모드 전환) → HSM 으로 승격하기 좋은 예.\n\n---\n\n## 8. 인터뷰 팔로업 (follow-ups)\n\n- **\"switch vs 함수 포인터 테이블, 언제?\"** → 상태 적고 명료함 우선이면 switch,\n  상태 많거나 런타임 재구성/플러그인이면 테이블.\n- **\"Mealy 를 Moore 로 바꾸면?\"** → 출력 조합을 상태로 흡수(상태 수 증가), 출력 1클럭 지연.\n- **\"UART 파서에서 길이 검증 왜 필수?\"** → 신뢰 못 할 `len` 으로 `data[]` 오버플로 → 원격 취약점.\n- **\"ISR 에서 FSM 을 직접 돌리면?\"** → ISR 길어지고 재진입/우선순위 문제 → event queue 로 디커플.\n- **\"상태 폭발(state explosion) 대응?\"** → HSM(계층화), 직교 영역(orthogonal region), 상태 변수 분리.\n- **\"FSM 테스트 전략?\"** → 입력 시퀀스 → 상태/출력 벡터를 골든값과 비교(이 하네스가 그 방식).\n\n---\n\n## 9. 흔한 버그 체크리스트 (gotchas)\n\n- [ ] UART: `len` 미검증 → `data[idx++]` 배열 오버플로.\n- [ ] UART: 완료 후 IDLE 복귀 안 해서 다음 프레임 못 잡음(재동기화 실패).\n- [ ] 디바운스: BOUNCE_* 에서 반대 입력 시 카운트 리셋/취소 누락 → 글리치 통과.\n- [ ] entry/exit: 자기전이(new==old)에서 exit/entry 를 또 호출(정책 미정) → 리소스 이중 해제.\n- [ ] guard: guard 안에서 부수효과(상태 변경) → 재현 불가 버그.\n- [ ] event queue: full/empty 판정 오류, ISR↔main `volatile`/원자성 누락.\n- [ ] timeout: 활동(event=1) 시 타이머 리셋 누락 → 정상인데 타임아웃.\n- [ ] 상태 enum 에 `default` 없어 미정의 상태에서 침묵 → 방어적 `default` 로 안전상태 복귀.\n\n---\n\n## 10. Anduril / 드론 펌웨어 맥락\n\n- **통신 링크 파서**: MAVLink 유사 텔레메트리/명령 프레이밍을 바이트 FSM 으로 파싱.\n  링 버퍼(RX ISR) → FSM(main) → 명령 디스패치. 경합/저하 환경에서 **재동기화**와\n  **CRC 폐기** 가 곧 링크 견고성.\n- **미션/모드 상태 관리**: DISARMED→ARMED→TAKEOFF→MISSION→RTL→LAND 를 HSM 으로.\n  FAILSAFE 는 어느 상태에서든 부모가 가로채는 전형적 버블링.\n- **워치독/타임아웃**: 링크 유실·센서 무응답 시 TIMEOUT → 안전 상태(hover/RTL) 복귀.\n- **디바운스/GPIO 이벤트**: 물리 스위치, 세이프티 인터록 확정.\n- **테스트 가능성**: FSM 은 입력→출력이 결정적이라 단위 테스트와 HIL 에 잘 맞는다 —\n  Anduril 이 중시하는 \"검증 가능한 펌웨어\" 와 직결.\n", "problems": [{"num": 76, "slug": "button_debounce_fsm", "title_ko": "버튼 디바운싱 FSM", "title_en": "Button debouncing FSM", "difficulty": "medium", "tags": ["switch", "gpio", "debounce"], "prompt_ko": "4-상태 switch FSM 으로 버튼을 디바운스하라. N개 연속 동일 샘플로 press/release 를 확정하고, BOUNCE 중 반대 입력은 글리치로 취소한다. pressed(bool) 이 확정 출력.", "prompt_en": "Debounce a button with a 4-state switch FSM. Confirm press/release after N consecutive equal samples; cancel on an opposite sample during BOUNCE. pressed(bool) is the debounced output.", "signature": "void button_fsm_update(button_fsm_t *fsm, bool gpio_high)", "examples": [{"in": "ticks=2, seq 0 1 1 1 1 0 0 0", "out": "pressed: 0 0 0 1 1 1 1 0"}, {"in": "single spike 1,0 (ticks=3)", "out": "pressed=false"}], "hints": ["상태: RELEASED, BOUNCE_PRESS, PRESSED, BOUNCE_RELEASE.", "BOUNCE_PRESS 에서 high 유지 시 ++counter>=ticks 로 PRESSED 확정.", "BOUNCE_* 중 반대 입력이면 원래 상태로 되돌려 카운트 취소."], "solution": "void button_fsm_update(button_fsm_t *fsm, bool gpio_high) {\n    if (!fsm) return;\n    switch (fsm->state) {\n        case BTN_RELEASED:\n            if (gpio_high) { fsm->state = BTN_BOUNCE_PRESS; fsm->counter = 0; }\n            break;\n        case BTN_BOUNCE_PRESS:\n            if (gpio_high) {\n                if (++fsm->counter >= fsm->ticks) { fsm->state = BTN_PRESSED; fsm->pressed = true; }\n            } else { fsm->state = BTN_RELEASED; }\n            break;\n        case BTN_PRESSED:\n            if (!gpio_high) { fsm->state = BTN_BOUNCE_RELEASE; fsm->counter = 0; }\n            break;\n        case BTN_BOUNCE_RELEASE:\n            if (!gpio_high) {\n                if (++fsm->counter >= fsm->ticks) { fsm->state = BTN_RELEASED; fsm->pressed = false; }\n            } else { fsm->state = BTN_PRESSED; }\n            break;\n    }\n}", "explanation_ko": "RELEASED/PRESSED 는 안정 상태, BOUNCE_* 는 확정 대기 상태다. 대기 중 같은 입력이 ticks 번 연속되면 확정 전이하고, 반대 입력이 한 번이라도 오면 글리치로 보고 안정 상태로 되돌려 카운터를 무효화한다. 상위 로직은 pressed 만 보므로 채터링을 관측하지 못한다.", "complexity": "O(1) time, O(1) space", "pitfalls": ["BOUNCE 중 반대 입력 시 카운트 취소 누락 → 글리치 통과", "ticks/샘플 주기 산정 없이 임의값 사용", "counter 를 확정 시 리셋 안 해 다음 전이 오작동"], "anduril_context": "세이프티 인터록 스위치, 물리 arm/disarm 버튼 등 기계 접점 확정."}, {"num": 77, "slug": "func_ptr_state_table", "title_ko": "함수 포인터 배열 FSM", "title_en": "Function-pointer state table FSM", "difficulty": "easy", "tags": ["function-pointer", "table", "dispatch"], "prompt_ko": "상태별 핸들러를 함수 포인터 배열에 담아 table[state](input) 로 디스패치하라. 각 핸들러는 다음 상태를 반환한다. 모터 IDLE/RUN/STOP.", "prompt_en": "Dispatch via a function-pointer array: table[state](input). Each handler returns the next state. Motor IDLE/RUN/STOP.", "signature": "motor_state_t motor_fsm_dispatch(motor_fsm_t *fsm, motor_input_t in)", "examples": [{"in": "IDLE + IN_START", "out": "M_RUN"}, {"in": "RUN + IN_STOP", "out": "M_STOP"}, {"in": "STOP + IN_RESET", "out": "M_IDLE"}], "hints": ["핸들러 시그니처: motor_state_t (*)(motor_input_t).", "init 에서 table[M_IDLE]=h_idle 처럼 연결.", "dispatch: state = table[state](in)."], "solution": "static motor_state_t h_idle(motor_input_t in){ return (in==IN_START)?M_RUN :M_IDLE; }\nstatic motor_state_t h_run (motor_input_t in){ return (in==IN_STOP) ?M_STOP:M_RUN;  }\nstatic motor_state_t h_stop(motor_input_t in){ return (in==IN_RESET)?M_IDLE:M_STOP; }\n\nvoid motor_fsm_init(motor_fsm_t *fsm){\n    if (!fsm) return;\n    fsm->state = M_IDLE;\n    fsm->table[M_IDLE]=h_idle; fsm->table[M_RUN]=h_run; fsm->table[M_STOP]=h_stop;\n}\n\nmotor_state_t motor_fsm_dispatch(motor_fsm_t *fsm, motor_input_t in){\n    if (!fsm) return M_IDLE;\n    fsm->state = fsm->table[fsm->state](in);\n    return fsm->state;\n}", "explanation_ko": "현재 상태를 인덱스로 핸들러를 O(1) 로 골라 호출한다. 상태를 추가하려면 핸들러 함수와 테이블 한 줄만 늘리면 되므로 switch 폭발이 없다. 각 핸들러가 '다음 상태' 만 반환하도록 하면 전이 규칙이 함수별로 국소화된다.", "complexity": "O(1) time, O(states) space (table)", "pitfalls": ["table 초기화 누락 → NULL 함수 포인터 호출 크래시", "입력값을 인덱스로 그대로 써서 범위 밖 접근", "상태 enum 에 M_COUNT 안 두어 배열 크기 하드코딩"], "anduril_context": "명령 디스패처, 페이로드/짐벌 모드 상태, 플러그인형 상태 로직."}, {"num": 78, "slug": "uart_packet_parser_fsm", "title_ko": "UART 패킷 파서 FSM", "title_en": "UART packet parser FSM", "difficulty": "hard", "tags": ["protocol", "parser", "checksum", "framing"], "prompt_ko": "바이트 스트림 파서. 프레임 [0xAA][len(1..MAX)][data x len][XOR checksum]. 바이트마다 호출하며, 정상 패킷이 완성되면 true 를 반환하고 out_data/out_len 을 채운다. 길이 검증, 재동기화, checksum 불일치 통계 포함.", "prompt_en": "Byte-stream parser. Frame [0xAA][len(1..MAX)][data x len][XOR checksum]. Called per byte; return true when a valid packet completes, filling out_data/out_len. Include length validation, resync, and bad-checksum stats.", "signature": "bool uart_parse_byte(uart_parser_t *p, uint8_t byte)", "examples": [{"in": "AA 03 11 22 33 00", "out": "true, payload 11 22 33"}, {"in": "AA 02 01 02 FF (cksum should be 03)", "out": "false, bad_packets=1"}], "hints": ["상태: IDLE, LEN, DATA, CKSUM.", "LEN 에서 1..MAX 범위 밖이면 IDLE 로 폐기 (오버플로 방지).", "DATA 에서 러닝 XOR, idx==len 이면 CKSUM 으로.", "CKSUM 에서 항상 IDLE 로 복귀 후 match 면 good++, 아니면 bad++."], "solution": "bool uart_parse_byte(uart_parser_t *p, uint8_t byte){\n    if (!p) return false;\n    switch (p->state){\n        case P_IDLE:\n            if (byte == 0xAA) p->state = P_LEN;\n            break;\n        case P_LEN:\n            if (byte >= 1 && byte \u003c= UART_MAX_DATA){\n                p->len = byte; p->idx = 0; p->checksum = 0; p->state = P_DATA;\n            } else { p->state = P_IDLE; }\n            break;\n        case P_DATA:\n            p->data[p->idx++] = byte;\n            p->checksum ^= byte;\n            if (p->idx >= p->len) p->state = P_CKSUM;\n            break;\n        case P_CKSUM:\n            p->state = P_IDLE;\n            if (byte == p->checksum){\n                memcpy(p->out_data, p->data, p->len);\n                p->out_len = p->len; p->good_packets++;\n                return true;\n            }\n            p->bad_packets++;\n            break;\n    }\n    return false;\n}", "explanation_ko": "IDLE 은 sync(0xAA)를 만날 때까지 바이트를 버려 스트림 중간에서도 재동기화한다. LEN 에서 길이를 1..MAX 로 검증해 data[] 오버플로를 막는다(신뢰 못 할 원격 값 방어). DATA 는 저장하며 러닝 XOR 을 갱신하고, len 개를 다 받으면 CKSUM 에서 무결성을 검사한다. 완료 시 out 버퍼로 복사해 조립 버퍼와 분리하고, 어느 경우든 IDLE 로 돌아가 다음 프레임을 곧장 받는다.", "complexity": "O(1) per byte, O(MAX) space", "pitfalls": ["len 미검증 → data[idx++] 배열 오버플로(원격 취약점)", "완료 후 IDLE 복귀 누락 → 재동기화 실패", "checksum 초기화(=0)를 LEN 에서 안 해 이전 값 잔존", "부분 수신(바이트 단위)에서 상태 보존 실패"], "anduril_context": "드론 텔레메트리/명령 링크 프레이밍, MAVLink 유사 파서, GPS/IMU 시리얼 스트림."}, {"num": 79, "slug": "traffic_light_fsm", "title_ko": "신호등 제어 FSM", "title_en": "Traffic-light FSM", "difficulty": "easy", "tags": ["timer", "real-time", "cycle"], "prompt_ko": "타이머 기반 신호등. RED->GREEN->YELLOW->RED 순환, 각 상태는 자기 지속시간(tick)을 가진다. tl_tick() 이 매 tick 카운트다운하고 0 도달 시 다음 상태로 전이+타이머 재장전.", "prompt_en": "Timer-based traffic light. RED->GREEN->YELLOW->RED, each with its own duration. tl_tick() counts down and transitions + reloads on reaching 0.", "signature": "void tl_tick(tl_fsm_t *fsm)", "examples": [{"in": "red2 green2 yellow1, tick x6", "out": "R G G Y R R"}], "hints": ["--timer \u003c= 0 이면 전이.", "전이 시 다음 상태의 지속시간으로 timer 재장전.", "default 케이스로 안전 상태(RED) 복귀."], "solution": "void tl_tick(tl_fsm_t *fsm){\n    if (!fsm) return;\n    if (--fsm->timer \u003c= 0){\n        switch (fsm->state){\n            case TL_RED:    fsm->state = TL_GREEN;  fsm->timer = fsm->green_t;  break;\n            case TL_GREEN:  fsm->state = TL_YELLOW; fsm->timer = fsm->yellow_t; break;\n            case TL_YELLOW: fsm->state = TL_RED;    fsm->timer = fsm->red_t;    break;\n            default:        fsm->state = TL_RED;    fsm->timer = fsm->red_t;    break;\n        }\n    }\n}", "explanation_ko": "각 상태가 지속시간 카운터를 가지고, 매 tick 감소하다 0 이하가 되면 순환 순서의 다음 상태로 넘어가며 그 상태의 지속시간으로 타이머를 재장전한다. default 는 손상된 상태값을 안전 상태(RED)로 복구한다.", "complexity": "O(1) time, O(1) space", "pitfalls": ["타이머 재장전 누락 → 다음 tick 바로 재전이", "전이 순서 실수(RED 다음 YELLOW 등)", "default 없어 미정의 상태에서 멈춤"], "anduril_context": "주기적 시퀀서, LED 상태 표시, 타임슬롯 스케줄러의 기본형."}, {"num": 80, "slug": "mealy_vs_moore", "title_ko": "Mealy vs Moore ('11' 검출기)", "title_en": "Mealy vs Moore ('11' detector)", "difficulty": "medium", "tags": ["mealy", "moore", "sequence-detector", "concept"], "prompt_ko": "overlapping '11' 검출기를 Moore(출력=f(상태), 3상태)와 Mealy(출력=f(상태,입력), 2상태)로 각각 구현하라. 두 step 함수 모두 (전이 후 기준) 출력을 반환.", "prompt_en": "Implement an overlapping '11' detector as both Moore (output=f(state), 3 states) and Mealy (output=f(state,input), 2 states). Both step functions return the output.", "signature": "int moore_step(moore_fsm_t *m, int bit); int mealy_step(mealy_fsm_t *m, int bit)", "examples": [{"in": "in = 0 1 1 0 1 1 1", "out": "both: 0 0 1 0 0 1 1"}], "hints": ["Moore: S0->S1->S2, 출력 = (state==S2). 겹침 위해 S2 에서 1이면 S2 유지.", "Mealy: S0->S1, 출력 = (state==S1 && bit==1).", "같은 검출 벡터가 나오지만 Mealy 는 상태가 하나 적다."], "solution": "int moore_step(moore_fsm_t *m, int bit){\n    if (!m) return 0;\n    switch (m->state){\n        case MO_S0: m->state = bit?MO_S1:MO_S0; break;\n        case MO_S1: m->state = bit?MO_S2:MO_S0; break;\n        case MO_S2: m->state = bit?MO_S2:MO_S0; break;\n    }\n    return (m->state==MO_S2)?1:0;\n}\n\nint mealy_step(mealy_fsm_t *m, int bit){\n    if (!m) return 0;\n    int out = 0;\n    switch (m->state){\n        case ME_S0: m->state = bit?ME_S1:ME_S0; out = 0; break;\n        case ME_S1: out = bit?1:0; m->state = bit?ME_S1:ME_S0; break;\n    }\n    return out;\n}", "explanation_ko": "Moore 는 '11 을 봤다' 라는 전용 상태 S2 를 두고 출력을 상태만의 함수로 낸다 — 상태가 하나 더 필요하지만 출력이 상태에 고정돼 예측 가능/글리치 없음. Mealy 는 S1(1을 하나 봄)에서 입력이 1이면 그 자리에서 출력 1을 내므로 상태 2개로 충분하고 반응이 즉각적이다. 겹침 검출을 위해 검출 후에도 마지막 1을 S1/S2 로 유지한다.", "complexity": "O(1) per input, O(1) space", "pitfalls": ["Mealy 출력을 전이 후 상태로 계산해 한 박자 밀림", "겹침(overlap) 처리 안 해 '111' 에서 검출 누락", "Moore 에서 S2->(0)->S0 재시작 안 하면 오검출"], "anduril_context": "비트 스트림 패턴/프리앰블 검출, 시리얼 프로토콜 sync 워드 인식."}, {"num": 81, "slug": "hierarchical_state_machine", "title_ko": "계층적 상태 기계 (HSM)", "title_en": "Hierarchical state machine (HSM)", "difficulty": "medium", "tags": ["hsm", "superstate", "event-bubbling", "concept"], "prompt_ko": "leaf 상태 OFF / (superstate ON 내부) IDLE, RUN. leaf 가 처리 못한 이벤트는 부모 ON 으로 버블링. EVT_POWER: OFF->IDLE(leaf), IDLE/RUN->OFF(부모). START/STOP 은 leaf 특화. 처리 레벨을 반환하라.", "prompt_en": "Leaf states OFF / (inside superstate ON) IDLE, RUN. Unhandled leaf events bubble to parent ON. EVT_POWER: OFF->IDLE(leaf), IDLE/RUN->OFF(parent). START/STOP are leaf-specific. Return where handled.", "signature": "hsm_disp_t hsm_dispatch(hsm_t *h, hsm_evt_t e)", "examples": [{"in": "RUN + EVT_POWER", "out": "DISP_PARENT, state=OFF"}, {"in": "IDLE + EVT_START", "out": "DISP_LEAF, state=RUN"}], "hints": ["먼저 leaf(현재 상태)에서 이벤트 처리 시도.", "leaf 가 처리 안 하면(break) 부모 ON 로 위임.", "부모 ON 은 IDLE/RUN 에서 EVT_POWER 를 잡아 OFF 로."], "solution": "hsm_disp_t hsm_dispatch(hsm_t *h, hsm_evt_t e){\n    if (!h) return DISP_UNHANDLED;\n    switch (h->state){\n        case ST_OFF:\n            if (e==EVT_POWER){ h->state=ST_IDLE; return DISP_LEAF; }\n            return DISP_UNHANDLED;\n        case ST_IDLE:\n            if (e==EVT_START){ h->state=ST_RUN; return DISP_LEAF; }\n            break;\n        case ST_RUN:\n            if (e==EVT_STOP){ h->state=ST_IDLE; return DISP_LEAF; }\n            break;\n    }\n    if (h->state==ST_IDLE || h->state==ST_RUN){\n        if (e==EVT_POWER){ h->state=ST_OFF; return DISP_PARENT; }\n    }\n    return DISP_UNHANDLED;\n}", "explanation_ko": "디스패치는 자식(leaf) 핸들러를 먼저 시도하고, 처리하지 못하면 부모 superstate 로 올라가 위임한다. EVT_POWER 같은 공통 이벤트를 부모 한 곳에만 정의하면 IDLE·RUN 각각에 중복 작성할 필요가 없다 — 이것이 HSM 이 상태 폭발을 줄이는 핵심. 반환값(LEAF/PARENT/UNHANDLED)으로 어느 레벨이 처리했는지 검증한다.", "complexity": "O(depth) per event, O(1) space", "pitfalls": ["버블링 없이 각 상태에 공통 전이 중복 작성", "부모/자식 처리 우선순위 혼동", "진짜 HSM 은 entry/exit 를 조상 경로까지 실행 — 단순화 주의"], "anduril_context": "비행 모드 상태(ARMED 하위 TAKEOFF/MISSION/RTL), FAILSAFE 를 부모가 가로채는 구조."}, {"num": 82, "slug": "entry_exit_actions", "title_ko": "entry/exit 액션 FSM", "title_en": "Entry/exit action FSM", "difficulty": "easy", "tags": ["entry-exit", "action", "lifecycle"], "prompt_ko": "전이 시 exit(old)->entry(new) 를 자동 호출하라. 자기전이(new==old)는 무동작. 액션은 trace 문자열에 토큰을 남긴다(진입 대문자, 이탈 소문자).", "prompt_en": "On transition, call exit(old)->entry(new) automatically. Self-transition (new==old) is a no-op. Actions append tokens to a trace (entry uppercase, exit lowercase).", "signature": "void eea_transition(eea_fsm_t *f, eea_state_t next)", "examples": [{"in": "init; ->RUN ->STOP ->IDLE", "out": "trace 'IiRrSsI'"}, {"in": "->same state", "out": "no tokens"}], "hints": ["init 은 초기 상태의 entry 만 호출('I').", "state != next 일 때만 exit->전이->entry.", "제공된 eea_entry/eea_exit 헬퍼를 사용."], "solution": "void eea_init(eea_fsm_t *f){\n    if (!f) return;\n    f->state = E_IDLE; f->trace[0]='\\0'; f->trace_len = 0;\n    eea_entry(f, E_IDLE);\n}\n\nvoid eea_transition(eea_fsm_t *f, eea_state_t next){\n    if (!f || next >= E_COUNT) return;\n    if (f->state != next){\n        eea_exit(f, f->state);\n        f->state = next;\n        eea_entry(f, next);\n    }\n}", "explanation_ko": "전이는 반드시 exit(현재)->상태변경->entry(다음) 순서로 일어난다. 이 순서 덕분에 이전 상태의 정리(타이머 정지, DMA off)가 새 상태의 준비보다 먼저 실행돼 리소스가 겹치지 않는다. 자기전이에서 exit/entry 를 또 부르면 리소스를 이중으로 건드릴 수 있어 무동작으로 둔다(정책에 따라 재진입 허용도 가능).", "complexity": "O(1) time, O(1) space", "pitfalls": ["자기전이에서 exit/entry 재실행 → 이중 해제/재초기화", "exit/entry 순서 뒤바뀜 → 리소스 겹침", "init 에서 초기 상태 entry 누락"], "anduril_context": "상태별 타이머/DMA/센서 전원 관리, 모드 전환 시 리소스 lifecycle 자동화."}, {"num": 83, "slug": "guard_conditions", "title_ko": "guard 조건 FSM", "title_en": "Guard condition FSM", "difficulty": "easy", "tags": ["guard", "condition", "branch"], "prompt_ko": "IDLE 에서 RUN 이벤트 시 guard(value>0)로 분기: 참이면 RUN, 거짓이면 ERROR. RESET 이벤트는 어디서든 IDLE 로. 전이 후 상태를 반환.", "prompt_en": "On RUN event in IDLE, branch by guard (value>0): RUN if true, else ERROR. RESET returns to IDLE from anywhere. Return resulting state.", "signature": "guard_state_t guard_update(guard_fsm_t *f, guard_evt_t ev)", "examples": [{"in": "value=0, GEV_RUN", "out": "G_ERROR"}, {"in": "value=5, GEV_RUN", "out": "G_RUN"}], "hints": ["guard 는 부수효과 없는 순수 술어(value>0).", "IDLE 에서만 RUN 이벤트를 분기.", "RUN/ERROR 에서 RESET -> IDLE."], "solution": "guard_state_t guard_update(guard_fsm_t *f, guard_evt_t ev){\n    if (!f) return G_IDLE;\n    switch (f->state){\n        case G_IDLE:\n            if (ev==GEV_RUN)\n                f->state = (f->value > 0) ? G_RUN : G_ERROR;\n            break;\n        case G_RUN:\n        case G_ERROR:\n            if (ev==GEV_RESET) f->state = G_IDLE;\n            break;\n    }\n    return f->state;\n}", "explanation_ko": "같은 RUN 이벤트라도 guard(value>0)의 참/거짓에 따라 전이 대상이 갈린다. guard 는 상태를 바꾸지 않는 순수 조건이어야 재현성이 보장된다. RESET 은 RUN·ERROR 어디서든 IDLE 로 복귀시키는 공통 전이다.", "complexity": "O(1) time, O(1) space", "pitfalls": ["guard 안에서 부수효과(상태 변경) → 재현 불가 버그", "guard 실패 경로(ERROR) 누락", "여러 guard 우선순위/배타성 미정의"], "anduril_context": "arm 조건 검사(배터리/GPS lock/센서 healthy), 안전 조건 만족 시에만 상태 진입."}, {"num": 84, "slug": "event_queue_fsm", "title_ko": "이벤트 큐 FSM", "title_en": "Event-queue FSM", "difficulty": "medium", "tags": ["event-queue", "circular-buffer", "isr-decouple"], "prompt_ko": "원형 버퍼 이벤트 큐(push/pop, full/empty)와 이를 소비하는 FSM 을 구현하라. ISR 이 push, main 이 pop 해서 FSM 에 주입하는 디커플 패턴. IDLE/RUN/ERROR 전이.", "prompt_en": "Implement a circular-buffer event queue (push/pop, full/empty) and an FSM that consumes it. ISR pushes, main pops and feeds the FSM. IDLE/RUN/ERROR transitions.", "signature": "bool evq_push(event_queue_t*, event_t); bool evq_pop(event_queue_t*, event_t*); q_state_t evq_fsm_handle(evq_fsm_t*, const event_t*)", "examples": [{"in": "START ERROR STOP START STOP", "out": "final state Q_IDLE"}, {"in": "push 8 into size-8, then 9th", "out": "9th rejected"}], "hints": ["count 필드로 full(==SIZE)/empty(==0) 판정.", "head 는 쓰기, tail 은 읽기, 각각 %SIZE wrap.", "FSM: IDLE:START->RUN, RUN:STOP->IDLE|ERROR->ERROR, ERROR:STOP->IDLE."], "solution": "bool evq_push(event_queue_t *q, event_t ev){\n    if (!q || q->count == EVQ_SIZE) return false;\n    q->buffer[q->head] = ev;\n    q->head = (q->head + 1) % EVQ_SIZE;\n    q->count++;\n    return true;\n}\nbool evq_pop(event_queue_t *q, event_t *out){\n    if (!q || !out || q->count == 0) return false;\n    *out = q->buffer[q->tail];\n    q->tail = (q->tail + 1) % EVQ_SIZE;\n    q->count--;\n    return true;\n}\nq_state_t evq_fsm_handle(evq_fsm_t *f, const event_t *ev){\n    if (!f || !ev) return Q_IDLE;\n    switch (f->state){\n        case Q_IDLE:  if (ev->type==EV_START) f->state=Q_RUN; break;\n        case Q_RUN:   if (ev->type==EV_STOP) f->state=Q_IDLE;\n                      else if (ev->type==EV_ERROR) f->state=Q_ERROR; break;\n        case Q_ERROR: if (ev->type==EV_STOP) f->state=Q_IDLE; break;\n    }\n    return f->state;\n}", "explanation_ko": "큐는 head(생산)와 tail(소비)를 %SIZE 로 순환시키고 count 로 full/empty 를 구분한다. ISR 은 짧게 push 만 하고, 무거운 FSM 로직은 main loop 에서 pop 후 실행해 ISR 지연과 재진입 문제를 없앤다(디커플). FSM 은 이벤트 타입에 따라 상태를 옮긴다.", "complexity": "push/pop O(1), O(SIZE) space", "pitfalls": ["full/empty 판정 오류(head==tail 모호성)", "ISR↔main 공유 시 volatile/원자성 누락", "pop out 포인터 NULL 미검사", "오버런 정책(거부 vs 덮어쓰기) 미정의"], "anduril_context": "UART/센서 ISR 이 이벤트를 큐잉, 제어 루프 FSM 이 비동기 처리 — ISR 디커플의 정석."}, {"num": 85, "slug": "timeout_event_fsm", "title_ko": "타임아웃 이벤트 FSM", "title_en": "Timeout event FSM", "difficulty": "easy", "tags": ["timeout", "watchdog", "recovery"], "prompt_ko": "ACTIVE 상태에서 limit tick 동안 활동(event=1)이 없으면 TIMEOUT 으로. event=1 은 타이머 리셋, 0 은 무활동 tick. TIMEOUT 에서 event=1 이면 ACTIVE 로 복구. 전이 후 상태 반환.", "prompt_en": "In ACTIVE, if no activity (event=1) for limit ticks -> TIMEOUT. event=1 resets timer, 0 is an idle tick. From TIMEOUT, event=1 recovers to ACTIVE. Return resulting state.", "signature": "to_state_t timeout_update(timeout_fsm_t *f, int event)", "examples": [{"in": "limit=3, events 0 1 0 0 0", "out": "IDLE ACTIVE ACTIVE ACTIVE TIMEOUT"}, {"in": "continuous 1 0 1 0...", "out": "never TIMEOUT"}], "hints": ["IDLE: event==1 -> ACTIVE, timer=0.", "ACTIVE: event==0 이면 ++timer>=limit -> TIMEOUT, event==1 이면 timer=0.", "TIMEOUT: event==1 -> ACTIVE(복구)."], "solution": "to_state_t timeout_update(timeout_fsm_t *f, int event){\n    if (!f) return TO_IDLE;\n    switch (f->state){\n        case TO_IDLE:\n            if (event==1){ f->state=TO_ACTIVE; f->timer=0; }\n            break;\n        case TO_ACTIVE:\n            if (event==0){ if (++f->timer >= f->limit) f->state=TO_TIMEOUT; }\n            else { f->timer = 0; }\n            break;\n        case TO_TIMEOUT:\n            if (event==1){ f->state=TO_ACTIVE; f->timer=0; }\n            break;\n    }\n    return f->state;\n}", "explanation_ko": "ACTIVE 에서 활동(event=1)이 오면 타이머를 0 으로 리셋하고, 무활동 tick(0)이 쌓여 limit 에 도달하면 TIMEOUT 으로 전이한다. TIMEOUT 은 무응답을 나타내며 활동이 재개되면 ACTIVE 로 복구한다. 워치독/링크 유실 감지의 기본 골격이다.", "complexity": "O(1) time, O(1) space", "pitfalls": ["활동 시 timer 리셋 누락 → 정상인데 타임아웃", "limit off-by-one(>= vs >)", "TIMEOUT 에서 복구 경로 누락 → 영구 정지"], "anduril_context": "링크 유실/센서 무응답 감지 후 FAILSAFE(hover/RTL), 핸드셰이크 타임아웃, 워치독."}]}, {"id": "data_processing", "order": 8, "range": "Q86-95", "icon": "📡", "title_en": "Data Processing & Protocols", "title_ko": "데이터 처리 & 프로토콜", "summary_ko": "텔레메트리 무결성(XOR/sum8 체크섬, CRC-16 LUT), 프레이밍/파싱(바이너리 패킷, NMEA GPS), FPU 없는 수치처리(고정소수점 Q포맷, 이동평균 필터), 대역폭 절약(RLE, base64), 바이트 패턴 탐색(KMP)을 C로 직접 구현한다. 핵심은 오류 검출력, 버퍼 경계, 오버플로, 부분 프레임 방어.", "summary_en": "Implement telemetry integrity (XOR/sum8 checksums, table-driven CRC-16), framing/parsing (binary packets, NMEA GPS), FPU-free math (fixed-point Q-format, moving-average filter), bandwidth savers (RLE, base64), and byte-pattern search (KMP). Emphasis on error-detection strength, buffer bounds, overflow, and partial-frame defense.", "anduril_relevance_ko": "드론/자율체는 노이즈 있는 RF·시리얼 링크로 텔레메트리와 명령을 주고받는다. 비트 하나가 뒤집혀도 잘못된 명령이 실행되면 안 되므로 checksum/CRC 무결성이 필수다. MCU엔 FPU가 없거나 느려 PID 게인·필터 계수를 고정소수점(Q포맷)으로 돌리고, IMU/기압계 노이즈는 이동평균(SMA)으로 죽인다. 좁은 대역폭엔 RLE/base64로 페이로드를 줄이거나 텍스트 채널에 싣는다. 인터뷰어는 프레이밍(start/len/CRC/end), 엔디안, 오버플로, 버퍼 경계, 부분 프레임 재동기화를 파고든다. NMEA GPS 파싱과 XMODEM CRC는 실무 그 자체다.", "concepts": [{"term": "XOR checksum", "ko": "가장 싼 검사. 자리바뀜·짝수개 비트오류 못 잡음. NMEA가 사용.", "en": "Cheapest check; misses transpositions and even-count bit errors. Used by NMEA."}, {"term": "CRC-16 LUT", "ko": "다항식 나눗셈을 256엔트리 테이블로 바이트당 1회 조회. 실무는 const로 플래시에 구움.", "en": "Polynomial division via a 256-entry table, one lookup per byte; baked as const in flash."}, {"term": "LUT 생성", "ko": "table[i]=(i\u003c\u003c8)를 8번 나눈 잔여(MSB-first). init/reflect/poly로 변종 다수.", "en": "table[i] = remainder of (i\u003c\u003c8) after 8 divisions (MSB-first); variants differ by init/reflect/poly."}, {"term": "framing", "ko": "[start][len][payload][CRC][end]. 마커·길이·체크섬으로 경계와 무결성 확인.", "en": "[start][len][payload][CRC][end]: markers, length and checksum bound and verify a frame."}, {"term": "Q format", "ko": "값=raw/2^q. 덧셈은 그대로, 곱셈은 int64 곱 후 >>q로 스케일 복원.", "en": "value = raw/2^q; add directly, multiply via int64 product then >>q to rescale."}, {"term": "moving average", "ko": "창 W의 SMA. 지연 ~ W/2. 스트리밍이면 running sum으로 O(1) 갱신.", "en": "SMA of window W; lag ~ W/2; O(1) update with a running sum when streaming."}, {"term": "RLE", "ko": "[value][count]. count 8비트면 255에서 분할. 무런 데이터는 2배 팽창.", "en": "[value][count]; splits at 255 for 8-bit count; runless data expands ~2x."}, {"term": "base64", "ko": "3바이트->4문자(6비트씩), = 패딩, 크기 +33%. 텍스트 채널용.", "en": "3 bytes -> 4 chars (6 bits each), '=' padding, +33% size; for text channels."}, {"term": "KMP", "ko": "LPS(prefix-suffix) 테이블로 실패 시 되돌아갈 위치를 미리 계산 -> O(n+m).", "en": "LPS (prefix-suffix) table precomputes fallback positions, giving O(n+m) search."}], "study_note_md": "# 08. Data Processing & Protocols (데이터 처리 & 프로토콜) · Q86-95 📡\n\n> 링크 위로 **바이트를 안전하게 주고받는** 드릴. 텔레메트리 무결성(checksum/CRC),\n> 프레이밍/파싱, 제어루프 수치처리(fixed-point, moving-average), 대역폭 절약\n> (RLE/base64), 바이트 스트림 패턴 탐색(KMP). Anduril 펌웨어 인터뷰의\n> \"RF/시리얼 링크로 프레임을 받는데 깨진 걸 어떻게 걸러내나?\" 유형.\n\n---\n\n## 왜 이 토픽이 인터뷰에 나오나\n\n- 드론/자율체는 **노이즈 있는 RF·시리얼 링크**로 텔레메트리와 명령을 주고받는다.\n  비트 하나가 뒤집혀도 잘못된 명령이 실행되면 안 되므로 **checksum/CRC 무결성**이 필수다.\n- MCU엔 **FPU가 없거나 느리다**. PID 게인·필터 계수는 **고정소수점(Q 포맷)**으로 돌린다.\n  이동평균(SMA)은 센서(IMU/기압계) 노이즈를 죽이는 가장 값싼 필터다.\n- 대역폭이 좁으니 **RLE/base64** 같은 인코딩으로 페이로드를 줄이거나 텍스트 채널에 싣는다.\n- 프레이밍(start/end 마커, length, CRC)과 **파서**(NMEA GPS 등)는 실무 그 자체다.\n  인터뷰어는 여기서 **엔디안, 오버플로, 버퍼 경계, 부분 프레임(partial frame)**을 파고든다.\n\n---\n\n## 핵심 개념 치트시트\n\n| 개념 | 요점 |\n|---|---|\n| **XOR checksum** | 가장 싼 검사. 비트 오류 검출력 약함(짝수개 오류/자리바뀜 못 잡음). NMEA가 사용. |\n| **additive sum8** | 바이트 합의 하위 8비트. XOR보다 낫지만 여전히 약함. wrap-around는 `uint8_t`가 알아서. |\n| **CRC-16** | 다항식 나눗셈. **LUT**로 바이트당 1회 조회 → 빠름. 오류 검출력 월등. init/reflect/poly로 변종 다수. |\n| **LUT 생성** | `table[i]` = `(i\u003c\u003c8)`를 8번 나눈 잔여(MSB-first). 실무는 **const로 미리 구워** 플래시에 둔다. |\n| **framing** | `[start][len][payload][CRC][end]`. 마커·길이·체크섬으로 프레임 경계와 무결성 확인. |\n| **Q 포맷** | `값 = raw / 2^q`. 덧셈은 그대로, 곱셈은 `>>q`로 스케일 복원(중간연산 int64). |\n| **SMA** | 창 W의 단순이동평균. 지연(lag) ≈ W/2. 스트리밍이면 running sum으로 O(1) 갱신. |\n| **RLE** | `[value][count]`. count 8비트면 255에서 분할. 최악의 경우 **2배로 커짐**(무런 데이터). |\n| **base64** | 3바이트→4문자(6비트씩). `=` 패딩. 크기 **+33%**. 텍스트 채널 전송용. |\n| **KMP** | LPS(prefix-suffix) 테이블로 실패 시 되돌아갈 위치를 미리 계산 → O(n+m). |\n\n---\n\n## 문제별 요점 & 함정\n\n### 86. NMEA 파싱 (nmea_validate / nmea_get_field)\n- NMEA-0183: `$GPGGA,123519,4807.038,N,...*47`. 체크섬 = `$`와 `*` 사이 **XOR**, 뒤에 2자리 hex.\n- validate: `$`로 시작 → `*` 찾기 → 사이 XOR → 뒤 2 hex와 비교. **널 종료 넘어 읽지 않도록** short-circuit.\n- get_field: 콤마로 분리, field 0 = talker+type(`GPGGA`). `*`/CRLF/`\\0`에서 종료.\n- 함정: 종료자 뒤 hex 두 자리 접근 시 OOB. `hexval('\\0')`이 -1을 반환하도록 해 방어.\n\n### 87-88. XOR / sum8 체크섬\n- 둘 다 O(n), 상태 1바이트. `NULL` 안전. `uint8_t` 누산이 자연 mod-256.\n- 함정: **검출력**을 물어보면 \"자리바뀜(transposition)·짝수개 비트오류 취약 → 실무는 CRC\" 라고 답.\n\n### 89. CRC-16 (LUT)\n- CRC-16/XMODEM(poly `0x1021`, init `0x0000`, MSB-first, 무반사)이 대표적. 표준 검증: `\"123456789\"`→`0x31C3`.\n- LUT 생성:\n  ```c\n  for (i in 0..255) { crc = i\u003c\u003c8; repeat 8: crc = (crc&0x8000)?(crc\u003c\u003c1)^0x1021:(crc\u003c\u003c1); table[i]=crc; }\n  ```\n- 갱신: `crc = (crc\u003c\u003c8) ^ table[((crc>>8) ^ byte) & 0xFF];`\n- 함정: LSB-first(reflected) 변종(MODBUS 등)은 테이블 생성·갱신식이 다르다. **어느 CRC인지 먼저 확정**.\n\n### 90. 바이너리 패킷 파싱\n- 여기선 최소판: `start=0xAA`, `end=0xBB`, `len>=2`. 실전은 **length + CRC(#89)**를 더한다.\n- 함정: **partial frame**(스트림 중간부터 도착)·마커가 페이로드에 우연히 나타남 → byte stuffing/escape 필요.\n\n### 91. 고정소수점 (Q 포맷)\n- `값 = raw / 2^q`. **덧셈**: 같은 Q라 raw끼리 더함(오버플로 방지 int64 + 포화).\n- **곱셈**: `(int64)a*b`는 Q(2q) → `>>q`로 복원. 반올림은 `+ 2^(q-1)` 후 시프트.\n- 함정: 곱에서 int32끼리 곱하면 오버플로 → **반드시 int64 중간연산**. 음수 산술 시프트는 구현 정의(실무 컴파일러는 산술 시프트).\n\n### 92. 이동평균 (SMA)\n- `out[i] = mean(in[i-W+1..i])`, 초반부는 있는 만큼. 지연 ≈ W/2.\n- 스트리밍이면 `sum += new - old`로 **O(1)** 갱신(원형버퍼로 old 관리). 여기선 명확성 위해 O(n·W).\n- 함정: `size_t` 언더플로(`i-W+1`) → `i+1>=W` 가드. 정수 평균이면 반올림/버림 정책 명시.\n\n### 93. RLE\n- `[value][count]` 쌍. count 8비트 → **255에서 분할**. 반환=쓴 바이트 수, 버퍼 부족/홀수 길이면 0.\n- 함정: **최악의 경우 팽창**(교대 데이터는 2배). 실무는 escape/RLE 플래그로 팽창 방지.\n\n### 94. base64\n- 3바이트(24비트)→4문자(6비트씩), 부족분 `=` 패딩. 크기 +33%. 디코드 표로 역변환.\n- 함정: 입력 길이 4의 배수 아님/불량 문자 → 실패 반환. 패딩 개수로 출력 길이 계산.\n\n### 95. 패턴 탐색 (KMP)\n- LPS 테이블로 불일치 시 되돌아갈 위치를 미리 계산 → **O(n+m)**, 백트래킹 없음.\n- 빈 패턴은 0, 패턴>데이터는 -1. LPS는 **고정 버퍼**(bounded)로 힙 회피, 초과 시 naive fallback.\n- 함정: naive는 `0xAAAA...`처럼 반복 접두사에서 O(n·m). KMP의 이득이 여기서 나온다.\n\n---\n\n## 인터뷰 팔로업 (자주 나오는 꼬리질문)\n\n1. **\"XOR/sum 체크섬은 뭘 못 잡나?\"** → 자리바뀜, 짝수개 비트오류. 그래서 CRC.\n2. **\"CRC 테이블을 런타임에 만들까 굽어둘까?\"** → 플래시에 `const`로 미리 구워 부팅·연산 비용 제거.\n3. **\"엔디안은?\"** → 멀티바이트 필드(길이/CRC)는 프로토콜이 정한 바이트 순서로 직렬화. `htons`류/수동 시프트.\n4. **\"partial frame/재동기화는?\"** → 링버퍼에 모으고 start 마커로 재동기, length로 끝 확인, CRC로 검증.\n5. **\"float 대신 fixed 왜?\"** → FPU 없음/결정성/속도. 단 오버플로·정밀도 관리 부담.\n6. **\"SMA vs EMA?\"** → EMA(지수이동평균)는 상태 1개·곱셈 2번으로 O(1), 버퍼 불필요. SMA는 창 안 모든 샘플 동일가중.\n7. **\"RLE가 언제 나쁜가?\"** → 무런(노이즈) 데이터에서 2배 팽창. 헤더로 raw/compressed 선택.\n\n---\n\n## 빌드 & 실행\n\n```sh\n# 연습(직접 채우기)\ncc -std=c11 -Wall -Wextra problems/08_data_processing.c -o /tmp/andb_data_processing && /tmp/andb_data_processing\n# 정답 확인 (전부 PASS)\ncc -std=c11 -Wall -Wextra solutions/08_data_processing.c -o /tmp/andb_data_processing && /tmp/andb_data_processing\n# 또는\nmake prob N=08_data_processing      #  연습\nmake sol  N=08_data_processing      #  정답\n```\n\n> **핵심 한 줄**: \"링크는 언젠가 비트를 뒤집는다.\" 그래서 **체크섬/CRC로 걸러내고,\n> 프레이밍으로 경계를 잡고, FPU 없이 fixed-point로 계산하고, 좁은 대역폭엔 인코딩을 쓴다.\"\n", "problems": [{"num": 86, "slug": "nmea_parse", "title_ko": "NMEA 문장 파싱", "title_en": "NMEA sentence parse", "difficulty": "medium", "tags": ["protocol", "parsing", "checksum"], "prompt_ko": "NMEA-0183 GPS 문장을 다룬다. 체크섬은 '$'와 '*' 사이 모든 바이트의 XOR이며 뒤에 2자리 hex로 붙는다. nmea_validate는 구조와 체크섬이 맞으면 true. nmea_get_field는 idx번째 콤마 필드(field 0 = 'GPGGA')를 out에 복사하고 길이를 반환, 오류 시 -1.", "prompt_en": "Parse NMEA-0183 GPS sentences. Checksum = XOR of bytes between '$' and '*' followed by 2 hex digits. nmea_validate returns true on valid structure+checksum; nmea_get_field copies the idx-th comma field into out, returns its length or -1.", "signature": "bool nmea_validate(const char *s); int nmea_get_field(const char *s, size_t idx, char *out, size_t out_max)", "examples": [{"in": "\"$GPGGA,123519,...,*47\"", "out": "nmea_validate -> true"}, {"in": "get_field(...,1)", "out": "\"123519\", returns 6"}], "hints": ["'$' 다음부터 '*'까지 XOR을 누산하라.", "종료 널을 넘어 hex 두 자리를 읽지 않도록 short-circuit (hexval('\\0')=-1).", "필드는 ','로 분리, '*'/CRLF/'\\0'에서 종료. field 0은 '$' 다음 첫 콤마 전까지."], "solution": "static int hexval(char c){\n    if(c>='0'&&c\u003c='9')return c-'0';\n    if(c>='a'&&c\u003c='f')return c-'a'+10;\n    if(c>='A'&&c\u003c='F')return c-'A'+10;\n    return -1;\n}\nbool nmea_validate(const char *s){\n    if(!s||s[0]!='$')return false;\n    uint8_t sum=0; size_t i=1;\n    for(;s[i]&&s[i]!='*';i++) sum^=(uint8_t)s[i];\n    if(s[i]!='*')return false;\n    int hi=hexval(s[i+1]); if(hi\u003c0)return false;\n    int lo=hexval(s[i+2]); if(lo\u003c0)return false;\n    return sum==(uint8_t)((hi\u003c\u003c4)|lo);\n}\nint nmea_get_field(const char *s,size_t idx,char *out,size_t out_max){\n    if(!s||!out||out_max==0||s[0]!='$')return -1;\n    const char *p=s+1; size_t cur=0;\n    for(;;){\n        const char *start=p;\n        while(*p&&*p!=','&&*p!='*'&&*p!='\\r'&&*p!='\\n')p++;\n        size_t flen=(size_t)(p-start);\n        if(cur==idx){\n            if(flen+1>out_max)return -1;\n            memcpy(out,start,flen); out[flen]='\\0'; return (int)flen;\n        }\n        if(*p==','){p++;cur++;continue;}\n        return -1;\n    }\n}", "explanation_ko": "validate는 '$'로 시작해 '*'까지 XOR을 누산하고 뒤 2 hex와 비교한다. hi 검사를 통과했을 때만 s[i+2]에 접근하므로 널 종료를 넘어가지 않는다. get_field는 '$' 다음부터 콤마 카운트를 세며 원하는 필드를 만나면 널 종료해 복사한다.", "complexity": "O(n) time, O(1) space", "pitfalls": ["종료자 뒤 hex 두 자리 접근 시 OOB(short-circuit로 방어).", "out 버퍼가 필드+널보다 작을 때 미검사.", "field 0(talker+type) 경계 처리 실수."], "anduril_context": "GPS 모듈 UART 스트림에서 위치/시각 필드 추출과 무결성 검증."}, {"num": 87, "slug": "xor_checksum", "title_ko": "XOR 체크섬", "title_en": "XOR checksum", "difficulty": "easy", "tags": ["checksum", "integrity"], "prompt_ko": "data의 모든 바이트를 XOR한 8비트 체크섬을 반환하라(초기값 0, NULL 안전).", "prompt_en": "Return the 8-bit XOR of all bytes (init 0, NULL-safe).", "signature": "uint8_t xor_checksum(const uint8_t *data, size_t len)", "examples": [{"in": "{0x01,0x02,0x03},3", "out": "0x00"}, {"in": "{0x7E},1", "out": "0x7E"}], "hints": ["누산 변수 0에서 시작.", "각 바이트를 ^= 로 누적.", "NULL이면 0 반환."], "solution": "uint8_t xor_checksum(const uint8_t *data, size_t len){\n    uint8_t c=0;\n    if(!data)return 0;\n    for(size_t i=0;i\u003clen;i++) c^=data[i];\n    return c;\n}", "explanation_ko": "XOR은 결합·교환법칙이 성립해 순서 무관하게 누적한다. 같은 값을 두 번 XOR하면 상쇄되므로 검출력이 약하다(자리바뀜/짝수 오류 취약).", "complexity": "O(n) time, O(1) space", "pitfalls": ["자리바뀜·짝수개 비트오류를 못 잡음 → 실무는 CRC.", "NULL 미방어.", "signed char로 받으면 부호확장 이슈."], "anduril_context": "NMEA·간단 프레임의 저비용 무결성 검사."}, {"num": 88, "slug": "sum8_checksum", "title_ko": "8비트 additive 체크섬", "title_en": "8-bit additive checksum", "difficulty": "easy", "tags": ["checksum", "wrap-around"], "prompt_ko": "바이트 합의 하위 8비트(자연 wrap-around)를 반환하라.", "prompt_en": "Return the low 8 bits of the byte sum (natural wrap-around).", "signature": "uint8_t sum8_checksum(const uint8_t *data, size_t len)", "examples": [{"in": "{0x01,0x02,0x03},3", "out": "0x06"}, {"in": "{0xFF,0x01},2", "out": "0x00"}], "hints": ["uint8_t 누산 변수가 자동으로 mod 256.", "int로 받고 &0xFF 해도 동일.", "NULL이면 0."], "solution": "uint8_t sum8_checksum(const uint8_t *data, size_t len){\n    uint8_t s=0;\n    if(!data)return 0;\n    for(size_t i=0;i\u003clen;i++) s=(uint8_t)(s+data[i]);\n    return s;\n}", "explanation_ko": "uint8_t 덧셈은 256에서 자연스럽게 wrap-around한다. XOR보다 오류 검출이 약간 낫지만 여전히 자리바뀜에 취약하다.", "complexity": "O(n) time, O(1) space", "pitfalls": ["오버플로를 UB로 오해(uint 산술은 정의됨).", "부호 있는 타입 누산 시 오버플로 UB.", "여전히 약한 검출력."], "anduril_context": "Intel HEX·간단 텍스트 프로토콜의 체크섬 필드."}, {"num": 89, "slug": "crc16_lut", "title_ko": "CRC-16 (룩업 테이블)", "title_en": "CRC-16 (lookup table)", "difficulty": "hard", "tags": ["crc", "lookup-table", "integrity"], "prompt_ko": "CRC-16/XMODEM(poly 0x1021, init 0x0000, MSB-first, 무반사)을 256엔트리 LUT로 구현하라. table[i]=(i\u003c\u003c8)를 8번 다항식 나눗셈한 잔여.", "prompt_en": "Implement CRC-16/XMODEM (poly 0x1021, init 0x0000, MSB-first, no reflection) via a 256-entry LUT.", "signature": "uint16_t crc16_lut(const uint8_t *data, size_t len)", "examples": [{"in": "\"123456789\",9", "out": "0x31C3"}, {"in": "{0x01,0x02,0x03},3", "out": "0x6131"}], "hints": ["테이블: crc=i\u003c\u003c8; 8번 { crc = (crc&0x8000)?(crc\u003c\u003c1)^0x1021:(crc\u003c\u003c1); }", "갱신: crc = (crc\u003c\u003c8) ^ table[((crc>>8)^byte)&0xFF];", "테이블은 static으로 1회 생성(실무는 const로 미리 구움)."], "solution": "static uint16_t g_crc_table[256];\nstatic bool g_crc_ready=false;\nstatic void crc16_build_table(void){\n    for(int i=0;i\u003c256;i++){\n        uint16_t crc=(uint16_t)(i\u003c\u003c8);\n        for(int b=0;b\u003c8;b++)\n            crc=(crc&0x8000)?(uint16_t)((crc\u003c\u003c1)^0x1021):(uint16_t)(crc\u003c\u003c1);\n        g_crc_table[i]=crc;\n    }\n    g_crc_ready=true;\n}\nuint16_t crc16_lut(const uint8_t *data, size_t len){\n    if(!g_crc_ready) crc16_build_table();\n    uint16_t crc=0x0000;\n    if(!data)return crc;\n    for(size_t i=0;i\u003clen;i++)\n        crc=(uint16_t)((crc\u003c\u003c8) ^ g_crc_table[((crc>>8)^data[i])&0xFF]);\n    return crc;\n}", "explanation_ko": "LUT의 각 엔트리는 상위 바이트에 정렬한 입력을 미리 8번 나눈 잔여다. 실행 시에는 현재 CRC 상위 바이트와 새 바이트를 XOR한 인덱스로 테이블을 조회해 한 번에 8비트를 처리한다. 표준 검증 벡터 '123456789'→0x31C3로 구현 정확성을 확인한다.", "complexity": "O(n) time, O(1) space (테이블 512B)", "pitfalls": ["LSB-first(reflected) 변종과 혼동 → 생성/갱신식 다름.", "poly/init/reflect 파라미터 확정 안 함.", "16비트 시프트에서 상위 비트 유실(uint16_t 캐스팅)."], "anduril_context": "MAVLink·XMODEM·무선 프레임의 CRC 무결성 검사."}, {"num": 90, "slug": "parse_packet", "title_ko": "바이너리 패킷 파싱", "title_en": "Binary packet parse", "difficulty": "easy", "tags": ["framing", "protocol"], "prompt_ko": "프레임 [0xAA start][payload...][0xBB end]의 최소 유효성을 검사하라. 길이>=2이고 양끝 마커가 맞으면 true.", "prompt_en": "Validate a minimal framed packet: start=0xAA, end=0xBB, len>=2.", "signature": "bool parse_packet(const uint8_t *data, size_t len)", "examples": [{"in": "{0xAA,0x01,0x02,0x03,0xBB},5", "out": "true"}, {"in": "{0xAB,...},3", "out": "false"}], "hints": ["최소 길이 2 확인.", "data[0]==0xAA, data[len-1]==0xBB.", "실전은 length+CRC를 추가."], "solution": "#define PKT_START 0xAA\n#define PKT_END   0xBB\nbool parse_packet(const uint8_t *data, size_t len){\n    if(!data||len\u003c2)return false;\n    if(data[0]!=PKT_START)return false;\n    if(data[len-1]!=PKT_END)return false;\n    return true;\n}", "explanation_ko": "start/end 마커와 최소 길이로 프레임 경계를 확인하는 최소판이다. 실전 프레임은 여기에 length 필드와 CRC(#89)를 더해 무결성까지 검증한다.", "complexity": "O(1) time, O(1) space", "pitfalls": ["partial frame(스트림 중간부터 도착) 미고려.", "마커가 페이로드에 우연 등장 → byte stuffing 필요.", "len\u003c2에서 data[len-1] 언더플로."], "anduril_context": "UART/RF 링크의 프레임 동기화·경계 검출 1단계."}, {"num": 91, "slug": "fixed_point", "title_ko": "고정소수점 연산 (Q포맷)", "title_en": "Fixed-point arithmetic (Q-format)", "difficulty": "medium", "tags": ["fixed-point", "no-fpu", "overflow"], "prompt_ko": "값=raw/2^q인 Q포맷. fixed_add는 raw끼리 더하고(오버플로 방지+포화), fixed_mul은 int64 곱 후 >>q로 스케일 복원(반올림+포화).", "prompt_en": "Q-format fixed point (value = raw/2^q). add = a+b (saturating); mul = (int64)a*b >> q with rounding+saturation.", "signature": "int32_t fixed_add(int32_t a, int32_t b, uint8_t q); int32_t fixed_mul(int32_t a, int32_t b, uint8_t q)", "examples": [{"in": "fixed_add(256,128,8)", "out": "384 (1.0+0.5)"}, {"in": "fixed_mul(256,128,8)", "out": "128 (1.0*0.5)"}], "hints": ["덧셈: 같은 Q라 raw끼리 더한다. int64로 받아 int32 범위로 포화.", "곱셈: (int64)a*b는 Q(2q) → >>q로 복원.", "반올림은 시프트 전 +2^(q-1). q==0/과대 q 가드."], "solution": "int32_t fixed_add(int32_t a, int32_t b, uint8_t q){\n    (void)q;\n    int64_t s=(int64_t)a+(int64_t)b;\n    if(s>INT32_MAX)s=INT32_MAX;\n    if(s\u003cINT32_MIN)s=INT32_MIN;\n    return (int32_t)s;\n}\nint32_t fixed_mul(int32_t a, int32_t b, uint8_t q){\n    int64_t p=(int64_t)a*(int64_t)b;\n    if(q>0&&q\u003c63) p+=(int64_t)1\u003c\u003c(q-1);\n    if(q\u003c63) p>>=q; else p=0;\n    if(p>INT32_MAX)p=INT32_MAX;\n    if(p\u003cINT32_MIN)p=INT32_MIN;\n    return (int32_t)p;\n}", "explanation_ko": "덧셈은 스케일이 같아 raw끼리 더하되 int64 중간연산으로 오버플로를 막고 int32로 포화한다. 곱셈은 두 Q수의 곱이 Q(2q)가 되므로 >>q로 원래 스케일을 복원하며, 시프트 전 절반(2^(q-1))을 더해 반올림한다.", "complexity": "O(1) time, O(1) space", "pitfalls": ["int32끼리 곱하면 오버플로 → 반드시 int64 중간연산.", "반올림 생략 시 누적 편향(bias).", "음수 산술 우측 시프트는 구현정의(실무는 산술 시프트)."], "anduril_context": "FPU 없는 MCU의 PID 게인·필터 계수·센서 스케일링."}, {"num": 92, "slug": "moving_average", "title_ko": "이동평균 필터", "title_en": "Moving-average filter", "difficulty": "medium", "tags": ["filter", "dsp", "smoothing"], "prompt_ko": "창 크기 window의 단순이동평균(SMA) 시리즈를 out에 쓴다. out[i]=mean(in[i-window+1..i]), 초반부는 있는 만큼 평균.", "prompt_en": "Write the simple moving average (window) series to out; out[i]=mean over available samples up to i.", "signature": "void moving_average(const float *in, size_t len, size_t window, float *out)", "examples": [{"in": "{1,2,3,4,5},5,3", "out": "{1, 1.5, 2, 3, 4}"}], "hints": ["창 시작 = (i+1>=window) ? i+1-window : 0 (size_t 언더플로 방어).", "창 안 샘플 합/개수로 평균.", "스트리밍이면 running sum으로 O(1) 갱신."], "solution": "void moving_average(const float *in, size_t len, size_t window, float *out){\n    if(!in||!out||window==0)return;\n    for(size_t i=0;i\u003clen;i++){\n        size_t start=(i+1>=window)?(i+1-window):0;\n        float sum=0.0f; size_t cnt=0;\n        for(size_t j=start;j\u003c=i;j++){ sum+=in[j]; cnt++; }\n        out[i]=sum/(float)cnt;\n    }\n}", "explanation_ko": "각 위치 i에서 최근 window개(부족하면 있는 만큼) 샘플의 평균을 낸다. 지연(lag)은 대략 window/2. 스트리밍 환경에선 sum += new - old로 O(1) 갱신하고 old는 원형버퍼로 관리하는 것이 정석이다.", "complexity": "O(n*window) time (running sum이면 O(n)), O(1) space", "pitfalls": ["size_t 언더플로(i-window+1) → i+1>=window 가드.", "window==0/NULL 미방어.", "정수 평균이면 반올림/버림 정책 필요."], "anduril_context": "IMU·기압계·전류 센서의 노이즈 스무딩(제어루프 전처리)."}, {"num": 93, "slug": "rle", "title_ko": "RLE 압축/해제", "title_en": "RLE compress/decompress", "difficulty": "medium", "tags": ["compression", "buffer-safety"], "prompt_ko": "[value][count] 쌍 RLE. count는 1..255(긴 런은 분할). 반환=쓴 바이트 수, out 부족/형식 오류(홀수 길이) 시 0.", "prompt_en": "RLE as [value][count] pairs (count\u003c=255, long runs split). Return bytes written; 0 on buffer overflow / malformed (odd) input.", "signature": "size_t rle_compress(const uint8_t *in, size_t in_len, uint8_t *out, size_t out_max); size_t rle_decompress(const uint8_t *in, size_t in_len, uint8_t *out, size_t out_max)", "examples": [{"in": "compress {0xAA,0xAA,0xAA,0xBB}", "out": "{0xAA,3,0xBB,1}, 4"}, {"in": "decompress {0xAA,3,0xBB,1}", "out": "{0xAA,0xAA,0xAA,0xBB}, 4"}], "hints": ["같은 값 런을 세되 255에서 끊는다.", "쌍 쓰기 전 out_max 여유(o+2) 확인.", "해제는 in_len이 짝수여야 함(형식 검사)."], "solution": "size_t rle_compress(const uint8_t *in, size_t in_len, uint8_t *out, size_t out_max){\n    if(!in||!out)return 0;\n    size_t o=0,i=0;\n    while(i\u003cin_len){\n        uint8_t v=in[i]; size_t run=1;\n        while(i+run\u003cin_len&&in[i+run]==v&&run\u003c255) run++;\n        if(o+2>out_max)return 0;\n        out[o++]=v; out[o++]=(uint8_t)run; i+=run;\n    }\n    return o;\n}\nsize_t rle_decompress(const uint8_t *in, size_t in_len, uint8_t *out, size_t out_max){\n    if(!in||!out)return 0;\n    if(in_len%2!=0)return 0;\n    size_t o=0;\n    for(size_t i=0;i\u003cin_len;i+=2){\n        uint8_t v=in[i],run=in[i+1];\n        if(o+run>out_max)return 0;\n        for(uint8_t k=0;k\u003crun;k++) out[o++]=v;\n    }\n    return o;\n}", "explanation_ko": "압축은 연속 동일 바이트의 길이를 세어 [값][개수]로 쓰되 8비트 카운트 한계인 255에서 분할한다. 해제는 쌍을 읽어 개수만큼 값을 복제한다. 두 함수 모두 쓰기 전 출력 버퍼 여유를 확인해 오버플로를 막는다.", "complexity": "O(n) time, O(1) space", "pitfalls": ["카운트 255 초과 미분할 → 데이터 손상.", "무런(교대) 데이터는 2배 팽창.", "해제 시 홀수 길이·버퍼 오버플로 미검사."], "anduril_context": "희소 비트맵·상태 로그·프레임 버퍼의 저비용 압축."}, {"num": 94, "slug": "base64", "title_ko": "Base64 인코딩/디코딩", "title_en": "Base64 encode/decode", "difficulty": "medium", "tags": ["encoding", "protocol"], "prompt_ko": "표준 base64('=' 패딩). 3바이트→4문자. 반환=출력 길이(널 제외). 버퍼 부족/불량 입력(4의 배수 아님·불량 문자) 시 0.", "prompt_en": "Standard base64 with '=' padding. 3 bytes -> 4 chars. Return output length (excl. NUL); 0 on short buffer / malformed input.", "signature": "size_t base64_encode(const uint8_t *in, size_t in_len, char *out, size_t out_max); size_t base64_decode(const char *in, size_t in_len, uint8_t *out, size_t out_max)", "examples": [{"in": "encode \"Man\"", "out": "\"TWFu\", 4"}, {"in": "decode \"TWE=\"", "out": "{'M','a'}, 2"}], "hints": ["인코드: 3바이트를 24비트로 모아 6비트씩 4조각.", "남은 1/2바이트는 '=' 패딩.", "디코드: 역변환 표, '='는 0으로 취급하되 해당 바이트는 출력 안 함."], "solution": "static const char B64E[]=\n  \"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/\";\nstatic int b64dec1(char c){\n    if(c>='A'&&c\u003c='Z')return c-'A';\n    if(c>='a'&&c\u003c='z')return c-'a'+26;\n    if(c>='0'&&c\u003c='9')return c-'0'+52;\n    if(c=='+')return 62;\n    if(c=='/')return 63;\n    return -1;\n}\nsize_t base64_encode(const uint8_t *in, size_t in_len, char *out, size_t out_max){\n    if(!in||!out)return 0;\n    size_t olen=4*((in_len+2)/3);\n    if(out_max\u003colen+1)return 0;\n    size_t o=0,i=0;\n    while(i+3\u003c=in_len){\n        uint32_t v=((uint32_t)in[i]\u003c\u003c16)|((uint32_t)in[i+1]\u003c\u003c8)|in[i+2];\n        out[o++]=B64E[(v>>18)&63]; out[o++]=B64E[(v>>12)&63];\n        out[o++]=B64E[(v>>6)&63];  out[o++]=B64E[v&63]; i+=3;\n    }\n    size_t rem=in_len-i;\n    if(rem==1){ uint32_t v=(uint32_t)in[i]\u003c\u003c16;\n        out[o++]=B64E[(v>>18)&63]; out[o++]=B64E[(v>>12)&63];\n        out[o++]='='; out[o++]='='; }\n    else if(rem==2){ uint32_t v=((uint32_t)in[i]\u003c\u003c16)|((uint32_t)in[i+1]\u003c\u003c8);\n        out[o++]=B64E[(v>>18)&63]; out[o++]=B64E[(v>>12)&63];\n        out[o++]=B64E[(v>>6)&63];  out[o++]='='; }\n    out[o]='\\0'; return o;\n}\nsize_t base64_decode(const char *in, size_t in_len, uint8_t *out, size_t out_max){\n    if(!in||!out)return 0;\n    if(in_len==0||in_len%4!=0)return 0;\n    size_t pad=0;\n    if(in[in_len-1]=='=')pad++;\n    if(in[in_len-2]=='=')pad++;\n    size_t olen=in_len/4*3-pad;\n    if(out_max\u003colen)return 0;\n    size_t o=0;\n    for(size_t i=0;i\u003cin_len;i+=4){\n        int a=b64dec1(in[i]),b=b64dec1(in[i+1]);\n        int c=(in[i+2]=='=')?0:b64dec1(in[i+2]);\n        int d=(in[i+3]=='=')?0:b64dec1(in[i+3]);\n        if(a\u003c0||b\u003c0||c\u003c0||d\u003c0)return 0;\n        uint32_t v=((uint32_t)a\u003c\u003c18)|((uint32_t)b\u003c\u003c12)|((uint32_t)c\u003c\u003c6)|(uint32_t)d;\n        if(o\u003colen) out[o++]=(uint8_t)((v>>16)&0xFF);\n        if(in[i+2]!='='&&o\u003colen) out[o++]=(uint8_t)((v>>8)&0xFF);\n        if(in[i+3]!='='&&o\u003colen) out[o++]=(uint8_t)(v&0xFF);\n    }\n    return o;\n}", "explanation_ko": "인코드는 3바이트(24비트)를 모아 6비트씩 잘라 표로 문자화하고, 남는 1/2바이트는 '=' 패딩한다. 디코드는 4문자를 24비트로 복원해 원 바이트를 뽑되 패딩 위치의 바이트는 출력하지 않는다. 입력 길이 4의 배수·불량 문자를 검사한다.", "complexity": "O(n) time, O(1) space", "pitfalls": ["입력 길이 4의 배수/불량 문자 미검사.", "패딩 개수로 출력 길이 계산 실수.", "out 버퍼 크기 미검사(널 종료 자리 포함)."], "anduril_context": "텍스트 전용 채널(로그/JSON/AT)로 바이너리 페이로드 전송."}, {"num": 95, "slug": "search_pattern", "title_ko": "바이트 패턴 탐색 (KMP)", "title_en": "Byte-pattern search (KMP)", "difficulty": "hard", "tags": ["search", "kmp", "string"], "prompt_ko": "data 안에서 pattern의 첫 등장 인덱스를 반환. 없으면 -1, 빈 패턴이면 0. KMP(LPS 테이블)로 O(n+m).", "prompt_en": "Return first index of pattern in data, or -1; empty pattern -> 0. KMP with LPS table, O(n+m).", "signature": "ssize_t search_pattern(const uint8_t *data, size_t len, const uint8_t *pattern, size_t pat_len)", "examples": [{"in": "{01,02,03,04}, {02,03}", "out": "1"}, {"in": "not found", "out": "-1"}], "hints": ["LPS[i] = pattern[0..i]의 최장 proper prefix=suffix 길이.", "불일치 시 q=lps[q-1]로 되돌아간다(백트래킹 없음).", "LPS는 고정 버퍼(bounded)로 힙 회피, 초과 시 naive fallback."], "solution": "#define KMP_MAX_PAT 256\nssize_t search_pattern(const uint8_t *data, size_t len,\n                       const uint8_t *pattern, size_t pat_len){\n    if(pat_len==0)return 0;\n    if(!data||!pattern)return -1;\n    if(pat_len>len)return -1;\n    if(pat_len\u003c=KMP_MAX_PAT){\n        size_t lps[KMP_MAX_PAT]; lps[0]=0; size_t k=0;\n        for(size_t i=1;i\u003cpat_len;i++){\n            while(k>0&&pattern[i]!=pattern[k]) k=lps[k-1];\n            if(pattern[i]==pattern[k]) k++;\n            lps[i]=k;\n        }\n        size_t q=0;\n        for(size_t i=0;i\u003clen;i++){\n            while(q>0&&data[i]!=pattern[q]) q=lps[q-1];\n            if(data[i]==pattern[q]) q++;\n            if(q==pat_len)return (ssize_t)(i-pat_len+1);\n        }\n        return -1;\n    }\n    for(size_t i=0;i+pat_len\u003c=len;i++){\n        size_t j=0;\n        while(j\u003cpat_len&&data[i+j]==pattern[j]) j++;\n        if(j==pat_len)return (ssize_t)i;\n    }\n    return -1;\n}", "explanation_ko": "LPS 테이블은 각 접두사에서 '접두사이면서 접미사'인 최장 길이를 담는다. 매칭 실패 시 이 값으로 패턴 포인터를 되돌려 이미 일치한 접두사를 재활용하므로 텍스트 포인터를 절대 뒤로 돌리지 않아 O(n+m)이다. 반복 접두사(예: 0xAAAA...)에서 naive 대비 큰 이득.", "complexity": "O(n+m) time, O(m) space (LPS, 상한 버퍼)", "pitfalls": ["빈 패턴/패턴>데이터 엣지케이스.", "LPS 구축의 while 되돌림 로직 실수.", "힙 없이 LPS 저장 → 상한/VLA/naive fallback 결정 필요."], "anduril_context": "노이즈 바이트 스트림에서 프레임 sync 워드·매직 마커 탐색."}]}, {"id": "rtos_embedded", "order": 9, "range": "Q96-102", "icon": "⏱️", "title_en": "RTOS & Embedded Systems Concepts", "title_ko": "RTOS & 임베디드 개념", "summary_ko": "워치독 타이머, 협력형 라운드로빈 스케줄러, ISR↔main 공유자원 레이스와 임계구역/_Atomic 수정, 우선순위 역전과 상속/천장, 인터럽트 지연 경계, MMIO volatile 접근, malloc 없는 소프트웨어 타이머 휠까지 — 실시간 펌웨어의 핵심 개념을 호스트에서 코드로 증명한다.", "summary_en": "Watchdog timer, cooperative round-robin scheduler, ISR↔main shared-resource race with critical-section/_Atomic fixes, priority inversion with inheritance/ceiling, interrupt-latency bounding, MMIO volatile access, and a no-malloc software timer wheel — the core real-time firmware concepts proven in host-runnable code.", "anduril_relevance_ko": "드론 FCS/무장 시스템은 경성 실시간이라 '인터럽트가 얼마나 늦을 수 있나', '우선순위 역전을 어떻게 없애나', '워치독으로 hang 을 어떻게 복구하나'를 정량적으로 답해야 한다. 센서 ISR↔제어 루프 데이터 공유의 레이스를 만들고 고치는 능력, MMIO volatile 관용구, 힙 없는 타이머/스케줄러 구현은 방산 펌웨어 인터뷰의 단골이자 실무 그 자체다.", "concepts": [{"term": "watchdog (pat/kick)", "ko": "정기적 reload 없으면 리셋 → hang 자동 복구", "en": "down-counter; miss the periodic reload and it resets the system"}, {"term": "cooperative scheduler", "ko": "함수 포인터+주기, now%period==0 실행, 선점 없음", "en": "function-pointer tasks + periods; run when now%period==0, no preemption"}, {"term": "critical section (IRQ mask)", "ko": "save/restore 로 RMW 보호, 중첩 안전", "en": "disable IRQ around RMW; save/restore is nesting-safe"}, {"term": "_Atomic", "ko": "단일 워드 RMW 를 불가분하게(멀티코어 안전)", "en": "make a single-word RMW indivisible, multicore-safe"}, {"term": "priority inversion", "ko": "저 보유→고 블록→중이 선점→고 무한대기", "en": "low holds lock, medium preempts, high starves"}, {"term": "priority inheritance/ceiling", "ko": "보유자를 최고 대기자/천장으로 승격 → 역전 경계", "en": "raise holder to highest waiter/ceiling to bound inversion"}, {"term": "interrupt latency", "ko": "sync+임계구역+상위ISR+문맥+prologue, 임계구역 최소화", "en": "sum of contributors; minimizing the disable-window is the lever"}, {"term": "MMIO volatile", "ko": "레지스터 접근 제거/캐시/재정렬 방지, 폴링 필수", "en": "prevent elision/caching/reorder on register access; needed for polling"}, {"term": "timer wheel", "ko": "slot=(now+delay)%N, rounds=(delay-1)/N, 정적 풀", "en": "hashed timing wheel with rounds counter, static pool, O(1) insert"}], "study_note_md": "# 09. RTOS & 임베디드 개념 (RTOS & Embedded Systems) — Q96~Q102 ⏱️\n\n> 자료구조/알고리즘이 아니라 **실시간 시스템의 개념**을 코드로 증명하는 파트.\n> 워치독, 협력형 스케줄러, ISR 공유자원 보호, 우선순위 역전, 인터럽트 지연,\n> MMIO volatile, 타이머 휠 — Anduril 류 방산/드론 펌웨어 인터뷰의 \"말로 설명하고\n> 화이트보드로 증명하라\"는 단골 주제들이다.\n\n---\n\n## 왜 Anduril 펌웨어 인터뷰에 나오나\n\n- 드론 FCS/무장 시스템은 **경성 실시간(hard real-time)**. \"인터럽트가 늦으면 왜\n  안 되나, 얼마나 늦을 수 있나\"를 정량적으로 답할 수 있어야 한다 (Q99, Q100).\n- 센서 ISR ↔ 제어 루프(main) 데이터 공유는 매 프로젝트에 있다. **레이스를 만들고\n  고칠 수 있나**가 실전 실력의 척도 (Q98).\n- 워치독(Q96)은 안전(safety) 필수. \"행(hang)에서 어떻게 자동 복구하나\"는 항상 나온다.\n- RTOS 없이 도는 소형 MCU(센서 허브, ESC)도 많다 → **협력형 스케줄러/타이머 휠**을\n  직접 짤 수 있어야 한다 (Q97, Q102).\n- MMIO `volatile`(Q101)을 빼먹어 폴링 루프가 무한루프로 최적화되는 버그는 신입이\n  반드시 한 번 겪는 통과의례. 인터뷰어가 즐겨 묻는다.\n\n---\n\n## 핵심 개념 치트시트\n\n| 개념 | 한 줄 요약 |\n|------|-----------|\n| Watchdog | down-counter. 정기적 `pat`(reload) 없으면 0 도달 → 리셋. 행 자동 복구. |\n| 협력형 스케줄러 | 함수 포인터 + 주기. `now % period == 0` 이면 실행. 선점 없음(짧게 반환). |\n| 임계구역(IRQ 마스킹) | `s=save(); disable; RMW; restore(s);` — 저장/복원이라 **중첩 안전**. |\n| `_Atomic` | 단일 워드 RMW 를 불가분하게. 멀티코어/멀티스레드 lost update 방지. |\n| 우선순위 역전 | 저(低)가 자원 보유 → 고(高) 블록 → 중(中)이 저를 선점 → 고 무한 대기. |\n| 우선순위 상속 | 보유자를 대기자 최고 우선순위로 **일시 승격** → 역전 구간 경계(bounded). |\n| 인터럽트 지연 | sync+임계구역+상위ISR+문맥저장+prologue. **임계구역 최소화**가 핵심 레버. |\n| MMIO `volatile` | 컴파일러의 제거/캐시/재정렬 방지. 폴링 루프 필수. |\n| 타이머 휠 | `slot=(now+delay)%N`, `rounds=(delay-1)/N`. O(1) 등록, tick당 슬롯만 순회. |\n\n---\n\n## (Q96) 워치독 타이머\n\n```c\nvoid wdt_tick(wdt_t *w) {\n    if (!w || w->expired) return;                 // 만료 후 래치\n    if (w->counter == 0 || --w->counter == 0) {   // timeout==0 즉시 만료 엣지 포함\n        w->expired = true;\n        if (w->cb) w->cb(w->ctx);                 // 실제로는 시스템 리셋\n    }\n}\nvoid wdt_pat(wdt_t *w) { if (w && !w->expired) w->counter = w->timeout; }\n```\n\n- **pat(=kick/feed)** 은 \"나 살아있다\" 신호. main 루프가 정상이면 주기적으로 호출.\n- 만료는 **한 번만** 콜백을 부르고 래치(latch)한다 → 실제 HW 리셋의 단발성 모방.\n- **함정**: pat 을 ISR 안에서 하면 main 이 죽어도 워치독이 계속 리로드되어 무용지물.\n  \"정상 경로가 진짜로 돌 때만\" pat 해야 한다(예: 여러 태스크의 완료 플래그를 AND).\n\n---\n\n## (Q97) 협력형 라운드로빈 스케줄러\n\n```c\nvoid sched_run_tick(scheduler_t *s) {\n    s->now++;\n    for (size_t i = 0; i \u003c s->count; ++i)\n        if (s->now % s->tasks[i].period == 0) {   // 주기 도래\n            s->tasks[i].runs++;\n            s->tasks[i].fn(s->tasks[i].ctx);      // 등록 순서(라운드로빈)로 실행\n        }\n}\n```\n\n- **협력형(cooperative)**: 선점이 없으므로 각 태스크는 **짧게 실행 후 반환**해야 한다.\n
