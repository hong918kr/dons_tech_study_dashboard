식이 안 나온다. 여기서 90%가 갈린다.\n2. **전이 정의 (Transition)** — `dp[i]` 를 *더 작은* `dp[...]` 로 표현하는 **점화식**을 세운다.\n   - \"마지막 선택(마지막 걸음/마지막 동전/마지막 문자)\"이 무엇이었나를 기준으로 경우를 나눈다.\n3. **기저 정의 (Base case)** — 가장 작은 입력을 *직접* 채운다. `n=0`, `n=1`, 빈 문자열, `dp[0]=0/1`.\n   - 엣지 케이스(빈 배열, 용량 0)는 거의 항상 기저에서 처리된다.\n4. **순서 정의 (Order)** — 점화식이 참조하는 값이 *먼저* 계산되도록 루프 방향을 정한다.\n   - 0/1 knapsack이 용량을 **내림차순**으로 도는 이유가 바로 이 단계다.\n\n> 보너스: 표를 다 채운 뒤 **답의 위치**(마지막 칸? 전체 최댓값?)를 확인하고,\n> 가능하면 **롤링(rolling)** 으로 메모리를 O(n)→O(1)/O(W)로 줄인다.\n\n---\n\n## 왜 Anduril 펌웨어 인터뷰에 DP가 나오나\n\n- **자원 최적화**: 제한된 전력/대역폭/연산 예산 안에서 가치를 최대화 → 0/1 knapsack 그 자체.\n  (예: 링크 예산 안에서 어떤 텔레메트리 스트림을 보낼지 선택)\n- **퍼지 매칭**: 잡음 섞인 명령/식별자 문자열을 사전과 대조 → edit distance(Levenshtein).\n- **델타/OTA 업데이트**: 두 펌웨어 이미지의 공통부분 → LCS/diff 로 전송량 최소화.\n- **bottom-up의 결정성**: 재귀 메모이제이션은 스택 깊이가 입력에 따라 변한다. bottom-up +\n  고정 크기 테이블은 **최악 지연/메모리가 컴파일 타임에 확정** → 안전필수(safety-critical) 코드에 적합.\n\n---\n\n## 핵심 개념 치트시트\n\n| 문제 | 상태 dp | 점화식 | 복잡도 |\n|------|---------|--------|--------|\n| 계단 오르기 | i계단 방법 수 | `dp[i]=dp[i-1]+dp[i-2]` | O(n)/O(1) |\n| 도둑질 | 0..i 최대 금액 | `dp[i]=max(dp[i-1], dp[i-2]+a[i])` | O(n)/O(1) |\n| 동전 최소 | 금액 a 최소 동전 | `dp[a]=min(dp[a-c]+1)` | O(amt·nc)/O(amt) |\n| LIS | i로 끝나는 최장 | `dp[i]=1+max(dp[j] : a[j]\u003ca[i])` | O(n²)/O(n) |\n| 0/1 배낭 | 용량 c 최대 가치 | `dp[c]=max(dp[c], dp[c-w]+v)` | O(n·W)/O(W) |\n| 편집 거리 | a[..i]→b[..j] | `일치:dp[i-1][j-1] / 아니면 1+min(3방향)` | O(mn)/O(mn) |\n| LCS | a[..i],b[..j] 공통 | `일치:dp[i-1][j-1]+1 / 아니면 max(2방향)` | O(mn)/O(mn) |\n| 격자 경로 | (i,j)까지 경로 수 | `dp[i][j]=dp[i-1][j]+dp[i][j-1]` | O(mn)/O(n) |\n| 최대 곱 | i로 끝나는 max/min | `max(x, maxp·x, minp·x)` | O(n)/O(1) |\n\n---\n\n## 1D DP: 롤링으로 O(1) 공간\n\n### 계단 오르기 / 도둑질 = 피보나치 계열\n\n```c\n// 계단: dp[i] = dp[i-1] + dp[i-2]\nint prev2 = 1, prev1 = 1;               // dp[0], dp[1]\nfor (int i = 2; i \u003c= n; ++i) {\n    int cur = prev1 + prev2;\n    prev2 = prev1; prev1 = cur;\n}\nreturn prev1;\n```\n\n- **핵심 통찰**: dp[i]가 바로 앞 두 값에만 의존하면 배열 전체가 필요 없다 → 변수 2개.\n- 도둑질도 구조가 같다. \"i집을 털까 말까\"의 두 선택을 max로 합칠 뿐:\n  `dp[i] = max(dp[i-1], dp[i-2] + nums[i])`.\n\n### 동전 최소 개수 = 무한대 초기화 + min\n\n```c\ndp[0] = 0;                               // 기저\nfor (int a = 1; a \u003c= amount; ++a) {\n    dp[a] = INF;\n    for (int c = 0; c \u003c nc; ++c)\n        if (a - coins[c] >= 0 && dp[a-coins[c]] + 1 \u003c dp[a])\n            dp[a] = dp[a-coins[c]] + 1;\n}\n// dp[amount] == INF 이면 -1 (만들 수 없음)\n```\n\n- **함정**: `INT_MAX` 를 그대로 쓰고 `+1` 하면 오버플로. `INT_MAX-1` 같은 여유 INF 사용.\n- 그리디(큰 동전부터)는 일반적으로 **틀린다**(예: coins=[1,3,4], amount=6 → 그리디 4+1+1=3, DP 3+3=2).\n\n---\n\n## 2D DP: 문자열/격자\n\n### 편집 거리 vs LCS = 쌍둥이 표\n\n두 문제 모두 `dp[i][j]` = \"a의 앞 i글자와 b의 앞 j글자\"에 대한 답. 대각선 일치가 핵심.\n\n```c\n// 편집 거리(최소화)\nif (a[i-1]==b[j-1]) dp[i][j] = dp[i-1][j-1];            // 공짜\nelse dp[i][j] = 1 + min3(dp[i-1][j],    // 삭제\n                         dp[i][j-1],    // 삽입\n                         dp[i-1][j-1]); // 치환\n\n// LCS(최대화)\nif (a[i-1]==b[j-1]) dp[i][j] = dp[i-1][j-1] + 1;        // 공통 +1\nelse dp[i][j] = max(dp[i-1][j], dp[i][j-1]);\n```\n\n- **기저**: 편집거리는 `dp[i][0]=i, dp[0][j]=j`(전부 삭제/삽입). LCS는 `dp[*][0]=dp[0][*]=0`.\n- C에는 2D 가변 배열이 없으니 **1차원으로 flatten**: `dp[i*W + j]`, `W = lb+1`. malloc 후 free.\n\n### 격자 경로 = 위 + 왼쪽, 1D 롤링\n\n```c\nfor (int j = 0; j \u003c n; ++j) row[j] = 1;   // 첫 행/열 = 1\nfor (int i = 1; i \u003c m; ++i)\n    for (int j = 1; j \u003c n; ++j)\n        row[j] += row[j-1];               // 새 row[j] = 위(옛 row[j]) + 왼쪽(row[j-1])\n```\n\n- 2D 표에서 각 칸이 \"위 + 왼쪽\"에만 의존 → 한 행만 유지하며 제자리 갱신하면 O(n) 공간.\n\n---\n\n## 0/1 배낭: 루프 방향이 정답을 바꾼다\n\n```c\nint *dp = calloc(cap+1, sizeof *dp);      // dp[c] = 용량 c 최대 가치\nfor (int i = 0; i \u003c n; ++i)\n    for (int c = cap; c >= w[i]; --c)     // ★ 내림차순 ★\n        dp[c] = max(dp[c], dp[c-w[i]] + v[i]);\n```\n\n- **왜 내림차순?** `dp[c-w[i]]` 가 *이번 아이템을 아직 안 쓴* 값이어야 각 아이템을 최대 1번 쓴다.\n  오름차순으로 돌면 방금 갱신된(=이미 이 아이템을 쓴) 값을 또 참조해 **무제한 배낭**(unbounded)이 된다.\n- 이 한 줄이 \"0/1 vs 무제한\"을 가르는, DP 4단계 중 **순서(order)** 의 대표 예시.\n\n---\n\n## 최대 곱 부분배열: 최솟값도 같이 들고 다녀라\n\n```c\nint maxp = nums[0], minp = nums[0], ans = nums[0];\nfor (int i = 1; i \u003c n; ++i) {\n    int x = nums[i], a = maxp*x, b = minp*x;\n    maxp = max3(x, a, b);                  // 음수 곱으로 뒤집힐 수 있으니\n    minp = min3(x, a, b);                  // 최소도 후보로 유지\n    ans = max(ans, maxp);\n}\n```\n\n- **핵심 통찰**: 음수 × 음수 = 양수. 지금까지의 *최솟(가장 음수)* 곱이 다음 음수를 만나면\n  가장 큰 값이 될 수 있다. 그래서 max와 min을 **쌍으로** 추적한다. (합 문제 Kadane의 곱셈판)\n\n---\n\n## 인터뷰 팔로업 & 함정\n\n- **Q. 메모이제이션(top-down) vs 타뷸레이션(bottom-up)?** → 결과 같음. 임베디드는 스택\n  안전/결정성 때문에 bottom-up 선호. top-down은 재귀 깊이 = 상태 수 → 스택 오버플로 위험.\n- **Q. LIS를 O(n log n)으로?** → `tails[k]` = 길이 k+1 증가수열의 *가능한 최소 꼬리값*.\n  각 원소를 이진탐색으로 tails에 삽입/교체. 길이 = tails 크기.\n- **함정: 동전 그리디** → 일반 동전계에서 틀림. 반드시 DP.\n- **함정: INF + 1 오버플로** → coin change에서 `INT_MAX` 대신 여유 INF.\n- **함정: knapsack 루프 방향** → 내림차순 잊으면 무제한 배낭이 됨.\n- **함정: 2D 인덱스 off-by-one** → `dp` 는 `(la+1)×(lb+1)`. 문자 접근은 `a[i-1]`, `b[j-1]`.\n- **함정: 최대 곱에서 0** → 0을 만나면 max/min이 0으로 리셋되는 게 자연스럽게 처리됨(후보에 x 포함).\n- **함정: 빈 입력** → n=0 이면 대부분 0 반환. 기저에서 먼저 걸러라.\n\n---\n\n## 복잡도 요약\n\n| 문제 | 시간 | 공간(최적) |\n|------|------|-----------|\n| climb_stairs | O(n) | O(1) |\n| house_robber | O(n) | O(1) |\n| coin_change_min | O(amount · nc) | O(amount) |\n| LIS (O(n²)) | O(n²) | O(n) |\n| knapsack_01 | O(n · cap) | O(cap) |\n| edit_distance | O(m · n) | O(m · n) → O(min(m,n)) 롤링 가능 |\n| LCS | O(m · n) | O(m · n) → O(min(m,n)) 롤링 가능 |\n| unique_paths | O(m · n) | O(n) |\n| max_product_subarray | O(n) | O(1) |\n", "problems": [{"num": 1, "slug": "climb_stairs", "title_ko": "계단 오르기", "title_en": "Climbing Stairs", "difficulty": "easy", "tags": ["1d-dp", "fibonacci", "rolling"], "prompt_ko": "한 번에 1칸 또는 2칸씩 올라 n계단 꼭대기에 도달하는 방법의 수를 구하라. bottom-up으로 O(1) 공간.", "prompt_en": "Count the ways to reach the top of n stairs climbing 1 or 2 at a time. Bottom-up in O(1) space.", "signature": "int climb_stairs(int n);", "examples": [{"in": "n=2", "out": "2"}, {"in": "n=3", "out": "3"}, {"in": "n=5", "out": "8"}], "hints": ["마지막 걸음이 1칸이면 dp[n-1]가지, 2칸이면 dp[n-2]가지.", "dp[n]=dp[n-1]+dp[n-2] (피보나치).", "prev1/prev2 변수 2개면 배열 불필요."], "solution": "int climb_stairs(int n) {\n    if (n \u003c 0) return 0;\n    if (n \u003c= 1) return 1;\n    int prev2 = 1, prev1 = 1;\n    for (int i = 2; i \u003c= n; ++i) {\n        int cur = prev1 + prev2;\n        prev2 = prev1;\n        prev1 = cur;\n    }\n    return prev1;\n}", "explanation_ko": "상태: dp[i]=i계단 오르는 방법 수. 전이: 마지막 걸음이 1칸 or 2칸이므로 dp[i]=dp[i-1]+dp[i-2]. 기저: dp[0]=dp[1]=1. 앞 두 값만 참조하므로 롤링 변수 2개로 O(1) 공간. 복잡도 O(n).", "complexity": "O(n) time, O(1) space", "pitfalls": ["dp[0]=1 을 0으로 착각", "n=0,1 기저 누락", "롤링 시 갱신 순서 꼬임"], "anduril_context": "재귀 없이 반복으로 상태 전이를 누적하는 가장 단순한 DP 패턴 연습. 스택 안전한 bottom-up의 기본형."}, {"num": 2, "slug": "house_robber", "title_ko": "도둑질 (인접 금지)", "title_en": "House Robber", "difficulty": "medium", "tags": ["1d-dp", "choice", "rolling"], "prompt_ko": "일렬로 늘어선 집들의 금액 배열에서 인접한 두 집을 동시에 털 수 없을 때 최대 금액을 구하라.", "prompt_en": "Given house values in a row, maximize the loot without robbing two adjacent houses.", "signature": "int house_robber(const int *nums, int n);", "examples": [{"in": "[2,7,9,3,1]", "out": "12"}, {"in": "[2,1,1,2]", "out": "4"}, {"in": "[]", "out": "0"}], "hints": ["각 집에서 '털까 말까' 두 선택.", "털면 이전 집은 못 터니 dp[i-2]+nums[i], 안 털면 dp[i-1].", "dp[i]=max(dp[i-1], dp[i-2]+nums[i])."], "solution": "int house_robber(const int *nums, int n) {\n    if (n \u003c= 0) return 0;\n    int prev2 = 0, prev1 = 0;\n    for (int i = 0; i \u003c n; ++i) {\n        int cur = prev1 > prev2 + nums[i] ? prev1 : prev2 + nums[i];\n        prev2 = prev1;\n        prev1 = cur;\n    }\n    return prev1;\n}", "explanation_ko": "상태: dp[i]=0..i집까지 고려한 최대 금액. 전이: i집을 안 털면 dp[i-1], 털면 dp[i-2]+nums[i] → 둘의 max. 기저: 가상 dp[-1]=0, dp[0]=nums[0](코드에선 prev2=prev1=0에서 자연히 나옴). 롤링 2변수로 O(1). 복잡도 O(n).", "complexity": "O(n) time, O(1) space", "pitfalls": ["n=0 빈 배열 미처리", "dp[i-2] 대신 dp[i-1]+nums[i] 로 인접 규칙 위반", "롤링 변수 갱신 순서"], "anduril_context": "제약(인접 금지) 하의 최적 선택 = 자원 스케줄링에서 '동시에 켤 수 없는 부하'의 전력 최대화와 동형."}, {"num": 3, "slug": "coin_change_min", "title_ko": "동전 교환 최소 개수", "title_en": "Coin Change (fewest coins)", "difficulty": "medium", "tags": ["1d-dp", "unbounded", "min"], "prompt_ko": "무제한 공급되는 동전들로 금액 amount를 만드는 데 필요한 최소 동전 수를 구하라. 만들 수 없으면 -1.", "prompt_en": "Given unlimited coins, return the fewest coins that sum to amount, or -1 if impossible.", "signature": "int coin_change_min(const int *coins, int nc, int amount);", "examples": [{"in": "coins=[1,2,5], amount=11", "out": "3"}, {"in": "coins=[2], amount=3", "out": "-1"}, {"in": "amount=0", "out": "0"}], "hints": ["dp[a]=금액 a의 최소 동전 수, dp[0]=0.", "dp[a]=min over coin{dp[a-coin]+1}.", "불가능은 INF로 두고 마지막에 -1 변환. INF+1 오버플로 주의."], "solution": "int coin_change_min(const int *coins, int nc, int amount) {\n    if (amount \u003c 0) return -1;\n    const int INF = INT_MAX - 1;\n    int *dp = malloc((size_t)(amount + 1) * sizeof *dp);\n    if (!dp) return -1;\n    dp[0] = 0;\n    for (int a = 1; a \u003c= amount; ++a) {\n        dp[a] = INF;\n        for (int c = 0; c \u003c nc; ++c)\n            if (coins[c] > 0 && a - coins[c] >= 0 && dp[a - coins[c]] + 1 \u003c dp[a])\n                dp[a] = dp[a - coins[c]] + 1;\n    }\n    int ans = (dp[amount] >= INF) ? -1 : dp[amount];\n    free(dp);\n    return ans;\n}", "explanation_ko": "상태: dp[a]=금액 a를 만드는 최소 동전 수. 전이: 마지막에 어떤 동전 coin을 쓰느냐로 dp[a]=min(dp[a-coin]+1). 기저: dp[0]=0. 순서: a 오름차순이면 dp[a-coin]이 이미 계산됨. 그리디는 틀리므로 반드시 DP. 복잡도 O(amount·nc), 공간 O(amount).", "complexity": "O(amount * nc) time, O(amount) space", "pitfalls": ["그리디(큰 동전부터)로 오답", "INT_MAX 그대로 쓰고 +1 하면 오버플로", "amount=0/불가능 경계 미처리", "malloc 후 free 누락"], "anduril_context": "고정 단위(패킷/블록) 조합으로 목표량을 최소 개수로 맞추기 → 대역폭 슬롯/에너지 퀀텀 최소 분할."}, {"num": 4, "slug": "longest_increasing_subsequence", "title_ko": "최장 증가 부분수열 (LIS)", "title_en": "Longest Increasing Subsequence", "difficulty": "medium", "tags": ["1d-dp", "subsequence", "n2"], "prompt_ko": "배열에서 순서를 유지하며 골라 만든 엄격히 증가하는 부분수열의 최대 길이를 구하라. O(n^2) 허용.", "prompt_en": "Find the length of the longest strictly increasing subsequence. O(n^2) is acceptable.", "signature": "int longest_increasing_subsequence(const int *nums, int n);", "examples": [{"in": "[10,9,2,5,3,7,101,18]", "out": "4"}, {"in": "[7,7,7,7]", "out": "1"}, {"in": "[]", "out": "0"}], "hints": ["dp[i]=nums[i]로 끝나는 LIS 길이, 모두 1로 시작.", "j\u003ci이고 nums[j]\u003cnums[i]인 dp[j]의 max+1.", "답은 dp 전체의 최댓값. O(n log n)은 tails[]+이진탐색."], "solution": "int longest_increasing_subsequence(const int *nums, int n) {\n    if (n \u003c= 0) return 0;\n    int *dp = malloc((size_t)n * sizeof *dp);\n    if (!dp) return 0;\n    int best = 1;\n    for (int i = 0; i \u003c n; ++i) {\n        dp[i] = 1;\n        for (int j = 0; j \u003c i; ++j)\n            if (nums[j] \u003c nums[i] && dp[j] + 1 > dp[i])\n                dp[i] = dp[j] + 1;\n        if (dp[i] > best) best = dp[i];\n    }\n    free(dp);\n    return best;\n}", "explanation_ko": "상태: dp[i]=nums[i]로 끝나는 증가수열의 최대 길이. 전이: dp[i]=1+max{dp[j]: j\u003ci, nums[j]\u003cnums[i]}, 없으면 1. 기저: 모든 dp[i]=1. 답은 표 전체의 최댓값(마지막 칸 아님!). O(n^2). O(n log n) 대안: tails[k]=길이 k+1의 최소 꼬리값을 이진탐색으로 유지.", "complexity": "O(n^2) time, O(n) space (O(n log n) with patience sort)", "pitfalls": ["답을 dp[n-1]로 착각(전체 최댓값이어야 함)", "\u003c= 로 비교해 비감소로 만듦(엄격 증가는 \u003c)", "빈 배열 0 처리"], "anduril_context": "시계열에서 단조 증가 구간 최장 길이 = 센서 드리프트/추세 분석의 기본형."}, {"num": 5, "slug": "knapsack_01", "title_ko": "0/1 배낭", "title_en": "0/1 Knapsack", "difficulty": "medium", "tags": ["1d-dp", "knapsack", "loop-direction"], "prompt_ko": "무게 w[i], 가치 v[i]인 아이템들을 각각 0 또는 1개만 담아 용량 cap을 넘지 않으면서 가치 합을 최대화하라.", "prompt_en": "Each item has weight w[i], value v[i], used at most once. Maximize total value within capacity cap.", "signature": "int knapsack_01(const int *w, const int *v, int n, int cap);", "examples": [{"in": "w=[1,3,4,5] v=[1,4,5,7] cap=7", "out": "9"}, {"in": "cap=0", "out": "0"}], "hints": ["dp[c]=용량 c 이하 최대 가치, 전부 0으로 시작.", "아이템마다 dp[c]=max(dp[c], dp[c-w[i]]+v[i]).", "c를 cap->w[i] 내림차순으로! 오름차순이면 무제한 배낭이 됨."], "solution": "int knapsack_01(const int *w, const int *v, int n, int cap) {\n    if (cap \u003c= 0 || n \u003c= 0) return 0;\n    int *dp = calloc((size_t)(cap + 1), sizeof *dp);\n    if (!dp) return 0;\n    for (int i = 0; i \u003c n; ++i)\n        for (int c = cap; c >= w[i]; --c) {\n            int cand = dp[c - w[i]] + v[i];\n            if (cand > dp[c]) dp[c] = cand;\n        }\n    int ans = dp[cap];\n    free(dp);\n    return ans;\n}", "explanation_ko": "상태: dp[c]=용량 c에서 최대 가치. 전이: 아이템 i를 담으면 dp[c-w[i]]+v[i], 안 담으면 dp[c] → max. 기저: dp[*]=0. 순서: c를 내림차순으로 돌아야 dp[c-w[i]]가 '이 아이템을 아직 안 쓴' 값이 되어 0/1이 보장됨(오름차순 = unbounded). 2D dp[i][c]를 1D로 압축한 형태. 복잡도 O(n·cap), 공간 O(cap).", "complexity": "O(n * cap) time, O(cap) space", "pitfalls": ["c 오름차순으로 돌아 아이템 중복 사용(무제한 배낭)", "cap=0 경계", "calloc으로 0 초기화 안 하면 쓰레기값"], "anduril_context": "제한된 대역폭/전력 예산 안에서 어떤 태스크·스트림을 포함할지 선택 = 전형적 자원 배분. 링크 예산 스케줄링과 동형."}, {"num": 6, "slug": "edit_distance", "title_ko": "편집 거리 (Levenshtein)", "title_en": "Edit Distance", "difficulty": "hard", "tags": ["2d-dp", "string", "levenshtein"], "prompt_ko": "문자열 a를 b로 바꾸는 데 필요한 최소 연산 수(삽입/삭제/치환)를 구하라.", "prompt_en": "Minimum number of insert/delete/substitute operations to turn a into b.", "signature": "int edit_distance(const char *a, const char *b);", "examples": [{"in": "kitten -> sitting", "out": "3"}, {"in": "'' -> abc", "out": "3"}, {"in": "same -> same", "out": "0"}], "hints": ["dp[i][j]=a앞i글자를 b앞j글자로 바꾸는 최소 연산.", "문자가 같으면 dp[i-1][j-1], 다르면 1+min(삭제/삽입/치환).", "기저 dp[i][0]=i, dp[0][j]=j."], "solution": "int edit_distance(const char *a, const char *b) {\n    int la = (int)strlen(a), lb = (int)strlen(b);\n    int W = lb + 1;\n    int *dp = malloc((size_t)(la + 1) * (size_t)W * sizeof *dp);\n    if (!dp) return -1;\n    for (int i = 0; i \u003c= la; ++i) dp[i * W + 0] = i;\n    for (int j = 0; j \u003c= lb; ++j) dp[0 * W + j] = j;\n    for (int i = 1; i \u003c= la; ++i)\n        for (int j = 1; j \u003c= lb; ++j) {\n            if (a[i-1] == b[j-1]) {\n                dp[i*W+j] = dp[(i-1)*W+(j-1)];\n            } else {\n                int del = dp[(i-1)*W+j], ins = dp[i*W+(j-1)], sub = dp[(i-1)*W+(j-1)];\n                int m = del \u003c ins ? del : ins; if (sub \u003c m) m = sub;\n                dp[i*W+j] = 1 + m;\n            }\n        }\n    int ans = dp[la*W+lb];\n    free(dp);\n    return ans;\n}", "explanation_ko": "상태: dp[i][j]=a[0..i)를 b[0..j)로 바꾸는 최소 편집 수. 전이: a[i-1]==b[j-1]이면 비용 0으로 dp[i-1][j-1], 아니면 1+min(dp[i-1][j] 삭제, dp[i][j-1] 삽입, dp[i-1][j-1] 치환). 기저: dp[i][0]=i(i개 삭제), dp[0][j]=j(j개 삽입). C엔 2D 가변배열이 없어 dp[i*W+j]로 flatten. 복잡도 O(m·n), 공간 O(m·n)(한 행만 유지하면 O(min)).", "complexity": "O(m*n) time, O(m*n) space (O(min(m,n)) with rolling)", "pitfalls": ["기저 행/열 초기화 누락", "문자 접근 a[i-1] 인덱스 off-by-one", "치환/삽입/삭제 세 방향 중 하나 빠뜨림", "free 누락"], "anduril_context": "잡음 섞인 명령/식별자 문자열의 퍼지 매칭 = 오타 보정, 프로토콜 커맨드 근사 매칭에 직접 사용."}, {"num": 7, "slug": "longest_common_subsequence", "title_ko": "최장 공통 부분수열 (LCS)", "title_en": "Longest Common Subsequence", "difficulty": "medium", "tags": ["2d-dp", "string", "subsequence"], "prompt_ko": "두 문자열에서 순서를 유지한 채 공통으로 뽑을 수 있는 가장 긴 부분수열의 길이를 구하라(연속일 필요 없음).", "prompt_en": "Length of the longest subsequence common to both strings (not necessarily contiguous).", "signature": "int longest_common_subsequence(const char *a, const char *b);", "examples": [{"in": "abcde, ace", "out": "3"}, {"in": "abc, def", "out": "0"}, {"in": "'' , abc", "out": "0"}], "hints": ["dp[i][j]=a앞i, b앞j의 LCS 길이, 기저 0.", "문자 같으면 dp[i-1][j-1]+1.", "다르면 max(dp[i-1][j], dp[i][j-1])."], "solution": "int longest_common_subsequence(const char *a, const char *b) {\n    int la = (int)strlen(a), lb = (int)strlen(b);\n    int W = lb + 1;\n    int *dp = calloc((size_t)(la + 1) * (size_t)W, sizeof *dp);\n    if (!dp) return 0;\n    for (int i = 1; i \u003c= la; ++i)\n        for (int j = 1; j \u003c= lb; ++j) {\n            if (a[i-1] == b[j-1])\n                dp[i*W+j] = dp[(i-1)*W+(j-1)] + 1;\n            else {\n                int u = dp[(i-1)*W+j], l = dp[i*W+(j-1)];\n                dp[i*W+j] = u > l ? u : l;\n            }\n        }\n    int ans = dp[la*W+lb];\n    free(dp);\n    return ans;\n}", "explanation_ko": "상태: dp[i][j]=a[0..i)와 b[0..j)의 LCS 길이. 전이: 마지막 문자가 같으면 dp[i-1][j-1]+1, 다르면 한쪽을 버린 max(dp[i-1][j], dp[i][j-1]). 기저: 한쪽이 빈 문자열이면 0(calloc으로 자동). 편집거리와 쌍둥이 구조. 복잡도 O(m·n), 공간 O(m·n).", "complexity": "O(m*n) time, O(m*n) space (O(min(m,n)) with rolling)", "pitfalls": ["부분문자열(연속)과 혼동(부분수열은 불연속 허용)", "기저 0 초기화 누락", "인덱스 off-by-one"], "anduril_context": "두 펌웨어 이미지/설정의 공통부분 추출 = diff 기반 델타 OTA 업데이트로 전송량 최소화."}, {"num": 8, "slug": "unique_paths", "title_ko": "격자 경로 수", "title_en": "Unique Paths", "difficulty": "easy", "tags": ["2d-dp", "grid", "rolling"], "prompt_ko": "m x n 격자에서 좌상단부터 우하단까지 오른쪽/아래로만 이동할 때 서로 다른 경로의 수를 구하라.", "prompt_en": "Count distinct paths from top-left to bottom-right of an m x n grid moving only right or down.", "signature": "int unique_paths(int m, int n);", "examples": [{"in": "3 x 7", "out": "28"}, {"in": "3 x 3", "out": "6"}, {"in": "1 x 10", "out": "1"}], "hints": ["dp[i][j]=(i,j)까지 경로 수, 위 또는 왼쪽에서만 옴.", "dp[i][j]=dp[i-1][j]+dp[i][j-1].", "첫 행/열은 전부 1. 한 행 row[]만 유지해 O(n) 공간."], "solution": "int unique_paths(int m, int n) {\n    if (m \u003c= 0 || n \u003c= 0) return 0;\n    int *row = malloc((size_t)n * sizeof *row);\n    if (!row) return 0;\n    for (int j = 0; j \u003c n; ++j) row[j] = 1;\n    for (int i = 1; i \u003c m; ++i)\n        for (int j = 1; j \u003c n; ++j)\n            row[j] = row[j] + row[j - 1];\n    int ans = row[n - 1];\n    free(row);\n    return ans;\n}", "explanation_ko": "상태: dp[i][j]=(0,0)에서 (i,j)까지 오는 경로 수. 전이: 위 또는 왼쪽에서만 오므로 dp[i][j]=dp[i-1][j]+dp[i][j-1]. 기저: 첫 행/열은 한 방향뿐이라 모두 1. 각 칸이 위+왼쪽에만 의존 → 한 행만 제자리 갱신해 O(n) 공간. 복잡도 O(m·n).", "complexity": "O(m*n) time, O(n) space", "pitfalls": ["첫 행/열 1 초기화 누락", "2D 전체 배열로 낭비(1D 롤링 가능)", "m 또는 n=0 경계"], "anduril_context": "격자 위 경로 열거 = 경로 계획(path planning)/도달 가능성 카운팅의 축소판. 상태 공간 탐색의 DP 기초."}, {"num": 9, "slug": "max_product_subarray", "title_ko": "최대 곱 부분배열", "title_en": "Maximum Product Subarray", "difficulty": "medium", "tags": ["1d-dp", "kadane", "min-max"], "prompt_ko": "정수 배열에서 연속 부분배열의 곱이 최대가 되는 값을 구하라. 음수와 0이 섞일 수 있다.", "prompt_en": "Find the maximum product of a contiguous subarray; the array may contain negatives and zeros.", "signature": "int max_product_subarray(const int *nums, int n);", "examples": [{"in": "[2,3,-2,4]", "out": "6"}, {"in": "[-2,3,-4]", "out": "24"}, {"in": "[-2,0,-1]", "out": "0"}], "hints": ["음수*음수=양수라 '지금까지 최소 곱'도 후보가 된다.", "현재로 끝나는 max, min을 함께 추적.", "후보는 {x, maxp*x, minp*x} 세 개."], "solution": "int max_product_subarray(const int *nums, int n) {\n    if (n \u003c= 0) return 0;\n    int maxp = nums[0], minp = nums[0], ans = nums[0];\n    for (int i = 1; i \u003c n; ++i) {\n        int x = nums[i], a = maxp * x, b = minp * x;\n        int nmax = x; if (a > nmax) nmax = a; if (b > nmax) nmax = b;\n        int nmin = x; if (a \u003c nmin) nmin = a; if (b \u003c nmin) nmin = b;\n        maxp = nmax; minp = nmin;\n        if (maxp > ans) ans = maxp;\n    }\n    return ans;\n}", "explanation_ko": "상태: maxp/minp=현재 원소로 끝나는 부분배열의 최대/최소 곱. 전이: x가 음수면 max와 min이 뒤집히므로 후보 {x, maxp·x, minp·x}에서 각각 max/min을 취한다. 기저: maxp=minp=ans=nums[0]. 0을 만나면 x가 후보에 있어 자연히 리셋됨. 합 문제 Kadane의 곱셈 버전. 복잡도 O(n), 공간 O(1).", "complexity": "O(n) time, O(1) space", "pitfalls": ["최소 곱을 안 들고 다녀 음수 뒤집힘 놓침", "x 자체를 후보에 안 넣어 0/리셋 처리 실패", "maxp 갱신 시 옛 maxp를 min 계산에 재사용(먼저 임시 저장)"], "anduril_context": "부호가 바뀌는 신호(이득/감쇠 곱)의 최대 누적 구간 추적 = 부호 반전 상태를 함께 관리하는 DP 사고 훈련."}]}, {"id": "17_sorting_searching", "order": 17, "range": "Sort/Search", "icon": "🔎", "track": "dsa", "title_en": "Sorting & Searching", "title_ko": "정렬 & 탐색", "summary_ko": "이진탐색 3형제(정확 매칭·lower/upper bound·회전배열)와 고전 정렬 4종(merge/quick/counting/insertion), 그리고 quickselect(k번째)를 C로 직접 구현한다. 하이라이트는 두 배열 최근접 매칭을 브루트포스 O(n*m)에서 정렬+이진탐색 O((n+m)log m)로 스케일업하는 Anduril 폰스크린 기출. 핵심은 이진탐색 경계(폐/반개구간·오버플로·언더플로)와 정렬 트레이드오프.", "summary_en": "Implement the three binary-search variants (exact match, lower/upper bound, rotated array), four classic sorts (merge/quick/counting/insertion), and quickselect. Highlight: the two-array nearest-match question reported from an Anduril phone screen, scaled from brute force O(n*m) to sort+binary-search O((n+m)log m). Focus on binary-search boundaries and sort trade-offs.", "anduril_relevance_ko": "자율체 펌웨어는 정렬된 룩업 테이블/캘리브레이션 곡선에서 이진탐색으로 값을 log 시간에 찾고, ADC/픽셀 히스토그램은 counting sort로 O(n)에 세운다. 특히 '두 배열 최근접 매칭'은 새로 검출된 표적 집합을 기존 트랙에 연관(association)시키는 센서 융합의 핵심 커널로, 표적/트랙 수가 커지면 브루트포스 O(n*m)가 병목이 되어 B를 정렬해두고 이진탐색으로 O((n+m)log m)로 스케일업한다. 면접관은 이진탐색 off-by-one, 정렬 안정성/최악 보장, quickselect로 전체 정렬을 피하는 사고, 그리고 '더 커지면 어떻게?' 스케일업을 파고든다.", "concepts": [{"term": "binary search boundary", "ko": "폐구간 [lo,hi] vs 반개구간 [lo,hi). mid=lo+(hi-lo)/2로 오버플로 회피, mid==0 언더플로 방어.", "en": "Closed [lo,hi] vs half-open [lo,hi); mid=lo+(hi-lo)/2 avoids overflow, guard mid==0 underflow."}, {"term": "lower/upper bound", "ko": "lower=첫 >=target, upper=첫 >target. 차이는 비교 연산자 하나. 개수=ub-lb.", "en": "lower=first >=target, upper=first >target; differ by one comparator; count=ub-lb."}, {"term": "rotated search", "ko": "회전 정렬배열은 매 스텝 한쪽 절반이 정렬됨 → 그 범위로 방향 결정. O(log n).", "en": "In a rotated sorted array one half is always sorted; use its range to steer. O(log n)."}, {"term": "merge sort", "ko": "안정, O(n log n), O(n) 보조버퍼. 왼쪽 우선 병합으로 안정성. 외부정렬 기반.", "en": "Stable, O(n log n), O(n) aux; left-first merge for stability; basis of external sort."}, {"term": "quicksort", "ko": "평균 O(n log n)/최악 O(n^2), in-place, 불안정. median-of-3로 최악 완화.", "en": "Avg O(n log n)/worst O(n^2), in-place, unstable; median-of-3 softens worst case."}, {"term": "quickselect", "ko": "분할 후 k가 든 쪽만 재귀 → 평균 O(n)에 k번째 순서통계량. 전체 정렬 불필요.", "en": "Recurse only into the side with k → average O(n) k-th order statistic; no full sort."}, {"term": "counting sort", "ko": "값 범위 [0,K]면 O(n+K). 비교정렬 하한 우회. 히스토그램/radix 기반.", "en": "O(n+K) for values in [0,K]; bypasses comparison lower bound; histogram/radix basis."}, {"term": "insertion sort", "ko": "안정, in-place, 거의 정렬된/작은 n에서 O(n)에 근접. 하이브리드 컷오프.", "en": "Stable, in-place, near O(n) for nearly-sorted/small n; hybrid cutoff sort."}, {"term": "nearest-match scale-up", "ko": "각 A를 B에 최근접 매칭: 브루트포스 O(n*m) → B 정렬+이진탐색 O((n+m)log m).", "en": "Nearest-match each A to B: brute O(n*m) → sort B + binary search O((n+m)log m)."}], "study_note_md": "# 17. Sorting & Searching (정렬 & 탐색) · Sort/Search 🔎\n\n> **정렬된 데이터를 log 시간에 때려잡는** 드릴. 이진탐색 3형제(정확 매칭 /\n> lower·upper bound / 회전배열) + 고전 정렬 4종(merge/quick/counting/insertion)\n> + quickselect(k번째) + **두 배열 최근접 매칭**(브루트포스 → 정렬+이진탐색).\n> 마지막 문제는 **Anduril 폰스크린 기출**로 알려진 유형이다.\n\n---\n\n## 왜 이 토픽이 인터뷰에 나오나\n\n- 이진탐색은 **off-by-one의 지뢰밭**이다. `[lo,hi]` 폐구간 vs `[lo,hi)` 반개구간,\n  `mid=(lo+hi)/2` 오버플로, `size_t` 언더플로 — 면접관이 가장 좋아하는 디테일.\n- 정렬은 **트레이드오프 대화**다. 안정성? 추가 메모리? 최악 O(n²)? 캐시 지역성?\n  \"왜 이 상황에서 merge 대신 quick/counting/insertion?\"을 설명할 수 있어야 한다.\n- **quickselect**는 \"전부 정렬하지 말고 k번째만 O(n)에 뽑아라\"는 사고 전환.\n- **두 배열 최근접 매칭**은 브루트포스 O(n·m)를 **정렬+이진탐색 O((n+m)log m)**로\n  줄이는 전형적 스케일업 문제. Anduril 폰스크린에서 실제로 나온 것으로 보고된 문제.\n\n---\n\n## 핵심 개념 치트시트\n\n| 개념 | 요점 |\n|---|---|\n| **binary_search** | 폐구간 `[lo,hi]`, `mid=lo+(hi-lo)/2`(오버플로 회피). `lo\u003c=hi` 조건, `mid==0` 언더플로 방어. |\n| **lower_bound** | `a[i] >= target` 첫 위치. 반개구간 `[lo,hi)`, `a[mid]\u003ctarget → lo=mid+1`. 없으면 n. |\n| **upper_bound** | `a[i] > target` 첫 위치. `a[mid]\u003c=target → lo=mid+1`. **개수 = ub - lb**. |\n| **search_rotated** | 회전배열. 매 스텝 **절반은 정렬돼 있다** → 그 범위에 target 포함 여부로 방향 결정. O(log n). |\n| **merge_sort** | 안정, O(n log n), **O(n) 보조버퍼**. 외부정렬/연결리스트에 강함. 병합이 핵심. |\n| **quicksort** | 평균 O(n log n), 최악 O(n²). in-place, 불안정. **median-of-3**로 최악 완화. |\n| **quickselect** | 분할 후 **k가 든 쪽만** 재귀 → 평균 **O(n)**. 전체 정렬(n log n) 불필요. |\n| **counting_sort** | 값이 `[0,K]`면 O(n+K). 비교정렬 하한(n log n) **우회**. 사실상 히스토그램. |\n| **insertion_sort** | O(n²)지만 **거의 정렬된/작은 n**에서 최고. quicksort 재귀 바닥 전환용. |\n| **nearest match** | 브루트포스 O(n·m) → **B 정렬 + 이진탐색** O((n+m)log m). |\n\n---\n\n## 이진탐색 3형제 — 경계 규칙 정리\n\n```text\nbinary_search : [lo, hi]  폐구간   while(lo\u003c=hi)  hi=mid-1 / lo=mid+1\nlower/upper   : [lo, hi)  반개구간 while(lo\u003chi)   hi=mid   / lo=mid+1\n```\n\n- **폐구간**: `hi=n-1`에서 시작, `lo\u003c=hi`가 조건. `hi=mid-1`이라 `mid==0`이면\n  `size_t` 언더플로 → `if(mid==0) break;` 가드가 필수.\n- **반개구간**: `hi=n`에서 시작, `lo\u003chi`가 조건. `hi=mid`(감소만) → 언더플로 없음.\n  lower/upper bound·삽입점 계산은 반개구간이 훨씬 깔끔하다.\n- `mid = lo + (hi-lo)/2` 는 `(lo+hi)` 오버플로를 막는 관용구. 임베디드 32비트에서 실제로 중요.\n\n---\n\n## 문제별 요점 & 함정\n\n### 1. binary_search\n- 폐구간 정석. `a[mid]==target` 즉시 반환, `\u003c`면 오른쪽, `>`면 왼쪽.\n- 함정: `hi=mid-1`에서 `mid==0` 언더플로, `mid=(lo+hi)/2` 오버플로, `lo\u003chi`로 잘못 쓰면 마지막 원소 누락.\n\n### 2. lower_bound / upper_bound\n- 차이는 비교 연산자 하나: lower는 `a[mid]\u003ctarget`, upper는 `a[mid]\u003c=target`일 때 `lo=mid+1`.\n- **중복값**의 시작/끝을 잡는 도구. `ub-lb`가 등장 횟수. 삽입 위치(정렬 유지)도 곧 lower_bound.\n- 함정: \"찾았다/못 찾았다\"를 반환하려면 `lb\u003cn && a[lb]==target` 별도 확인.\n\n### 3. search_rotated\n- `a[lo]\u003c=a[mid]`면 **왼쪽 절반이 정렬됨** → `a[lo]\u003c=target\u003ca[mid]`면 왼쪽, 아니면 오른쪽.\n- 아니면 오른쪽 절반이 정렬됨 → `a[mid]\u003ctarget\u003c=a[hi]`면 오른쪽, 아니면 왼쪽.\n- 함정: 중복 있으면 `a[lo]==a[mid]` 판정 모호 → 최악 O(n)로 퇴화(이 문제는 중복 없음 가정).\n\n### 4. merge_sort\n- 안정 정렬. 병합에서 `a[i]\u003c=a[j]`로 **왼쪽 우선**해야 안정성 유지.\n- 보조 버퍼를 **한 번만** 할당해 재귀에서 재사용(매 호출 malloc 금지).\n- 함정: 병합 후 `tmp`를 원본으로 되쓰기 누락, `mid` 경계 off-by-one.\n\n### 5. quicksort (Lomuto)\n- Lomuto: 피벗=마지막 원소, `a[lo..i)\u003cpivot` 불변식 유지하며 스캔, 끝에 피벗 스왑.\n- **median-of-3**로 이미 정렬/역정렬 입력의 O(n²)를 완화. 작은 쪽만 재귀 → 스택 O(log n).\n- 함정: 중복 많은 배열에서 Lomuto는 불균형(3-way/Hoare가 유리), `p-1` 언더플로.\n\n### 6. quickselect_kth\n- quicksort와 같은 분할이되 **k가 든 쪽만** 재귀 → 평균 O(n), 최악 O(n²).\n- k는 0-index(0=최소). 피벗 위치 `p==k`면 즉시 답. 배열은 재배치됨(부분 정렬).\n- 함정: `k>=n` 방어, `p==0` 언더플로. 최악 회피엔 median-of-medians(이론), 실무는 랜덤 피벗.\n\n### 7. counting_sort\n- 값 범위 `[0,K]`가 작을 때 O(n+K). 히스토그램 집계 후 값 순서로 펼침.\n- prefix-sum 변형을 쓰면 **안정 정렬**로 만들 수 있고 radix sort의 한 자리 단계가 된다.\n- 함정: K가 크면 메모리 폭발, 음수/범위 밖 값 방어, `int` 인덱스 오버플로.\n\n### 8. nearest_match_two_arrays  ★ Anduril 폰스크린 기출\n- **문제**: A의 각 원소마다 B에서 가장 가까운 값을 찾고, 전체 최대 거리도 반환.\n- **(a) 브루트포스**: 각 A[i]마다 B 전체 스캔 → **O(n·m)**. 코드 짧고 정답이지만 느림.\n- **(b) 스케일업 팔로업**: B를 **정렬(O(m log m))** → 각 A[i]를 **lower_bound 이진탐색**으로\n  삽입점 찾고 그 **좌/우 두 후보만** 비교 → **O((n+m) log m)**.\n- 왜 두 후보만? 정렬된 B에서 A[i]에 가장 가까운 값은 반드시 삽입점 바로 앞/뒤에 있다.\n- 동거리(tie) 처리 규칙을 정해야 두 구현의 결과가 일치한다(여기선 '더 큰 값' 선택).\n- 함정: `pos==m`(모든 B\u003cA[i])면 우측 후보 없음 → 마지막 원소, `pos==0`이면 좌측 없음.\n  거리 계산 `|A[i]-B[j]|`는 `long`으로 승격해 int 오버플로 방지.\n- **면접 포인트**: \"n,m이 수천×수천이 되면?\"에 즉시 정렬+이진탐색으로 답하고,\n  n이 아주 크고 B가 고정이면 **B를 한 번만 정렬**해 재사용(전처리 분리)한다고 덧붙인다.\n\n### 9. insertion_sort\n- 안정, in-place, O(1) 추가공간. 거의 정렬된 입력은 O(n)에 근접(각 원소 살짝만 이동).\n- 함정: 시프트 방향 실수, `j>0 && a[j-1]>key` 조건에서 `>`(안정) vs `>=`(불안정) 구분.\n\n---\n\n## 인터뷰 팔로업 (자주 나오는 꼬리질문)\n\n1. **\"이진탐색 오버플로/언더플로 어디서 나나?\"** → `(lo+hi)/2` 오버플로, `hi=mid-1`의 `mid==0` 언더플로.\n2. **\"lower_bound와 upper_bound 차이?\"** → 비교 연산자 `\u003c` vs `\u003c=`. `ub-lb`가 중복 개수.\n3. **\"merge vs quick 언제?\"** → 안정성/최악보장/외부정렬이면 merge, in-place/평균속도/캐시면 quick.\n4. **\"quicksort 최악은?\"** → 이미 정렬된 입력에 끝 피벗 → O(n²). median-of-3/랜덤 피벗으로 완화.\n5. **\"k번째만 필요한데 전부 정렬?\"** → 아니오, quickselect 평균 O(n).\n6. **\"counting sort 언제 못 쓰나?\"** → 값 범위가 크거나 실수/임의 키일 때. 그땐 비교정렬/radix.\n7. **\"두 배열 최근접을 더 빠르게?\"** → B 정렬 후 이진탐색 O((n+m)log m). B가 고정이면 정렬 1회 재사용.\n\n---\n\n## 빌드 & 실행\n\n```sh\n# 연습(직접 채우기)\ncc -std=c11 -Wall -Wextra problems/17_sorting_searching.c -o /tmp/andb_17 && /tmp/andb_17\n# 정답 확인 (전부 PASS)\ncc -std=c11 -Wall -Wextra solutions/17_sorting_searching.c -o /tmp/andb_17 && /tmp/andb_17\n# 또는\nmake prob N=17_sorting_searching      #  연습\nmake sol  N=17_sorting_searching      #  정답\n```\n\n> **핵심 한 줄**: \"데이터가 정렬돼 있으면 선형 스캔 대신 **log 시간**이다.\"\n> 이진탐색으로 룩업 테이블/캘리브레이션 값을 찾고, 정렬로 최근접 매칭을 스케일업하며,\n> counting sort로 센서 히스토그램을 O(n)에 세운다.\n", "problems": [{"num": 1, "slug": "binary_search", "title_ko": "이진 탐색", "title_en": "Binary search", "difficulty": "easy", "tags": ["binary-search", "off-by-one"], "prompt_ko": "정렬된 배열 a[0..n)에서 target의 인덱스를 반환하고 없으면 -1. 폐구간 [lo,hi]와 mid=lo+(hi-lo)/2로 오버플로/off-by-one을 방어하라.", "prompt_en": "Return index of target in sorted a, else -1. Use [lo,hi] and mid=lo+(hi-lo)/2 to avoid overflow / off-by-one.", "signature": "int binary_search(const int *a, size_t n, int target)", "examples": [{"in": "{1,3,5,7,9,11}, 7", "out": "3"}, {"in": "{1,3,5,7,9,11}, 4", "out": "-1"}], "hints": ["폐구간 [lo,hi], 조건은 lo\u003c=hi (lo==hi도 검사).", "mid=lo+(hi-lo)/2로 (lo+hi) 오버플로 회피.", "hi=mid-1에서 mid==0이면 size_t 언더플로 → break로 방어."], "solution": "int binary_search(const int *a, size_t n, int target){\n    if(!a||n==0)return -1;\n    size_t lo=0,hi=n-1;\n    while(lo\u003c=hi){\n        size_t mid=lo+(hi-lo)/2;\n        if(a[mid]==target)return (int)mid;\n        if(a[mid]\u003ctarget) lo=mid+1;\n        else { if(mid==0) break; hi=mid-1; }\n    }\n    return -1;\n}", "explanation_ko": "PATTERN: 폐구간 이진탐색. 매 반복마다 [lo,hi]를 절반으로 줄인다. mid를 lo+(hi-lo)/2로 계산해 (lo+hi) 오버플로를 막고, hi=mid-1 경로에서 mid==0 언더플로를 break로 방어한다. 조건은 lo\u003c=hi여야 마지막 한 원소까지 검사한다. O(log n) 시간, O(1) 공간.", "complexity": "O(log n) time, O(1) space", "pitfalls": ["(lo+hi)/2 오버플로 → lo+(hi-lo)/2 사용.", "hi=mid-1에서 mid==0 언더플로.", "lo\u003chi로 잘못 쓰면 마지막 원소 누락."], "anduril_context": "센서 캘리브레이션/룩업 테이블에서 임계값 인덱스를 log 시간에 조회."}, {"num": 2, "slug": "lower_bound_upper_bound", "title_ko": "lower/upper bound", "title_en": "Lower/upper bound", "difficulty": "medium", "tags": ["binary-search", "duplicates", "insertion-point"], "prompt_ko": "반개구간 [lo,hi) 이진탐색으로 lower_bound(target 이상이 처음 나오는 위치)와 upper_bound(target 초과가 처음 나오는 위치)를 구현하라. 못 찾으면 n. 개수 = upper_bound - lower_bound.", "prompt_en": "Implement lower_bound (first index with a[i]>=target) and upper_bound (first with a[i]>target) via half-open [lo,hi). Count = ub - lb.", "signature": "size_t lower_bound(const int *a, size_t n, int target); size_t upper_bound(const int *a, size_t n, int target)", "examples": [{"in": "a={1,2,2,2,4,5}, lower_bound(...,2)", "out": "1"}, {"in": "a={1,2,2,2,4,5}, upper_bound(...,2)", "out": "4"}], "hints": ["반개구간 [lo,hi), 조건 lo\u003chi, hi=mid(감소만)라 언더플로 없음.", "lower: a[mid]\u003ctarget → lo=mid+1, else hi=mid.", "upper: a[mid]\u003c=target → lo=mid+1, else hi=mid."], "solution": "size_t lower_bound(const int *a, size_t n, int target){\n    size_t lo=0,hi=n;\n    while(lo\u003chi){\n        size_t mid=lo+(hi-lo)/2;\n        if(a[mid]\u003ctarget) lo=mid+1; else hi=mid;\n    }\n    return lo;\n}\nsize_t upper_bound(const int *a, size_t n, int target){\n    size_t lo=0,hi=n;\n    while(lo\u003chi){\n        size_t mid=lo+(hi-lo)/2;\n        if(a[mid]\u003c=target) lo=mid+1; else hi=mid;\n    }\n    return lo;\n}", "explanation_ko": "PATTERN: 반개구간 이진탐색. 두 함수의 유일한 차이는 비교 연산자다(lower는 \u003c, upper는 \u003c=). hi를 mid로만 줄이므로 size_t 언더플로가 없고 삽입점 계산에 깔끔하다. 중복값의 시작(lower)과 끝(upper)을 잡으며, upper-lower가 등장 횟수다. O(log n) 시간, O(1) 공간.", "complexity": "O(log n) time, O(1) space", "pitfalls": ["'찾음' 여부는 lb\u003cn && a[lb]==target로 별도 확인.", "lower/upper 비교 연산자 혼동.", "폐구간 습관으로 hi=n-1 쓰면 마지막 원소 처리 오류."], "anduril_context": "정렬된 타임스탬프/트랙 로그에서 구간 질의(범위 내 샘플 개수) 및 삽입점 계산."}, {"num": 3, "slug": "search_rotated_sorted", "title_ko": "회전 정렬배열 탐색", "title_en": "Search in rotated sorted array", "difficulty": "medium", "tags": ["binary-search", "rotated"], "prompt_ko": "회전된 오름차순 배열(중복 없음)에서 target의 인덱스를 O(log n)에 반환, 없으면 -1. 매 스텝 절반은 정렬돼 있으므로 그 범위에 target이 있는지로 방향을 결정한다.", "prompt_en": "Search a rotated sorted array (no duplicates) in O(log n); return index or -1. Half is always sorted; use its range to decide direction.", "signature": "int search_rotated(const int *a, size_t n, int target)", "examples": [{"in": "{4,5,6,7,0,1,2}, 0", "out": "4"}, {"in": "{4,5,6,7,0,1,2}, 3", "out": "-1"}], "hints": ["a[lo]\u003c=a[mid]면 왼쪽 절반이 정렬됨.", "정렬된 절반의 범위에 target이 들면 그쪽, 아니면 반대쪽.", "중복 없다는 가정이 판정을 단순하게 만든다."], "solution": "int search_rotated(const int *a, size_t n, int target){\n    if(!a||n==0)return -1;\n    size_t lo=0,hi=n-1;\n    while(lo\u003c=hi){\n        size_t mid=lo+(hi-lo)/2;\n        if(a[mid]==target)return (int)mid;\n        if(a[lo]\u003c=a[mid]){\n            if(a[lo]\u003c=target&&target\u003ca[mid]){ if(mid==0) break; hi=mid-1; }\n            else lo=mid+1;\n        } else {\n            if(a[mid]\u003ctarget&&target\u003c=a[hi]) lo=mid+1;\n            else { if(mid==0) break; hi=mid-1; }\n        }\n    }\n    return -1;\n}", "explanation_ko": "PATTERN: 변형 이진탐색. 회전배열이라도 mid 기준 한쪽 절반은 항상 정렬돼 있다. a[lo]\u003c=a[mid]면 왼쪽이 정렬 → target이 [a[lo],a[mid]) 범위면 왼쪽으로, 아니면 오른쪽으로 간다. 반대 경우도 대칭. 매 스텝 구간이 반으로 줄어 O(log n). 중복이 있으면 a[lo]==a[mid] 판정이 모호해져 O(n)로 퇴화.", "complexity": "O(log n) time, O(1) space", "pitfalls": ["정렬된 절반 판정(a[lo]\u003c=a[mid]) 부등호 실수.", "target 범위 경계(\u003c vs \u003c=) off-by-one.", "중복 존재 시 O(n) 퇴화(이 문제는 중복 없음 가정)."], "anduril_context": "순환 버퍼/래핑된 타임스탬프처럼 회전된 정렬 데이터에서의 조회."}, {"num": 4, "slug": "merge_sort", "title_ko": "병합 정렬", "title_en": "Merge sort", "difficulty": "medium", "tags": ["sort", "stable", "divide-conquer"], "prompt_ko": "a[0..n)를 오름차순으로 안정 정렬하라. O(n log n) 시간, O(n) 보조버퍼. 보조 버퍼는 한 번만 malloc해 재귀에서 재사용한다.", "prompt_en": "Stable-sort a ascending in O(n log n) with one reused O(n) aux buffer.", "signature": "void merge_sort(int *a, size_t n)", "examples": [{"in": "{5,2,8,1}", "out": "{1,2,5,8}"}, {"in": "{3,1,3,1,2,2}", "out": "{1,1,2,2,3,3}"}], "hints": ["분할: [lo,hi)를 mid에서 둘로 나눠 재귀.", "병합: a[i]\u003c=a[j]로 왼쪽 우선 → 안정성.", "보조 버퍼는 top-level에서 1회 할당."], "solution": "static void merge_run(int *a,int *tmp,size_t lo,size_t mid,size_t hi){\n    size_t i=lo,j=mid,k=lo;\n    while(i\u003cmid&&j\u003chi){ if(a[i]\u003c=a[j]) tmp[k++]=a[i++]; else tmp[k++]=a[j++]; }\n    while(i\u003cmid) tmp[k++]=a[i++];\n    while(j\u003chi)  tmp[k++]=a[j++];\n    for(size_t t=lo;t\u003chi;t++) a[t]=tmp[t];\n}\nstatic void merge_rec(int *a,int *tmp,size_t lo,size_t hi){\n    if(hi-lo\u003c2)return;\n    size_t mid=lo+(hi-lo)/2;\n    merge_rec(a,tmp,lo,mid); merge_rec(a,tmp,mid,hi);\n    merge_run(a,tmp,lo,mid,hi);\n}\nvoid merge_sort(int *a, size_t n){\n    if(!a||n\u003c2)return;\n    int *tmp=malloc(n*sizeof *tmp);\n    if(!tmp)return;\n    merge_rec(a,tmp,0,n);\n    free(tmp);\n}", "explanation_ko": "PATTERN: 분할정복 + 안정 병합. 배열을 절반으로 재귀 분할한 뒤 두 정렬 구간을 병합한다. 병합에서 a[i]\u003c=a[j]로 왼쪽을 먼저 취해 동일 키의 상대 순서를 보존(안정성)한다. 보조 버퍼를 최상위에서 한 번만 할당해 매 재귀 호출의 malloc을 피한다. O(n log n) 시간, O(n) 공간.", "complexity": "O(n log n) time, O(n) space", "pitfalls": ["a[i]\u003ca[j]로 쓰면 불안정.", "병합 후 tmp→원본 되쓰기 누락.", "매 호출 malloc(느림) → 버퍼 재사용."], "anduril_context": "안정성·최악 O(n log n) 보장이 필요한 로그/텔레메트리 정렬, 외부(디스크) 정렬 기반."}, {"num": 5, "slug": "quicksort", "title_ko": "퀵 정렬 (Lomuto)", "title_en": "Quicksort (Lomuto)", "difficulty": "medium", "tags": ["sort", "in-place", "partition"], "prompt_ko": "Lomuto 파티션으로 a[0..n)를 in-place 정렬하라. 평균 O(n log n), 최악 O(n^2). median-of-3 피벗으로 이미 정렬된 입력의 최악을 완화한다.", "prompt_en": "In-place quicksort via Lomuto partition; median-of-3 pivot to soften worst case.", "signature": "void quicksort(int *a, size_t n)", "examples": [{"in": "{5,2,8,1}", "out": "{1,2,5,8}"}, {"in": "{2,2,2,2}", "out": "{2,2,2,2}"}], "hints": ["median-of-3: a[lo],a[mid],a[hi]의 중앙값을 피벗 자리로.", "Lomuto: a[lo..i)\u003cpivot 불변식 유지하며 스캔, 끝에 피벗 스왑.", "작은 쪽만 재귀 → 스택 O(log n)."], "solution": "static void swap_int(int *x,int *y){ int t=*x; *x=*y; *y=t; }\nstatic size_t lomuto_partition(int *a,size_t lo,size_t hi){\n    size_t mid=lo+(hi-lo)/2;\n    if(a[mid]\u003ca[lo]) swap_int(&a[mid],&a[lo]);\n    if(a[hi]\u003ca[lo])  swap_int(&a[hi],&a[lo]);\n    if(a[hi]\u003ca[mid]) swap_int(&a[hi],&a[mid]);\n    swap_int(&a[mid],&a[hi]);\n    int pivot=a[hi]; size_t i=lo;\n    for(size_t j=lo;j\u003chi;j++) if(a[j]\u003cpivot) swap_int(&a[i++],&a[j]);\n    swap_int(&a[i],&a[hi]);\n    return i;\n}\nstatic void quick_rec(int *a,size_t lo,size_t hi){\n    while(lo\u003chi){\n        size_t p=lomuto_partition(a,lo,hi);\n        if(p-lo\u003chi-p){ if(p>lo) quick_rec(a,lo,p-1); lo=p+1; }\n        else { if(hi>p) quick_rec(a,p+1,hi); if(p==0) break; hi=p-1; }\n    }\n}\nvoid quicksort(int *a, size_t n){\n    if(!a||n\u003c2)return;\n    quick_rec(a,0,n-1);\n}", "explanation_ko": "PATTERN: 분할정복 + Lomuto 파티션. 피벗보다 작은 값을 왼쪽으로 모아 피벗을 제자리에 놓고, 좌우를 재귀 정렬한다. median-of-3로 피벗을 골라 이미 정렬/역정렬 입력의 O(n^2)를 완화하고, 큰 쪽은 루프(꼬리재귀 제거), 작은 쪽만 재귀해 스택을 O(log n)로 제한한다. 평균 O(n log n), 최악 O(n^2), in-place, 불안정.", "complexity": "O(n log n) avg / O(n^2) worst, O(log n) stack", "pitfalls": ["끝-피벗 + 정렬입력 → O(n^2)(median-of-3로 완화).", "중복 많으면 Lomuto 불균형(3-way/Hoare 유리).", "p-1/hi-1 size_t 언더플로."], "anduril_context": "메모리 제약 MCU에서 추가 버퍼 없이(in-place) 배열 정렬이 필요할 때."}, {"num": 6, "slug": "quickselect_kth", "title_ko": "퀵셀렉트 (k번째)", "title_en": "Quickselect (k-th smallest)", "difficulty": "medium", "tags": ["selection", "partition", "order-statistic"], "prompt_ko": "배열을 부분 재배치해 k번째로 작은 값(0-index: k=0이 최소)을 평균 O(n)에 찾아라. 분할 후 k가 든 쪽만 재귀. k>=n이면 INT32_MIN.", "prompt_en": "Find k-th smallest (0-indexed) in average O(n) via partial partition; recurse only into the side containing k.", "signature": "int quickselect_kth(int *a, size_t n, size_t k)", "examples": [{"in": "{7,2,9,1,5,3}, k=2", "out": "3"}, {"in": "{7,2,9,1,5,3}, k=0", "out": "1"}], "hints": ["quicksort와 같은 partition을 재사용.", "피벗 위치 p==k면 즉시 답.", "k\u003cp면 왼쪽만, 아니면 오른쪽만 재귀 → 평균 O(n)."], "solution": "// swap_int / lomuto_partition 재사용 (문제 5 참고)\nint quickselect_kth(int *a, size_t n, size_t k){\n    if(!a||k>=n)return INT32_MIN;\n    size_t lo=0,hi=n-1;\n    while(lo\u003chi){\n        size_t p=lomuto_partition(a,lo,hi);\n        if(p==k)return a[p];\n        if(k\u003cp){ if(p==0) break; hi=p-1; }\n        else lo=p+1;\n    }\n    return a[k];\n}", "explanation_ko": "PATTERN: 부분 quicksort(선택). 매 분할은 피벗을 최종 위치 p에 놓는다. p==k면 답, k\u003cp면 왼쪽만, k>p면 오른쪽만 재귀/반복한다. 한쪽만 파고들므로 기대 비용은 n+n/2+n/4+... = O(n)이다. 전체 정렬(n log n)을 하지 않고 순서통계량 하나만 뽑는다. 최악은 O(n^2)(랜덤/median-of-3 피벗으로 완화). 배열은 재배치됨.", "complexity": "O(n) avg / O(n^2) worst, O(1) extra", "pitfalls": ["k>=n 방어, p==0 언더플로.", "최악 회피엔 랜덤/median-of-medians 피벗.", "원본 순서 필요하면 복사본에서 수행."], "anduril_context": "중앙값/백분위(예: 센서 샘플의 median 필터)를 전체 정렬 없이 O(n)에 계산."}, {"num": 7, "slug": "counting_sort", "title_ko": "계수 정렬", "title_en": "Counting sort", "difficulty": "easy", "tags": ["sort", "non-comparison", "histogram"], "prompt_ko": "값이 [0, max_val]인 정수 배열을 O(n+K)에 정렬하라. 히스토그램을 집계한 뒤 값 순서로 펼친다. max_val 음수/범위 밖 값은 방어한다.", "prompt_en": "Sort integers in [0, max_val] in O(n+K) by histogram counting, then expand in value order.", "signature": "void counting_sort(int *a, size_t n, int max_val)", "examples": [{"in": "{4,2,2,8,3,3,1}, max=8", "out": "{1,2,2,3,3,4,8}"}, {"in": "{0,5,0,5,0,3,3}, max=5", "out": "{0,0,0,3,3,5,5}"}], "hints": ["calloc(max_val+1)로 카운트 배열 0 초기화.", "cnt[a[i]]++ 로 히스토그램 집계.", "값 0..max_val 순서로 cnt[v]개씩 펼침."], "solution": "void counting_sort(int *a, size_t n, int max_val){\n    if(!a||n\u003c2||max_val\u003c0)return;\n    size_t K=(size_t)max_val+1;\n    size_t *cnt=calloc(K,sizeof *cnt);\n    if(!cnt)return;\n    for(size_t i=0;i\u003cn;i++){\n        if(a[i]\u003c0||a[i]>max_val){ free(cnt); return; }\n        cnt[a[i]]++;\n    }\n    size_t o=0;\n    for(size_t v=0;v\u003cK;v++)\n        for(size_t c=0;c\u003ccnt[v];c++) a[o++]=(int)v;\n    free(cnt);\n}", "explanation_ko": "PATTERN: 비교기반이 아닌 계수(히스토그램) 정렬. 각 값의 등장 횟수를 세어(cnt[v]) 값 오름차순으로 그만큼 펼치면 정렬이 끝난다. 비교를 하지 않으므로 비교정렬 하한 O(n log n)을 우회해 O(n+K)를 얻는다(K=값 범위). prefix-sum 변형을 쓰면 안정 정렬이 되고 radix sort의 한 자리 단계로 확장된다. 공간 O(K).", "complexity": "O(n+K) time, O(K) space", "pitfalls": ["K(값 범위)가 크면 메모리 폭발.", "음수/범위 밖 값 미방어 → OOB 쓰기.", "실수/임의 키엔 부적합(정수 인덱스 전제)."], "anduril_context": "센서/픽셀 값 히스토그램, ADC 버킷 카운트 등 값 범위가 작고 고정일 때 O(n) 정렬."}, {"num": 8, "slug": "nearest_match_two_arrays", "title_ko": "두 배열 최근접 매칭", "title_en": "Nearest match between two arrays", "difficulty": "medium", "tags": ["binary-search", "two-pointer", "scale-up", "anduril-reported"], "prompt_ko": "A의 각 원소마다 B에서 가장 가까운 값을 out_nearest[i]에 담고, 모든 |A[i]-nearest| 중 최댓값을 *out_max_dist로 반환하라(성공 0, NULL/m==0이면 -1). 동거리는 더 큰 값을 선택. (a) 브루트포스 O(n*m)를 먼저, 이어서 (b) B를 정렬하고 이진탐색으로 좌/우 후보만 비교하는 O((n+m)log m) 버전을 둘 다 구현하라. [Anduril 폰스크린 기출로 보고된 문제]", "prompt_en": "For each A[i] find the nearest value in B (out_nearest[i]) and return the max over-all distance (0 ok, -1 on NULL/m==0). Ties pick the larger value. Implement brute force O(n*m) AND the sort+binary-search follow-up O((n+m)log m).", "signature": "int nearest_brute(const int *a, size_t n, const int *b, size_t m, int *out_nearest, int *out_max_dist); int nearest_fast(const int *a, size_t n, const int *b, size_t m, int *out_nearest, int *out_max_dist)", "examples": [{"in": "A={3,10,22}, B={1,5,12,20}", "out": "nearest={5,12,20}, max_dist=2"}, {"in": "A={-100,1000}, B={0,50,100}", "out": "nearest={0,100}, max_dist=900"}], "hints": ["브루트포스: 각 A[i]마다 B 전체 스캔해 최소 거리 추적 O(n*m).", "팔로업: B 복사→정렬(O(m log m))→각 A[i]에 lower_bound 이진탐색.", "정렬된 B에서 최근접은 삽입점 바로 앞/뒤 후보 둘뿐. pos==m(우측 없음)·pos==0(좌측 없음) 처리.", "거리 |A[i]-B[j]|는 long으로 승격해 int 오버플로 방지."], "solution": "static long labs_l(long x){ return x\u003c0?-x:x; }\nint nearest_brute(const int *a,size_t n,const int *b,size_t m,\n                  int *out_nearest,int *out_max_dist){\n    if(!a||!b||!out_nearest||!out_max_dist||m==0)return -1;\n    long max_dist=0;\n    for(size_t i=0;i\u003cn;i++){\n        int best=b[0]; long bestd=labs_l((long)a[i]-b[0]);\n        for(size_t j=1;j\u003cm;j++){\n            long d=labs_l((long)a[i]-b[j]);\n            if(d\u003cbestd||(d==bestd&&b[j]>best)){ bestd=d; best=b[j]; }\n        }\n        out_nearest[i]=best;\n        if(bestd>max_dist) max_dist=bestd;\n    }\n    *out_max_dist=(int)max_dist; return 0;\n}\nstatic size_t lb_sorted(const int *s,size_t len,int x){\n    size_t lo=0,hi=len;\n    while(lo\u003chi){ size_t mid=lo+(hi-lo)/2; if(s[mid]\u003cx) lo=mid+1; else hi=mid; }\n    return lo;\n}\nint nearest_fast(const int *a,size_t n,const int *b,size_t m,\n                 int *out_nearest,int *out_max_dist){\n    if(!a||!b||!out_nearest||!out_max_dist||m==0)return -1;\n    int *sb=malloc(m*sizeof *sb);\n    if(!sb)return -1;\n    memcpy(sb,b,m*sizeof *sb);\n    quicksort(sb,m);                       // O(m log m)\n    long max_dist=0;\n    for(size_t i=0;i\u003cn;i++){\n        size_t pos=lb_sorted(sb,m,a[i]);   // O(log m)\n        int best; long bestd;\n        if(pos==m){ best=sb[m-1]; bestd=labs_l((long)a[i]-best); }\n        else {\n            best=sb[pos]; bestd=labs_l((long)a[i]-best);\n            if(pos>0){ long ld=labs_l((long)a[i]-sb[pos-1]);\n                if(ld\u003cbestd){ bestd=ld; best=sb[pos-1]; } }\n        }\n        out_nearest[i]=best;\n        if(bestd>max_dist) max_dist=bestd;\n    }\n    *out_max_dist=(int)max_dist; free(sb); return 0;\n}", "explanation_ko": "PATTERN: 브루트포스 → 정렬+이진탐색 스케일업. (a) 브루트포스는 각 A[i]마다 B를 전부 훑어 최소 거리를 찾는다 → O(n*m). (b) 팔로업은 B를 한 번 정렬(O(m log m))해두면, 정렬된 B에서 A[i]에 가장 가까운 값은 반드시 삽입점(lower_bound) 바로 앞/뒤 두 후보 중 하나다. 각 질의가 O(log m)이 되어 총 O((n+m) log m). n,m이 수천×수천으로 커지면 이 최적화가 결정적이고, B가 고정이면 정렬을 1회 전처리로 분리해 재사용한다. 동거리는 '더 큰 값'으로 타이브레이크를 고정해 두 구현 결과를 일치시킨다. 거리 계산은 long 승격으로 int 오버플로를 피한다.", "complexity": "brute O(n*m); fast O((n+m) log m), O(m) extra", "pitfalls": ["pos==m(모든 B\u003cA[i])·pos==0(좌측 후보 없음) 경계.", "동거리 타이브레이크 미고정 → 두 구현 불일치.", "|A[i]-B[j]| int 오버플로 → long 승격.", "원본 B를 정렬로 훼손 → 복사본에서 정렬."], "anduril_context": "센서 표적 매칭: 새로 검출된 표적 집합 A를 기존 트랙 집합 B에 최근접 연관(association). 표적/트랙이 많아지면 정렬+이진탐색으로 스케일업."}, {"num": 9, "slug": "insertion_sort", "title_ko": "삽입 정렬", "title_en": "Insertion sort", "difficulty": "easy", "tags": ["sort", "stable", "nearly-sorted"], "prompt_ko": "a[0..n)를 오름차순으로 안정 정렬하라. 각 key를 왼쪽 정렬구간의 올바른 자리에 삽입한다. 거의 정렬된/작은 n에서 최고.", "prompt_en": "Stable insertion sort; insert each key into the sorted left part. Best for nearly-sorted / small n.", "signature": "void insertion_sort(int *a, size_t n)", "examples": [{"in": "{5,2,8,1}", "out": "{1,2,5,8}"}, {"in": "{4,3,2,1}", "out": "{1,2,3,4}"}], "hints": ["a[0..i)는 항상 정렬 상태로 유지.", "key=a[i], j>0 && a[j-1]>key 동안 우측 시프트.", "> 조건(>= 아님)이라 안정 정렬."], "solution": "void insertion_sort(int *a, size_t n){\n    if(!a||n\u003c2)return;\n    for(size_t i=1;i\u003cn;i++){\n        int key=a[i]; size_t j=i;\n        while(j>0&&a[j-1]>key){ a[j]=a[j-1]; j--; }\n        a[j]=key;\n    }\n}", "explanation_ko": "PATTERN: 점진적 삽입. 왼쪽 부분배열 a[0..i)를 항상 정렬 상태로 두고, 새 key를 자기 자리까지 우측 시프트로 밀어 넣는다. 비교 조건을 a[j-1]>key(>이지 >=가 아님)로 두어 동일 키의 순서를 보존(안정). 거의 정렬된 입력은 시프트가 거의 없어 O(n)에 근접하고, 작은 n에선 상수가 작아 quicksort 재귀 바닥의 전환 정렬로 쓰인다. 최악 O(n^2), in-place.", "complexity": "O(n^2) worst / O(n) nearly-sorted, O(1) space", "pitfalls": [">= 로 쓰면 불안정.", "시프트 방향/경계(j>0) 실수.", "큰 n·무작위 입력엔 부적합(O(n^2))."], "anduril_context": "거의 정렬된 소량 데이터(예: 우선순위 소폭 갱신)나 하이브리드 정렬의 컷오프 단계."}]}]}</script>
<script>
"use strict";
/* ================= data ================= */
const DATA = JSON.parse(document.getElementById('bank-data').textContent);
const TOPICS = (DATA.topics||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0));
const ROLES = DATA.roles||{}; const INT = DATA.interview||{}; const PROF = DATA.profile||{}; const COMP = DATA.companies||{};

/* ================= state ================= */
const LS = {
  solved:'anduril_fw_solved_v1', theme:'anduril_fw_theme', open:'anduril_fw_open_v1'
};
let solved = new Set(JSON.parse(localStorage.getItem(LS.solved)||'[]'));
let openCards = new Set(JSON.parse(localStorage.getItem(LS.open)||'[]'));
let view = 'overview';       // 'overview' | 'roles' | 'interview' | 'drill' | 'mock' | 'profile' | topicId
let diffFilter = 'all';
let unsolvedOnly = false;
let query = '';
let mockTimer=null, mockRemaining=45*60, mockRunning=false, mockSetIdx=0;
const pkey = (tid,num)=> tid+'#'+num;
function saveSolved(){ localStorage.setItem(LS.solved, JSON.stringify([...solved])); }
function saveOpen(){ localStorage.setItem(LS.open, JSON.stringify([...openCards])); }

/* ================= helpers ================= */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }

/* --- C syntax highlight (operates on raw source) --- */
const C_KW = new Set(['if','else','for','while','do','switch','case','default','break','continue','return','goto','sizeof','typedef','struct','union','enum','static','const','volatile','extern','register','inline','restrict','_Atomic','_Bool','_Static_assert']);
const C_TY = new Set(['int','char','short','long','float','double','void','unsigned','signed','bool','size_t','ssize_t','ptrdiff_t','intptr_t','uintptr_t','uint8_t','uint16_t','uint32_t','uint64_t','int8_t','int16_t','int32_t','int64_t','FILE','va_list']);
function hlC(code){
  let s = esc(code);
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(&quot;(?:[^&\\]|\\.|&(?!quot;))*?&quot;)|('(?:\\.|[^'])*')|(^[ \t]*#[^\n]*)|(\b0[xX][0-9a-fA-F]+[uUlL]*\b|\b\d+\.?\d*[uUlLfF]*\b)|([A-Za-z_]\w*)/gm;
  return s.replace(re,(m,cmt,str,chr,pre,num,word)=>{
    if(cmt) return '<span class="c-cmt">'+cmt+'</span>';
    if(str) return '<span class="c-str">'+str+'</span>';
    if(chr) return '<span class="c-str">'+chr+'</span>';
    if(pre) return '<span class="c-pre">'+pre+'</span>';
    if(num) return '<span class="c-num">'+num+'</span>';
    if(word){ if(C_KW.has(word)) return '<span class="c-kw">'+word+'</span>';
              if(C_TY.has(word)) return '<span class="c-ty">'+word+'</span>'; return word; }
    return m;
  });
}

/* --- minimal markdown (headings, code fences, tables, lists, quotes, inline) --- */
function mdInline(t){
  return t
    .replace(/`([^`]+)`/g,(m,c)=>'<code>'+c+'</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src){
  if(!src) return '';
  const lines = src.replace(/\r/g,'').split('\n');
  let out=[], i=0, para=[], listType=null, tbl=[];
  const flushP=()=>{ if(para.length){ out.push('<p>'+mdInline(esc(para.join(' ')))+'</p>'); para=[]; } };
  const flushL=()=>{ if(listType){ out.push('</'+listType+'>'); listType=null; } };
  const flushT=()=>{
    if(!tbl.length) return;
    const rows = tbl.filter(r=>!/^\s*\|?[\s:|-]+\|?\s*$/.test(r));
    const cells = r => r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim());
    let h='<table>';
    if(rows.length){ h+='<thead><tr>'+cells(rows[0]).map(c=>'<th>'+mdInline(esc(c))+'</th>').join('')+'</tr></thead>'; }
    h+='<tbody>';
    for(let k=1;k<rows.length;k++){ h+='<tr>'+cells(rows[k]).map(c=>'<td>'+mdInline(esc(c))+'</td>').join('')+'</tr>'; }
    h+='</tbody></table>'; out.push(h); tbl=[];
  };
  while(i<lines.length){
    let ln = lines[i];
    // fenced code
    const fence = ln.match(/^```(\w*)/);
    if(fence){ flushP(); flushL(); flushT();
      const lang=fence[1]; let buf=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])){ buf.push(lines[i]); i++; }
      i++; const raw=buf.join('\n');
      const body = (lang===''||/^c(pp|xx)?$/i.test(lang)) ? hlC(raw) : esc(raw);
      out.push('<pre class="code"><code>'+body+'</code></pre>'); continue;
    }
    if(/^\s*\|.*\|/.test(ln)){ flushP(); flushL(); tbl.push(ln); i++; continue; } else if(tbl.length) flushT();
    if(/^\s*$/.test(ln)){ flushP(); flushL(); i++; continue; }
    let m;
    if(m=ln.match(/^(#{1,6})\s+(.*)$/)){ flushP(); flushL(); const lv=m[1].length; out.push('<h'+lv+'>'+mdInline(esc(m[2]))+'</h'+lv+'>'); i++; continue; }
    if(/^\s*([-*_])\1{2,}\s*$/.test(ln)){ flushP(); flushL(); out.push('<hr>'); i++; continue; }
    if(m=ln.match(/^\s*>\s?(.*)$/)){ flushP(); flushL(); out.push('<blockquote>'+mdInline(esc(m[1]))+'</blockquote>'); i++; continue; }
    if(m=ln.match(/^\s*[-*+]\s+(.*)$/)){ flushP(); if(listType!=='ul'){ flushL(); out.push('<ul>'); listType='ul'; } out.push('<li>'+mdInline(esc(m[1]))+'</li>'); i++; continue; }
    if(m=ln.match(/^\s*\d+\.\s+(.*)$/)){ flushP(); if(listType!=='ol'){ flushL(); out.push('<ol>'); listType='ol'; } out.push('<li>'+mdInline(esc(m[1]))+'</li>'); i++; continue; }
    para.push(ln.trim()); i++;
  }
  flushP(); flushL(); flushT();
  return out.join('\n');
}

/* ================= progress ================= */
function topicSolved(t){ return t.problems.reduce((n,p)=> n + (solved.has(pkey(t.id,p.num))?1:0), 0); }
function allProblems(){ let a=[]; for(const t of TOPICS) for(const p of t.problems) a.push({t,p}); return a; }
function updateProgress(){
  const all=allProblems(); const tot=all.length; const sv=all.filter(x=>solved.has(pkey(x.t.id,x.p.num))).length;
  const pct = tot? Math.round(sv*100/tot):0;
  document.getElementById('ovSolved').textContent=sv;
  document.getElementById('ovTotal').textContent=tot;
  document.getElementById('mPct').textContent=pct;
  document.getElementById('mTotal').textContent=tot;
  document.getElementById('mEasy').textContent=all.filter(x=>x.p.difficulty==='easy').length;
  document.getElementById('mMed').textContent=all.filter(x=>x.p.difficulty==='medium').length;
  document.getElementById('mHard').textContent=all.filter(x=>x.p.difficulty==='hard').length;
  const C=131.9; document.getElementById('ovRing').style.strokeDashoffset = C*(1-pct/100);
  // rail bars
  document.querySelectorAll('.nav-item[data-topic]').forEach(n=>{
    const t=TOPICS.find(x=>x.id===n.dataset.topic); const s=topicSolved(t); const tt=t.problems.length;
    n.querySelector('.nav-count').innerHTML='<b>'+s+'</b>/'+tt;
    n.querySelector('.nav-bar > i').style.width=(tt?s*100/tt:0)+'%';
  });
}

/* ================= problem card ================= */
function difficultyRank(d){ return d==='easy'?0:d==='medium'?1:2; }
function card(t,p){
  const id=pkey(t.id,p.num); const isSolved=solved.has(id); const isOpen=openCards.has(id);
  const c=el('<div class="card'+(isSolved?' solved':'')+(isOpen?' open':'')+'"></div>');
  const tags=(p.tags||[]).slice(0,4).map(x=>'<span class="tag">'+esc(x)+'</span>').join('');
  const head=el('<div class="chead">'
    +'<span class="pnum">'+esc(t.icon)+' '+(p.num<10?('0'+p.num):p.num)+'</span>'
    +'<span class="diff '+esc(p.difficulty)+'">'+esc(p.difficulty)+'</span>'
    +'<span class="ctitles"><div class="ctitle">'+esc(p.title_ko)+'</div>'
      +'<div class="csub">'+esc(p.title_en)+(p.slug?(' · '+esc(p.slug)):'')+'</div></span>'
    +'<span class="ctags">'+tags+'</span>'
    +'<button class="solvebox" title="mark solved" aria-label="mark solved">'
      +'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>'
    +'<svg class="cchevron" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6" stroke-linecap="round"/></svg>'
    +'</div>');
  // solve toggle
  head.querySelector('.solvebox').addEventListener('click',(e)=>{
    e.stopPropagation();
    if(solved.has(id)) solved.delete(id); else solved.add(id);
    saveSolved(); c.classList.toggle('solved', solved.has(id)); updateProgress();
  });
  // expand toggle
  head.addEventListener('click',()=>{
    c.classList.toggle('open');
    if(c.classList.contains('open')) openCards.add(id); else openCards.delete(id);
    saveOpen();
    if(c.classList.contains('open') && !c.dataset.built){ c.appendChild(body()); c.dataset.built='1'; }
  });
  c.appendChild(head);
  function body(){
    const b=el('<div class="cbody"></div>');
    // prompt
    b.appendChild(el('<div class="sec"><span class="eyebrow lbl">Problem</span>'
      +'<div class="prompt-ko">'+esc(p.prompt_ko)+'</div>'
      +(p.prompt_en?'<div class="prompt-en">'+esc(p.prompt_en)+'</div>':'')+'</div>'));
    if(p.signature) b.appendChild(el('<div class="sec"><span class="eyebrow lbl">Signature</span><div class="sig">'+esc(p.signature)+'</div></div>'));
    if(p.examples&&p.examples.length){
      let rows=p.examples.map(e=>'<tr><td>'+esc(e.in)+'</td><td>'+esc(e.out)+'</td></tr>').join('');
      b.appendChild(el('<div class="sec"><span class="eyebrow lbl">Examples</span>'
        +'<table class="ex"><thead><tr><th>input</th><th>output</th></tr></thead><tbody>'+rows+'</tbody></table></div>'));
    }
    if(p.hints&&p.hints.length){
      const hs=el('<div class="sec"><span class="eyebrow lbl">Hints</span><div class="hints"></div></div>');
      const wrap=hs.querySelector('.hints');
      p.hints.forEach((h,idx)=>{
        const hi=el('<div class="hint"><button class="hb">hint '+(idx+1)+'</button><span class="ht">'+esc(h)+'</span></div>');
        hi.querySelector('.hb').addEventListener('click',()=>hi.classList.add('rev'));
        wrap.appendChild(hi);
      });
      b.appendChild(hs);
    }
    // solution
    const sol=el('<div class="sec"><span class="eyebrow lbl">Solution</span>'
      +'<button class="reveal-sol">▶ 정답 코드 보기 (reveal solution)</button>'
      +'<div class="solwrap"></div></div>');
    const sw=sol.querySelector('.solwrap');
    sol.querySelector('.reveal-sol').addEventListener('click',(e)=>{
      const shown=sw.classList.toggle('show'); e.target.textContent = shown?'▼ 정답 코드 숨기기 (hide)':'▶ 정답 코드 보기 (reveal solution)';
      if(shown && !sw.dataset.built){
        const box=el('<div class="codebox"><div class="codebar"><span class="fn">'+esc(p.slug||('problem_'+p.num))+'.c</span>'
          +'<button class="copybtn">copy</button></div><pre class="code"><code>'+hlC(p.solution||'')+'</code></pre></div>');
        box.querySelector('.copybtn').addEventListener('click',()=>{
          navigator.clipboard.writeText(p.solution||'').then(()=>{ const b2=box.querySelector('.copybtn'); b2.textContent='copied ✓'; setTimeout(()=>b2.textContent='copy',1400); });
        });
        sw.appendChild(box);
        if(p.explanation_ko) sw.appendChild(el('<div class="sec"><span class="eyebrow lbl">해설 · Explanation</span><div class="prompt-ko">'+esc(p.explanation_ko)+'</div></div>'));
        if(p.complexity) sw.appendChild(el('<div class="sec"><span class="eyebrow lbl">Complexity</span><div class="complexity">'+esc(p.complexity)+'</div></div>'));
        sw.dataset.built='1';
      }
    });
    b.appendChild(sol);
    if(p.pitfalls&&p.pitfalls.length){
      b.appendChild(el('<div class="sec"><span class="eyebrow lbl">함정 · Pitfalls</span><ul class="pit">'
        +p.pitfalls.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>'));
    }
    if(p.anduril_context){
      b.appendChild(el('<div class="sec"><div class="callout"><span class="eyebrow lbl">Anduril context</span>'+esc(p.anduril_context)+'</div></div>'));
    }
    return b;
  }
  if(isOpen){ c.appendChild(body()); c.dataset.built='1'; }
  return c;
}

/* ---- timed mock (45-min phone-screen simulation) ---- */
function fmtTime(s){ const m=Math.floor(s/60), ss=s%60; return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }
function stopMockInterval(){ if(mockTimer){ clearInterval(mockTimer); mockTimer=null; } }
function updateTimerUI(){
  const clk=document.getElementById('mockClock'); if(!clk) return;
  clk.textContent=fmtTime(mockRemaining);
  clk.classList.toggle('warn', mockRemaining<=300 && mockRemaining>0);
  clk.classList.toggle('over', mockRemaining===0);
  const st=document.getElementById('mockState');
  if(st) st.textContent = mockRemaining===0 ? 'TIME UP' : (mockRunning ? 'RUNNING' : 'PAUSED');
}
function tickMock(){ if(mockRemaining>0) mockRemaining--; if(mockRemaining===0){ stopMockInterval(); mockRunning=false; } updateTimerUI(); }
function startMock(){ if(mockRunning || mockRemaining===0) return; mockRunning=true; stopMockInterval(); mockTimer=setInterval(tickMock,1000); updateTimerUI(); }
function pauseMock(){ if(!mockRunning && !mockTimer) return; mockRunning=false; stopMockInterval(); updateTimerUI(); }
function resetMock(){ pauseMock(); mockRemaining=45*60; updateTimerUI(); }
function resolveRef(ref){ const t=TOPICS.find(x=>x.id===ref.topic); if(!t) return null; const p=t.problems.find(pp=>pp.num===ref.num); return p?{t,p}:null; }

function renderDrill(){
  const c=document.getElementById('content'); c.innerHTML='';
  const guide = `# ⚡ 기계적 연습 가이드 (How to Drill)

문제 은행은 **stub → 직접 구현 → 컴파일 → PASS/FAIL 확인**의 반복 루프로 설계돼 있다. 손이 기억할 때까지 반복하는 것이 목표다.

## 파일 구조
- \`problems/NN_topic.c\` — **연습용 stub.** 함수 시그니처 + \`// TODO\` + 테스트 하네스. 여기에 직접 구현한다.
- \`solutions/NN_topic.c\` — **정답.** 막히면 참고. 모든 테스트 PASS.
- \`notes/NN_topic.md\` — 스터디 노트(이 대시보드의 Study note와 동일).
- \`data/*.json\` — 이 대시보드가 읽는 데이터.

## 하루 루틴 (권장)
1. 대시보드에서 오늘의 토픽을 열고 **개념 치트시트 + 노트**를 5분 훑는다.
2. 터미널에서 stub을 연다: \`problems/NN_topic.c\`
3. 함수를 위에서부터 직접 구현. **정답을 먼저 보지 말 것.**
4. 컴파일 + 실행:
   \`\`\`sh
   make prob N=01_bit_basics     # 내 연습 파일 실행 → FAIL이 PASS로 바뀌는지 확인
   \`\`\`
5. 3분 막히면 대시보드에서 **hint 1 → 2 → 3** 순서로만 연다.
6. 그래도 막히면 **정답 코드 보기**. 이해한 뒤 stub을 지우고 **다시 맨손으로** 구현.
7. 다 풀면 카드의 체크박스로 **solved** 표시 → 진행률이 저장된다(localStorage).

## 명령어
\`\`\`sh
make list                    # 토픽 목록
make prob N=05_circular_buffer   # 연습 파일 컴파일+실행
make sol  N=05_circular_buffer   # 정답 컴파일+실행 (전부 PASS 확인)
make test                    # 모든 정답 회귀 테스트
make clean
\`\`\`

## 우선순위 (Anduril 펌웨어 면접 가중치)
1. **원형 버퍼 (05)** — ISR↔main SPSC. 거의 항상 나옴. 가장 먼저 완벽히.
2. **비트 조작 (01·02)** — 레지스터 드라이버의 기본기. 손이 기억해야 함.
3. **FSM (07)** — UART/프로토콜 파서. \`switch\` + \`enum\` 패턴.
4. **RTOS/임베디드 개념 (09)** — volatile, ISR 안전성, priority inversion, watchdog.
5. **메모리/포인터 (04)** — const/volatile/정렬/정적 풀. 개념 질문 대비.
6. **데이터 처리 (08)** — 체크섬/CRC/고정소수점. 텔레메트리·제어.
7. **문자열·연결리스트 (03·06)** — LC 기본. atoi/파싱/포인터 조작.
8. **시그니처 (10)** — 실전 재현 + 드론 응용으로 마무리 점검.

> **핵심:** Anduril은 "임베디드만" 또는 "LeetCode만" 준비한 후보를 코딩 라운드에서 탈락시킨다. **둘 다** 손에 익혀야 한다. 이 은행은 그 교집합(임베디드 + DS&A)에 맞춰져 있다.`;
  c.appendChild(el('<div class="view-head"><span class="eyebrow">Briefing · 03</span><h1>⚡ 연습 가이드</h1><div class="en">How to Drill — mechanical practice loop</div></div>'));
  c.appendChild(el('<div class="note">'+md(guide)+'</div>'));
  c.appendChild(foot());
}

/* ================= router ================= */
function render(){
  if(view!=='mock') pauseMock();   // stop the countdown when navigating away
  markActiveNav();
  if(query){ renderSearch(); return; }
  if(view==='mock') return renderMock();
  if(view==='companies') return renderCompanies();
  if(view==='profile') return renderProfile();
  if(view==='overview') return renderOverview();
  if(view==='roles') return renderRoles();
  if(view==='interview') return renderInterview();
  if(view==='drill') return renderDrill();
  const t=TOPICS.find(x=>x.id===view);
  if(t) return renderTopic(t);
  renderOverview();
}
function setView(v){ view=v; window.scrollTo(0,0); document.querySelector('.content').scrollTop=0; render(); }

}

/* ================= search ================= */
const searchEl=document.getElementById('search');
searchEl.addEventListener('input',()=>{ query=searchEl.value.trim(); render(); });
document.addEventListener('keydown',(e)=>{
  if(e.key==='/' && document.activeElement!==searchEl){ e.preventDefault(); searchEl.focus(); }
  if(e.key==='Escape' && document.activeElement===searchEl){ searchEl.value=''; query=''; searchEl.blur(); render(); }
});

applyTheme(localStorage.getItem(LS.theme) || (window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
buildRail();
updateProgress();
render();
