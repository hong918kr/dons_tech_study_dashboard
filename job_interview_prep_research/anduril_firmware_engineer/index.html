tonic-decreasing stack, O(n).", "signature": "void daily_temperatures(const int *t, int n, int *out);", "examples": [{"in": "[73 74 75 71 69 72 76 73]", "out": "[1 1 4 2 1 1 0 0]"}, {"in": "[30 40 50 60]", "out": "[1 1 1 0]"}], "hints": ["next_greater 와 거의 동일, 단 답이 '값'이 아니라 '날짜 차'.", "pop 할 때 out[j] = i - j.", "out 을 0 으로 초기화(끝까지 안 따뜻해지면 0)."], "solution": "void daily_temperatures(const int *t, int n, int *out) {\n    for (int i = 0; i \u003c n; ++i) out[i] = 0;\n    istk_t st; istk_init(&st, n);\n    for (int i = 0; i \u003c n; ++i) {\n        while (!istk_empty(&st) && t[istk_peek(&st)] \u003c t[i]) {\n            int j = istk_pop(&st);\n            out[j] = i - j;                    // day gap is the answer\n        }\n        istk_push(&st, i);\n    }\n    istk_free(&st);\n}", "explanation_ko": "PATTERN: 단조 스택(감소). next_greater 의 변형으로, pop 되는 인덱스 j 의 답을 i-j(날짜 차)로 기록한다. 인덱스를 저장해야 거리를 계산할 수 있다. 각 원소 1회 push/pop → O(n).", "complexity": "O(n) time, O(n) space", "pitfalls": ["값을 저장해 날짜 차를 못 구함", "out 초기값 0 누락", "동일 온도 처리(\u003c vs \u003c=) 혼동 → '더 따뜻'은 엄격히 큰 값(\u003c)"], "anduril_context": "센서 임계 초과 상태가 언제 해소되는지(다음 상승)를 실시간 추적, 레이트 모니터링."}, {"num": 5, "slug": "eval_rpn", "title_ko": "후위 표기식 평가 (RPN)", "title_en": "Evaluate Reverse Polish Notation", "difficulty": "medium", "tags": ["stack", "parsing", "arithmetic"], "prompt_ko": "후위(역폴란드) 표기 토큰을 평가한다. 피연산자는 push, 연산자는 두 개 pop 해 계산 후 push. 뺄셈/나눗셈은 b 가 먼저 pop.", "prompt_en": "Evaluate Reverse Polish Notation tokens. Push operands; on an operator pop two, compute, push back. For - and / the second pop is the left operand.", "signature": "int eval_rpn(const char **tok, int n);", "examples": [{"in": "[\"2\",\"1\",\"+\",\"3\",\"*\"]", "out": "9"}, {"in": "[\"4\",\"13\",\"5\",\"/\",\"+\"]", "out": "6"}], "hints": ["숫자 토큰은 atoi 로 push.", "연산자는 b=pop; a=pop; push(a op b) — 순서 주의.", "음수 \"-11\" 을 연산자로 오인하지 않게: 길이 1 이고 +-*/ 일 때만 연산자."], "solution": "int eval_rpn(const char **tok, int n) {\n    istk_t st; istk_init(&st, n > 0 ? n : 1);\n    for (int i = 0; i \u003c n; ++i) {\n        const char *t = tok[i];\n        if (t[1] == '\\0' && (t[0]=='+'||t[0]=='-'||t[0]=='*'||t[0]=='/')) {\n            int b = istk_pop(&st);             // pop b first!\n            int a = istk_pop(&st);\n            int r = 0;\n            switch (t[0]) {\n                case '+': r = a + b; break;\n                case '-': r = a - b; break;\n                case '*': r = a * b; break;\n                case '/': r = a / b; break;\n            }\n            istk_push(&st, r);\n        } else {\n            istk_push(&st, atoi(t));           // negatives like \"-11\"\n        }\n    }\n    int res = istk_empty(&st) ? 0 : istk_pop(&st);\n    istk_free(&st);\n    return res;\n}", "explanation_ko": "PATTERN: 스택 기반 표현식 평가. 피연산자를 쌓고 연산자에서 두 개를 꺼내 계산해 다시 쌓는다. 핵심은 피연산자 순서: b 를 먼저 pop 해야 a-b, a/b 가 맞다. 음수 토큰 구별을 위해 '길이 1 이고 연산자 문자'일 때만 연산자로 취급. O(n) 시간.", "complexity": "O(n) time, O(n) space", "pitfalls": ["피연산자 순서 바꿈 → -,/ 에서 부호/값 오류", "음수 \"-11\" 을 연산자로 오인", "0 나눗셈/오버플로 미검사 (방어적 코딩 시)"], "anduril_context": "설정/수식 문법, 텔레메트리 변환식, 계산기형 명령 인터프리터의 핵심 평가 루프."}, {"num": 6, "slug": "queue_via_two_stacks", "title_ko": "스택 두 개로 큐", "title_en": "Queue via two stacks", "difficulty": "medium", "tags": ["stack", "queue", "design", "amortized"], "prompt_ko": "스택 두 개(in/out)로 FIFO 큐를 구현한다. enqueue 는 in 으로, dequeue/peek 는 out 이 비었을 때만 in 을 통째 뒤집어 옮긴다. 분할상환 O(1).", "prompt_en": "Implement a FIFO queue with two stacks (in/out). enqueue pushes to in; dequeue/peek refill out from in only when out is empty. Amortized O(1).", "signature": "void q2_enqueue(Queue2*, int); int q2_dequeue(Queue2*); int q2_peek(Queue2*); bool q2_empty(const Queue2*);", "examples": [{"in": "enqueue 1,2; peek; dequeue", "out": "1, 1"}, {"in": "enqueue 3; dequeue; dequeue", "out": "2, 3"}], "hints": ["enqueue: 무조건 in 에 push.", "shift: out 이 비었을 때만 in 을 전부 out 으로 옮긴다.", "dequeue/peek 은 shift 후 out 에서 pop 또는 peek."], "solution": "typedef struct { istk_t in; istk_t out; } Queue2;\n\nvoid q2_init(Queue2 *q, int cap) { istk_init(&q->in, cap); istk_init(&q->out, cap); }\nvoid q2_free(Queue2 *q)          { istk_free(&q->in); istk_free(&q->out); }\nvoid q2_enqueue(Queue2 *q, int x){ istk_push(&q->in, x); }\nstatic void q2_shift(Queue2 *q)  {                 // flip only when out is empty\n    if (istk_empty(&q->out))\n        while (!istk_empty(&q->in)) istk_push(&q->out, istk_pop(&q->in));\n}\nint  q2_dequeue(Queue2 *q)       { q2_shift(q); return istk_pop(&q->out); }\nint  q2_peek(Queue2 *q)          { q2_shift(q); return istk_peek(&q->out); }\nbool q2_empty(const Queue2 *q)   { return istk_empty(&q->in) && istk_empty(&q->out); }", "explanation_ko": "PATTERN: 분할상환(amortized) 두 스택 큐. in 에 쌓은 것을 out 으로 뒤집으면 순서가 FIFO 로 복원된다. 각 원소는 in→out 으로 최대 한 번만 이동 → n 번 연산 총 이동 O(n) → 평균 O(1). out 이 비었을 때만 옮기는 게 핵심.", "complexity": "amortized O(1) per op, O(n) space", "pitfalls": ["out 이 안 비었는데 옮김 → 순서 깨짐", "매 dequeue 마다 전체 옮김 → 불필요 O(n)", "빈 큐에서 dequeue 경계 미처리"], "anduril_context": "스택 프리미티브만으로 큐를 구현, 두 버퍼 사이 순서 보존 이동(수집→처리)."}, {"num": 7, "slug": "sliding_window_max", "title_ko": "슬라이딩 윈도우 최댓값 (단조 덱)", "title_en": "Sliding window maximum", "difficulty": "hard", "tags": ["monotonic-deque", "sliding-window", "array"], "prompt_ko": "크기 k 의 모든 윈도우에 대해 최댓값을 낸다. 인덱스 단조 감소 덱을 유지해 앞(head)이 항상 창의 최댓값이 되게 한다. 결과 길이 n-k+1. O(n).", "prompt_en": "Return the maximum of every size-k window. Keep an index-based monotonic-decreasing deque so the front is always the window max. Output length n-k+1. O(n).", "signature": "void sliding_window_max(const int *a, int n, int k, int *out);", "examples": [{"in": "[1 3 -1 -3 5 3 6 7], k=3", "out": "[3 3 5 5 6 7]"}, {"in": "[1 2 3 4], k=4", "out": "[4]"}], "hints": ["값이 아니라 인덱스를 덱에 저장.", "(1) 앞: dq[head] \u003c= i-k 면 만료, head++ (if 이면 충분).", "(2) 뒤: a[dq[tail-1]] \u003c= a[i] 인 동안 tail-- (while). (3) push, (4) i>=k-1 때 out."], "solution": "void sliding_window_max(const int *a, int n, int k, int *out) {\n    if (n == 0 || k \u003c= 0) return;\n    int *dq = malloc(sizeof(int) * (size_t)n);     // deque of indices, [head, tail)\n    int head = 0, tail = 0, oi = 0;\n    for (int i = 0; i \u003c n; ++i) {\n        if (head \u003c tail && dq[head] \u003c= i - k) head++;            // drop expired front\n        while (head \u003c tail && a[dq[tail-1]] \u003c= a[i]) tail--;     // drop smaller back\n        dq[tail++] = i;\n        if (i >= k - 1) out[oi++] = a[dq[head]];                 // window max = front\n    }\n    free(dq);\n}", "explanation_ko": "PATTERN: 단조 덱(감소) 슬라이딩 윈도우. 덱을 값 기준 단조 감소로 유지하면 head 가 항상 창의 최댓값. 앞은 만료(창 밖 인덱스)로, 뒤는 더 큰 값이 들어오면 제거한다. 각 인덱스 1회 push/pop → O(n), 힙 기반 O(n log k) 보다 빠르고 결정론적.", "complexity": "O(n) time, O(k) space", "pitfalls": ["값 저장 → 만료 조건(dq[head]\u003c=i-k) 불가", "앞 제거를 while 로 과도하게(한 스텝 최대 하나만 만료)", "i>=k-1 전에 기록해 결과 길이 오류"], "anduril_context": "고정 지연 최댓값 필터(피크 홀드), 레이다/오디오 윈도우 피크 검출을 실시간 O(n) 으로."}, {"num": 8, "slug": "decode_string", "title_ko": "중첩 문자열 디코딩", "title_en": "Decode string", "difficulty": "medium", "tags": ["stack", "parsing", "nested", "string"], "prompt_ko": "k[...] 형식의 중첩 인코딩을 해제한다. 예: \"3[a2[c]]\" -> \"accaccacc\". 숫자 스택과 문자열(빌더) 스택을 써 '['에서 상태 저장, ']'에서 k회 반복해 합친다. 반환은 malloc(호출자 free).", "prompt_en": "Decode nested k[...] encodings, e.g. \"3[a2[c]]\" -> \"accaccacc\". Use a count stack and a string-builder stack: save state at '[', repeat k times and merge at ']'. Return malloc'd string (caller frees).", "signature": "char *decode_string(const char *s);", "examples": [{"in": "\"3[a]2[bc]\"", "out": "\"aaabcbc\""}, {"in": "\"3[a2[c]]\"", "out": "\"accaccacc\""}], "hints": ["숫자는 num = num*10 + d (여러 자리).", "'[': nums.push(num), num=0; strs.push(cur); cur=\"\" (안쪽 새로).", "']': k=nums.pop(); prev=strs.pop(); prev += cur*k; cur=prev."], "solution": "typedef struct { char *buf; int len; int cap; } sb_t;\nstatic void sb_init(sb_t *b)         { b->cap=16; b->len=0; b->buf=malloc(16); b->buf[0]='\\0'; }\nstatic void sb_putc(sb_t *b, char c) { if (b->len+1>=b->cap){ b->cap*=2; b->buf=realloc(b->buf,(size_t)b->cap);} b->buf[b->len++]=c; b->buf[b->len]='\\0'; }\nstatic void sb_puts(sb_t *b, const char *s) { while (*s) sb_putc(b, *s++); }\n\nchar *decode_string(const char *s) {\n    int n = (int)strlen(s);\n    istk_t nums; istk_init(&nums, n + 1);              // repeat-count stack\n    sb_t *strs = malloc(sizeof(sb_t) * (size_t)(n+1)); // outer-string stack\n    int sp = 0;\n    sb_t cur; sb_init(&cur);\n    int num = 0;\n    for (const char *p = s; *p; ++p) {\n        char c = *p;\n        if (isdigit((unsigned char)c)) {\n            num = num * 10 + (c - '0');                // multi-digit\n        } else if (c == '[') {\n            istk_push(&nums, num); num = 0;\n            strs[sp++] = cur; sb_init(&cur);           // save state, start inner\n        } else if (c == ']') {\n            int k = istk_pop(&nums);\n            sb_t prev = strs[--sp];\n            for (int i = 0; i \u003c k; ++i) sb_puts(&prev, cur.buf);  // repeat k times\n            free(cur.buf);\n            cur = prev;\n        } else {\n            sb_putc(&cur, c);\n        }\n    }\n    istk_free(&nums); free(strs);\n    return cur.buf;   // caller frees\n}", "explanation_ko": "PATTERN: 스택 기반 중첩 파싱. 숫자 스택과 문자열 스택을 써 '['에서 (반복횟수, 바깥 문자열)을 저장하고, ']'에서 꺼내 안쪽 문자열을 k회 이어붙인다. 재귀(호출 스택)로도 가능하지만 명시 스택이 깊이를 스스로 통제해 임베디드에 안전. 복잡도는 출력 길이에 비례.", "complexity": "O(output length) time & space", "pitfalls": ["여러 자리 수 \"10[a]\" 미처리", "반환 버퍼/중첩 임시 버퍼 free 누락 → 누수", "재귀 사용 시 깊은 입력으로 스택 오버플로"], "anduril_context": "압축된 설정/패턴 문자열 전개, 명령 템플릿(반복 블록) 확장의 기초 파서."}]}, {"id": "13_trees_bst", "order": 13, "range": "Trees/BST", "icon": "🌳", "track": "dsa", "title_en": "Trees & BST", "title_ko": "트리 & 이진탐색트리", "summary_ko": "이진트리 순회(전/중/후위)와 그 반복화(명시적 스택/큐), 레벨오더 BFS, 깊이/균형/뒤집기, 그리고 BST 불변식(삽입·탐색·유효성·LCA)까지. 순회 시점과 경계 전파가 핵심.", "summary_en": "Binary-tree traversals (pre/in/post) and their iterative forms (explicit stack/queue), level-order BFS, depth/balance/invert, and BST invariants (insert, search, validate, LCA). Record-timing and bounds-propagation are the core ideas.", "anduril_relevance_ko": "트리는 명령/표현식 파싱 구조와 config AST 로, BST 는 정렬된 룩업 테이블/인덱스로, BFS 는 상태/그래프 계층 탐색으로 임베디드에 그대로 이어진다. 특히 MCU/ISR 콜스택이 얕아 깊은 재귀가 위험하므로 '재귀 순회를 명시적 스택으로 반복화하기'가 실전 질문이다.", "concepts": [{"term": "traversal record-timing", "ko": "pre/in/post 는 값 기록 시점만 다름", "en": "pre/in/post differ only in when the node value is recorded"}, {"term": "explicit stack DFS", "ko": "재귀 없이 노드 포인터 스택으로 순회", "en": "iterate with a node-pointer stack instead of recursion"}, {"term": "BFS array FIFO queue", "ko": "head/tail 인덱스 전진, 용량=노드수 래핑 불필요", "en": "advance head/tail; capacity = node count so no wraparound"}, {"term": "balance via -1 early-return", "ko": "높이 반환하되 불균형이면 -1 조기 전파 -> O(n)", "en": "return height but propagate -1 on imbalance for O(n)"}, {"term": "BST invariant", "ko": "왼 서브트리 전체 \u003c 노드 \u003c 오 서브트리 전체", "en": "entire left subtree \u003c node \u003c entire right subtree"}, {"term": "validate by bounds", "ko": "국소 비교 불충분 -> (lo,hi) 경계 좁히기", "en": "local check is not enough; narrow (lo,hi) bounds down"}, {"term": "LCA on BST", "ko": "값 비교로 분기점 찾기 O(h)", "en": "descend by value comparison to the split point, O(h)"}], "study_note_md": "# 13. 트리 & 이진탐색트리 (Trees & BST) — Q1~Q9 🌳\n\n> DSA 트랙의 관문. **재귀 순회**, **명시적 스택/큐로의 반복 변환**, 그리고\n> **BST 불변식**이 핵심이다. 임베디드에선 파싱 트리·룩업 테이블·상태 계층 탐색으로\n> 곧장 이어진다.\n\n---\n\n## 왜 이 주제가 중요한가 (임베디드/Anduril 관점)\n\n- **트리 = 파싱/표현식 구조**: 명령 프로토콜 파서, 설정(config) AST, 표현식 평가기가\n  전부 트리다. pre/in/post 순회는 이들을 직렬화/평가하는 기본기.\n- **BST = 정렬된 인덱스/룩업**: \"키로 O(log n) 조회 + 정렬 순회\"가 필요한 곳(주소↔핸들\n  매핑, 시간순 이벤트 인덱스). inorder 가 곧 정렬 출력.\n- **BFS(큐) = 상태/그래프 계층 탐색**: FSM 도달성, 토폴로지 계층, 최단 홉 탐색.\n- **재귀 -> 반복 변환**: MCU/ISR 은 콜스택이 얕다. 깊은 재귀는 스택 오버플로 위험 →\n  **명시적 스택**으로 반복화하는 기술이 실전에서 요구된다.\n\n---\n\n## 핵심 개념 치트시트\n\n| 개념 | 한 줄 요약 |\n|------|-----------|\n| 순회 3형제 | 값 기록 **시점**만 다름: pre(루트먼저)/in(중간)/post(마지막). |\n| BST inorder | 오름차순 정렬 결과 == 트리가 BST 인지의 힌트. |\n| 반복 inorder | 노드 포인터 **명시적 스택**: 왼쪽 끝까지 push → pop 기록 → 오른쪽. |\n| 레벨오더 BFS | 배열 **FIFO 큐**: dequeue → 기록 → 좌·우 자식 enqueue. |\n| max depth | `1 + max(왼, 오)`, 빈 트리 0. |\n| invert | 각 노드 좌/우 자식 swap (재귀). |\n| 균형 판정 | 높이 반환하되 불균형이면 **-1 조기 전파** → O(n) (naive 는 O(n²)). |\n| BST 불변식 | 왼 서브트리 **전체** \u003c 노드 \u003c 오 서브트리 **전체**. |\n| validate BST | 국소 비교론 부족 → **(lo, hi) 경계** 좁히기. |\n| LCA on BST | 값이 둘 다 작으면 왼, 둘 다 크면 오, **갈라지면 현재**. O(h). |\n\n---\n\n## 노드 정의 & 순회 (Q1)\n\n```c\ntypedef struct tnode { int val; struct tnode *left, *right; } tnode_t;\n\nvoid tree_inorder(const tnode_t *n, int *out, size_t *k) {\n    if (!n) return;\n    tree_inorder(n->left,  out, k);\n    out[(*k)++] = n->val;          // 왼쪽 다 본 뒤 루트  (pre 는 이 줄을 맨 위로)\n    tree_inorder(n->right, out, k);\n}\n```\n\n- **암기 포인트**: 세 순회는 재귀 구조가 같고 `out[(*k)++]=n->val;` 한 줄의 **위치**만\n  다르다. pre=맨 위, in=가운데, post=맨 아래.\n- 복잡도: O(n) 시간, O(h) 콜스택(h=높이). 균형이면 h≈log n, 편향이면 h=n.\n\n---\n\n## 반복 inorder = 명시적 스택 (Q2)\n\n```c\nsize_t tree_inorder_iter(const tnode_t *root, int *out) {\n    size_t n = tree_count(root);\n    const tnode_t **stk = malloc(n * sizeof *stk);   // 힙 대신 정적 배열도 가능\n    size_t top = 0, k = 0;\n    const tnode_t *cur = root;\n    while (cur || top > 0) {\n        while (cur) { stk[top++] = cur; cur = cur->left; }  // 왼쪽 끝까지 push\n        cur = stk[--top];                                   // pop\n        out[k++] = cur->val;                                // 방문\n        cur = cur->right;                                   // 오른쪽으로\n    }\n    free(stk);\n    return k;\n}\n```\n\n- **왜?** 재귀의 콜스택을 **자기 자료구조로 대체** → 깊이를 우리가 통제. ISR/베어메탈에서\n  스택 오버플로를 피하는 정석. 스택 용량은 트리 높이 상한(=노드 수)으로 잡으면 안전.\n\n---\n\n## 레벨오더 BFS = 큐 (Q3)\n\n```c\nsize_t tree_level_order(const tnode_t *root, int *out) {\n    if (!root) return 0;\n    size_t n = tree_count(root);\n    const tnode_t **q = malloc(n * sizeof *q);\n    size_t head = 0, tail = 0, k = 0;\n    q[tail++] = root;                       // enqueue\n    while (head \u003c tail) {                    // 큐가 빌 때까지\n        const tnode_t *cur = q[head++];      // dequeue\n        out[k++] = cur->val;\n        if (cur->left)  q[tail++] = cur->left;\n        if (cur->right) q[tail++] = cur->right;\n    }\n    free(q); return k;\n}\n```\n\n- **배열 FIFO**: `head/tail` 인덱스만 전진(링버퍼 아님, 재사용 안 함). 용량 = 노드 수라\n  래핑 불필요. 레벨 경계가 필요하면 dequeue 전에 `tail-head`(현재 레벨 크기)를 스냅샷.\n\n---\n\n## 최대 깊이 · 뒤집기 (Q4, Q5)\n\n```c\nint tree_max_depth(const tnode_t *r) {\n    if (!r) return 0;\n    int l = tree_max_depth(r->left), rr = tree_max_depth(r->right);\n    return (l > rr ? l : rr) + 1;\n}\n\ntnode_t *tree_invert(tnode_t *r) {          // mirror\n    if (!r) return NULL;\n    tnode_t *l = tree_invert(r->left), *rt = tree_invert(r->right);\n    r->left = rt; r->right = l;              // 좌우 교환\n    return r;\n}\n```\n\n---\n\n## 높이 균형 (Q6) — -1 조기 전파\n\n```c\nstatic int balanced_height(const tnode_t *r) {\n    if (!r) return 0;\n    int l = balanced_height(r->left);   if (l \u003c 0) return -1;   // 이미 불균형\n    int rr = balanced_height(r->right); if (rr \u003c 0) return -1;\n    if ((l > rr ? l - rr : rr - l) > 1) return -1;             // 이 노드 불균형\n    return (l > rr ? l : rr) + 1;\n}\nbool tree_is_balanced(const tnode_t *r) { return balanced_height(r) >= 0; }\n```\n\n- **핵심**: 높이 계산과 균형 검사를 **한 번의 후위 순회**로 합친다. 각 노드에서 높이를\n  따로 다시 재는 naive 구현은 O(n²). -1 을 \"불균형 신호\"로 위로 전파해 O(n).\n\n---\n\n## BST: 삽입/탐색 · 유효성 · LCA (Q7~Q9)\n\n```c\ntnode_t *bst_insert(tnode_t *r, int v) {\n    if (!r) return node_new(v);\n    if (v \u003c r->val)      r->left  = bst_insert(r->left,  v);\n    else if (v > r->val) r->right = bst_insert(r->right, v);\n    return r;                                 // v == r->val : 중복 무시\n}\nbool bst_search(const tnode_t *r, int v) {\n    while (r) { if (v == r->val) return true; r = v \u003c r->val ? r->left : r->right; }\n    return false;\n}\n```\n\n### validate BST — 경계 좁히기 (흔한 함정)\n\n```c\nstatic bool valid(const tnode_t *r, long lo, long hi) {   // long: INT 경계 오버플로 회피\n    if (!r) return true;\n    if (r->val \u003c= lo || r->val >= hi) return false;\n    return valid(r->left, lo, r->val) && valid(r->right, r->val, hi);\n}\nbool bst_is_valid(const tnode_t *r) { return valid(r, LONG_MIN, LONG_MAX); }\n```\n\n- **함정**: \"노드 > 왼자식 && 노드 \u003c 오른자식\"만 보는 국소 검사는 **틀린다**.\n  `[5,1,4,_,_,3,6]` 은 국소적으론 통과하지만 4 가 5 의 오른쪽에 있어 위반 → 조상 경계를\n  전달해야 한다. 대안: **inorder 가 순증가**인지 검사(이전 값 하나만 기억).\n\n### LCA on BST — O(h)\n\n```c\ntnode_t *bst_lca(tnode_t *r, int a, int b) {\n    while (r) {\n        if (a \u003c r->val && b \u003c r->val)      r = r->left;\n        else if (a > r->val && b > r->val) r = r->right;\n        else return r;                        // 분기점(또는 하나가 현재와 일치) = LCA\n    }\n    return NULL;\n}\n```\n\n- 일반 이진트리 LCA 는 O(n) 재귀지만, **BST 는 값 비교만으로 O(h)**. BST 성질을 쓰는\n  대표 문제.\n\n---\n\n## 인터뷰 팔로업 & 임베디드 함정\n\n- **Q. 재귀 순회를 왜 반복으로 바꾸나?** → MCU 콜스택은 수 KB. 깊이 큰(편향) 트리에서\n  재귀는 스택 오버플로 → 명시적 스택으로 깊이를 통제.\n- **Q. BFS 큐를 힙 없이?** → `POOL_SIZE` 정적 배열 + head/tail 인덱스. 용량은 트리\n  노드 수 상한으로 컴파일 타임 확보.\n- **Q. validate BST 국소 검사의 반례?** → `[5,1,4,_,_,3,6]`. 경계 전달 또는 inorder\n  단조성으로 해결.\n- **함정: validate 에서 INT_MIN/INT_MAX 노드** → int 경계로 비교하면 오버플로/등호\n  문제. `long` 경계 + 열린구간(`\u003c=`, `>=`)으로 안전하게.\n- **함정: 편향 트리에서 h=n** → BST 라도 정렬 삽입하면 링크드리스트가 됨. 실무는\n  self-balancing(AVL/RB)이 필요하지만 인터뷰 기본은 단순 BST.\n- **함정: 순회 버퍼 크기** → out 배열은 노드 수 이상 확보. `tree_count` 로 사전 산정.\n- **함정: 사이클(손상 포인터)** → 진짜 트리는 사이클이 없지만, 손상 시 순회가 무한\n  루프. 방어적 코드에선 방문 상한/깊이 상한을 둔다.\n\n---\n\n## 복잡도 요약\n\n| 연산 | 시간 | 공간 |\n|------|------|------|\n| pre/in/post 순회 | O(n) | O(h) 스택 |\n| 반복 inorder | O(n) | O(h) 명시적 스택 |\n| 레벨오더 BFS | O(n) | O(w) 큐 (w=최대 폭) |\n| max depth / invert | O(n) | O(h) |\n| is balanced | O(n) | O(h) |\n| BST insert / search | O(h) | O(h) 재귀 / O(1) 반복 |\n| validate BST | O(n) | O(h) |\n| LCA on BST | O(h) | O(1) |\n\n> h = 높이 (균형 시 log n, 편향 시 n), w = 최대 레벨 폭, n = 노드 수.\n", "problems": [{"num": 1, "slug": "traversals_recursive", "title_ko": "재귀 순회 (전위/중위/후위)", "title_en": "Recursive traversals (pre/in/post)", "difficulty": "easy", "tags": ["tree", "traversal", "recursion"], "prompt_ko": "이진트리를 전위/중위/후위로 재귀 순회하며 값을 out 배열에 채우고 개수 인덱스 *k 를 전진시킨다. 세 순회는 값 기록 시점만 다르다.", "prompt_en": "Recursively traverse a binary tree in pre/in/post order, writing values into out and advancing the count *k. The three orders differ only in when the value is recorded.", "signature": "void tree_inorder(const tnode_t *root, int *out, size_t *k);", "examples": [{"in": "tree [1,2,3,4,5,NIL,6]", "out": "pre=1 2 4 5 3 6, in=4 2 5 1 3 6, post=4 5 2 6 3 1"}], "hints": ["if(!root) return; 로 빈 노드 종료.", "값 기록 out[(*k)++]=root->val; 의 위치가 pre/in/post 를 가른다.", "왼쪽 재귀 -> (기록) -> 오른쪽 재귀 골격은 동일."], "solution": "void tree_preorder(const tnode_t *r, int *out, size_t *k) {\n    if (!r) return;\n    out[(*k)++] = r->val;\n    tree_preorder(r->left, out, k);\n    tree_preorder(r->right, out, k);\n}\nvoid tree_inorder(const tnode_t *r, int *out, size_t *k) {\n    if (!r) return;\n    tree_inorder(r->left, out, k);\n    out[(*k)++] = r->val;\n    tree_inorder(r->right, out, k);\n}\nvoid tree_postorder(const tnode_t *r, int *out, size_t *k) {\n    if (!r) return;\n    tree_postorder(r->left, out, k);\n    tree_postorder(r->right, out, k);\n    out[(*k)++] = r->val;\n}", "explanation_ko": "PATTERN: DFS 재귀. 세 순회는 재귀 구조가 같고 값 기록 한 줄의 위치만 다르다(pre=맨위, in=가운데, post=맨아래). BST 를 inorder 로 돌면 오름차순이 나온다. 복잡도: O(n) 시간, O(h) 콜스택.", "complexity": "O(n) time, O(h) stack", "pitfalls": ["*k 를 값으로 넘겨 호출자 인덱스 갱신 실패", "빈 노드 종료 조건 누락 -> NULL 역참조", "out 버퍼가 노드 수보다 작음"], "anduril_context": "명령/표현식 파싱 트리 직렬화, config AST 평가 순서 결정."}, {"num": 2, "slug": "inorder_iterative", "title_ko": "반복 중위 순회 (명시적 스택)", "title_en": "Iterative inorder (explicit stack)", "difficulty": "medium", "tags": ["tree", "traversal", "stack", "iterative"], "prompt_ko": "재귀 없이 노드 포인터 명시적 스택으로 중위 순회하고 채운 개수를 반환한다. MCU/ISR 처럼 콜스택이 얕은 환경에서 재귀 대체.", "prompt_en": "Do an inorder traversal without recursion using an explicit node-pointer stack; return the count. Replaces recursion where the call stack is shallow (MCU/ISR).", "signature": "size_t tree_inorder_iter(const tnode_t *root, int *out);", "examples": [{"in": "tree [1,2,3,4,5,NIL,6]", "out": "4 2 5 1 3 6 (count 6)"}, {"in": "single [42]", "out": "42 (count 1)"}], "hints": ["스택 용량은 tree_count(root) 로 산정.", "while(cur){ push(cur); cur=cur->left; } 로 왼쪽 끝까지.", "pop -> 값 기록 -> cur=popped->right 로 오른쪽 진행."], "solution": "size_t tree_inorder_iter(const tnode_t *root, int *out) {\n    size_t n = tree_count(root);\n    if (n == 0) return 0;\n    const tnode_t **stk = malloc(n * sizeof *stk);\n    size_t top = 0, k = 0;\n    const tnode_t *cur = root;\n    while (cur || top > 0) {\n        while (cur) { stk[top++] = cur; cur = cur->left; }\n        cur = stk[--top];\n        out[k++] = cur->val;\n        cur = cur->right;\n    }\n    free(stk);\n    return k;\n}", "explanation_ko": "PATTERN: 명시적 스택 DFS. 재귀의 콜스택을 자기 자료구조로 대체해 깊이를 통제한다. 왼쪽 끝까지 밀어넣고 pop 하며 기록, 이후 오른쪽 서브트리로. 복잡도: O(n) 시간, O(h) 스택.", "complexity": "O(n) time, O(h) explicit-stack space", "pitfalls": ["while(cur || top>0) 루프 조건에서 스택 비었는지 함께 검사", "pop 후 오른쪽으로 안 넘어가 무한 루프", "스택 용량 과소 산정으로 오버런"], "anduril_context": "깊은 파싱 트리를 얕은 ISR 스택에서 안전하게 순회(스택 오버플로 회피)."}, {"num": 3, "slug": "level_order_bfs", "title_ko": "레벨오더 BFS (큐)", "title_en": "Level-order BFS (queue)", "difficulty": "medium", "tags": ["tree", "bfs", "queue"], "prompt_ko": "배열 FIFO 큐로 레벨(계층) 순서로 방문하며 값을 채우고 개수를 반환한다. dequeue -> 기록 -> 좌·우 자식 enqueue.", "prompt_en": "Visit nodes level by level using an array FIFO queue; fill values and return the count. Dequeue -> record -> enqueue left then right child.", "signature": "size_t tree_level_order(const tnode_t *root, int *out);", "examples": [{"in": "tree [1,2,3,4,5,NIL,6]", "out": "1 2 3 4 5 6 (count 6)"}, {"in": "empty", "out": "count 0"}], "hints": ["큐 용량 = tree_count(root). head/tail 인덱스만 전진.", "루트 enqueue 후 head\u003ctail 동안 반복.", "좌 자식 먼저, 그 다음 우 자식 enqueue."], "solution": "size_t tree_level_order(const tnode_t *root, int *out) {\n    if (!root) return 0;\n    size_t n = tree_count(root);\n    const tnode_t **q = malloc(n * sizeof *q);\n    size_t head = 0, tail = 0, k = 0;\n    q[tail++] = root;\n    while (head \u003c tail) {\n        const tnode_t *cur = q[head++];\n        out[k++] = cur->val;\n        if (cur->left)  q[tail++] = cur->left;\n        if (cur->right) q[tail++] = cur->right;\n    }\n    free(q);\n    return k;\n}", "explanation_ko": "PATTERN: BFS(큐). 배열 FIFO 로 head/tail 을 전진시키며 계층 순서로 방문한다(링버퍼 아님, 용량=노드수라 래핑 불필요). 레벨 경계가 필요하면 dequeue 전에 tail-head 로 현재 레벨 크기를 스냅샷. 복잡도: O(n) 시간, O(w) 큐(w=최대 폭).", "complexity": "O(n) time, O(w) queue space", "pitfalls": ["빈 트리 미처리 -> malloc(0)/역참조", "좌/우 enqueue 순서 뒤바뀜 -> 좌우 반전 출력", "레벨 크기 스냅샷 없이 레벨 경계 계산 시 오류"], "anduril_context": "FSM 도달성/토폴로지 계층 탐색, 최단 홉(hop) 탐색."}, {"num": 4, "slug": "max_depth", "title_ko": "최대 깊이", "title_en": "Maximum depth", "difficulty": "easy", "tags": ["tree", "recursion", "depth"], "prompt_ko": "트리의 최대 깊이(루트~가장 먼 리프의 노드 수)를 구한다. 빈 트리는 0.", "prompt_en": "Compute the maximum depth (node count on the longest root-to-leaf path). Empty tree is 0.", "signature": "int tree_max_depth(const tnode_t *root);", "examples": [{"in": "tree [1,2,3,4,5,NIL,6]", "out": "3"}, {"in": "empty", "out": "0"}, {"in": "single", "out": "1"}], "hints": ["빈 트리면 0 반환.", "1 + max(왼 깊이, 오 깊이).", "리프에서 자연히 1 이 된다."], "solution": "int tree_max_depth(const tnode_t *root) {\n    if (!root) return 0;\n    int l = tree_max_depth(root->left);\n    int r = tree_max_depth(root->right);\n    return (l > r ? l : r) + 1;\n}", "explanation_ko": "PATTERN: DFS 후위 집계. 각 노드의 깊이는 두 서브트리 깊이의 최대에 1 을 더한 값. 복잡도: O(n) 시간, O(h) 스택.", "complexity": "O(n) time, O(h) stack", "pitfalls": ["빈 트리 0 대신 1 반환하는 off-by-one", "max 대신 합/min 사용", "노드 수 대신 에지 수 정의 혼동"], "anduril_context": "파싱/설정 트리 깊이 한계 검증, 재귀 스택 사용량 상한 산정."}, {"num": 5, "slug": "invert_tree", "title_ko": "트리 뒤집기 (미러)", "title_en": "Invert tree (mirror)", "difficulty": "easy", "tags": ["tree", "recursion", "mutation"], "prompt_ko": "각 노드의 좌/우 자식을 재귀적으로 맞바꿔 좌우 대칭 트리로 만든다. 제자리 변형, 루트 반환.", "prompt_en": "Recursively swap left/right children to mirror the tree in place; return the root.", "signature": "tnode_t *tree_invert(tnode_t *root);", "examples": [{"in": "level 1 2 3 4 5 6", "out": "level 1 3 2 6 5 4"}, {"in": "empty", "out": "NULL"}], "hints": ["빈 노드면 NULL 반환.", "왼/오 서브트리를 먼저 재귀 뒤집고,", "root->left 와 root->right 를 교환."], "solution": "tnode_t *tree_invert(tnode_t *root) {\n    if (!root) return NULL;\n    tnode_t *l = tree_invert(root->left);\n    tnode_t *r = tree_invert(root->right);\n    root->left  = r;\n    root->right = l;\n    return root;\n}", "explanation_ko": "PATTERN: DFS 제자리 변형. 각 노드에서 두 자식 포인터를 교환하면 전체가 좌우 반전된다. 복잡도: O(n) 시간, O(h) 스택.", "complexity": "O(n) time, O(h) stack", "pitfalls": ["교환 전에 한쪽을 덮어써서 자식 유실", "빈 노드 종료 누락", "루트 반환을 잊어 호출 체인 끊김"], "anduril_context": "좌표계/화면 미러링 변환의 트리 형태 데이터 반전."}, {"num": 6, "slug": "is_balanced", "title_ko": "높이 균형 여부", "title_en": "Height-balanced check", "difficulty": "medium", "tags": ["tree", "recursion", "balance"], "prompt_ko": "모든 노드에서 왼/오 서브트리 높이 차가 1 이하인지 판정한다. 높이를 반환하되 불균형이면 -1 을 조기 전파해 한 번 순회로 처리한다.", "prompt_en": "Decide whether every node has left/right subtree heights differing by at most 1. Return height but propagate -1 early on imbalance for a single pass.", "signature": "bool tree_is_balanced(const tnode_t *root);", "examples": [{"in": "tree [1,2,3,4,5,NIL,6]", "out": "true"}, {"in": "skewed [1,2,NIL,3]", "out": "false"}], "hints": ["헬퍼 balanced_height 가 높이 또는 -1(불균형) 반환.", "왼/오 중 하나가 -1 이면 즉시 -1 전파.", "|왼-오|>1 이면 -1, 아니면 max+1."], "solution": "static int balanced_height(const tnode_t *r) {\n    if (!r) return 0;\n    int l = balanced_height(r->left);\n    if (l \u003c 0) return -1;\n    int rr = balanced_height(r->right);\n    if (rr \u003c 0) return -1;\n    int d = l > rr ? l - rr : rr - l;\n    if (d > 1) return -1;\n    return (l > rr ? l : rr) + 1;\n}\nbool tree_is_balanced(const tnode_t *root) {\n    return balanced_height(root) >= 0;\n}", "explanation_ko": "PATTERN: DFS 후위 + 조기 종료. 높이 계산과 균형 검사를 한 번의 후위 순회로 합친다. 각 노드에서 높이를 다시 재는 naive 는 O(n^2); -1 전파로 O(n). 복잡도: O(n) 시간, O(h) 스택.", "complexity": "O(n) time, O(h) stack", "pitfalls": ["노드마다 높이 재계산하는 O(n^2) 구현", "-1 전파 검사 누락으로 불균형 놓침", "높이 차 절대값 계산 오류"], "anduril_context": "BST 인덱스가 편향(정렬 삽입)됐는지 진단 -> 재균형/재구성 트리거."}, {"num": 7, "slug": "bst_insert_and_search", "title_ko": "BST 삽입 & 탐색", "title_en": "BST insert & search", "difficulty": "medium", "tags": ["bst", "insert", "search"], "prompt_ko": "이진탐색트리 불변식(왼\u003c루트\u003c오)을 유지하며 값을 삽입(중복 무시)하고 존재 여부를 탐색한다. 삽입은 새 루트 반환.", "prompt_en": "Insert values keeping the BST invariant (left\u003croot\u003cright, duplicates ignored) and search for existence. Insert returns the (possibly new) root.", "signature": "tnode_t *bst_insert(tnode_t *root, int val); bool bst_search(const tnode_t *root, int val);", "examples": [{"in": "insert 5,3,8,1,4,7,9 then inorder", "out": "1 3 4 5 7 8 9"}, {"in": "search 6", "out": "false"}], "hints": ["빈 자리(NULL)에 도달하면 node_new 로 삽입 지점.", "val\u003croot->val 이면 왼쪽, > 면 오른쪽 재귀.", "탐색은 값 비교로 한 방향씩 내려가는 while 루프."], "solution": "tnode_t *bst_insert(tnode_t *root, int val) {\n    if (!root) return node_new(val);\n    if (val \u003c root->val)      root->left  = bst_insert(root->left,  val);\n    else if (val > root->val) root->right = bst_insert(root->right, val);\n    return root;\n}\nbool bst_search(const tnode_t *root, int val) {\n    while (root) {\n        if (val == root->val) return true;\n        root = (val \u003c root->val) ? root->left : root->right;\n    }\n    return false;\n}", "explanation_ko": "PATTERN: BST 하강. 값 비교로 한 방향씩 내려가 삽입/탐색한다. inorder 로 돌면 정렬 결과가 나온다. 복잡도: O(h) (균형 log n, 편향 n).", "complexity": "O(h) time; O(h) recursion / O(1) iterative space", "pitfalls": ["중복 처리 정책 미정(무한 삽입/오류)", "삽입 후 반환 루트 재대입 누락", "정렬 순서 삽입 시 O(n) 편향 트리"], "anduril_context": "정렬된 룩업 테이블(주소\u003c->핸들 매핑), 시간순 이벤트 인덱스의 O(log n) 조회."}, {"num": 8, "slug": "validate_bst", "title_ko": "BST 유효성 검사", "title_en": "Validate BST", "difficulty": "medium", "tags": ["bst", "validation", "bounds"], "prompt_ko": "트리가 유효한 BST 인지 검사한다. 국소 비교로는 부족하며 조상 경계(lo,hi)를 좁혀 전달해야 한다. INT 경계 오버플로 회피 위해 long 사용.", "prompt_en": "Check whether a tree is a valid BST. Local comparison is insufficient; pass down narrowing ancestor bounds (lo,hi). Use long to avoid INT boundary overflow.", "signature": "bool bst_is_valid(const tnode_t *root);", "examples": [{"in": "[5,3,8,1,4,7,9]", "out": "true"}, {"in": "[5,1,4,NIL,NIL,3,6]", "out": "false"}], "hints": ["헬퍼 valid(root, lo, hi): 값이 (lo,hi) 열린구간 안이어야 함.", "왼쪽 재귀는 상한을 현재 값으로, 오른쪽은 하한을 현재 값으로.", "경계는 long (LONG_MIN/LONG_MAX) 로 시작."], "solution": "static bool bst_valid_bounds(const tnode_t *r, long lo, long hi) {\n    if (!r) return true;\n    if (r->val \u003c= lo || r->val >= hi) return false;\n    return bst_valid_bounds(r->left,  lo, r->val) &&\n           bst_valid_bounds(r->right, r->val, hi);\n}\nbool bst_is_valid(const tnode_t *root) {\n    return bst_valid_bounds(root, LONG_MIN, LONG_MAX);\n}", "explanation_ko": "PATTERN: 경계 전파 DFS. '왼자식\u003c노드\u003c오른자식' 국소 검사는 틀린다([5,1,4,_,_,3,6] 반례) — 조상이 만든 (lo,hi) 구간을 좁혀가며 검사해야 한다. 대안은 inorder 단조 증가 검사. 복잡도: O(n) 시간, O(h) 스택.", "complexity": "O(n) time, O(h) stack", "pitfalls": ["국소 비교만 해서 조상 경계 위반 놓침", "INT_MIN/INT_MAX 노드에서 int 경계 오버플로", "등호 처리(중복 허용 여부) 모호"], "anduril_context": "직렬화/외부 입력으로 복원한 인덱스 트리의 무결성 검증(손상 감지)."}, {"num": 9, "slug": "lowest_common_ancestor_bst", "title_ko": "BST 최소 공통 조상", "title_en": "Lowest common ancestor (BST)", "difficulty": "medium", "tags": ["bst", "lca", "traversal"], "prompt_ko": "BST 에서 두 값의 최소 공통 조상을 찾는다. 값 비교만으로 O(h): 둘 다 작으면 왼쪽, 둘 다 크면 오른쪽, 갈라지면 현재가 LCA. (두 값은 존재 가정.)", "prompt_en": "Find the lowest common ancestor of two values in a BST in O(h) using value comparison: both smaller -> left, both larger -> right, split -> current is the LCA. (Both values assumed present.)", "signature": "tnode_t *bst_lca(tnode_t *root, int a, int b);", "examples": [{"in": "tree rooted 6; LCA(2,8)", "out": "6"}, {"in": "LCA(3,5)", "out": "4"}, {"in": "LCA(2,4)", "out": "2 (ancestor itself)"}], "hints": ["a,b 둘 다 root->val 보다 작으면 root=root->left.", "둘 다 크면 root=root->right.", "그 외(갈라짐/하나가 현재와 일치)면 root 가 LCA."], "solution": "tnode_t *bst_lca(tnode_t *root, int a, int b) {\n    while (root) {\n        if (a \u003c root->val && b \u003c root->val)      root = root->left;\n        else if (a > root->val && b > root->val) root = root->right;\n        else return root;\n    }\n    return NULL;\n}", "explanation_ko": "PATTERN: BST 하강 분기점. 일반 이진트리 LCA 는 O(n) 재귀지만 BST 는 값 비교만으로 분기점을 찾아 O(h). 한 값이 다른 값의 조상이면 그 조상 노드가 LCA. 복잡도: O(h) 시간, O(1) 공간.", "complexity": "O(h) time, O(1) space", "pitfalls": ["일반 트리 O(n) 방식으로 풀어 BST 성질 미활용", "한 노드가 다른 노드의 조상인 경우 처리 누락", "부등호에 등호 포함해 분기점 조기 종료 오류"], "anduril_context": "정렬 인덱스에서 두 키의 공통 상위 범위(구간 질의) 결정, 트리 기반 라우팅."}]}, {"id": "14_heap_pq", "order": 14, "range": "Heap/PQ", "icon": "⛰️", "track": "dsa", "title_en": "Heaps & Priority Queue", "title_ko": "힙 & 우선순위 큐", "summary_ko": "배열 이진 힙(0-indexed, parent=(i-1)/2)을 STL 없이 직접 구현해 heapify·push/pop·힙정렬, 크기 k 힙으로 K번째 최대·top-k 빈도, min-heap k-way merge, 로봇 스웜 우선순위 스케줄러, 두 힙 스트림 중앙값까지 다룬다. sift_up/sift_down 두 원자가 모든 것의 뼈대.", "summary_en": "Implement an array binary heap (0-indexed, parent=(i-1)/2) from scratch: heapify, push/pop, heap sort, size-k heaps for Kth-largest and top-k frequency, min-heap k-way merge, a robot-swarm priority scheduler, and a two-heap streaming median. sift_up/sift_down are the two atoms behind all of it.", "anduril_relevance_ko": "힙/우선순위 큐와 '로봇 스웜 우선순위 태스크' 시나리오는 Anduril 에서 보고된 실제 인터뷰 질문이다. RTOS 우선순위 스케줄링(가장 급한 태스크 먼저), top-k(최근접/최위협 표적 K개), k-way merge(멀티센서 스트림 시간순 융합), 스트림 중앙값(노이즈 강건 온라인 필터)이 모두 힙 응용이며, 인터뷰어는 STL 없이 배열 인덱스 산술과 sift 로직을 정확히 짜는지로 C 실력을 본다.", "concepts": [{"term": "array binary heap", "ko": "parent=(i-1)/2, left=2i+1, right=2i+2 (0-indexed)", "en": "complete tree in one array; no pointers, cache-friendly"}, {"term": "sift_up / sift_down", "ko": "힙의 두 원자: push=상향, pop/heapify=하향", "en": "the two atoms; push sifts up, pop/heapify sift down"}, {"term": "bottom-up heapify", "ko": "i=n/2-1..0 sift_down -> O(n)", "en": "sift_down non-leaves from n/2-1; O(n) not O(n log n)"}, {"term": "heap sort", "ko": "max-heap 후 루트↔끝 교환 + 축소, in-place", "en": "swap root with end and shrink; O(n log n), O(1) space"}, {"term": "size-k heap (top-k)", "ko": "K번째 최대/top-k 빈도를 O(n log k) 로", "en": "bounded heap keeps top-k in O(n log k), O(k) space"}, {"term": "k-way merge", "ko": "각 배열 선두를 min-heap, pop 후 다음 push", "en": "min-heap of array heads; O(N log k) merge"}, {"term": "priority queue reinsert", "ko": "pop-highest -> 우선순위 갱신 -> 재삽입 (로봇 스웜)", "en": "pop highest, re-evaluate priority, reinsert (aging)"}, {"term": "two heaps median", "ko": "lo(max)+hi(min), 크기 차\u003c=1, add O(log n)", "en": "max-heap low + min-heap high; add O(log n), get O(1)"}], "study_note_md": "# 14. 힙 & 우선순위 큐 (Heaps & Priority Queue) — P1~P8 ⛰️\n\n> **배열 이진 힙**은 임베디드 코딩 인터뷰의 단골이자, RTOS 우선순위 스케줄러의\n> 실제 뼈대다. Anduril 류 방산/로보틱스 펌웨어에서 **힙/우선순위 큐**와\n> **\"로봇 스웜 우선순위 태스크\"** 시나리오는 실제로 보고된 인터뷰 질문이다.\n\n---\n\n## 왜 Anduril 펌웨어 인터뷰에 나오나\n\n- **RTOS 우선순위 스케줄링**: \"가장 급한 태스크 먼저\"는 곧 max-heap 이다. 태스크 큐,\n  타이머 만료 큐, 이벤트 디스패치가 우선순위 큐로 구현된다.\n- **로봇 스웜 태스크(P7)**: pop-highest -> 실행 -> 우선순위 재평가 -> 재삽입. 실시간\n  스케줄러/미션 플래너의 핵심 루프. (보고된 실제 질문 시나리오)\n- **top-k(P4/P5)**: 레이더/센서에서 **가장 가까운 표적 K개**, 가장 빈번한 이벤트 K개.\n- **k-way merge(P6)**: 여러 정렬된 **멀티센서 스트림을 시간순 병합**.\n- **스트림 중앙값(P8)**: 온라인 통계/노이즈 강건 필터(중앙값)를 O(log n) 갱신으로.\n- 인터뷰어는 STL 없이 **배열 인덱스 산술(parent/child)** 과 sift 로직을 정확히\n  짜는지로 C 실력을 가늠한다.\n\n---\n\n## 배열 이진 힙 핵심 (0-indexed)\n\n```\n        인덱스:   0\n                / \\\n               1   2\n              / \\ / \\\n             3  4 5  6\n\n  parent(i) = (i-1)/2\n  left(i)   = 2i+1\n  right(i)  = 2i+2\n```\n\n- **완전 이진 트리**라서 포인터 없이 배열 하나로 표현 -> 캐시 친화적, 힙 할당 0.\n- 모든 연산은 두 원자로 환원된다:\n  - **sift_up(상향 조정)**: 새로 넣은 잎을 부모와 비교하며 위로. (push)\n  - **sift_down(하향 조정)**: 루트를 큰/작은 자식과 교환하며 아래로. (pop, heapify)\n- max-heap: 부모 >= 자식. min-heap: 부모 \u003c= 자식. sift 비교 방향만 뒤집으면 된다.\n\n---\n\n## 핵심 개념 치트시트\n\n| 개념 | 한 줄 요약 |\n|------|-----------|\n| 배열 인덱싱 | parent=(i-1)/2, left=2i+1, right=2i+2. 포인터 불필요. |\n| sift_up / sift_down | 힙의 두 원자. push=sift_up, pop/heapify=sift_down. |\n| heapify (bottom-up) | i=n/2-1..0 sift_down -> **O(n)** (삽입 n번 O(n log n) 보다 빠름). |\n| heap_sort | max-heap 후 루트↔끝 교환 + 힙 축소. in-place O(n log n). |\n| 크기 k 힙 | K번째 최대/top-k 빈도를 **O(n log k)** 로 (전체 정렬 불필요). |\n| k-way merge | 각 배열 선두를 min-heap 에, pop 후 다음 원소 push. 힙 크기 \u003c= k. |\n| 두 힙 중앙값 | lo(max-heap)+hi(min-heap), 크기 차 \u003c= 1 유지. |\n\n---\n\n## P1. heapify — 왜 bottom-up 이 O(n)인가\n\n```c\nvoid heap_build_max(int *a, int n) {\n    for (int i = n / 2 - 1; i >= 0; --i)  // 잎이 아닌 마지막 노드부터\n        sift_down_max(a, n, i);\n}\n```\n\n- 인덱스 `n/2 .. n-1` 은 전부 잎(자식 없음) -> 이미 힙. 그래서 `n/2-1` 부터 시작.\n- 낮은 레벨 노드가 대부분(잎이 절반)이고 이동 거리가 짧다. 레벨별 비용 합이\n  수렴해 **O(n)** (겉보기 O(n log n) 이지만 실제는 선형). 인터뷰 단골 팔로업.\n\n---\n\n## P2. push / pop\n\n```c\nvoid max_heap_push(int *a, int *n, int val) {\n    a[*n] = val; sift_up_max(a, *n); (*n)++;   // 끝에 넣고 위로\n}\nint max_heap_pop(int *a, int *n) {\n    int top = a[0];\n    a[0] = a[--(*n)];                          // 마지막 원소를 루트로\n    sift_down_max(a, *n, 0);                    // 아래로 정렬\n    return top;\n}\n```\n\n- **가드 순서**: sift_down 에서 `l \u003c n && a[l] > a[i]` — 인덱스 범위를 **먼저** 검사\n  (short-circuit)해야 배열 밖 접근 UB 를 막는다.\n\n---\n\n## P3. heap_sort — in-place, O(1) 추가 공간\n\n```c\nvoid heap_sort(int *a, int n) {\n    heap_build_max(a, n);                   // O(n)\n    for (int end = n - 1; end > 0; --end) {\n        swap(&a[0], &a[end]);               // 최댓값을 뒤에 고정\n        sift_down_max(a, end, 0);           // 줄어든 힙 재정비\n    }\n}\n```\n\n- max-heap 이라야 **오름차순**이 나온다(최댓값을 뒤로 밀어냄). 안정 정렬은 아님.\n\n---\n\n## P4/P5. 크기 k 힙 — top-k 의 정석 (O(n log k))\n\n- **K번째 최대(P4)**: 크기 k **min-heap** 유지. 루트 = 지금까지 상위 k개 중 최소 =\n  현재 K번째 최대. 새 값 > 루트면 루트 교체 후 sift_down.\n- **top-k 빈도(P5)**: (값,빈도) 쌍을 **count 기준 min-heap** 으로 k개 유지.\n\n```c\n// P4 핵심 루프\nif (hn \u003c k) { heap[hn]=a[i]; sift_up_min(heap,hn); hn++; }\nelse if (a[i] > heap[0]) { heap[0]=a[i]; sift_down_min(heap,k,0); }\n```\n\n- 전체 정렬 O(n log n) 보다 메모리 O(k), 시간 O(n log k). **스트리밍**에서 유리.\n\n---\n\n## P6. k-way merge — min-heap 으로 (O(N log k))\n\n```c\n// (값, 배열idx, 원소idx) 를 min-heap 으로\npush 각 배열의 첫 원소;\nwhile (heap 비지 않음) {\n    top = pop();  out[idx++] = top.val;\n    if (top.ei+1 \u003c lens[top.ai]) push(arrs[top.ai][top.ei+1]);\n}\n```\n\n- 힙 크기 항상 \u003c= k -> 총 N개에 대해 O(N log k). 배열이 매우 많을 때 pairwise merge\n  보다 효율적. 빈 배열/서로 다른 길이 경계 처리에 주의.\n\n---\n\n## P7. 로봇 스웜 우선순위 태스크 (Anduril 시나리오 ★)\n\n```c\n// max-heap(우선순위)\n초기 태스크 heapify;\nwhile (heap 비지 않음 && steps \u003c cap) {\n    top = pop();                 // 가장 급한 태스크\n    order[steps++] = top.id;     // 한 스텝 실행\n    top.priority -= decay;       // 실행 후 우선순위 재평가(감쇠)\n    if (top.priority > 0)        // 남았으면 갱신값으로 재삽입\n        push(top);\n}\n```\n\n- **패턴**: pop-highest -> 실행 -> 우선순위 갱신 -> 재삽입. aging/decay 로 기아\n  (starvation)를 방지하고, 동적으로 우선순위가 바뀌는 미션을 처리한다.\n- 실전 확장: 새 태스크 도착 시 push, 취소 시 lazy-deletion(무효 플래그) 또는\n  decrease-key. 인터뷰에서 \"우선순위가 바뀌면?\"이 대표 팔로업.\n\n---\n\n## P8. 스트림 중앙값 — 두 힙 (add O(log n), get O(1))\n\n```\n   lo (max-heap, 작은 절반)        hi (min-heap, 큰 절반)\n        [ .. , lo루트=중앙 근처 ]      [ hi루트=중앙 근처, .. ]\n\n  불변식: 모든 lo \u003c= 모든 hi,  lo_n == hi_n  또는  lo_n == hi_n + 1\n  중앙값: 크기 같으면 (lo루트+hi루트)/2, lo 가 하나 크면 lo루트\n```\n\n```c\nvoid median_add(median_t *m, int v) {\n    if (m->lo_n == 0 || v \u003c= m->lo[0]) push_max(lo, v);\n    else                                push_min(hi, v);\n    // 재균형: 크기 차가 1 을 넘으면 큰 쪽 루트를 반대편으로 이동\n    if (lo_n > hi_n + 1) move lo->hi;\n    else if (hi_n > lo_n) move hi->lo;\n}\n```\n\n- 중앙값은 노이즈에 강건한 온라인 필터. 정렬 배열 재삽입 O(n) 대신 O(log n).\n\n---\n\n## 인터뷰 팔로업 & 임베디드 함정\n\n- **Q. heapify 가 왜 O(n)?** -> 잎이 절반이고 이동거리가 레벨에 반비례, 합이 수렴.\n- **Q. push n번 vs heapify?** -> 둘 다 힙을 만들지만 heapify 가 O(n) 으로 더 빠름.\n- **Q. top-k 에 왜 min-heap?** -> 루트(최소)만 밀어내면 상위 k개가 유지됨. max-heap 이면\n  전부 넣고 k번 pop -> O(n log n).\n- **함정: 인덱스 산술** -> `2i+1/2i+2`, `(i-1)/2`. 1-indexed 와 헷갈리면 전부 깨진다.\n- **함정: sift 가드 순서** -> 범위검사(`l\u003cn`)를 비교보다 먼저. 아니면 배열 밖 접근.\n- **함정: pop 후 크기 갱신** -> 마지막 원소를 루트로 옮기고 **크기를 먼저 줄인 뒤**\n  sift_down. 순서 틀리면 방금 뺀 원소를 다시 본다.\n- **함정: 우선순위 큐 decrease-key** -> 배열 힙은 임의 원소 위치를 모른다. 위치\n  인덱스(handle)를 따로 유지하거나 lazy-deletion 필요.\n- **함정(임베디드): 동적 할당** -> 위 예시는 malloc 을 쓰지만, 방산 펌웨어는 보통\n  **정적 배열 + 고정 용량 힙**으로 만든다(P8 처럼 struct 내 고정 배열). 고갈 시\n  우아하게 실패.\n- **함정: ISR 공유** -> 스케줄러 힙을 ISR 와 main 이 함께 만지면 경쟁. 임계구역\n  보호(인터럽트 마스킹) 필요.\n\n---\n\n## 복잡도 요약\n\n| 연산 | 시간 | 공간 |\n|------|------|------|\n| heapify (build) | O(n) | O(1) |\n| push / pop | O(log n) | O(1) |\n| heap_sort | O(n log n) | O(1) (in-place) |\n| kth_largest / top-k | O(n log k) | O(k) |\n| merge k arrays | O(N log k) | O(k) |\n| robot swarm step | O(log n) / step | O(n) |\n| median add / get | O(log n) / O(1) | O(n) |\n", "problems": [{"num": 1, "slug": "heap_build_sift_down", "title_ko": "배열 heapify (bottom-up sift_down)", "title_en": "Build a heap (heapify)", "difficulty": "medium", "tags": ["heap", "heapify", "sift-down", "array"], "prompt_ko": "임의의 int 배열을 in-place 로 max-heap 으로 만든다. 잎이 아닌 마지막 노드(n/2-1)부터 0까지 sift_down 하면 O(n)에 완성된다.", "prompt_en": "Turn an arbitrary int array into a max-heap in place. Sift down from the last non-leaf (n/2-1) to 0 for O(n) construction.", "signature": "void heap_build_max(int *a, int n);", "examples": [{"in": "{3,1,6,5,2,4}", "out": "valid max-heap, root=6"}, {"in": "{42} (n=1)", "out": "{42}"}], "hints": ["인덱스 n/2..n-1 은 이미 잎(힙).", "i=n/2-1 부터 0 까지 sift_down_max(a,n,i).", "sift_down 은 큰 자식과 교환하며 아래로."], "solution": "static void sift_down_max(int *a, int n, int i) {\n    for (;;) {\n        int l = 2*i+1, r = 2*i+2, big = i;\n        if (l \u003c n && a[l] > a[big]) big = l;\n        if (r \u003c n && a[r] > a[big]) big = r;\n        if (big == i) break;\n        int t=a[i]; a[i]=a[big]; a[big]=t;\n        i = big;\n    }\n}\nvoid heap_build_max(int *a, int n) {\n    for (int i = n/2 - 1; i >= 0; --i)\n        sift_down_max(a, n, i);\n}", "explanation_ko": "PATTERN: bottom-up heapify. 잎(절반)은 이미 힙이므로 n/2-1 부터 sift_down. 이동 거리가 낮은 레벨일수록 짧아 비용 합이 수렴 -> O(n) (삽입 n번의 O(n log n) 보다 빠름).", "complexity": "O(n) time, O(1) space", "pitfalls": ["삽입 n번으로 만들면 O(n log n) (덜 효율)", "sift 가드 순서: l\u003cn 을 비교보다 먼저", "1-indexed 공식과 혼동"], "anduril_context": "RTOS 스케줄러 부팅 시 기존 태스크 집합을 한 번에 우선순위 힙으로 구성."}, {"num": 2, "slug": "heap_push_pop", "title_ko": "heap push / pop (sift_up / sift_down)", "title_en": "Heap push and pop", "difficulty": "medium", "tags": ["heap", "sift-up", "sift-down", "priority-queue"], "prompt_ko": "max-heap 에 push(끝에 넣고 sift_up)와 pop(루트 반환, 마지막을 루트로 옮겨 sift_down)을 구현한다. 각 O(log n).", "prompt_en": "Implement push (append + sift_up) and pop (return root, move last to root + sift_down) on a max-heap. Each is O(log n).", "signature": "void max_heap_push(int *a, int *n, int val); int max_heap_pop(int *a, int *n);", "examples": [{"in": "push 5,3,8,1,9,2 then drain", "out": "pop order 9,8,5,3,2,1"}], "hints": ["push: a[*n]=val; sift_up_max(a,*n); (*n)++.", "pop: top=a[0]; a[0]=a[--(*n)]; sift_down_max(a,*n,0).", "sift_up 은 부모 (i-1)/2 와 비교하며 위로."], "solution": "static void sift_up_max(int *a, int i) {\n    while (i > 0) {\n        int p = (i-1)/2;\n        if (a[p] >= a[i]) break;\n        int t=a[p]; a[p]=a[i]; a[i]=t;\n        i = p;\n    }\n}\nvoid max_heap_push(int *a, int *n, int val) {\n    a[*n] = val; sift_up_max(a, *n); (*n)++;\n}\nint max_heap_pop(int *a, int *n) {\n    int top = a[0];\n    a[0] = a[--(*n)];\n    sift_down_max(a, *n, 0);\n    return top;\n}", "explanation_ko": "PATTERN: sift_up/down 두 원자. push 는 새 잎을 위로, pop 은 마지막 원소를 루트로 올린 뒤 아래로. 트리 높이가 log n 이라 각 O(log n).", "complexity": "push/pop O(log n), O(1) space", "pitfalls": ["pop 에서 크기 감소와 sift_down 순서 (먼저 줄이고 sift)", "빈 힙 pop 방어", "sift_up 비교 방향(max vs min) 혼동"], "anduril_context": "이벤트/커맨드 우선순위 큐에 항목 추가·최고 우선순위 디스패치."}, {"num": 3, "slug": "heap_sort", "title_ko": "힙 정렬 (heap_sort)", "title_en": "Heap sort", "difficulty": "medium", "tags": ["heap", "sort", "in-place"], "prompt_ko": "max-heap 을 구성한 뒤 루트(최댓값)를 끝과 교환하고 힙 크기를 줄이며 sift_down 한다. 추가 메모리 없이 오름차순 정렬.", "prompt_en": "Build a max-heap, then repeatedly swap the root (max) with the end and shrink the heap, sifting down. Ascending sort with O(1) extra space.", "signature": "void heap_sort(int *a, int n);", "examples": [{"in": "{5,2,9,1,5,6,3}", "out": "{1,2,3,5,5,6,9}"}], "hints": ["heap_build_max(a,n) 로 시작.", "end=n-1..1: swap(a[0],a[end]); sift_down_max(a,end,0).", "max-heap 이라야 오름차순이 나온다."], "solution": "void heap_sort(int *a, int n) {\n    heap_build_max(a, n);\n    for (int end = n-1; end > 0; --end) {\n        int t=a[0]; a[0]=a[end]; a[end]=t;\n        sift_down_max(a, end, 0);\n    }\n}", "explanation_ko": "PATTERN: selection via heap. heapify O(n) 후 n-1 번 (루트↔끝 교환 + O(log n) sift_down) -> O(n log n). in-place, 불안정 정렬.", "complexity": "O(n log n) time, O(1) space", "pitfalls": ["min-heap 으로 짜면 내림차순", "sift_down 범위를 end 로 줄이지 않음", "불안정 정렬임을 놓침"], "anduril_context": "로그/샘플을 힙 없는 환경에서 제자리 정렬(추가 버퍼 불가 시)."}, {"num": 4, "slug": "kth_largest_element", "title_ko": "K번째 최대 원소 (크기 k min-heap)", "title_en": "Kth largest element", "difficulty": "medium", "tags": ["heap", "top-k", "min-heap", "selection"], "prompt_ko": "크기 k 의 min-heap 에 지금까지의 상위 k개를 유지한다. 루트가 K번째 최대. 새 값이 루트보다 크면 루트를 교체. O(n log k).", "prompt_en": "Keep the top-k seen so far in a size-k min-heap; the root is the Kth largest. Replace the root when a new value exceeds it. O(n log k).", "signature": "int kth_largest(const int *a, int n, int k);", "examples": [{"in": "[3,2,1,5,6,4], k=2", "out": "5"}, {"in": "[3,2,3,1,2,4,5,5,6], k=4", "out": "4"}], "hints": ["hn\u003ck 면 삽입(sift_up_min).", "아니고 a[i]>heap[0] 이면 heap[0]=a[i]; sift_down_min.", "끝나면 heap[0] 이 답."], "solution": "int kth_largest(const int *a, int n, int k) {\n    int *h = malloc((size_t)k * sizeof *h);\n    int hn = 0;\n    for (int i = 0; i \u003c n; ++i) {\n        if (hn \u003c k) { h[hn]=a[i]; sift_up_min(h,hn); hn++; }\n        else if (a[i] > h[0]) { h[0]=a[i]; sift_down_min(h,k,0); }\n    }\n    int res = h[0];\n    free(h);\n    return res;\n}", "explanation_ko": "PATTERN: bounded min-heap for top-k. min-heap 루트=상위 k개 중 최소=K번째 최대. 작은 값은 루트를 못 넘어 자동 배제 -> O(n log k), 공간 O(k). 전체 정렬 O(n log n) 보다 스트리밍 유리.", "complexity": "O(n log k) time, O(k) space", "pitfalls": ["max-heap 쓰면 O(n log n) 로 비효율", "교체 조건 > vs >= (중복 처리)", "힙 크기 k 를 넘겨 sift 범위 오류"], "anduril_context": "레이더 트랙 중 가장 위협적인 K개, 최근접 표적 K개 상시 유지."}, {"num": 5, "slug": "top_k_frequent", "title_ko": "빈도 상위 K개 (크기 k min-heap)", "title_en": "Top-K frequent elements", "difficulty": "medium", "tags": ["heap", "top-k", "frequency", "min-heap"], "prompt_ko": "각 값의 빈도를 집계한 뒤 count 기준 크기 k min-heap 으로 상위 k개를 유지한다. 결과는 빈도 내림차순으로 반환. O(m log k).", "prompt_en": "Count frequencies, then keep the k most frequent in a size-k min-heap keyed by count. Return them in descending frequency. O(m log k).", "signature": "int top_k_frequent(const int *a, int n, int k, int *out);", "examples": [{"in": "[1,1,1,2,2,3], k=2", "out": "[1,2]"}, {"in": "[4,4,4,5,5,6,6,6,6], k=3", "out": "[6,4,5]"}], "hints": ["(값,빈도) 쌍 배열을 만든다.", "count 기준 min-heap 크기 k 유지 (더 큰 빈도가 들어오면 루트 교체).", "힙을 비우며 out 뒤에서부터 채우면 내림차순."], "solution": "typedef struct { int val, cnt; } vc_t;\nint top_k_frequent(const int *a, int n, int k, int *out) {\n    vc_t *f = malloc((size_t)(n?n:1)*sizeof *f);\n    int m = 0;\n    for (int i=0;i\u003cn;++i){int j=0;for(;j\u003cm;++j)if(f[j].val==a[i]){f[j].cnt++;break;}\n        if(j==m){f[m].val=a[i];f[m].cnt=1;m++;}}\n    if (k>m) k=m;\n    vc_t *h = malloc((size_t)(k?k:1)*sizeof *h); int hn=0;\n    for (int i=0;i\u003cm;++i){\n        if(hn\u003ck){h[hn]=f[i];vc_sift_up(h,hn);hn++;}\n        else if(f[i].cnt>h[0].cnt){h[0]=f[i];vc_sift_down(h,k,0);}\n    }\n    for (int i=k-1;i>=0;--i){out[i]=h[0].val; h[0]=h[hn-1]; hn--; vc_sift_down(h,hn,0);}\n    free(h); free(f); return k;\n}", "explanation_ko": "PATTERN: frequency map + bounded min-heap. 빈도 집계 후 count 기준 크기 k min-heap. 힙을 pop 하면 빈도 오름차순이 나오므로 out 을 뒤에서 채워 내림차순으로 만든다. O(m log k) (m=고유값 수).", "complexity": "O(m log k) time (집계 O(n·m) 는 해시맵으로 O(n) 개선 가능), O(m) space", "pitfalls": ["동률 빈도의 tie-break 미정의", "k>고유값수 clamp 누락", "출력 순서(오름/내림) 혼동"], "anduril_context": "가장 빈번한 이벤트/에러코드 K개, 최다 등장 표적 분류 상위 K개."}, {"num": 6, "slug": "merge_k_sorted_arrays", "title_ko": "K개 정렬 배열 병합 (min-heap)", "title_en": "Merge K sorted arrays", "difficulty": "medium", "tags": ["heap", "k-way-merge", "min-heap", "streams"], "prompt_ko": "각 배열의 선두를 (값,배열idx,원소idx) 로 min-heap 에 넣고, 루트를 pop 해 출력한 뒤 그 배열의 다음 원소를 push 한다. 힙 크기 \u003c= k. O(N log k).", "prompt_en": "Push each array's head as (value,arr,idx) into a min-heap; pop the root to output, then push that array's next element. Heap stays \u003c= k. O(N log k).", "signature": "int merge_k_sorted(const int *const *arrs, const int *lens, int k, int *out);", "examples": [{"in": "[1,4,7],[2,5,8],[3,6,9]", "out": "[1..9]"}, {"in": "[1,2,3],[0],[] (uneven+empty)", "out": "[0,1,2,3]"}], "hints": ["각 비어있지 않은 배열의 첫 원소를 힙에 삽입.", "pop -> out 추가 -> ei+1\u003clens 면 그 값을 루트에 replace 후 sift_down.", "없으면 마지막 원소를 루트로 옮기고 크기 감소."], "solution": "typedef struct { int val, ai, ei; } m6_t;\nint merge_k_sorted(const int *const *arrs, const int *lens, int k, int *out) {\n    m6_t *h = malloc((size_t)(k?k:1)*sizeof *h); int hn=0;\n    for (int i=0;i\u003ck;++i) if(lens[i]>0){\n        h[hn].val=arrs[i][0]; h[hn].ai=i; h[hn].ei=0; m6_sift_up(h,hn); hn++; }\n    int idx=0;\n    while (hn>0){\n        m6_t t=h[0]; out[idx++]=t.val; int ne=t.ei+1;\n        if(ne\u003clens[t.ai]){ h[0].val=arrs[t.ai][ne]; h[0].ai=t.ai; h[0].ei=ne; }\n        else { h[0]=h[hn-1]; hn--; }\n        m6_sift_down(h,hn,0);\n    }\n    free(h); return idx;\n}", "explanation_ko": "PATTERN: k-way merge with min-heap. 힙에는 각 배열의 현재 후보만 있어 크기 \u003c= k. 총 N개 원소 각각 O(log k) -> O(N log k). 배열 수가 많을 때 pairwise merge 보다 효율적.", "complexity": "O(N log k) time (N=전체 원소 수), O(k) space", "pitfalls": ["빈 배열/길이 0 미처리", "원소 idx 추적 누락으로 중복/누락", "replace 대신 pop+push 로 불필요한 sift 2회"], "anduril_context": "여러 센서의 시간정렬된 스트림을 하나의 융합 타임라인으로 병합(sensor fusion)."}, {"num": 7, "slug": "task_scheduler_by_priority", "title_ko": "로봇 스웜 우선순위 스케줄러 (pop-highest + 재삽입)", "title_en": "Robot-swarm priority task scheduler", "difficulty": "hard", "tags": ["heap", "priority-queue", "scheduler", "robotics", "reinsert"], "prompt_ko": "우선순위 max-heap 에서 가장 급한 태스크를 pop 해 한 스텝 실행하고, 우선순위를 decay 만큼 낮춰 0 초과면 재삽입한다(0 이하면 완료). 실행 id 순서를 기록하고 총 스텝 수를 반환. cap 으로 제한.", "prompt_en": "Pop the highest-priority task from a max-heap, run one step, decay its priority, and reinsert if it stays positive (else it completes). Record the execution id order and return total steps, bounded by cap.", "signature": "int robot_swarm_schedule(const task_t *tasks, int n, int decay, int *order, int cap);", "examples": [{"in": "{10:5},{20:9},{30:2}, decay=3", "out": "order [20,20,10,20,10,30], 6 steps"}, {"in": "{1:100}, decay=1, cap=4", "out": "4 steps"}], "hints": ["초기 태스크들을 힙에 넣는다(각 sift_up).", "pop(max) -> order[steps++]=id -> priority-=decay.", "priority>0 이면 갱신값으로 다시 push."], "solution": "typedef struct { int id, priority; } task_t;\nint robot_swarm_schedule(const task_t *tasks, int n, int decay, int *order, int cap) {\n    task_t *h = malloc((size_t)(n?n:1)*sizeof *h); int hn=0;\n    for (int i=0;i\u003cn;++i){ h[hn]=tasks[i]; task_sift_up(h,hn); hn++; }\n    int steps=0;\n    while (hn>0 && steps\u003ccap) {\n        task_t top=h[0]; h[0]=h[hn-1]; hn--; task_sift_down(h,hn,0);\n        order[steps++]=top.id;\n        top.priority -= decay;\n        if (top.priority > 0) { h[hn]=top; task_sift_up(h,hn); hn++; }\n    }\n    free(h); return steps;\n}", "explanation_ko": "PATTERN: greedy priority queue with dynamic re-priority. 매 스텝 최고 우선순위를 뽑아 실행하고 우선순위를 재평가(감쇠)해 재삽입 -> aging 으로 starvation 방지. pop+push 각 O(log n). Anduril 에서 보고된 로봇 스웜 시나리오의 핵심.", "complexity": "O(steps · log n) time, O(n) space", "pitfalls": ["재삽입 시 갱신 전 우선순위를 넣음", "완료 조건(\u003c=0) 경계 오류", "취소/decrease-key 는 배열 힙에서 위치 추적 필요(lazy-deletion 대안)"], "anduril_context": "드론 스웜 미션 플래너: 가장 급한 임무 먼저 실행, 실행 후 우선순위 재평가로 자원 공정 분배."}, {"num": 8, "slug": "median_from_stream", "title_ko": "스트림 중앙값 (두 힙)", "title_en": "Median from a data stream", "difficulty": "hard", "tags": ["heap", "two-heaps", "median", "streaming"], "prompt_ko": "lo(작은 절반 max-heap)와 hi(큰 절반 min-heap)를 유지한다. 불변식: 모든 lo\u003c=모든 hi, 크기 차 \u003c=1(lo_n>=hi_n). add 는 O(log n), 중앙값 조회는 O(1).", "prompt_en": "Maintain lo (lower half, max-heap) and hi (upper half, min-heap) with all lo\u003c=all hi and size difference \u003c=1 (lo_n>=hi_n). add is O(log n), median query is O(1).", "signature": "void median_add(median_t *m, int v); double median_get(const median_t *m);", "examples": [{"in": "add 5,15,1,3,8", "out": "median -> 5,10,5,4,5"}, {"in": "add 6,10,2,6,4,8", "out": "6.0 = (6+6)/2"}], "hints": ["v\u003c=lo루트면 lo(max-heap), 아니면 hi(min-heap) 삽입.", "재균형: lo_n>hi_n+1 이면 lo루트를 hi 로, hi_n>lo_n 이면 hi루트를 lo 로.", "조회: 크기 같으면 (lo루트+hi루트)/2.0, 아니면 lo루트."], "solution": "void median_add(median_t *m, int v) {\n    if (m->lo_n==0 || v\u003c=m->lo[0]) { m->lo[m->lo_n]=v; sift_up_max(m->lo,m->lo_n); m->lo_n++; }\n    else { m->hi[m->hi_n]=v; sift_up_min(m->hi,m->hi_n); m->hi_n++; }\n    if (m->lo_n > m->hi_n+1) {\n        int t=m->lo[0]; m->lo[0]=m->lo[--m->lo_n]; sift_down_max(m->lo,m->lo_n,0);\n        m->hi[m->hi_n]=t; sift_up_min(m->hi,m->hi_n); m->hi_n++;\n    } else if (m->hi_n > m->lo_n) {\n        int t=m->hi[0]; m->hi[0]=m->hi[--m->hi_n]; sift_down_min(m->hi,m->hi_n,0);\n        m->lo[m->lo_n]=t; sift_up_max(m->lo,m->lo_n); m->lo_n++;\n    }\n}\ndouble median_get(const median_t *m) {\n    if (m->lo_n==0) return 0.0;\n    if (m->lo_n==m->hi_n) return (m->lo[0]+m->hi[0])/2.0;\n    return (double)m->lo[0];\n}", "explanation_ko": "PATTERN: two heaps balancing the median. 작은 절반의 최댓값과 큰 절반의 최솟값이 항상 중앙 경계. 삽입 후 크기 차를 1 이하로 재균형 -> add O(log n), 조회 O(1). 정렬배열 재삽입 O(n) 대비 큰 이득.", "complexity": "add O(log n), get O(1), O(n) space", "pitfalls": ["재균형 조건 비대칭(lo_n>=hi_n 규약) 깨짐", "짝수개 평균 시 정수 나눗셈으로 오차", "고정 용량 배열 오버플로(임베디드는 용량 상한 필요)"], "anduril_context": "센서 스트림의 노이즈 강건 온라인 필터(중앙값), 실시간 통계 대시보드 갱신."}]}, {"id": "15_graphs", "order": 15, "range": "Graphs", "icon": "🕸️", "track": "dsa", "title_en": "Graphs", "title_ko": "그래프", "summary_ko": "인접 리스트 그래프 구축부터 BFS/DFS(재귀·반복), 연결 요소, 섬의 개수(그리드), 위상 정렬(Kahn), Union-Find(DSU), Dijkstra, 방향 그래프 사이클 검출(3색)까지. 모두 STL 없이 C11 인라인 큐/스택으로 구현.", "summary_en": "From building an adjacency-list graph through BFS/DFS (recursive and iterative), connected components, number of islands (grid), topological sort (Kahn), Union-Find (DSU), Dijkstra, and directed-cycle detection (3-color) - all in C11 with inline queues/stacks, no STL.", "anduril_relevance_ko": "로보틱스/방산 펌웨어의 핵심 문제들이 그래프로 환원된다: BFS/DFS는 상태공간·메시 네트워크 탐색, Dijkstra는 경로계획/라우팅, 위상 정렬은 태스크 의존성 순서, Union-Find는 실시간 클러스터링/연결 판정. 인터뷰어는 인접 리스트를 C로 직접 짜고 큐/스택을 인라인으로 구현하며 비연결·빈 그래프·자기루프 경계를 안전하게 다루는지로 실력을 가늠한다. 문제은행 최대의 공백이라 철저히 다룬다.", "concepts": [{"term": "adjacency list", "ko": "정점별 (to,w) 간선 연결 리스트, 희소 그래프 표준", "en": "per-vertex linked list of (to,w) edges; standard for sparse graphs"}, {"term": "BFS (array queue)", "ko": "FIFO 큐, enqueue 시점 visited 표시, 최단 홉", "en": "FIFO queue, mark visited at enqueue, shortest hop count"}, {"term": "DFS recursive vs iterative", "ko": "콜스택 vs 명시 스택, 이웃 역순 push 로 순서 일치", "en": "call stack vs explicit stack; reverse-push neighbors to match order"}, {"term": "connected components", "ko": "미방문 정점마다 BFS/DFS 1회", "en": "one BFS/DFS per unvisited vertex; count"}, {"term": "flood fill (grid)", "ko": "그리드 암묵 그래프, 방문한 1을 0으로", "en": "implicit grid graph; sink visited land to water"}, {"term": "topological sort (Kahn)", "ko": "진입차수 0 부터 벗겨내기, cnt\u003cn 면 사이클", "en": "peel indegree-0 vertices; cnt\u003cn means a cycle"}, {"term": "union-find (DSU)", "ko": "경로압축 + 랭크, 사실상 상수시간", "en": "path compression + union by rank; near-constant time"}, {"term": "Dijkstra (array O(V^2))", "ko": "미확정 최소 dist 선택 + relax, 음수 금지", "en": "pick min-dist unvisited + relax; no negative weights"}, {"term": "3-color DFS cycle", "ko": "GRAY 재방문(back edge) = 방향 사이클", "en": "a back edge to a GRAY vertex means a directed cycle"}], "study_note_md": "# 15. 그래프 (Graphs: 인접 리스트 · BFS/DFS · DSU · Dijkstra) 🕸️\n\n> 기존 문제은행의 **가장 큰 공백**. 트리/리스트를 넘어 \"임의의 연결\"을 다루는 순간\n> 그래프다. Anduril류 로보틱스/방산 펌웨어에서 **상태공간 탐색, 메시 네트워크,\n> 경로계획, 태스크 의존성, 실시간 클러스터링**이 전부 그래프 문제로 환원된다.\n\n---\n\n## 왜 Anduril 펌웨어/로보틱스 인터뷰에 나오나\n\n- **BFS/DFS → 상태공간·메시 네트워크 탐색**: 도달 가능한 상태/노드 열거, 스웜(swarm)\n  메시에서 특정 기체까지 도달성 판정, 그리드 맵 플러드필(점유격자 영역 라벨링).\n- **Dijkstra → 경로계획/라우팅**: 양수 가중치(거리/지연/에너지) 위 최소비용 경로.\n  드론 웨이포인트, 라디오 메시 라우팅, 최소 지연 링크 선택.\n- **위상 정렬 → 태스크 의존성 순서**: 부팅 시퀀스, 캘리브레이션 단계, 빌드/센서 초기화\n  의존 그래프. 순환이 있으면 데드락 → topo 실패로 조기 진단.\n- **Union-Find → 실시간 클러스터링/연결 판정**: 센서 융합에서 같은 물체로 묶기,\n  무향 그래프 사이클 검출, 네트워크 파티션 감지.\n- 인터뷰어는 **인접 리스트를 STL 없이 C 로 직접 짜고**, 큐/스택을 인라인으로 구현하며,\n  포인터/경계(비연결·빈 그래프·자기 루프)를 안전하게 다루는지로 실력을 가늠한다.\n\n---\n\n## 그래프 표현: 인접 리스트 vs 행렬\n\n| 표현 | 공간 | 간선 존재 확인 | 이웃 순회 | 언제 |\n|------|------|----------------|-----------|------|\n| 인접 리스트 | O(V+E) | O(deg) | O(deg) | **희소 그래프(대부분)**, 임베디드 기본 |\n| 인접 행렬 | O(V²) | O(1) | O(V) | 조밀 그래프, V 작고 간선 잦은 조회 |\n\n이 은행은 **인접 리스트**를 표준으로 쓴다. 각 정점이 `(to, w)` 간선 노드의 단일 연결\n리스트를 가진다. **꼬리에 append** 하여 삽입 순서를 보존 → BFS/DFS 방문 순서가 결정론적.\n\n```c\ntypedef struct edge { int to; int w; struct edge *next; } edge_t;\ntypedef struct { int n; bool directed; edge_t *adj[MAXV]; } graph_t;\n\nvoid graph_add_edge(graph_t *g, int u, int v, int w) {\n    add_directed_edge(g, u, v, w);              // u -> v 꼬리 append\n    if (!g->directed) add_directed_edge(g, v, u, w);  // 무향이면 반대도\n}\n```\n\n---\n\n## 핵심 개념 치트시트\n\n| 개념 | 한 줄 요약 | 복잡도 |\n|------|-----------|--------|\n| BFS (배열 큐) | 넣을 때 visited 표시, FIFO. 최단 홉 수. | O(V+E) |\n| DFS 재귀 | visited 후 이웃 재귀. 전위 순서. | O(V+E) |\n| DFS 반복 (배열 스택) | 이웃 **역순** push → 재귀와 동일 순서. | O(V+E) |\n| 연결 요소 | 미방문마다 BFS/DFS 1회 → 카운트. | O(V+E) |\n| num_islands | 그리드 플러드필, 방문한 1 을 0 으로. | O(R·C) |\n| 위상 정렬(Kahn) | indegree 0 부터 벗겨내기. cnt\u003cn → 사이클. | O(V+E) |\n| Union-Find | find 경로압축 + union 랭크 ≈ 상수시간. | ~O(α) |\n| Dijkstra (배열) | 미확정 최소 dist 선택 + relax. | O(V²) |\n| 방향 사이클(3색) | GRAY 재방문 = back edge = 사이클. | O(V+E) |\n\n---\n\n## BFS: 배열 큐로 최단 홉\n\n```c\nint bfs(const graph_t *g, int src, int *out) {\n    bool visited[MAXV] = {false};\n    int q[MAXV], qh = 0, qt = 0, cnt = 0;\n    visited[src] = true; q[qt++] = src;      // 넣을 때 표시(중복 방지)\n    while (qh \u003c qt) {\n        int u = q[qh++];                     // dequeue\n        out[cnt++] = u;\n        for (edge_t *e = g->adj[u]; e; e = e->next)\n            if (!visited[e->to]) { visited[e->to] = true; q[qt++] = e->to; }\n    }\n    return cnt;\n}\n```\n\n- **visited 는 반드시 enqueue 시점에** 표시한다. dequeue 시점에 표시하면 같은 정점이\n  큐에 여러 번 들어가 O(V²)/무한 위험.\n- 각 정점이 큐에 한 번만 → 배열 큐 크기 `MAXV` 로 충분(동적할당 불필요, 임베디드 친화).\n- 비가중 그래프의 **최단 경로(홉 수)** = BFS 레벨.\n\n## DFS: 재귀와 반복이 같은 순서를 내려면\n\n```c\n// 반복: 이웃을 임시배열에 모아 역순 push → pop 시 원래 순서로 방문 → 재귀와 일치\nint nbr[MAXV], m = 0;\nfor (edge_t *e = g->adj[u]; e; e = e->next) nbr[m++] = e->to;\nfor (int i = m - 1; i >= 0; --i)\n    if (!visited[nbr[i]]) { visited[nbr[i]] = true; st[sp++] = nbr[i]; }\n```\n\n- 재귀 DFS 는 콜스택을 쓴다 → **깊은 그래프에서 스택 오버플로** 위험(임베디드에서 특히).\n  명시적 스택 반복 버전이 안전.\n- 이웃 **역순 push** 가 포인트: 그냥 순서대로 넣으면 마지막 이웃부터 방문된다.\n\n---\n\n## 위상 정렬 (Kahn's BFS)\n\n```c\nint indeg[MAXV] = {0};\nfor (u) for (e in adj[u]) indeg[e->to]++;     // 진입차수 계산\nfor (v) if (indeg[v]==0) q[qt++] = v;         // 시작점 = 진입차수 0\nwhile (queue) {\n    u = dequeue; out[cnt++] = u;\n    for (e in adj[u]) if (--indeg[e->to] == 0) enqueue(e->to);\n}\nreturn (cnt == n) ? cnt : -1;                 // cnt \u003c n → 사이클\n```\n\n- **cnt \u003c n 이면 사이클** → 위상 순서 자체가 존재하지 않음. 부팅/의존성 그래프의\n  순환 의존을 이걸로 조기 검출.\n- 결과 순서는 큐에서 꺼내는 순서에 따라 여러 개일 수 있다(유효하기만 하면 됨).\n\n## Union-Find (DSU): 경로 압축 + 랭크\n\n```c\nint dsu_find(dsu_t *d, int x) {\n    while (d->parent[x] != x) {\n        d->parent[x] = d->parent[d->parent[x]];  // 경로 절반 압축\n        x = d->parent[x];\n    }\n    return x;\n}\nbool dsu_union(dsu_t *d, int a, int b) {\n    int ra = dsu_find(d,a), rb = dsu_find(d,b);\n    if (ra == rb) return false;                   // 이미 같은 집합(사이클 신호)\n    if (d->rank_[ra] \u003c d->rank_[rb]) swap(ra, rb);\n    d->parent[rb] = ra;\n    if (d->rank_[ra] == d->rank_[rb]) d->rank_[ra]++;\n    d->count--; return true;\n}\n```\n\n- 두 최적화(경로 압축 + 랭크)로 amortized **거의 상수시간**(역아커만 α).\n- `union` 이 `false` 를 반환 = 두 정점이 이미 연결 = **무향 그래프 사이클**. 크루스칼\n  MST, 실시간 클러스터 병합에 직접 쓰인다.\n\n## Dijkstra (배열 기반 O(V²))\n\n```c\nfor (i) dist[i] = INF;  dist[src] = 0;\nfor (V번) {\n    u = 미확정 중 dist 최소 정점;   // 선형 탐색 O(V)\n    if (u == -1) break;             // 남은 게 모두 도달 불가(INF)\n    done[u] = true;\n    for (e in adj[u])\n        if (!done[e->to] && dist[u] + e->w \u003c dist[e->to])\n            dist[e->to] = dist[u] + e->w;   // relax\n}\n```\n\n- **음수 가중치 금지** — 확정한 정점을 다시 안 보므로 음수 간선이 있으면 틀린다\n  (그 경우 Bellman-Ford).\n- 배열 버전 O(V²) 는 **힙 없이** 구현 → 소형/조밀 그래프와 결정론적 임베디드에 적합.\n  큰 희소 그래프는 이진 힙으로 O(E log V).\n- 도달 불가 정점은 `INF` 로 남는다.\n\n## 방향 그래프 사이클 검출 (3색 DFS)\n\n- `WHITE`(미방문) → `GRAY`(현재 재귀 스택) → `BLACK`(완료).\n- DFS 중 **GRAY 정점으로 가는 간선(back edge)** 을 만나면 사이클. self-loop 도 사이클.\n- 무향 그래프 사이클은 3색이 아니라 **DSU** 또는 \"부모 아닌 방문 정점\" 규칙으로.\n\n---\n\n## 함정 & 임베디드 주의점\n\n- **BFS visited 타이밍**: enqueue 시점에 표시하지 않으면 중복 삽입 → 성능/정확성 붕괴.\n- **DFS 재귀 깊이**: 깊은 그래프에서 콜스택 오버플로. 명시적 스택 반복이 안전.\n- **DFS 반복 순서**: 이웃을 역순 push 하지 않으면 재귀와 순서가 달라진다.\n- **Dijkstra 음수 간선**: 틀린 답. 반드시 비음수 가정 확인.\n- **오버플로**: `dist[u] + w` 에서 `dist[u]==INF` 면 오버플로. 선택된 정점만 relax 하도록\n  가드(선택 시 이미 유한 보장) 또는 `INF` 체크.\n- **비연결/빈 그래프**: 연결 요소는 정점 수만큼, 빈 그래프도 크래시 없이. 시작점 하나만으로\n  전체를 다 도는 코드는 비연결 그래프에서 일부만 방문한다(모든 정점 루프 필요).\n- **자기 루프(self-loop)**: 무향 요소 계산엔 영향 없지만 방향 사이클 검출엔 즉시 true.\n- **정적 상한(MAXV)**: 임베디드에선 동적할당 대신 컴파일 타임 상한 배열이 흔하다. 큐/스택도\n  정점 수 상한으로 정적 확보 → 힙 0, 결정론적.\n\n---\n\n## 복잡도 요약\n\n| 알고리즘 | 시간 | 공간 |\n|----------|------|------|\n| build adjacency (E 간선) | O(E·평균deg) append / O(E) 앞삽입 | O(V+E) |\n| BFS / DFS | O(V+E) | O(V) |\n| connected components | O(V+E) | O(V) |\n| num_islands (R×C) | O(R·C) | O(R·C) |\n| topological sort (Kahn) | O(V+E) | O(V) |\n| union / find | ~O(α(N)) amortized | O(V) |\n| Dijkstra (배열) | O(V²) | O(V) |\n| Dijkstra (이진 힙) | O(E log V) | O(V) |\n| 방향 사이클 (3색 DFS) | O(V+E) | O(V) |\n", "problems": [{"num": 1, "slug": "build_adjacency_list", "title_ko": "인접 리스트 구축", "title_en": "Build adjacency list", "difficulty": "easy", "tags": ["graph", "adjacency-list", "representation"], "prompt_ko": "정점 n 개 그래프에 간선 (u,v,w) 를 추가한다. 각 정점은 (to,w) 간선 노드의 연결 리스트를 가진다. 꼬리 append 로 삽입 순서를 보존하고, 무향이면 양방향(u->v, v->u)을 모두 추가한다.", "prompt_en": "Add edge (u,v,w) to an n-vertex graph. Each vertex holds a linked list of (to,w) edge nodes; append at the tail to preserve insertion order, and for an undirected graph add both directions.", "signature": "void graph_add_edge(graph_t *g, int u, int v, int w);", "examples": [{"in": "n=6 undirected; add (0,1),(0,2)", "out": "adj[0] = 1 -> 2, adj[1] = 0, adj[2] = 0"}], "hints": ["edge_t 를 malloc 해 (to,w) 세팅.", "이중 포인터 pp 로 꼬리(NULL 슬롯)까지 이동 후 *pp = new.", "무향이면 add_directed_edge 를 두 번 호출(양방향)."], "solution": "typedef struct edge { int to; int w; struct edge *next; } edge_t;\ntypedef struct { int n; bool directed; edge_t *adj[MAXV]; } graph_t;\n\nstatic void add_directed_edge(graph_t *g, int u, int v, int w) {\n    edge_t *e = malloc(sizeof *e);\n    if (!e) return;\n    e->to = v; e->w = w; e->next = NULL;\n    edge_t **pp = &g->adj[u];        // 이중 포인터로 꼬리 슬롯 추적\n    while (*pp) pp = &(*pp)->next;\n    *pp = e;                         // 삽입 순서 보존(append)\n}\nvoid graph_add_edge(graph_t *g, int u, int v, int w) {\n    if (u \u003c 0 || u >= g->n || v \u003c 0 || v >= g->n) return;\n    add_directed_edge(g, u, v, w);\n    if (!g->directed) add_directed_edge(g, v, u, w);\n}", "explanation_ko": "PATTERN: 인접 리스트 = 정점별 간선 연결 리스트. 꼬리 append 로 삽입 순서를 보존하면 BFS/DFS 방문 순서가 결정론적이 된다. 무향은 대칭이라 양방향을 모두 넣는다. 복잡도: 간선당 append O(deg(u)) (앞삽입이면 O(1)이나 순서가 뒤집힘), 전체 공간 O(V+E).", "complexity": "add: O(deg) tail-append (or O(1) head-insert); space O(V+E)", "pitfalls": ["u/v 범위 가드 누락 -> 배열 밖 접근", "무향인데 한 방향만 추가", "malloc 실패(NULL) 미처리", "앞삽입 사용 시 이웃 순서가 역전됨을 인지 못함"], "anduril_context": "노드=기체/상태/태스크, 간선=통신 링크/전이/의존. 희소 그래프라 행렬(O(V^2)) 대신 인접 리스트가 임베디드 표준."}, {"num": 2, "slug": "bfs", "title_ko": "BFS (소스에서 방문 순서)", "title_en": "BFS from a source", "difficulty": "easy", "tags": ["graph", "bfs", "queue"], "prompt_ko": "소스 정점에서 너비 우선 탐색(BFS)으로 방문 순서를 out 에 채우고 방문한 정점 수를 반환한다. 인라인 배열 큐를 쓰고, visited 는 큐에 넣는 시점에 표시한다.", "prompt_en": "Do a breadth-first search from a source, filling out with the visit order and returning the count. Use an inline array queue and mark visited at enqueue time.", "signature": "int bfs(const graph_t *g, int src, int *out);", "examples": [{"in": "undirected 0-1,0-2,1-3,2-3; src=0", "out": "0,1,2,3 (count 4)"}], "hints": ["배열 큐 q[MAXV] 와 head/tail 인덱스.", "각 정점은 한 번만 큐에 들어가므로 크기 MAXV 로 충분.", "visited 를 dequeue 가 아니라 enqueue 시점에 표시."], "solution": "int bfs(const graph_t *g, int src, int *out) {\n    bool visited[MAXV] = {false};\n    int q[MAXV], qh = 0, qt = 0, cnt = 0;\n    visited[src] = true; q[qt++] = src;      // 넣을 때 표시\n    while (qh \u003c qt) {\n        int u = q[qh++];\n        out[cnt++] = u;\n        for (edge_t *e = g->adj[u]; e; e = e->next)\n            if (!visited[e->to]) { visited[e->to] = true; q[qt++] = e->to; }\n    }\n    return cnt;\n}", "explanation_ko": "PATTERN: FIFO 큐로 레벨 순서 탐색. visited 를 enqueue 시점에 표시해야 같은 정점의 중복 삽입을 막는다(안 하면 O(V^2)/무한 위험). 비가중 그래프에서 BFS 레벨 = 최단 홉 수. 복잡도: O(V+E) 시간, O(V) 공간.", "complexity": "O(V+E) time, O(V) space", "pitfalls": ["visited 를 dequeue 시점에 표시 -> 중복 삽입", "큐 크기 부족", "비연결 그래프에서 src 컴포넌트만 방문됨(의도 확인)"], "anduril_context": "메시 네트워크 도달성/최소 홉, 상태공간 레벨 탐색, 점유격자 영역 확장."}, {"num": 3, "slug": "dfs", "title_ko": "DFS (재귀 + 스택 반복)", "title_en": "DFS (recursive + iterative)", "difficulty": "medium", "tags": ["graph", "dfs", "stack", "recursion"], "prompt_ko": "깊이 우선 탐색을 재귀와 명시적 스택 반복 두 가지로 구현한다. 두 방식이 같은 전위(preorder) 순서를 내야 한다. 반복 버전은 이웃을 역순으로 push 한다.", "prompt_en": "Implement DFS both recursively and iteratively with an explicit stack; both must produce the same preorder. The iterative version pushes neighbors in reverse.", "signature": "int dfs_recursive(const graph_t *g, int src, int *out);\nint dfs_iterative(const graph_t *g, int src, int *out);", "examples": [{"in": "undirected 0-1,0-2,1-3,2-3; src=0", "out": "0,1,3,2 (both)"}], "hints": ["재귀: visited 표시 후 이웃마다 재귀.", "반복: 이웃을 임시배열에 모아 역순으로 push.", "반복에서도 push 시점에 visited 표시하면 스택 크기 MAXV 로 충분."], "solution": "// 재귀\nstatic void dfs_visit(const graph_t *g, int u, bool *vis, int *out, int *cnt) {\n    vis[u] = true; out[(*cnt)++] = u;\n    for (edge_t *e = g->adj[u]; e; e = e->next)\n        if (!vis[e->to]) dfs_visit(g, e->to, vis, out, cnt);\n}\nint dfs_recursive(const graph_t *g, int src, int *out) {\n    bool vis[MAXV] = {false}; int cnt = 0;\n    dfs_visit(g, src, vis, out, &cnt);\n    return cnt;\n}\n// 반복 (명시적 스택, 이웃 역순 push -> 재귀와 동일 순서)\nint dfs_iterative(const graph_t *g, int src, int *out) {\n    bool vis[MAXV] = {false}; int st[MAXV], sp = 0, cnt = 0;\n    vis[src] = true; st[sp++] = src;\n    while (sp > 0) {\n        int u = st[--sp]; out[cnt++] = u;\n        int nbr[MAXV], m = 0;\n        for (edge_t *e = g->adj[u]; e; e = e->next) nbr[m++] = e->to;\n        for (int i = m - 1; i >= 0; --i)\n            if (!vis[nbr[i]]) { vis[nbr[i]] = true; st[sp++] = nbr[i]; }\n    }\n    return cnt;\n}", "explanation_ko": "PATTERN: 재귀 DFS 는 콜스택을 쓰고, 반복 DFS 는 명시적 스택을 쓴다. 이웃을 역순으로 push 해야 pop 시 원래 순서로 방문되어 재귀와 일치한다. 임베디드에선 깊은 그래프의 콜스택 오버플로를 피하려 반복 버전을 선호. 복잡도: O(V+E) 시간, O(V) 공간.", "complexity": "O(V+E) time, O(V) space (재귀는 콜스택 O(V))", "pitfalls": ["재귀 깊이 -> 스택 오버플로(깊은 그래프)", "반복에서 이웃을 정순 push -> 재귀와 순서 불일치", "visited 표시 시점 실수로 중복 방문"], "anduril_context": "상태공간 백트래킹, 의존성 도달 경로 추적, 미로/맵 완전 탐색."}, {"num": 4, "slug": "connected_components", "title_ko": "연결 요소 개수", "title_en": "Count connected components", "difficulty": "easy", "tags": ["graph", "bfs", "components", "undirected"], "prompt_ko": "무향 그래프의 연결 요소 개수를 센다. 미방문 정점을 만날 때마다 새 요소를 시작하고 그 요소 전체를 BFS/DFS 로 표시한다.", "prompt_en": "Count connected components in an undirected graph. Each unvisited vertex starts a new component; flood its whole component with BFS/DFS.", "signature": "int connected_components(const graph_t *g);", "examples": [{"in": "0-1,0-2,1-3,2-3 and 4-5 (6 verts)", "out": "2"}], "hints": ["모든 정점을 순회하며 미방문이면 comps++.", "그 정점에서 BFS/DFS 로 컴포넌트 전체 표시.", "빈/비연결 그래프도 크래시 없이."], "solution": "int connected_components(const graph_t *g) {\n    bool visited[MAXV] = {false}; int comps = 0, q[MAXV];\n    for (int s = 0; s \u003c g->n; ++s) {\n        if (visited[s]) continue;\n        ++comps;                              // 새 요소\n        int qh = 0, qt = 0; visited[s] = true; q[qt++] = s;\n        while (qh \u003c qt) {\n            int u = q[qh++];\n            for (edge_t *e = g->adj[u]; e; e = e->next)\n                if (!visited[e->to]) { visited[e->to] = true; q[qt++] = e->to; }\n        }\n    }\n    return comps;\n}", "explanation_ko": "PATTERN: 각 미방문 정점이 새 컴포넌트의 씨앗. BFS/DFS 로 도달 가능한 전부를 방문 표시하고 카운트. Union-Find 로도 가능(간선마다 union 후 서로소 집합 수). 복잡도: O(V+E) 시간, O(V) 공간.", "complexity": "O(V+E) time, O(V) space", "pitfalls": ["모든 정점을 시작점으로 돌지 않아 일부 컴포넌트 누락", "방향 그래프에 그대로 적용(약연결/강연결 개념 다름)", "자기 루프는 요소 수에 영향 없음"], "anduril_context": "네트워크 파티션 감지, 센서 클러스터 개수, 분리된 서브시스템 식별."}, {"num": 5, "slug": "num_islands", "title_ko": "섬의 개수 (2D 그리드)", "title_en": "Number of islands", "difficulty": "medium", "tags": ["grid", "bfs", "dfs", "flood-fill"], "prompt_ko": "rows*cols 평탄 배열 그리드(1=땅,0=물, 4방향 연결)에서 섬(연결된 1 덩어리)의 개수를 센다. 1 을 만나면 카운트하고 인접 1 을 모두 0 으로 지우는 플러드필을 쓴다.", "prompt_en": "Given a rows*cols flat grid (1=land, 0=water, 4-directional), count islands (connected blobs of 1). On hitting a 1, count it and flood-fill its neighbors to 0.", "signature": "int num_islands(int rows, int cols, int *grid);", "examples": [{"in": "4x5 grid with 3 blobs", "out": "3"}], "hints": ["좌표를 int(r*cols+c)로 인코딩해 큐/스택에 담는다.", "방문한 1 을 0 으로 바꿔 재방문 방지(visited 배열 대체).", "상하좌우 4방향 delta 배열 사용."], "solution": "int num_islands(int rows, int cols, int *grid) {\n    if (rows \u003c= 0 || cols \u003c= 0) return 0;\n    int islands = 0, cap = rows * cols;\n    int *q = malloc(sizeof(int) * (size_t)cap);\n    if (!q) return -1;\n    const int dr[4] = {-1,1,0,0}, dc[4] = {0,0,-1,1};\n    for (int r = 0; r \u003c rows; ++r) for (int c = 0; c \u003c cols; ++c) {\n        if (grid[r*cols+c] != 1) continue;\n        ++islands;\n        int qh = 0, qt = 0; grid[r*cols+c] = 0; q[qt++] = r*cols+c;\n        while (qh \u003c qt) {\n            int cell = q[qh++], cr = cell/cols, cc = cell%cols;\n            for (int d = 0; d \u003c 4; ++d) {\n                int nr = cr+dr[d], nc = cc+dc[d];\n                if (nr\u003c0||nr>=rows||nc\u003c0||nc>=cols) continue;\n                if (grid[nr*cols+nc] == 1) { grid[nr*cols+nc] = 0; q[qt++] = nr*cols+nc; }\n            }\n        }\n    }\n    free(q);\n    return islands;\n}", "explanation_ko": "PATTERN: 암묵 그래프(그리드)에서의 연결 요소 = 플러드필. 방문한 땅을 물로 바꾸면 별도 visited 없이 in-place 로 처리 가능. 좌표는 r*cols+c 로 1D 인코딩. 복잡도: O(R*C) 시간, 큐 최악 O(R*C) 공간.", "complexity": "O(R*C) time, O(R*C) space", "pitfalls": ["경계(0..rows, 0..cols) 체크 누락", "대각선까지 연결로 착각(4방향 vs 8방향)", "원본 그리드 파괴 부작용(복사 필요 시 주의)"], "anduril_context": "점유격자(occupancy grid) 영역 라벨링, 장애물/자유공간 세그멘테이션, 표적 픽셀 blob 카운팅."}, {"num": 6, "slug": "topological_sort", "title_ko": "위상 정렬 (Kahn BFS)", "title_en": "Topological sort (Kahn)", "difficulty": "medium", "tags": ["graph", "topological-sort", "kahn", "dag"], "prompt_ko": "방향 그래프(DAG)의 위상 순서를 Kahn 알고리즘(BFS)으로 구한다. 진입차수 0 정점부터 큐에 넣고 하나씩 제거하며 이웃 진입차수를 줄인다. 처리 정점 수가 n 미만이면 사이클이므로 -1 을 반환한다.", "prompt_en": "Compute a topological order of a DAG with Kahn's algorithm (BFS). Queue indegree-0 vertices; on removal decrement neighbors' indegrees. If fewer than n vertices are processed there is a cycle, return -1.", "signature": "int topological_sort(const graph_t *g, int *out);", "examples": [{"in": "5->2,5->0,4->0,4->1,2->3,3->1", "out": "valid order, returns 6"}], "hints": ["indegree 배열 계산(모든 간선 순회).", "indegree 0 정점을 큐에 초기 삽입.", "--indegree 가 0 이 되면 큐에 추가. cnt\u003cn 이면 사이클."], "solution": "int topological_sort(const graph_t *g, int *out) {\n    int indeg[MAXV] = {0};\n    for (int u = 0; u \u003c g->n; ++u)\n        for (edge_t *e = g->adj[u]; e; e = e->next) indeg[e->to]++;\n    int q[MAXV], qh = 0, qt = 0;\n    for (int v = 0; v \u003c g->n; ++v) if (indeg[v] == 0) q[qt++] = v;\n    int cnt = 0;\n    while (qh \u003c qt) {\n        int u = q[qh++]; out[cnt++] = u;\n        for (edge_t *e = g->adj[u]; e; e = e->next)\n            if (--indeg[e->to] == 0) q[qt++] = e->to;\n    }\n    return (cnt == g->n) ? cnt : -1;          // -1 = 사이클\n}", "explanation_ko": "PATTERN: 진입차수 0(선행 없음)부터 벗겨내며 순서를 만든다. 사이클이 있으면 그 안의 정점들은 진입차수가 0 이 되지 못해 처리되지 않는다 -> cnt\u003cn. 유효한 위상 순서는 여러 개일 수 있다. 복잡도: O(V+E) 시간, O(V) 공간.", "complexity": "O(V+E) time, O(V) space", "pitfalls": ["사이클 검사(cnt==n) 누락", "무향 그래프에 적용(위상 순서 정의 안 됨)", "출력 순서 유일성 가정(여러 유효 순서 존재)"], "anduril_context": "부팅/캘리브레이션 시퀀스, 태스크 의존성 스케줄, 빌드/센서 초기화 순서. 순환 의존을 조기 진단."}, {"num": 7, "slug": "union_find", "title_ko": "Union-Find (DSU)", "title_en": "Union-Find (DSU)", "difficulty": "medium", "tags": ["dsu", "union-find", "path-compression", "union-by-rank"], "prompt_ko": "서로소 집합(DSU)을 경로 압축 find 와 랭크 기반 union 으로 구현한다. union 이 이미 같은 집합이면 false(무향 사이클 신호). count 는 현재 집합 수.", "prompt_en": "Implement a disjoint-set (DSU) with path-compression find and union-by-rank. union returns false when the two are already in the same set (an undirected-cycle signal). count tracks the number of sets.", "signature": "void dsu_init(dsu_t *d, int n);\nint dsu_find(dsu_t *d, int x);\nbool dsu_union(dsu_t *d, int a, int b);", "examples": [{"in": "init 6; union(0,1),(1,2),(3,4)", "out": "connected(0,2)=true, count=3"}], "hints": ["init: parent[i]=i, rank=0, count=n.", "find: 루트까지 올라가며 parent[x]=parent[parent[x]] 로 압축.", "union: 랭크 큰 트리 밑에 작은 트리 붙이고 count--."], "solution": "typedef struct { int parent[MAXV]; int rank_[MAXV]; int count; } dsu_t;\nvoid dsu_init(dsu_t *d, int n) {\n    for (int i = 0; i \u003c n; ++i) { d->parent[i] = i; d->rank_[i] = 0; }\n    d->count = n;\n}\nint dsu_find(dsu_t *d, int x) {\n    while (d->parent[x] != x) {\n        d->parent[x] = d->parent[d->parent[x]];   // 경로 압축\n        x = d->parent[x];\n    }\n    return x;\n}\nbool dsu_union(dsu_t *d, int a, int b) {\n    int ra = dsu_find(d, a), rb = dsu_find(d, b);\n    if (ra == rb) return false;                    // 이미 같은 집합\n    if (d->rank_[ra] \u003c d->rank_[rb]) { int t = ra; ra = rb; rb = t; }\n    d->parent[rb] = ra;\n    if (d->rank_[ra] == d->rank_[rb]) d->rank_[ra]++;\n    d->count--;\n    return true;\n}", "explanation_ko": "PATTERN: 각 원소가 트리 노드, 루트가 집합 대표. 경로 압축(find 시 부모를 루트로 당김)과 랭크 기반 합치기(낮은 트리를 높은 트리 밑에)로 amortized 거의 상수시간(역아커만 α). union 이 false = 두 정점이 이미 연결 = 무향 사이클(크루스칼 MST 에 활용). 복잡도: ~O(α(N)) per op.", "complexity": "~O(alpha(N)) amortized per find/union, O(N) space", "pitfalls": ["경로 압축 없이 -> 트리가 선형화되어 O(N)", "랭크/사이즈 없이 union -> 편향 트리", "find 에서 x 갱신 누락으로 무한루프"], "anduril_context": "실시간 센서 융합 클러스터 병합, 네트워크 연결 판정, 무향 그래프 사이클 검출."}, {"num": 8, "slug": "dijkstra", "title_ko": "Dijkstra (음이 아닌 가중치)", "title_en": "Dijkstra (non-negative)", "difficulty": "hard", "tags": ["graph", "dijkstra", "shortest-path", "greedy"], "prompt_ko": "음이 아닌 가중치 그래프에서 소스로부터의 최단 거리를 dist 에 채운다. 배열 기반 O(V^2): 매 스텝 미확정 중 dist 최소 정점을 확정하고 그 간선으로 이웃을 완화(relax). 도달 불가는 INF.", "prompt_en": "Fill dist with shortest distances from a source over non-negative weights. Array-based O(V^2): each step finalize the unvisited vertex with minimum dist and relax its edges. Unreachable stays INF.", "signature": "void dijkstra(const graph_t *g, int src, int *dist);", "examples": [{"in": "0->1(4),0->2(1),2->1(2),1->3(1),2->3(5)", "out": "dist=[0,3,1,4,INF]"}], "hints": ["dist 전부 INF, dist[src]=0.", "매 반복: 미확정 중 최소 dist 정점 선택 -> 확정.", "relax: dist[u]+w \u003c dist[v] 이면 갱신. 선택된 u 만 relax."], "solution": "void dijkstra(const graph_t *g, int src, int *dist) {\n    bool done[MAXV] = {false};\n    for (int i = 0; i \u003c g->n; ++i) dist[i] = INF;\n    dist[src] = 0;\n    for (int it = 0; it \u003c g->n; ++it) {\n        int u = -1, best = INF;\n        for (int v = 0; v \u003c g->n; ++v)\n            if (!done[v] && dist[v] \u003c best) { best = dist[v]; u = v; }\n        if (u == -1) break;                        // 남은 게 도달 불가\n        done[u] = true;\n        for (edge_t *e = g->adj[u]; e; e = e->next)\n            if (!done[e->to] && dist[u] + e->w \u003c dist[e->to])\n                dist[e->to] = dist[u] + e->w;       // relax\n    }\n}", "explanation_ko": "PATTERN: 그리디하게 '가장 가까운 미확정 정점'을 하나씩 확정한다. 확정한 정점은 다시 안 보므로 음수 간선이 있으면 틀린다(Bellman-Ford 필요). 배열 버전은 힙 없이 O(V^2) -> 소형/조밀 그래프와 결정론적 임베디드에 적합. 희소 대형은 이진 힙 O(E log V). 복잡도: O(V^2) 시간, O(V) 공간.", "complexity": "O(V^2) time (array) / O(E log V) with heap, O(V) space", "pitfalls": ["음수 가중치 -> 오답", "dist[u]+w 오버플로(INF 정점 relax 금지)", "확정(done) 정점 재선택", "도달 불가 정점 INF 처리 누락"], "anduril_context": "웨이포인트 경로계획, 라디오 메시 최소지연 라우팅, 에너지/거리 최소 경로."}, {"num": 9, "slug": "detect_cycle_directed", "title_ko": "방향 그래프 사이클 검출 (3색 DFS)", "title_en": "Detect cycle in a directed graph", "difficulty": "medium", "tags": ["graph", "dfs", "cycle-detection", "colors"], "prompt_ko": "방향 그래프에 사이클이 있는지 3색 DFS 로 판정한다. WHITE/GRAY/BLACK 로 정점을 칠하고, DFS 중 GRAY 정점으로 가는 간선(back edge)을 만나면 사이클. 모든 정점을 시작점으로 시도한다.", "prompt_en": "Detect a cycle in a directed graph using 3-color DFS. Color vertices WHITE/GRAY/BLACK; a back edge to a GRAY vertex means a cycle. Try every vertex as a start.", "signature": "bool detect_cycle_directed(const graph_t *g);", "examples": [{"in": "0->1->2->0", "out": "true"}, {"in": "DAG 5->2->3->1", "out": "false"}], "hints": ["WHITE=미방문, GRAY=현재 재귀 스택, BLACK=완료.", "이웃이 GRAY 면 back edge -> 사이클.", "비연결 대비 모든 WHITE 정점에서 DFS 시작."], "solution": "enum { WHITE = 0, GRAY = 1, BLACK = 2 };\nstatic bool dfs_cycle(const graph_t *g, int u, int *color) {\n    color[u] = GRAY;\n    for (edge_t *e = g->adj[u]; e; e = e->next) {\n        if (color[e->to] == GRAY) return true;     // back edge -> 사이클\n        if (color[e->to] == WHITE && dfs_cycle(g, e->to, color)) return true;\n    }\n    color[u] = BLACK;\n    return false;\n}\nbool detect_cycle_directed(const graph_t *g) {\n    int color[MAXV] = {WHITE};\n    for (int s = 0; s \u003c g->n; ++s)\n        if (color[s] == WHITE && dfs_cycle(g, s, color)) return true;\n    return false;\n}", "explanation_ko": "PATTERN: 진입 시 GRAY, 완료 시 BLACK 으로 칠한다. 현재 재귀 경로(GRAY) 상의 정점으로 되돌아가는 간선(back edge)이 곧 사이클. self-loop 도 사이클(자기 자신이 GRAY). 무향 사이클은 3색이 아니라 DSU 나 부모 규칙으로 판정한다. 복잡도: O(V+E) 시간, O(V) 공간.", "complexity": "O(V+E) time, O(V) space", "pitfalls": ["BLACK 정점을 사이클로 오인(이미 완료된 정점 방문은 정상)", "무향 그래프에 3색 그대로 적용", "모든 정점을 시작점으로 안 돌아 비연결 사이클 누락"], "anduril_context": "태스크/의존성 순환(데드락) 진단, 상태기계 무한 루프 검출, 위상 정렬 실패 원인 분석."}]}, {"id": "16_dynamic_programming", "order": 16, "range": "DP", "icon": "📐", "track": "dsa", "title_en": "Dynamic Programming", "title_ko": "동적 계획법", "summary_ko": "계단 오르기/도둑질부터 동전 교환, LIS, 0/1 배낭, 편집 거리, LCS, 격자 경로, 최대 곱 부분배열까지 bottom-up 1D/2D 테이블 DP 9선. 상태·전이·기저·순서의 4단계 사고 프레임워크가 핵심.", "summary_en": "Nine bottom-up 1D/2D table DP problems: climbing stairs, house robber, coin change, LIS, 0/1 knapsack, edit distance, LCS, unique paths, and max product subarray. The state/transition/base/order 4-step framework is the core.", "anduril_relevance_ko": "DP는 펌웨어에서 자원·전력·대역폭의 최적 배분(0/1 배낭), 잡음 명령의 퍼지 매칭(편집 거리), 델타 OTA 업데이트 diff(LCS)로 직결된다. 특히 bottom-up + 고정 크기 테이블은 재귀 스택 폭주 없이 최악 지연/메모리가 컴파일 타임에 확정되어 안전필수(safety-critical) 코드에 적합하다. 인터뷰어는 상태 정의와 점화식을 얼마나 빨리 세우는지로 문제 해결력을 가늠한다.", "concepts": [{"term": "state definition", "ko": "dp[i]/dp[i][j]가 '무엇의 답'인지 한 문장으로", "en": "pin down exactly what dp[i]/dp[i][j] answers"}, {"term": "recurrence / transition", "ko": "마지막 선택 기준으로 작은 dp로 표현", "en": "express dp from smaller subproblems by the last choice"}, {"term": "base case", "ko": "n=0,1/빈 문자열/dp[0]을 직접 채움", "en": "fill smallest inputs directly (n=0,1, empty)"}, {"term": "evaluation order", "ko": "의존값이 먼저 계산되도록 루프 방향 결정", "en": "loop so dependencies are computed first"}, {"term": "rolling array", "ko": "앞 1~2 상태만 참조하면 O(1)/O(W) 공간", "en": "keep only prev states to shrink memory"}, {"term": "1D knapsack loop direction", "ko": "내림차순=0/1, 오름차순=무제한", "en": "descending c gives 0/1, ascending gives unbounded"}, {"term": "2D string DP (LCS/edit)", "ko": "대각선 일치가 핵심, C에선 i*W+j로 flatten", "en": "diagonal match is key; flatten as i*W+j in C"}, {"term": "min/max pair tracking", "ko": "음수 곱 대비 최소값도 함께 추적", "en": "track min alongside max for sign flips"}], "study_note_md": "# 16. 동적 계획법 (Dynamic Programming) — Q1~Q9 📐\n\n> DP는 \"큰 문제를 작은 겹치는 부분문제로 쪼개, 답을 표(table)에 저장해 재사용\"하는 기법이다.\n> 펌웨어 엔지니어에게 DP는 **자원/전력/대역폭의 최적 배분**(knapsack), **명령 퍼지 매칭**\n> (edit distance), **델타 업데이트 diff**(LCS)로 직결된다. 오랜만이면 아래 **4단계 프레임워크**만\n> 몸에 익히면 대부분의 문제가 풀린다.\n\n---\n\n## DP 접근 4단계 (매 문제 이 순서로 생각하라)\n\n1. **상태 정의 (State)** — `dp[i]` 또는 `dp[i][j]` 가 *정확히 무엇의 답*인지 한 문장으로 적는다.\n   - \"dp[i] = i번째 원소로 끝나는 ...의 최대 길이\" 처럼 *끝나는/이하/까지* 를 명확히.\n   - 상태를 잘못 잡으면 점화
