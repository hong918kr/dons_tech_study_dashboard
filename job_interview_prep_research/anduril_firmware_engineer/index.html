 블로킹/긴 루프 하나가 전체를 멈춘다. → 상태 머신으로 잘게 쪼개는 습관.\n- period=1,2,3 을 6 tick 돌리면 6,3,2 회 실행. 결정론적.\n- **RTOS 와 차이**: 우선순위/선점/블로킹이 없다. 단순·결정론적·저오버헤드가 장점.\n\n---\n\n## (Q98) ISR ↔ main 공유 자원 — 레이스와 수정\n\n### 레이스는 진짜다 (재현)\n\n```c\nuint32_t tmp = shared.value;   // main 이 0 을 읽음\n/* --- 여기서 ISR 발생: shared.value += 100  → 100 --- */\nshared.value = tmp + 1;        // main 이 1 을 씀 → ISR 의 +100 유실!\n```\n\nRMW(read-modify-write)는 원자적이지 않다. 읽기와 쓰기 사이에 ISR 이 끼면 갱신이 사라진다.\n\n### 해법 A — 임계구역(인터럽트 마스킹), 중첩 안전 관용구\n\n```c\nuint32_t s = irq_save();   // prev = PRIMASK; __disable_irq(); return prev;\n/* 임계구역: 이 사이엔 ISR 이 못 들어온다 (RMW 불가분) */\nshared.value++;\nirq_restore(s);            // PRIMASK = prev  ← 무조건 enable 이 아니라 \"이전 값\"!\n```\n\n- **왜 save/restore 인가**: 무조건 `enable` 로 복원하면, 이미 마스킹된 상위 구역에서\n  호출했을 때 임계구역을 조기에 열어버린다. 이전 값 복원이라야 **중첩(nesting) 안전**.\n- 임계구역은 **최대한 짧게**. 길면 인터럽트 지연(Q100)이 늘어난다.\n\n### 해법 B — `_Atomic` (단일 워드)\n\n```c\natomic_fetch_add_explicit(&counter, 1, memory_order_relaxed);\n```\n\n- 카운터 하나 증가처럼 **단일 워드 RMW** 는 원자 연산 하나로 끝. 멀티코어에서도 안전.\n- 여러 변수의 일관성(불변식)을 지켜야 하면 원자 하나로는 부족 → 임계구역/락 필요.\n- 단일코어 베어메탈에서 ISR↔main 한 워드 공유는 `volatile` + \"쓰기 순서 보장\"으로도\n  전통적으로 충분하지만, 멀티코어/컴파일러 재정렬을 고려하면 `_Atomic` 이 이식성 정답.\n\n---\n\n## (Q99) 우선순위 역전 & 상속/천장\n\n### 무엇이 문제인가\n\n우선순위 H > M > L (단일 CPU, 선점형).\n\n1. L 이 공유자원 R 을 잠그고 임계구역 실행 중.\n2. H 가 R 을 원해 **블록**됨 (L 보유).\n3. R 과 **무관한** M 이 ready → M(2) > L(1) 이라 M 이 L 을 선점.\n4. → H 는 M 이 끝날 때까지 대기. **중간 우선순위가 고우선순위를 무한정 지연**(역전!).\n\n> 실제 사례: **1997 Mars Pathfinder** 가 이 버그로 반복 리셋. VxWorks 의 우선순위\n> 상속을 켜서 원격 패치로 해결.\n\n### 해법 1 — 우선순위 상속 (Priority Inheritance)\n\n```c\nint pi_effective_priority(int base, const int *waiters, size_t n) {\n    int eff = base;\n    for (size_t i = 0; i \u003c n; ++i) if (waiters[i] > eff) eff = waiters[i];\n    return eff;   // 보유자를 \"최고 대기자\" 우선순위로 일시 승격\n}\n```\n\n- L 이 H 의 우선순위를 물려받아 M 보다 높아짐 → L 이 즉시 R 을 마치고 반납 → H 진행.\n- H 의 대기 시간이 **\"L 의 임계구역 잔여분\"으로 경계**된다 (bounded).\n- 본 세트의 `simulate_h_finish()`: 상속 없음이면 H 가 **11 tick**에, 상속이면 **6 tick**에\n  완료 → 역전이 정량적으로 사라짐을 보인다.\n\n### 해법 2 — 우선순위 천장 (Priority Ceiling Protocol)\n\n```c\nint pcp_ceiling(const int *user_prios, size_t n);  // 자원 사용 태스크 중 최고 우선순위\n```\n\n- 자원을 잠그는 순간 보유자를 **자원의 천장 우선순위**로 즉시 올린다.\n- 상속보다 강한 보장: **교착(deadlock) 예방** + 태스크당 최대 1회 블로킹(chained blocking 방지).\n\n---\n\n## (Q100) 인터럽트 지연 (Interrupt Latency)\n\n```c\nworst_case = sync            // 현재 명령/파이프라인 동기화 완료\n           + disable_window  // 인터럽트가 disable 됐던 최장 임계구역  ← 우리가 통제!\n           + higher_isr      // 먼저 처리되는 상위/동급 우선순위 ISR 합\n           + context_save    // CPU 상태 스태킹(문맥 저장)\n           + isr_prologue;   // 벡터 페치 + 핸들러 진입\n```\n\n- **줄일 수 있는 가장 큰 레버 = `disable_window`**: 임계구역(인터럽트 마스킹 구간)을\n  짧게. `max_disable_window()` 로 여러 임계구역 중 최장을 찾아 그게 경계값이 된다.\n- ISR 은 **짧게**: 무거운 일은 플래그만 세우고 main/하위 우선순위로 defer (top/bottom half).\n- 실시간 검증: `worst_case + ISR_실행시간 \u003c= deadline` (`meets_deadline`).\n- **오버플로 주의**: 기여 요소 합산은 포화 덧셈(saturating)으로 UB 회피.\n- 측정 팁: 단조 시계(`CLOCK_MONOTONIC`)로 임계구역/ISR 길이를 실측해 경계를 근거화.\n  (실 타깃에선 GPIO 토글 + 로직 애널라이저, DWT 사이클 카운터 사용)\n\n---\n\n## (Q101) 메모리맵 레지스터 접근 — `volatile`\n\n```c\n#define UART_SR (*(volatile uint32_t *)0x40011000u)   // 실제 타깃\nwhile (!(UART_SR & TXE)) { }   // volatile 없으면 컴파일러가 \"안 변하는 값\"으로 보고\n                               // 조건을 한 번만 읽어 무한루프로 최적화!  ← 대표 버그\n```\n\n- `volatile` = \"이 메모리는 내가 모르는 사이 바뀔 수 있다\" → 컴파일러가 **매 접근마다\n  실제 메모리를 읽고/쓰고, 순서를 유지, 제거하지 않음**.\n- 필드 수정(RMW)은 **읽고-마스크-쓰기**: `v &= ~mask; v |= (val\u003c\u003cshift)&mask;`\n  (shift ≥ 32 은 UB → 반드시 가드).\n- **함정**: `volatile` 은 원자성/메모리배리어를 보장하지 **않는다**. ISR 공유엔\n  `volatile` + 임계구역/`_Atomic` 을 함께 써야 한다 (Q98).\n- **함정**: 32비트 레지스터를 바이트 단위로 접근하면 안 되는 주변장치가 있다 →\n  접근 폭(access width)을 데이터시트대로.\n\n---\n\n## (Q102) 소프트웨어 타이머 휠 (malloc 없이)\n\n```c\n// 등록: delay tick 뒤 만료\nslot   = (now + delay) % TW_SLOTS;\nrounds = (delay - 1) / TW_SLOTS;   // 그 슬롯을 몇 바퀴 더 지나야 하나\n\n// tick: 현재 슬롯만 순회\nnow++; s = now % TW_SLOTS;\nfor (각 타이머 in slot[s])\n    if (rounds == 0) 발동 + 반납;   // 정확히 now == 등록시각+delay 에 발동\n    else             rounds--;\n```\n\n- **왜 휠인가**: 단순 리스트는 tick 마다 전체를 스캔(O(n)). 휠은 **해당 슬롯만** 본다.\n  등록 O(1), tick당 O(슬롯 내 타이머 수). 대량 타이머에 유리 (Linux 커널이 사용).\n- `rounds` 공식 `(delay-1)/N` 검증: delay\u003cN → 0(이번 바퀴), delay=N → 0(첫 통과에 발동),\n  delay=2N → 1. off-by-one 주의.\n- **노드는 정적 풀 + free-list** (힙 없음, 결정론적) — Q75 와 동일 임베디드 관용구.\n- **함정**: 콜백 안에서 타이머를 재등록/취소할 때 순회 리스트가 깨지지 않게\n  **먼저 unlink 후 콜백** 호출 (본 구현이 그 순서).\n\n---\n\n## 인터뷰 팔로업 & 임베디드 함정 모음\n\n- **Q. 워치독 pat 을 어디서?** → 정상 경로가 실제로 돈다는 증거가 모일 때만. ISR 단독 pat 금지.\n- **Q. `_Atomic` vs 임계구역?** → 단일 워드면 원자, 여러 변수 불변식이면 임계구역/락.\n- **Q. 왜 IRQ 복원이 save/restore?** → 중첩 임계구역에서 조기 enable 방지.\n- **Q. 우선순위 역전을 어떻게 없애나?** → 상속(경계) 또는 천장(교착 예방+1회 블로킹).\n- **Q. 인터럽트 지연을 어떻게 줄이나?** → 임계구역·ISR 최소화, 무거운 일은 defer.\n- **Q. `volatile` 이면 스레드 안전?** → 아니다. 원자성/배리어 없음. 별도 보호 필요.\n- **함정: 협력형 스케줄러에서 한 태스크가 블로킹** → 전체 정지. 상태머신으로 분할.\n- **함정: 타이머 휠 rounds off-by-one** → `(delay-1)/N` 로 검증.\n- **함정: ISR 과 main 이 같은 free-list/버퍼 공유** → 경쟁. SPSC 설계 또는 임계구역.\n\n---\n\n## 복잡도 요약\n\n| 연산 | 시간 | 공간 |\n|------|------|------|\n| wdt_tick / wdt_pat | O(1) | O(1) |\n| sched_run_tick | O(태스크 수) | O(1) |\n| irq_save / restore | O(1) | O(1) |\n| atomic_add | O(1) | O(1) |\n| pi_effective_priority / pcp_ceiling | O(대기자/사용자 수) | O(1) |\n| irq_latency_wc | O(1) | O(1) |\n| reg_* (MMIO) | O(1) | O(1) |\n| tw_start | O(1) | O(1) (정적 풀) |\n| tw_tick | O(슬롯 내 타이머 수) | O(1) |\n", "problems": [{"num": 96, "slug": "watchdog_timer", "title_ko": "워치독 타이머 (pat / tick / expired)", "title_en": "Watchdog timer (pat / tick / reset)", "difficulty": "easy", "tags": ["watchdog", "safety", "down-counter", "callback"], "prompt_ko": "down-counter 워치독을 시뮬레이션한다. wdt_pat 은 카운터를 timeout 으로 재장전하고, wdt_tick 은 카운터를 감소시키다 0 도달 시 리셋 콜백을 1회 발동하고 expired 로 래치한다. 만료 후 pat/tick 은 무시.", "prompt_en": "Simulate a down-counter watchdog. wdt_pat reloads the counter to timeout; wdt_tick decrements and, on reaching 0, fires the reset callback once and latches expired. After expiry, pat/tick are ignored.", "signature": "void wdt_pat(wdt_t *w); void wdt_tick(wdt_t *w); bool wdt_expired(const wdt_t *w);", "examples": [{"in": "timeout=3; tick,tick,pat,tick,tick,tick", "out": "reset fires once on the last tick"}, {"in": "timeout=0; tick", "out": "fires immediately"}], "hints": ["tick: expired 면 즉시 return.", "counter==0 이거나 --counter==0 이면 콜백 + expired=true (timeout 0 엣지 포함).", "pat 은 !expired 일 때만 counter=timeout."], "solution": "void wdt_pat(wdt_t *w) {\n    if (!w || w->expired) return;\n    w->counter = w->timeout;\n}\nvoid wdt_tick(wdt_t *w) {\n    if (!w || w->expired) return;\n    if (w->counter == 0 || --w->counter == 0) {\n        w->expired = true;\n        if (w->cb) w->cb(w->ctx);   // 실제로는 시스템 리셋\n    }\n}\nbool wdt_expired(const wdt_t *w) {\n    return w ? w->expired : true;\n}", "explanation_ko": "워치독은 감소 카운터다. 정상 경로가 주기적으로 pat(reload) 하면 0 에 도달하지 않는다. main 이 hang 되어 pat 이 멈추면 카운터가 0 이 되어 리셋(여기선 콜백)이 발동해 자동 복구한다. 만료를 래치해 콜백이 한 번만 불리게 한다.", "complexity": "O(1) time, O(1) space", "pitfalls": ["pat 을 ISR 단독에서 호출 → main 죽어도 계속 리로드되어 무용지물", "만료 후에도 콜백 반복 발동(래치 누락)", "timeout==0 엣지 미처리"], "anduril_context": "FCS/무장 MCU 의 hang 자동 복구. 태스크 완료 플래그를 AND 해서만 pat."}, {"num": 97, "slug": "cooperative_scheduler", "title_ko": "협력형 라운드로빈 스케줄러", "title_en": "Cooperative round-robin scheduler", "difficulty": "easy", "tags": ["scheduler", "function-pointer", "round-robin", "bare-metal"], "prompt_ko": "함수 포인터 태스크와 주기(period)를 갖는 협력형 스케줄러. 매 tick 마다 now 를 올리고 now % period == 0 인 태스크를 등록 순서대로 실행한다. period==0/NULL/테이블 초과 등록은 거부.", "prompt_en": "A cooperative scheduler of function-pointer tasks with periods. Each tick advances now and runs tasks whose now % period == 0 in registration order. Reject period==0/NULL/over-capacity.", "signature": "bool sched_add_task(scheduler_t *s, sched_task_fn fn, uint32_t period, void *ctx); void sched_run_tick(scheduler_t *s);", "examples": [{"in": "periods 1,2,3 over 6 ticks", "out": "run counts 6,3,2"}, {"in": "add period=0", "out": "false"}], "hints": ["add: !fn || period==0 || count>=MAX → false.", "run_tick: now++ 먼저, 그 다음 검사.", "now % period == 0 이면 runs++ 후 fn(ctx)."], "solution": "bool sched_add_task(scheduler_t *s, sched_task_fn fn, uint32_t period, void *ctx) {\n    if (!s || !fn || period == 0 || s->count >= SCHED_MAX) return false;\n    sched_task_t *t = &s->tasks[s->count++];\n    t->fn = fn; t->period = period; t->ctx = ctx; t->runs = 0;\n    return true;\n}\nvoid sched_run_tick(scheduler_t *s) {\n    if (!s) return;\n    s->now++;\n    for (size_t i = 0; i \u003c s->count; ++i)\n        if (s->now % s->tasks[i].period == 0) {\n            s->tasks[i].runs++;\n            s->tasks[i].fn(s->tasks[i].ctx);\n        }\n}", "explanation_ko": "RTOS 없이 도는 소형 시스템의 정석. now 를 누적하고 주기 나눗셈으로 도래 여부를 판단한다. 선점이 없으므로 각 태스크는 짧게 실행하고 반환해야 한다(cooperative). 결정론적이고 오버헤드가 작다.", "complexity": "add O(1), run_tick O(태스크 수)", "pitfalls": ["긴/블로킹 태스크 하나가 전체 정지 → 상태머신으로 분할", "now++ 순서 실수로 첫 tick 누락", "period==0 나눗셈 미방지"], "anduril_context": "센서 허브/ESC 등 RTOS 없는 MCU 의 주기 태스크(텔레메트리 10Hz, 제어 1kHz)."}, {"num": 98, "slug": "isr_shared_resource", "title_ko": "ISR↔main 공유 자원 보호 (임계구역 & _Atomic)", "title_en": "Protect ISR↔main shared resource", "difficulty": "medium", "tags": ["isr", "race-condition", "critical-section", "atomic", "volatile"], "prompt_ko": "read-modify-write 도중 ISR 이 끼면 갱신이 유실되는 레이스를 재현하고, (A) 인터럽트 마스킹 임계구역(save/restore, 중첩 안전)과 (B) _Atomic 으로 고친다. irq_save 는 이전 상태를 반환하고 irq_restore 는 그 값으로 복원해야 한다.", "prompt_en": "Reproduce the lost-update race when an ISR interrupts a read-modify-write, then fix it with (A) an interrupt-masking critical section (save/restore, nesting-safe) and (B) _Atomic. irq_save returns the previous state; irq_restore restores exactly that value.", "signature": "uint32_t irq_save(void); void irq_restore(uint32_t saved); void isr_fire(shared_t *r); void atomic_add_u32(_Atomic uint32_t *c, uint32_t v);", "examples": [{"in": "racy RMW with ISR between read and write", "out": "ISR update lost (value==1, not 101)"}, {"in": "same RMW inside irq_save/restore", "out": "value==101 (no loss)"}], "hints": ["irq_save: prev=g_primask; g_primask=1; return prev; (무조건 enable 아님!)", "irq_restore: g_primask=saved; → 중첩 임계구역에서 조기 enable 방지.", "atomic_add_u32: atomic_fetch_add_explicit(c, v, memory_order_relaxed)."], "solution": "static volatile uint32_t g_primask = 0;   // 0=enable, 1=disable\nuint32_t irq_save(void) {\n    uint32_t prev = g_primask;\n    g_primask = 1;             // disable\n    return prev;\n}\nvoid irq_restore(uint32_t saved) {\n    g_primask = saved;         // 이전 상태로 (중첩 안전)\n}\nvoid isr_fire(shared_t *r) {\n    if (r) r->value += ISR_DELTA;\n}\nvoid atomic_add_u32(_Atomic uint32_t *c, uint32_t v) {\n    atomic_fetch_add_explicit(c, v, memory_order_relaxed);\n}", "explanation_ko": "RMW 는 원자적이 아니라서 읽기와 쓰기 사이에 ISR 이 끼면 그 갱신이 덮여 사라진다. 임계구역은 그 구간 동안 인터럽트를 막아 RMW 를 불가분하게 만든다. save/restore 방식이라 이미 마스킹된 곳에서 중첩 호출해도 안전하다. 단일 워드라면 _Atomic 한 번으로 멀티코어까지 커버된다.", "complexity": "O(1) time, O(1) space", "pitfalls": ["irq_restore 를 무조건 enable 로 → 중첩 임계구역 조기 개방", "volatile 만 믿고 원자성 가정 (volatile≠atomic)", "임계구역이 길어 인터럽트 지연 증가"], "anduril_context": "IMU/UART RX ISR 이 갱신하는 카운터/상태를 제어 루프가 읽는 모든 곳."}, {"num": 99, "slug": "priority_inversion", "title_ko": "우선순위 역전 & 상속/천장", "title_en": "Priority inversion & inheritance/ceiling", "difficulty": "hard", "tags": ["priority-inversion", "priority-inheritance", "priority-ceiling", "rtos", "real-time"], "prompt_ko": "우선순위 역전(저가 자원 보유 → 고 블록 → 중이 저를 선점 → 고 무한 대기)을 결정론적 시뮬레이터로 보이고, 우선순위 상속(보유자를 최고 대기자로 승격)과 천장 프로토콜(자원 사용자 중 최고 우선순위)의 핵심 primitive 를 구현한다.", "prompt_en": "Demonstrate priority inversion (low holds resource → high blocks → medium preempts low → high waits unbounded) with a deterministic simulator, and implement the core primitives of priority inheritance (raise holder to the highest waiter) and the ceiling protocol (highest priority among resource users).", "signature": "int pi_effective_priority(int base, const int *waiters, size_t n); int pcp_ceiling(const int *user_prios, size_t n);", "examples": [{"in": "pi_effective_priority(1, [3], 1)", "out": "3"}, {"in": "simulate: no-inheritance vs inheritance", "out": "H finishes at 11 vs 6"}], "hints": ["pi_effective_priority: base 와 모든 waiters 의 최댓값.", "상속으로 보유자가 M 보다 높아지면 즉시 자원 반납 → H 대기 경계.", "pcp_ceiling: 자원 사용 태스크 우선순위들의 최댓값 (NULL/0 → 0)."], "solution": "int pi_effective_priority(int base, const int *waiters, size_t n) {\n    int eff = base;\n    if (waiters)\n        for (size_t i = 0; i \u003c n; ++i)\n            if (waiters[i] > eff) eff = waiters[i];\n    return eff;   // 보유자를 최고 대기자로 일시 승격\n}\nint pcp_ceiling(const int *user_prios, size_t n) {\n    if (!user_prios || n == 0) return 0;\n    int c = user_prios[0];\n    for (size_t i = 1; i \u003c n; ++i)\n        if (user_prios[i] > c) c = user_prios[i];\n    return c;\n}", "explanation_ko": "역전의 근본 원인은 '자원과 무관한 중간 우선순위 태스크'가 자원 보유자(저우선순위)를 선점하는 것이다. 상속은 보유자를 대기자 최고 우선순위로 잠시 올려 중간 태스크가 끼지 못하게 하고, 그 결과 고우선순위의 대기 시간이 '보유자의 임계구역 잔여분'으로 경계된다. 천장 프로토콜은 잠그는 순간 천장으로 올려 교착까지 예방한다. Mars Pathfinder(1997) 가 이 버그의 유명 사례.", "complexity": "primitives O(대기자/사용자 수), 시뮬레이터 O(스케줄 길이)", "pitfalls": ["상속 없이 우선순위 락만 쓰면 chained/무한 블로킹", "역전을 데드락과 혼동 (역전은 진행은 하되 지연)", "천장 계산에 자원 미사용 태스크를 포함"], "anduril_context": "공유 SPI 버스/뮤텍스를 여러 우선순위 태스크가 다툴 때 마감 보장(RTOS mutex 의 PI 옵션)."}, {"num": 100, "slug": "interrupt_latency", "title_ko": "인터럽트 지연 시간 (worst-case & 경계)", "title_en": "Interrupt latency (worst-case & bounding)", "difficulty": "medium", "tags": ["interrupt-latency", "real-time", "critical-section", "wcet", "saturating-add"], "prompt_ko": "최악 인터럽트 지연을 기여 요소(sync, disable_window, higher_isr, context_save, isr_prologue)의 포화 덧셈으로 계산하고, 여러 임계구역 중 최장(=disable_window 경계값)을 구하며, 최악 지연+ISR 실행시간이 마감을 만족하는지 판단한다.", "prompt_en": "Compute worst-case interrupt latency as a saturating sum of contributors (sync, disable_window, higher_isr, context_save, isr_prologue), find the longest critical section (the disable_window bound), and decide whether worst latency + ISR exec time meets a deadline.", "signature": "uint32_t irq_latency_wc(const irq_latency_t *m); uint32_t max_disable_window(const uint32_t *cs, size_t n); bool meets_deadline(uint32_t wc_latency, uint32_t isr_exec, uint32_t deadline);", "examples": [{"in": "sync2+disable40+higher15+ctx12+prologue6", "out": "75"}, {"in": "meets_deadline(75, 30, 100)", "out": "false"}], "hints": ["포화 덧셈으로 합산(오버플로 시 UINT32_MAX).", "max_disable_window: 배열 최댓값.", "meets_deadline: sat_add(latency, exec) \u003c= deadline."], "solution": "static uint32_t sat_add(uint32_t a, uint32_t b) {\n    uint32_t s = a + b;\n    return (s \u003c a) ? UINT32_MAX : s;   // overflow 포화\n}\nuint32_t irq_latency_wc(const irq_latency_t *m) {\n    if (!m) return 0;\n    uint32_t t = 0;\n    t = sat_add(t, m->sync);\n    t = sat_add(t, m->disable_window);\n    t = sat_add(t, m->higher_isr);\n    t = sat_add(t, m->context_save);\n    t = sat_add(t, m->isr_prologue);\n    return t;\n}\nuint32_t max_disable_window(const uint32_t *cs, size_t n) {\n    if (!cs) return 0;\n    uint32_t m = 0;\n    for (size_t i = 0; i \u003c n; ++i) if (cs[i] > m) m = cs[i];\n    return m;\n}\nbool meets_deadline(uint32_t wc, uint32_t isr_exec, uint32_t deadline) {\n    return sat_add(wc, isr_exec) \u003c= deadline;\n}", "explanation_ko": "인터럽트 지연은 여러 원인의 합이다. 이 중 펌웨어가 직접 통제하는 가장 큰 레버는 '인터럽트를 막아 둔 임계구역 길이(disable_window)'다. 임계구역과 ISR 본문을 짧게 유지하면 최악 지연이 줄어 마감을 만족시킬 수 있다. 합산은 포화 덧셈으로 오버플로 UB 를 피한다.", "complexity": "wc O(1), max O(n)", "pitfalls": ["긴 임계구역으로 disable_window 폭증", "합산 오버플로 UB (포화 처리 필요)", "ISR 본문에 무거운 작업 → higher_isr 및 지연 증가"], "anduril_context": "제어 루프 타이머/센서 인터럽트의 지터/마감 예산 산정, 임계구역 길이 상한 설정."}, {"num": 101, "slug": "mmio_volatile", "title_ko": "메모리맵 레지스터 접근 (volatile)", "title_en": "Memory-mapped register access (volatile)", "difficulty": "medium", "tags": ["mmio", "volatile", "register", "bitfield", "polling"], "prompt_ko": "volatile 포인터로 주변장치 레지스터를 읽고/쓰고, 비트 셋/클리어(RMW), 비트필드 수정(마스크·시프트), 플래그 폴링을 구현한다. shift>=32 는 UB 이므로 가드하고, 폴링은 volatile 재-읽기로 최적화 제거를 막는다.", "prompt_en": "Read/write peripheral registers through volatile pointers, set/clear bits (RMW), modify a bitfield (mask+shift), and poll a flag. Guard shift>=32 (UB) and rely on volatile re-reads so the poll loop is not optimized away.", "signature": "uint32_t reg_read(const volatile uint32_t *reg); void reg_set_bits(volatile uint32_t *reg, uint32_t mask); void reg_modify_field(volatile uint32_t *reg, uint32_t mask, uint32_t shift, uint32_t val); bool reg_poll_flag(const volatile uint32_t *reg, uint32_t mask, uint32_t max_iters);", "examples": [{"in": "modify_field(CR, 0xF00, 8, 0xA)", "out": "(CR>>8)&0xF == 0xA"}, {"in": "poll_flag when clear, max_iters=100", "out": "false (timeout)"}], "hints": ["set/clear: *reg |= mask / *reg &= ~mask.", "modify_field: v &= ~mask; v |= (val\u003c\u003cshift)&mask; (shift>=32 가드).", "poll: for i\u003cmax_iters: if ((*reg & mask)==mask) return true."], "solution": "uint32_t reg_read(const volatile uint32_t *reg) { return reg ? *reg : 0; }\nvoid reg_write(volatile uint32_t *reg, uint32_t val) { if (reg) *reg = val; }\nvoid reg_set_bits(volatile uint32_t *reg, uint32_t mask) { if (reg) *reg |= mask; }\nvoid reg_clear_bits(volatile uint32_t *reg, uint32_t mask) { if (reg) *reg &= ~mask; }\nvoid reg_modify_field(volatile uint32_t *reg, uint32_t mask, uint32_t shift, uint32_t val) {\n    if (!reg || shift >= 32) return;          // shift>=32 는 UB\n    uint32_t v = *reg;\n    v &= ~mask;\n    v |= (val \u003c\u003c shift) & mask;\n    *reg = v;\n}\nbool reg_poll_flag(const volatile uint32_t *reg, uint32_t mask, uint32_t max_iters) {\n    if (!reg) return false;\n    for (uint32_t i = 0; i \u003c max_iters; ++i)\n        if ((*reg & mask) == mask) return true;   // volatile: 매 반복 실제 재-읽기\n    return false;\n}", "explanation_ko": "volatile 은 컴파일러에게 '이 메모리는 프로그램 밖에서 바뀔 수 있다'고 알려 접근을 제거·캐시·재정렬하지 못하게 한다. 이게 없으면 상태 폴링 루프가 '값이 안 변한다'는 가정으로 무한루프로 최적화될 수 있다. 필드 수정은 읽고-마스크로 지우고-시프트해 채우는 RMW 다. volatile 은 원자성/배리어를 보장하지 않으므로 ISR 공유엔 별도 보호가 필요하다.", "complexity": "O(1) (poll O(max_iters))", "pitfalls": ["volatile 누락 → 폴링 루프 최적화로 무한루프", "shift>=32 시 UB (가드 필요)", "volatile=atomic 로 오해 (배리어/원자성 없음)"], "anduril_context": "STM32/FPGA 주변장치(UART/SPI/타이머) 레지스터 드라이버, 상태 비트 폴링."}, {"num": 102, "slug": "timer_wheel", "title_ko": "소프트웨어 타이머 휠 (malloc 없이)", "title_en": "Software timer wheel (no malloc)", "difficulty": "hard", "tags": ["timer-wheel", "no-heap", "free-list", "callback", "scheduling"], "prompt_ko": "TW_SLOTS 슬롯 해시 타이밍 휠. delay tick 뒤 만료할 타이머를 slot=(now+delay)%N, rounds=(delay-1)/N 으로 배치하고, tick 마다 현재 슬롯만 순회해 rounds==0 이면 발동+반납, 아니면 rounds--. 노드는 정적 풀+free-list(힙 없음).", "prompt_en": "A TW_SLOTS-slot hashed timing wheel. Place a timer due in delay ticks at slot=(now+delay)%N, rounds=(delay-1)/N; each tick scan only the current slot, firing timers with rounds==0 (and recycling them) else decrement rounds. Nodes come from a static pool + free-list (no heap).", "signature": "int tw_start(timer_wheel_t *w, uint32_t delay, tw_cb cb, void *ctx); void tw_tick(timer_wheel_t *w);", "examples": [{"in": "start delays 1,3,8,9,16; run 16 ticks", "out": "each fires exactly at tick==delay"}, {"in": "start 17th timer (pool=16)", "out": "-1 (exhausted)"}], "hints": ["tw_start: free-list 에서 노드 하나 떼어 slot/rounds 계산 후 슬롯 리스트 앞에 삽입.", "rounds=(delay-1)/TW_SLOTS 로 off-by-one 회피.", "tw_tick: 이중 포인터로 슬롯 리스트 순회, 발동 전에 unlink 하고 free-list 반납."], "solution": "int tw_start(timer_wheel_t *w, uint32_t delay, tw_cb cb, void *ctx) {\n    if (!w || !cb || delay == 0) return -1;\n    int idx = tw_alloc(w);\n    if (idx \u003c 0) return -1;                       // 풀 고갈\n    uint32_t slot = (w->now + delay) % TW_SLOTS;\n    w->pool[idx].active = true;\n    w->pool[idx].rounds = (delay - 1) / TW_SLOTS;\n    w->pool[idx].cb = cb; w->pool[idx].ctx = ctx;\n    w->pool[idx].next = w->slots[slot];\n    w->slots[slot] = idx;\n    return idx;\n}\nvoid tw_tick(timer_wheel_t *w) {\n    if (!w) return;\n    w->now++;\n    uint32_t s = w->now % TW_SLOTS;\n    int *pp = &w->slots[s];\n    while (*pp != -1) {\n        int idx = *pp;\n        if (w->pool[idx].rounds == 0) {\n            tw_cb cb = w->pool[idx].cb; void *ctx = w->pool[idx].ctx;\n            *pp = w->pool[idx].next;   // unlink (next 는 release 전에 읽음)\n            tw_release(w, idx);\n            cb(ctx);                   // 발동\n        } else {\n            w->pool[idx].rounds--;\n            pp = &w->pool[idx].next;\n        }\n    }\n}", "explanation_ko": "단순 타이머 리스트는 tick 마다 전체를 스캔하지만, 휠은 타이머를 만료 슬롯에 해싱해 tick 당 해당 슬롯만 본다(등록 O(1)). rounds 는 그 슬롯을 몇 바퀴 더 지나야 하는지로, (delay-1)/N 이라야 off-by-one 이 안 난다. 노드는 정적 풀+free-list 로 힙 없이 O(1) 할당/반납해 결정론적이다. 콜백에서 재등록해도 안전하도록 발동 전에 unlink 한다.", "complexity": "tw_start O(1), tw_tick O(슬롯 내 타이머 수), 공간 O(1) 정적 풀", "pitfalls": ["rounds off-by-one ((delay)/N 로 잘못 두면 한 바퀴 늦게 발동)", "unlink 전에 콜백 호출 → 리스트 훼손", "ISR 와 main 이 같은 휠 공유 시 경쟁 (임계구역 필요)"], "anduril_context": "타임아웃/재전송 타이머(링크 프로토콜), 주기 이벤트 스케줄링을 힙 없이(MISRA)."}]}, {"id": "anduril_signature", "order": 10, "range": "Q1-9", "icon": "🎯", "title_en": "Anduril Signature & Drone-Flavored", "title_ko": "안두릴 실전 & 드론 응용", "summary_ko": "실제 재현된 Anduril 2문항(my_atoi 오버플로 클램핑, reverseBits 기본+O(log n) 최적화)에서 출발해 드론 펌웨어 감각의 6문제를 붙였다: 레지스터 RMW, UART 링버퍼(SPSC), CRC-8 프레임 검증, IMU 상보 필터, GPIO 디바운스, 스틱->PWM 매핑.", "summary_en": "Two real reproduced Anduril questions (my_atoi with overflow clamping, reverseBits basic + O(log n)) plus six drone-firmware problems: register RMW, UART SPSC ring buffer, CRC-8 frame validation, IMU complementary filter, GPIO debounce, and stick-to-PWM mapping.", "anduril_relevance_ko": "my_atoi와 reverseBits는 Anduril 리크루터 스크린에서 실제로 재현된 문제로, 파싱 견고성과 비트 조작을 동시에 본다. 나머지 6개는 드론/TRS 펌웨어의 일상 패턴(MMIO 필드 설정, UART ISR-main 링버퍼, 텔레메트리 CRC, IMU 자세 추정, 스위치 디바운스, 액추에이터 출력)으로 UB 회피/정수 안전/volatile/ISR 공유/경계 포화 감각을 검증한다.", "concepts": [{"term": "Overflow pre-check", "ko": "곱셈 전 result>INT_MAX/10 검사로 클램핑", "en": "Clamp before multiply to avoid signed-overflow UB"}, {"term": "(unsigned char) cast", "ko": "isspace/isdigit에 음수 char 넘기면 UB", "en": "ctype funcs require unsigned char"}, {"term": "Mask/shift reverse", "ko": "블록 16->8->4->2->1 스왑, 0xAA/0x55 등", "en": "Divide-and-conquer bit reversal masks"}, {"term": "Register RMW", "ko": "(reg&~mask)|((v\u003c\u003csh)&mask) 필드만 교체", "en": "Read-modify-write one field, preserve rest"}, {"term": "SPSC ring", "ko": "head=생산자, tail=소비자, 한 칸 희생, 데이터->인덱스 순서", "en": "Lock-free single producer/consumer FIFO"}, {"term": "CRC-8 poly 0x07", "ko": "바이트 XOR 후 8회 시프트/폴리XOR, (uint8_t)캐스트", "en": "Bytewise CRC, cast to keep 8 bits"}, {"term": "Complementary filter", "ko": "a*gyro + (1-a)*accel, a=0.98", "en": "Cheap gyro/accel sensor fusion"}, {"term": "Debounce shift-reg", "ko": "history=(h\u003c\u003c1)|raw, 0xFF/0x00로 확정", "en": "8-sample history debounce"}, {"term": "Clamp then scale", "ko": "포화 먼저, 스케일 나중 (오버플로 방지)", "en": "Saturate before mapping to PWM"}], "study_note_md": "# 10. Anduril 시그니처 & 드론 응용 (Signature & Drone-Flavored) 🎯\n\n> 실제로 재현된 Anduril 인터뷰 2문항(`my_atoi`, `reverseBits`)을 정석대로 다듬고,\n> Anduril TRS(트래킹·무선·센서) 펌웨어 감각의 드론 문제 6개를 붙였다.\n> 화이트보드에서 \"이거 그대로 나온다\" 급의 실전 세트.\n\n---\n\n## 왜 이 토픽이 Anduril 펌웨어 인터뷰의 핵심인가\n\n- `my_atoi` / `reverseBits` 는 **실제 리크루터 스크린에서 재현된 문제**다. 파싱 견고성\n  (오버플로/NULL/부호)과 비트 조작(마스크·시프트) 두 축을 한 번에 본다.\n- 나머지 6개는 드론 펌웨어의 \"매일 쓰는\" 패턴: 레지스터 RMW, UART 링버퍼,\n  CRC 프레임 검증, IMU 센서 퓨전, 스위치 디바운스, 액추에이터 출력 매핑.\n- 공통 관심사: **UB 회피**(시프트폭·부호 오버플로·NULL), **정수 안전**, **volatile/ISR\n  공유**, **경계·포화 처리**. 인터뷰어가 진짜 보는 것은 결과가 아니라 이 감각이다.\n\n---\n\n## 문제별 핵심\n\n### Q1. `my_atoi` — 오버플로 클램핑 파서\n순서: **공백 스킵 → 부호 1개 → 숫자 변환(첫 비숫자에서 정지) → 오버플로 클램핑**.\n```c\nif (result > INT_MAX/10 || (result == INT_MAX/10 && digit > INT_MAX%10))\n    return (sign == 1) ? INT_MAX : INT_MIN;   // 곱하기 *전에* 선검사\n```\n- **핵심 트릭**: `result*10 + digit` 를 실제로 하기 전에 오버플로를 판정한다.\n  `result > INT_MAX/10` 이거나, 같을 때 마지막 자리 `digit > INT_MAX%10 (=7)`.\n- `INT_MIN` 도 이 하나의 검사로 커버된다 — 음수 크기는 `INT_MAX+1` 이지만\n  부호를 마지막에 곱하므로 크기 기준으로 클램핑하면 `-2147483648` 이 정확히 나온다.\n- **함정**: `isspace(str[i])` 에 음수 `char` 를 넘기면 UB → `isspace((unsigned char)str[i])`.\n- **함정**: `\"+-2\"` 는 부호 뒤 비숫자라 0. NULL/빈문자열/숫자없음 전부 0.\n\n### Q2. `reverseBits` — 기본 루프 O(32)\n```c\nreversed = (reversed \u003c\u003c 1) | (n & 1u);  n >>= 1;   // 32회\n```\nLSB 를 하나씩 뽑아 `reversed` 위쪽으로 밀어넣는다. `1u` (unsigned) 필수.\n\n### Q3. `reverseBitsOptimized` — 분할정복 O(log n)\n\"인접 블록 스왑\"을 블록 크기 **16→8→4→2→1** 로 반씩 줄이며 5단계.\n```c\nn = (n >> 16) | (n \u003c\u003c 16);                                // 16비트\nn = ((n & 0xFF00FF00u)>>8)  | ((n & 0x00FF00FFu)\u003c\u003c8);     // 8비트(바이트)\nn = ((n & 0xF0F0F0F0u)>>4)  | ((n & 0x0F0F0F0Fu)\u003c\u003c4);     // 4비트(니블)\nn = ((n & 0xCCCCCCCCu)>>2)  | ((n & 0x33333333u)\u003c\u003c2);     // 2비트\nn = ((n & 0xAAAAAAAAu)>>1)  | ((n & 0x55555555u)\u003c\u003c1);     // 1비트\n```\n- **마스크 읽는 법**: `0xAAAA...` = 홀수 위치 비트, `0x5555...` = 짝수 위치 비트.\n  각 단계는 좌/우 절반을 골라 서로 반대로 시프트해 자리를 교환한다.\n- 루프·분기 없음 → 파이프라인 친화적. 인터뷰 팔로업: \"왜 5단계?\" → `log2(32)=5`.\n\n### Q4. `reg_set_field` — 레지스터 read-modify-write\n```c\nnew = (reg & ~mask) | ((value \u003c\u003c shift) & mask);\n```\n- 다른 필드를 **건드리지 않고** 한 필드만 교체하는 임베디드 정석. I2C 디바이스\n  설정 레지스터, MMIO 주변장치 제어의 기본.\n- `& mask` 로 value 의 넘치는 비트를 절삭 → 이웃 필드 오염 방지.\n- `shift >= 32` 는 시프트폭 UB → 가드. 실무에선 `volatile` 레지스터를 읽고 쓴다.\n\n### Q5. UART 링버퍼 — SPSC (ISR 생산 / main 소비)\n- **UART RX ISR** 가 `put`, **main loop** 가 `get`. head 는 생산자만, tail 은\n  소비자만 쓴다 → 단일코어 베어메탈에선 락 없이 안전.\n- power-of-two 크기 + `& (SIZE-1)` 마스킹, `head==tail` = empty, 한 칸 희생.\n- **순서 규칙**: 데이터 먼저 쓰고 인덱스 나중에 공개. 멀티코어면 acquire/release\n  원자연산 필요(→ 05번 토픽 SPSC 참조), 단일코어면 `volatile` + 순서로 충분.\n\n### Q6. CRC-8 + 프레임 검증 (MAVLink 풍)\n```c\ncrc ^= byte; for(8) crc = (crc & 0x80) ? (crc\u003c\u003c1)^0x07 : (crc\u003c\u003c1);\n```\n- 프레임: `[START 0xFE][len][payload...][crc]`. crc 는 **START 제외** `{len+payload}`.\n- 검증 3종: 시작 바이트, 길이 필드 일관성(`len+3==total`), 후미 CRC 일치.\n- 알려진 벡터: `CRC-8/SMBUS(\"123456789\") = 0xF4` — 구현 검산에 쓴다.\n- **함정**: `crc \u003c\u003c 1` 은 `int` 승격되므로 `(uint8_t)` 캐스트로 잘라야 8비트 유지.\n\n### Q7. IMU 상보 필터 (complementary filter)\n```c\nangle = alpha*(prev + gyro_rate*dt) + (1 - alpha)*accel_angle;\n```\n- 자이로 적분: 단기 정확·장기 드리프트. 가속도계: 장기 정확·단기 노이즈.\n  둘을 1차 필터로 섞는다. `alpha ≈ 0.98` (자이로에 무게, 저주파는 accel 보정).\n- `alpha=1` → 순수 gyro, `alpha=0` → 순수 accel. 칼만필터의 값싼 대체제로\n  드론 자세 추정(pitch/roll)에 광범위하게 쓴다.\n- 팔로업: \"고정소수점으로 바꾸면?\" → `alpha` 를 Q15 정수로, 곱셈 후 `>>15`.\n\n### Q8. GPIO 디바운스 — 시프트 레지스터\n```c\nhistory = (history\u003c\u003c1) | raw;\nif (history==0xFF) state=true; else if (history==0x00) state=false; // else hold\n```\n- 기계식 스위치 채터(bounce)를 8샘플 히스토리로 제거. 연속 8회 동일해야 확정.\n- 카운터/적분기 방식보다 코드가 짧고 노이즈 내성 직관적. 폴링 tick 마다 호출.\n- 팔로업: \"샘플 주기 vs 바운스 시간?\" → 8*Ts 가 바운스 최대 지속(~수 ms)보다 커야.\n\n### Q9. `stick_to_pwm` — 포화 매핑\n```c\nif (stick\u003c-1000) stick=-1000; if (stick>1000) stick=1000;\nreturn 1500 + stick/2;   // [-1000,1000] -> [1000,2000] us\n```\n- RC 스틱 → ESC/서보 PWM 펄스폭. 중립 1500us, 범위 밖은 **포화(clamp)**.\n- **먼저 클램프 후 스케일** — 순서가 뒤바뀌면 오버플로/래핑 위험.\n- 팔로업: \"데드밴드는?\" → 중립 근처 `|stick|\u003cD` 를 0 으로. \"역방향 채널?\" → 부호 반전.\n\n---\n\n## 인터뷰 팔로업 (follow-ups)\n\n- **\"`my_atoi` 오버플로를 곱셈 후에 검사하면?\"** → 이미 UB 발생(signed overflow). 반드시 사전 검사.\n- **\"`reverseBits` 를 8비트 룩업 테이블로?\"** → 256엔트리 테이블 4번 조합, 초고속. 트레이드오프는 메모리.\n- **\"레지스터 RMW 가 ISR 과 경합하면?\"** → read-modify-write 는 원자적이지 않다. BSRR 같은 set/clear 전용 레지스터 또는 임계구역.\n- **\"링버퍼 full/empty 를 count 로?\"** → count 를 양쪽이 쓰면 경합. SPSC 는 인덱스만으로 판별(한 칸 희생).\n- **\"CRC 대신 체크섬?\"** → 체크섬은 비트 교환/버스트 에러 취약. CRC 가 검출력 우수.\n- **\"상보필터 vs 칼만?\"** → 칼만이 최적이지만 튜닝·연산 비쌈. 상보필터는 1곱셈으로 충분히 좋음.\n\n## 흔한 버그 (gotchas)\n\n- `isspace`/`isdigit` 에 음수 char → `(unsigned char)` 캐스트 누락.\n- `1 \u003c\u003c 31`, `crc \u003c\u003c 1` 부호/승격 문제 → `1u`, `(uint8_t)` 캐스트.\n- 시프트폭 `>= 32` UB (Q3/Q4).\n- 링버퍼 인덱스 공개 순서 뒤집기 → 소비자가 미완성 데이터를 봄.\n- PWM 매핑에서 클램프 전 스케일 → 정수 오버플로.\n- 디바운스 히스토리 폭과 샘플 주기 미스매치 → 여전히 채터.\n", "problems": [{"num": 1, "slug": "my_atoi", "title_ko": "문자열을 int로 (오버플로 클램핑)", "title_en": "String to int with overflow clamping", "difficulty": "medium", "tags": ["parsing", "overflow", "robustness", "atoi"], "prompt_ko": "선행 공백을 스킵하고 선택적 부호(+/-)를 읽은 뒤 연속된 숫자만 변환한다. 첫 비숫자에서 멈추고, 오버플로 시 INT_MAX/INT_MIN으로 클램핑한다. NULL/빈 문자열/숫자 없음은 0.", "prompt_en": "Skip leading whitespace, read an optional sign, then convert consecutive digits, stopping at the first non-digit. Clamp overflow to INT_MAX/INT_MIN. NULL/empty/no-digits return 0.", "signature": "int my_atoi(const char *str)", "examples": [{"in": "my_atoi(\"   -42\")", "out": "-42"}, {"in": "my_atoi(\"4193 with words\")", "out": "4193"}, {"in": "my_atoi(\"2147483648\")", "out": "2147483647 (INT_MAX)"}, {"in": "my_atoi(NULL)", "out": "0"}], "hints": ["isspace/isdigit 인자는 (unsigned char)로 캐스팅한다 (음수 char UB).", "부호는 최대 1개만 허용하고, 이후 첫 비숫자에서 정지한다.", "result*10+digit를 실제로 계산하기 *전에* 오버플로를 선검사한다.", "검사식: result > INT_MAX/10 || (result==INT_MAX/10 && digit>INT_MAX%10)."], "solution": "int my_atoi(const char *str) {\n    if (str == NULL) return 0;\n    int i = 0;\n    while (isspace((unsigned char)str[i])) i++;   // 1) 공백\n    int sign = 1;\n    if (str[i] == '+' || str[i] == '-') {          // 2) 부호\n        if (str[i] == '-') sign = -1;\n        i++;\n    }\n    int result = 0;\n    while (isdigit((unsigned char)str[i])) {        // 3) 숫자\n        int digit = str[i] - '0';\n        if (result > INT_MAX/10 ||                  // 4) 곱셈 전 오버플로 선검사\n            (result == INT_MAX/10 && digit > INT_MAX%10))\n            return (sign == 1) ? INT_MAX : INT_MIN;\n        result = result*10 + digit;\n        i++;\n    }\n    return result * sign;\n}", "explanation_ko": "공백->부호->숫자 순으로 파싱한다. 핵심은 곱셈을 하기 전에 오버플로를 판정하는 것: result가 INT_MAX/10보다 크거나, 같을 때 다음 자릿수가 INT_MAX%10(=7)을 넘으면 클램핑한다. 부호를 마지막에 곱하므로 음수 방향은 자동으로 INT_MIN으로 클램핑된다. isspace/isdigit에 음수 char를 넘기면 UB라 unsigned char로 캐스팅한다.", "complexity": "O(n) time, O(1) space", "pitfalls": ["곱셈 후 오버플로 검사 -> 이미 signed overflow UB", "isspace/isdigit에 음수 char 전달 -> UB (unsigned char 캐스트 필요)", "부호 여러 개(\"+-2\") 허용 실수 -> 0이어야 함", "NULL 미처리 -> 크래시"], "anduril_context": "명령/설정 문자열 파싱, 시리얼 콘솔 인자 파싱, 텔레메트리 텍스트 필드 변환에서 견고한 정수 파서가 필요하다."}, {"num": 2, "slug": "reverse_bits", "title_ko": "32비트 순서 반전 (기본 루프)", "title_en": "Reverse 32 bits (basic loop)", "difficulty": "easy", "tags": ["bit-manipulation", "loop"], "prompt_ko": "32비트 정수의 비트 순서를 완전히 뒤집어 반환한다. LSB가 MSB가 되도록.", "prompt_en": "Reverse the bit order of a 32-bit integer (LSB becomes MSB).", "signature": "uint32_t reverseBits(uint32_t n)", "examples": [{"in": "reverseBits(0x00000001)", "out": "0x80000000"}, {"in": "reverseBits(0x00000005)", "out": "0xA0000000"}], "hints": ["reversed를 왼쪽으로 시프트하며 n의 LSB를 하나씩 붙인다.", "(reversed\u003c\u003c1)|(n&1u), 그리고 n>>=1을 32회.", "리터럴은 반드시 1u (unsigned)."], "solution": "uint32_t reverseBits(uint32_t n) {\n    uint32_t reversed = 0;\n    for (int i = 0; i \u003c 32; i++) {\n        reversed = (reversed \u003c\u003c 1) | (n & 1u);\n        n >>= 1;\n    }\n    return reversed;\n}", "explanation_ko": "매 반복에서 reversed를 한 칸 왼쪽으로 밀고 n의 최하위 비트를 그 빈자리에 넣는다. n은 오른쪽으로 밀어 다음 비트를 노출한다. 32회 반복하면 첫 비트가 최상위로, 마지막 비트가 최하위로 이동해 완전히 반전된다.", "complexity": "O(1) time (32 fixed), O(1) space", "pitfalls": ["1 (signed) 사용 시 부호비트 문제", "루프 횟수를 비트폭과 다르게 잡음"], "anduril_context": "비트 스트림 프로토콜(LSB-first vs MSB-first) 변환, SPI/센서에서 엔디안/비트오더 정렬."}, {"num": 3, "slug": "reverse_bits_optimized", "title_ko": "32비트 순서 반전 (분할정복 O(log n))", "title_en": "Reverse 32 bits (divide & conquer)", "difficulty": "medium", "tags": ["bit-manipulation", "mask-shift", "divide-and-conquer"], "prompt_ko": "reverseBits와 같은 결과를, 루프/분기 없이 마스크/시프트 5단계로 계산한다. 블록 크기를 16->8->4->2->1로 반씩 줄이며 인접 블록을 교환한다.", "prompt_en": "Same result as reverseBits but branchless: swap adjacent bit-blocks halving size 16->8->4->2->1.", "signature": "uint32_t reverseBitsOptimized(uint32_t n)", "examples": [{"in": "reverseBitsOptimized(0x00000001)", "out": "0x80000000"}, {"in": "reverseBitsOptimized(0xDEADBEEF)", "out": "reverseBits(0xDEADBEEF)와 동일"}], "hints": ["먼저 상/하위 16비트를 교환: (n>>16)|(n\u003c\u003c16).", "마스크로 좌/우 절반을 골라 반대 방향으로 시프트해 교환.", "0xAAAA..=홀수위치, 0x5555..=짝수위치, 0xCC/0x33=2비트, 0xF0/0x0F=니블.", "총 5단계 (log2 32 = 5)."], "solution": "uint32_t reverseBitsOptimized(uint32_t n) {\n    n = (n >> 16) | (n \u003c\u003c 16);\n    n = ((n & 0xFF00FF00u) >> 8)  | ((n & 0x00FF00FFu) \u003c\u003c 8);\n    n = ((n & 0xF0F0F0F0u) >> 4)  | ((n & 0x0F0F0F0Fu) \u003c\u003c 4);\n    n = ((n & 0xCCCCCCCCu) >> 2)  | ((n & 0x33333333u) \u003c\u003c 2);\n    n = ((n & 0xAAAAAAAAu) >> 1)  | ((n & 0x55555555u) \u003c\u003c 1);\n    return n;\n}", "explanation_ko": "각 단계는 특정 크기의 인접 블록을 통째로 스왑한다. 16비트 반쪽을 먼저 바꾸고, 그 안에서 바이트, 니블, 2비트, 1비트 순으로 절반씩 좁혀 간다. 마스크로 좌/우 절반을 분리해 한쪽은 오른쪽으로, 다른쪽은 왼쪽으로 같은 폭만큼 시프트한 뒤 OR로 합친다. 분기/루프가 없어 파이프라인 친화적이다.", "complexity": "O(log n)=5 steps, O(1) space", "pitfalls": ["마스크 상수 오타 (0xCCCC vs 0x3333 등)", "시프트 폭과 마스크 블록 크기 불일치", "리터럴에 u 접미사 누락"], "anduril_context": "고속 DSP/비트리버설(FFT bit-reversal), 프로토콜 비트오더 변환에서 사이클 절약."}, {"num": 4, "slug": "reg_set_field", "title_ko": "레지스터 필드 read-modify-write", "title_en": "Register field read-modify-write", "difficulty": "easy", "tags": ["register", "mask", "i2c", "mmio", "rmw"], "prompt_ko": "mask로 지정된 비트 필드만 value로 교체하고 나머지 비트는 보존한다. value는 shift만큼 밀어 필드 위치에 맞추고, 넘치는 비트는 mask로 절삭한다. shift>=32는 원본을 그대로 반환.", "prompt_en": "Replace only the masked field with value (positioned by shift), preserving other bits; truncate overflow via mask. shift>=32 returns reg unchanged.", "signature": "uint32_t reg_set_field(uint32_t reg, uint32_t mask, uint8_t shift, uint32_t value)", "examples": [{"in": "reg_set_field(0xFF, 0x30, 4, 0x2)", "out": "0xEF"}, {"in": "reg_set_field(0xAA, 0x0F, 0, 0x5)", "out": "0xA5"}], "hints": ["필드를 먼저 0으로: reg & ~mask.", "value를 위치로: (value\u003c\u003cshift) & mask.", "두 결과를 OR로 합친다.", "shift>=32u는 시프트폭 UB -> 가드."], "solution": "uint32_t reg_set_field(uint32_t reg, uint32_t mask, uint8_t shift, uint32_t value) {\n    if (shift >= 32u) return reg;                 // 시프트폭 가드\n    uint32_t placed = (value \u003c\u003c shift) & mask;    // 필드 위치로, 넘침 절삭\n    return (reg & ~mask) | placed;                // 필드 클리어 후 OR\n}", "explanation_ko": "read-modify-write의 정석. reg & ~mask로 대상 필드 비트만 0으로 만들고, (value\u003c\u003cshift)&mask로 새 값을 필드 위치에 정렬하며 mask로 넘치는 비트를 잘라낸다. 마지막에 OR로 합치면 나머지 비트는 전혀 건드리지 않고 필드만 바뀐다. shift>=32는 UB라 방어한다.", "complexity": "O(1) time, O(1) space", "pitfalls": ["value의 넘치는 비트를 mask로 절삭 안 함 -> 이웃 필드 오염", "shift>=32 시프트폭 UB", "ISR과 공유되는 실제 레지스터는 RMW가 비원자적 -> 경합"], "anduril_context": "I2C 센서/PMIC 설정 레지스터, STM32 GPIO MODER/타이머 CCMR 같은 MMIO 필드를 이웃 비트 안 건드리고 설정."}, {"num": 5, "slug": "uart_ring_buffer", "title_ko": "UART 링버퍼 (ISR 생산 / main 소비, SPSC)", "title_en": "UART ring buffer (SPSC)", "difficulty": "medium", "tags": ["ring-buffer", "spsc", "uart", "isr", "lock-free"], "prompt_ko": "단일 생산자(UART RX ISR) / 단일 소비자(main loop) 바이트 링버퍼. put은 가득 차면 false, get은 비면 false. power-of-two 크기 + 마스킹, head==tail=empty, 한 칸 희생(용량 SIZE-1).", "prompt_en": "Single-producer (UART RX ISR) / single-consumer (main) byte ring. put returns false when full, get false when empty. Pow2 size + masking, one slot sacrificed.", "signature": "bool uart_rb_put(uart_rb_t *rb, uint8_t byte); bool uart_rb_get(uart_rb_t *rb, uint8_t *out);", "examples": [{"in": "15개 put 후 16번째 put", "out": "false (full)"}, {"in": "put(1..15) 후 get 반복", "out": "1,2,...,15 (FIFO)"}], "hints": ["인덱스 마스킹: idx & (SIZE-1) (SIZE는 2의 거듭제곱).", "next=(head+1)&mask; next==tail이면 full.", "head==tail이면 empty.", "데이터를 먼저 쓰고 인덱스를 나중에 갱신(공개)한다."], "solution": "bool uart_rb_put(uart_rb_t *rb, uint8_t byte) {\n    if (!rb) return false;\n    uint32_t next = (rb->head + 1u) & (URB_SIZE - 1u);\n    if (next == (rb->tail & (URB_SIZE - 1u))) return false;  // full\n    rb->buf[rb->head & (URB_SIZE - 1u)] = byte;              // 1) 데이터\n    rb->head = next;                                         // 2) 인덱스 공개\n    return true;\n}\nbool uart_rb_get(uart_rb_t *rb, uint8_t *out) {\n    if (!rb || !out) return false;\n    if ((rb->head & (URB_SIZE-1u)) == (rb->tail & (URB_SIZE-1u))) return false; // empty\n    *out = rb->buf[rb->tail & (URB_SIZE - 1u)];\n    rb->tail = (rb->tail + 1u) & (URB_SIZE - 1u);\n    return true;\n}", "explanation_ko": "생산자(ISR)는 head만, 소비자(main)는 tail만 쓴다. 서로 상대 인덱스는 읽기만 하므로 단일코어에선 락이 필요 없다. full/empty를 count 없이 head/tail 관계로만 판별하려고 한 칸을 희생한다(head+1==tail=full). 데이터를 먼저 버퍼에 쓰고 그 다음 head를 갱신해야, 소비자가 미완성 슬롯을 읽지 않는다. 멀티코어에선 acquire/release 원자연산이 추가로 필요하다.", "complexity": "O(1) per op, O(SIZE) space", "pitfalls": ["인덱스 먼저 갱신 후 데이터 쓰기 -> 소비자가 쓰레기 읽음", "count 공유 -> 양쪽이 써서 경합", "SIZE가 2의 거듭제곱이 아니면 마스킹 불가", "head/tail을 volatile로 안 두면 컴파일러가 캐싱"], "anduril_context": "UART/시리얼 RX ISR이 바이트를 밀어넣고 main loop가 파싱. 임베디드에서 가장 흔한 ISR-main 파이프라인."}, {"num": 6, "slug": "crc8_frame_validate", "title_ko": "CRC-8 텔레메트리 프레임 검증", "title_en": "CRC-8 telemetry frame validation", "difficulty": "medium", "tags": ["crc", "checksum", "telemetry", "mavlink", "framing"], "prompt_ko": "CRC-8(poly 0x07, init 0x00, MSB-first)을 구현하고, [START 0xFE][len][payload...][crc] 프레임을 검증한다. crc는 START를 제외한 {len+payload} 위에서 계산. 시작바이트/길이일관성/crc가 모두 맞아야 true.", "prompt_en": "Implement CRC-8 (poly 0x07) and validate a [START 0xFE][len][payload][crc] frame; CRC covers len+payload (excluding START).", "signature": "uint8_t crc8(const uint8_t *data, size_t len); bool frame_validate(const uint8_t *frame, size_t total_len);", "examples": [{"in": "crc8(\"123456789\", 9)", "out": "0xF4"}, {"in": "올바른 프레임", "out": "true, crc 1비트 손상 -> false"}], "hints": ["각 바이트를 crc에 XOR한 뒤 8회: MSB가 1이면 (crc\u003c\u003c1)^0x07, 아니면 crc\u003c\u003c1.", "crc\u003c\u003c1은 int로 승격되므로 (uint8_t) 캐스트로 잘라라.", "프레임 검증: frame[0]==0xFE, frame[1]+3==total_len.", "crc8(&frame[1], total_len-2)가 frame[total_len-1]과 같아야 한다."], "solution": "uint8_t crc8(const uint8_t *data, size_t len) {\n    uint8_t crc = 0x00;\n    if (!data) return crc;\n    for (size_t i = 0; i \u003c len; i++) {\n        crc ^= data[i];\n        for (int b = 0; b \u003c 8; b++)\n            crc = (crc & 0x80u) ? (uint8_t)((crc\u003c\u003c1)^0x07u) : (uint8_t)(crc\u003c\u003c1);\n    }\n    return crc;\n}\nbool frame_validate(const uint8_t *frame, size_t total_len) {\n    if (!frame || total_len \u003c 3) return false;\n    if (frame[0] != 0xFEu) return false;\n    size_t payload_len = frame[1];\n    if (payload_len + 3u != total_len) return false;\n    return crc8(&frame[1], total_len - 2) == frame[total_len - 1];\n}", "explanation_ko": "CRC-8은 각 입력 바이트를 상위 8비트에 XOR한 뒤 8번의 시프트-조건부-폴리XOR로 나머지를 갱신한다(다항식 나눗셈). crc\u003c\u003c1이 int로 승격되므로 uint8_t 캐스트로 8비트를 유지한다. 프레임 검증은 시작바이트, 길이 필드 일관성, 후미 CRC 세 가지를 확인한다. CRC는 START 바이트를 빼고 len+payload 위에서 계산한다.", "complexity": "O(n) time (8 bits/byte), O(1) space", "pitfalls": ["crc\u003c\u003c1 캐스트 누락 -> 상위 비트 잔존으로 값 오염", "CRC 범위에 START를 포함/제외 혼동", "길이 필드 검증 누락 -> 버퍼 오버리드", "체크섬(단순 합)과 CRC 혼동 -> 버스트 에러 검출 약화"], "anduril_context": "MAVLink/사설 텔레메트리 프레임 무결성 검사, 무선 링크에서 손상된 패킷 폐기."}, {"num": 7, "slug": "complementary_filter", "title_ko": "IMU 상보 필터 (기울기 추정)", "title_en": "IMU complementary filter (tilt)", "difficulty": "medium", "tags": ["sensor-fusion", "imu", "filter", "float"], "prompt_ko": "자이로 적분과 가속도계 각도를 1차 상보 필터로 융합한다: angle = alpha*(prev + gyro_rate*dt) + (1-alpha)*accel_angle. alpha는 보통 0.98.", "prompt_en": "Fuse gyro integration and accelerometer angle: angle = alpha*(prev + gyro_rate*dt) + (1-alpha)*accel_angle.", "signature": "float complementary_filter(float prev_angle, float gyro_rate, float accel_angle, float dt, float alpha)", "examples": [{"in": "alpha=1, prev=10, rate=2, dt=0.01", "out": "10.02 (순수 gyro)"}, {"in": "alpha=0", "out": "accel_angle 그대로"}], "hints": ["자이로 추정 = prev_angle + gyro_rate*dt (고주파, 드리프트).", "가속도 각도 = accel_angle (저주파, 노이즈).", "두 항을 alpha, (1-alpha)로 가중합.", "alpha=1이면 순수 gyro, 0이면 순수 accel."], "solution": "float complementary_filter(float prev_angle, float gyro_rate,\n                           float accel_angle, float dt, float alpha) {\n    float gyro_est = prev_angle + gyro_rate * dt;\n    return alpha * gyro_est + (1.0f - alpha) * accel_angle;\n}", "explanation_ko": "자이로 적분은 단기적으로 정확하지만 시간이 지나면 드리프트가 쌓인다(고역통과 성격). 가속도계는 중력 벡터로 절대 각도를 주지만 진동 노이즈가 크다(저역통과 성격). alpha로 자이로에 무게를 두어 짧은 시간엔 자이로를 따르고, (1-alpha)로 가속도계를 조금씩 섞어 저주파 드리프트를 보정한다. 칼만필터의 저렴한 근사.", "complexity": "O(1) time, O(1) space", "pitfalls": ["alpha 부호/위치 혼동 ((1-alpha)를 gyro에 곱하는 실수)", "dt 단위 불일치 (ms vs s)", "고정소수점 이식 시 스케일/오버플로", "accel_angle 계산에서 atan2 인자 순서"], "anduril_context": "드론 자세(pitch/roll) 추정, 짐벌/카메라 안정화의 값싼 센서 퓨전."}, {"num": 8, "slug": "gpio_debounce", "title_ko": "GPIO 디바운스 (시프트 레지스터)", "title_en": "GPIO debounce (shift register)", "difficulty": "easy", "tags": ["gpio", "debounce", "shift-register", "polling"], "prompt_ko": "매 tick 원시 샘플을 8비트 히스토리에 밀어넣는다. history==0xFF(연속 8회 high)면 눌림 확정, 0x00이면 뗌 확정, 그 사이 바운싱에는 직전 확정 상태를 유지한다. 디바운스된 상태를 반환.", "prompt_en": "Shift each raw sample into an 8-bit history; 0xFF=pressed, 0x00=released, otherwise hold previous. Return debounced state.", "signature": "bool debounce_update(debounce_t *d, bool raw)", "examples": [{"in": "8회 연속 true", "out": "true (pressed)"}, {"in": "눌린 상태에서 1회 glitch low", "out": "true 유지"}], "hints": ["history = (history\u003c\u003c1) | (raw?1:0).", "history==0xFF -> state=true.", "history==0x00 -> state=false.", "그 외에는 state를 그대로 둔다(hold)."], "solution": "bool debounce_update(debounce_t *d, bool raw) {\n    if (!d) return false;\n    d->history = (uint8_t)((d->history \u003c\u003c 1) | (raw ? 1u : 0u));\n    if (d->history == 0xFFu)      d->state = true;   // 안정적 눌림\n    else if (d->history == 0x00u) d->state = false;  // 안정적 뗌\n    // else: 바운싱 -> 이전 상태 유지\n    return d->state;\n}", "explanation_ko": "기계식 스위치는 접점이 붙고 떨어질 때 수 ms 동안 채터(bounce)한다. 8샘플 히스토리를 시프트 레지스터로 유지하고, 최근 8회가 모두 1일 때만 눌림, 모두 0일 때만 뗌으로 확정한다. 중간의 짧은 glitch는 0xFF/0x00 조건을 못 만들어 무시되므로 이전 안정 상태가 유지된다. 카운터/적분기 방식보다 코드가 짧고 직관적이다.", "complexity": "O(1) time, O(1) space", "pitfalls": ["history\u003c\u003c1 캐스트 누락 (uint8_t 승격)", "샘플 주기 * 8이 바운스 지속보다 짧으면 여전히 채터", "hold 로직 누락 -> 중간 상태에서 튐"], "anduril_context": "물리 버튼/스위치/엔드스톱 입력의 채터 제거, 폴링 tick마다 호출."}, {"num": 9, "slug": "stick_to_pwm", "title_ko": "스틱 입력 -> PWM 모터 명령 (포화 매핑)", "title_en": "Stick to PWM command (saturating map)", "difficulty": "easy", "tags": ["mapping", "clamp", "pwm", "actuator", "saturation"], "prompt_ko": "RC 스틱 [-1000..+1000]을 PWM 펄스폭 [1000us..2000us]로 선형 매핑한다. 중립(0)=1500us. 범위 밖 입력은 포화(clamp). pwm = 1500 + stick/2.", "prompt_en": "Map RC stick [-1000..+1000] to PWM [1000..2000] us, neutral=1500; clamp out-of-range.", "signature": "uint16_t stick_to_pwm(int16_t stick)", "examples": [{"in": "stick_to_pwm(0)", "out": "1500"}, {"in": "stick_to_pwm(5000)", "out": "2000 (clamp)"}], "hints": ["먼저 stick을 [-1000,1000]으로 클램프한다.", "그 다음 스케일: 1500 + stick/2.", "클램프를 스케일보다 먼저 해야 오버플로가 없다."], "solution": "uint16_t stick_to_pwm(int16_t stick) {\n    if (stick \u003c -1000) stick = -1000;   // 하한 포화\n    if (stick >  1000) stick =  1000;   // 상한 포화\n    return (uint16_t)(1500 + stick / 2);\n}", "explanation_ko": "RC 스틱 값을 ESC/서보가 이해하는 PWM 펄스폭으로 변환한다. 반드시 먼저 범위를 클램프한 뒤 스케일해야 정수 오버플로나 범위 밖 출력을 막을 수 있다. 중립 1500us를 기준으로 스틱의 절반을 더해 [-1000,1000]을 [1000,2000]으로 대칭 매핑한다.", "complexity": "O(1) time, O(1) space", "pitfalls": ["클램프 전에 스케일 -> 오버플로/래핑", "중립/범위 상수 오프바이원", "데드밴드/역채널 요구를 놓침"], "anduril_context": "조종 입력->ESC/서보 출력 매핑, 액추에이터 명령 포화로 하드웨어 보호."}]}, {"id": "11_arrays_hashing", "order": 11, "range": "Arrays/Hash", "icon": "🗂️", "track": "dsa", "title_en": "Arrays & Hashing", "title_ko": "배열 & 해싱", "summary_ko": "STL 없는 C로 해시맵/해시셋(개방주소법)을 직접 구현하고, prefix-sum·two-pointer·고정크기 sliding window로 브루트포스 O(n²)를 O(n)으로 접는다. two_sum/contains_duplicate/product_except_self/range_sum/Kadane/window/two-pointer/move_zeroes/Boyer-Moore/top_k_frequent 10문제. product_except_self와 top_k_frequent는 리포트된 실제 Anduril 스타일 문제.", "summary_en": "Implement hashmap/hashset (open addressing) from scratch in C with no STL, then fold brute-force O(n^2) into O(n) using prefix sums, two-pointer, and fixed-size sliding windows. Ten problems: two_sum, contains_duplicate, product_except_self, range_sum, Kadane, window sum, sorted two-pointer, move_zeroes, Boyer-Moore majority, top_k_frequent. product_except_self and top_k_frequent are reported real Anduril-style questions.", "anduril_relevance_ko": "C 인터뷰엔 unordered_map이 없다 — 개방주소법 해시를 손으로 짜는 능력(해시 함수·충돌·부하율) 자체가 신호다. 드론/자율체는 스트림 텔레메트리를 한 패스로 처리해야 하므로 prefix-sum(누적 센서합)·sliding window(이동평균·버스트 검출)·two-pointer가 O(1) 상태로 O(n)을 달성하는 실전 패턴이다. 해시맵은 텔레메트리 ID 중복제거·룩업, prefix sum은 전류적산·누적 센서합 구간질의, sliding window는 과전류 스파이크 검출에 직결된다. product_except_self(나눗셈 금지)와 top_k_frequent(빈도 집계+정렬)은 실제 리포트된 Anduril 스타일 문제다.", "concepts": [{"term": "open addressing", "ko": "한 배열에 직접 저장, 충돌 시 선형/이차 탐사. cap=2^k 로 & 마스킹.", "en": "Store in one array; probe linearly on collision; cap=2^k enables & masking."}, {"term": "chaining", "ko": "슬롯마다 연결리스트. 삭제 쉽고 부하율에 관대하나 포인터/할당 비용.", "en": "Linked list per slot; easy deletes, tolerant load factor, but pointer/alloc cost."}, {"term": "load factor", "ko": "원소수/용량. 높으면 탐사 길어짐 → 보통 ≤0.5로 유지, 넘치면 rehash.", "en": "n/cap; high load lengthens probes; keep \u003c=0.5, rehash when exceeded."}, {"term": "prefix sum", "ko": "pre[k]=a[0..k-1]합. 구간합=pre[r+1]-pre[l], 질의당 O(1).", "en": "pre[k]=sum of first k; range sum = pre[r+1]-pre[l], O(1) per query."}, {"term": "Kadane", "ko": "cur=max(x, cur+x); best=max(best,cur). 1차원 DP, O(n)/O(1).", "en": "cur=max(x, cur+x); best=max(best,cur). 1D DP, O(n)/O(1)."}, {"term": "sliding window", "ko": "고정 k: sum+=in[i]-in[i-k]. 창 재계산 없이 O(n).", "en": "Fixed k: sum+=in[i]-in[i-k]; O(n) without recomputing the window."}, {"term": "two-pointer", "ko": "정렬 배열 양끝에서 합 비교로 lo++/hi--. O(n)/O(1).", "en": "On sorted arrays, compare ends and move lo++/hi--; O(n)/O(1)."}, {"term": "Boyer-Moore vote", "ko": "후보+카운트. 다른 값끼리 상쇄, 과반값은 살아남음. O(1) 공간.", "en": "Candidate+count; opposites cancel, the >n/2 majority survives; O(1) space."}, {"term": "prefix/suffix product", "ko": "나눗셈 없이 out[i]=좌측곱*우측곱. 0 안전.", "en": "out[i]=leftProduct*rightProduct without division; safe with zeros."}], "study_note_md": "# 11. Arrays & Hashing (배열 & 해싱) · Arrays/Hash 🗂️\n\n> STL 없는 C로 **해시맵/해시셋을 직접 구현**하고, prefix-sum·two-pointer·sliding\n> window 로 브루트포스 O(n²) 를 O(n) 으로 접는 드릴. Anduril 펌웨어/DSA 라운드의\n> \"배열을 한 번만 훑어서 풀 수 있나? 해시를 C로 직접 짜봐라\" 유형.\n\n---\n\n## 왜 이 토픽이 인터뷰에 나오나\n\n- C 인터뷰에는 `unordered_map` 이 없다. **개방주소법(open addressing) 해시맵을\n  손으로 짜는 능력** 자체가 신호다 — 해시 함수, 충돌 처리, 부하율(load factor).\n- 임베디드/텔레메트리는 **한 번의 패스로 스트림을 처리**해야 한다. prefix-sum(누적\n  센서합), sliding window(이동평균/버스트 검출), two-pointer 는 O(1) 추가 상태로\n  O(n) 을 달성하는 실전 패턴이다.\n- `product_except_self` 와 `top_k_frequent` 는 리포트된 실제 Anduril 스타일 문제.\n  전자는 \"나눗셈 없이\", 후자는 \"빈도 집계 + 정렬\"을 물어 자료구조 설계를 본다.\n\n---\n\n## 핵심 패턴 치트시트\n\n| 패턴 | 요점 | 복잡도 |\n|---|---|---|\n| **hashmap (open addressing)** | 값->인덱스/카운트. 선형 탐사, cap=2^k 마스킹. | 평균 O(1) 조회 |\n| **hashset** | 존재 여부만. 해시맵의 val 없는 버전. | 평균 O(1) |\n| **prefix sum** | `pre[k]=a[0..k-1]합`. 구간합 = `pre[r+1]-pre[l]`. | 전처리 O(n), 질의 O(1) |\n| **Kadane** | `cur=max(x, cur+x); best=max(best,cur)`. | O(n), O(1) |\n| **sliding window (고정 k)** | `sum += in[i] - in[i-k]`. | O(n), O(1) |\n| **two-pointer (정렬)** | 양끝에서 합 비교로 lo++/hi--. | O(n), O(1) |\n| **in-place 압축** | write 포인터로 원하는 원소를 앞으로. | O(n), O(1) |\n| **Boyer-Moore 투표** | 후보+카운트, count==0 이면 교체. | O(n), O(1) |\n\n---\n\n## 해시맵을 C로 직접 짜기 (이 토픽의 심장)\n\n```c\ntypedef struct { int key, val; bool used; } HMSlot;\ntypedef struct { HMSlot *s; size_t cap; } HashMap;\n\nstatic size_t hash_int(int key, size_t cap) {   // Knuth 곱셈 해시, 음수 안전\n    uint32_t x = (uint32_t)key;\n    x *= 2654435761u;                            // 2^32 / 황금비\n    return (size_t)x & (cap - 1);                // cap 은 2의 거듭제곱\n}\n// 삽입/조회: h = hash; 빈 슬롯 만날 때까지 (h+1)&(cap-1) 선형 탐사.\n```\n\n- **cap 을 2의 거듭제곱**으로 잡으면 `% cap` 대신 `& (cap-1)` — 나눗셈 회피(임베디드에서 중요).\n- **부하율**: 필요 원소수의 2배(≤0.5)를 잡아 탐사 길이를 짧게. 넘치면 실무는 rehash.\n- **삭제**는 tombstone 필요(이 드릴은 삽입/조회만 쓰므로 생략).\n- 대안은 **체이닝**(슬롯마다 연결 리스트) — 삭제 쉽고 부하율에 관대하나 포인터/할당 비용.\n\n---\n\n## 문제별 요점 & 함정\n\n### 1. two_sum (hashmap)\n- 값->인덱스 맵을 채우며 `target-nums[i]` 조회. 찾으면 (이전 인덱스, i). **한 패스**로 O(n).\n- 함정: `nums[i]` 를 조회 **후** 삽입해야 자기 자신과 짝짓지 않음. 중복값(`{3,3}`) 정상.\n\n### 2. contains_duplicate (hashset)\n- 삽입 중 이미 존재하면 즉시 true. NULL/빈/단일은 false.\n- 함정: 정렬(O(n log n)) 대신 해시로 O(n). 값 범위가 좁으면 비트셋도 고려.\n\n### 3. product_except_self (Anduril 리포트)\n- **나눗셈 금지**. 좌측 누적곱을 out 에 쓰고, 우측 누적곱을 되돌아오며 곱한다 → O(n), 출력 외 O(1).\n- 함정: 0 이 하나면 그 자리만 곱 살아남음. 0 이 둘 이상이면 전부 0. 나눗셈 풀이는 0 에서 터짐.\n\n### 4. range_sum (prefix-sum)\n- `pre[k]=nums[0..k-1]합`, `sum[l..r]=pre[r+1]-pre[l]`. **질의 여러 번**이면 전처리 후 질의당 O(1).\n- 함정: `size_t` 언더플로/역구간(`l>r`)·범위 초과(`r>=n`) 가드. 오버플로 방지 누적은 `long`.\n\n### 5. max_subarray (Kadane)\n- `cur=max(x, cur+x); best=max(best,cur)`. 전부 음수면 best=최댓값(단일 원소).\n- 함정: best 를 0 이 아니라 **nums[0]** 으로 초기화(전부 음수 케이스). 빈 배열 정책 명시.\n\n### 6. max_sum_window_k (고정 sliding window)\n- 첫 창 합을 구한 뒤 `sum += nums[i]-nums[i-k]` 로 슬라이드 → O(n).\n- 함정: `k==0`·`k>n` 가드. 매 창을 다시 더하면 O(n·k) — 슬라이드로 O(n).\n\n### 7. pair_sum_sorted (two-pointer)\n- **정렬 전제**. lo=0,hi=n-1 에서 합 비교: 크면 hi--, 작으면 lo++.\n- 함정: 정렬 안 된 입력엔 못 씀(그땐 해시). `int` 합 오버플로는 `long` 으로.\n\n### 8. move_zeroes (in-place)\n- write 포인터로 비-0 을 앞으로 압축 후 나머지 0 채움. 상대순서 유지, O(1) 추가공간.\n- 함정: 스왑 방식은 불필요한 쓰기 발생. 순서 유지가 요구조건.\n\n### 9. majority_element (Boyer-Moore)\n- 후보 하나 + 카운트만. `count==0` 이면 후보 교체, 같으면 ++, 다르면 --. **O(1) 공간**.\n- 함정: 다수 원소가 **존재한다는 가정**. 없으면 결과 무의미 → 실무는 2패스 검증 추가.\n\n### 10. top_k_frequent (Anduril 리포트, hashmap+sort)\n- 해시맵으로 빈도 집계 → (값,빈도) 배열 → 빈도 내림차순(동률 값 오름차순) 정렬 → 앞 k.\n- 함정: 동률 tie-break 를 정해 **결정적**으로. 대규모면 정렬 대신 힙/버킷정렬로 O(n).\n\n---\n\n## 인터뷰 팔로업 (자주 나오는 꼬리질문)\n\n1. **\"해시 충돌은 어떻게?\"** → 개방주소법(선형/이차 탐사) vs 체이닝. 부하율·rehash·tombstone.\n2. **\"해시 함수 뭘 쓰나?\"** → 정수는 곱셈 해시(Knuth)·FNV. cap=2^k 로 `&` 마스킹.\n3. **\"정렬 vs 해시?\"** → 해시 O(n) 평균이나 상수·메모리 큼. 정렬 O(n log n) 이나 제자리·캐시친화.\n4. **\"prefix sum 을 2D 로?\"** → 적분 이미지(integral image), 구간합 O(1).\n5. **\"sliding window 가변 크기?\"** → 조건 만족까지 우측 확장, 위반 시 좌측 축소(투 포인터).\n6. **\"Boyer-Moore 가 왜 맞나?\"** → 다수 원소는 상쇄 후에도 살아남음(등장>n/2 라서).\n7. **\"top-k 를 O(n) 으로?\"** → 최소힙 크기 k(O(n log k)) 또는 버킷정렬(빈도 인덱스, O(n)).\n\n---\n\n## 빌드 & 실행\n\n```sh\n# 연습(직접 채우기)\ncc -std=c11 -Wall -Wextra problems/11_arrays_hashing.c -o /tmp/andb_11 && /tmp/andb_11\n# 정답 확인 (전부 PASS)\ncc -std=c11 -Wall -Wextra solutions/11_arrays_hashing.c -o /tmp/andb_11 && /tmp/andb_11\n# 또는\nmake prob N=11_arrays_hashing      #  연습\nmake sol  N=11_arrays_hashing      #  정답\n```\n\n> **핵심 한 줄**: \"배열은 한 번만 훑어라.\" 해시로 짝을 O(1) 에 찾고, prefix 로 구간을\n> 미리 접고, window/two-pointer 로 상태를 굴려 O(n²) 를 O(n) 으로 내린다 — STL 없이.\n", "problems": [{"num": 1, "slug": "two_sum", "title_ko": "두 수의 합 (해시맵)", "title_en": "Two Sum (hashmap)", "difficulty": "easy", "tags": ["hashmap", "array", "one-pass"], "prompt_ko": "nums 에서 합이 target 인 서로 다른 두 인덱스를 찾아 out_i\u003cout_j 로 채우고 true. 없음/NULL/원소\u003c2 -> false. 값->인덱스 해시맵으로 한 패스 O(n).", "prompt_en": "Find two distinct indices whose values sum to target (out_i\u003cout_j). Value->index hashmap, one pass O(n).", "signature": "bool two_sum(const int *nums, size_t n, int target, int *out_i, int *out_j)", "examples": [{"in": "{2,7,11,15}, 9", "out": "(0,1), true"}, {"in": "{3,3}, 6", "out": "(0,1), true"}], "hints": ["값->인덱스 해시맵을 채우며 target-nums[i] 를 조회.", "조회 후 삽입해야 자기 자신과 짝짓지 않음.", "찾은 인덱스가 더 이르므로 out_i=idx, out_j=i."], "solution": "typedef struct { int key, val; bool used; } HMSlot;\ntypedef struct { HMSlot *s; size_t cap; } HashMap;\nstatic size_t np2(size_t n){ size_t p=1; while(p\u003cn)p\u003c\u003c=1; return p; }\nstatic size_t hint(int k,size_t c){ uint32_t x=(uint32_t)k; x*=2654435761u; return (size_t)x&(c-1); }\nstatic void hm_init(HashMap*m,size_t e){ m->cap=np2(e\u003c4?4:e*2); m->s=calloc(m->cap,sizeof(HMSlot)); }\nstatic void hm_free(HashMap*m){ free(m->s); }\nstatic bool hm_get(const HashMap*m,int k,int*o){\n    size_t i=hint(k,m->cap);\n    for(size_t p=0;p\u003cm->cap;p++){ size_t j=(i+p)&(m->cap-1);\n        if(!m->s[j].used)return false;\n        if(m->s[j].key==k){ if(o)*o=m->s[j].val; return true; } }\n    return false; }\nstatic void hm_put(HashMap*m,int k,int v){\n    size_t i=hint(k,m->cap);\n    for(size_t p=0;p\u003cm->cap;p++){ size_t j=(i+p)&(m->cap-1);\n        if(!m->s[j].used){ m->s[j].used=true; m->s[j].key=k; m->s[j].val=v; return; }\n        if(m->s[j].key==k){ m->s[j].val=v; return; } } }\nbool two_sum(const int *nums,size_t n,int target,int *out_i,int *out_j){\n    if(!nums||n\u003c2)return false;\n    HashMap m; hm_init(&m,n); bool found=false;\n    for(size_t i=0;i\u003cn;i++){\n        int idx; if(hm_get(&m,target-nums[i],&idx)){ if(out_i)*out_i=idx; if(out_j)*out_j=(int)i; found=true; break; }\n        hm_put(&m,nums[i],(int)i);\n    }\n    hm_free(&m); return found;\n}", "explanation_ko": "패턴: 해시맵(open addressing). 각 원소에서 필요한 짝(target-nums[i])이 이전에 나왔는지 O(1) 조회하고, 없으면 자기 값을 인덱스와 함께 저장한다. 브루트포스 O(n^2)를 한 패스 O(n)으로 접는다. 시간 O(n) 평균, 공간 O(n).", "complexity": "O(n) time (avg), O(n) space", "pitfalls": ["조회 전에 삽입하면 자기 자신과 짝지어 오답.", "해시 충돌·부하율 관리 안 하면 성능 저하.", "중복값(예: {3,3}) 처리 누락."], "anduril_context": "텔레메트리 ID 매칭·룩업 테이블: 스트림에서 짝이 되는 레코드를 O(1)에 찾기."}, {"num": 2, "slug": "contains_duplicate", "title_ko": "중복 존재 (해시셋)", "title_en": "Contains Duplicate (hashset)", "difficulty": "easy", "tags": ["hashset", "array"], "prompt_ko": "중복 원소가 하나라도 있으면 true. NULL/빈/단일 -> false. 해시셋 O(n).", "prompt_en": "Return true if any value repeats. Hashset, O(n).", "signature": "bool contains_duplicate(const int *nums, size_t n)", "examples": [{"in": "{1,2,3,1}", "out": "true"}, {"in": "{1,2,3,4}", "out": "false"}], "hints": ["해시셋에 삽입하며 이미 존재하면 즉시 true.", "정렬(O(n log n)) 대신 해시로 O(n).", "값 범위가 좁으면 비트셋도 고려."], "solution": "typedef struct { int key; bool used; } HSSlot;\ntypedef struct { HSSlot *s; size_t cap; } HashSet;\nstatic size_t np2(size_t n){ size_t p=1; while(p\u003cn)p\u003c\u003c=1; return p; }\nstatic size_t hint(int k,size_t c){ uint32_t x=(uint32_t)k; x*=2654435761u; return (size_t)x&(c-1); }\nstatic bool hs_add(HashSet*s,int k){\n    size_t i=hint(k,s->cap);\n    for(size_t p=0;p\u003cs->cap;p++){ size_t j=(i+p)&(s->cap-1);\n        if(!s->s[j].used){ s->s[j].used=true; s->s[j].key=k; return false; }\n        if(s->s[j].key==k)return true; }\n    return false; }\nbool contains_duplicate(const int *nums,size_t n){\n    if(!nums||n\u003c2)return false;\n    HashSet s; s.cap=np2(n\u003c4?4:n*2); s.s=calloc(s.cap,sizeof(HSSlot));\n    bool dup=false;\n    for(size_t i=0;i\u003cn;i++){ if(hs_add(&s,nums[i])){ dup=true; break; } }\n    free(s.s); return dup;\n}", "explanation_ko": "패턴: 해시셋. 삽입 도중 이미 있는 값을 만나면 바로 중복. 정렬 후 인접 비교(O(n log n), 제자리)와 트레이드오프. 시간 O(n) 평균, 공간 O(n).", "complexity": "O(n) time (avg), O(n) space", "pitfalls": ["빈/단일 배열 false 처리 누락.", "해시셋 대신 O(n^2) 이중루프.", "메모리 여유 없을 땐 정렬/비트셋 대안 고려."], "anduril_context": "텔레메트리 패킷 ID 중복 검출(재전송/루프백 탐지)·센서 ID 유일성 검증."}, {"num": 3, "slug": "product_except_self", "title_ko": "자기 제외 곱 (Anduril)", "title_en": "Product Except Self (Anduril)", "difficulty": "medium", "tags": ["prefix-product", "array", "no-division"], "prompt_ko": "out[i]=i 제외 모든 원소의 곱. 나눗셈 금지, 0 포함해도 정상. NULL/빈 -> no-op, 단일 -> {1}. (Anduril 리포트 문제)", "prompt_en": "out[i] = product of all except nums[i], no division. (reported Anduril question)", "signature": "void product_except_self(const int *nums, size_t n, long *out)", "examples": [{"in": "{1,2,3,4}", "out": "{24,12,8,6}"}, {"in": "{-1,1,0,-3,3}", "out": "{0,0,9,0,0}"}], "hints": ["좌측 누적곱을 먼저 out 에 쓴다.", "우측 누적곱을 뒤에서부터 곱한다.", "나눗셈 풀이는 0 에서 터진다 — 금지 이유."], "solution": "void product_except_self(const int *nums,size_t n,long *out){\n    if(!nums||!out||n==0)return;\n    long prefix=1;\n    for(size_t i=0;i\u003cn;i++){ out[i]=prefix; prefix*=nums[i]; }\n    long suffix=1;\n    for(size_t i=n;i-->0;){ out[i]*=suffix; suffix*=nums[i]; }\n}", "explanation_ko": "패턴: prefix/suffix 누적곱. out[i]는 (i 왼쪽 전체 곱)*(i 오른쪽 전체 곱). 첫 패스로 왼쪽곱을 채우고, 두 번째 패스로 오른쪽곱을 곱해 나눗셈 없이 완성. 0 이 하나면 그 자리만 살고 나머지는 0. 시간 O(n), 공간 O(1)(출력 제외).", "complexity": "O(n) time, O(1) extra space", "pitfalls": ["나눗셈 풀이는 0 원소에서 division-by-zero.", "오버플로 방지 위해 누적은 long.", "단일 원소는 {1}(빈 곱=1)."], "anduril_context": "센서 게인 정규화·채널별 상대 가중치 계산: 특정 채널 제외 곱을 나눗셈 없이(0 방어)."}, {"num": 4, "slug": "range_sum_prefix", "title_ko": "구간합 질의 (prefix-sum)", "title_en": "Range Sum (prefix-sum)", "difficulty": "easy", "tags": ["prefix-sum", "array", "range-query"], "prompt_ko": "nums[l..r] 합(양끝 포함)을 prefix-sum 으로. 잘못된 구간(l>r, r>=n, NULL, 빈) -> 0. 질의 여러 번이면 전처리 후 질의당 O(1).", "prompt_en": "Inclusive sum of nums[l..r] via prefix sums. Invalid range -> 0.", "signature": "long range_sum(const int *nums, size_t n, size_t l, size_t r)", "examples": [{"in": "{1,2,3,4,5}, 1, 3", "out": "9"}, {"in": "{1,2,3,4,5}, 0, 4", "out": "15"}], "hints": ["pre[k]=nums[0..k-1] 합.", "sum[l..r]=pre[r+1]-pre[l].", "l>r / r>=n / NULL 가드."], "solution": "long range_sum(const int *nums,size_t n,size_t l,size_t r){\n    if(!nums||n==0||l>r||r>=n)return 0;\n    long *pre=malloc((n+1)*sizeof(long)); if(!pre)return 0;\n    pre[0]=0; for(size_t i=0;i\u003cn;i++)pre[i+1]=pre[i]+nums[i];\n    long res=pre[r+1]-pre[l]; free(pre); return res;\n}", "explanation_ko": "패턴: prefix-sum(누적합). pre[k]=처음 k개 합. 구간합은 두 접두합의 차 pre[r+1]-pre[l] 로 O(1). 여기선 데모로 매 호출 전처리하지만, 실무는 한 번 만들고 질의를 반복해 질의당 O(1). 전처리 O(n), 질의 O(1), 공간 O(n).", "complexity": "O(n) preprocess, O(1) per query", "pitfalls": ["size_t 언더플로/역구간(l>r) 미방어.", "오버플로 방지 누적은 long.", "경계 off-by-one: pre[r+1]-pre[l] (포함 구간)."], "anduril_context": "누적 센서합·적산(전류적산=배터리 소모, 누적 이동거리) 구간 조회를 O(1)에."}, {"num": 5, "slug": "max_subarray_kadane", "title_ko": "최대 부분배열합 (Kadane)", "title_en": "Max Subarray (Kadane)", "difficulty": "medium", "tags": ["kadane", "dp", "array"], "prompt_ko": "연속 부분배열의 최대합. 전부 음수면 최댓값(단일). 빈 -> 0. Kadane O(n).", "prompt_en": "Maximum contiguous subarray sum (Kadane). All-negative -> max element.", "signature": "long max_subarray(const int *nums, size_t n)", "examples": [{"in": "{-2,1,-3,4,-1,2,1,-5,4}", "out": "6"}, {"in": "{-1,-2,-3}", "out": "-1"}], "hints": ["cur=max(x, cur+x): 새로 시작 vs 이어가기.", "best=max(best,cur).", "best/cur 를 nums[0] 으로 초기화(전부 음수)."], "solution": "long max_subarray(const int *nums,size_t n){\n    if(!nums||n==0)return 0;\n    long best=nums[0],cur=nums[0];\n    for(size_t i=1;i\u003cn;i++){ long v=nums[i]; cur=(v>cur+v)?v:cur+v; if(cur>best)best=cur; }\n    return best;\n}", "explanation_ko": "패턴: Kadane(1차원 DP). 각 위치에서 '여기서 끝나는 최대합' cur 은 이전 cur 에 이어붙일지 새로 시작할지 중 큰 값. 전역 best 가 답. 음수 손실이 누적을 갉아먹으면 새로 시작. 시간 O(n), 공간 O(1).", "complexity": "O(n) time, O(1) space", "pitfalls": ["best 를 0 으로 초기화하면 전부 음수 케이스 오답.", "빈 배열 정책(여기선 0) 명시.", "오버플로는 long 누적."], "anduril_context": "신호 강도/전력 스트림에서 최대 연속 이득 구간·최고 성능 윈도우 탐지."}, {"num": 6, "slug": "max_sum_window_k", "title_ko": "고정창 최대합 (sliding window)", "title_en": "Max Window Sum (sliding window)", "difficulty": "easy", "tags": ["sliding-window", "array"], "prompt_ko": "크기 k 인 연속 창의 최대합. k==0 또는 k>n -> 0. 슬라이딩 윈도우 O(n).", "prompt_en": "Max sum of any contiguous window of size k. Sliding window O(n).", "signature": "long max_sum_window_k(const int *nums, size_t n, size_t k)", "examples": [{"in": "{2,1,5,1,3,2}, 3", "out": "9"}, {"in": "{1,2,3,4,5}, 2", "out": "9"}], "hints": ["첫 창 합을 구한다.", "sum += nums[i]-nums[i-k] 로 한 칸 슬라이드.", "k==0/k>n 가드."], "solution": "long max_sum_window_k(const int *nums,size_t n,size_t k){\n    if(!nums||k==0||k>n)return 0;\n    long sum=0; for(size_t i=0;i\u003ck;i++)sum+=nums[i];\n    long best=sum;\n    for(size_t i=k;i\u003cn;i++){ sum+=nums[i]-nums[i-k]; if(sum>best)best=sum; }\n    return best;\n}", "explanation_ko": "패턴: 고정크기 sliding window. 창을 통째로 다시 더하지 않고 들어오는 원소를 더하고 나가는 원소를 빼서 O(1) 갱신 → 전체 O(n). 매 창 재계산(O(n*k))을 피하는 것이 핵심. 공간 O(1).", "complexity": "O(n) time, O(1) space", "pitfalls": ["매 창 재합산하면 O(n*k).", "k==0/k>n 경계 미처리.", "나가는 인덱스 i-k off-by-one."], "anduril_context": "이동평균·버스트 검출: 최근 k 샘플 합/평균으로 순간 스파이크·과전류 윈도우 탐지."}, {"num": 7, "slug": "pair_sum_sorted", "title_ko": "정렬 배열 두 수 합 (two-pointer)", "title_en": "Pair Sum Sorted (two-pointer)", "difficulty": "easy", "tags": ["two-pointer", "sorted", "array"], "prompt_ko": "오름차순 nums 에서 합이 target 인 두 인덱스(out_i\u003cout_j) -> true. 없음/NULL/원소\u003c2 -> false. 투 포인터 O(n).", "prompt_en": "On a sorted array, find two indices summing to target via two-pointer.", "signature": "bool pair_sum_sorted(const int *nums, size_t n, int target, int *out_i, int *out_j)", "examples": [{"in": "{1,2,3,4,6}, 6", "out": "(1,3), true"}, {"in": "{2,3,4}, 6", "out": "(0,2), true"}], "hints": ["lo=0, hi=n-1 에서 시작.", "합이 크면 hi--, 작으면 lo++.", "정렬 전제 — 아니면 해시로."], "solution": "bool pair_sum_sorted(const int *nums,size_t n,int target,int *out_i,int *out_j){\n    if(!nums||n\u003c2)return false;\n    size_t lo=0,hi=n-1;\n    while(lo\u003chi){ long s=(long)nums[lo]+nums[hi];\n        if(s==target){ if(out_i)*out_i=(int)lo; if(out_j)*out_j=(int)hi; return true; }\n        if(s\u003ctarget)lo++; else hi--; }\n    return false;\n}", "explanation_ko": "패턴: two-pointer(정렬 활용). 양끝에서 합을 보고 target 보다 크면 오른쪽을 줄이고 작으면 왼쪽을 늘려 탐색공간을 한쪽씩 제거. 정렬돼 있으면 해시 없이 O(n), O(1) 공간. 미정렬이면 해시(문제 1)를 쓴다.", "complexity": "O(n) time, O(1) space", "pitfalls": ["미정렬 입력에 그대로 쓰면 오답.", "int 합 오버플로 → long 캐스팅.", "lo\u003chi 종료조건(같은 원소 두 번 사용 방지)."], "anduril_context": "정렬된 캘리브레이션 테이블에서 목표값 만드는 두 계수 탐색(메모리 O(1) 임베디드)."}, {"num": 8, "slug": "move_zeroes", "title_ko": "0 뒤로 밀기 (in-place)", "title_en": "Move Zeroes (in-place)", "difficulty": "easy", "tags": ["two-pointer", "in-place", "array"], "prompt_ko": "모든 0 을 끝으로 밀되 비-0 상대순서 유지. NULL/빈 -> no-op. 제자리 O(1) 공간.", "prompt_en": "Move all zeroes to the end in place, preserving non-zero order.", "signature": "void move_zeroes(int *nums, size_t n)", "examples": [{"in": "{0,1,0,3,12}", "out": "{1,3,12,0,0}"}, {"in": "{0,0,1}", "out": "{1,0,0}"}], "hints": ["write 포인터로 비-0 을 앞으로 압축.", "남은 자리를 0 으로 채움.", "스왑보다 압축이 쓰기 적음."], "solution": "void move_zeroes(int *nums,size_t n){\n    if(!nums||n==0)return;\n    size_t w=0;\n    for(size_t i=0;i\u003cn;i++) if(nums[i]!=0) nums[w++]=nums[i];\n    while(w\u003cn) nums[w++]=0;\n}", "explanation_ko": "패턴: 슬로우/패스트(write) 포인터로 제자리 압축. 비-0 을 write 위치로 당겨 순서를 유지하고, 끝에 0 을 채운다. 추가 배열 없이 O(1) 공간, 한 패스 O(n). 스왑 방식은 불필요한 쓰기가 는다.", "complexity": "O(n) time, O(1) space", "pitfalls": ["상대순서 깨는 스왑/정렬 사용.", "빈/단일/무-0 배열 처리.", "두 번째 루프에서 남은 0 채우기 누락."], "anduril_context": "링버퍼/DMA 버퍼 압축: 유효 샘플을 앞으로 모으고 빈 슬롯을 뒤로(제자리, 추가 메모리 0)."}, {"num": 9, "slug": "majority_element", "title_ko": "다수 원소 (Boyer-Moore)", "title_en": "Majority Element (Boyer-Moore)", "difficulty": "easy", "tags": ["boyer-moore", "voting", "array"], "prompt_ko": "등장>n/2 인 다수 원소 반환(존재 가정). Boyer-Moore 투표로 O(n) 시간, O(1) 공간.", "prompt_en": "Return the majority element (appears > n/2), assumed to exist. O(1) space.", "signature": "int majority_element(const int *nums, size_t n)", "examples": [{"in": "{3,2,3}", "out": "3"}, {"in": "{2,2,1,1,1,2,2}", "out": "2"}], "hints": ["후보 하나 + 카운트만 유지.", "count==0 이면 현재 원소를 후보로 교체.", "같으면 ++, 다르면 --."], "solution": "int majority_element(const int *nums,size_t n){\n    int cand=0,count=0;\n    for(size_t i=0;i\u003cn;i++){ if(count==0)cand=nums[i]; count+=(nums[i]==cand)?1:-1; }\n    return cand;\n}", "explanation_ko": "패턴: Boyer-Moore 다수결 투표. 다른 값끼리는 서로 상쇄(count 증감)되고, 등장>n/2 인 다수 원소는 상쇄 후에도 반드시 살아남는다. 해시 카운트(O(n) 공간) 없이 O(1) 공간으로 해결. 시간 O(n).", "complexity": "O(n) time, O(1) space", "pitfalls": ["다수 원소가 실제로 존재한다는 가정 필요(없으면 2패스 검증).", "카운트 로직(교체 타이밍) 실수.", "해시로 풀면 O(n) 공간 낭비."], "anduril_context": "센서 다중화 투표(TMR): 여러 리던던트 채널 중 과반 값을 O(1) 메모리로 선출."}, {"num": 10, "slug": "top_k_frequent", "title_ko": "상위 K 빈발값 (Anduril)", "title_en": "Top-K Frequent (Anduril)", "difficulty": "medium", "tags": ["hashmap", "sort", "frequency"], "prompt_ko": "가장 자주 나온 상위 k 개 값을 out 에 채운다. 정렬 기준: 빈도 내림차순, 동률은 값 오름차순. NULL/빈/k==0 -> no-op. (Anduril 리포트 문제)", "prompt_en": "Fill out with the k most frequent values (freq desc, tie: value asc). (reported Anduril question)", "signature": "void top_k_frequent(const int *nums, size_t n, size_t k, int *out)", "examples": [{"in": "{1,1,1,2,2,3}, 2", "out": "{1,2}"}, {"in": "{5,5,4,4,3,3}, 3", "out": "{3,4,5}"}], "hints": ["해시맵으로 빈도 집계.", "(값,빈도) 배열을 만들어 qsort.", "동률 tie-break 를 정해 결정적으로."], "solution": "typedef struct { int key, val; bool used; } HMSlot;\ntypedef struct { HMSlot *s; size_t cap; } HashMap;\nstatic size_t np2(size_t n){ size_t p=1; while(p\u003cn)p\u003c\u003c=1; return p; }\nstatic size_t hint(int k,size_t c){ uint32_t x=(uint32_t)k; x*=2654435761u; return (size_t)x&(c-1); }\nstatic void hm_init(HashMap*m,size_t e){ m->cap=np2(e\u003c4?4:e*2); m->s=calloc(m->cap,sizeof(HMSlot)); }\nstatic void hm_free(HashMap*m){ free(m->s); }\nstatic bool hm_get(const HashMap*m,int k,int*o){\n    size_t i=hint(k,m->cap);\n    for(size_t p=0;p\u003cm->cap;p++){ size_t j=(i+p)&(m->cap-1);\n        if(!m->s[j].used)return false;\n        if(m->s[j].key==k){ if(o)*o=m->s[j].val; return true; } }\n    return false; }\nstatic void hm_put(HashMap*m,int k,int v){\n    size_t i=hint(k,m->cap);\n    for(size_t p=0;p\u003cm->cap;p++){ size_t j=(i+p)&(m->cap-1);\n        if(!m->s[j].used){ m->s[j].used=true; m->s[j].key=k; m->s[j].val=v; return; }\n        if(m->s[j].key==k){ m->s[j].val=v; return; } } }\ntypedef struct { int val, freq; } VF;\nstatic int vf_cmp(const void *a,const void *b){\n    const VF *x=a,*y=b; if(x->freq!=y->freq)return y->freq-x->freq; return x->val-y->val; }\nvoid top_k_frequent(const int *nums,size_t n,size_t k,int *out){\n    if(!nums||!out||k==0||n==0)return;\n    HashMap m; hm_init(&m,n); VF *u=malloc(n*sizeof(VF)); size_t un=0;\n    for(size_t i=0;i\u003cn;i++){ int c;\n        if(hm_get(&m,nums[i],&c))hm_put(&m,nums[i],c+1);\n        else { hm_put(&m,nums[i],1); u[un++].val=nums[i]; } }\n    for(size_t i=0;i\u003cun;i++){ int c; hm_get(&m,u[i].val,&c); u[i].freq=c; }\n    qsort(u,un,sizeof(VF),vf_cmp);\n    size_t take=(k\u003cun)?k:un;\n    for(size_t i=0;i\u003ctake;i++)out[i]=u[i].val;\n    free(u); hm_free(&m);\n}", "explanation_ko": "패턴: 해시맵 빈도 집계 + 정렬. 한 패스로 값별 카운트를 맵에 쌓고, 유일값을 (값,빈도) 배열로 모아 빈도 내림차순(동률은 값 오름차순)으로 qsort 후 앞 k 개를 취한다. 시간 O(n + u log u), 공간 O(u). 대규모면 정렬 대신 최소힙(O(n log k))이나 버킷정렬(O(n)).", "complexity": "O(n + u log u) time, O(u) space (u=유일값 수)", "pitfalls": ["동률 tie-break 미정 → 비결정적 출력.", "k>유일값 수 경계 처리.", "정렬 오버킬 — 초대형은 힙/버킷정렬."], "anduril_context": "로그/이벤트 스트림에서 최빈 에러코드·최다 텔레메트리 소스 Top-K 집계(대시보드/알람)."}]}, {"id": "12_stack_queue", "order": 12, "range": "Stack/Queue", "icon": "🥞", "track": "dsa", "title_en": "Stacks & Queues", "title_ko": "스택 & 큐", "summary_ko": "배열 기반 스택으로 괄호 검증·RPN 평가·중첩 디코딩을, 단조 스택으로 next-greater·온도 대기일을, 단조 덱으로 슬라이딩 윈도우 최댓값을 전부 O(n) 에 푸는 8문제. 모두 STL 없이 배열로 직접 구현.", "summary_en": "Eight LC-medium problems: an array-backed stack drives paren validation, RPN eval, and nested decode; a monotonic stack gives O(n) next-greater and daily-temperatures; a monotonic deque gives O(n) sliding-window max. All stacks/deques hand-rolled in C, no STL.", "anduril_relevance_ko": "스택은 파서/평가기의 뼈대: 텔레메트리 명령 파싱, 수식/설정 문법(RPN), 중첩 구조 디코딩이 전부 스택이다. 배열 기반 스택은 힙 없이 O(1)·고정 깊이로 결정론적이라 malloc 금지 펌웨어(MISRA)와 맞는다. 단조 스택/덱은 신호의 국소 피크 추적과 슬라이딩 최댓값(고정 지연 필터)을 실시간 O(n) 으로 준다.", "concepts": [{"term": "array-backed stack", "ko": "int a[]; int top; — push a[top++], pop a[--top], 힙 0", "en": "int a[]; int top; push a[top++], pop a[--top], zero heap"}, {"term": "paren matching", "ko": "여는 괄호 push, 닫는 괄호 top 과 짝 확인 후 pop", "en": "push openers, on a closer check the top pairs then pop"}, {"term": "auxiliary min stack", "ko": "값 스택 옆에 접두 최솟값 스택 → getMin O(1)", "en": "a parallel prefix-min stack makes getMin O(1)"}, {"term": "monotonic stack", "ko": "조건 깨면 pop 하며 답 확정; 각 원소 1회 push/pop → O(n)", "en": "pop when order breaks, each element pushed/popped once → O(n)"}, {"term": "monotonic deque", "ko": "앞=창의 최댓값; 앞은 만료로, 뒤는 더 큰 값으로 제거", "en": "front = window max; pop front on expiry, back on a larger value"}, {"term": "queue via two stacks", "ko": "in/out 두 스택, out 이 빌 때만 뒤집기 → 분할상환 O(1)", "en": "in/out stacks, refill out only when empty → amortized O(1)"}, {"term": "stack parsing (RPN/decode)", "ko": "피연산자·부분결과를 쌓았다 연산자·']'에서 꺼내 합침", "en": "stack operands/partials, pop and combine at an operator or ']'"}], "study_note_md": "# 12. 스택 & 큐 (Stacks & Queues) 🥞\n\n> 배열 기반 스택 하나로 괄호 검증부터 파서까지 풀린다. 여기에 **단조 스택**(monotonic\n> stack)과 **단조 덱**(monotonic deque)이라는 두 개의 관용구를 얹으면, 얼핏 O(n²) 로 보이는\n> \"다음 큰 값 / 온도 대기일 / 슬라이딩 윈도우 최댓값\" 이 전부 **O(n)** 으로 떨어진다.\n> LC-medium 코딩 라운드의 단골 패턴들이다.\n\n---\n\n## 왜 Anduril 펌웨어 인터뷰에 나오나\n\n- 스택은 **파서/평가기의 뼈대**다. 텔레메트리 명령어 파싱, 수식/설정 문법(RPN), 중첩 구조\n  디코딩 등은 전부 스택으로 처리한다.\n- 배열 기반 스택은 **힙 없이 O(1)**, 최대 깊이가 컴파일 타임에 고정 → 결정론적. malloc 을\n  금지하는 방산 펌웨어(MISRA-C, 실시간성)와 잘 맞는다.\n- 단조 스택/덱은 신호 처리에서 **국소 피크 추적**과 **슬라이딩 최댓값**(고정 지연 필터)의\n  실시간 O(n) 알고리즘이다. 센서 스트림에서 \"언제 임계 초과가 풀리나\"가 곧 daily_temperatures.\n- 인터뷰어는 \"O(n²) → O(n)\" 최적화를 스스로 떠올리는지, 그리고 **덱의 앞/뒤 제거 조건**을\n  정확히 짜는지로 실력을 가늠한다.\n\n---\n\n## 핵심 개념 치트시트\n\n| 개념 | 한 줄 요약 |\n|------|-----------|\n| 배열 기반 스택 | `int a[]; int top;` — push `a[top++]`, pop `a[--top]`. 힙 0, O(1). |\n| 짝 맞추기(paren) | 여는 건 push, 닫는 건 top 과 짝 확인 후 pop. 끝에 비면 유효. |\n| 보조 스택(MinStack) | 값 스택과 나란히 \"접두 최솟값\" 스택을 쌓아 getMin O(1). |\n| 단조 스택 | top 이 조건을 어기면 pop 하며 답 확정. 각 원소 1회 push/pop → O(n). |\n| 단조 덱 | 앞=창의 최댓값. 앞은 만료로, 뒤는 더 큰 값 등장으로 제거. O(n). |\n| 두 스택 큐 | in/out 두 스택. out 이 빌 때만 in 을 뒤집어 옮김 → 분할상환 O(1). |\n| 스택 파싱(RPN/decode) | 피연산자·부분결과를 쌓았다가 연산자·']' 에서 꺼내 합침. |\n\n---\n\n## (A) 배열 기반 스택 — 모든 것의 기본\n\n```c\ntypedef struct { int *a; int top; int cap; } istk_t;   // top == 크기 == 다음 삽입 위치\nstatic void istk_push(istk_t *s, int v) { s->a[s->top++] = v; }\nstatic int  istk_pop (istk_t *s)        { return s->a[--s->top]; }\nstatic int  istk_peek(const istk_t *s)  { return s->a[s->top - 1]; }\nstatic bool istk_empty(const istk_t *s) { return s->top == 0; }\n```\n\n- `top` 을 \"다음에 쓸 칸\"으로 두면 push/pop 이 대칭이라 off-by-one 이 없다.\n- 임베디드에선 `cap` 을 최대 깊이로 고정하고 `malloc` 대신 정적 배열을 쓰면 힙이 0.\n\n### 괄호 검증 (valid_parentheses)\n\n```c\nif (여는 괄호) push;\nelse if (닫는 괄호) {\n    if (스택 비었으면) return false;      // 짝 없는 닫힘\n    if (top 이 짝이 아니면) return false;  // ( 와 ] 처럼 엇갈림\n    pop;\n}\n// 끝: top == 0 이어야 유효 (남은 여는 괄호 없음)\n```\n\n- 세 가지 실패 모드: **엇갈린 짝**, **닫는데 빈 스택**, **끝에 남은 여는 괄호**. 셋 다 잡아야 한다.\n\n### MinStack — getMin 을 O(1) 로\n\n```c\npush(x): val[top]=x; mn[top]=min(x, top>0 ? mn[top-1] : x); top++;\ngetMin(): return mn[top-1];   // 접두 최솟값이라 pop 해도 자동 복원\n```\n\n- 핵심 아이디어: **각 위치에 \"그 시점까지의 최솟값\"을 캐시**한다. pop 하면 그 아래 캐시가\n  그대로 이전 최솟값 → 롤백 공짜. 값 하나마다 int 하나 추가 = O(n) 공간, 모든 연산 O(1).\n\n---\n\n## (B) 단조 스택 (Monotonic Stack) — O(n²) → O(n)\n\n> **아이디어**: 스택에 \"아직 답을 못 찾은 인덱스\"만, 값이 **단조**가 되도록 쌓는다.\n> 현재 원소가 스택 top 의 조건을 깨는 순간, 그 원소가 곧 대기자들의 답이다.\n\n### next_greater_element (오른쪽 첫 더 큰 값)\n\n```c\nfor i in 0..n:\n    while (!empty && a[peek] \u003c a[i]) out[pop] = a[i];  // 현재값이 대기자들의 next greater\n    push(i);\n// 끝까지 안 나온 인덱스는 -1 (초기값)\n```\n\n### daily_temperatures (더 따뜻한 날까지 며칠)\n\n```c\nwhile (!empty && t[peek] \u003c t[i]) { j = pop; out[j] = i - j; }  // 날짜 차이가 답\npush(i);\n```\n\n- **왜 O(n)?** 각 인덱스는 **정확히 한 번 push, 한 번 pop** 된다. while 이 안쪽에 있어도\n  전체 pop 횟수는 n 을 넘지 않는다 → 분할상환 O(n).\n- **인덱스를 저장**하는 게 포인트. 값만 저장하면 \"며칠 차이\" 같은 위치 정보를 못 낸다.\n- \"다음 **작은** 값\"이면 부등호만 뒤집으면 된다(`>` 로). 단조 증가 스택.\n\n---\n\n## (C) 단조 덱 (Monotonic Deque) — 슬라이딩 윈도우 최댓값\n\n> 스택은 한쪽만 열려 있다. 창이 **앞에서 만료**되고 뒤에서 새 원소가 들어오려면 **양쪽이\n> 열린 덱**이 필요하다. 값 기준 단조 감소로 유지하면 **앞(head)이 항상 창의 최댓값**.\n\n```c\nint dq[n], head=0, tail=0;                       // 인덱스 저장, [head, tail)\nfor i in 0..n:\n    if (head\u003ctail && dq[head] \u003c= i-k) head++;    // (1) 창 벗어난 앞 원소 만료\n    while (head\u003ctail && a[dq[tail-1]] \u003c= a[i]) tail--;  // (2) 더 작은 뒤 원소 제거\n    dq[tail++] = i;                              // (3) 현재 인덱스 push\n    if (i >= k-1) out[oi++] = a[dq[head]];       // (4) 창이 차면 최댓값 기록\n```\n\n- (1) 만료는 `if` 로 충분(한 스텝에 최대 하나만 창을 벗어남). (2) 는 여러 개 지울 수 있어 `while`.\n- 각 인덱스 역시 한 번 push/한 번 pop → **O(n)**. 힙-기반 O(n log k) 보다 빠르고 결정론적.\n- **인덱스를 저장**해야 만료 조건(`dq[head] \u003c= i-k`)을 검사할 수 있다.\n\n---\n\n## (D) 두 스택으로 큐 (Queue via two stacks)\n\n```c\nenqueue(x): in.push(x);\nshift():    if (out.empty) while(!in.empty) out.push(in.pop());  // 뒤집어 옮김\ndequeue():  shift(); return out.pop();\npeek():     shift(); return out.peek();\n```\n\n- **왜 분할상환 O(1)?** 각 원소는 in→out 으로 **최대 한 번만** 이동한다. 어떤 dequeue 는\n  O(n)(뒤집기)이지만, n 번의 연산에 걸쳐 총 이동은 O(n) → 평균 O(1).\n- **함정**: out 이 비었을 때만 옮겨야 한다. 매번 옮기면 순서가 뒤죽박죽.\n\n---\n\n## (E) 스택 파싱 — RPN 과 중첩 디코드\n\n### eval_rpn (후위 표기 평가)\n\n```c\n피연산자 -> push\n연산자   -> b=pop; a=pop; push(a op b);   // 순서 주의! b 가 먼저\n```\n\n- **뺄셈/나눗셈은 순서가 생명**: `a - b`, `a / b` 이고 **b 를 먼저 pop**. 바꾸면 부호가 뒤집힌다.\n- 음수 토큰 `\"-11\"` 을 연산자로 오인하지 않도록: \"길이 1 이고 +−*/ 중 하나\" 일 때만 연산자.\n\n### decode_string (\"3[a2[c]]\" → \"accaccacc\")\n\n```c\n숫자 스택 + 문자열 스택:\n  숫자      -> num = num*10 + d          // 여러 자리\n  '['       -> nums.push(num); num=0; strs.push(cur); cur=\"\";  // 상태 저장, 안쪽 새로\n  ']'       -> k=nums.pop(); prev=strs.pop(); prev += cur*k; cur=prev;  // 되돌리며 합침\n  그 외 문자 -> cur += c\n```\n\n- 재귀로도 풀 수 있지만(호출 스택 = 명시 스택), **명시적 두 스택**이 깊이 제한을 스스로\n  통제해 임베디드에 안전하다.\n- 반환 문자열은 `malloc` — **호출자가 free**. 소유권 규약을 시그니처 주석에 남긴다.\n\n---\n\n## 인터뷰 팔로업 & 임베디드 함정\n\n- **Q. 단조 스택이 왜 O(n)?** → 각 원소 push 1회 + pop 1회. while 중첩이어도 총 pop ≤ n.\n- **Q. 값 대신 인덱스를 왜 저장?** → 위치 차이(daily), 만료 판정(sliding) 때문. 값만으론 부족.\n- **Q. 슬라이딩 최댓값에 왜 힙 말고 덱?** → 힙은 O(n log k)+삭제 지연. 덱은 O(n), 결정론적.\n- **함정: RPN 피연산자 순서** → `a op b` 에서 b 가 먼저 pop. `-`,`/` 에서 특히 치명적.\n- **함정: 두 스택 큐의 조기 shift** → out 이 안 비었는데 옮기면 FIFO 깨짐.\n- **함정: 스택 오버플로** → 배열 cap 고정 시 push 전 용량 체크(임베디드에선 필수).\n- **함정: decode 반환 메모리 누수** → 반환 버퍼 free 규약 누락. 중첩마다 임시 버퍼도 free.\n- **함정: 괄호 검증에서 \"끝에 남은 여는 괄호\"** → `\"(\"` 는 false. top==0 확인을 빠뜨리기 쉽다.\n\n---\n\n## 복잡도 요약\n\n| 연산/문제 | 시간 | 공간 |\n|-----------|------|------|\n| valid_parentheses | O(n) | O(n) |\n| MinStack push/pop/top/getMin | O(1) | O(n) |\n| next_greater_element | O(n) | O(n) |\n| daily_temperatures | O(n) | O(n) |\n| eval_rpn | O(n) | O(n) |\n| queue_via_two_stacks | 분할상환 O(1) | O(n) |\n| sliding_window_max | O(n) | O(k) |\n| decode_string | O(출력 길이) | O(출력 길이) |\n", "problems": [{"num": 1, "slug": "valid_parentheses", "title_ko": "올바른 괄호", "title_en": "Valid parentheses", "difficulty": "easy", "tags": ["stack", "matching", "string"], "prompt_ko": "()[]{} 세 종류 괄호로 이뤄진 문자열이 올바르게 열고 닫혔는지 검사한다. 여는 괄호는 push, 닫는 괄호는 스택 top 과 짝이 맞으면 pop. 끝에 스택이 비어 있어야 유효.", "prompt_en": "Given a string of ()[]{}, decide if brackets are correctly matched and nested. Push openers, on a closer check it pairs with the stack top then pop; the stack must be empty at the end.", "signature": "bool valid_parentheses(const char *s);", "examples": [{"in": "\"()[]{}\"", "out": "true"}, {"in": "\"([)]\"", "out": "false"}, {"in": "\"(\"", "out": "false"}], "hints": ["여는 괄호를 만나면 그대로 push.", "닫는 괄호: 스택이 비었거나 top 이 짝이 아니면 false.", "마지막에 top == 0 인지 반드시 확인 (남은 여는 괄호)."], "solution": "bool valid_parentheses(const char *s) {\n    int n = (int)strlen(s);\n    char *st = malloc((size_t)(n > 0 ? n : 1));\n    int top = 0;\n    for (int i = 0; i \u003c n; ++i) {\n        char c = s[i];\n        if (c == '(' || c == '[' || c == '{') {\n            st[top++] = c;\n        } else if (c == ')' || c == ']' || c == '}') {\n            if (top == 0) { free(st); return false; }\n            char o = st[--top];\n            if ((c == ')' && o != '(') ||\n                (c == ']' && o != '[') ||\n                (c == '}' && o != '{')) { free(st); return false; }\n        }\n    }\n    bool ok = (top == 0);\n    free(st);\n    return ok;\n}", "explanation_ko": "PATTERN: 배열 기반 스택 + 짝 맞추기. 여는 괄호를 쌓고 닫는 괄호에서 top 과 짝을 비교한다. 실패 3모드(엇갈린 짝, 빈 스택에 닫힘, 끝에 남은 열림)를 모두 잡아야 한다. 복잡도 O(n) 시간, O(n) 공간.", "complexity": "O(n) time, O(n) space", "pitfalls": ["끝에 top==0 확인 누락 → \"(\" 를 true 로 오판", "빈 스택에 닫는 괄호 오면 pop 전 가드 누락", "짝 비교 없이 개수만 세다 \"([)]\" 를 통과"], "anduril_context": "명령/설정 문법 검증, 중첩 블록 구조(괄호·보호구간) 파서의 기초 단계."}, {"num": 2, "slug": "min_stack", "title_ko": "최솟값 스택 (O(1) getMin)", "title_en": "Min stack (O(1) getMin)", "difficulty": "medium", "tags": ["stack", "design", "aux-stack"], "prompt_ko": "push/pop/top 에 더해 현재 최솟값을 O(1) 에 내는 getMin 을 지원하는 스택을 설계한다. 보조 스택에 '그 시점까지의 최솟값'을 함께 쌓는다.", "prompt_en": "Design a stack that also returns the current minimum in O(1) via getMin. Keep a parallel stack of the prefix minimum at each position.", "signature": "void ms_push(MinStack*, int); void ms_pop(MinStack*); int ms_top(const MinStack*); int ms_getmin(const MinStack*);", "examples": [{"in": "push -2,0,-3; getMin", "out": "-3"}, {"in": "pop; getMin; top", "out": "-2, 0"}], "hints": ["값 스택 val[] 과 나란히 mn[] 을 유지.", "push 시 mn[top] = min(x, top>0 ? mn[top-1] : x).", "getMin 은 mn[top-1] 만 읽으면 된다 (pop 해도 자동 복원)."], "solution": "#define MINSTACK_CAP 128\ntypedef struct { int val[MINSTACK_CAP]; int mn[MINSTACK_CAP]; int top; } MinStack;\n\nvoid ms_init(MinStack *m)         { m->top = 0; }\nvoid ms_push(MinStack *m, int x)  {\n    m->val[m->top] = x;\n    m->mn[m->top]  = (m->top == 0) ? x : (x \u003c m->mn[m->top-1] ? x : m->mn[m->top-1]);\n    m->top++;\n}\nvoid ms_pop(MinStack *m)          { if (m->top > 0) m->top--; }\nint  ms_top(const MinStack *m)    { return m->val[m->top-1]; }\nint  ms_getmin(const MinStack *m) { return m->mn[m->top-1]; }", "explanation_ko": "PATTERN: 보조 스택(접두 최솟값). 각 위치에 '그까지의 최솟값'을 캐시하면 pop 후 이전 최솟값이 자동 복원된다. 모든 연산 O(1), 값당 int 하나 추가로 O(n) 공간. 대안: (값, 그시점최솟값) 쌍을 하나의 스택에 저장.", "complexity": "O(1) per op, O(n) space", "pitfalls": ["getMin 을 매번 전체 스캔 → O(n)", "push 에서 이전 최솟값과 min 안 취함", "빈 스택에서 top/getMin 호출 경계 미처리"], "anduril_context": "슬라이딩 임계값 추적, 최근 구간 최소 신호 레벨 상시 유지(AGC/모니터링)."}, {"num": 3, "slug": "next_greater_element", "title_ko": "다음 큰 원소 (단조 스택)", "title_en": "Next greater element", "difficulty": "medium", "tags": ["monotonic-stack", "array"], "prompt_ko": "각 원소의 오른쪽에서 처음으로 더 큰 값을 구한다(없으면 -1). 인덱스 단조 감소 스택을 써서 전체 O(n) 에 해결한다.", "prompt_en": "For each element, find the first greater value to its right (-1 if none). Use an index-based monotonic-decreasing stack for overall O(n).", "signature": "void next_greater_element(const int *a, int n, int *out);", "examples": [{"in": "[2 1 2 4 3]", "out": "[4 2 4 -1 -1]"}, {"in": "[5 4 3 2 1]", "out": "[-1 -1 -1 -1 -1]"}], "hints": ["out 을 먼저 전부 -1 로 초기화.", "스택에 값이 아니라 인덱스를 쌓는다.", "a[i] 가 a[peek] 보다 크면 대기 중 인덱스들의 답 = a[i]."], "solution": "void next_greater_element(const int *a, int n, int *out) {\n    for (int i = 0; i \u003c n; ++i) out[i] = -1;\n    istk_t st; istk_init(&st, n);              // index monotonic-decreasing stack\n    for (int i = 0; i \u003c n; ++i) {\n        while (!istk_empty(&st) && a[istk_peek(&st)] \u003c a[i])\n            out[istk_pop(&st)] = a[i];         // current value answers the waiters\n        istk_push(&st, i);\n    }\n    istk_free(&st);\n}", "explanation_ko": "PATTERN: 단조 스택(감소). 아직 답을 못 찾은 인덱스를 값이 감소하도록 쌓아둔다. 현재 원소가 top 보다 크면 pop 하며 그 자리에 답을 기록. 각 인덱스가 정확히 한 번 push/pop 되므로 전체 O(n). 값이 아닌 인덱스 저장이 핵심.", "complexity": "O(n) time, O(n) space", "pitfalls": ["이중 루프로 짜면 O(n^2)", "값만 저장하면 대기 원소를 되짚기 어려움", "out 초기화(-1) 누락"], "anduril_context": "신호 시계열에서 그 다음 피크(더 큰 진폭)까지의 구간 탐색, 임계 복귀 지점 추적."}, {"num": 4, "slug": "daily_temperatures", "title_ko": "일일 온도 (단조 스택)", "title_en": "Daily temperatures", "difficulty": "medium", "tags": ["monotonic-stack", "array"], "prompt_ko": "각 날에 대해 더 따뜻한 날이 올 때까지 며칠을 기다려야 하는지 구한다(없으면 0). 인덱스 단조 감소 스택으로 O(n).", "prompt_en": "For each day, how many days until a warmer temperature (0 if none). Index-based mono
