CRSF (Crossfire / ExpressLRS ↔ flight controller UART 프로토콜) 프레임:

  [sync/addr][len][type][payload ...][crc8]
   len  = type(1) + payload(N) + crc(1)  = N + 2      (sync, len 자신은 제외)
   crc8 = CRC-8/DVB-S2 (poly 0xD5, init 0x00) over type + payload
   전체 프레임 최대 64 bytes → len 최대 62

CrsfParser.feed(chunk) 는 아무 크기로 잘려 들어오는 바이트를 받아 완성된 프레임 리스트를 돌려준다.
CRC·길이가 틀리면 sync 1바이트만 버리고 다시 찾는다 (resync).
unpack_rc_channels() 는 RC_CHANNELS_PACKED (type 0x16, 22 bytes = 16 ch x 11 bit, LSB-first) 디코드.
"""
ADDRS = {0xC8, 0xEA, 0xEC, 0xEE}   # FC, radio(handset), receiver, TX module
MAX_LEN = 62
TYPE_RC_CHANNELS = 0x16

class CrsfParser:
    def __init__(self):
        self.buf = bytearray()
        self.crc_errors = 0
        self.dropped = 0            # resync 로 버린 바이트 수

        #   - 프레임 전체(len+2)가 아직 안 왔으면 break
        #   - CRC 틀리면 crc_errors += 1, 1바이트 drop (프레임 통째로 버리지 말 것!)

def unpack_rc_channels(payload):
    """22 bytes → 16 x 11-bit ticks (172..1811, 중앙 992)."""
    # TODO: int.from_bytes(payload, "little") 한 다음 (v &gt;&gt; 11*i) &amp; 0x7FF
    raise NotImplementedError


# 아래 두 개는 테스트용 헬퍼 (주어짐)
def pack_rc_channels(ch):
    v = 0
    for i, c in enumerate(ch):
        v |= (c &amp; 0x7FF) &lt;&lt; (11 * i)
    return v.to_bytes(22, "little")


def ticks_to_us(t):
    return round((t - 992) * 5 / 8 + 1500)


# ------------------------------------------------------------------ tests
def test_crc_check_value():
    assert crc8_dvb_s2(b"123456789") == 0xBC       # CRC-8/DVB-S2 표준 check 값


def test_roundtrip_one_frame():
    f = build_frame(0x14, b"\x01\x02\x03")
    assert f[1] == 5 and len(f) == 7
    assert CrsfParser().feed(f) == [(0xC8, 0x14, b"\x01\x02\x03")]


def test_byte_by_byte_and_garbage():
    stream = b"\x00\xff\x13" + build_frame(0x14, b"A") + build_frame(0x08, b"BC")
    p, out = CrsfParser(), []
    for b in stream:
        out += p.feed(bytes([b]))
    assert out == [(0xC8, 0x14, b"A"), (0xC8, 0x08, b"BC")]
    assert p.dropped == 3


def test_bad_crc_resyncs_to_next_frame():
    bad = bytearray(build_frame(0x14, b"xyz"))
    bad[-1] ^= 0xFF
    p = CrsfParser()
    assert p.feed(bytes(bad) + build_frame(0x14, b"ok")) == [(0xC8, 0x14, b"ok")]
    assert p.crc_errors == 1


def test_bad_length_skipped():
    p = CrsfParser()
    assert p.feed(b"\xc8\xff" + build_frame(0x14, b"ok")) == [(0xC8, 0x14, b"ok")]


def test_rc_channels():
    ch = [992] * 16

    payload = pack_rc_channels(ch)
    frames = CrsfParser().feed(build_frame(TYPE_RC_CHANNELS, payload))
    assert unpack_rc_channels(frames[0][2]) == ch
    assert ticks_to_us(992) == 1500 and ticks_to_us(172) == 988

const KEY='neros_fte_notes_read_v1', TKEY='neros_fte_notes_theme', CKEY='neros_fte_notes_check_v1';
const readSet=()=>{try{return new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){return new Set()}};
const saveSet=s=>{try{localStorage.setItem(KEY,JSON.stringify([...s]))}catch(e){}};
(function(){
  try{const t=localStorage.getItem(TKEY); if(t)document.documentElement.dataset.theme=t;}catch(e){}
  const tb=document.getElementById('theme');
  if(tb)tb.onclick=()=>{const d=document.documentElement;
    const cur=d.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    const nx=cur==='dark'?'light':'dark'; d.dataset.theme=nx;
    try{localStorage.setItem(TKEY,nx)}catch(e){}};
  // 진행 바
  const bar=document.getElementById('bar');
  const onScroll=()=>{const h=document.body.scrollHeight-innerHeight;
    bar.style.width=(h>0?Math.min(100,scrollY/h*100):0)+'%';};
  addEventListener('scroll',onScroll,{passive:true}); onScroll();
  // 읽음 표시
  const id=document.body.dataset.note, rb=document.getElementById('readbtn');
  const sync=()=>{const s=readSet(); const on=s.has(id);
    rb.classList.toggle('on',on); rb.textContent=on?'✓ 읽음':'읽음 표시';};
  if(rb){rb.onclick=()=>{const s=readSet(); s.has(id)?s.delete(id):s.add(id); saveSet(s); sync();}; sync();}
  // 체크박스 저장
  let cs={}; try{cs=JSON.parse(localStorage.getItem(CKEY)||'{}')}catch(e){}
  document.querySelectorAll('li.task input').forEach((el,i)=>{
    const k=id+':'+i; if(cs[k])el.checked=true;
    el.addEventListener('change',()=>{cs[k]=el.checked;
      try{localStorage.setItem(CKEY,JSON.stringify(cs))}catch(e){}});
  });
  // TOC 하이라이트
  const links=[...document.querySelectorAll('aside a')];
  const map=new Map(links.map(a=>[a.getAttribute('href').slice(1),a]));
  const heads=[...document.querySelectorAll('main h2[id],main h3[id]')];
  if(heads.length){
    const io=new IntersectionObserver(es=>{
      es.forEach(e=>{ if(e.isIntersecting){ links.forEach(a=>a.classList.remove('active'));
        const a=map.get(e.target.id); if(a)a.classList.add('active'); }});
    },{rootMargin:'-80px 0px -70% 0px',threshold:0});
    heads.forEach(h=>io.observe(h));
  }
  // 키보드: j/k 다음·이전 노트
  addEventListener('keydown',e=>{
    if(e.target.matches('input,textarea'))return;
    if(e.key==='j'){const n=document.querySelector('.nav a.next'); if(n)location.href=n.href;}
    if(e.key==='k'){const p=document.querySelector('.nav a.prev'); if(p)location.href=p.href;}
  });
})();
