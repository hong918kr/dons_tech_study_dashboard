<script type="application/json" id="drill-data">{"days": {"1": ["10-03 (토)", "기본 문법 — 컨테이너 · 루프 · 문자열 / C 타입 · 포인터 · 비트"], "2": ["10-04 (일)", "클래스 · 예외 · with · generator / C 메모리 · 함수 포인터 · 구조체"], "3": ["10-05 (월)", "bytes · struct · 비트 필드 · CRC / C 엔디언 · 레지스터 · 파싱"], "4": ["10-06 (화)", "ring buffer · 스레드 · 상태 머신 · retry / C ring · atomics · 타이머"], "5": ["10-07 (수)", "pytest · fixture · mock / C 단위 테스트 · fake · DI"]}, "items": [{"id": "P1-01", "day": 1, "lang": "py", "title": "슬라이스와 뒤집기", "prompt": "리스트 xs의 마지막 n개를 거꾸로 돌려주는 last_n_reversed(xs, n).", "given": "", "answer": "def last_n_reversed(xs, n):\n    return xs[-n:][::-1]"}, {"id": "P1-02", "day": 1, "lang": "py", "title": "dict로 개수 세기", "prompt": "공백으로 나눈 단어별 개수를 dict로 돌려주는 count_words(text). dict.get 사용.", "given": "", "answer": "def count_words(text):\n    counts = {}\n    for w in text.split():\n        counts[w] = counts.get(w, 0) + 1\n    return counts"}, {"id": "P1-03", "day": 1, "lang": "py", "title": "enumerate", "prompt": "target이 처음 나오는 인덱스, 없으면 -1을 돌려주는 find_index(xs, target). range(len()) 쓰지 말 것.", "given": "", "answer": "def find_index(xs, target):\n    for i, x in enumerate(xs):\n        if x == target:\n            return i\n    return -1"}, {"id": "P1-04", "day": 1, "lang": "py", "title": "zip과 dict", "prompt": "두 리스트를 key → value dict로 묶는 pair_up(keys, values).", "given": "", "answer": "def pair_up(keys, values):\n    return dict(zip(keys, values))"}, {"id": "P1-05", "day": 1, "lang": "py", "title": "list comprehension", "prompt": "짝수만 골라 제곱한 리스트를 돌려주는 even_squares(xs). 한 줄.", "given": "", "answer": "def even_squares(xs):\n    return [x * x for x in xs if x % 2 == 0]"}, {"id": "P1-06", "day": 1, "lang": "py", "title": "f-string hex 포맷", "prompt": "fmt_reg(0x40, 0x1F) → \"0x0040: 0x1F\" (주소 4자리, 값 2자리, 대문자).", "given": "", "answer": "def fmt_reg(addr, val):\n    return f\"0x{addr:04X}: 0x{val:02X}\""}, {"id": "P1-07", "day": 1, "lang": "py", "title": "문자열 split · strip", "prompt": "\"key = value\" 한 줄을 (key, value) 튜플로. 값 안의 = 는 보존. parse_kv(line).", "given": "", "answer": "def parse_kv(line):\n    key, _, value = line.partition(\"=\")\n    return key.strip(), value.strip()"}, {"id": "P1-08", "day": 1, "lang": "py", "title": "sorted + key", "prompt": "길이 오름차순, 같으면 알파벳순으로 정렬하는 sort_words(words).", "given": "", "answer": "def sort_words(words):\n    return sorted(words, key=lambda w: (len(w), w))"}, {"id": "P1-09", "day": 1, "lang": "py", "title": "while + divmod", "prompt": "양의 정수 n의 자릿수 합 digit_sum(n). divmod 사용.", "given": "", "answer": "def digit_sum(n):\n    total = 0\n    while n:\n        n, d = divmod(n, 10)\n        total += d\n    return total"}, {"id": "P1-10", "day": 1, "lang": "py", "title": "set 연산", "prompt": "두 리스트에 공통으로 있는 값을 중복 없이 정렬해서 common(a, b).", "given": "", "answer": "def common(a, b):\n    return sorted(set(a) & set(b))"}, {"id": "C1-01", "day": 1, "lang": "c", "title": "stdint 배열 합", "prompt": "uint8_t 버퍼의 합을 uint32_t로 돌려주는 sum_u8(buf, n).", "given": "", "answer": "uint32_t sum_u8(const uint8_t *buf, size_t n)\n{\n    uint32_t sum = 0;\n    for (size_t i = 0; i < n; i++)\n        sum += buf[i];\n    return sum;\n}"}, {"id": "C1-02", "day": 1, "lang": "c", "title": "포인터로 swap", "prompt": "두 int를 바꾸는 swap_int(a, b).", "given": "", "answer": "void swap_int(int *a, int *b)\n{\n    int t = *a;\n    *a = *b;\n    *b = t;\n}"}, {"id": "C1-03", "day": 1, "lang": "c", "title": "typedef struct", "prompt": "int16_t x, y를 가진 point_t와, 두 점 거리의 제곱을 int32_t로 돌려주는 dist2(a, b).", "given": "", "answer": "typedef struct {\n    int16_t x, y;\n} point_t;\n\nint32_t dist2(point_t a, point_t b)\n{\n    int32_t dx = (int32_t)a.x - b.x;\n    int32_t dy = (int32_t)a.y - b.y;\n    return dx * dx + dy * dy;\n}"}, {"id": "C1-04", "day": 1, "lang": "c", "title": "비트 set · clear · test", "prompt": "BIT(n) 매크로와 set_bit / clear_bit / test_bit (uint32_t *reg 대상).", "given": "", "answer": "#define BIT(n) (1u << (n))\n\nvoid set_bit(uint32_t *reg, unsigned n)   { *reg |= BIT(n); }\nvoid clear_bit(uint32_t *reg, unsigned n) { *reg &= ~BIT(n); }\nbool test_bit(uint32_t reg, unsigned n)   { return (reg & BIT(n)) != 0; }"}, {"id": "C1-05", "day": 1, "lang": "c", "title": "strlen 직접", "prompt": "표준 함수 없이 문자열 길이 my_strlen(s).", "given": "", "answer": "size_t my_strlen(const char *s)\n{\n    const char *p = s;\n    while (*p)\n        p++;\n    return (size_t)(p - s);\n}"}, {"id": "C1-06", "day": 1, "lang": "c", "title": "배열 제자리 뒤집기", "prompt": "uint8_t 배열을 제자리에서 뒤집는 reverse_u8(a, n). n=0도 안전하게.", "given": "", "answer": "void reverse_u8(uint8_t *a, size_t n)\n{\n    if (n < 2)\n        return;\n    for (size_t i = 0, j = n - 1; i < j; i++, j--) {\n        uint8_t t = a[i];\n        a[i] = a[j];\n        a[j] = t;\n    }\n}"}, {"id": "C1-07", "day": 1, "lang": "c", "title": "enum + switch", "prompt": "ST_IDLE / ST_ARMED / ST_FLYING enum과 이름 문자열을 돌려주는 state_name(s). 모르는 값은 \"?\".", "given": "", "answer": "typedef enum { ST_IDLE, ST_ARMED, ST_FLYING } state_t;\n\nconst char *state_name(state_t s)\n{\n    switch (s) {\n    case ST_IDLE:   return \"IDLE\";\n    case ST_ARMED:  return \"ARMED\";\n    case ST_FLYING: return \"FLYING\";\n    default:        return \"?\";\n    }\n}"}, {"id": "C1-08", "day": 1, "lang": "c", "title": "memcpy · memcmp · memset", "prompt": "src를 dst에 복사하고 같은지 확인해서 true, 그다음 src를 0으로 지우는 copy_wipe(dst, src, n).", "given": "", "answer": "bool copy_wipe(uint8_t *dst, uint8_t *src, size_t n)\n{\n    memcpy(dst, src, n);\n    bool same = memcmp(dst, src, n) == 0;\n    memset(src, 0, n);\n    return same;\n}"}, {"id": "C1-09", "day": 1, "lang": "c", "title": "set bit 개수", "prompt": "v &= v - 1 트릭으로 1인 비트 수를 세는 popcount32(v).", "given": "", "answer": "int popcount32(uint32_t v)\n{\n    int n = 0;\n    while (v) {\n        v &= v - 1;\n        n++;\n    }\n    return n;\n}"}, {"id": "C1-10", "day": 1, "lang": "c", "title": "포인터 순회로 최댓값", "prompt": "int32_t 배열(n>0)의 최댓값 max_i32(a, n). 포인터로 끝까지 순회.", "given": "", "answer": "int32_t max_i32(const int32_t *a, size_t n)\n{\n    const int32_t *end = a + n;\n    int32_t m = *a++;\n    for (; a < end; a++)\n        if (*a > m)\n            m = *a;\n    return m;\n}"}, {"id": "P2-01", "day": 2, "lang": "py", "title": "class · __init__ · __repr__", "prompt": "Sensor(name, value=0.0) 클래스. update(v)로 값 갱신, repr은 \"Sensor(imu, 1.5)\".", "given": "", "answer": "class Sensor:\n    def __init__(self, name, value=0.0):\n        self.name = name\n        self.value = value\n\n    def update(self, v):\n        self.value = v\n\n    def __repr__(self):\n        return f\"Sensor({self.name}, {self.value})\""}, {"id": "P2-02", "day": 2, "lang": "py", "title": "@dataclass", "prompt": "Frame(msg_id: int, payload: bytes = b\"\") dataclass와 길이를 돌려주는 size property.", "given": "", "answer": "from dataclasses import dataclass\n\n\n@dataclass\nclass Frame:\n    msg_id: int\n    payload: bytes = b\"\"\n\n    @property\n    def size(self):\n        return len(self.payload)"}, {"id": "P2-03", "day": 2, "lang": "py", "title": "커스텀 예외 계층", "prompt": "DeviceError(Exception), 그 자식 DeviceTimeout. check(code): 0이면 None, 1이면 DeviceTimeout, 그 외 DeviceError(f\"code {code}\").", "given": "", "answer": "class DeviceError(Exception):\n    pass\n\n\nclass DeviceTimeout(DeviceError):\n    pass\n\n\ndef check(code):\n    if code == 0:\n        return None\n    if code == 1:\n        raise DeviceTimeout(\"timeout\")\n    raise DeviceError(f\"code {code}\")"}, {"id": "P2-04", "day": 2, "lang": "py", "title": "try / except", "prompt": "정수로 바꿀 수 없으면 default를 돌려주는 parse_int(s, default=None).", "given": "", "answer": "def parse_int(s, default=None):\n    try:\n        return int(s, 0)\n    except (ValueError, TypeError):\n        return default"}, {"id": "P2-05", "day": 2, "lang": "py", "title": "context manager 클래스", "prompt": "with Timer() as t: 블록이 끝나면 t.elapsed(초)가 채워지는 Timer. time.monotonic 사용.", "given": "", "answer": "import time\n\n\nclass Timer:\n    def __enter__(self):\n        self.start = time.monotonic()\n        return self\n\n    def __exit__(self, exc_type, exc, tb):\n        self.elapsed = time.monotonic() - self.start\n        return False"}, {"id": "P2-06", "day": 2, "lang": "py", "title": "@contextmanager", "prompt": "opened(log): 들어갈 때 log에 \"open\", 나올 때(예외가 나도) \"close\"를 append.", "given": "", "answer": "from contextlib import contextmanager\n\n\n@contextmanager\ndef opened(log):\n    log.append(\"open\")\n    try:\n        yield log\n    finally:\n        log.append(\"close\")"}, {"id": "P2-07", "day": 2, "lang": "py", "title": "generator", "prompt": "data를 n바이트씩 잘라 yield 하는 chunks(data, n).", "given": "", "answer": "def chunks(data, n):\n    for i in range(0, len(data), n):\n        yield data[i:i + n]"}, {"id": "P2-08", "day": 2, "lang": "py", "title": "defaultdict", "prompt": "첫 글자별로 단어를 묶는 group_by_first(words) → {첫글자: [단어...]}.", "given": "", "answer": "from collections import defaultdict\n\n\ndef group_by_first(words):\n    groups = defaultdict(list)\n    for w in words:\n        groups[w[0]].append(w)\n    return dict(groups)"}, {"id": "P2-09", "day": 2, "lang": "py", "title": "dunder: __len__ · __getitem__", "prompt": "Registers(n): n개 0으로 시작, len()과 r[i] 읽기/쓰기(__setitem__) 지원.", "given": "", "answer": "class Registers:\n    def __init__(self, n):\n        self._regs = [0] * n\n\n    def __len__(self):\n        return len(self._regs)\n\n    def __getitem__(self, i):\n        return self._regs[i]\n\n    def __setitem__(self, i, value):\n        self._regs[i] = value & 0xFFFFFFFF"}, {"id": "P2-10", "day": 2, "lang": "py", "title": "@property + 검증", "prompt": "Motor.throttle property: 0~100만 허용, 아니면 ValueError.", "given": "", "answer": "class Motor:\n    def __init__(self):\n        self._throttle = 0\n\n    @property\n    def throttle(self):\n        return self._throttle\n\n    @throttle.setter\n    def throttle(self, value):\n        if not 0 <= value <= 100:\n            raise ValueError(f\"throttle {value} out of range\")\n        self._throttle = value"}, {"id": "C2-01", "day": 2, "lang": "c", "title": "malloc / free", "prompt": "0..n-1을 담은 int32_t 배열을 malloc 해서 돌려주는 make_seq(n). 실패 시 NULL.", "given": "", "answer": "int32_t *make_seq(size_t n)\n{\n    int32_t *a = malloc(n * sizeof *a);\n    if (a == NULL)\n        return NULL;\n    for (size_t i = 0; i < n; i++)\n        a[i] = (int32_t)i;\n    return a;\n}"}, {"id": "C2-02", "day": 2, "lang": "c", "title": "함수 안의 static", "prompt": "호출할 때마다 1, 2, 3...을 돌려주는 next_id(void).", "given": "", "answer": "uint32_t next_id(void)\n{\n    static uint32_t id;\n    return ++id;\n}"}, {"id": "C2-03", "day": 2, "lang": "c", "title": "const char* 순회 · ctype", "prompt": "문자열 안의 숫자 문자 개수를 세는 count_digits(s). isdigit 사용.", "given": "", "answer": "size_t count_digits(const char *s)\n{\n    size_t n = 0;\n    for (; *s; s++)\n        if (isdigit((unsigned char)*s))\n            n++;\n    return n;\n}"}, {"id": "C2-04", "day": 2, "lang": "c", "title": "함수 포인터", "prompt": "binop_t typedef(int(int,int)), add / mul, 그리고 apply(f, a, b).", "given": "", "answer": "typedef int (*binop_t)(int, int);\n\nint add(int a, int b) { return a + b; }\nint mul(int a, int b) { return a * b; }\n\nint apply(binop_t f, int a, int b)\n{\n    return f(a, b);\n}"}, {"id": "C2-05", "day": 2, "lang": "c", "title": "연결 리스트", "prompt": "node_t {int v; next}와 push_front(head, n) → 새 head, list_len(head).", "given": "", "answer": "typedef struct node {\n    int v;\n    struct node *next;\n} node_t;\n\nnode_t *push_front(node_t *head, node_t *n)\n{\n    n->next = head;\n    return n;\n}\n\nsize_t list_len(const node_t *h)\n{\n    size_t n = 0;\n    for (; h; h = h->next)\n        n++;\n    return n;\n}"}, {"id": "C2-06", "day": 2, "lang": "c", "title": "float ↔ 비트 (memcpy)", "prompt": "float의 비트 패턴을 uint32_t로 돌려주는 float_bits(f). 포인터 캐스팅 대신 memcpy.", "given": "", "answer": "uint32_t float_bits(float f)\n{\n    uint32_t u;\n    memcpy(&u, &f, sizeof u);\n    return u;\n}"}, {"id": "C2-07", "day": 2, "lang": "c", "title": "안전한 매크로", "prompt": "ARRAY_SIZE(a), MIN(a,b), CLAMP(x,lo,hi) — 괄호 빠짐없이.", "given": "", "answer": "#define ARRAY_SIZE(a)     (sizeof(a) / sizeof((a)[0]))\n#define MIN(a, b)         ((a) < (b) ? (a) : (b))\n#define MAX(a, b)         ((a) > (b) ? (a) : (b))\n#define CLAMP(x, lo, hi)  (MIN(MAX((x), (lo)), (hi)))"}, {"id": "C2-08", "day": 2, "lang": "c", "title": "고정 버퍼에 안전 복사", "prompt": "cfg_t {char name[16];}에 이름을 자르면서 복사하고 항상 NUL로 끝내는 cfg_set_name(c, s). 잘렸으면 false.", "given": "", "answer": "typedef struct {\n    char name[16];\n} cfg_t;\n\nbool cfg_set_name(cfg_t *c, const char *s)\n{\n    size_t n = strlen(s);\n    size_t cap = sizeof c->name - 1;\n    size_t k = n < cap ? n : cap;\n    memcpy(c->name, s, k);\n    c->name[k] = '\\0';\n    return n <= cap;\n}"}, {"id": "C2-09", "day": 2, "lang": "c", "title": "에러 코드 + out 파라미터", "prompt": "err_t {E_OK=0, E_RANGE=-1}. 0~100이면 *out에 넣고 E_OK, 아니면 *out은 그대로 두고 E_RANGE. parse_percent(v, out).", "given": "", "answer": "typedef enum { E_OK = 0, E_RANGE = -1 } err_t;\n\nerr_t parse_percent(int v, uint8_t *out)\n{\n    if (v < 0 || v > 100)\n        return E_RANGE;\n    *out = (uint8_t)v;\n    return E_OK;\n}"}, {"id": "C2-10", "day": 2, "lang": "c", "title": "2차원 배열", "prompt": "3x3 int32_t 행렬의 대각합 trace3(m).", "given": "", "answer": "int32_t trace3(const int32_t m[3][3])\n{\n    int32_t t = 0;\n    for (int i = 0; i < 3; i++)\n        t += m[i][i];\n    return t;\n}"}, {"id": "P3-01", "day": 3, "lang": "py", "title": "bytes → hex 문자열", "prompt": "to_hex(b\"\\x01\\xab\") → \"01 AB\" (공백 구분, 대문자).", "given": "", "answer": "def to_hex(b):\n    return \" \".join(f\"{x:02X}\" for x in b)"}, {"id": "P3-02", "day": 3, "lang": "py", "title": "hex 문자열 → bytes", "prompt": "from_hex(\"AA 05 01\") → b\"\\xaa\\x05\\x01\". bytes.fromhex 사용.", "given": "", "answer": "def from_hex(s):\n    return bytes.fromhex(s)"}, {"id": "P3-03", "day": 3, "lang": "py", "title": "int.from_bytes / to_bytes", "prompt": "b[off:off+2]를 little-endian u16으로 읽는 u16le(b, off), v를 big-endian 4바이트로 pack_u32be(v).", "given": "", "answer": "def u16le(b, off):\n    return int.from_bytes(b[off:off + 2], \"little\")\n\n\ndef pack_u32be(v):\n    return v.to_bytes(4, \"big\")"}, {"id": "P3-04", "day": 3, "lang": "py", "title": "struct.unpack", "prompt": "헤더 4바이트 \"<BBH\" (sync, type, length)를 튜플로 parse_header(b). 4바이트 미만이면 ValueError.", "given": "", "answer": "import struct\n\nHDR = struct.Struct(\"<BBH\")\n\n\ndef parse_header(b):\n    if len(b) < HDR.size:\n        raise ValueError(\"short header\")\n    return HDR.unpack_from(b)"}, {"id": "P3-05", "day": 3, "lang": "py", "title": "struct.pack", "prompt": "명령 프레임: cmd_id(u8), value(i16), seq(u32), little-endian. build_cmd(cmd_id, value, seq).", "given": "", "answer": "import struct\n\n\ndef build_cmd(cmd_id, value, seq):\n    return struct.pack(\"<BhI\", cmd_id, value, seq)"}, {"id": "P3-06", "day": 3, "lang": "py", "title": "비트 필드 읽기", "prompt": "reg에서 shift 위치부터 width 비트를 꺼내는 get_field(reg, shift, width).", "given": "", "answer": "def get_field(reg, shift, width):\n    return (reg >> shift) & ((1 << width) - 1)"}, {"id": "P3-07", "day": 3, "lang": "py", "title": "비트 필드 쓰기", "prompt": "reg의 [shift, shift+width) 자리를 val로 바꾼 값을 돌려주는 set_field(reg, shift, width, val). val이 넘치면 ValueError.", "given": "", "answer": "def set_field(reg, shift, width, val):\n    mask = (1 << width) - 1\n    if val & ~mask:\n        raise ValueError(\"value does not fit\")\n    return (reg & ~(mask << shift)) | (val << shift)"}, {"id": "P3-08", "day": 3, "lang": "py", "title": "XOR 체크섬", "prompt": "모든 바이트를 XOR 한 값 xor_sum(data).", "given": "", "answer": "def xor_sum(data):\n    x = 0\n    for b in data:\n        x ^= b\n    return x"}, {"id": "P3-09", "day": 3, "lang": "py", "title": "CRC-8 (poly 0x07)", "prompt": "MSB-first CRC-8/SMBUS crc8(data). check 값: crc8(b\"123456789\") == 0xF4.", "given": "", "answer": "def crc8(data, poly=0x07):\n    crc = 0\n    for b in data:\n        crc ^= b\n        for _ in range(8):\n            if crc & 0x80:\n                crc = ((crc << 1) ^ poly) & 0xFF\n            else:\n                crc = (crc << 1) & 0xFF\n    return crc"}, {"id": "P3-10", "day": 3, "lang": "py", "title": "bytearray 슬라이스 대입", "prompt": "buf[off:]를 data로 덮어쓰고(길이 유지) buf를 돌려주는 patch(buf, off, data). 넘치면 ValueError.", "given": "", "answer": "def patch(buf, off, data):\n    if off + len(data) > len(buf):\n        raise ValueError(\"out of bounds\")\n    buf[off:off + len(data)] = data\n    return buf"}, {"id": "C3-01", "day": 3, "lang": "c", "title": "little-endian 읽기", "prompt": "p[0]이 하위 바이트인 u16을 읽는 rd_le16(p).", "given": "", "answer": "uint16_t rd_le16(const uint8_t *p)\n{\n    return (uint16_t)(p[0] | (p[1] << 8));\n}"}, {"id": "C3-02", "day": 3, "lang": "c", "title": "big-endian 쓰기", "prompt": "v를 big-endian 4바이트로 쓰는 wr_be32(p, v).", "given": "", "answer": "void wr_be32(uint8_t *p, uint32_t v)\n{\n    p[0] = (uint8_t)(v >> 24);\n    p[1] = (uint8_t)(v >> 16);\n    p[2] = (uint8_t)(v >> 8);\n    p[3] = (uint8_t)v;\n}"}, {"id": "C3-03", "day": 3, "lang": "c", "title": "비트 필드 읽기 (width 32 안전)", "prompt": "get_field(reg, shift, width). width==32일 때 1u<<32 UB를 피할 것.", "given": "", "answer": "uint32_t get_field(uint32_t reg, unsigned shift, unsigned width)\n{\n    uint32_t mask = (width >= 32) ? 0xFFFFFFFFu : ((1u << width) - 1u);\n    return (reg >> shift) & mask;\n}"}, {"id": "C3-04", "day": 3, "lang": "c", "title": "비트 필드 쓰기 (read-modify-write)", "prompt": "set_field(reg, shift, width, val): 그 자리만 바꾼 값을 돌려준다 (width < 32 가정).", "given": "", "answer": "uint32_t set_field(uint32_t reg, unsigned shift, unsigned width, uint32_t val)\n{\n    uint32_t mask = ((1u << width) - 1u) << shift;\n    return (reg & ~mask) | ((val << shift) & mask);\n}"}, {"id": "C3-05", "day": 3, "lang": "c", "title": "CRC-8 (poly 0x07)", "prompt": "crc8(data, n) — MSB-first, init 0. check: \"123456789\" → 0xF4.", "given": "", "answer": "uint8_t crc8(const uint8_t *data, size_t n)\n{\n    uint8_t crc = 0;\n    while (n--) {\n        crc ^= *data++;\n        for (int i = 0; i < 8; i++)\n            crc = (crc & 0x80) ? (uint8_t)((crc << 1) ^ 0x07) : (uint8_t)(crc << 1);\n    }\n    return crc;\n}"}, {"id": "C3-06", "day": 3, "lang": "c", "title": "합 체크섬 (8비트 2의 보수)", "prompt": "모든 바이트 합 + cs == 0 (mod 256)이 되게 하는 checksum8(data, n).", "given": "", "answer": "uint8_t checksum8(const uint8_t *data, size_t n)\n{\n    uint8_t sum = 0;\n    for (size_t i = 0; i < n; i++)\n        sum += data[i];\n    return (uint8_t)(0u - sum);\n}"}, {"id": "C3-07", "day": 3, "lang": "c", "title": "헤더 파싱 (packed struct 없이)", "prompt": "hdr_t {sync, type, len(u16 LE)}. 4바이트 미만이거나 sync != 0xAA면 false. parse_hdr(b, n, out).", "given": "", "answer": "typedef struct {\n    uint8_t  sync;\n    uint8_t  type;\n    uint16_t len;\n} hdr_t;\n\nbool parse_hdr(const uint8_t *b, size_t n, hdr_t *out)\n{\n    if (n < 4 || b[0] != 0xAA)\n        return false;\n    out->sync = b[0];\n    out->type = b[1];\n    out->len  = (uint16_t)(b[2] | (b[3] << 8));\n    return true;\n}"}, {"id": "C3-08", "day": 3, "lang": "c", "title": "volatile 레지스터 RMW", "prompt": "REG32(addr) 매크로, 그리고 volatile 레지스터에 mask 비트를 set/clear 하는 reg_set / reg_clear.", "given": "", "answer": "#define REG32(addr) (*(volatile uint32_t *)(uintptr_t)(addr))\n\nvoid reg_set(volatile uint32_t *reg, uint32_t mask)   { *reg |= mask; }\nvoid reg_clear(volatile uint32_t *reg, uint32_t mask) { *reg &= ~mask; }"}, {"id": "C3-09", "day": 3, "lang": "c", "title": "12비트 부호 확장", "prompt": "ADC 12비트 2의 보수 raw를 int16_t로 sext12(raw).", "given": "", "answer": "int16_t sext12(uint16_t raw)\n{\n    raw &= 0x0FFF;\n    return (raw & 0x0800) ? (int16_t)(raw - 0x1000) : (int16_t)raw;\n}"}, {"id": "C3-10", "day": 3, "lang": "c", "title": "snprintf hex dump", "prompt": "바이트를 \"AA 01 FF\" 형태로 out에 쓰는 hex_dump(b, n, out, cap). 반환값은 쓴 길이.", "given": "", "answer": "size_t hex_dump(const uint8_t *b, size_t n, char *out, size_t cap)\n{\n    size_t len = 0;\n    if (cap)\n        out[0] = '\\0';\n    for (size_t i = 0; i < n && len + 3 < cap; i++)\n        len += (size_t)snprintf(out + len, cap - len, i ? \" %02X\" : \"%02X\", b[i]);\n    return len;\n}"}, {"id": "P4-01", "day": 4, "lang": "py", "title": "RingBuffer 핵심 (drop-new)", "prompt": "RingBuffer(capacity): push(x) → bool (가득 차면 False), pop() (비면 IndexError), len(). head + count 방식.", "given": "", "answer": "class RingBuffer:\n    def __init__(self, capacity):\n        self._buf = [None] * capacity\n        self._cap = capacity\n        self._head = 0\n        self._count = 0\n\n    def __len__(self):\n        return self._count\n\n    def push(self, item):\n        if self._count == self._cap:\n            return False\n        self._buf[self._head] = item\n        self._head = (self._head + 1) % self._cap\n        self._count += 1\n        return True\n\n    def pop(self):\n        if self._count == 0:\n            raise IndexError(\"empty\")\n        tail = (self._head - self._count) % self._cap\n        item, self._buf[tail] = self._buf[tail], None\n        self._count -= 1\n        return item"}, {"id": "P4-02", "day": 4, "lang": "py", "title": "deque(maxlen)", "prompt": "스트림의 마지막 n개만 리스트로 돌려주는 last_n(stream, n). deque 사용.", "given": "", "answer": "from collections import deque\n\n\ndef last_n(stream, n):\n    return list(deque(stream, maxlen=n))"}, {"id": "P4-03", "day": 4, "lang": "py", "title": "Lock", "prompt": "여러 스레드에서 안전한 SafeCounter: increment(), value 속성. with self._lock.", "given": "", "answer": "import threading\n\n\nclass SafeCounter:\n    def __init__(self):\n        self._lock = threading.Lock()\n        self.value = 0\n\n    def increment(self):\n        with self._lock:\n            self.value += 1"}, {"id": "P4-04", "day": 4, "lang": "py", "title": "queue.Queue producer/consumer", "prompt": "producer 스레드가 items를 넣고 끝에 None(sentinel), consumer가 모아서 돌려주는 run_pipeline(items).", "given": "", "answer": "import queue\nimport threading\n\n\ndef run_pipeline(items):\n    q = queue.Queue(maxsize=4)\n    out = []\n\n    def producer():\n        for x in items:\n            q.put(x)\n        q.put(None)\n\n    t = threading.Thread(target=producer)\n    t.start()\n    while True:\n        x = q.get(timeout=2)\n        if x is None:\n            break\n        out.append(x)\n    t.join()\n    return out"}, {"id": "P4-05", "day": 4, "lang": "py", "title": "Condition + while wait", "prompt": "한 칸짜리 Mailbox: put(x), get(timeout) — 비어 있으면 기다리고, 시간 초과면 TimeoutError.", "given": "", "answer": "import threading\n\n\nclass Mailbox:\n    def __init__(self):\n        self._cond = threading.Condition()\n        self._item = None\n        self._full = False\n\n    def put(self, x):\n        with self._cond:\n            self._item, self._full = x, True\n            self._cond.notify()\n\n    def get(self, timeout):\n        with self._cond:\n            if not self._cond.wait_for(lambda: self._full, timeout):\n                raise TimeoutError(\"mailbox empty\")\n            self._full = False\n            return self._item"}, {"id": "P4-06", "day": 4, "lang": "py", "title": "dict 상태 머신", "prompt": "TRANSITIONS {(\"IDLE\",\"arm\"):\"ARMED\", (\"ARMED\",\"takeoff\"):\"FLYING\", (\"ARMED\",\"disarm\"):\"IDLE\", (\"FLYING\",\"land\"):\"ARMED\"}. step(state, event), 없는 전이는 ValueError.", "given": "", "answer": "TRANSITIONS = {\n    (\"IDLE\", \"arm\"): \"ARMED\",\n    (\"ARMED\", \"takeoff\"): \"FLYING\",\n    (\"ARMED\", \"disarm\"): \"IDLE\",\n    (\"FLYING\", \"land\"): \"ARMED\",\n}\n\n\ndef step(state, event):\n    try:\n        return TRANSITIONS[(state, event)]\n    except KeyError:\n        raise ValueError(f\"{event} not allowed in {state}\") from None"}, {"id": "P4-07", "day": 4, "lang": "py", "title": "Enum", "prompt": "State(Enum) IDLE=0, ARMED=1, FLYING=2. 이름 문자열로 찾는 from_name(s) (대소문자 무시).", "given": "", "answer": "from enum import Enum\n\n\nclass State(Enum):\n    IDLE = 0\n    ARMED = 1\n    FLYING = 2\n\n\ndef from_name(s):\n    return State[s.upper()]"}, {"id": "P4-08", "day": 4, "lang": "py", "title": "deadline polling (monotonic)", "prompt": "pred()가 True가 될 때까지 interval마다 확인, timeout 넘으면 False. wait_until(pred, timeout, interval=0.01).", "given": "", "answer": "import time\n\n\ndef wait_until(pred, timeout, interval=0.01):\n    deadline = time.monotonic() + timeout\n    while True:\n        if pred():\n            return True\n        if time.monotonic() >= deadline:\n            return False\n        time.sleep(interval)"}, {"id": "P4-09", "day": 4, "lang": "py", "title": "retry 데코레이터", "prompt": "예외가 나면 최대 times번까지 다시 부르는 데코레이터 retry(times). functools.wraps 사용.", "given": "", "answer": "import functools\n\n\ndef retry(times):\n    def deco(fn):\n        @functools.wraps(fn)\n        def wrapper(*args, **kwargs):\n            last = None\n            for _ in range(times):\n                try:\n                    return fn(*args, **kwargs)\n                except Exception as e:\n                    last = e\n            raise last\n        return wrapper\n    return deco"}, {"id": "P4-10", "day": 4, "lang": "py", "title": "generator로 구분자 프레이밍", "prompt": "바이트 chunk 이터러블에서 0x00 구분자로 끝나는 프레임을 yield 하는 frames(chunks). 마지막 미완성은 버린다.", "given": "", "answer": "def frames(chunks):\n    buf = bytearray()\n    for chunk in chunks:\n        buf += chunk\n        while True:\n            i = buf.find(0)\n            if i < 0:\n                break\n            yield bytes(buf[:i])\n            del buf[:i + 1]"}, {"id": "C4-01", "day": 4, "lang": "c", "title": "ring buffer push / pop", "prompt": "RB_SIZE 16(2의 거듭제곱), free-running head/tail, rb_push / rb_pop (drop-new).", "given": "", "answer": "#define RB_SIZE 16u\n#define RB_MASK (RB_SIZE - 1u)\n\ntypedef struct {\n    uint8_t  buf[RB_SIZE];\n    uint32_t head, tail;\n} rb_t;\n\nbool rb_push(rb_t *rb, uint8_t b)\n{\n    if (rb->head - rb->tail == RB_SIZE)\n        return false;\n    rb->buf[rb->head & RB_MASK] = b;\n    rb->head++;\n    return true;\n}\n\nbool rb_pop(rb_t *rb, uint8_t *out)\n{\n    if (rb->head == rb->tail)\n        return false;\n    *out = rb->buf[rb->tail & RB_MASK];\n    rb->tail++;\n    return true;\n}"}, {"id": "C4-02", "day": 4, "lang": "c", "title": "ring count / space / empty / full", "prompt": "rb_t(위와 같은 모양, given)에 대해 rb_count, rb_space, rb_empty, rb_full.", "given": "#define RB_SIZE 16u\ntypedef struct { uint8_t buf[RB_SIZE]; uint32_t head, tail; } rb_t;", "answer": "static inline uint32_t rb_count(const rb_t *rb) { return rb->head - rb->tail; }\nstatic inline uint32_t rb_space(const rb_t *rb) { return RB_SIZE - rb_count(rb); }\nstatic inline bool rb_empty(const rb_t *rb)     { return rb_count(rb) == 0; }\nstatic inline bool rb_full(const rb_t *rb)      { return rb_count(rb) == RB_SIZE; }"}, {"id": "C4-03", "day": 4, "lang": "c", "title": "SPSC push (C11 atomics)", "prompt": "ISR producer용 spsc_push: tail은 acquire로 읽고, 데이터를 쓴 뒤 head를 release로 publish.", "given": "", "answer": "#define Q_SIZE 8u\n\ntypedef struct {\n    uint8_t buf[Q_SIZE];\n    _Atomic uint32_t head, tail;\n} spsc_t;\n\nbool spsc_push(spsc_t *q, uint8_t b)\n{\n    uint32_t head = atomic_load_explicit(&q->head, memory_order_relaxed);\n    uint32_t tail = atomic_load_explicit(&q->tail, memory_order_acquire);\n    if (head - tail == Q_SIZE)\n        return false;\n    q->buf[head & (Q_SIZE - 1u)] = b;\n    atomic_store_explicit(&q->head, head + 1, memory_order_release);\n    return true;\n}"}, {"id": "C4-04", "day": 4, "lang": "c", "title": "ISR 플래그 패턴", "prompt": "ISR이 세우는 volatile 플래그 g_rx_ready와 main loop에서 읽고 내리는 take_rx_ready(void). (단일 코어, 플래그 하나)", "given": "", "answer": "static volatile bool g_rx_ready;\n\nvoid uart_rx_isr(void)\n{\n    g_rx_ready = true;\n}\n\nbool take_rx_ready(void)\n{\n    if (!g_rx_ready)\n        return false;\n    g_rx_ready = false;\n    return true;\n}"}, {"id": "C4-05", "day": 4, "lang": "c", "title": "switch 상태 머신", "prompt": "state_t {IDLE, ARMED, FLYING}, event_t {EV_ARM, EV_DISARM, EV_TAKEOFF, EV_LAND}. 허용 안 되는 이벤트는 상태 유지. sm_step(s, e).", "given": "", "answer": "typedef enum { IDLE, ARMED, FLYING } state_t;\ntypedef enum { EV_ARM, EV_DISARM, EV_TAKEOFF, EV_LAND } event_t;\n\nstate_t sm_step(state_t s, event_t e)\n{\n    switch (s) {\n    case IDLE:   return e == EV_ARM ? ARMED : s;\n    case ARMED:  return e == EV_TAKEOFF ? FLYING : e == EV_DISARM ? IDLE : s;\n    case FLYING: return e == EV_LAND ? ARMED : s;\n    }\n    return s;\n}"}, {"id": "C4-06", "day": 4, "lang": "c", "title": "테이블 기반 상태 머신", "prompt": "transition_t {from, ev, to} 배열을 순회하는 sm_lookup(s, e). 없으면 s 그대로. (state_t/event_t는 given)", "given": "typedef enum { IDLE, ARMED, FLYING } state_t;\ntypedef enum { EV_ARM, EV_DISARM, EV_TAKEOFF, EV_LAND } event_t;", "answer": "typedef struct {\n    state_t from;\n    event_t ev;\n    state_t to;\n} transition_t;\n\nstatic const transition_t TABLE[] = {\n    {IDLE, EV_ARM, ARMED},\n    {ARMED, EV_TAKEOFF, FLYING},\n    {ARMED, EV_DISARM, IDLE},\n    {FLYING, EV_LAND, ARMED},\n};\n\nstate_t sm_lookup(state_t s, event_t e)\n{\n    for (size_t i = 0; i < sizeof TABLE / sizeof TABLE[0]; i++)\n        if (TABLE[i].from == s && TABLE[i].ev == e)\n            return TABLE[i].to;\n    return s;\n}"}, {"id": "C4-07", "day": 4, "lang": "c", "title": "디바운스", "prompt": "debounce_t {stable, count}. raw가 stable과 다른 값으로 N(=3)번 연속이면 stable을 바꾼다. debounce(d, raw) → stable.", "given": "", "answer": "#define DEBOUNCE_N 3\n\ntypedef struct {\n    bool    stable;\n    uint8_t count;\n} debounce_t;\n\nbool debounce(debounce_t *d, bool raw)\n{\n    if (raw == d->stable) {\n        d->count = 0;\n    } else if (++d->count >= DEBOUNCE_N) {\n        d->stable = raw;\n        d->count = 0;\n    }\n    return d->stable;\n}"}, {"id": "C4-08", "day": 4, "lang": "c", "title": "이동 평균 (링 + 합)", "prompt": "avg_t {buf[8], idx, n, sum}. 새 값을 넣고 지금까지(최대 8개)의 평균을 돌려주는 avg_push(a, v). 합은 O(1)로 갱신.", "given": "", "answer": "#define AVG_N 8\n\ntypedef struct {\n    int32_t buf[AVG_N];\n    uint8_t idx, n;\n    int32_t sum;\n} avg_t;\n\nint32_t avg_push(avg_t *a, int32_t v)\n{\n    if (a->n == AVG_N)\n        a->sum -= a->buf[a->idx];\n    else\n        a->n++;\n    a->buf[a->idx] = v;\n    a->sum += v;\n    a->idx = (uint8_t)((a->idx + 1) % AVG_N);\n    return a->sum / a->n;\n}"}, {"id": "C4-09", "day": 4, "lang": "c", "title": "tick wrap 안전한 timeout", "prompt": "32비트 tick이 wrap 해도 맞는 timed_out(now, start, timeout).", "given": "", "answer": "bool timed_out(uint32_t now, uint32_t start, uint32_t timeout)\n{\n    return (uint32_t)(now - start) >= timeout;\n}"}, {"id": "C4-10", "day": 4, "lang": "c", "title": "bulk write (memcpy 두 번)", "prompt": "rb_t(given, RB_SIZE 16)에 최대 len바이트를 wrap 지점에서 두 번 memcpy로 쓰고 쓴 개수를 돌려주는 rb_write(rb, src, len).", "given": "#define RB_SIZE 16u\n#define RB_MASK (RB_SIZE - 1u)\ntypedef struct { uint8_t buf[RB_SIZE]; uint32_t head, tail; } rb_t;", "answer": "size_t rb_write(rb_t *rb, const uint8_t *src, size_t len)\n{\n    uint32_t space = RB_SIZE - (rb->head - rb->tail);\n    uint32_t n = len < space ? (uint32_t)len : space;\n    uint32_t idx = rb->head & RB_MASK;\n    uint32_t first = RB_SIZE - idx;\n    if (first > n)\n        first = n;\n    memcpy(&rb->buf[idx], src, first);\n    memcpy(&rb->buf[0], src + first, n - first);\n    rb->head += n;\n    return n;\n}"}, {"id": "P5-01", "day": 5, "lang": "py", "title": "assert · pytest.raises", "prompt": "given의 divide에 대해: 정상값 테스트 1개, b=0이면 ZeroDivisionError를 match로 확인하는 테스트 1개.", "given": "import pytest\n\n\ndef divide(a, b):\n    if b == 0:\n        raise ZeroDivisionError(\"b must not be zero\")\n    return a / b", "answer": "def test_divide():\n    assert divide(6, 3) == 2\n\n\ndef test_divide_by_zero():\n    with pytest.raises(ZeroDivisionError, match=\"zero\"):\n        divide(1, 0)"}, {"id": "P5-02", "day": 5, "lang": "py", "title": "parametrize + ids", "prompt": "crc8(given)를 (data, expected) 3쌍으로 parametrize, ids도 붙인다.", "given": "import pytest\n\n\ndef crc8(data):\n    crc = 0\n    for b in data:\n        crc ^= b\n        for _ in range(8):\n            crc = ((crc << 1) ^ 0x07) & 0xFF if crc & 0x80 else (crc << 1) & 0xFF\n    return crc", "answer": "@pytest.mark.parametrize(\"data, expected\", [\n    (b\"\", 0x00),\n    (b\"123456789\", 0xF4),\n    (b\"\\x00\", 0x00),\n], ids=[\"empty\", \"check\", \"zero\"])\ndef test_crc8(data, expected):\n    assert crc8(data) == expected"}, {"id": "P5-03", "day": 5, "lang": "py", "title": "yield fixture (teardown)", "prompt": "FakePort(given)를 열어 주고, 테스트가 끝나면(실패해도) close 하는 port fixture + 그걸 쓰는 테스트.", "given": "import pytest\n\n\nclass FakePort:\n    def __init__(self):\n        self.closed = False\n        self.sent = []\n\n    def write(self, b):\n        self.sent.append(b)\n\n    def close(self):\n        self.closed = True", "answer": "@pytest.fixture\ndef port():\n    p = FakePort()\n    yield p\n    p.close()\n\n\ndef test_write(port):\n    port.write(b\"PING\\n\")\n    assert port.sent == [b\"PING\\n\"]\n    assert not port.closed"}, {"id": "P5-04", "day": 5, "lang": "py", "title": "fixture 조합 + scope", "prompt": "module scope rig fixture(dict로 흉내)와, 그걸 받아 매번 새 dut 상태를 만드는 function scope dut fixture. 테스트 2개에서 rig는 같은 객체.", "given": "import pytest\n\nseen = []", "answer": "@pytest.fixture(scope=\"module\")\ndef rig():\n    return {\"name\": \"sim\", \"opened\": 1}\n\n\n@pytest.fixture\ndef dut(rig):\n    seen.append(id(rig))\n    return {\"rig\": rig[\"name\"], \"state\": \"DISARMED\"}\n\n\ndef test_one(dut):\n    dut[\"state\"] = \"ARMED\"\n    assert dut[\"rig\"] == \"sim\"\n\n\ndef test_two(dut):\n    assert dut[\"state\"] == \"DISARMED\"\n    assert len(set(seen)) == 1"}, {"id": "P5-05", "day": 5, "lang": "py", "title": "tmp_path", "prompt": "given의 save_log(path, lines)를 tmp_path로 테스트: 파일을 읽어 줄 수 확인.", "given": "def save_log(path, lines):\n    path.write_text(\"\\n\".join(lines) + \"\\n\")", "answer": "def test_save_log(tmp_path):\n    p = tmp_path / \"dut.log\"\n    save_log(p, [\"boot\", \"armed\"])\n    assert p.read_text().splitlines() == [\"boot\", \"armed\"]"}, {"id": "P5-06", "day": 5, "lang": "py", "title": "monkeypatch", "prompt": "환경변수 RIG를 읽는 rig_name()(given)을 monkeypatch.setenv / delenv로 두 경우 테스트.", "given": "import os\n\n\ndef rig_name():\n    return os.environ.get(\"RIG\", \"none\")", "answer": "def test_rig_from_env(monkeypatch):\n    monkeypatch.setenv(\"RIG\", \"sim\")\n    assert rig_name() == \"sim\"\n\n\ndef test_rig_default(monkeypatch):\n    monkeypatch.delenv(\"RIG\", raising=False)\n    assert rig_name() == \"none\""}, {"id": "P5-07", "day": 5, "lang": "py", "title": "Mock · side_effect · call_args_list", "prompt": "read_temp(port)(given)는 빈 응답이면 한 번 더 보낸다. Mock 포트로 [b\"\", b\"T=21\\n\"] 대본을 주고, 결과와 write 호출 2번을 검증.", "given": "from unittest.mock import Mock, call\n\n\ndef read_temp(port):\n    for _ in range(2):\n        port.write(b\"T?\\n\")\n        line = port.readline()\n        if line:\n            return int(line.strip().split(b\"=\")[1])\n    raise TimeoutError", "answer": "def test_read_temp_retries_once():\n    port = Mock(spec=[\"write\", \"readline\"])\n    port.readline.side_effect = [b\"\", b\"T=21\\n\"]\n    assert read_temp(port) == 21\n    assert port.write.call_args_list == [call(b\"T?\\n\"), call(b\"T?\\n\")]"}, {"id": "P5-08", "day": 5, "lang": "py", "title": "patch.object (time.sleep)", "prompt": "backoff_wait()(given)가 time.sleep을 0.1, 0.2로 부르는지, 실제로 기다리지 않고 patch.object로 검증.", "given": "import time\nfrom unittest.mock import patch, call\n\n\ndef backoff_wait(n=2, base=0.1):\n    for i in range(n):\n        time.sleep(base * 2 ** i)", "answer": "def test_backoff_wait():\n    with patch.object(time, \"sleep\") as fake_sleep:\n        backoff_wait()\n    assert fake_sleep.call_args_list == [call(0.1), call(0.2)]"}, {"id": "P5-09", "day": 5, "lang": "py", "title": "skipif marker", "prompt": "환경변수 RIG가 없으면 skip 되는 hw 테스트 하나 (pytest.mark.skipif), 그리고 항상 도는 테스트 하나.", "given": "import os\nimport pytest", "answer": "needs_rig = pytest.mark.skipif(not os.environ.get(\"RIG\"), reason=\"no rig (set RIG=sim)\")\n\n\n@needs_rig\ndef test_on_rig():\n    assert os.environ[\"RIG\"]\n\n\ndef test_pure_logic():\n    assert int(\"1F\", 16) == 31"}, {"id": "P5-10", "day": 5, "lang": "py", "title": "caplog", "prompt": "connect()(given)가 재시도 때 WARNING 로그를 남기는지 caplog로 확인.", "given": "import logging\n\nlog = logging.getLogger(\"dut\")\n\n\ndef connect(attempts):\n    for i in range(attempts - 1):\n        log.warning(\"retry %d\", i + 1)\n    return True", "answer": "def test_connect_logs_retries(caplog):\n    with caplog.at_level(logging.WARNING, logger=\"dut\"):\n        assert connect(3)\n    assert [r.getMessage() for r in caplog.records] == [\"retry 1\", \"retry 2\"]"}, {"id": "C5-01", "day": 5, "lang": "c", "title": "CHECK 매크로 (do-while 0)", "prompt": "실패하면 파일:줄:식을 출력하고 g_fail을 올리는 CHECK(cond) 매크로.", "given": "", "answer": "static int g_fail;\n\n#define CHECK(cond)                                                   \\\n    do {                                                              \\\n        if (!(cond)) {                                                \\\n            printf(\"FAIL %s:%d: %s\\n\", __FILE__, __LINE__, #cond);    \\\n            g_fail++;                                                 \\\n        }                                                             \\\n    } while (0)"}, {"id": "C5-02", "day": 5, "lang": "c", "title": "테이블 기반 테스트", "prompt": "sext12(given)를 {raw, expected} 케이스 배열로 검사하는 test_sext12(void) → 실패 개수.", "given": "int16_t sext12(uint16_t raw)\n{\n    raw &= 0x0FFF;\n    return (raw & 0x0800) ? (int16_t)(raw - 0x1000) : (int16_t)raw;\n}", "answer": "int test_sext12(void)\n{\n    static const struct { uint16_t raw; int16_t want; } cases[] = {\n        {0x000, 0}, {0x7FF, 2047}, {0x800, -2048}, {0xFFF, -1},\n    };\n    int fails = 0;\n    for (size_t i = 0; i < sizeof cases / sizeof cases[0]; i++) {\n        int16_t got = sext12(cases[i].raw);\n        if (got != cases[i].want) {\n            printf(\"case %zu: raw=0x%03X got %d want %d\\n\",\n                   i, cases[i].raw, got, cases[i].want);\n            fails++;\n        }\n    }\n    return fails;\n}"}, {"id": "C5-03", "day": 5, "lang": "c", "title": "fake HAL (함수 포인터 주입)", "prompt": "i2c_ops_t {int (*read)(void *ctx, uint8_t reg, uint8_t *buf, size_t n); void *ctx;}로 온도(reg 0x00, 2바이트 BE, 단위 0.01도)를 읽는 temp_read(ops, out). 에러면 -1.", "given": "", "answer": "typedef struct {\n    int (*read)(void *ctx, uint8_t reg, uint8_t *buf, size_t n);\n    void *ctx;\n} i2c_ops_t;\n\nint temp_read(const i2c_ops_t *ops, int16_t *out_centi)\n{\n    uint8_t b[2];\n    if (ops->read(ops->ctx, 0x00, b, 2) != 0)\n        return -1;\n    *out_centi = (int16_t)((b[0] << 8) | b[1]);\n    return 0;\n}"}, {"id": "C5-04", "day": 5, "lang": "c", "title": "_Static_assert", "prompt": "wire 헤더 구조체 크기가 4바이트이고 RB_SIZE가 2의 거듭제곱인지 컴파일 타임에 확인.", "given": "#define RB_SIZE 64u\ntypedef struct { uint8_t sync, type; uint16_t len; } wire_hdr_t;", "answer": "_Static_assert(sizeof(wire_hdr_t) == 4, \"wire header must be 4 bytes\");\n_Static_assert((RB_SIZE & (RB_SIZE - 1u)) == 0, \"RB_SIZE must be a power of 2\");"}, {"id": "C5-05", "day": 5, "lang": "c", "title": "시간 주입 (now 함수 포인터)", "prompt": "now_fn 타입(uint32_t (*)(void))을 받아 pred가 참이 될 때까지 기다리는 wait_for(pred, now, timeout_ms) → bool.", "given": "", "answer": "typedef uint32_t (*now_fn)(void);\n\nbool wait_for(bool (*pred)(void), now_fn now, uint32_t timeout_ms)\n{\n    uint32_t start = now();\n    while (!pred()) {\n        if ((uint32_t)(now() - start) >= timeout_ms)\n            return false;\n    }\n    return true;\n}"}, {"id": "C5-06", "day": 5, "lang": "c", "title": "wrap 경계 테스트", "prompt": "rb_t + rb_push/rb_pop(given)에 대해 head=tail=UINT32_MAX-3에서 10개 넣고 빼며 순서와 개수를 확인하는 test_wrap(void) → 성공 시 true.", "given": "#define RB_SIZE 16u\n#define RB_MASK (RB_SIZE - 1u)\ntypedef struct { uint8_t buf[RB_SIZE]; uint32_t head, tail; } rb_t;\nstatic bool rb_push(rb_t *rb, uint8_t b) {\n    if (rb->head - rb->tail == RB_SIZE) return false;\n    rb->buf[rb->head++ & RB_MASK] = b; return true; }\nstatic bool rb_pop(rb_t *rb, uint8_t *o) {\n    if (rb->head == rb->tail) return false;\n    *o = rb->buf[rb->tail++ & RB_MASK]; return true; }", "answer": "bool test_wrap(void)\n{\n    rb_t rb = {{0}, UINT32_MAX - 3, UINT32_MAX - 3};\n    uint8_t v;\n    for (uint8_t i = 0; i < 10; i++)\n        if (!rb_push(&rb, i))\n            return false;\n    if (rb.head - rb.tail != 10)\n        return false;\n    for (uint8_t i = 0; i < 10; i++)\n        if (!rb_pop(&rb, &v) || v != i)\n            return false;\n    return !rb_pop(&rb, &v);\n}"}, {"id": "C5-07", "day": 5, "lang": "c", "title": "SWAP 매크로", "prompt": "if/else 안에서도 안전한 SWAP(type, a, b) 매크로 (do-while 0).", "given": "", "answer": "#define SWAP(type, a, b) \\\n    do {                     \\\n        type t_ = (a);       \\\n        (a) = (b);           \\\n        (b) = t_;            \\\n    } while (0)"}, {"id": "C5-08", "day": 5, "lang": "c", "title": "qsort 비교 함수", "prompt": "int32_t 배열을 오름차순 qsort 하는 비교 함수 cmp_i32 (빼기 오버플로 없이).", "given": "", "answer": "int cmp_i32(const void *pa, const void *pb)\n{\n    int32_t a = *(const int32_t *)pa;\n    int32_t b = *(const int32_t *)pb;\n    return (a > b) - (a < b);\n}"}, {"id": "C5-09", "day": 5, "lang": "c", "title": "snprintf 잘림 검사", "prompt": "\"fw=<ver> rev=<c>\"를 buf에 쓰고, 잘렸으면 false인 fmt_id(buf, cap, ver, rev).", "given": "", "answer": "bool fmt_id(char *buf, size_t cap, const char *ver, char rev)\n{\n    int n = snprintf(buf, cap, \"fw=%s rev=%c\", ver, rev);\n    return n >= 0 && (size_t)n < cap;\n}"}, {"id": "C5-10", "day": 5, "lang": "c", "title": "이진 탐색", "prompt": "정렬된 int 배열에서 key의 인덱스(없으면 -1) bin_search(a, n, key). mid 오버플로 피하기.", "given": "", "answer": "int bin_search(const int *a, int n, int key)\n{\n    int lo = 0, hi = n - 1;\n    while (lo <= hi) {\n        int mid = lo + (hi - lo) / 2;\n        if (a[mid] == key)\n            return mid;\n        if (a[mid] < key)\n            lo = mid + 1;\n        else\n            hi = mid - 1;\n    }\n    return -1;\n}"}]}</script><script>
const KEY='neros_tsp_notes_read_v1', TKEY='neros_tsp_notes_theme';
(function(){
  try{const t=localStorage.getItem(TKEY); if(t)document.documentElement.dataset.theme=t;}catch(e){}
  const tb=document.getElementById('theme');
  if(tb)tb.onclick=()=>{const d=document.documentElement;
    const cur=d.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    const nx=cur==='dark'?'light':'dark'; d.dataset.theme=nx; try{localStorage.setItem(TKEY,nx)}catch(e){}};
  let read=new Set(); try{read=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){}
  const cards=[...document.querySelectorAll('.card')];
  cards.forEach(c=>{ if(read.has(c.dataset.id)) c.classList.add('read'); });
  const rc=document.getElementById('readcount');
  if(rc)rc.textContent=cards.filter(c=>read.has(c.dataset.id)).length;
  const q=document.getElementById('q');
  if(q)q.addEventListener('input',()=>{
    const v=q.value.trim().toLowerCase();
    cards.forEach(c=>c.classList.toggle('hide', v && !c.dataset.search.includes(v)));
    document.querySelectorAll('.track').forEach(t=>{
      const any=[...t.querySelectorAll('.card')].some(c=>!c.classList.contains('hide'));
      t.classList.toggle('hide',!any);
    });
  });
  const rb=document.getElementById('resetread');
  if(rb)rb.onclick=()=>{ if(confirm('읽음 표시를 모두 지울까?')){
    try{localStorage.removeItem(KEY)}catch(e){} location.reload(); }};
})();

const DATA = JSON.parse(document.getElementById('drill-data').textContent);
const SK = 'tsp_drill_v1';
let st = {}; try { st = JSON.parse(localStorage.getItem(SK) || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem(SK, JSON.stringify(st)); } catch (e) {} };
let view = {day: '1', lang: 'all', mode: 'recall'};
try { Object.assign(view, JSON.parse(localStorage.getItem(SK + '_view') || '{}')); } catch (e) {}
const saveView = () => { try { localStorage.setItem(SK + '_view', JSON.stringify(view)); } catch (e) {} };
const esc = s => s.replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
const norm = s => s.split('\n').map(l => l.replace(/\s+$/, '').replace(/\s+/g, ' ').trim()).filter(l => l);
let randomPick = null;

function items() {
  let xs = DATA.items;
  if (view.day === 'rand') {
    if (!randomPick) randomPick = [...xs].sort(() => Math.random() - .5).slice(0, 10).map(x => x.id);
    xs = xs.filter(x => randomPick.includes(x.id));
  } else if (view.day === 'wrong') {
    xs = xs.filter(x => (st[x.id] || {}).mark === 'bad');
  } else {
    xs = xs.filter(x => String(x.day) === view.day);
  }
  if (view.lang !== 'all') xs = xs.filter(x => x.lang === view.lang);
  return xs;
}

function diffHtml(typed, ans) {
  const a = norm(typed), b = norm(ans);
  let out = '', hit = 0;
  for (let i = 0; i < Math.max(a.length, b.length); i++) {
    const t = a[i] ?? '', e = b[i] ?? '';
    if (t === e) { hit++; out += `<div class="m">${esc(t)}</div>`; }
    else out += `<div class="x">${esc(t) || '∅'}<br><span class="exp">→ ${esc(e) || '(줄 없음)'}</span></div>`;
  }
  return {html: out, hit, total: b.length};
}

function card(it) {
  const s = st[it.id] || {};
  const el = document.createElement('div');
  el.className = 'dr-item' + (s.mark === 'ok' ? ' ok' : s.mark === 'bad' ? ' bad' : '');
  const rows = it.answer.split('\n').length + 1;
  el.innerHTML = `
    <div class="dr-head"><span class="dr-id">${it.id}</span><span class="dr-lang">${it.lang === 'py' ? 'Python' : 'C'}</span>
      <span class="dr-title">${esc(it.title)}</span><span class="dr-time">${s.best ? '최고 ' + s.best + '초' : ''}</span></div>
    <div class="dr-prompt">${esc(it.prompt)}</div>
    ${it.given ? `<pre class="given">${esc(it.given)}</pre>` : ''}
    ${view.mode === 'copy' ? `<pre class="ghost">${esc(it.answer)}</pre>` : ''}
    <textarea rows="${rows}" spellcheck="false" autocapitalize="off" autocomplete="off"
      placeholder="${view.mode === 'copy' ? '위 코드를 그대로 따라 친다' : '정답을 보지 않고 친다 — Tab = 4칸, Enter = 들여쓰기 유지'}">${esc(s.draft || '')}</textarea>
    <div class="dr-btns">
      <button class="btn cmp">비교</button><button class="btn show">정답 보기</button>
      <button class="btn okb">✓ 맞음</button><button class="btn badb">✗ 다시</button><button class="btn clr">지우기</button>
    </div>
    <div class="dr-out"></div>`;
  const ta = el.querySelector('textarea'), out = el.querySelector('.dr-out'), tm = el.querySelector('.dr-time');
  let t0 = null, tick = null;
  ta.addEventListener('keydown', e => {
    if (!t0) { t0 = Date.now(); tick = setInterval(() => { tm.textContent = Math.round((Date.now() - t0) / 1000) + '초'; }, 500); }
    if (e.key === 'Tab') {
      e.preventDefault();
      const p = ta.selectionStart; ta.setRangeText('    ', p, ta.selectionEnd, 'end');
    } else if (e.key === 'Enter') {
      e.preventDefault();
      const p = ta.selectionStart, line = ta.value.slice(0, p).split('\n').pop();
      let ind = (line.match(/^\s*/) || [''])[0];
      if (/[:{]\s*$/.test(line)) ind += '    ';
      ta.setRangeText('\n' + ind, p, ta.selectionEnd, 'end');
    }
  });
  ta.addEventListener('input', () => { st[it.id] = Object.assign(st[it.id] || {}, {draft: ta.value}); save(); });
  const stop = () => { if (tick) clearInterval(tick); tick = null; return t0 ? Math.round((Date.now() - t0) / 1000) : null; };
  el.querySelector('.cmp').onclick = () => {
    const secs = stop(), d = diffHtml(ta.value, it.answer);
    out.innerHTML = `<div class="dr-score">${d.hit}/${d.total}줄 일치${secs ? ' · ' + secs + '초' : ''} (공백 차이는 무시)</div><div class="dr-diff">${d.html}</div>`;
    if (d.hit === d.total && norm(ta.value).length === d.total) {
      const cur = st[it.id] || {};
      st[it.id] = Object.assign(cur, {mark: 'ok', best: secs && (!cur.best || secs < cur.best) ? secs : cur.best});
      save(); el.classList.add('ok'); el.classList.remove('bad'); summary();
    }
  };
  el.querySelector('.show').onclick = () => { out.innerHTML = `<pre>${esc(it.answer)}</pre>`; };
  el.querySelector('.okb').onclick = () => { st[it.id] = Object.assign(st[it.id] || {}, {mark: 'ok'}); save(); el.className = 'dr-item ok'; summary(); };
  el.querySelector('.badb').onclick = () => { st[it.id] = Object.assign(st[it.id] || {}, {mark: 'bad'}); save(); el.className = 'dr-item bad'; summary(); };
  el.querySelector('.clr').onclick = () => { ta.value = ''; out.innerHTML = ''; t0 = null; stop(); tm.textContent = '';
    st[it.id] = Object.assign(st[it.id] || {}, {draft: ''}); save(); ta.focus(); };
  return el;
}

function summary() {
  const xs = items(), ok = xs.filter(x => (st[x.id] || {}).mark === 'ok').length,
        bad = xs.filter(x => (st[x.id] || {}).mark === 'bad').length,
        all = DATA.items.filter(x => (st[x.id] || {}).mark === 'ok').length;
  document.getElementById('dr-sum').innerHTML =
    `<span>이 목록 <b>${ok}</b>/${xs.length} ✓ · <b>${bad}</b> ✗</span><span>전체 <b>${all}</b>/${DATA.items.length} ✓</span>` +
    `<span>에디터: <code>python3 drills/drill.py new ${/^\d$/.test(view.day) ? view.day : 'N'}</code> → <code>check</code></span>`;
}

function render() {
  document.querySelectorAll('[data-day]').forEach(b => b.classList.toggle('on', b.dataset.day === view.day));
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === view.lang));
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === view.mode));
  const d = DATA.days[view.day];
  document.getElementById('dr-theme').textContent = d ? `Day ${view.day} · ${d[0]} — ${d[1]}` :
    view.day === 'rand' ? '무작위 10개 (새로 고침하면 다시 뽑음)' : '✗ 표시한 항목만';
  const list = document.getElementById('dr-list'); list.innerHTML = '';
  items().forEach(it => list.appendChild(card(it)));
  if (!list.children.length) list.innerHTML = '<p class="lead">항목이 없다.</p>';
  summary();
}
document.querySelectorAll('[data-day],[data-lang],[data-mode]').forEach(b => b.onclick = () => {
  if (b.dataset.day) { view.day = b.dataset.day; randomPick = null; }
  if (b.dataset.lang) view.lang = b.dataset.lang;
  if (b.dataset.mode) view.mode = b.dataset.mode;
  saveView(); render();
});
document.getElementById('dr-reset').onclick = () => {
  if (confirm('✓/✗ 표시와 입력한 내용을 모두 지울까?')) { st = {}; save(); render(); }
};
render();
</script></body></html>
