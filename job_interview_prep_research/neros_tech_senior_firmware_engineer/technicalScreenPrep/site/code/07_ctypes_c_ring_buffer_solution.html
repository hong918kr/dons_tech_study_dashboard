  <figure class="code"><span class="lang">python</span><pre><code>"""07 · C ring buffer 를 pytest + ctypes 로 테스트하기 — 모범답안

피검 코드: ../../onsitePrep/code/ring_buffer.c (온사이트용 C 링버퍼 그대로). static 함수라서
c/rb_shim.c 가 #include 하고 non-static 래퍼(shim_*)를 export 한다.

보여 주려는 것
- session fixture 에서 cc 로 공유 라이브러리를 한 번만 빌드 (tmp_path_factory). cc 가 없으면 skip
- ctypes.Structure 로 C 구조체를 그대로 표현 → head/tail 을 테스트에서 직접 UINT32_MAX 근처로 세팅
- argtypes/restype 선언 (안 하면 int 로 가정해서 size_t·포인터가 깨진다)
- 같은 테스트를 Python 레퍼런스 모델과 비교 → "C 를 Python 으로 테스트한다"는 FW 테스트 팀의 일상
"""
import ctypes
import random
import shutil
import subprocess
from collections import deque
from pathlib import Path

import pytest

SHIM = Path(__file__).resolve().parents[2] / "c" / "rb_shim.c"
U8, U32, SZ = ctypes.c_uint8, ctypes.c_uint32, ctypes.c_size_t


class RB(ctypes.Structure):
    _fields_ = [("buf", U8 * 16), ("head", U32), ("tail", U32)]


@pytest.fixture(scope="session")
def lib(tmp_path_factory):
    cc = shutil.which("cc") or shutil.which("gcc") or shutil.which("clang")
    if not cc:
        pytest.skip("C compiler not found")
    so = tmp_path_factory.mktemp("c") / "librb.so"
    subprocess.run([cc, "-std=c11", "-Wall", "-Wextra", "-Werror", "-O2", "-shared", "-fPIC",
                    str(SHIM), "-o", str(so)], check=True)
    L = ctypes.CDLL(str(so))
    P = ctypes.POINTER(RB)
    sig = {
        "shim_sizeof": ([], SZ), "shim_capacity": ([], U32), "shim_init": ([P], None),
        "shim_count": ([P], U32), "shim_push": ([P, U8], ctypes.c_int),
        "shim_pop": ([P, ctypes.POINTER(U8)], ctypes.c_int),
        "shim_peek": ([P, ctypes.POINTER(U8)], ctypes.c_int),
        "shim_write": ([P, ctypes.c_char_p, SZ], SZ),
        "shim_read": ([P, ctypes.c_char_p, SZ], SZ),
        "shim_selftest": ([], ctypes.c_int),
    }
    for name, (args, res) in sig.items():
        fn = getattr(L, name)
        fn.argtypes, fn.restype = args, res
    return L


@pytest.fixture
def rb(lib):
    if ctypes.sizeof(RB) != lib.shim_sizeof():          # 작은 구조체를 C 에 넘기면 메모리를 덮어쓴다
        pytest.fail("RB layout != rb_t — _fields_ 부터 맞출 것")
    r = RB()
    lib.shim_init(ctypes.byref(r))
    return r


def pop(lib, r):
    v = U8()
    ok = lib.shim_pop(ctypes.byref(r), ctypes.byref(v))
    return v.value if ok else None


def write(lib, r, data):
    return lib.shim_write(ctypes.byref(r), bytes(data), len(data))


def read(lib, r, n):
    out = ctypes.create_string_buffer(n)
    got = lib.shim_read(ctypes.byref(r), out, n)
    return out.raw[:got]


# ------------------------------------------------------------------ tests
def test_struct_layout_matches_c(lib):
    assert ctypes.sizeof(RB) == lib.shim_sizeof()        # 레이아웃이 틀리면 나머지 테스트는 의미 없다
    assert lib.shim_capacity() == 16


def test_original_c_selftest_passes(lib):      # C 의 puts 출력은 프로세스 종료 때 보일 수 있다
    assert lib.shim_selftest() == 0


def test_empty(lib, rb):
    assert lib.shim_count(ctypes.byref(rb)) == 0
    assert pop(lib, rb) is None


def test_all_16_slots_usable_then_full(lib, rb):
    assert all(lib.shim_push(ctypes.byref(rb), i) for i in range(16))
    assert lib.shim_push(ctypes.byref(rb), 99) == 0      # drop-new
    assert [pop(lib, rb) for _ in range(16)] == list(range(16))


@pytest.mark.parametrize("start", [0, 5, 0xFFFFFFFF - 3, 0xFFFFFFFF])
def test_index_wrap_at_2_pow_32(lib, rb, start):
    rb.head = rb.tail = start                            # Python 에서 C 구조체 필드를 직접 세팅
    for i in range(10):
        assert lib.shim_push(ctypes.byref(rb), i)
    assert lib.shim_count(ctypes.byref(rb)) == 10
    assert [pop(lib, rb) for _ in range(10)] == list(range(10))


@pytest.mark.parametrize("wlen, rlen", [(11, 7), (16, 16), (3, 5), (20, 1)])
def test_bulk_write_read_matches_model(lib, rb, wlen, rlen):
    model, nxt = deque(), 0
    for _ in range(300):
        data = bytes((nxt + i) &amp; 0xFF for i in range(wlen))
        w = write(lib, rb, data)
        assert w == min(wlen, 16 - len(model))
        model.extend(data[:w])
        nxt += w
        got = read(lib, rb, rlen)
        assert got == bytes(model.popleft() for _ in range(len(got)))
        assert lib.shim_count(ctypes.byref(rb)) == len(model)


def test_random_ops_against_model(lib, rb):
    rnd, model = random.Random(7), deque()
    for _ in range(5000):
        if rnd.random() &lt; 0.55:
            b = rnd.randrange(256)
            ok = lib.shim_push(ctypes.byref(rb), b)
            assert ok == (len(model) &lt; 16)
            if ok:
                model.append(b)
        else:
            assert pop(lib, rb) == (model.popleft() if model else None)

</main></div><script>
const KEY='neros_tsp_notes_read_v1', TKEY='neros_tsp_notes_theme', CKEY='neros_tsp_notes_check_v1';
const readSet=()=>{try{return new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){return new Set()}};
const saveSet=s=>{try{localStorage.setItem(KEY,JSON.stringify([...s]))}catch(e){}};
(function(){
  try{const t=localStorage.getItem(TKEY); if(t)document.documentElement.dataset.theme=t;}catch(e){}
  const tb=document.getElementById('theme');
  if(tb)tb.onclick=()=>{const d=document.documentElement;
    const cur=d.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    const nx=cur==='dark'?'light':'dark'; d.dataset.theme=nx;
    try{localStorage.setItem(TKEY,nx)}catch(e){}};
  // 진행 바
  const bar=document.getElementById('bar');
  const onScroll=()=>{const h=document.body.scrollHeight-innerHeight;
    bar.style.width=(h>0?Math.min(100,scrollY/h*100):0)+'%';};
  addEventListener('scroll',onScroll,{passive:true}); onScroll();
  // 읽음 표시
  const id=document.body.dataset.note, rb=document.getElementById('readbtn');
  const sync=()=>{const s=readSet(); const on=s.has(id);
    rb.classList.toggle('on',on); rb.textContent=on?'✓ 읽음':'읽음 표시';};
  if(rb){rb.onclick=()=>{const s=readSet(); s.has(id)?s.delete(id):s.add(id); saveSet(s); sync();}; sync();}
  // 체크박스 저장
  let cs={}; try{cs=JSON.parse(localStorage.getItem(CKEY)||'{}')}catch(e){}
  document.querySelectorAll('li.task input').forEach((el,i)=>{
    const k=id+':'+i; if(cs[k])el.checked=true;
    el.addEventListener('change',()=>{cs[k]=el.checked;
      try{localStorage.setItem(CKEY,JSON.stringify(cs))}catch(e){}});
  });
  // TOC 하이라이트
  const links=[...document.querySelectorAll('aside a')];
  const map=new Map(links.map(a=>[a.getAttribute('href').slice(1),a]));
  const heads=[...document.querySelectorAll('main h2[id],main h3[id]')];
  if(heads.length){
    const io=new IntersectionObserver(es=>{
      es.forEach(e=>{ if(e.isIntersecting){ links.forEach(a=>a.classList.remove('active'));
        const a=map.get(e.target.id); if(a)a.classList.add('active'); }});
    },{rootMargin:'-80px 0px -70% 0px',threshold:0});
    heads.forEach(h=>io.observe(h));
  }
  // 키보드: j/k 다음·이전 노트
  addEventListener('keydown',e=>{
    if(e.target.matches('input,textarea'))return;
    if(e.key==='j'){const n=document.querySelector('.nav a.next'); if(n)location.href=n.href;}
    if(e.key==='k'){const p=document.querySelector('.nav a.prev'); if(p)location.href=p.href;}
  });
})();
