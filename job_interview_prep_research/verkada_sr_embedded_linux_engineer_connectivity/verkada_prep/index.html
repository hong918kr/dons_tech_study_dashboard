xplanation_ko": "release 감소만 하면 '내 접근이 다른 스레드에게 보인다'는 보장뿐이다. 그런데 free 하는 스레드에게 필요한 것은 정반대 방향 — '다른 스레드들이 이 객체에 한 모든 접근이 나에게 보인다' 다. 그래서 마지막 참조에서 acquire fence 가 필요하다. `fetch_sub(acq_rel)` 로 매번 acquire 를 거는 것도 맞지만, 빈번한 감소 경로에서 배리어를 아끼려고 '마지막 한 번만 fence' 로 쓰는 것이 Boost/LLVM 의 표준 관용구다. 별도의 함정: 참조를 들고 있지 **않은** 상태에서 `load(ptr)` → `fetch_add(refs)` 두 줄로 나누면 그 사이에 publisher 가 교체 + 마지막 참조 해제를 해버려 이미 free 된 메모리를 건드릴 수 있다. 이 창을 닫는 방법은 ①아주 짧은 락으로 두 줄을 원자화 ②hazard pointer ③RCU/epoch 세 가지뿐이다.", "complexity": "get/put O(1), lock-free. 해제는 마지막 참조 1회", "pitfalls": ["acquire fence 없이 free → 다른 스레드의 마지막 쓰기를 못 본 채 해제(use-after-free 급 버그).", "증가를 seq_cst 로 해서 핫 패스에 배리어를 뿌리기.", "참조 없이 포인터를 읽고 나서 fetch_add 하기 → 그 사이에 해제될 수 있다.", "해제 조건을 `refs == 0` 로 검사하기(감소 후 다시 load) → 두 스레드가 동시에 0 을 보고 double free.", "객체를 mutable 로 두기 — 불변 객체여야 '들고 있는 동안 내용이 안 바뀐다'가 성립한다."], "verkada_context": "Command 에서 새 설정(APN, WAN 우선순위, 업로드 주기)이 내려올 때 읽는 중인 워커를 멈추지 않고 교체하는 경로. 200만 대 fleet 에서 설정 push 중 재시작은 허용되지 않는다."}, {"num": 30, "slug": "aba_tagged_pointer", "title_ko": "ABA 문제와 tagged pointer", "title_en": "The ABA problem and tagged pointers", "difficulty": "hard", "tags": ["ABA", "tagged-pointer", "CAS", "lock-free", "reclamation"], "prompt_ko": "ABA 문제를 설명하고, (32bit index | 32bit tag) 를 한 워드에 packing 한 배열 freelist 를 64비트 CAS 로 구현하라. push/pop 마다 tag 를 +1 해서, 선점되었던 스레드의 stale CAS 가 인덱스는 같아도 실패하도록 만든다. 단일 스레드만으로 이 시나리오를 결정적으로 검증할 것.", "prompt_en": "Explain ABA, then implement an array freelist whose head packs a 32-bit index with a 32-bit tag into one 64-bit word, bumping the tag on every push/pop so a stale CAS fails even when the index matches. Verify it deterministically single-threaded.", "signature": "bool pool_pop(TaggedPool *p, uint32_t *out_idx); void pool_push(TaggedPool *p, uint32_t idx)", "examples": [{"in": "snap = head; pop A; pop B; push A", "out": "head 의 index 는 다시 A 지만 tag 가 달라 snap != head"}, {"in": "stale CAS(head, snap, ...)", "out": "false (태그 덕분에 거부)"}], "hints": ["CAS 는 '값이 같은가'만 본다. '그 사이에 바뀌었는가'는 모른다.", "포인터 대신 **배열 인덱스**를 쓰면 상위 32비트가 남아 태그를 공짜로 얻는다.", "pop 은 acq_rel CAS(리스트를 읽고 동시에 publish), push 는 release CAS. 실패 order 는 acquire/relaxed."], "solution": "void pool_init(TaggedPool *p) {\n    atomic_init(&p->head, (uint64_t)0);\n    for (unsigned i = 0; i \u003c POOL_N; i++) p->next[i] = 0u;\n    for (unsigned i = POOL_N; i-- > 0; ) {\n        uint64_t old = atomic_load_explicit(&p->head, memory_order_relaxed);\n        p->next[i] = TAG_IDX1(old);\n        atomic_store_explicit(&p->head, TAG_PACK(i + 1u, TAG_CNT(old) + 1u),\n                              memory_order_relaxed);\n    }\n}\n\nbool pool_pop(TaggedPool *p, uint32_t *out_idx) {\n    uint64_t old = atomic_load_explicit(&p->head, memory_order_acquire);\n    for (;;) {\n        uint32_t i1 = TAG_IDX1(old);\n        if (i1 == 0u) return false;                      /* 비었음 */\n        uint64_t neu = TAG_PACK(p->next[i1 - 1u], TAG_CNT(old) + 1u); /* 태그 +1 */\n        if (atomic_compare_exchange_weak_explicit(&p->head, &old, neu,\n                                                  memory_order_acq_rel,\n                                                  memory_order_acquire)) {\n            *out_idx = i1 - 1u;\n            return true;\n        }\n        /* 실패 → old에 현재 head가 자동으로 실린다. 다시 load하지 않는다. */\n    }\n}\n\nvoid pool_push(TaggedPool *p, uint32_t idx) {\n    uint64_t old = atomic_load_explicit(&p->head, memory_order_relaxed);\n    uint64_t neu;\n    do {\n        p->next[idx] = TAG_IDX1(old);\n        neu = TAG_PACK(idx + 1u, TAG_CNT(old) + 1u);\n    } while (!atomic_compare_exchange_weak_explicit(&p->head, &old, neu,\n                                                    memory_order_release,\n                                                    memory_order_relaxed));\n}\n\nbool pool_stale_cas(TaggedPool *p, uint64_t stale_head, uint64_t desired) {\n    uint64_t expected = stale_head;\n    return atomic_compare_exchange_strong_explicit(&p->head, &expected, desired,\n                                                   memory_order_acq_rel,\n                                                   memory_order_acquire);\n}", "explanation_ko": "ABA 시나리오: T1 이 `top == A` 를 읽고 선점된다. 그 사이 T2 가 A 를 pop, B 를 pop, A 를 다시 push 한다. top 은 다시 A 지만 `A->next` 는 완전히 다른 값이다. T1 이 깨어나 `CAS(top, A, A->next_old)` 를 하면 값이 A 로 같으니 **성공하고** 리스트가 깨진다. 해법은 세 가지다. ①tagged pointer — 포인터(또는 인덱스)와 버전 카운터를 한 워드로 묶어 CAS 하고 매 연산마다 태그를 올린다. 64비트 CAS 로 (32bit index | 32bit tag), 또는 DWCAS(x86 cmpxchg16b, ARM CASP)로 (64bit ptr | 64bit tag). ②hazard pointer / epoch-based reclamation / RCU — 재사용 자체를 지연시켜 ABA 를 원천 차단한다. ③그냥 mutex — 임베디드 코드 대부분에서 이게 정답이고, 면접에서 이 말을 덧붙이면 trade-off 를 아는 사람으로 읽힌다. 태그는 32비트라 이론상 랩될 수 있지만, 랩되는 동안 정확히 같은 인덱스로 돌아올 확률은 실무상 무시된다(그래서 '확률적' 해법이라고 말해야 정확하다).", "complexity": "pop/push O(1) 기대, lock-free. 태그 때문에 head 는 64비트 CAS 가 필요", "pitfalls": ["태그를 올리지 않고 포인터만 CAS → ABA 그대로 노출.", "포인터 하위 비트(정렬 여유)에 태그를 숨기면 비트가 3~4개뿐이라 금방 랩된다 — 인덱스 방식이나 DWCAS 가 안전하다.", "64비트 CAS 가 모든 플랫폼에서 lock-free 라고 가정하기 → `atomic_is_lock_free` 로 확인해야 한다(32비트 MCU 에서는 아님).", "CAS 루프 안에서 `p->next[i-1]` 을 읽는 것이 멀티스레드에서 안전하다고 가정하기 — 이 읽기 자체가 ABA 의 진짜 위험 지점이라 실전에서는 hazard pointer 가 함께 필요하다.", "'lock-free = 항상 더 빠르다' 고 말하기 — 경합이 높으면 재시도 때문에 mutex 보다 느릴 수 있다."], "verkada_context": "ISR 에서 쓸 수 있는 고정 크기 버퍼 풀(패킷 디스크립터 freelist)처럼 malloc 없이 객체를 재사용하는 구조. 다만 실제 제품 코드에서 먼저 물어볼 것은 '정말 lock-free 가 필요한가' 다."}]}, {"id": "realtime_buffers", "order": 4, "range": "Q31-38", "icon": "🎞️", "track": "core", "title_en": "Real-time Buffering (Double/Triple)", "title_ko": "실시간 버퍼링 (더블/트리플 버퍼)", "summary_ko": "센서·프레임처럼 '최신값이 곧 정답'인 데이터를 tearing 없이, 생산자를 막지 않고 전달하는 패턴 모음. 핵심은 락으로 데이터가 아니라 버퍼 소유권(write_idx/ready_idx/reader_idx)을 보호하는 것 — 임계구역은 인덱스 교환뿐이고 프레임 복사는 락 밖에서 일어난다. 더블 → 트리플 확장의 trade-off(메모리 +50% vs writer 무기아), latest-value 슬롯의 mutex vs seqlock 선택, 400Hz→100Hz 레이트 디커플링, DMA ping-pong의 ISR 규율과 캐시 유지, 그리고 지터·누락을 순수 함수로 측정하는 법까지 다룬다.", "summary_en": "Patterns for moving data where only the newest value matters — frames, sensor snapshots — without tearing and without ever blocking the producer. The lock protects buffer ownership, not the payload, so the critical section is a few index assignments. Covers double vs triple buffering trade-offs, mutex vs seqlock latest-value slots, 400Hz-to-100Hz rate decoupling, DMA ping-pong ISR discipline plus cache maintenance, and measuring jitter and dropped frames as a pure function.", "verkada_relevance_ko": "2026-09-15 리크루터 Davis의 안내 메일이 복습 주제로 'real-time data handling patterns (such as double buffering)'를 **이름까지 지목**했다. 4개 항목 중 유일하게 구체적 패턴명이 박혀 있으므로 사실상 출제 예고다. 제품 맥락도 정확히 들어맞는다: MT81 보안 트레일러는 카메라 최대 6대의 프레임을 태양광·배터리 예산 안에서 처리해야 하고, GC31-E 셀룰러 게이트웨이는 LTE 링크 통계·듀얼 SIM failover 상태 같은 작은 스냅샷을 업로드·로컬 UI·BLE 프로비저닝 스레드가 동시에 읽는다(= latest-value 슬롯). GW31-E의 '오프라인 30분이면 자가 재부팅'은 타임스탬프 기반 헬스 판정 그 자체이고, 공기질 센서(SV)의 MCU/FreeRTOS 급 환경은 RAM 예산 때문에 더블 vs 트리플을 실제로 고민해야 하는 자리다. 평가 기준의 '설계 결정과 trade-off의 정당화'는 여기서 메모리 +50%와 지연 +1프레임을 놓고 말로 정당화하는 능력으로 직결되고, 'edge case와 concurrent 시스템의 견고성'은 drop 카운터 분리와 회계 불변식으로 보여준다. 덤으로 Don의 SSD 펌웨어 DMA 완료 인터럽트 경험을 Linux DMA API 어휘로 번역할 기회이기도 하다.", "concepts": [{"term": "buffer ownership", "ko": "버퍼 하나는 언제나 WRITER 소유 / READY / READER 소유 / FREE 중 하나다. 인덱스 3개(write_idx/ready_idx/reader_idx)가 곧 소유권 장부이고, 락은 데이터가 아니라 이 장부를 지킨다.", "en": "Every buffer is in exactly one state: owned by the writer, published (READY), owned by the reader, or free. Three indices are the ledger; the lock protects the ledger, not the data."}, {"term": "tearing", "ko": "소비자가 절반만 갱신된 프레임(두 세대가 섞인 데이터)을 보는 것. reader가 대여 중인 버퍼에 writer가 쓰면 발생한다. 페이로드를 self-describing으로 만들면 검출 가능하다.", "en": "The reader observing a half-updated frame — two generations mixed. Caused by the writer touching the buffer the reader holds; detectable with a self-describing payload."}, {"term": "latest-wins / drop-oldest", "ko": "실시간 경로에서는 지연 누적이 곧 고장이다. 큐처럼 쌓지 않고 항상 최신 프레임으로 덮어쓰되, 버린 개수를 반드시 카운트해 텔레메트리로 내보낸다.", "en": "In a real-time path, accumulating latency is failure. Overwrite with the newest frame instead of queueing — but always export a dropped-frame counter."}, {"term": "double vs triple buffering", "ko": "더블은 READER 1 + READY 1 이면 writer가 굶어 READY를 뺏는다. 트리플은 세 역할이 동시에 성립해 writer가 절대 굶지 않는다. 대가는 메모리 +50%와 지연 최대 +1프레임.", "en": "With two buffers the writer starves when the reader holds one and another is READY. A third buffer removes that at the cost of 50% more memory and up to one extra frame of latency."}, {"term": "starve-drop vs overwrite-drop", "ko": "빈 버퍼가 없어 READY를 희생한 drop(starved)과, 소비자가 느려 새 프레임이 이전 READY를 덮은 drop은 원인이 다르다. 카운터를 분리해야 '생산이 빠른가 소비가 느린가'를 텔레메트리로 진단할 수 있다.", "en": "A drop because no buffer was free is a different failure from a drop because the consumer was slow. Separate counters make the cause diagnosable from telemetry alone."}, {"term": "accounting invariant", "ko": "consumed + dropped + leftover + inflight == produced. 스케줄링과 무관하게 항상 참이므로 동시성 테스트를 플래키하지 않게 만든다. '읽힌 개수 == N' 같은 단정은 금물.", "en": "consumed + dropped + leftover + inflight == produced — true regardless of scheduling, which is what makes a concurrency test non-flaky. Never assert an exact count."}, {"term": "seqlock", "ko": "writer가 seq를 홀수로 올리고 쓰고 짝수로 복귀하는 프로토콜. writer는 절대 막히지 않고 reader는 찢어진 읽기를 감지해 재시도한다. 제약: writer 1명, 포인터 없는 POD 페이로드, reader 재시도 상한 필수.", "en": "The writer bumps a sequence to odd, writes, and bumps back to even; the writer never blocks and readers retry on a torn read. Requires a single writer, a pointer-free POD payload, and a bounded retry loop."}, {"term": "relaxed atomic payload", "ko": "seqlock 페이로드를 일반 변수로 두면 '읽고 버리는' 정상 경합이 C 표준상 data race(UB)이고 TSan도 경고한다. _Atomic + memory_order_relaxed + release/acquire fence 로 쓰면 생성 코드는 사실상 같고 UB가 아니다.", "en": "A seqlock's speculative read is a data race (UB) if the payload is a plain variable, and ThreadSanitizer flags it. Relaxed atomics plus release/acquire fences give the same codegen without the UB."}, {"term": "rate decoupling (decimation)", "ko": "생산 400Hz → 소비 100Hz 같은 레이트 차이를 흡수하는 4:1 축약. 계단·이벤트 신호는 최신값 채택, 노이즈 있는 연속 신호는 구간 평균. 순수 함수로 분리해 하드웨어 없이 테스트한다.", "en": "Collapsing a fast producer rate into a slower consumer rate: take-latest for step/event signals, block-average for noisy continuous ones — as a pure function so it is testable without hardware."}, {"term": "DMA ping-pong + cache maintenance", "ko": "DMA가 한 버퍼를 채우는 동안 CPU가 다른 버퍼를 처리한다. 완료 ISR은 인덱스 교환만 한다. DMA→CPU 전에 cache invalidate, CPU→DMA 전에 clean/flush가 필요하고 버퍼는 캐시 라인 정렬이어야 한다. Linux에서는 dma_map_single / dma_alloc_coherent 가 대신 처리한다.", "en": "DMA fills one buffer while the CPU processes the other; the completion ISR only swaps indices. Invalidate before the CPU reads a DMA-filled buffer, clean before the DMA reads a CPU-filled one, and align buffers to a cache line — dma_map_single / dma_alloc_coherent do this on Linux."}], "study_note_md": "# 🎞️ 실시간 버퍼링 (더블/트리플 버퍼) (Real-time Buffering (Double/Triple)) — Q31~38\n\n> 리크루터 메일이 복습 주제로 **\"real-time data handling patterns (such as double\n> buffering)\"** 을 대놓고 이름까지 적어줬다. 이 세트는 사실상 **출제 예고편**이다.\n> 핵심 한 줄: **락으로 '데이터'를 보호하지 말고 '버퍼 소유권'을 보호한다.**\n> 생산자(센서/DMA/카메라)는 절대 블로킹되지 않고, 소비자가 느리면 오래된 프레임을\n> 버리되 **반드시 카운트한다**.\n\n---\n\n## 1. 핵심 아이디어\n\n큐(FIFO)와 더블 버퍼는 목적이 다르다.\n\n| | 큐 / 링버퍼 | 더블·트리플 버퍼 |\n|---|---|---|\n| 보존하고 싶은 것 | **모든 항목** (감사 로그, 명령) | **가장 최신 항목** (프레임, 스냅샷) |\n| 가득 차면 | 블록하거나 oldest drop | 항상 최신으로 덮어씀 |\n| 소비자가 느리면 | 지연이 누적된다 (latency 폭발) | 중간 프레임을 건너뛴다 (latency 일정) |\n| 복사 | push/pop마다 데이터 복사 | **복사 0** — 포인터/인덱스만 교환 |\n\n실시간 경로에서 latency 누적은 사실상 고장이다. 3초 전 프레임을 보여줄 바엔 버리는 게\n낫다 — 그래서 \"최신값 우선(latest-wins)\" 버퍼링이다.\n\n### 소유권 모델 — 버퍼는 언제나 셋 중 한 상태\n\n```\n                      mb_write_commit()            mb_read_acquire()\n     ┌──────────┐    ───────────────▶  ┌───────┐  ───────────────▶  ┌──────────┐\n     │  WRITER  │                      │ READY │                    │  READER  │\n     │ 소유     │                      │(publish│                   │  소유    │\n     │write_idx │                      │ 됨)   │                    │reader_idx│\n     └──────────┘                      └───────┘                    └──────────┘\n          ▲                                 │                             │\n          │ mb_write_begin()                │ ◀── 새 프레임이 덮음        │ mb_read_release()\n          │ (FREE를 집는다)                 │     (dropped++)             │\n          │                                 ▼                             ▼\n     ┌────┴──────────────────────────────────────────────────────────────────┐\n     │                              FREE                                      │\n     │        (어느 인덱스에도 잡혀 있지 않은 버퍼 = 아무나 써도 됨)          │\n     └────────────────────────────────────────────────────────────────────────┘\n\n  더블(nbuf=2): READER 1개 + READY 1개면 FREE가 없다\n                → write_begin 이 READY를 희생(dropped++, starved++)\n  트리플(nbuf=3): READER + READY + WRITER 가 동시에 성립 → writer 절대 안 굶음\n```\n\n핵심은 **인덱스 세 개(write_idx / ready_idx / reader_idx)가 곧 소유권 장부**라는 것.\nmutex는 이 장부(int 3개)만 지킨다. 프레임 128B~6MB의 실제 바이트 write/read는\n락 **밖**에서 일어난다 → 임계구역은 수 나노초, 우선순위 역전도 사실상 없다.\n\n```c\nFrame *f = mb_write_begin(&mb);   // 락: 인덱스 교환만 (ns)\nframe_fill(f, seq);               // 락 밖: 진짜 작업 (us~ms)\nmb_write_commit(&mb);             // 락: 인덱스 교환만 (ns)\n```\n\n---\n\n## 2. 더블 vs 트리플 — 무엇을 사느냐\n\n| | 더블 버퍼 (N=2) | 트리플 버퍼 (N=3) |\n|---|---|---|\n| 메모리 | 2× 프레임 | 3× 프레임 (**+50%**) |\n| writer가 막히거나 굶는가 | 굶는다(FREE 없음) → READY를 뺏음 | **절대 안 굶는다** |\n| reader가 든 프레임 | 안전(절대 안 뺏음) | 안전 |\n| 소비자 처리시간 허용치 | **전송 1주기 이내** | 1주기를 넘어도 됨 |\n| 남는 drop 종류 | starve-drop + 덮어쓰기 drop | 덮어쓰기 drop만 |\n| 지연(latency) | 최소 | +0~1 프레임 |\n| 전형적 용도 | DMA ping-pong, MCU (RAM 부족) | GPU/디스플레이, Linux 영상 파이프라인 |\n\n**면접 포인트**: 트리플 버퍼도 drop이 0이 되진 않는다. 없어지는 건 \"writer가 쓸 곳이\n없어 굶는 drop(starved)\"뿐이고, \"소비자가 느려 최신 프레임이 이전 READY를 덮는 drop\"은\n그대로 남는다. **둘을 카운터로 분리하면** 현장에서 \"생산이 빠른가, 소비가 느린가\"를\n텔레메트리만 보고 안다. 그리고 1080p RGB면 N=2는 ~6MB, N=3은 ~9MB — RAM 예산에서\n3MB는 공짜가 아니므로 \"트리플이 항상 정답\"이 아니라 **trade-off를 말해야** 한다.\n\n---\n\n## 3. latest-value 슬롯 — mutex vs seqlock\n\n작은 POD 구조체(링크 통계, 배터리 SoC, GPS fix) 하나만 최신으로 공유할 때는\n버퍼 풀까지 갈 필요가 없다.\n\n| | mutex | seqlock |\n|---|---|---|\n| writer | reader가 잡고 있으면 **막힌다** | **절대 안 막힌다** |\n| reader | 막힐 수 있음 | 막히지 않고 **재시도**한다 |\n| 적합 | 쓰기 잦음 · 페이로드 큼 · 공정성 필요 | **읽기 多 · 쓰기 少 · 페이로드 小** |\n| 제약 | 없음 | writer 1명, 포인터 없는 POD만 |\n| 우선순위 역전 | 가능 (PI mutex 필요) | 구조적으로 없음 |\n| 굶주림 | 없음 | writer가 폭주하면 **reader가 못 읽음** |\n\n```c\n// writer: seq 홀수(진입) → 데이터 → seq 짝수(이탈)\nseq++;  release_fence;  payload = v;  release_fence;  seq++;\n\n// reader: 앞뒤 seq가 같고 짝수일 때만 채택, 아니면 재시도(상한 필수)\ns1 = seq;  if (s1 & 1) retry;\ntmp = payload;  acquire_fence;\nif (seq != s1) retry;   // 읽는 동안 writer가 지나감\n```\n\n> ⚠️ seqlock 페이로드는 반드시 `_Atomic` + `memory_order_relaxed` 로 읽고 쓸 것.\n> 일반 변수로 두면 \"읽고 버리는\" 경합이 알고리즘상 정상이어도 **C 표준상 data\n> race = UB** 이고, ThreadSanitizer도 경고한다. relaxed atomic + fence면 생성\n> 코드는 사실상 같고 UB가 아니다. 이 문장 하나로 memory model 이해도를 보여줄 수 있다.\n>\n> ⚠️ 페이로드에 **포인터가 있으면 seqlock 금지**. 찢어진 포인터를 역참조하면\n> 재시도할 기회조차 없이 죽는다. 그래서 커널 seqlock도 값 스냅샷(`jiffies`,\n> `timekeeper`)에만 쓴다.\n\n---\n\n## 4. 레이트 디커플링 — 400Hz → 100Hz\n\n생산 레이트와 소비 레이트가 다를 때 4:1로 줄이는 두 정책:\n\n| 정책 | 무엇을 하나 | 어울리는 데이터 | 부작용 |\n|---|---|---|---|\n| **latest (take-newest)** | 블록의 마지막 샘플 | 계단·이벤트성: 링크 up/down, 도어 상태, 최신 GPS fix, 재부팅 플래그 | 노이즈·에일리어싱 그대로 통과 |\n| **mean (block average)** | 블록 평균 | 연속 아날로그: RSSI, 온도, 전류, PM2.5 | 엣지가 뭉개짐, 지연 +½블록 |\n\n판단 기준 한 문장: **\"이 신호는 순간값이 의미인가, 추세가 의미인가?\"**\n상태 전이를 놓치면 안 되는 신호에 평균을 쓰면 글리치가 사라져 버린다.\n반대로 노이즈 심한 아날로그에 latest를 쓰면 무작위 한 점이 제어에 들어간다.\n\n구현 디테일(감점 포인트): 합계는 `int64_t` 누적(int32면 오버플로), 반올림은 **0에서 먼\n쪽**으로 통일(C의 `/`는 0쪽 절단이라 음수 편향), 꽉 찬 블록만 처리하고 꼬리는 다음\n호출로(스트리밍 친화). 그리고 이 계산을 **순수 함수**로 뽑아 하드웨어 없이 테스트하는\n것 자체가 메일의 \"modular, testable embedded software\" 항목에 대한 답이다.\n\n---\n\n## 5. DMA ping-pong — ISR에서 하면 안 되는 것\n\n```\n   시각 t0        t1        t2        t3\n   DMA  →buf0     →buf1     →buf0     →buf1\n   CPU            proc buf0 proc buf1 proc buf0\n        ↑ISR      ↑ISR      ↑ISR      ↑ISR   ← 각 ISR이 하는 일: 인덱스 토글뿐\n```\n\n완료 인터럽트에서 하는 일은 **인덱스 교환 한 줄**이다.\n\n- ❌ 데이터 복사 / 파싱 / 필터링 — ISR은 수 µs 안에 끝나야 한다\n- ❌ mutex, malloc, printf 등 블로킹 API — 애초에 호출 불가\n- ✅ `active ^= 1`, `full = done`, 카운터 증가, 태스크 깨우기 시그널만\n\n### ⚠️ 캐시 일관성 (실제 하드웨어에서 \"가끔 깨지는\" 버그의 원흉)\n\nDMA는 CPU 캐시를 우회해 DRAM에 직접 읽고 쓴다. 그래서:\n\n| 방향 | 필요한 것 | 안 하면 |\n|---|---|---|\n| **DMA → CPU** (수신 완료 후 읽기 전) | `invalidate` (오래된 캐시 라인 폐기) | CPU가 **옛날 데이터**를 캐시에서 읽는다 |\n| **CPU → DMA** (송신 버퍼 채운 뒤) | `clean` / `flush` (쓰기 버퍼를 DRAM에 반영) | DMA가 **덜 쓰인 버퍼**를 전송한다 |\n\n버퍼는 **캐시 라인 정렬 + 라인 크기의 배수**여야 한다. 아니면 같은 라인에 얹힌\n인접 변수까지 함께 무효화/플러시되어 \"재현 안 되는\" 데이터 손상이 된다.\n\nLinux에서는 보통 직접 안 한다 — **스트리밍 매핑**(`dma_map_single()` /\n`dma_unmap_single()` / `dma_sync_single_for_cpu|device`)이 방향에 맞춰 대신 해주고,\n**일관 매핑** `dma_alloc_coherent()` 는 아예 논캐시 메모리를 준다. 작고 자주 접근하면\ncoherent, 크고 한 번에 처리하면 streaming. (SSD 펌웨어의 DMA 완료 인터럽트 경험을\n이 어휘로 번역해 말하면 \"임베디드 Linux 경험이 얕다\"는 갭을 그대로 덮을 수 있다.)\n\n---\n\n## 6. 프레임 지터/누락 측정\n\n타임스탬프 배열만 받는 **순수 함수**로 만든다(카메라도 커널도 없이 단위 테스트 가능).\n\n```c\nk = (gap + nominal/2) / nominal;   // 반올림!\nif (k > 1) missed += k - 1;        // k개 주기 = k-1개 누락\n```\n\n**반올림이 핵심**이다. 절단(`gap / nominal`)을 쓰면 14ms 간격(정상 지터 범위)이\n누락 0으로, 19.9ms가 누락 0으로 잡혀 통계가 망가진다. 반올림하면 \"가장 가까운\n주기 배수\"로 해석되어 ±40% 지터에도 오판하지 않는다.\n\n같이 뽑을 값: `max_gap`(최악 지연), `min_gap`, `max_jitter = max|gap−nominal|`, 그리고\n**`nonmonotonic`(시계 역행 횟수)**. 마지막 게 중요하다 — 필드에서는 NTP 점프나\nsuspend/resume으로 타임스탬프가 거꾸로 가고, 이걸 누락과 뒤섞으면 \"밤마다 프레임\n5000개 누락\" 같은 유령 버그 리포트가 나온다. 그래서 실시간 측정은 항상\n`CLOCK_MONOTONIC`이고 절대 `CLOCK_REALTIME`이 아니다.\n\n---\n\n## 7. 흔한 함정 (인터뷰 감점 포인트)\n\n- **락으로 프레임 전체를 감싸기** — 락 안에서 memcpy 하는 순간 실시간성이 죽는다. 락은 인덱스만.\n- **reader가 든 버퍼를 writer가 뺏기** — 그게 정확히 tearing이다. 장부에 reader_idx가 있는 이유.\n- **drop을 조용히 하기** — 카운터 없이 버리면 필드에서 절대 못 잡는다. 반드시 텔레메트리로.\n- **starve-drop과 덮어쓰기 drop을 한 카운터에 합치기** — 원인 진단 불가.\n- **`volatile`로 해결하려 하기** — 최적화 억제일 뿐 원자성도 순서도 없다. 스레드 간에는 `_Atomic`.\n- **seqlock**: reader 재시도 상한 없음(무한 루프) / 페이로드가 일반 변수(UB+TSan) / 페이로드에 포인터(즉사).\n- **평균 누적을 int32로** — 오버플로. 반올림을 0쪽 절단으로 — 음수 편향.\n- **DMA 버퍼 캐시 유지 누락 / 캐시 라인 정렬 안 맞음** — 재현 안 되는 손상.\n- **테스트를 \"읽힌 프레임 수 == N\"으로 단정** — 플래키하다. 대신 불변식 `read + dropped + leftover + inflight == produced`.\n\n---\n\n## 8. 면접에서 말할 것 (한국어 + 영어)\n\n### 설계 선언 (코딩 시작 전 30초)\n- KO: \"락으로 데이터를 보호하지 않고 **버퍼 소유권**을 보호하겠습니다. 임계구역은\n  인덱스 세 개를 바꾸는 것뿐이고, 프레임 복사는 락 밖에서 합니다.\"\n- EN: **\"I protect ownership, not the data. The critical section only swaps three\n  indices — the frame bytes are written and read outside the lock.\"**\n\n### 왜 블로킹하지 않는가\n- KO: \"생산자는 센서 타이밍에 묶여 있어서 소비자를 기다릴 수 없습니다. 그래서\n  `write_begin`은 항상 성공하고, 대신 가장 오래된 프레임을 버리고 카운트합니다.\"\n- EN: \"The producer is bound to sensor timing, so it can never wait on the consumer.\n  `write_begin` always succeeds; if nothing is free I sacrifice the oldest frame\n  and increment a drop counter.\"\n\n### drop은 반드시 관측 가능하게\n- EN: **\"A dropped frame is fine. A silently dropped frame is a bug — I always\n  export it as a counter so the fleet telemetry shows it.\"**\n\n### 더블 vs 트리플 trade-off\n- KO: \"버퍼를 하나 더 두면 writer가 굶는 경우가 사라집니다. 대가는 메모리 50%\n  증가고, 지연은 최대 한 프레임 늘어납니다. RAM 예산에 따라 고르겠습니다.\"\n- EN: \"A third buffer removes the case where the writer has nowhere to write. The\n  price is 50% more memory and up to one extra frame of latency — with 1080p RGB\n  that's 6MB versus 9MB, so on a constrained gateway it's a real decision.\"\n\n### tearing을 어떻게 테스트하나\n- EN: **\"I make the payload self-describing — every byte is derived from the\n  sequence number — so a torn frame is detectable by inspection. Then I assert an\n  invariant instead of a count: frames read plus frames dropped plus what's still\n  in flight must equal frames produced. That test can't be flaky.\"**\n\n### seqlock을 언제 쓰나\n- EN: \"For a small POD snapshot that's read far more often than it's written, I'd\n  use a seqlock so the writer never blocks. It needs a single writer and no\n  pointers in the payload, and the reader must have a retry bound. If either\n  condition fails, I use a mutex — it's simpler and always correct.\"\n\n### ISR / DMA\n- EN: **\"In the completion ISR I only swap indices — no copying, no parsing, no\n  locks. And on real hardware I'd invalidate the cache before the CPU reads a\n  DMA-filled buffer and clean it before the DMA reads a CPU-filled one, with the\n  buffers aligned to a cache line.\"**\n\n### 모를 때\n- EN: \"I haven't wired that specific Linux DMA API in production. The equivalent\n  problem in my SSD firmware work was the NAND DMA completion path — here's how\n  I'd reason about it, and I'd verify the exact `dma_map_single` semantics against\n  the kernel docs before committing.\"\n\n---\n\n## 9. 체크리스트\n\n- [ ] 소유권 4상태(WRITER/READY/READER/FREE) 전이를 손으로 그려 설명할 수 있다\n- [ ] `write_begin`이 블로킹하지 않는 이유 + reader 버퍼를 안 뺏는 이유(tearing)를 말한다\n- [ ] `nbuf`만 3으로 바꿔 트리플이 되게 짜고, 메모리 +50% / 지연 +1프레임을 정당화한다\n- [ ] starve-drop과 덮어쓰기 drop을 분리해 세고, 트리플이 없애는 건 전자뿐임을 안다\n- [ ] 회계 불변식 `read + dropped + leftover + inflight == produced` 를 즉시 쓴다\n- [ ] tearing 검출용 self-describing 페이로드를 설계하고, 카운트가 아닌 불변식으로 단정한다\n- [ ] mutex 슬롯과 seqlock을 둘 다 5분 안에 짜고, 3대 제약(단일 writer/POD/재시도 상한)을 말한다\n- [ ] seqlock 페이로드에 relaxed atomic을 쓰는 이유(UB + TSan)를 설명할 수 있다\n- [ ] latest vs mean 데시메이션을 신호 종류로 나눠 정당화한다 (int64 누적 + 반올림 방향)\n- [ ] ISR 금지 3가지 + DMA 캐시 invalidate/clean 방향 + `dma_alloc_coherent` vs `dma_map_single`\n- [ ] 지터/누락에 반올림을 쓰는 이유와 `CLOCK_MONOTONIC`을 쓰는 이유를 말한다\n- [ ] TSan을 CI에 넣겠다고 먼저 말한다\n", "problems": [{"num": 31, "slug": "mb_write_begin", "title_ko": "더블 버퍼 소유권 모델 (write_begin)", "title_en": "Double-buffer ownership model (write_begin)", "difficulty": "medium", "tags": ["double-buffer", "ownership", "non-blocking", "drop-policy"], "prompt_ko": "버퍼 풀을 초기화하고(mb_init: nbuf를 [2,MAXBUF]로 클램프, 세 인덱스 -1, mutex 초기화), writer가 채울 FREE 버퍼를 확보하는 mb_write_begin을 구현하라. FREE = ready_idx도 reader_idx도 아닌 인덱스. 절대 블로킹하지 않고 항상 성공해야 한다 — FREE가 없으면 READY를 희생하고 dropped++/starved++. reader가 든 버퍼는 절대 뺏지 않는다(그게 tearing이다).", "prompt_en": "Initialize the buffer pool and implement a non-blocking write_begin that hands the writer a free buffer. If none is free, sacrifice the READY buffer and count the drop; never take the buffer the reader owns.", "signature": "void mb_init(MBuf *mb, int nbuf); Frame *mb_write_begin(MBuf *mb)", "examples": [{"in": "mb_init(&mb,2); write_begin()", "out": "&buf[0], write_idx=0"}, {"in": "nbuf=2, ready_idx=0, reader_idx=1 상태에서 write_begin()", "out": "&buf[0], starved=1, dropped+1, ready_idx=-1"}], "hints": ["버퍼 하나는 언제나 WRITER 소유 / READY / READER 소유 / FREE 중 하나다. 인덱스 3개가 곧 소유권 장부.", "FREE 탐색은 0..nbuf-1 을 돌며 ready_idx도 reader_idx도 아닌 첫 인덱스를 고르면 된다.", "못 찾았다면 reader 1 + READY 1 로 꽉 찬 경우뿐이다 → idx = ready_idx; ready_idx = -1; dropped++; starved++."], "solution": "void mb_init(MBuf *mb, int nbuf)\n{\n    if (!mb) return;\n    memset(mb, 0, sizeof *mb);\n    if (nbuf \u003c 2)      nbuf = 2;        // 2 미만은 소유권 모델이 성립하지 않는다\n    if (nbuf > MAXBUF) nbuf = MAXBUF;\n    mb->nbuf       = nbuf;\n    mb->write_idx  = -1;\n    mb->ready_idx  = -1;\n    mb->reader_idx = -1;\n    pthread_mutex_init(&mb->m, NULL);\n}\n\nvoid mb_destroy(MBuf *mb)\n{\n    if (!mb) return;\n    pthread_mutex_destroy(&mb->m);\n}\n\nFrame *mb_write_begin(MBuf *mb)\n{\n    if (!mb) return NULL;\n    pthread_mutex_lock(&mb->m);\n    int idx = -1;\n    for (int i = 0; i \u003c mb->nbuf; i++) {          // 아무도 소유하지 않은 버퍼 찾기\n        if (i != mb->ready_idx && i != mb->reader_idx) { idx = i; break; }\n    }\n    if (idx \u003c 0) {\n        // nbuf>=2 이면 여기 도달했다는 건 reader 1 + READY 1 로 꽉 찬 경우뿐이다.\n        // → READY를 희생한다. (reader 버퍼를 뺏으면 tearing)\n        idx = mb->ready_idx;\n        mb->ready_idx = -1;\n        mb->dropped++;\n        mb->starved++;\n    }\n    mb->write_idx = idx;\n    pthread_mutex_unlock(&mb->m);\n    return &mb->buf[idx];                          // 데이터 write는 락 '밖'에서\n}", "explanation_ko": "실시간 생산자(센서/DMA 완료 콜백)는 소비자를 기다릴 수 없으므로 write_begin은 반드시 성공해야 한다. 그래서 '빈 버퍼가 없으면 블록'이 아니라 '가장 오래된 READY를 버린다'가 정책이 된다. reader가 대여 중인 버퍼만은 예외 — 거기에 쓰면 소비자가 반쯤 갱신된 프레임을 보게 되고 그게 tearing이다. 임계구역 안에서 하는 일은 int 대입 몇 줄이고, 실제 프레임 바이트는 반환된 포인터에 락 밖에서 쓴다.", "complexity": "O(nbuf) time (nbuf\u003c=3 이므로 사실상 O(1)), O(nbuf * FRAME_LEN) space", "pitfalls": ["락 안에서 프레임을 memcpy → 임계구역이 수 마이크로초로 늘어나 실시간성이 죽는다.", "빈 버퍼가 없을 때 reader_idx 버퍼를 골라버림 → tearing.", "drop을 조용히 처리(카운터 없음) → 필드에서 절대 진단 못 한다.", "nbuf\u003c2 를 허용 → 소유권 모델이 성립하지 않고 인덱스가 -1로 새어나간다."], "verkada_context": "GC31-E 게이트웨이의 링크 통계 스냅샷, MT81 트레일러 카메라 프레임처럼 '최신값만 의미 있는' 데이터의 생산 측 표준 패턴."}, {"num": 32, "slug": "mb_commit_acquire_release", "title_ko": "소유권 이전 (commit / acquire / release)", "title_en": "Ownership transfer (commit / acquire / release)", "difficulty": "medium", "tags": ["double-buffer", "publish", "non-blocking-read", "mutex"], "prompt_ko": "write_commit은 writer 소유 버퍼를 READY로 publish한다(직전 READY가 아직 안 읽혔으면 dropped++). read_acquire는 READY를 reader 소유로 옮기고 Frame*를 주되, READY가 없거나 reader가 이미 하나를 들고 있으면 NULL(논블로킹). read_release는 reader_idx를 -1로 되돌린다. 세 함수 모두 임계구역 안에서는 인덱스 대입만 한다.", "prompt_en": "Publish the writer's buffer as READY, lend the READY buffer to the reader (NULL when nothing new or one is already lent out), and return it to the free pool. Each critical section is just a few integer assignments.", "signature": "void mb_write_commit(MBuf *mb); Frame *mb_read_acquire(MBuf *mb); void mb_read_release(MBuf *mb)", "examples": [{"in": "commit 후 acquire", "out": "&buf[ready], ready_idx=-1, reader_idx=그 인덱스"}, {"in": "reader가 이미 대여 중일 때 acquire", "out": "NULL (블로킹하지 않음)"}], "hints": ["commit은 '데이터를 옮기는' 게 아니라 write_idx를 ready_idx로 '이름만 바꾸는' 것이다.", "acquire 조건은 두 개다: reader_idx \u003c 0 (아직 대여 안 함) 그리고 ready_idx >= 0 (새 프레임 있음).", "commit에서 ready_idx가 이미 >=0 이면 그 프레임은 아무도 못 본 채 버려지는 것 → dropped++."], "solution": "void mb_write_commit(MBuf *mb)\n{\n    if (!mb) return;\n    pthread_mutex_lock(&mb->m);\n    if (mb->write_idx >= 0) {\n        if (mb->ready_idx >= 0)\n            mb->dropped++;                         // 소비 전에 더 새 프레임이 나옴\n        mb->ready_idx = mb->write_idx;             // publish\n        mb->write_idx = -1;\n    }\n    pthread_mutex_unlock(&mb->m);\n}\n\nFrame *mb_read_acquire(MBuf *mb)\n{\n    if (!mb) return NULL;\n    Frame *f = NULL;\n    pthread_mutex_lock(&mb->m);\n    if (mb->reader_idx \u003c 0 && mb->ready_idx >= 0) {\n        mb->reader_idx = mb->ready_idx;            // READY를 reader 소유로 이전\n        mb->ready_idx  = -1;\n        f = &mb->buf[mb->reader_idx];\n    }\n    pthread_mutex_unlock(&mb->m);\n    return f;\n}\n\nvoid mb_read_release(MBuf *mb)\n{\n    if (!mb) return;\n    pthread_mutex_lock(&mb->m);\n    mb->reader_idx = -1;                           // 다시 FREE\n    pthread_mutex_unlock(&mb->m);\n}", "explanation_ko": "세 함수가 하는 일은 소유권 라벨을 옮기는 것뿐이다: WRITER→READY(commit), READY→READER(acquire), READER→FREE(release). 복사가 한 번도 일어나지 않기 때문에 프레임이 6MB여도 임계구역 비용은 동일하다. acquire가 NULL을 돌려주는 논블로킹 설계라 소비자도 자기 루프 주기를 지킬 수 있다(실전에서는 NULL일 때 condvar로 대기하면 폴링을 없앨 수 있다). commit에서의 dropped++는 '소비자가 느려서 프레임이 낡았다'는 신호로, write_begin의 starved와는 원인이 다르다.", "complexity": "세 함수 모두 O(1) time, O(1) space", "pitfalls": ["acquire에서 reader_idx 검사 누락 → 같은 reader가 두 버퍼를 들고 있다고 장부가 착각한다.", "acquire 후 ready_idx를 -1로 안 비움 → writer가 reader 버퍼를 FREE로 오인.", "commit에서 덮어쓴 READY를 dropped에 안 넣음 → 회계 불변식이 깨진다.", "acquire를 블로킹으로 만듦 → 소비자 루프 주기가 생산자에 묶인다."], "verkada_context": "카메라/센서 스레드가 프레임을 publish하고 업로드 스레드가 '있으면 가져가고 없으면 다른 일'을 하는 게이트웨이 파이프라인 구조."}, {"num": 33, "slug": "tearing_and_invariant", "title_ko": "tearing 검출 테스트와 회계 불변식", "title_en": "Tearing detection test and the accounting invariant", "difficulty": "medium", "tags": ["testing", "tearing", "invariant", "threads"], "prompt_ko": "tearing(절반만 갱신된 프레임)을 검출할 수 있게 프레임을 self-describing으로 만들어라: frame_fill은 seq를 넣고 data 전 바이트를 (seq & 0xFF)로 채운다. frame_is_torn은 한 바이트라도 다르면 true(NULL도 true). 그리고 정지 상태에서 consumed + dropped + leftover(READY 1개) + inflight(WRITER 1개) == produced 를 검사하는 mb_accounting_ok를 구현하라.", "prompt_en": "Make the payload self-describing so a torn frame is detectable, and assert the accounting invariant — every produced frame was either read, dropped, or is still held.", "signature": "void frame_fill(Frame *f, unsigned seq); bool frame_is_torn(const Frame *f); bool mb_accounting_ok(const MBuf *mb, unsigned long produced, unsigned long consumed)", "examples": [{"in": "frame_fill(&f, 0x1234); frame_is_torn(&f)", "out": "false"}, {"in": "f.data[64] ^= 0xFF; frame_is_torn(&f)", "out": "true"}, {"in": "produced=8000, read=360, dropped=7640, leftover=0", "out": "mb_accounting_ok -> true"}], "hints": ["테스트가 tearing을 '볼 수 있게' 하려면 페이로드가 자기 자신을 설명해야 한다 — seq에서 유도한 패턴으로 전체를 채운다.", "스레드 테스트에서 '읽힌 프레임 수 == N' 같은 단정은 스케줄링에 의존해 플래키하다. 대신 불변식을 단정한다.", "불변식: consumed + dropped + leftover + inflight == produced. leftover는 ready_idx>=0, inflight는 write_idx>=0 일 때 각각 1."], "solution": "void frame_fill(Frame *f, unsigned seq)\n{\n    if (!f) return;\n    f->seq = seq;\n    memset(f->data, (int)(seq & 0xFFu), FRAME_LEN); // 전 바이트를 같은 패턴으로\n}\n\nbool frame_is_torn(const Frame *f)\n{\n    if (!f) return true;                            // NULL은 안전하게 \"찢어짐\" 취급\n    unsigned char expect = (unsigned char)(f->seq & 0xFFu);\n    for (int i = 0; i \u003c FRAME_LEN; i++)\n        if (f->data[i] != expect) return true;\n    return false;\n}\n\nbool mb_accounting_ok(const MBuf *mb, unsigned long produced, unsigned long consumed)\n{\n    if (!mb) return false;\n    unsigned long leftover = (mb->ready_idx >= 0) ? 1UL : 0UL;\n    unsigned long inflight = (mb->write_idx  >= 0) ? 1UL : 0UL;\n    return consumed + mb->dropped + leftover + inflight == produced;\n}", "explanation_ko": "동시성 테스트의 핵심은 '결정적으로 참인 명제'를 고르는 것이다. 몇 프레임이 읽혔는지는 OS 스케줄러가 정하므로 단정하면 안 되지만, '생산된 모든 프레임은 읽혔거나 버려졌거나 아직 남아있다'는 스케줄과 무관하게 항상 참이다. tearing 검출은 페이로드를 seq에서 유도해 채우면 O(len) 스캔만으로 가능하다 — 두 세대가 섞이면 반드시 패턴이 깨진다. 이 두 장치 덕에 CI에서 수천 번 돌려도 플래키하지 않다.", "complexity": "frame_fill/frame_is_torn O(FRAME_LEN), mb_accounting_ok O(1)", "pitfalls": ["읽힌 프레임 수를 상수와 비교 → 플래키한 테스트.", "leftover(마지막 READY)와 inflight를 회계에서 빼먹음 → 정상인데 불변식 실패.", "mb_accounting_ok를 스레드가 살아있는 동안 락 없이 호출 → 일관성 없는 장부를 읽는다.", "페이로드를 0으로만 채우면 tearing이 검출되지 않는다(두 세대가 섞여도 같은 값)."], "verkada_context": "200만 대 fleet에서는 '조용한 프레임 손실'이 최악이다. drop 카운터와 회계 불변식이 곧 현장 디버깅 수단이 된다."}, {"num": 34, "slug": "triple_buffer", "title_ko": "트리플 버퍼로 확장 (writer가 굶지 않음)", "title_en": "Extend to triple buffering (the writer never starves)", "difficulty": "medium", "tags": ["triple-buffer", "trade-off", "memory", "latency"], "prompt_ko": "mb_init(&mb, 3)만으로 트리플 버퍼가 되도록 write_begin이 nbuf를 제대로 쓰게 하라. 그리고 테스트로 보여라: reader가 1개 + READY가 1개여도 세 번째 버퍼가 FREE로 남으므로 starved == 0 이다. 대가(메모리 +50%, 지연 최대 +1프레임)와 여전히 남는 drop(덮어쓰기 drop)을 설명하라.", "prompt_en": "Make the same code triple-buffered by passing nbuf=3, and show with a test that the writer never has to steal the READY buffer. Explain the memory/latency cost and which drops remain.", "signature": "mb_init(&mb, 3)  /* 나머지 API 동일 */", "examples": [{"in": "nbuf=3, reader_idx=0, ready_idx=1 에서 write_begin()", "out": "&buf[2], starved=0"}, {"in": "8000프레임 생산자/소비자 스레드 (nbuf=3)", "out": "starved == 0 (항상)"}], "hints": ["새 함수는 없다 — write_begin의 탐색 루프가 하드코딩된 2가 아니라 mb->nbuf를 쓰고 있으면 끝이다.", "왜 3인가: 동시에 소유될 수 있는 최대 개수가 READER 1 + READY 1 + WRITER 1 = 3 이다.", "트리플이어도 commit에서 '안 읽힌 READY를 덮는 drop'은 남는다. starved(빈 버퍼 없음)와 카운터를 나눠 두면 원인 진단이 된다."], "solution": "/* 구현 변경 없음: mb_write_begin 의 탐색 루프가 mb->nbuf 를 쓰기 때문에\n * mb_init(&mb, 3) 한 줄로 트리플 버퍼가 된다. 결정적 시나리오: */\nMBuf t1 = {0};\nmb_init(&t1, 3);\nmb_write_begin(&t1); mb_write_commit(&t1);   /* ready = 0        */\nFrame *tr = mb_read_acquire(&t1);            /* reader = 0       */\nmb_write_begin(&t1); mb_write_commit(&t1);   /* ready = 1        */\nFrame *tw = mb_write_begin(&t1);             /* FREE = 2 가 남는다 */\nassert(tw == &t1.buf[2]);\nassert(t1.starved == 0);   /* writer 는 굶지 않는다 */\nassert(tr == &t1.buf[0]); /* reader 가 든 버퍼는 안전 */", "explanation_ko": "더블 버퍼의 구조적 약점은 'READER 1 + READY 1'이면 writer가 쓸 곳이 없다는 것이다. 버퍼를 하나 더 두면 세 역할이 동시에 성립해 writer는 절대 굶지 않는다. 대가는 메모리 +50%(1080p RGB면 ~6MB → ~9MB)와 지연 최대 +1프레임이다. 중요한 건 '트리플이 drop을 0으로 만든다'는 오해를 하지 않는 것 — 소비자가 느리면 여전히 최신 프레임이 이전 READY를 덮는다. 사라지는 건 starve-drop뿐이고, 그래서 두 카운터를 분리해야 '생산이 빠른 것'인지 '소비가 느린 것'인지 텔레메트리만 보고 안다.", "complexity": "시간 동일, 공간 3 * sizeof(Frame) (더블 대비 +50%)", "pitfalls": ["탐색 루프에 버퍼 개수를 하드코딩 → 확장 불가한 설계.", "'트리플이면 프레임을 안 버린다'고 말하기 → 덮어쓰기 drop은 그대로 남는다.", "메모리 trade-off를 말하지 않고 무조건 트리플 추천 → 임베디드 감각 없음으로 보인다.", "N을 4, 5로 늘려 지연만 키우기 — 소유자가 3종류뿐이라 4번째 버퍼는 지연만 늘린다."], "verkada_context": "RAM이 넉넉한 Linux 게이트웨이 영상 경로는 트리플, RAM이 빠듯한 MCU/FreeRTOS 급 공기질 센서(SV)는 더블 — 같은 코드에 nbuf만 다르게 준다."}, {"num": 35, "slug": "latest_value_slot", "title_ko": "latest-value 슬롯: mutex vs seqlock", "title_en": "Latest-value slot: mutex vs seqlock", "difficulty": "hard", "tags": ["seqlock", "atomics", "memory-order", "latest-value", "mutex"], "prompt_ko": "최신값 하나(링크 통계 스냅샷)를 공유하는 두 구현을 만들어라. (A) mutex 버전 lv_store/lv_load. (B) seqlock 버전 sl_store/sl_load: writer는 seq를 홀수로 올리고 페이로드를 쓰고 짝수로 복귀하며 절대 막히지 않는다. reader는 앞뒤 seq가 같고 짝수일 때만 채택하고 아니면 재시도(상한 SL_MAX_RETRY 필수). 페이로드는 _Atomic + relaxed + fence 로 두어 data race(UB)와 TSan 경고를 피한다. 언제 무엇을 쓸지 설명하라.", "prompt_en": "Publish a single latest value two ways: with a mutex, and with a seqlock whose writer never blocks and whose reader retries a bounded number of times. Say when each one is the right choice.", "signature": "void lv_store(LvMutex*, LinkSample); bool lv_load(LvMutex*, LinkSample*); void sl_store(SeqSlot*, LinkSample); bool sl_load(const SeqSlot*, LinkSample*)", "examples": [{"in": "sl_store(s); sl_load(&out)", "out": "true, out == s, sl_seq() 는 짝수"}, {"in": "writer 20000회 / reader 20000회 동시 실행", "out": "찢어진 값 0건 (체크섬 불일치 0)"}], "hints": ["seqlock 프로토콜: writer는 seq+1(홀수 = 쓰는 중) → 데이터 → seq+2(짝수 = 안정). reader는 s1이 홀수면 재시도.", "reader는 데이터를 먼저 tmp로 읽고, acquire fence 후 seq를 다시 읽어 s1과 같을 때만 채택한다.", "페이로드를 일반 변수로 두면 C 표준상 data race(UB)이고 TSan이 경고한다. _Atomic + memory_order_relaxed 로 읽고 쓰고, 앞뒤를 release/acquire fence로 감싼다. 그리고 reader 루프에는 반드시 재시도 상한을 둔다."], "solution": "bool sample_consistent(const LinkSample *s)\n{\n    if (!s) return false;\n    return s->check == sample_check(s->ts_us, s->rssi_dbm);\n}\n\nvoid lv_init(LvMutex *lv)\n{\n    if (!lv) return;\n    memset(lv, 0, sizeof *lv);\n    pthread_mutex_init(&lv->m, NULL);\n}\n\nvoid lv_destroy(LvMutex *lv)\n{\n    if (!lv) return;\n    pthread_mutex_destroy(&lv->m);\n}\n\nvoid lv_store(LvMutex *lv, LinkSample s)\n{\n    if (!lv) return;\n    pthread_mutex_lock(&lv->m);\n    lv->v     = s;\n    lv->valid = true;\n    pthread_mutex_unlock(&lv->m);\n}\n\nbool lv_load(LvMutex *lv, LinkSample *out)\n{\n    if (!lv || !out) return false;\n    bool ok;\n    pthread_mutex_lock(&lv->m);\n    ok = lv->valid;\n    if (ok) *out = lv->v;\n    pthread_mutex_unlock(&lv->m);\n    return ok;\n}\n\nvoid sl_init(SeqSlot *sl)\n{\n    if (!sl) return;\n    atomic_init(&sl->seq, 0u);\n    atomic_init(&sl->ts_us, (uint64_t)0);\n    atomic_init(&sl->rssi_dbm, (int32_t)0);\n    atomic_init(&sl->check, sample_check(0, 0));\n}\n\nvoid sl_store(SeqSlot *sl, LinkSample s)\n{\n    if (!sl) return;\n    unsigned s0 = atomic_load_explicit(&sl->seq, memory_order_relaxed);\n    atomic_store_explicit(&sl->seq, s0 + 1u, memory_order_relaxed);   // 홀수 진입\n    atomic_thread_fence(memory_order_release);\n    atomic_store_explicit(&sl->ts_us,    s.ts_us,    memory_order_relaxed);\n    atomic_store_explicit(&sl->rssi_dbm, s.rssi_dbm, memory_order_relaxed);\n    atomic_store_explicit(&sl->check,    s.check,    memory_order_relaxed);\n    atomic_thread_fence(memory_order_release);\n    atomic_store_explicit(&sl->seq, s0 + 2u, memory_order_release);   // 짝수 복귀\n}\n\nbool sl_load(const SeqSlot *sl, LinkSample *out)\n{\n    if (!sl || !out) return false;\n    for (int try_i = 0; try_i \u003c SL_MAX_RETRY; try_i++) {\n        unsigned s1 = atomic_load_explicit(&sl->seq, memory_order_acquire);\n        if (s1 & 1u) continue;                       // writer가 쓰는 중\n        LinkSample tmp;\n        tmp.ts_us    = atomic_load_explicit(&sl->ts_us,    memory_order_relaxed);\n        tmp.rssi_dbm = atomic_load_explicit(&sl->rssi_dbm, memory_order_relaxed);\n        tmp.check    = atomic_load_explicit(&sl->check,    memory_order_relaxed);\n        atomic_thread_fence(memory_order_acquire);\n        unsigned s2 = atomic_load_explicit(&sl->seq, memory_order_relaxed);\n        if (s1 == s2) { *out = tmp; return true; }   // 읽는 동안 안 바뀜 → 채택\n    }\n    return false;                                     // 재시도 상한 초과\n}\n\nunsigned sl_seq(const SeqSlot *sl)\n{\n    if (!sl) return 0u;\n    return atomic_load_explicit(&sl->seq, memory_order_acquire);\n}", "explanation_ko": "mutex 버전은 단순하고 언제나 옳지만 writer가 reader에 막힐 수 있고 우선순위 역전 여지가 있다. seqlock은 writer가 구조적으로 막히지 않아 실시간 생산 경로에 맞는다 — 대신 writer가 하나여야 하고, 페이로드는 포인터 없는 POD여야 하며(찢어진 포인터를 역참조하면 재시도할 기회조차 없다), writer가 폭주하면 reader가 굶을 수 있으니 재시도 상한이 필수다. 선택 기준은 '읽기가 쓰기보다 훨씬 잦고 페이로드가 작은가'다. 페이로드를 relaxed atomic으로 두는 이유를 말할 수 있으면 memory model 이해도가 드러난다.", "complexity": "mutex: O(1) + 락 경합. seqlock: writer O(1) wait-free, reader O(재시도) — 무경합 시 O(1)", "pitfalls": ["reader 재시도 루프에 상한이 없음 → writer 폭주 시 무한 루프.", "seq 홀짝 검사를 빼먹음 → 쓰는 도중 값을 채택.", "데이터를 읽은 뒤 seq를 다시 안 읽음 → 찢어진 값이 그대로 새어나간다.", "페이로드를 일반 변수로 → data race(UB) + TSan 경고.", "페이로드에 포인터/가변 길이 포함 → seqlock으로 쓰면 안 되는 케이스.", "writer가 둘 이상 → seq 프로토콜이 깨진다(writer끼리는 별도 mutex 필요)."], "verkada_context": "GC31-E의 LTE RSSI/SIM 상태, 배터리 SoC 같은 작은 스냅샷을 여러 스레드(업로드·로컬 UI·BLE 프로비저닝)가 자주 읽는 상황 — 전형적인 읽기 多/쓰기 少."}, {"num": 36, "slug": "rate_decoupling", "title_ko": "레이트 디커플링 400Hz → 100Hz (최신값 vs 구간 평균)", "title_en": "Rate decoupling 400Hz -> 100Hz (take-latest vs block average)", "difficulty": "easy", "tags": ["decimation", "pure-function", "testability", "signal"], "prompt_ko": "400Hz 생산을 100Hz 소비로 줄이는 4:1 데시메이션을 순수 함수로 구현하라. rd_latest는 블록의 마지막 샘플, rd_mean은 블록 평균(int64 누적 + 0에서 먼 쪽 반올림). rd_decimate는 꽉 찬 블록만 처리하고(꼬리는 다음 호출로) out_cap을 넘지 않으며 출력 개수를 반환한다. 어느 정책이 어떤 데이터에 맞는지 설명하라.", "prompt_en": "Decimate a fast stream to a slower consumer rate as a pure function, with take-latest and block-average policies, and justify which signal each one fits.", "signature": "int32_t rd_latest(const int32_t *blk, int n); int32_t rd_mean(const int32_t *blk, int n); int rd_decimate(const int32_t *in, int n_in, int factor, RatePolicy pol, int32_t *out, int out_cap)", "examples": [{"in": "in={10,20,30,40,50,60,70,80}, factor=4, RD_LATEST", "out": "{40, 80} (반환 2)"}, {"in": "같은 입력, RD_MEAN", "out": "{25, 65} (반환 2)"}, {"in": "in={1000,-1000,1000,-1000}", "out": "mean=0, latest=-1000"}], "hints": ["순수 함수로 분리해야 하드웨어 없이 단위 테스트가 된다 — 메일의 'modular, testable embedded software' 항목이 이것이다.", "합계는 int64_t로 누적한다. int32 샘플 수천 개면 넘친다.", "C의 정수 나눗셈은 0쪽 절단이라 음수에서 편향된다. 0에서 먼 쪽 반올림: num>=0 이면 (num+den/2)/den, 아니면 (num-den/2)/den."], "solution": "static int32_t round_div(int64_t num, int64_t den)\n{\n    if (den \u003c= 0) return 0;\n    if (num >= 0) return (int32_t)((num + den / 2) / den);\n    return (int32_t)((num - den / 2) / den);\n}\n\nint32_t rd_latest(const int32_t *blk, int n)\n{\n    if (!blk || n \u003c= 0) return 0;\n    return blk[n - 1];\n}\n\nint32_t rd_mean(const int32_t *blk, int n)\n{\n    if (!blk || n \u003c= 0) return 0;\n    int64_t sum = 0;\n    for (int i = 0; i \u003c n; i++) sum += blk[i];       // int64 누적 → 오버플로 방지\n    return round_div(sum, n);\n}\n\nint rd_decimate(const int32_t *in, int n_in, int factor,\n                RatePolicy pol, int32_t *out, int out_cap)\n{\n    if (!in || !out || n_in \u003c= 0 || factor \u003c= 0 || out_cap \u003c= 0) return 0;\n    int nblocks = n_in / factor;\n    if (nblocks > out_cap) nblocks = out_cap;\n    for (int b = 0; b \u003c nblocks; b++) {\n        const int32_t *blk = in + (size_t)b * (size_t)factor;\n        out[b] = (pol == RD_MEAN) ? rd_mean(blk, factor) : rd_latest(blk, factor);\n    }\n    return nblocks;\n}", "explanation_ko": "정책 선택 기준은 한 문장이다: '이 신호는 순간값이 의미인가, 추세가 의미인가?' 링크 up/down, 도어 상태, 최신 GPS fix처럼 계단·이벤트성 신호에 평균을 쓰면 상태 전이가 뭉개져 사라진다. 반대로 RSSI·온도·전류·PM2.5처럼 노이즈 있는 연속 신호에 latest를 쓰면 무작위 한 점이 제어에 들어가고 에일리어싱이 생긴다. 평균은 노이즈를 억제하는 대신 지연이 블록의 절반만큼 늘어난다. 구현에서는 int64 누적과 반올림 방향, 그리고 꽉 찬 블록만 처리하는 스트리밍 친화적 계약이 실무 감각을 보여준다.", "complexity": "rd_latest O(1), rd_mean O(n), rd_decimate O(n_in)", "pitfalls": ["int32로 합계를 누적 → 오버플로.", "C 기본 나눗셈(0쪽 절단)을 그대로 써서 음수에서 편향.", "꼬리(불완전 블록)를 억지로 평균 → 가중치가 다른 샘플이 섞인다.", "out_cap 검사 누락 → 버퍼 오버런.", "계단 신호에 평균을 적용해 상태 전이를 지워버림."], "verkada_context": "공기질 센서(SV)의 고속 ADC 샘플을 저속 클라우드 리포팅으로 줄일 때, 그리고 LTE RSSI를 1초 단위 텔레메트리로 압축할 때 그대로 쓰는 계산."}, {"num": 37, "slug": "dma_ping_pong", "title_ko": "DMA ping-pong 시뮬레이션 (ISR은 인덱스 교환만)", "title_en": "DMA ping-pong simulation (the ISR only swaps indices)", "difficulty": "hard", "tags": ["dma", "isr", "ping-pong", "cache-coherency", "atomics"], "prompt_ko": "ping-pong DMA를 시뮬레이션하라. dma_pp_isr_complete는 ISR 컨텍스트이므로 active를 토글하고 방금 끝난 버퍼를 full에 싣는 '인덱스 교환'만 한다 — 데이터 복사·파싱·락 대기 금지. 직전 full을 앱이 못 가져갔으면 overrun++. dma_pp_take는 full을 -1로 교환하며 그 버퍼의 포인터를 준다(복사 없음). 실제 하드웨어의 캐시 invalidate/clean 이슈는 주석으로 설명하라.", "prompt_en": "Simulate ping-pong DMA: the completion ISR only toggles the active index and publishes the finished buffer; the app takes it by pointer, never by copy. Document the cache maintenance required on real hardware.", "signature": "void dma_pp_isr_complete(DmaPP *d); unsigned char *dma_pp_take(DmaPP *d, int *idx_out)", "examples": [{"in": "init; isr_complete()", "out": "active=1, take() -> buf[0]"}, {"in": "isr_complete() 두 번 연속 (앱이 안 가져감)", "out": "overrun=1, take() -> buf[1] (최신 우선)"}, {"in": "take(buf0) 후 isr_complete()", "out": "active=0 — DMA가 앱의 버퍼를 다시 쓰기 시작한다"}], "hints": ["ISR에서 금지: 데이터 복사, 파싱, malloc, printf, mutex 등 블로킹 API. 허용: 인덱스 교환, 카운터, 태스크 깨우기 시그널.", "full 을 atomic_exchange 로 다루면 '싣기'와 '직전 값 확인(overrun)'이 한 번에 원자적으로 끝난다.", "버퍼가 2개뿐이면 소비자의 데드라인은 전송 1주기다. 그 안에 처리가 안 끝나면 트리플 버퍼로 가야 한다."], "solution": "void dma_pp_init(DmaPP *d)\n{\n    if (!d) return;\n    memset(d, 0, sizeof *d);\n    d->active = 0;\n    atomic_init(&d->full, -1);\n    atomic_init(&d->overrun, 0UL);\n    atomic_init(&d->completes, 0UL);\n}\n\nvoid dma_pp_isr_complete(DmaPP *d)\n{\n    if (!d) return;\n    int done   = d->active;\n    d->active  = done ^ 1;                          // 다음 전송은 반대쪽 버퍼로\n    int prev   = atomic_exchange_explicit(&d->full, done, memory_order_acq_rel);\n    if (prev >= 0)                                  // 직전 것을 앱이 못 가져갔다\n        atomic_fetch_add_explicit(&d->overrun, 1UL, memory_order_relaxed);\n    atomic_fetch_add_explicit(&d->completes, 1UL, memory_order_relaxed);\n}\n\nunsigned char *dma_pp_take(DmaPP *d, int *idx_out)\n{\n    if (!d) return NULL;\n    int idx = atomic_exchange_explicit(&d->full, -1, memory_order_acq_rel);\n    if (idx \u003c 0) return NULL;\n    if (idx_out) *idx_out = idx;\n    return d->buf[idx];\n}\n\nint dma_pp_active(const DmaPP *d)\n{\n    return d ? d->active : -1;\n}\n\nunsigned long dma_pp_overrun(const DmaPP *d)\n{\n    return d ? atomic_load_explicit(&d->overrun, memory_order_relaxed) : 0UL;\n}", "explanation_ko": "ISR은 수 마이크로초 안에 끝나야 하고 블로킹 API는 호출조차 불가하므로, 완료 인터럽트가 할 일은 소유권 표시를 바꾸는 것뿐이다. 데이터는 이미 DMA가 DRAM에 써 놨으니 옮길 이유가 없다 — 포인터만 넘긴다. atomic_exchange로 full을 싣고 직전 값을 동시에 확인하면 overrun 판정이 별도 락 없이 원자적으로 끝난다. 버퍼가 2개뿐인 구조의 진짜 계약은 '소비자는 전송 1주기 안에 처리를 끝내야 한다'이고, 그걸 못 지키면 트리플 버퍼(Q34)로 가는 것이 정석이다.", "complexity": "isr_complete / take 모두 O(1), 락 없음 (atomic exchange 1회)", "pitfalls": ["ISR에서 memcpy/파싱 → 인터럽트 지연이 튀고 다음 전송을 놓친다.", "ISR에서 mutex/printf/malloc 호출 → 데드락 또는 즉사.", "overrun을 세지 않음 → 조용한 손실.", "DMA→CPU 전 cache invalidate 누락 → CPU가 캐시의 옛 데이터를 읽는다.", "CPU→DMA 전 cache clean/flush 누락 → DMA가 덜 쓰인 버퍼를 전송한다.", "버퍼가 캐시 라인 정렬/배수가 아님 → 인접 변수까지 무효화되어 재현 불가 손상."], "verkada_context": "SSD 펌웨어의 NAND DMA 완료 경로와 동일한 구조 — Don의 기존 경험을 Linux DMA API 어휘(dma_map_single / dma_alloc_coherent)로 번역해서 말하면 임베디드 Linux 갭을 덮는다."}, {"num": 38, "slug": "jitter_analyze", "title_ko": "프레임 지터/누락 측정 (순수 함수)", "title_en": "Frame jitter / drop measurement (pure function)", "difficulty": "easy", "tags": ["pure-function", "testability", "jitter", "monotonic-clock", "telemetry"], "prompt_ko": "타임스탬프 배열만 받아 통계를 내는 순수 함수 jitter_analyze를 구현하라. 각 간격 gap = ts[i]-ts[i-1] 에 대해 max_gap/min_gap, max_jitter = max|gap - nominal|, 그리고 k = round(gap/nominal) 로 k>1 이면 missed += k-1. 반올림하는 이유는 정상 범위 지터를 누락으로 오판하지 않기 위해서다. ts가 거꾸로 가면 nonmonotonic++ 로 따로 센다. n\u003c2 · NULL · nominal==0 은 전부 0 결과.", "prompt_en": "Pure function over a timestamp array: estimate missed frames by rounding each gap to the nearest multiple of the nominal period, and report max/min gap, max jitter, and non-monotonic timestamps. Guard every degenerate input.", "signature": "JitterStats jitter_analyze(const unsigned long *ts_us, int n, unsigned long nominal_us)", "examples": [{"in": "ts={0,10000,20000,30000}, nominal=10000", "out": "missed=0, max_jitter=0, n_gaps=3"}, {"in": "ts={0,10000,30000,40000}, nominal=10000", "out": "missed=1, max_gap=20000, max_jitter=10000"}, {"in": "ts={0,55000}, nominal=10000", "out": "missed=5 (5.5주기 → 반올림 6주기)"}], "hints": ["절단이 아니라 반올림: k = (gap + nominal/2) / nominal. 그래야 ±40% 지터를 누락으로 세지 않는다.", "k개 주기가 지났다는 건 그 사이 프레임 k-1개가 사라졌다는 뜻이다.", "nominal==0, n\u003c2, ts==NULL 을 먼저 막는다(0 나누기). 그리고 ts[i] \u003c ts[i-1] 은 누락이 아니라 시계 역행이므로 따로 센다."], "solution": "JitterStats jitter_analyze(const unsigned long *ts_us, int n, unsigned long nominal_us)\n{\n    JitterStats st;\n    memset(&st, 0, sizeof st);\n    if (!ts_us || n \u003c 2 || nominal_us == 0) return st;   // 안전한 0 결과\n\n    unsigned long min_gap = ULONG_MAX;\n    for (int i = 1; i \u003c n; i++) {\n        unsigned long gap;\n        if (ts_us[i] \u003c ts_us[i - 1]) {                   // 시계 역행 / 잘못된 입력\n            st.nonmonotonic++;\n            gap = 0;\n        } else {\n            gap = ts_us[i] - ts_us[i - 1];\n        }\n        st.n_gaps++;\n        if (gap > st.max_gap_us) st.max_gap_us = gap;\n        if (gap \u003c min_gap)       min_gap = gap;\n\n        unsigned long jit = (gap > nominal_us) ? gap - nominal_us : nominal_us - gap;\n        if (jit > st.max_jitter_us) st.max_jitter_us = jit;\n\n        // 간격을 nominal의 몇 배로 볼 것인가 — 반올림\n        unsigned long k = (gap + nominal_us / 2) / nominal_us;\n        if (k > 1) st.missed += k - 1;                   // k개 주기 = k-1개 누락\n    }\n    st.min_gap_us = (st.n_gaps > 0) ? min_gap : 0UL;\n    return st;\n}", "explanation_ko": "측정 로직을 순수 함수로 뽑아야 카메라도 커널도 없이 CI에서 단위 테스트가 된다 — 이게 '모듈성·테스트 가능성'을 코드로 보여주는 방법이다. 계산의 핵심은 반올림이다. 절단을 쓰면 19.9ms 간격(사실상 프레임 하나 누락 직전)이 누락 0으로, 14ms(정상 지터)도 0으로 잡혀 통계가 무의미해진다. 반올림하면 '가장 가까운 주기 배수'로 해석된다. nonmonotonic을 따로 세는 이유는 필드에서 NTP 점프나 suspend/resume으로 타임스탬프가 거꾸로 가기 때문이다. 그래서 실시간 측정은 항상 CLOCK_MONOTONIC을 쓴다.", "complexity": "O(n) time, O(1) space", "pitfalls": ["절단 나눗셈으로 누락 추정 → 정상 지터를 누락으로, 누락 직전을 정상으로 오판.", "nominal==0 / n\u003c2 / NULL 미검사 → 0 나누기 또는 크래시.", "시계 역행을 unsigned 뺄셈으로 처리 → 거대한 gap이 되어 누락 수만 개로 폭발.", "CLOCK_REALTIME 사용 → NTP 점프가 그대로 통계에 섞인다.", "측정 로직을 캡처 루프 안에 인라인 → 테스트 불가."], "verkada_context": "카메라 프레임 드랍률, GW31-E의 '오프라인 30분이면 자가 재부팅' 같은 헬스 판정, 게이트웨이 heartbeat 간격 감시가 모두 같은 계산이다."}]}, {"id": "linux_io", "order": 5, "range": "Q39-48", "icon": "🐧", "track": "core", "title_en": "Embedded Linux I/O & Event Loops", "title_ko": "임베디드 Linux I/O & 이벤트 루프", "summary_ko": "게이트웨이 연결 데몬을 이루는 POSIX I/O 부품 10개를 드릴한다. 부분 I/O·EINTR 루프(read_full/write_full), 논블로킹 fd 와 EAGAIN, poll() 이벤트 루프, self-pipe 로 깨우기, 스트림 라인 프레이밍, 지수 백오프+지터, monotonic deadline, write+fsync+rename 원자적 저장, 시그널 안전 종료, goto cleanup 으로 fd 누수 0. 코드는 macOS 에서도 도는 POSIX 만 쓰고, Linux 전용 epoll/timerfd/signalfd/netlink/systemd watchdog 은 노트에서 이론으로 다뤄 면접 대화에 대비한다.", "summary_en": "Ten drillable POSIX building blocks of a gateway connectivity daemon: partial-I/O and EINTR loops, non-blocking fds and EAGAIN, a poll() event loop, the self-pipe trick, stream line framing, exponential backoff with jitter, monotonic deadlines, crash-safe config saves, signal-safe shutdown, and leak-free error paths. Portable POSIX in code; Linux-specific epoll/timerfd/signalfd/netlink/systemd watchdog covered as theory in the notes.", "verkada_relevance_ko": "직함 자체가 Senior Embedded Linux Engineer (Connectivity) 다 — 이 세트는 '그 일을 실제로 해봤는가'를 가장 직접적으로 묻는 영역이고, Don 에게는 가장 약한 영역이라 우선순위가 높다. GC31-E 셀룰러 게이트웨이(LTE Cat12, 듀얼 SIM 자동 failover)와 GW31-E Wi-Fi 게이트웨이의 연결 데몬은 결국 모뎀 제어 채널·클라우드(Command) 소켓·재연결 타이머·종료 시그널을 한 poll 루프에서 돌리는 프로그램이다. 시스템 디자인 파트에서 '센서 데이터를 게이트웨이에서 클라우드까지' 같은 열린 문제가 나오면 스레드 모델(스레드 대신 fd), 버퍼링, 실패·재연결 정책(백오프+지터), 테스트 전략(모뎀을 pipe 로, 시계를 주입)으로 답해야 한다. 리크루터가 강조한 'modular, testable embedded software' 는 여기서 순수 함수 분리(백오프·라인 파서)와 의존성 주입으로 증명된다. 또 170개국 200만 대 fleet 규모는 thundering herd, 전원 손실 안전, fd 누수 같은 '오래 도는 데몬' 문제를 실제 요구사항으로 만든다.", "concepts": [{"term": "short read / short write", "ko": "read/write 는 요청한 바이트 수를 보장하지 않는다. 짧은 read 는 EOF 신호일 뿐 에러가 아니고, 짧은 write 는 루프로 마저 밀어야 한다.", "en": "read/write may transfer fewer bytes than requested; a short read signals EOF (not an error) and a short write must be looped."}, {"term": "EINTR", "ko": "시그널 때문에 시스템콜이 중단됐다는 뜻. 에러가 아니라 '다시 하라'는 신호다. SA_RESTART 를 끄면 poll 이 EINTR 로 즉시 깨어나 종료 플래그를 볼 수 있다.", "en": "A syscall interrupted by a signal — retry, don't fail. Without SA_RESTART, poll() returns EINTR so the loop can check its stop flag."}, {"term": "O_NONBLOCK / EAGAIN / EWOULDBLOCK", "ko": "O_NONBLOCK 은 파일 상태 플래그라 반드시 F_GETFL 로 읽어 OR 한 뒤 F_SETFL 해야 접근 모드가 날아가지 않는다(FD_CLOEXEC 는 F_GETFD/F_SETFD 로 다른 네임스페이스). 그 fd 에서 나는 EAGAIN 은 '지금은 데이터(공간)가 없다'는 정상 상태이므로 로그도 재연결도 하지 말고 루프로 복귀한다. 표준상 EWOULDBLOCK 과 같은 값이라는 보장이 없어 둘 다 검사한다.", "en": "O_NONBLOCK is a file status flag — set it with a read-modify-write F_GETFL/F_SETFL (FD_CLOEXEC lives in F_GETFD/F_SETFD). EAGAIN on such an fd means 'not ready right now', a normal condition; check EWOULDBLOCK too for portability."}, {"term": "poll vs epoll vs kqueue", "ko": "poll 은 POSIX 표준이고 매 호출 O(n)이라 fd 수십 개 규모(임베디드 데몬)에 최적. epoll 은 관심 집합이 커널에 상주해 fd 수천 개부터 이득(Linux 전용). kqueue 는 BSD/macOS 대응물. 트리거 모드: LT(기본)는 조건이 남아 있으면 계속 보고해 안전하고, ET(EPOLLET)는 변화 순간만 보고하므로 반드시 EAGAIN 까지 전부 읽어야 한다.", "en": "poll is portable and O(n) per call — ideal for a few dozen fds; epoll keeps the interest set in the kernel and wins at thousands of fds; kqueue is the BSD/macOS equivalent. Level-triggered keeps reporting while data remains; edge-triggered (EPOLLET) reports only transitions, so you must drain to EAGAIN."}, {"term": "self-pipe trick / eventfd", "ko": "깨우기를 fd 이벤트로 바꿔 poll 집합에 합류시키는 기법. write() 가 async-signal-safe 하므로 시그널 핸들러에서도 안전하다. Linux 에서는 eventfd 가 fd 1개로 같은 일을 한다.", "en": "Turn a wakeup into an fd event so it joins the poll set; write() is async-signal-safe, and Linux's eventfd does the same with a single fd."}, {"term": "async-signal-safe / volatile sig_atomic_t", "ko": "시그널 핸들러에서 호출 가능한 함수는 write/_exit/sigaction 등으로 제한된다(printf·malloc 금지 — 재진입 데드락). 핸들러가 건드릴 수 있는 전역은 volatile sig_atomic_t 플래그뿐이다.", "en": "Only a short list of functions (write, _exit, sigaction…) may be called from a handler; the only global it may touch is a volatile sig_atomic_t flag."}, {"term": "CLOCK_MONOTONIC deadline", "ko": "타임아웃은 절대 CLOCK_REALTIME 으로 재지 않는다 — NTP 가 시계를 되돌리면 타임아웃이 몇 시간 늘어난다. 절대 deadline 을 잡고 매 회전 남은 시간을 재계산해 poll 에 넘긴다.", "en": "Never measure timeouts with CLOCK_REALTIME (NTP can step it backwards); hold an absolute monotonic deadline and recompute the remaining time each iteration."}, {"term": "atomic file replace (write+fsync+rename)", "ko": "같은 디렉토리의 임시 파일에 쓰고 fsync → rename → 디렉토리 fsync. rename 만 POSIX 원자성을 가지므로 독자는 옛 파일 아니면 새 파일만 본다. 전원 손실 안전의 표준 레시피.", "en": "Write a temp file in the same directory, fsync it, rename (the only atomic step), then fsync the directory — the standard power-loss-safe recipe."}, {"term": "timerfd / signalfd / netlink (Linux)", "ko": "Linux 의 '모든 게 fd' 철학: 타이머 만료도, 시그널도, 링크 up/down(netlink)도, 파일 변경(inotify)도 fd 이벤트가 되어 같은 epoll/poll 루프에 합류한다. macOS 에는 없으므로 이론으로 알아둔다.", "en": "Linux turns timers, signals, link-state changes (netlink) and file changes (inotify) into fds so they all join the same poll/epoll loop."}, {"term": "systemd watchdog (sd_notify)", "ko": "Type=notify + WatchdogSec 유닛에서 데몬은 sd_notify(0,\"WATCHDOG=1\") 을 주기적으로 보내야 한다. 그래서 poll 타임아웃에 상한(cap)을 걸어 유휴 상태에서도 루프가 깨어나게 만든다.", "en": "With Type=notify and WatchdogSec, the daemon must ping sd_notify periodically — which is why the poll timeout needs an upper cap."}], "study_note_md": "# 🐧 임베디드 Linux I/O & 이벤트 루프 (Embedded Linux I/O & Event Loops) — Q39~48\n\n> 직함이 **Embedded Linux Engineer** 다. GC31-E/GW31-E 게이트웨이의 연결 데몬은\n> 결국 \"모뎀 제어 채널 + 클라우드 소켓 + 재연결 타이머 + 종료 시그널\"을 한 루프에서\n> 돌리는 프로그램이다. 여기가 Don 의 가장 약한 영역이므로 이 노트는 **드릴보다 교육**\n> 비중이 높다. 코드는 macOS 에서 돌도록 POSIX 로 쓰되, 면접에서 말해야 하는\n> **Linux 전용 API(epoll/timerfd/signalfd/systemd)는 아래 이론 절**에서 확실히 잡는다.\n\n---\n\n## 1. 핵심 아이디어 — 게이트웨이 데몬 = 하나의 이벤트 루프\n\n싱글 스레드 + 논블로킹 I/O + 하나의 `poll()`. 스레드를 늘리는 대신 **fd 를 늘린다.**\n락이 없으니 데드락도 없고, 상태가 한 스레드에 모여 있어 테스트하기 쉽다.\n\n```\n                         ┌──────────────── gateway daemon (single thread) ──────────────┐\n  modem /dev/ttyUSB2 ──▶ │ fd0  line-framing reader ──▶ AT 응답 파서                     │\n  cloud TCP socket   ──▶ │ fd1  frame reader        ──▶ Command 프로토콜                 │\n  self-pipe / eventfd──▶ │ fd2  wakeup (cancel, config-changed, 다른 스레드의 요청)       │\n  timerfd (Linux)    ──▶ │ fd3  주기 작업 (없으면 poll timeout 으로 대체)                 │\n                         │                                                              │\n                         │   for(;;) {                                                  │\n                         │     to = poll_timeout_from(next_deadline, WATCHDOG_CAP);     │\n                         │     n  = poll(fds, nfds, to);       ← 유일한 블로킹 지점       │\n                         │     if (n \u003c 0 && errno == EINTR) continue;   // 시그널        │\n                         │     if (g_stop) break;              // 종료 플래그            │\n                         │     if (n == 0) { on_timer(); kick_watchdog(); continue; }   │\n                         │     for each fd with revents: drain until EAGAIN;            │\n                         │   }                                                          │\n                         └──────────────────────────────────────────────────────────────┘\n                                          │\n                              backoff_delay_ms(attempt++) 로 재연결\n```\n\n**한 문장 요약**: 블로킹은 `poll()` 한 곳에서만 일어나고, 나머지는 전부 논블로킹이며,\n\"깨우고 싶으면\" self-pipe 에 1바이트를 쓴다.\n\n---\n\n## 2. 규칙 ① — 부분 I/O 와 EINTR (Q39, Q40)\n\n`read()`/`write()` 는 **요청한 만큼을 약속하지 않는다.**\n\n| 상황 | `read` 리턴 | 의미 | 해야 할 일 |\n|---|---|---|---|\n| 데이터 일부 도착 | `0 \u003c k \u003c n` | short read — **정상** | 남은 만큼 다시 읽거나, 누적 버퍼에 쌓기 |\n| 상대가 close | `0` | EOF | fd 를 poll 집합에서 제거, 재연결 |\n| 논블로킹, 데이터 없음 | `-1`, `EAGAIN`/`EWOULDBLOCK` | **정상** | 루프로 복귀 (에러 로그 금지) |\n| 시그널이 왔다 | `-1`, `EINTR` | 중단됨 | **재시도** |\n| 그 외 | `-1` | 진짜 에러 | 정리 후 보고 |\n\n```c\nssize_t read_full(int fd, void *buf, size_t n) {   // 블로킹 fd 용\n    unsigned char *p = buf; size_t got = 0;\n    while (got \u003c n) {\n        ssize_t k = read(fd, p + got, n - got);\n        if (k \u003c 0) { if (errno == EINTR) continue; return -1; }\n        if (k == 0) break;            // EOF → 짧게 리턴 (에러 아님!)\n        got += (size_t)k;\n    }\n    return (ssize_t)got;\n}\n```\n\n- **`write` 의 부분 쓰기가 더 위험하다.** 소켓/파이프 버퍼가 차면 `write` 는 쓸 수 있는\n  만큼만 쓰고 돌아온다. 루프를 안 돌면 프레임이 반쪽만 나가고, 상대는 영원히 다음\n  프레임을 기다린다 → \"가끔 클라우드 연결이 멈춘다\" 급 버그.\n- `-Wunused-result`: `write()` 리턴값 무시는 컴파일러가 경고한다. 이유가 있다.\n- **논블로킹 fd 에 `read_full` 을 쓰면 안 된다.** EAGAIN 에서 -1 이 되거나, 재시도하면\n  바쁜 대기가 된다. 논블로킹에는 \"EAGAIN 까지 읽고 루프로 복귀\"(`read_nb`)가 맞다.\n\n### O_NONBLOCK 설정의 함정\n\n```c\nfcntl(fd, F_SETFL, O_NONBLOCK);              // ❌ 나머지 플래그를 전부 날림\nint fl = fcntl(fd, F_GETFL, 0);\nfcntl(fd, F_SETFL, fl | O_NONBLOCK);         // ✅ read-modify-write\n```\n`O_NONBLOCK`(파일 상태 플래그, `F_GETFL`)과 `FD_CLOEXEC`(fd 플래그, `F_GETFD`)는\n**다른 네임스페이스**다. 헷갈리면 바로 티가 난다.\n\n> `EAGAIN` 과 `EWOULDBLOCK` 은 Linux/macOS 에서 같은 값이지만 표준은 같다고 보장하지\n> 않는다. `if (errno == EAGAIN || errno == EWOULDBLOCK)` 이 이식성 있는 관용구다.\n\n---\n\n## 3. 규칙 ② — poll vs epoll vs kqueue vs select (Q41)\n\n| | `select` | `poll` | `epoll` (Linux) | `kqueue` (BSD/macOS) |\n|---|---|---|---|---|\n| fd 개수 한계 | `FD_SETSIZE`(보통 1024) | 없음 | 없음 | 없음 |\n| 호출당 비용 | O(n) 복사 + O(n) 스캔 | O(n) 복사 + O(n) 스캔 | **O(활성 fd)** — 관심 집합이 커널에 상주 | O(활성 fd) |\n| 관심 집합 | 매번 재구축(호출이 파괴) | 매번 전달 | `epoll_ctl` 로 1회 등록 | `kevent` changelist |\n| 트리거 모드 | level | level | **level / edge(EPOLLET)** | level / edge |\n| 타임아웃 해상도 | µs (`timeval`) | **ms (int)** | ms (`epoll_wait`) / ns (`epoll_pwait2`) | ns (`timespec`) |\n| 이식성 | 어디나 | **POSIX — 어디나** | Linux 전용 | BSD/macOS 전용 |\n| 적합한 규모 | 레거시 | fd 수십 개 | fd 수천~수만 | 수천~수만 |\n\n**게이트웨이 데몬의 정답은 보통 `poll`** 이다 — fd 가 5~20개라 epoll 의 이점이 없고,\n코드가 짧고 이식성이 있다. epoll 은 fd 수백 개 이상, 즉 서버 쪽 이야기다.\n이 트레이드오프를 말할 수 있는 것 자체가 평가 항목(\"설계 결정의 정당화\")이다.\n\n### epoll 을 쓴다면 반드시 아는 것\n\n```c\nint ep = epoll_create1(EPOLL_CLOEXEC);\nstruct epoll_event ev = { .events = EPOLLIN, .data.fd = sock };\nepoll_ctl(ep, EPOLL_CTL_ADD, sock, &ev);\nint n = epoll_wait(ep, evs, MAXEV, timeout_ms);\n```\n- **Level-triggered(기본)**: 데이터가 남아 있으면 계속 보고. 한 번에 다 안 읽어도 안전.\n- **Edge-triggered(`EPOLLET`)**: 상태가 \"변할 때만\" 보고 → **반드시 논블로킹 + EAGAIN 이\n  날 때까지 전부 읽어야** 한다. 안 그러면 남은 데이터가 영원히 잠긴다. ET 의 이점은\n  동시 접속이 아주 많을 때의 wakeup 감소뿐 — 임베디드 데몬에서 ET 는 보통 과설계다.\n- `EPOLLONESHOT` 은 멀티스레드에서 한 fd 를 한 스레드만 처리하게 할 때.\n\n### poll 루프의 3대 버그\n\n1. **EOF fd 를 안 뺀다** → `POLLHUP` 이 매번 즉시 리턴 → CPU 100% 스핀.\n2. **`revents` 를 `events` 로만 검사한다** → `POLLHUP/POLLERR/POLLNVAL` 은 요청 안 해도\n   올라온다. 이 비트에서도 `read()` 를 해봐야 EOF/에러가 구분된다.\n3. **타임아웃을 재계산 안 한다** → EINTR 로 깰 때마다 타임아웃이 리셋되어 마감이 무한정\n   밀린다. 그래서 `deadline` 을 잡고 매 회전 `ms_remaining()` 을 다시 구한다.\n\n---\n\n## 4. 규칙 ③ — 루프를 깨우는 법 (Q42, Q47)\n\n이벤트 루프의 고전 문제: **poll 안에서 자고 있는데 \"지금 종료해\" 를 어떻게 전하나?**\n전역 플래그만 세우면 poll 이 타임아웃될 때까지 모른다.\n\n**self-pipe trick**: 파이프를 만들어 읽기단을 항상 poll 집합에 넣어두고, 깨우려는\n쪽(다른 스레드 / 시그널 핸들러)이 1바이트를 쓴다.\n\n```c\n// 시그널 핸들러에서 — write 는 async-signal-safe 하다\nstatic void on_sigterm(int s) {\n    (void)s;\n    int save = errno;              // 핸들러는 errno 를 복원해야 한다\n    g_stop = 1;                    // volatile sig_atomic_t\n    write(g_sp.wr, \"x\", 1);        // 루프를 즉시 깨운다\n    errno = save;\n}\n```\n- 양쪽 끝 **O_NONBLOCK**: 파이프가 이미 차 있으면 `EAGAIN` → \"이미 깨울 예정\"이므로 성공.\n- 깬 뒤 **반드시 drain**(EAGAIN 까지 읽기). 안 비우면 level-triggered poll 이 계속 즉시\n  리턴해서 busy loop.\n- **FD_CLOEXEC**: 데몬이 `fork/exec`(pppd, wpa_supplicant 호출 등) 할 때 fd 누수 방지.\n\n| 방법 | 플랫폼 | 비고 |\n|---|---|---|\n| **self-pipe** | 어디나 | fd 2개. 가장 이식성 있음 |\n| `eventfd(0, EFD_NONBLOCK\\|EFD_CLOEXEC)` | Linux | fd **1개**, 8바이트 카운터. self-pipe 의 현대판 |\n| `signalfd` | Linux | 시그널을 **fd 로** 받아 핸들러 자체를 없앤다. 반드시 `pthread_sigmask` 로 먼저 블록 |\n| `pselect`/`ppoll` | POSIX/Linux | 시그널 마스크를 원자적으로 교체 → self-pipe 없이 레이스 회피 |\n\n### 시그널 핸들러에서 허용되는 것 (Q47)\n\n- **async-signal-safe 함수만**: `write`, `_exit`, `sigaction`, `kill`, `read` …\n  **금지**: `printf`, `malloc/free`, `pthread_mutex_lock` — 핸들러가 malloc 중간에\n  끼어들면 힙 락이 재진입되어 그대로 데드락이다.\n- **쓸 수 있는 전역은 `volatile sig_atomic_t` 뿐** (또는 C11 `atomic_int` lock-free).\n  `volatile` 은 \"최적화로 읽기를 생략하지 말라\"일 뿐 원자성도 순서도 보장하지 않는다 —\n  그래서 **플래그 하나**에만 쓴다.\n- `signal()` 말고 **`sigaction()`**: 시맨틱이 이식성 있고 마스크를 지정할 수 있다.\n  `SA_RESTART` 를 **켜지 않아야** `poll` 이 `EINTR` 로 즉시 깨어나 플래그를 본다.\n  (켜면 일부 시스템콜이 자동 재시작되어 종료가 지연된다.)\n- 멀티스레드에서는 시그널이 **아무 스레드에나** 배달된다. 관례: 메인이 아닌 모든 스레드에서\n  `pthread_sigmask(SIG_BLOCK, ...)` 로 막고 전담 스레드 하나가 받는다.\n\n---\n\n## 5. 타이밍 — monotonic, timerfd, watchdog (Q45)\n\n```c\nstruct timespec ts; clock_gettime(CLOCK_MONOTONIC, &ts);   // ✅\ntime(NULL); gettimeofday(...);                             // ❌ 타임아웃에 쓰지 말 것\n```\n`CLOCK_REALTIME` 은 NTP/사용자가 되돌릴 수 있다. 게이트웨이가 부팅 직후 NTP 동기화로\n시계를 몇 시간 점프시키면 realtime 기반 타임아웃은 그대로 멈춘 것처럼 보인다.\n(참고: Linux `pthread_cond_timedwait` 는 기본이 REALTIME 이라\n`pthread_condattr_setclock(&a, CLOCK_MONOTONIC)` 이 필요하다. macOS 는 그 API 가 없고\n`pthread_cond_timedwait_relative_np` 를 쓴다 — 세트 02 참고.)\n\n| Linux 타이머 방식 | 특징 | 언제 |\n|---|---|---|\n| `poll` timeout | fd 불필요, ms 해상도, **가장 단순** | 타이머가 1~2개 |\n| `timerfd_create(CLOCK_MONOTONIC, TFD_NONBLOCK)` | 만료가 **fd 의 읽기 이벤트**가 됨 → 루프에 자연스럽게 합류, 놓친 만료 횟수를 read 로 알려줌 | 타이머 여러 개 / 주기 정확도 필요 |\n| `timer_create` + 시그널 | 핸들러 제약이 큼 | 비권장 |\n| 정렬된 deadline 힙 + poll timeout | fd 0개로 타이머 N개 | 타이머 많고 이식성 필요 |\n\n**systemd watchdog** (게이트웨이 데몬은 거의 항상 systemd 유닛이다):\n```ini\n[Service]\nType=notify\nWatchdogSec=30\nRestart=always\n```\n```c\nsd_notify(0, \"READY=1\");           // 기동 완료 보고 (Type=notify)\nsd_notify(0, \"WATCHDOG=1\");        // 루프가 살아 있다는 신호, WatchdogSec/2 마다\n```\n그래서 `poll` 타임아웃에 **상한(cap)** 을 둔다 — 이벤트가 없어도 주기적으로 깨어나\nwatchdog 을 쳐야 하기 때문. `poll_timeout_from(deadline, 10000)` 의 cap 이 그 역할이다.\n하드웨어 watchdog 이면 `/dev/watchdog` 에 주기적으로 쓴다. GW31-E 의\n\"오프라인 30분이면 자가 재부팅\"도 같은 계열의 안전장치다.\n\n---\n\n## 6. 전원 손실 안전 (Q46) — write + fsync + rename\n\n야외 장비는 전원이 예고 없이 끊긴다(PoE 재협상, 태양광 배터리 방전, -25°C 히터 부하).\n설정 파일을 제자리에서 덮어쓰면 **반쪽 파일**로 부팅해 벽돌이 된다.\n\n```\n① mkstemp(\"\u003cpath>.tmpXXXXXX\")   ← 반드시 같은 디렉토리(= 같은 파일시스템, rename 은 EXDEV 로 실패)\n② write_full(fd, data, n)\n③ fsync(fd)                     ← 데이터가 실제 미디어에 도달\n④ close(fd)  (+ chmod 0644, mkstemp 는 0600)\n⑤ rename(tmp, path)             ← POSIX 원자성: 독자는 옛 파일 아니면 새 파일만 본다\n⑥ fsync(디렉토리 fd)            ← 빼먹기 쉬움! 없으면 rename 자체가 전원 손실로 사라질 수 있다\n실패 시: unlink(tmp)            ← 쓰레기 누적 금지\n```\n`fsync` 없이 `rename` 만 하면 \"파일 이름은 새 것, 내용은 0바이트\"라는 최악의 상태가 실제로\n나온다(ext4 의 지연 할당). 임베디드에서는 여기에 **A/B 슬롯 + 부팅 카운터**(U-Boot\n`bootcount`/`upgrade_available`)를 더해 OTA 롤백까지 만든다 — follow-up 으로 말할 거리.\n\n---\n\n## 7. Linux 살펴보기 — /proc, /sys, netlink (면접 대화용)\n\n코드로는 안 다루지만 **Embedded Linux Engineer 면접에서 반드시 나온다.**\n\n| 무엇 | 어디서 | 쓰임 |\n|---|---|---|\n| fd 누수 확인 | `ls /proc/\u003cpid>/fd` 개수 세기, `lsof -p` | \"며칠 뒤 EMFILE\" 디버깅의 1단계 |\n| 메모리 | `/proc/\u003cpid>/status` (VmRSS), `smaps_rollup` | 누수/워터마크 |\n| 네트워크 | `/proc/net/dev`, `ss -tanp`, `/sys/class/net/\u003cif>/operstate` | 링크 up/down, WAN failover |\n| 모뎀 | `/dev/ttyUSB*`(AT), `/dev/cdc-wdm*`(QMI/MBIM), ModemManager D-Bus | LTE Cat12, 듀얼 SIM 전환 |\n| GPIO/I2C/전원 | `/sys/class/gpio`(구), **libgpiod `/dev/gpiochip*`(현재 표준)**, `/dev/i2c-*` | PoE 제어, 히터, 센서 |\n| 링크 상태 알림 | **netlink** (`AF_NETLINK`, `RTMGRP_LINK`) — 소켓이므로 **poll 집합에 그대로 합류** | 폴링 없이 캐리어 변화 감지 |\n| 파일 변경 알림 | `inotify` (fd 기반) | 설정 리로드 |\n| 커널 이벤트 | `udev` / `AF_NETLINK NETLINK_KOBJECT_UEVENT` | USB 모뎀 재열거 |\n\n> 포인트: **Linux 의 \"모든 게 fd\" 철학** — 타이머도(timerfd), 시그널도(signalfd),\n> 링크 상태도(netlink), 파일 변경도(inotify) fd 가 되어 같은 `poll/epoll` 루프에\n> 합류한다. 이 한 문장을 말할 수 있으면 \"Linux 를 이해한다\"는 신호가 된다.\n\n---\n\n## 8. 재연결 정책 (Q44)\n\n200만 대가 클라우드 장애 복구 순간 동시에 재접속하면 **thundering herd** 로 복구를 방해한다.\n\n```c\ndelay = min(base * 2^attempt, cap);\ndelay = delay ± (delay * jitter_pct / 100);     // 지터로 흩뿌린다\n```\n- `base=500ms, cap=30s, jitter=20%` 가 실무 기본값. 성공하면 `attempt=0` 으로 리셋.\n- **난수를 함수 안에서 뽑지 말고 인자로 주입**한다 → 순수 함수 → 하드웨어·시간 없이\n  단위 테스트 가능. 이게 리크루터 메일의 \"modular, testable embedded software\" 에 대한\n  가장 직접적인 대답이다(같은 이유로 `now_ms` 도 주입 가능하게 만드는 게 정석).\n- **오버플로 주의**: `1 \u003c\u003c attempt` 를 그냥 하면 attempt 가 32 를 넘을 때 UB.\n  cap 에서 먼저 끊거나 64비트로 계산한다.\n\n---\n\n## 9. 흔한 함정 (인터뷰 감점 포인트)\n\n1. `read()` 가 요청한 만큼 읽었다고 가정 — **가장 흔한 감점**.\n2. `EINTR` 을 에러로 처리 → 게이트웨이가 시그널 한 번에 연결을 끊는다.\n3. `EAGAIN` 을 에러 로그로 남김 → 로그가 홍수가 되고 진짜 에러가 묻힌다.\n4. `fcntl(fd, F_SETFL, O_NONBLOCK)` 로 기존 플래그를 날림.\n5. EOF 난 fd 를 poll 집합에 남겨둠 → **CPU 100%**.\n6. poll 타임아웃을 매 회전 재계산하지 않음 → 마감이 무한정 밀림.\n7. 시그널 핸들러에서 `printf`/`malloc` 호출 → 재진입 데드락.\n8. 종료 플래그를 그냥 `int` 로 선언 → `volatile sig_atomic_t` 여야 한다.\n9. self-pipe 를 drain 하지 않음 → busy loop.\n10. 설정 파일 제자리 덮어쓰기 / `fsync` 생략 → 전원 손실에 벽돌.\n11. `close()` 가 EINTR 이라고 재시도 → **다른 스레드가 방금 연 같은 번호의 fd 를 닫는다**\n    (Linux 에서 close 는 EINTR 여도 fd 를 이미 반납했다).\n12. 에러 경로마다 `return` 을 흩뿌려 fd 하나를 빠뜨림 → 며칠 뒤 `EMFILE`.\n13. 타임아웃에 `CLOCK_REALTIME` 사용 → NTP 점프에 멈춤.\n14. edge-triggered epoll 을 쓰면서 EAGAIN 까지 안 읽음 → 데이터가 영원히 잠김.\n\n---\n\n## 10. 면접에서 말할 것 (한국어 + 영어)\n\n**구조를 먼저 선언**\n- \"게이트웨이 데몬은 단일 스레드 이벤트 루프로 잡겠습니다. 모뎀 채널, 클라우드 소켓,\n  깨우기용 self-pipe 를 전부 논블로킹 fd 로 만들고 `poll()` 한 곳에서만 블록합니다.\n  락이 없으니 데드락이 없고 상태가 한 곳에 모여 테스트하기 쉽습니다.\"\n  > *\"I'd model the gateway daemon as a single-threaded event loop: the modem channel,\n  > the cloud socket, and a self-pipe are all non-blocking fds, and `poll()` is the only\n  > place that blocks. No locks means no deadlocks, and all state lives in one place,\n  > which makes it testable.\"*\n\n**poll vs epoll 트레이드오프**\n- \"fd 가 스무 개 남짓이라 `poll` 로 충분하고 이식성도 얻습니다. epoll 은 관심 집합이\n  커널에 상주해 fd 수천 개부터 이득이 납니다. edge-triggered 는 EAGAIN 까지 전부 읽어야\n  해서 실수 여지가 크고, 이 규모에서는 과설계입니다.\"\n  > *\"With ~20 fds, `poll` is enough and stays portable. `epoll` wins once you have\n  > thousands of fds because the interest set lives in the kernel. Edge-triggered mode\n  > requires draining to EAGAIN and is over-engineering at this scale.\"*\n\n**부분 I/O · EINTR**\n- \"`read`/`write` 는 부분 전송이 정상입니다. 짧은 read 는 에러가 아니라 EOF 신호이고,\n  EINTR 은 재시도, EAGAIN 은 루프 복귀입니다. 이 세 가지를 구분하는 게 핵심입니다.\"\n  > *\"Short reads and writes are normal. A short read signals EOF, not an error; EINTR\n  > means retry; EAGAIN means go back to the loop. Distinguishing those three is the job.\"*\n\n**종료**\n- \"SIGTERM 핸들러는 `volatile sig_atomic_t` 플래그를 세우고 self-pipe 에 1바이트를 쓰는\n  것만 합니다. async-signal-safe 하지 않은 일은 전부 루프에서 합니다. `sigaction` 을\n  쓰되 `SA_RESTART` 는 켜지 않아 `poll` 이 EINTR 로 즉시 깨게 합니다.\"\n  > *\"The SIGTERM handler only sets a `volatile sig_atomic_t` and writes one byte to the\n  > self-pipe — everything unsafe happens back in the loop. I use `sigaction` without\n  > `SA_RESTART` so `poll` returns EINTR immediately.\"*\n\n**전원 손실 · 재연결**\n- \"설정은 같은 디렉토리의 임시 파일에 쓰고 fsync 한 뒤 rename 하고, 디렉토리도 fsync 합니다.\n  rename 은 원자적이라 독자는 항상 완전한 파일만 봅니다.\"\n  > *\"I write config to a temp file in the same directory, fsync it, rename it, then\n  > fsync the directory. The rename is atomic, so a reader never sees a half-written file.\"*\n- \"재연결은 지수 백오프에 상한과 지터를 겁니다. 200만 대가 동시에 돌아오면 클라우드가\n  두 번 죽습니다. 난수는 인자로 주입해서 순수 함수로 만들고 단위 테스트합니다.\"\n  > *\"Reconnects use exponential backoff with a cap and jitter — two million gateways\n  > returning at once would take the cloud down twice. I inject the random value so the\n  > policy stays a pure, unit-testable function.\"*\n\n**테스트 전략 (이 팀이 명시한 평가 항목)**\n- \"하드웨어 없이 테스트하기 위해 모뎀을 pipe 로, 시계를 주입 가능한 함수로 바꿉니다.\n  라인 파서와 백오프는 순수 함수라 I/O 없이 테스트하고, 루프는 pipe 양 끝으로 테스트합니다.\"\n  > *\"To test without hardware I replace the modem with a pipe and the clock with an\n  > injectable function. The line parser and the backoff policy are pure functions, so\n  > they're tested with no I/O at all; the loop itself is driven through pipe endpoints.\"*\n\n---\n\n## 11. 체크리스트\n\n- [ ] `read_full`/`write_full` 을 보지 않고 쓸 수 있다 (EINTR·EOF·부분 전송 구분)\n- [ ] `fcntl` read-modify-write 로 `O_NONBLOCK` 을 켤 수 있다 (`F_GETFL` vs `F_GETFD` 구분)\n- [ ] `EAGAIN`/`EWOULDBLOCK`/`EINTR`/`EOF` 네 가지를 각각 어떻게 처리하는지 말할 수 있다\n- [ ] `poll` 루프를 빈 화면에서 작성할 수 있다 (EOF fd 제거, revents 검사, 타임아웃 재계산)\n- [ ] poll vs epoll vs kqueue 표를 말로 설명할 수 있다 (+ LT vs ET)\n- [ ] self-pipe trick 을 3줄로 설명하고, eventfd/signalfd 대안을 말할 수 있다\n- [ ] 시그널 핸들러에서 허용되는 것/금지된 것을 즉답할 수 있다\n- [ ] `sigaction` vs `signal`, `SA_RESTART` 의 효과를 말할 수 있다\n- [ ] 스트림에서 라인/프레임을 조립하는 상태 있는 파서를 쓸 수 있다 (오버플로 복구 포함)\n- [ ] 지수 백오프 + 지터를 오버플로 없이 쓰고, 왜 난수를 주입하는지 설명할 수 있다\n- [ ] `CLOCK_MONOTONIC` 을 쓰는 이유를 말할 수 있다\n- [ ] write+fsync+rename+dir fsync 6단계를 순서대로 말할 수 있다\n- [ ] `goto cleanup` 패턴으로 fd 누수 없는 함수를 쓸 수 있다\n- [ ] `close()` EINTR 을 재시도하면 왜 위험한지 설명할 수 있다\n- [ ] timerfd / signalfd / systemd sd_notify / netlink 를 각각 한 문장으로 설명할 수 있다\n- [ ] `/proc/\u003cpid>/fd` 로 fd 누수를 확인하는 방법을 안다\n", "problems": [{"num": 39, "slug": "read_full_write_full", "title_ko": "read_full / write_full — 부분 I/O + EINTR", "title_en": "read_full / write_full (partial I/O + EINTR)", "difficulty": "easy", "tags": ["posix", "read", "write", "EINTR", "partial-io"], "prompt_ko": "read()/write() 는 요청한 바이트 수를 보장하지 않는다. n 바이트를 다 옮길 때까지 도는 read_full/write_full 을 구현하라. read_full 은 EOF 를 만나면 지금까지 읽은 수를 리턴한다(짧은 read 는 에러가 아니다). 둘 다 -1/EINTR 은 재시도하고, 그 외 -1 은 실패로 리턴한다.", "prompt_en": "Implement looping read/write helpers that transfer all n bytes, retry on EINTR, and treat a short read as EOF rather than an error.", "signature": "ssize_t read_full(int fd, void *buf, size_t n); ssize_t write_full(int fd, const void *buf, size_t n)", "examples": [{"in": "파이프에 10바이트만 있고 쓰기단 close 후 read_full(fd, buf, 100)", "out": "10 (에러 아님)"}, {"in": "64KB 파이프에 256KB 를 write_full", "out": "부분 쓰기를 여러 번 돌아 256KB 전송, 리턴 262144"}], "hints": ["while (got \u003c n) 루프를 돌면서 read(fd, p + got, n - got) 로 남은 만큼만 요청한다.", "k \u003c 0 && errno == EINTR 은 '시그널에 깨진 것'이므로 continue. 다른 -1 만 실패다.", "read 가 0 이면 EOF — break 해서 got 을 리턴한다(에러로 -1 을 리턴하면 안 된다). write 는 0 을 EOF 로 보지 않고 sent += k 로 계속 민다."], "solution": "ssize_t read_full(int fd, void *buf, size_t n) {\n    if (!buf && n) { errno = EINVAL; return -1; }\n    unsigned char *p = (unsigned char *)buf;\n    size_t got = 0;\n    while (got \u003c n) {\n        ssize_t k = read(fd, p + got, n - got);\n        if (k \u003c 0) {\n            if (errno == EINTR) continue;   // 시그널에 깨진 것뿐 — 재시도\n            return -1;                      // 진짜 에러\n        }\n        if (k == 0) break;                  // EOF: 짧게 리턴하되 에러 아님\n        got += (size_t)k;\n    }\n    return (ssize_t)got;\n}\n\nssize_t write_full(int fd, const void *buf, size_t n) {\n    if (!buf && n) { errno = EINVAL; return -1; }\n    const unsigned char *p = (const unsigned char *)buf;\n    size_t sent = 0;\n    while (sent \u003c n) {\n        ssize_t k = write(fd, p + sent, n - sent);\n        if (k \u003c 0) {\n            if (errno == EINTR) continue;   // 재시도\n            return -1;\n        }\n        sent += (size_t)k;                  // 부분 쓰기 → 남은 만큼 다시\n    }\n    return (ssize_t)sent;\n}", "explanation_ko": "POSIX 는 read/write 가 요청한 만큼 처리한다고 약속하지 않는다. 파이프·소켓·tty 는 커널 버퍼 한도까지만 옮기고 돌아온다. 그래서 '전부 옮기기'는 라이브러리가 아니라 우리가 루프로 만든다. 세 가지 리턴을 구분하는 게 전부다: k>0(진행), k==0(EOF — read 에서만 의미), k\u003c0 && EINTR(재시도) vs 그 외(실패). 논블로킹 fd 에는 이 함수를 쓰면 안 된다 — EAGAIN 이 실패로 떨어지거나 바쁜 대기가 된다.", "complexity": "O(n) time, O(1) space (호출 횟수는 커널 버퍼 크기에 따라 ceil(n/buf))", "pitfalls": ["read 리턴값을 요청한 n 과 같다고 가정 — 임베디드 인터뷰 최다 감점.", "EINTR 을 에러로 처리해서 시그널 한 번에 연결이 끊긴다.", "포인터를 안 전진시키고 read(fd, buf, n) 을 그대로 반복 → 앞부분을 덮어쓴다.", "write 에서 k == 0 을 EOF 로 오해하고 break → 무한 루프나 조용한 손실.", "논블로킹 fd 에 read_full 을 써서 EAGAIN 에 -1 을 리턴."], "verkada_context": "모뎀 AT 응답이 여러 번에 나뉘어 도착하거나, 클라우드로 보내는 이벤트 프레임이 소켓 버퍼 한도에서 잘리는 상황 — 게이트웨이 필드 버그 1순위."}, {"num": 40, "slug": "set_nonblocking_eagain", "title_ko": "논블로킹 fd 설정 + EAGAIN 처리", "title_en": "Non-blocking fds and EAGAIN", "difficulty": "easy", "tags": ["fcntl", "O_NONBLOCK", "EAGAIN", "event-loop"], "prompt_ko": "fcntl 로 fd 에 O_NONBLOCK 을 켜되 기존 플래그를 보존하라(F_GETFL → OR → F_SETFL). 그리고 read 결과를 IO_OK / IO_WOULDBLOCK / IO_EOF / IO_ERROR 네 가지로 분류하는 read_nb 를 구현하라. EINTR 은 재시도, EAGAIN 과 EWOULDBLOCK 은 둘 다 검사한다.", "prompt_en": "Turn on O_NONBLOCK with a read-modify-write fcntl, then classify read() results into OK / WOULDBLOCK / EOF / ERROR.", "signature": "int set_nonblocking(int fd); io_res_t read_nb(int fd, void *buf, size_t n, size_t *out_n)", "examples": [{"in": "빈 논블로킹 파이프에서 read_nb", "out": "IO_WOULDBLOCK, *out_n == 0"}, {"in": "쓰기단을 close 한 뒤 read_nb", "out": "IO_EOF"}], "hints": ["fcntl(fd, F_SETFL, O_NONBLOCK) 은 O_RDONLY 같은 기존 플래그를 날린다. 먼저 F_GETFL 로 읽어라.", "read 가 -1 일 때 errno 를 EINTR / EAGAIN|EWOULDBLOCK / 그 외로 나눈다.", "EAGAIN 은 에러가 아니라 '지금은 데이터 없음'이다. 로그를 남기지 말고 루프로 돌아가라. 이미 O_NONBLOCK 이면 F_SETFL 을 생략해 멱등하게 만든다."], "solution": "typedef enum {\n    IO_OK         =  0,   // out_n 바이트를 읽었다\n    IO_WOULDBLOCK =  1,   // 지금은 데이터 없음 (EAGAIN/EWOULDBLOCK)\n    IO_EOF        =  2,   // 상대가 닫음 (read == 0)\n    IO_ERROR      = -1    // 진짜 에러\n} io_res_t;\n\nint set_nonblocking(int fd) {\n    int flags = fcntl(fd, F_GETFL, 0);\n    if (flags \u003c 0) return -1;\n    if (flags & O_NONBLOCK) return 0;               // 이미 설정 — 멱등\n    if (fcntl(fd, F_SETFL, flags | O_NONBLOCK) \u003c 0) // '=' 아니고 '|=' 가 핵심\n        return -1;\n    return 0;\n}\n\nio_res_t read_nb(int fd, void *buf, size_t n, size_t *out_n) {\n    if (out_n) *out_n = 0;\n    if (!buf && n) { errno = EINVAL; return IO_ERROR; }\n    for (;;) {\n        ssize_t k = read(fd, buf, n);\n        if (k > 0) { if (out_n) *out_n = (size_t)k; return IO_OK; }\n        if (k == 0) return IO_EOF;\n        if (errno == EINTR) continue;                       // 재시도\n        if (errno == EAGAIN || errno == EWOULDBLOCK)\n            return IO_WOULDBLOCK;                           // 정상 — 루프로 돌아가라\n        return IO_ERROR;\n    }\n}", "explanation_ko": "이벤트 루프의 모든 fd 는 논블로킹이어야 한다. poll 이 '읽을 수 있다'고 해도 스퓨리어스 wakeup 이나 다른 소비자 때문에 막상 read 가 블록될 수 있고, 한 fd 에서 블록되면 루프 전체(= 데몬 전체)가 멈춘다. 플래그 설정은 반드시 read-modify-write 여야 한다. F_GETFL/F_SETFL(파일 상태 플래그, O_NONBLOCK)과 F_GETFD/F_SETFD(fd 플래그, FD_CLOEXEC)는 서로 다른 네임스페이스라는 것도 같이 외운다.", "complexity": "O(1) per call", "pitfalls": ["F_GETFL 없이 F_SETFL 로 덮어써 접근 모드를 날린다.", "EAGAIN 을 에러로 처리해 로그 홍수 + 불필요한 재연결.", "EWOULDBLOCK 을 검사하지 않는다(표준은 EAGAIN 과 같은 값이라고 보장하지 않는다).", "FD_CLOEXEC 를 F_SETFL 로 설정하려다 실패.", "실패 경로에서 *out_n 을 초기화하지 않아 호출자가 쓰레기 값을 쓴다."], "verkada_context": "모뎀 /dev/ttyUSB*, 클라우드 소켓, self-pipe 를 전부 논블로킹으로 열어 한 fd 의 지연이 루프 전체를 멈추지 않게 한다."}, {"num": 41, "slug": "poll_event_loop", "title_ko": "poll() 이벤트 루프 — 2 fd 멀티플렉싱 + 타임아웃", "title_en": "poll()-based event loop over two fds", "difficulty": "medium", "tags": ["poll", "event-loop", "multiplexing", "POLLHUP", "timeout"], "prompt_ko": "두 fd 를 poll 로 동시에 감시하는 루프를 구현하라. 읽은 바이트를 각각 누적하고, read 가 0 이면 해당 fd 를 EOF 로 표시해 다음 회전의 pollfd 배열에서 제외한다(안 빼면 POLLHUP 으로 CPU 100% 스핀). poll 이 -1/EINTR 이면 재시도, 0(타임아웃)이면 timeouts++ 후 0 을 리턴한다. 두 fd 가 모두 EOF 면 0, 진짜 에러는 -1.", "prompt_en": "Multiplex two fds with poll(): accumulate bytes, drop fds that reach EOF, retry on EINTR, and return on idle timeout.", "signature": "int pump_two(int fd_a, int fd_b, int timeout_ms, pump_t *st)", "examples": [{"in": "a에 \"hello\", b에 \"worldzz\" 쓰고 두 쓰기단 close", "out": "리턴 0, bytes_a=5, bytes_b=7, timeouts=0"}, {"in": "두 파이프 모두 비어 있고 열린 채, timeout_ms=60", "out": "약 60ms 뒤 리턴 0, timeouts=1"}], "hints": ["매 회전마다 pollfd 배열을 다시 만든다. EOF 가 아닌 fd 만 넣고, 어느 슬롯이 a/b 인지 매핑을 기억한다.", "revents 는 events 에 없는 POLLHUP/POLLERR/POLLNVAL 도 올라온다. 이 비트에서도 read 를 해봐야 EOF 인지 에러인지 알 수 있다.", "read 가 0 이면 eof_* 를 세우고 continue — 다음 회전에서 그 fd 를 배열에 넣지 않는 것이 핵심이다. poll 이 -1 이고 errno==EINTR 이면 에러가 아니라 continue."], "solution": "typedef struct {\n    size_t bytes_a;     // fd_a 에서 읽은 총 바이트\n    size_t bytes_b;     // fd_b 에서 읽은 총 바이트\n    int    timeouts;    // poll 타임아웃 횟수\n    int    eof_a;       // fd_a 가 EOF 인가\n    int    eof_b;       // fd_b 가 EOF 인가\n    int    iters;       // 루프 회전 수 (스핀 감지용)\n} pump_t;\n\nint pump_two(int fd_a, int fd_b, int timeout_ms, pump_t *st) {\n    if (!st) { errno = EINVAL; return -1; }\n    memset(st, 0, sizeof *st);\n\n    while (!(st->eof_a && st->eof_b)) {\n        struct pollfd pfd[2];\n        int slot[2];                    // pfd[i] 가 a(0)인지 b(1)인지\n        int nf = 0;\n        if (!st->eof_a) { pfd[nf].fd = fd_a; pfd[nf].events = POLLIN; pfd[nf].revents = 0; slot[nf] = 0; nf++; }\n        if (!st->eof_b) { pfd[nf].fd = fd_b; pfd[nf].events = POLLIN; pfd[nf].revents = 0; slot[nf] = 1; nf++; }\n\n        st->iters++;\n        int r = poll(pfd, (nfds_t)nf, timeout_ms);\n        if (r \u003c 0) {\n            if (errno == EINTR) continue;        // ① 시그널 — 재시도\n            return -1;\n        }\n        if (r == 0) { st->timeouts++; return 0; } // 유휴 타임아웃 → 상위에서 결정\n\n        for (int i = 0; i \u003c nf; ++i) {\n            // ③ POLLHUP/POLLERR 도 \"읽어봐라\" 신호. read 가 0 또는 -1 로 알려준다.\n            if (!(pfd[i].revents & (POLLIN | POLLHUP | POLLERR | POLLNVAL))) continue;\n            char buf[256];\n            ssize_t k = read(pfd[i].fd, buf, sizeof buf);\n            if (k \u003c 0) {\n                if (errno == EINTR || errno == EAGAIN || errno == EWOULDBLOCK) continue;\n                return -1;\n            }\n            if (k == 0) {                        // ② EOF → 배열에서 제외\n                if (slot[i] == 0) st->eof_a = 1; else st->eof_b = 1;\n                continue;\n            }\n            if (slot[i] == 0) st->bytes_a += (size_t)k;\n            else              st->bytes_b += (size_t)k;\n        }\n    }\n    return 0;\n}", "explanation_ko": "게이트웨이 데몬의 심장이다. 블로킹은 poll() 한 곳에서만 일어나고, 깨어나면 준비된 fd 를 처리한 뒤 다시 잔다. 세 가지 규칙을 반드시 지킨다: ① EINTR 은 에러가 아니라 재시도 ② EOF 난 fd 는 즉시 집합에서 제외(level-triggered 라 POLLHUP 이 계속 떠서 스핀한다) ③ revents 는 요청하지 않은 비트도 올라오므로 전부 검사. fd 가 스무 개 남짓인 임베디드 데몬에서는 epoll 대신 poll 이 정답이고, 그 트레이드오프를 말할 수 있는 것이 평가 항목이다.", "complexity": "O(nfds) per wakeup, O(1) space", "pitfalls": ["EOF 난 fd 를 계속 poll 해 POLLHUP 이 즉시 리턴 → CPU 100%.", "revents 를 events 와 같다고 가정해 POLLHUP/POLLERR 를 놓친다.", "poll 의 -1/EINTR 을 에러로 처리해 루프가 종료된다.", "pollfd.revents 를 초기화하지 않거나 이전 값을 재사용한다.", "타임아웃을 절대 시각으로 계산하지 않고 매번 같은 값을 넘겨 마감이 무한정 밀린다."], "verkada_context": "모뎀 제어 채널과 Command 클라우드 소켓을 한 루프에서 감시하다가, 유휴 타임아웃에 하트비트/watchdog 을 치는 구조 그대로다."}, {"num": 42, "slug": "self_pipe_trick", "title_ko": "self-pipe trick — 루프를 즉시 깨우기", "title_en": "The self-pipe trick", "difficulty": "medium", "tags": ["self-pipe", "wakeup", "cancellation", "async-signal-safe", "eventfd"], "prompt_ko": "poll 안에서 자고 있는 이벤트 루프를 다른 스레드나 시그널 핸들러가 즉시 깨울 수 있게 하는 self-pipe 를 구현하라. sp_init 은 파이프의 양쪽 끝을 O_NONBLOCK + FD_CLOEXEC 로 만들고, sp_notify 는 1바이트를 쓰되 EAGAIN(이미 깨울 이벤트가 밀려 있음)은 성공으로 취급한다. sp_drain 은 EAGAIN 까지 다 읽어 비우고 읽은 바이트 수를 리턴한다.", "prompt_en": "Implement a non-blocking, close-on-exec self-pipe: notify with one byte (EAGAIN means a wakeup is already pending) and drain until EAGAIN.", "signature": "int sp_init(selfpipe_t *sp); int sp_notify(const selfpipe_t *sp); int sp_drain(const selfpipe_t *sp); void sp_close(selfpipe_t *sp)", "examples": [{"in": "sp_notify() 후 poll(rd, POLLIN, 0)", "out": "1 (즉시 깨어남)"}, {"in": "sp_notify() 3회 후 sp_drain()", "out": "3, 그 뒤 poll(rd, 0ms) == 0"}], "hints": ["pipe(fds) 로 만들고 fds[0]=rd, fds[1]=wr. 둘 다 set_nonblocking + FD_CLOEXEC 를 건다.", "notify 는 write(wr, &byte, 1) 한 번. EINTR 은 재시도, EAGAIN/EWOULDBLOCK 은 return 0.", "drain 은 read 가 EAGAIN 을 낼 때까지 루프. 비우지 않으면 level-triggered poll 이 계속 즉시 리턴해 busy loop 가 된다. init 실패 시 이미 연 fd 를 닫고 rd/wr 를 -1 로 되돌린다."], "solution": "typedef struct { int rd; int wr; } selfpipe_t;\n\nstatic int set_cloexec(int fd) {\n    int f = fcntl(fd, F_GETFD, 0);\n    if (f \u003c 0) return -1;\n    return fcntl(fd, F_SETFD, f | FD_CLOEXEC);\n}\n\nint sp_init(selfpipe_t *sp) {\n    if (!sp) { errno = EINVAL; return -1; }\n    sp->rd = sp->wr = -1;\n    int fds[2];\n    if (pipe(fds) != 0) return -1;\n    sp->rd = fds[0];\n    sp->wr = fds[1];\n    if (set_nonblocking(sp->rd) != 0 || set_nonblocking(sp->wr) != 0 ||\n        set_cloexec(sp->rd)    != 0 || set_cloexec(sp->wr)    != 0) {\n        int save = errno;\n        close(sp->rd); close(sp->wr);\n        sp->rd = sp->wr = -1;\n        errno = save;\n        return -1;\n    }\n    return 0;\n}\n\nint sp_notify(const selfpipe_t *sp) {\n    if (!sp || sp->wr \u003c 0) { errno = EINVAL; return -1; }\n    const unsigned char byte = 'x';\n    for (;;) {\n        ssize_t k = write(sp->wr, &byte, 1);\n        if (k == 1) return 0;\n        if (k \u003c 0 && errno == EINTR) continue;\n        if (k \u003c 0 && (errno == EAGAIN || errno == EWOULDBLOCK))\n            return 0;            // 파이프가 이미 꽉 참 = 이미 깨울 예정 → 성공\n        return -1;\n    }\n}\n\nint sp_drain(const selfpipe_t *sp) {\n    if (!sp || sp->rd \u003c 0) { errno = EINVAL; return -1; }\n    int total = 0;\n    unsigned char buf[64];\n    for (;;) {\n        ssize_t k = read(sp->rd, buf, sizeof buf);\n
