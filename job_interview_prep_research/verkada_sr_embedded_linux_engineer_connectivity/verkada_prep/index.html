up마다\n`timeout_ms`를 새로 주면 타임아웃이 영원히 갱신된다. monotonic 기준 **절대\n마감(deadline)** 을 먼저 고정하고 `remain = deadline - now()`를 넘긴다.\n\n### batch pop\nLTE 업로드는 요청 하나당 헤더·핸드셰이크 오버헤드가 크다. 이벤트 1개마다 올리면\n전력과 데이터 요금이 전부 오버헤드로 나간다. **있는 만큼 한 번에** 꺼내면\n락 획득 횟수도 n분의 1. 여러 슬롯이 동시에 비므로 깨우기는 **broadcast**.\n\n---\n\n## 6. 가득 찼을 때 무엇을 버릴 것인가 (backpressure)\n\n링크가 끊기면 업로더가 막히고, 그 사이에도 센서 스레드는 계속 샘플을 만든다.\n메모리는 유한하다 → **정책을 고른다.**\n\n| 정책 | 동작 | 적합한 데이터 | 부적합 |\n|---|---|---|---|\n| `BLOCK` | 생산자를 막는다 | 손실이 곧 버그인 감사 이벤트 | 실시간 경로(막히면 데드라인 미스), ISR |\n| `DROP_NEWEST` | 방금 것을 버린다 | **과거 이력** 보존 — 로그, 감사 추적 | 최신 상태가 중요한 데이터 |\n| `DROP_OLDEST` | 가장 오래된 것을 밀어낸다 | **최신 상태** 보존 — 텔레메트리, 온도, 링크 품질, 알람 | 순서 보장이 필요한 스트림 |\n\n**정책은 데이터의 의미가 결정한다.** 그리고 버린 개수는 **반드시 카운트해서 함께\n보고**한다 — 조용한 손실(silent loss)이 디버깅하기 제일 어렵다.\n\n검증 가능한 불변식 하나를 코드에 박아두면 인터뷰에서 강력하다:\n\n```\nproduced == consumed + dropped + queued\n```\n\n---\n\n## 7. 워커 풀 + graceful shutdown\n\n```\nsubmit ──▶ [ task queue (bounded) ] ──▶ worker × N ──▶ fn(arg)  ★ 락 밖에서\n              cond: work / slot\n```\n\n- **작업 실행은 반드시 락 밖에서.** 락을 쥔 채 `fn()`을 돌리면 워커 N개가\n  직렬화되어 풀이 스레드 1개짜리가 된다.\n- **종료 모드 2개**: `DRAIN`(남은 작업 다 처리 — 정상 재부팅) vs\n  `STOP`(큐는 버림 — watchdog/긴급). 버린 개수는 `discarded`로 센다.\n- **`shutdown`과 `destroy`를 분리한다.** 합쳐두면 shutdown 직후 `submit`이\n  해제된 큐를 만져 **use-after-free**. `shutdown` = 상태전환 + broadcast + join,\n  `destroy` = free. 그 사이에 카운터를 읽어볼 수 있는 것도 장점.\n- **join을 빼먹으면?** 워커가 아직 도는 중에 메모리가 free된다 — UAF.\n- 카운터 세 개(`executed` / `discarded` / `rejected`)로 \"몇 개가 어디로 갔는지\"\n  전부 설명할 수 있어야 한다.\n\n---\n\n## 8. counting semaphore를 직접 만들기\n\n\"동시 업로드는 최대 2개\" 같은 자원 제한. macOS는 POSIX 무명 세마포어\n(`sem_init`)가 **미구현**이라 직접 만드는 게 이식성 정답이자 단골 문제다.\n\n```c\nvoid csem_wait(csem_t *s) {\n    pthread_mutex_lock(&s->m);\n    while (s->value == 0)                 // if 아니라 while\n        pthread_cond_wait(&s->cv, &s->m);\n    s->value--;\n    pthread_mutex_unlock(&s->m);\n}\nvoid csem_post(csem_t *s) {\n    pthread_mutex_lock(&s->m);\n    s->value++;\n    pthread_mutex_unlock(&s->m);\n    pthread_cond_signal(&s->cv);          // 자리 1개 → 1명만\n}\n```\n\n불변식: `value >= 0`, 그리고 **동시에 자원을 쓰는 스레드 수 ≤ 초기 value**.\n`value == 1`이면 mutex처럼 보이지만 다르다 — **세마포어는 소유자가 없어서\n다른 스레드가 post해도 된다**(mutex는 잠근 스레드가 풀어야 한다).\n\n---\n\n## 9. 흔한 함정 (인터뷰 감점 포인트)\n\n- [ ] `if (cond) cond_wait(...)` — **가장 큰 감점**. 이유 3가지를 말할 것.\n- [ ] 종료 때 `signal` — 대기자 하나만 깨어나고 나머지는 영원히 잠듦.\n- [ ] `not_full` broadcast 누락 — 가득 찬 큐의 생산자가 종료 못 함.\n- [ ] `closed`를 락 밖에서 세팅 → lost wakeup.\n- [ ] `closed`만으로 pop을 false → 남은 이벤트 유실. **`closed && empty`** 여야 함.\n- [ ] 락 잡은 채로 I/O·작업 실행 → 풀이 직렬화, 지연 폭증.\n- [ ] `shutdown`에서 free까지 해버림 → 직후 `submit`이 UAF.\n- [ ] `join` 누락 상태로 `destroy` → 대기 중 mutex/condvar 파괴 = UB.\n- [ ] drop을 조용히 함 → 카운터 없으면 현장에서 원인 추적 불가.\n- [ ] 타임아웃 재대기에서 `timeout_ms`를 새로 줌 → 타임아웃이 영원히 갱신.\n- [ ] `cap == 0`을 방어 안 함 → `% cap`에서 0 나누기.\n- [ ] `volatile`로 동기화를 대신하려 함 — 원자성도 순서도 보장하지 않는다.\n\n---\n\n## 10. 면접에서 말할 것 (한국어 + 영어)\n\n### 시작할 때 (요구사항 확인)\n- \"생산자와 소비자가 각각 몇 개인가요? 큐가 가득 차면 블록인가요, 드롭인가요?\n  종료는 어떻게 알리나요?\"\n  > *\"How many producers and consumers? On a full queue, do we block the producer\n  > or drop? And how does shutdown get signalled?\"*\n- \"API를 먼저 정하겠습니다 — init / push / pop / close / destroy. 이 다섯 개면\n  사용자가 오용할 여지가 적습니다.\"\n  > *\"Let me pin the API first: init, push, pop, close, destroy. That's a small\n  > enough surface that callers can't easily misuse it.\"*\n\n### while vs if\n- \"조건 검사는 `if`가 아니라 `while`입니다. 이유가 셋인데요 — POSIX가 허용하는\n  spurious wakeup, 깨어나서 락을 다시 잡는 사이에 다른 스레드가 슬롯을 채가는\n  경우, 그리고 `closed` 같은 술어가 여러 개일 때 깨어난 이유를 재확인해야 하기\n  때문입니다.\"\n  > *\"The predicate check is a `while` loop, not an `if`. Three reasons: POSIX\n  > permits spurious wakeups; between waking and re-acquiring the mutex another\n  > thread can steal the slot I was woken for; and with more than one predicate —\n  > here, `closed` — I have to re-check why I woke up.\"*\n- \"`cond_wait`가 리턴했다는 건 조건이 참이라는 뜻이 아니라, 다시 확인해볼\n  만하다는 힌트일 뿐입니다.\"\n  > *\"A return from `cond_wait` is a hint that the predicate is worth re-checking\n  > — not a guarantee that it holds.\"*\n\n### signal vs broadcast\n- \"평소에는 한 번에 자리가 하나 생기니까 `signal`이면 충분합니다. 하지만 종료\n  때는 대기자가 몇 명인지 모르기 때문에 반드시 `broadcast`입니다.\"\n  > *\"In steady state one slot frees at a time, so `signal` is enough. On shutdown\n  > I don't know how many waiters there are, so it has to be `broadcast`.\"*\n- \"`broadcast`를 남발하면 thundering herd가 생깁니다 — N개가 깨어나 하나 빼고\n  전부 다시 잠들죠.\"\n  > *\"Broadcasting on every push causes a thundering herd: N threads wake up and\n  > all but one go straight back to sleep.\"*\n\n### 락 밖에서 일하기\n- \"작업 실행이나 I/O는 락을 놓고 합니다. 임계 구역은 상태 변경만 담당합니다.\n  락을 쥔 채 작업을 돌리면 워커 N개가 사실상 하나가 됩니다.\"\n  > *\"Work and I/O happen outside the lock — the critical section only mutates\n  > state. If I ran the task while holding the mutex, N workers would collapse\n  > into one.\"*\n- \"signal은 unlock 뒤에 보냅니다. 정확성에는 영향이 없고, 깨어난 스레드가\n  곧바로 락에서 다시 막히는 걸 피하는 최적화입니다.\"\n  > *\"I signal after unlocking. It doesn't change correctness — it just avoids\n  > waking a thread that immediately blocks again on the mutex.\"*\n\n### drop 카운터\n- \"버린 데이터는 반드시 카운트해서 함께 보고합니다. 조용한 손실이 현장에서\n  제일 디버깅하기 어렵습니다.\"\n  > *\"Every dropped item is counted and reported. Silent loss is the hardest\n  > failure to debug in the field.\"*\n- \"드롭 정책은 데이터의 의미가 결정합니다. 최신 상태가 중요한 텔레메트리는\n  drop-oldest, 이력이 중요한 감사 로그는 drop-newest, 손실이 곧 버그인\n  경로만 block입니다.\"\n  > *\"The drop policy follows the meaning of the data: drop-oldest for telemetry\n  > where only the latest state matters, drop-newest for audit logs where history\n  > matters, and blocking only where losing an item is a correctness bug.\"*\n- \"불변식 하나를 테스트로 박아둡니다 — produced == consumed + dropped + queued.\"\n  > *\"I assert one invariant in the stress test: produced equals consumed plus\n  > dropped plus what's still queued.\"*\n\n### edge case 목록 (스스로 먼저 읊을 것)\n- \"제가 확인할 edge case는 이겁니다: 빈 큐 pop, 가득 찬 큐 push, close 후 push,\n  close 시점에 대기 중이던 스레드, 이중 close, close 후 남은 항목의 drain,\n  spurious wakeup, 그리고 destroy 전에 join이 끝났는지.\"\n  > *\"The edge cases I want to cover: pop on empty, push on full, push after\n  > close, threads already blocked when close happens, a double close, draining\n  > items that were still queued at close time, spurious wakeups, and making sure\n  > every thread is joined before destroy.\"*\n- \"close와 destroy를 분리합니다. close는 상태 전환과 broadcast만 하고, 자원\n  해제는 join이 끝난 뒤 destroy에서 합니다 — 안 그러면 use-after-free입니다.\"\n  > *\"I keep close and destroy separate: close only flips state and broadcasts;\n  > freeing happens in destroy after every thread is joined. Otherwise it's a\n  > use-after-free.\"*\n\n### 테스트 전략\n- \"단위 테스트로 FIFO 순서와 경계(빈/가득)를 확인하고, 스트레스 테스트로\n  불변식을 확인한 다음, ThreadSanitizer로 돌려서 race가 없는지 봅니다.\"\n  > *\"Unit tests for FIFO order and the empty/full boundaries, a stress test that\n  > asserts the accounting invariant, and then a run under ThreadSanitizer to\n  > confirm there's no data race.\"*\n\n---\n\n## 11. 이 문제 세트 (Q11~20)\n\n| # | 함수 | 난이도 | 포인트 |\n|---|---|---|---|\n| 11 | `bq_init` / `bq_destroy` / `bq_count` | easy | 저장소 소유권(owns_buf), 필드 불변식, cap==0 방어 |\n| 12 | `bq_push` | medium | while-wait, closed 거부, unlock 후 signal |\n| 13 | `bq_pop` | medium | while-wait, `closed && empty` 판정 |\n| 14 | `bq_close` / `bq_is_closed` | medium | 락 안에서 플래그, 두 condvar broadcast, drain, 멱등 |\n| 15 | `bq_try_push` / `bq_try_pop` | easy | 논블로킹 ≠ 무락, 실패 시 상태 불변 |\n| 16 | `cond_wait_ms` / `bq_pop_timed` | hard | macOS `_relative_np` vs 절대시각, monotonic deadline 재계산 |\n| 17 | `bq_pop_batch` | medium | min(count,max), FIFO, 여러 슬롯 → broadcast |\n| 18 | `tq_*` (drop 정책) | medium | BLOCK/DROP_NEWEST/DROP_OLDEST, dropped 카운터, 불변식 |\n| 19 | `pool_*` | hard | DRAIN vs STOP, 락 밖 실행, shutdown↔destroy 분리, join |\n| 20 | `csem_*` | easy | mutex+condvar로 세마포어, signal로 충분, value>=0 |\n\n---\n\n## 12. 체크리스트\n\n- [ ] `while (predicate) cond_wait(...)` 를 손이 저절로 치는가 (이유 3개 암기)\n- [ ] 종료는 `broadcast`, 평상시는 `signal` — 이유를 즉답할 수 있는가\n- [ ] `closed`를 mutex 안에서 세팅하는 이유(lost wakeup)를 말할 수 있는가\n- [ ] `closed && empty` 비대칭(push는 즉시 거부)을 설명할 수 있는가\n- [ ] 이중 close / close 후 push / 대기 중 close 를 먼저 언급하는가\n- [ ] `close → join → destroy` 순서와 그 이유(UAF)를 말할 수 있는가\n- [ ] 작업 실행을 락 밖에서 하는 이유를 말할 수 있는가\n- [ ] drop 정책 3종과 각각 어떤 데이터에 맞는지 예를 들 수 있는가\n- [ ] `produced == consumed + dropped + queued` 불변식을 테스트로 쓸 수 있는가\n- [ ] `pthread_cond_timedwait`의 절대시각/기준 시계 문제와 Linux\n      `pthread_condattr_setclock(CLOCK_MONOTONIC)` 해법을 말할 수 있는가\n- [ ] 논블로킹(non-blocking)과 무락(lock-free)의 차이를 구분해 쓰는가\n- [ ] mutex+condvar로 counting semaphore를 10줄 안에 짤 수 있는가\n- [ ] TSan으로 검증한다는 얘기를 먼저 꺼내는가\n", "problems": [{"num": 11, "slug": "bq_init_destroy", "title_ko": "큐 init / destroy 와 저장소 소유권", "title_en": "Queue init/destroy and buffer ownership", "difficulty": "easy", "tags": ["condvar", "queue", "init", "ownership", "embedded"], "prompt_ko": "블로킹 큐 bq_t 를 초기화한다. storage 가 NULL 이 아니면 그 외부 배열을 그대로 쓰고(owns_buf=false), NULL 이면 cap 개를 calloc 한다(owns_buf=true). cap==0 이나 q==NULL 은 -1 로 거부한다. mutex 1개와 condvar 2개(not_full/not_empty)를 초기화하고, destroy 는 자기가 소유한 버퍼만 free 한 뒤 동기화 객체를 파괴한다. bq_count 는 락을 잡고 count 스냅샷을 돌려준다.", "prompt_en": "Initialize the blocking queue over caller-provided storage, or calloc it when storage is NULL; reject cap==0. Set up one mutex and two condition variables. destroy frees only what it owns. bq_count returns a locked snapshot.", "signature": "int bq_init(bq_t *q, Event *storage, size_t cap)", "examples": [{"in": "bq_init(&q, storage, 4)", "out": "0, cap==4, count==0, owns_buf==false"}, {"in": "bq_init(&q, NULL, 0)", "out": "-1 (cap 0 은 이후 % cap 에서 0 나누기)"}], "hints": ["memset 으로 구조체를 0 으로 밀고 시작하면 필드 누락이 없다.", "'누가 free 하는가'를 구조체 안에 owns_buf 로 남겨라 — 소유권은 코드가 아니라 데이터로 표현한다.", "pthread_mutex_init / pthread_cond_init 는 각각 1회, destroy 는 join 이 끝난 뒤에만."], "solution": "int bq_init(bq_t *q, Event *storage, size_t cap) {\n    if (!q || cap == 0) return -1;          // cap 0이면 이후 % cap이 0 나누기\n    memset(q, 0, sizeof *q);\n    if (storage) {\n        q->buf = storage;\n        q->owns_buf = false;\n    } else {\n        q->buf = calloc(cap, sizeof *q->buf);\n        if (!q->buf) return -1;\n        q->owns_buf = true;\n    }\n    q->cap = cap;\n    pthread_mutex_init(&q->m, NULL);\n    pthread_cond_init(&q->not_full, NULL);\n    pthread_cond_init(&q->not_empty, NULL);\n    return 0;\n}\n\nvoid bq_destroy(bq_t *q) {\n    if (!q) return;\n    if (q->owns_buf) free(q->buf);\n    q->buf = NULL;\n    q->cap = q->head = q->count = 0;\n    pthread_mutex_destroy(&q->m);\n    pthread_cond_destroy(&q->not_full);\n    pthread_cond_destroy(&q->not_empty);\n}\n\nsize_t bq_count(bq_t *q) {\n    size_t n;\n    pthread_mutex_lock(&q->m);\n    n = q->count;\n    pthread_mutex_unlock(&q->m);\n    return n;\n}", "explanation_ko": "head+count 표현을 쓰면 head==tail 의 full/empty 모호성이 아예 사라진다(count==0 이 empty, count==cap 이 full). 저장소를 외부에서 받을 수 있게 열어두는 건 임베디드 관례다 — 힙 단편화를 피하고 부팅 시 메모리 예산을 고정할 수 있다. 다만 편의를 위해 NULL 이면 내부 calloc 도 지원하고, 누가 해제할지를 owns_buf 에 기록해 이중 free/누수를 막는다. destroy 는 반드시 모든 사용자 스레드를 join 한 뒤 부른다 — 대기자가 있는 상태에서 mutex/condvar 를 파괴하면 UB.", "complexity": "O(1) time (calloc 제외), O(cap) space", "pitfalls": ["cap==0 을 통과시키면 push/pop 의 % cap 에서 0 으로 나누기.", "외부 저장소를 free 하거나, 내부 calloc 한 버퍼를 free 안 해서 누수.", "대기 중인 스레드가 있는 상태에서 destroy → mutex/condvar 파괴 UB."], "verkada_context": "GC31-E 게이트웨이 부팅 시 도어/센서 이벤트 큐를 정적 배열 위에 한 번 올린다 — 런타임 힙 할당 없이 메모리 예산을 고정."}, {"num": 12, "slug": "bq_push_blocking", "title_ko": "블로킹 push (가득 차면 대기)", "title_en": "Blocking push", "difficulty": "medium", "tags": ["condvar", "queue", "blocking", "spurious-wakeup"], "prompt_ko": "큐가 가득 차 있으면 not_full 조건 변수에서 대기했다가 자리가 나면 넣는다. 조건 검사는 반드시 while 루프로 한다(spurious wakeup + 깨어난 뒤 다른 생산자가 먼저 슬롯을 채가는 경우). closed 면 대기를 그만두고 false 를 반환한다. 성공하면 not_empty 를 signal 하되 mutex 를 unlock 한 뒤에 한다.", "prompt_en": "Block on not_full while the queue is full and open (a while loop, not an if). Return false once closed; otherwise enqueue and signal not_empty after unlocking.", "signature": "bool bq_push(bq_t *q, Event ev)", "examples": [{"in": "cap=2, push a, push b", "out": "true, true (count==2)"}, {"in": "이어서 push c", "out": "누군가 pop 할 때까지 블록 → 그 뒤 true"}], "hints": ["while (count == cap && !closed) pthread_cond_wait(&not_full, &m);", "깨어난 뒤 closed 인지 다시 확인해야 한다 — 술어가 두 개다.", "buf[(head + count) % cap] = ev; count++; unlock; signal(not_empty);"], "solution": "bool bq_push(bq_t *q, Event ev) {\n    pthread_mutex_lock(&q->m);\n    while (q->count == q->cap && !q->closed)\n        pthread_cond_wait(&q->not_full, &q->m);\n\n    if (q->closed) {                     // close 후 push는 거부\n        pthread_mutex_unlock(&q->m);\n        return false;\n    }\n    q->buf[(q->head + q->count) % q->cap] = ev;\n    q->count++;\n    q->pushed++;\n    pthread_mutex_unlock(&q->m);\n    pthread_cond_signal(&q->not_empty);  // 소비자 하나만 깨우면 충분\n    return true;\n}", "explanation_ko": "cond_wait 는 (1) mutex 해제 (2) 대기열 등록 (3) 깨어나면 mutex 재획득을 원자적으로 한다. 그래서 '조건 확인 → wait 진입' 사이에 signal 이 지나가는 lost wakeup 이 없다. while 이 필요한 이유는 셋: POSIX 가 허용하는 spurious wakeup, 깨어나 락을 다시 잡는 동안 다른 생산자가 슬롯을 채가는 stolen wakeup, 그리고 closed 라는 두 번째 술어. signal 을 unlock 뒤로 보내는 건 정확성이 아니라 성능 최적화다 — 락을 쥔 채 깨우면 깨어난 스레드가 곧바로 mutex 에서 다시 막힌다(hurry-up-and-wait).", "complexity": "O(1) time, O(1) extra space", "pitfalls": ["if (count == cap) cond_wait(...) — 가장 흔한 감점. 반드시 while.", "closed 검사를 대기 조건에서 빼먹으면 종료 시 생산자가 영원히 잠든다.", "signal 을 아예 빼먹으면 소비자가 안 깨어난다(가장 흔한 hang)."], "verkada_context": "도어 컨트롤러/센서 스레드가 출입 이벤트를 큐에 넣는 경로. LTE 가 느려 업로더가 밀리면 생산자가 잠시 막혀 backpressure 가 걸린다."}, {"num": 13, "slug": "bq_pop_blocking", "title_ko": "블로킹 pop (비면 대기)", "title_en": "Blocking pop", "difficulty": "medium", "tags": ["condvar", "queue", "blocking", "fifo"], "prompt_ko": "큐가 비어 있으면 not_empty 에서 while 루프로 대기한다. 깨어난 뒤 count==0 이면 그것은 'closed && empty' 를 뜻하므로 false 를 반환한다(종료 신호). 성공하면 head 에서 꺼내 head 를 랩어라운드시키고 not_full 을 signal 한다.", "prompt_en": "Block on not_empty while empty and open; after waking, count==0 means closed-and-empty, so return false. Otherwise dequeue from head, wrap it, and signal not_full.", "signature": "bool bq_pop(bq_t *q, Event *out)", "examples": [{"in": "빈 큐에서 pop", "out": "push 가 올 때까지 블록 → 그 값을 그대로 반환"}, {"in": "close 된 빈 큐에서 pop", "out": "false (소비자 루프 종료 조건)"}], "hints": ["while (count == 0 && !closed) pthread_cond_wait(&not_empty, &m);", "루프를 빠져나온 뒤 count==0 이라면 closed 라는 뜻이다 — 그때만 false.", "*out = buf[head]; head = (head+1) % cap; count--; unlock; signal(not_full);"], "solution": "bool bq_pop(bq_t *q, Event *out) {\n    if (!out) return false;\n    pthread_mutex_lock(&q->m);\n    while (q->count == 0 && !q->closed)\n        pthread_cond_wait(&q->not_empty, &q->m);\n\n    if (q->count == 0) {                 // 여기 도달 == closed && empty\n        pthread_mutex_unlock(&q->m);\n        return false;\n    }\n    *out = q->buf[q->head];\n    q->head = (q->head + 1) % q->cap;\n    q->count--;\n    q->popped++;\n    pthread_mutex_unlock(&q->m);\n    pthread_cond_signal(&q->not_full);\n    return true;\n}", "explanation_ko": "push 의 거울상이지만 종료 판정이 비대칭이다. push 는 closed 를 보는 즉시 거부하지만, pop 은 'closed 이면서 비어 있을 때'만 false 를 준다. 그래야 close 시점에 큐에 남아 있던 이벤트가 유실되지 않고 전부 소비된다(drain). while 루프를 빠져나온 시점에 count==0 이라는 것은 '깨웠는데도 여전히 비어 있다' = closed 라는 뜻이므로, 별도 플래그 검사 없이 count 만으로 판정할 수 있다. 소비자 루프는 while (bq_pop(&q, &ev)) { ... } 한 줄로 끝난다.", "complexity": "O(1) time, O(1) extra space", "pitfalls": ["closed 만 보고 false 를 반환 → 남아 있던 이벤트가 통째로 유실.", "if 로 대기 → spurious wakeup 시 빈 큐에서 쓰레기를 읽는다.", "signal(not_full) 누락 → 가득 찬 큐에서 대기하던 생산자가 안 깨어난다."], "verkada_context": "업로더 스레드의 메인 루프. while (bq_pop(...)) 로 이벤트를 꺼내 직렬화하고 Command 클라우드로 올린다."}, {"num": 14, "slug": "bq_close_protocol", "title_ko": "close / 종료 프로토콜", "title_en": "close and the shutdown protocol", "difficulty": "medium", "tags": ["condvar", "shutdown", "broadcast", "idempotent", "edge-case"], "prompt_ko": "closed 플래그를 mutex 안에서 세우고 not_empty·not_full 두 condvar 를 모두 broadcast 한다(signal 이면 대기자 하나만 깨어나 나머지가 영원히 잠든다). 이미 closed 면 아무 것도 하지 않는다(멱등). 규칙: close 후 push 는 즉시 거부, pop 은 'closed && empty' 일 때만 false, 남은 항목은 반드시 drain 된다.", "prompt_en": "Set closed under the mutex, then broadcast BOTH condvars; a second close is a no-op. After close, push is rejected immediately while pop keeps draining until the queue is also empty.", "signature": "void bq_close(bq_t *q)", "examples": [{"in": "push a, push b, close, pop, pop, pop", "out": "a, b, false (drain 후 종료)"}, {"in": "close 후 push", "out": "false (거부)"}, {"in": "3개 소비자가 대기 중일 때 close", "out": "3개 모두 깨어나 false 를 받음"}], "hints": ["closed 는 condvar 술어의 일부다 — 반드시 mutex 안에서 세팅해야 lost wakeup 이 없다.", "not_full 쪽 broadcast 를 빼먹으면 가득 찬 큐의 생산자가 영원히 잠든다.", "close → 모든 스레드 join → destroy 순서를 API 계약으로 못박아라."], "solution": "void bq_close(bq_t *q) {\n    pthread_mutex_lock(&q->m);\n    if (q->closed) {                     // 멱등: 두 번째 호출은 조용히 무시\n        pthread_mutex_unlock(&q->m);\n        return;\n    }\n    q->closed = true;\n    pthread_mutex_unlock(&q->m);\n    // 두 condvar 모두 broadcast. not_full 쪽을 빠뜨리면 가득 찬 큐에서 대기하던\n    // 생산자가 영원히 잠든다 — 가장 흔한 \"종료가 안 돼요\" 버그.\n    pthread_cond_broadcast(&q->not_empty);\n    pthread_cond_broadcast(&q->not_full);\n}\n\nbool bq_is_closed(bq_t *q) {\n    bool c;\n    pthread_mutex_lock(&q->m);\n    c = q->closed;\n    pthread_mutex_unlock(&q->m);\n    return c;\n}", "explanation_ko": "종료는 인터뷰가 가장 깊게 파는 지점이다. ① closed 를 락 밖에서 세우면 '조건 확인 → closed 세팅 → broadcast → wait 진입' 순서로 lost wakeup 이 난다. ② 대기자가 몇 명인지 모르므로 signal 이 아니라 broadcast 이고, not_empty 와 not_full 둘 다 깨워야 한다. ③ push 는 closed 즉시 거부하지만 pop 은 closed && empty 여야 false — 이 비대칭이 drain 을 보장한다. ④ watchdog 경로와 정상 종료 경로가 둘 다 close 를 부를 수 있으므로 멱등이어야 한다. ⑤ close 와 destroy 는 별개다: close 는 상태 전환만, 자원 해제는 join 이 끝난 뒤 destroy 에서.", "complexity": "O(1) time (broadcast 는 대기자 수에 비례한 커널 작업)", "pitfalls": ["종료 때 broadcast 대신 signal → 대기자 하나만 깨고 나머지는 영구 hang.", "not_full broadcast 누락 → 가득 찬 큐에서 대기하던 생산자가 종료 못 함.", "closed 만으로 pop 을 false → close 시점에 남아 있던 이벤트 유실.", "close 안에서 free 까지 해버림 → 아직 도는 스레드가 use-after-free."], "verkada_context": "게이트웨이 재부팅/펌웨어 업데이트 시 업로드 큐를 닫고 남은 출입 이벤트를 끝까지 올린 뒤 종료하는 경로. 이벤트 유실은 감사 로그 구멍이 된다."}, {"num": 15, "slug": "bq_try_push_pop", "title_ko": "try_push / try_pop (논블로킹 변형)", "title_en": "try_push / try_pop (non-blocking variants)", "difficulty": "easy", "tags": ["condvar", "queue", "non-blocking", "real-time"], "prompt_ko": "조건이 안 맞으면 절대 기다리지 않고 즉시 false 를 반환하는 변형을 만든다. try_push 는 가득 찼거나 closed 면 false, try_pop 은 비어 있으면 false. 실패한 경우 큐 상태와 *out 을 건드리면 안 된다. 실시간 경로(제어 루프, 오디오 콜백)는 블록하면 데드라인을 놓치기 때문에 같은 자료구조에 진입점을 하나 더 두는 것이다.", "prompt_en": "Add variants that never wait: return false immediately when full (try_push) or empty (try_pop), leaving queue state and *out untouched.", "signature": "bool bq_try_push(bq_t *q, Event ev) / bool bq_try_pop(bq_t *q, Event *out)", "examples": [{"in": "가득 찬 큐에 try_push", "out": "false, count 그대로, 대기 없음"}, {"in": "빈 큐에 try_pop", "out": "false, *out 미변경"}], "hints": ["while 루프를 if 로 바꾸고 wait 대신 즉시 unlock + return false.", "실패 경로에서도 반드시 unlock — early return 마다 unlock 짝을 확인하라.", "성공 시에는 블로킹 버전과 똑같이 signal 을 보내야 한다."], "solution": "bool bq_try_push(bq_t *q, Event ev) {\n    pthread_mutex_lock(&q->m);\n    if (q->closed || q->count == q->cap) {\n        pthread_mutex_unlock(&q->m);\n        return false;                    // 대기하지 않고 즉시 실패\n    }\n    q->buf[(q->head + q->count) % q->cap] = ev;\n    q->count++;\n    q->pushed++;\n    pthread_mutex_unlock(&q->m);\n    pthread_cond_signal(&q->not_empty);\n    return true;\n}\n\nbool bq_try_pop(bq_t *q, Event *out) {\n    if (!out) return false;\n    pthread_mutex_lock(&q->m);\n    if (q->count == 0) {                 // 비었으면 closed 여부와 무관하게 실패\n        pthread_mutex_unlock(&q->m);\n        return false;\n    }\n    *out = q->buf[q->head];\n    q->head = (q->head + 1) % q->cap;\n    q->count--;\n    q->popped++;\n    pthread_mutex_unlock(&q->m);\n    pthread_cond_signal(&q->not_full);\n    return true;\n}", "explanation_ko": "논블로킹(non-blocking)과 무락(lock-free)은 다른 말이다 — 여기서도 mutex 는 잡는다. 다만 '조건'을 기다리지 않을 뿐이다. 진짜 무락은 CAS 기반이고 별도 주제다. 이 구분을 정확히 쓰는 것만으로도 시니어 신호가 된다. 설계상 중요한 점은 블로킹/논블로킹이 같은 상태 위에서 돌아야 한다는 것 — 별도 큐를 두면 순서가 깨진다. 실패 시 *out 을 건드리지 않는 계약도 명시해야 호출자가 sentinel 패턴을 쓸 수 있다.", "complexity": "O(1) time, 대기 없음 (락 경합 시간만 유한 대기)", "pitfalls": ["early return 경로에서 unlock 누락 → 데드락.", "논블로킹을 무락이라고 부르는 용어 혼동.", "실패했는데 *out 이나 카운터를 건드려 호출자가 오판."], "verkada_context": "실시간 제어/헬스체크 루프가 이벤트를 '넣어보고 안 되면 버린다' 식으로 쓰는 경로. 블록하면 링크 모니터 주기를 놓친다."}, {"num": 16, "slug": "bq_pop_timed", "title_ko": "timed pop (pthread_cond_timedwait + 이식성 헬퍼)", "title_en": "Timed pop with a portable relative-wait helper", "difficulty": "hard", "tags": ["condvar", "timeout", "portability", "clock", "macos", "linux"], "prompt_ko": "'최대 N ms 까지만 기다리는' pop 을 만든다. 먼저 이식성 헬퍼 cond_wait_ms() 를 만들어 플랫폼 차이를 한 곳에 가둔다: macOS 는 pthread_cond_timedwait_relative_np(상대시간), 그 외는 clock_gettime(CLOCK_REALTIME) + ms 로 절대시각을 만들어 pthread_cond_timedwait. 그 다음 bq_pop_timed 는 monotonic 절대 마감을 먼저 고정하고, 깨어날 때마다 남은 시간을 다시 계산해서 넘긴다. 타임아웃이면 false, closed && empty 도 false.", "prompt_en": "Implement a pop with a millisecond budget. Wrap the platform difference (relative_np on macOS, absolute CLOCK_REALTIME elsewhere) in one helper, then recompute the remaining budget from a monotonic deadline on every wake.", "signature": "bool bq_pop_timed(bq_t *q, Event *out, long timeout_ms)", "examples": [{"in": "빈 큐 + timeout 80ms", "out": "약 80ms 후 false"}, {"in": "40ms 뒤 push 가 들어옴 + timeout 2000ms", "out": "약 40ms 만에 true"}], "hints": ["타임아웃 예산은 루프 밖에서 deadline = now_ms() + timeout_ms 로 한 번만 고정한다.", "매 반복에서 remain = deadline - now_ms(); remain \u003c= 0 이면 false.", "cond_wait_ms 가 ETIMEDOUT 을 돌려줘도 술어를 한 번 더 확인해야 한다 — 그 찰나에 push 가 들어왔을 수 있다."], "solution": "#if defined(__APPLE__)\nstatic int cond_wait_ms(pthread_cond_t *cv, pthread_mutex_t *m, long ms) {\n    struct timespec rel;\n    rel.tv_sec  = ms / 1000;\n    rel.tv_nsec = (ms % 1000) * 1000000L;\n    return pthread_cond_timedwait_relative_np(cv, m, &rel);   // macOS 전용 확장\n}\n#else\nstatic int cond_wait_ms(pthread_cond_t *cv, pthread_mutex_t *m, long ms) {\n    struct timespec ts;\n    clock_gettime(CLOCK_REALTIME, &ts);      // 기본 condattr의 기준 시계\n    ts.tv_sec  += ms / 1000;\n    ts.tv_nsec += (ms % 1000) * 1000000L;\n    if (ts.tv_nsec >= 1000000000L) { ts.tv_sec += 1; ts.tv_nsec -= 1000000000L; }\n    return pthread_cond_timedwait(cv, m, &ts);\n}\n#endif\n\nbool bq_pop_timed(bq_t *q, Event *out, long timeout_ms) {\n    if (!out) return false;\n    long deadline = now_ms() + timeout_ms;   // 절대 마감(monotonic)을 먼저 고정\n\n    pthread_mutex_lock(&q->m);\n    while (q->count == 0 && !q->closed) {\n        long remain = deadline - now_ms();   // 깨어날 때마다 남은 예산 재계산\n        if (remain \u003c= 0) {\n            pthread_mutex_unlock(&q->m);\n            return false;                    // 타임아웃\n        }\n        int rc = cond_wait_ms(&q->not_empty, &q->m, remain);\n        if (rc == ETIMEDOUT && q->count == 0 && !q->closed) {\n            pthread_mutex_unlock(&q->m);\n            return false;\n        }\n        // rc == 0 이어도 조건은 while이 다시 검사한다 (spurious wakeup 방어)\n    }\n    if (q->count == 0) {                     // closed && empty\n        pthread_mutex_unlock(&q->m);\n        return false;\n    }\n    *out = q->buf[q->head];\n    q->head = (q->head + 1) % q->cap;\n    q->count--;\n    q->popped++;\n    pthread_mutex_unlock(&q->m);\n    pthread_cond_signal(&q->not_full);\n    return true;\n}", "explanation_ko": "함정이 둘이다. ① 기준 시계: POSIX pthread_cond_timedwait 는 절대시각을 받고 기본 기준 시계가 CLOCK_REALTIME 이라, NTP 보정으로 시계가 뒤로 점프하면 타임아웃이 늘어난다. Linux 에서는 pthread_condattr_setclock(&a, CLOCK_MONOTONIC) 으로 고치는 게 정석이지만 macOS 에는 그 API 가 없고 대신 상대시간 확장 pthread_cond_timedwait_relative_np 가 있다 — 그래서 'N ms 상대 대기' 한 겹으로 감싸 플랫폼 차이를 한 함수에 가둔다. ② 예산 갱신: spurious wakeup 마다 timeout_ms 를 새로 주면 타임아웃이 영원히 갱신된다. monotonic 절대 마감을 먼저 고정하고 남은 시간만 다시 계산해야 한다.", "complexity": "O(1) time, 최악 대기 시간 = timeout_ms + 스케줄링 지터", "pitfalls": ["재대기할 때마다 원래 timeout_ms 를 다시 넘겨 타임아웃이 무한 갱신됨.", "tv_nsec 이 1e9 를 넘는 캐리 처리를 빼먹어 EINVAL.", "ETIMEDOUT 을 받자마자 술어 재확인 없이 false → 마지막 순간에 온 항목 유실.", "macOS 에 없는 pthread_condattr_setclock 을 쓰면 컴파일 실패(이식성)."], "verkada_context": "'이벤트가 오면 즉시 업로드, 없으면 5초마다 링크 상태를 점검하고 재연결 시도' 같은 업로더 루프. GW31-E 의 '오프라인 30분이면 자가 재부팅' 타이머도 같은 패턴."}, {"num": 17, "slug": "bq_pop_batch", "title_ko": "batch pop (한 번에 최대 n개)", "title_en": "Batch pop (drain up to n items at once)", "difficulty": "medium", "tags": ["condvar", "queue", "batching", "throughput", "broadcast"], "prompt_ko": "비어 있으면 블로킹 pop 처럼 not_empty 에서 대기하고, 깨어나면 min(count, max) 개를 out[0..n-1] 에 FIFO 순서로 옮긴 뒤 n 을 반환한다. 반환 0 은 'closed && empty' 를 뜻한다. 여러 슬롯이 한꺼번에 비므로 깨우기는 signal 이 아니라 broadcast 여야 한다.", "prompt_en": "Block until non-empty (or closed), then move min(count, max) items out in FIFO order and return that count; 0 means closed-and-empty. Broadcast not_full because several slots freed at once.", "signature": "size_t bq_pop_batch(bq_t *q, Event *out, size_t max)", "examples": [{"in": "큐에 0,1,2,3,4 / max=3", "out": "n=3, out={0,1,2}"}, {"in": "이어서 max=10", "out": "n=2, out={3,4}"}], "hints": ["대기 부분은 bq_pop 과 완전히 같다 — 달라지는 건 꺼내는 개수뿐.", "n = count \u003c max ? count : max; 로 자르고 루프에서 head 를 n 번 전진.", "n 개 슬롯이 동시에 비었으니 signal 한 번으로는 생산자 n 명을 못 깨운다 → broadcast."], "solution": "size_t bq_pop_batch(bq_t *q, Event *out, size_t max) {\n    if (!out || max == 0) return 0;\n    pthread_mutex_lock(&q->m);\n    while (q->count == 0 && !q->closed)\n        pthread_cond_wait(&q->not_empty, &q->m);\n\n    size_t n = q->count \u003c max ? q->count : max;\n    for (size_t i = 0; i \u003c n; i++) {\n        out[i] = q->buf[q->head];\n        q->head = (q->head + 1) % q->cap;\n    }\n    q->count -= n;\n    q->popped += n;\n    pthread_mutex_unlock(&q->m);\n    if (n > 0) pthread_cond_broadcast(&q->not_full);  // n개 슬롯이 동시에 비었다\n    return n;                                          // 0 == closed && empty\n}", "explanation_ko": "배치는 두 가지를 동시에 산다. ① 락 획득 횟수가 1/n 로 줄어 경합이 감소한다. ② 상위 계층에서 요청 단위 오버헤드가 줄어든다 — LTE 업로드는 TCP/TLS 핸드셰이크와 HTTP 헤더가 페이로드보다 클 수 있어서, 이벤트 하나마다 올리면 전력과 데이터 요금이 전부 오버헤드로 나간다. 반환값 0 을 종료 신호로 쓰면 소비자 루프가 while ((n = pop_batch(...)) > 0) 한 줄이 된다. broadcast 를 쓰는 이유(여러 슬롯이 동시에 빔)를 설명하면 signal/broadcast 를 기계적으로 외운 게 아니라는 신호가 된다.", "complexity": "O(n) time per call (n = 반환 개수), 호출당 락 1회", "pitfalls": ["n 개를 비워놓고 signal 한 번만 → 대기 중인 생산자 n-1 명이 계속 잠듦.", "max==0 이나 out==NULL 방어 누락.", "out 배열 크기보다 큰 max 를 넘겨 버퍼 오버플로."], "verkada_context": "GC31-E 가 LTE 로 텔레메트리/이벤트를 올릴 때 배치로 묶어 요청 수를 줄인다 — 데이터 요금과 모뎀 전력에 직접 영향."}, {"num": 18, "slug": "drop_policy_queue", "title_ko": "drop 정책 큐 (backpressure 설계)", "title_en": "Drop-policy queue (backpressure design)", "difficulty": "medium", "tags": ["backpressure", "drop-policy", "telemetry", "invariant", "observability"], "prompt_ko": "가득 찼을 때의 동작을 정책으로 고를 수 있는 큐를 만든다. TQ_BLOCK 은 생산자를 막고, TQ_DROP_NEWEST 는 방금 들어온 것을 버리고, TQ_DROP_OLDEST 는 가장 오래된 것을 밀어낸다. drop 을 해도 push 는 true 를 반환하되 dropped 카운터를 반드시 올린다 — false 는 오직 closed 일 때만. 불변식 produced == dequeued + dropped + queued 를 스트레스 테스트로 검증한다.", "prompt_en": "A bounded queue whose full-behaviour is a policy: block, drop the newest, or evict the oldest. Dropping still returns true but must bump a counter; assert produced == consumed + dropped + queued under load.", "signature": "bool tq_push(tq_t *q, Sample s)  /* policy: TQ_BLOCK | TQ_DROP_NEWEST | TQ_DROP_OLDEST */", "examples": [{"in": "cap=4, DROP_NEWEST 로 0..5 push", "out": "큐={0,1,2,3}, dropped=2 (과거 보존)"}, {"in": "cap=4, DROP_OLDEST 로 0..5 push", "out": "큐={2,3,4,5}, dropped=2 (최신 보존)"}], "hints": ["count == cap 일 때만 정책 분기를 타고, 그 외 경로는 셋 다 동일하다.", "DROP_OLDEST 는 head 를 한 칸 전진시켜 가장 오래된 것을 버린 뒤 넣는다.", "DROP_NEWEST 는 넣지 않고 바로 return true — 단, dropped++ 을 먼저."], "solution": "int tq_init(tq_t *q, size_t cap, tq_policy_t p) {\n    if (!q || cap == 0) return -1;\n    memset(q, 0, sizeof *q);\n    q->buf = calloc(cap, sizeof *q->buf);\n    if (!q->buf) return -1;\n    q->cap = cap;\n    q->policy = p;\n    pthread_mutex_init(&q->m, NULL);\n    pthread_cond_init(&q->not_full, NULL);\n    pthread_cond_init(&q->not_empty, NULL);\n    return 0;\n}\n\nvoid tq_destroy(tq_t *q) {\n    if (!q) return;\n    free(q->buf);\n    q->buf = NULL;\n    pthread_mutex_destroy(&q->m);\n    pthread_cond_destroy(&q->not_full);\n    pthread_cond_destroy(&q->not_empty);\n}\n\nbool tq_push(tq_t *q, Sample s) {\n    pthread_mutex_lock(&q->m);\n    if (q->closed) { pthread_mutex_unlock(&q->m); return false; }\n\n    if (q->count == q->cap) {\n        switch (q->policy) {\n        case TQ_BLOCK:\n            while (q->count == q->cap && !q->closed)\n                pthread_cond_wait(&q->not_full, &q->m);\n            if (q->closed) { pthread_mutex_unlock(&q->m); return false; }\n            break;\n        case TQ_DROP_NEWEST:\n            q->dropped++;                          // 방금 것을 버린다\n            pthread_mutex_unlock(&q->m);\n            return true;\n        case TQ_DROP_OLDEST:\n            q->head = (q->head + 1) % q->cap;      // 가장 오래된 것을 밀어낸다\n            q->count--;\n            q->dropped++;\n            break;\n        }\n    }\n    q->buf[(q->head + q->count) % q->cap] = s;\n    q->count++;\n    q->enqueued++;\n    pthread_mutex_unlock(&q->m);\n    pthread_cond_signal(&q->not_empty);\n    return true;\n}\n\nbool tq_pop(tq_t *q, Sample *out) {\n    if (!out) return false;\n    pthread_mutex_lock(&q->m);\n    while (q->count == 0 && !q->closed)\n        pthread_cond_wait(&q->not_empty, &q->m);\n    if (q->count == 0) { pthread_mutex_unlock(&q->m); return false; }\n    *out = q->buf[q->head];\n    q->head = (q->head + 1) % q->cap;\n    q->count--;\n    q->dequeued++;\n    pthread_mutex_unlock(&q->m);\n    pthread_cond_signal(&q->not_full);\n    return true;\n}\n\nvoid tq_close(tq_t *q) {\n    pthread_mutex_lock(&q->m);\n    if (q->closed) { pthread_mutex_unlock(&q->m); return; }\n    q->closed = true;\n    pthread_mutex_unlock(&q->m);\n    pthread_cond_broadcast(&q->not_empty);\n    pthread_cond_broadcast(&q->not_full);\n}", "explanation_ko": "정책은 '데이터의 의미'가 결정한다. 최신 상태만 의미 있는 텔레메트리(온도, 링크 RSSI, 배터리)는 DROP_OLDEST 로 최신을 살리고, 이력 자체가 증거인 감사 로그는 DROP_NEWEST 로 과거를 지킨다. 손실이 곧 버그인 경로만 BLOCK 을 쓰되, 실시간 스레드에는 절대 쓰지 않는다(데드라인 미스). 세 정책 모두에서 핵심은 카운터다 — 조용한 손실은 현장에서 재현조차 안 되기 때문에, 몇 개를 왜 버렸는지 텔레메트리로 함께 올려야 한다. produced == consumed + dropped + queued 불변식을 스트레스 테스트로 박아두면 정책 버그가 즉시 드러난다.", "complexity": "O(1) time per push/pop, O(cap) space", "pitfalls": ["drop 을 조용히 처리하고 카운터를 안 남김 — 현장 디버깅 불가.", "DROP_OLDEST 에서 head 만 전진시키고 count-- 를 빼먹어 count 가 cap 을 넘김.", "실시간 스레드에 BLOCK 정책을 걸어 제어 루프가 멈춤.", "drop 을 false 로 보고 → 호출자가 재시도 루프를 돌아 상황을 악화."], "verkada_context": "LTE 링크가 끊기거나 느려졌을 때 GC31-E 의 센서/텔레메트리 큐가 어떻게 우아하게 저하되는가. 듀얼 SIM failover 중 수십 초의 공백 동안 무엇을 버릴지가 곧 제품 결정이다."}, {"num": 19, "slug": "worker_pool_shutdown", "title_ko": "워커 풀 + graceful shutdown (DRAIN vs STOP)", "title_en": "Worker pool with graceful shutdown", "difficulty": "hard", "tags": ["thread-pool", "shutdown", "broadcast", "join", "use-after-free"], "prompt_ko": "N개 워커가 바운드 큐에서 작업을 꺼내 실행하는 풀을 만든다. 종료 모드 두 가지: POOL_DRAIN 은 큐에 남은 작업을 모두 처리하고 끝내고, POOL_STOP 은 진행 중 작업만 끝낸 뒤 큐를 버린다(버린 개수는 discarded 로 센다). 작업 실행은 반드시 락 밖에서. 종료 시 work/slot 두 condvar 를 모두 broadcast 하고 전원 join 한다. 자원 해제(pool_destroy)는 shutdown 과 분리한다.", "prompt_en": "A fixed worker pool with two shutdown modes: DRAIN runs the backlog to completion, STOP discards it (counted). Run tasks outside the lock, broadcast both condvars, join every worker, and keep shutdown separate from destroy.", "signature": "void pool_shutdown(pool_t *p, bool drain)  /* + pool_init / pool_submit / pool_destroy */", "examples": [{"in": "2000개 submit 후 shutdown(drain=true)", "out": "executed==2000, discarded==0"}, {"in": "shutdown(drain=false)", "out": "executed + discarded == submitted"}, {"in": "shutdown 후 submit", "out": "false, rejected++"}], "hints": ["워커 루프는 while (pool_take(p, &t)) t.fn(t.arg); — take 가 false 면 종료다.", "STOP 일 때 첫 워커가 남은 count 를 discarded 에 더하고 count=0 으로 비운다.", "shutdown 은 상태전환 + broadcast(work, slot) + join 까지만. free 는 destroy 에서."], "solution": "static bool pool_take(pool_t *p, Task *out) {\n    pthread_mutex_lock(&p->m);\n    while (p->count == 0 && p->state == POOL_RUNNING)\n        pthread_cond_wait(&p->work, &p->m);\n\n    if (p->state == POOL_STOP || p->count == 0) {\n        if (p->state == POOL_STOP && p->count > 0) {\n            p->discarded += p->count;      // 남은 작업은 버리되 반드시 센다\n            p->count = 0;\n        }\n        pthread_mutex_unlock(&p->m);\n        return false;                      // 워커 종료\n    }\n    *out = p->q[p->head];\n    p->head = (p->head + 1) % p->cap;\n    p->count--;\n    p->executed++;\n    pthread_mutex_unlock(&p->m);\n    pthread_cond_signal(&p->slot);\n    return true;\n}\n\nstatic void *pool_worker(void *arg) {\n    pool_t *p = (pool_t *)arg;\n    Task t;\n    while (pool_take(p, &t))\n        t.fn(t.arg);                       // ★ 실행은 락 밖에서\n    return NULL;\n}\n\nint pool_init(pool_t *p, size_t nworkers, size_t qcap) {\n    if (!p || nworkers == 0 || qcap == 0) return -1;\n    memset(p, 0, sizeof *p);\n    p->workers = calloc(nworkers, sizeof *p->workers);\n    p->q       = calloc(qcap, sizeof *p->q);\n    if (!p->workers || !p->q) { free(p->workers); free(p->q); return -1; }\n    p->cap   = qcap;\n    p->state = POOL_RUNNING;\n    pthread_mutex_init(&p->m, NULL);\n    pthread_cond_init(&p->work, NULL);\n    pthread_cond_init(&p->slot, NULL);\n    for (size_t i = 0; i \u003c nworkers; i++) {\n        if (pthread_create(&p->workers[i], NULL, pool_worker, p) != 0) break;\n        p->nworkers++;                     // 실제로 뜬 개수만 센다(join 대상)\n    }\n    return 0;\n}\n\nbool pool_submit(pool_t *p, task_fn fn, void *arg) {\n    if (!p || !fn) return false;\n    pthread_mutex_lock(&p->m);\n    while (p->count == p->cap && p->state == POOL_RUNNING)\n        pthread_cond_wait(&p->slot, &p->m);   // 큐가 차면 제출자가 기다린다\n    if (p->state != POOL_RUNNING) {\n        p->rejected++;\n        pthread_mutex_unlock(&p->m);\n        return false;\n    }\n    p->q[(p->head + p->count) % p->cap] = (Task){ fn, arg };\n    p->count++;\n    pthread_mutex_unlock(&p->m);\n    pthread_cond_signal(&p->work);\n    return true;\n}\n\nvoid pool_shutdown(pool_t *p, bool drain) {\n    if (!p) return;\n    pthread_mutex_lock(&p->m);\n    if (p->state != POOL_RUNNING) { pthread_mutex_unlock(&p->m); return; } // 멱등\n    p->state = drain ? POOL_DRAIN : POOL_STOP;\n    pthread_mutex_unlock(&p->m);\n    pthread_cond_broadcast(&p->work);      // 잠든 워커 전부\n    pthread_cond_broadcast(&p->slot);      // 큐가 차서 대기 중인 제출자 전부\n    for (size_t i = 0; i \u003c p->nworkers; i++)\n        pthread_join(p->workers[i], NULL);\n}\n\nvoid pool_destroy(pool_t *p) {\n    if (!p) return;\n    free(p->workers); p->workers = NULL;\n    free(p->q);       p->q = NULL;\n    p->nworkers = 0;\n    pthread_mutex_destroy(&p->m);\n    pthread_cond_destroy(&p->work);\n    pthread_cond_destroy(&p->slot);\n}", "explanation_ko": "풀의 정확성은 네 곳에서 갈린다. ① 작업 실행을 락 안에서 하면 워커 N개가 직렬화되어 사실상 싱글 스레드가 된다 — 임계 구역은 상태 변경만. ② 종료 시 broadcast 를 work/slot 둘 다 보내야 한다. 큐가 가득 차 slot 에서 대기하던 제출자를 안 깨우면 그 스레드가 영원히 잠긴다. ③ shutdown 과 destroy 를 분리한다 — 합치면 shutdown 이 반환한 직후의 submit 이 해제된 메모리를 만져 use-after-free 가 된다(참조 구현 06 의 알려진 함정). ④ 카운터 세 개(executed/discarded/rejected)로 제출된 작업이 전부 어디로 갔는지 설명할 수 있어야 한다. 그리고 join 을 빼먹고 free 하면 워커가 도는 중에 큐가 사라진다.", "complexity": "submit/take 각 O(1), shutdown 은 O(nworkers) join", "pitfalls": ["t.fn(t.arg) 을 락 안에서 실행 → 풀이 직렬화.", "종료 시 slot 쪽 broadcast 누락 → 큐가 가득 차 대기하던 제출자가 영구 hang.", "shutdown 에서 free 까지 해버려 직후 submit 이 UAF.", "join 없이 destroy → 워커가 도는 중에 큐/뮤텍스가 사라짐.", "STOP 에서 버린 작업을 안 세면 '작업이 사라졌다'는 미스터리 버그."], "verkada_context": "게이트웨이 백그라운드 작업(로그 업로드, 설정 동기화, 디바이스 헬스체크) 처리. 정상 재부팅은 DRAIN, watchdog 이 때리면 STOP — 둘을 구분하는 게 필드 운영의 핵심."}, {"num": 20, "slug": "counting_semaphore", "title_ko": "counting semaphore 를 mutex + condvar 로 구현", "title_en": "Counting semaphore from a mutex and a condvar", "difficulty": "easy", "tags": ["semaphore", "condvar", "resource-limit", "portability"], "prompt_ko": "'동시 업로드 최대 N개' 같은 자원 제한용 counting semaphore 를 mutex 1개 + condvar 1개로 만든다. wait 는 while (value == 0) cond_wait 후 value--, post 는 value++ 후 signal(자리가 하나 생겼으니 broadcast 불필요), trywait 은 value==0 이면 즉시 false. 불변식: value >= 0, 동시에 자원을 쓰는 스레드 수 \u003c= 초기 value.", "prompt_en": "Build a counting semaphore from one mutex and one condvar: wait blocks in a while loop until value>0 then decrements; post increments and signals exactly one waiter; trywait never blocks.", "signature": "void csem_wait(csem_t *s) / void csem_post(csem_t *s) / bool csem_trywait(csem_t *s)", "examples": [{"in": "init(3), wait x3", "out": "value==0, 다음 wait 는 블록"}, {"in": "init(2) 로 6개 스레드가 acquire/release", "out": "동시 실행 최대 2"}], "hints": ["상태는 정수 하나(value)뿐이다 — 술어는 value > 0.", "post 는 자리를 정확히 하나 만든다 → signal 로 충분하다(broadcast 는 thundering herd).", "trywait 은 wait 의 while 을 if 로 바꾸고 wait 대신 즉시 false."], "solution": "int csem_init(csem_t *s, int initial) {\n    if (!s || initial \u003c 0) return -1;\n    s->value = initial;\n    pthread_mutex_init(&s->m, NULL);\n    pthread_cond_init(&s->cv, NULL);\n    return 0;\n}\n\nvoid csem_destroy(csem_t *s) {\n    if (!s) return;\n    pthread_mutex_destroy(&s->m);\n    pthread_cond_destroy(&s->cv);\n}\n\nvoid csem_wait(csem_t *s) {\n    pthread_mutex_lock(&s->m);\n    while (s->value == 0)                  // if가 아니라 while\n        pthread_cond_wait(&s->cv, &s->m);\n    s->value--;\n    pthread_mutex_unlock(&s->m);\n}\n\nbool csem_trywait(csem_t *s) {\n    pthread_mutex_lock(&s->m);\n    if (s->value == 0) { pthread_mutex_unlock(&s->m); return false; }\n    s->value--;\n    pthread_mutex_unlock(&s->m);\n    return true;\n}\n\nvoid csem_post(csem_t *s) {\n    pthread_mutex_lock(&s->m);\n    s->value++;\n    pthread_mutex_unlock(&s->m);\n    pthread_cond_signal(&s->cv);           // 자리 하나 → 한 명만 깨우면 된다\n}\n\nint csem_value(csem_t *s) {\n    int v;\n    pthread_mutex_lock(&s->m);\n    v = s->value;\n    pthread_mutex_unlock(&s->m);\n    return v;\n}", "explanation_ko": "macOS 는 POSIX 무명 세마포어(sem_init)가 미구현이고 sem_open 은 이름/정리가 번거롭다 — 그래서 mutex+condvar 로 직접 만드는 게 이식성 정답이자 단골 문제다. 핵심은 '조건 변수는 상태를 갖지 않는다'는 점이다. 상태는 value 정수가 들고, condvar 는 그저 대기열이다. 그래서 value 를 mutex 로 보호하고 술어(value > 0)를 while 로 검사한다. post 는 자리를 정확히 하나 만들므로 signal 이면 충분하다. value==1 이면 mutex 처럼 보이지만 결정적 차이가 있다 — 세마포어는 소유자(owner)가 없어서 A가 wait 하고 B가 post 해도 된다. 그래서 신호 전달(signalling)에는 세마포어, 상호 배제에는 mutex 를 쓴다.", "complexity": "wait/post 각 O(1), 동시 자원 사용자 수 \u003c= 초기 value", "pitfalls": ["if (value == 0) cond_wait — spurious wakeup 시 value 를 -1 로 만든다.", "post 에서 broadcast → thundering herd (N명이 깨어나 1명 빼고 다시 잠듦).", "value 를 atomic 만으로 관리하고 condvar 술어로 쓰면 lost wakeup 이 난다 — mutex 가 필요하다.", "세마포어를 mutex 대용으로 써서 '누가 풀어도 되는' 성질 때문에 버그 추적이 어려워짐."], "verkada_context": "펌웨어 업데이트나 영상 클립 업로드처럼 대역폭/메모리를 많이 먹는 작업의 동시 실행 수를 제한한다. LTE 상향이 좁은 GC31-E 에서는 동시 업로드 수가 곧 지연/실패율이다."}]}, {"id": "atomics_lockfree", "order": 3, "range": "Q21-30", "icon": "⚛️", "track": "core", "title_en": "Atomics & Lock-free Patterns", "title_ko": "Atomic 연산 & Lock-free", "summary_ko": "C11 `\u003cstdatomic.h>` 로 mutex 없이 스레드 안전을 만드는 패턴 모음. 동시성 버그는 '원자성 부족(lost update)'과 '순서/가시성 부족(재배치)' 두 종류이고, 전자는 fetch_add/CAS 가, 후자는 memory_order 가 해결한다. 인터뷰의 핵심은 코드가 아니라 **왜 이 memory order 인가**를 말로 설명하는 것 — relaxed(통계 카운터), release/acquire(플래그·인덱스·포인터로 데이터 publish), acq_rel(CAS), seq_cst(기본값)의 선택 근거다. `volatile` 이 원자성도 순서도 주지 않는다는 점, seqlock 이 C 표준상 data race 라는 점, ABA 가 왜 생기는지는 거의 확실히 물어본다.", "summary_en": "Thread safety without mutexes using C11 atomics. Concurrency bugs come in two flavours — lost updates (fixed by atomic RMW) and reordering/visibility (fixed by memory_order) — and the interview tests whether you can justify the order you picked: relaxed for statistics, release/acquire to publish data behind a flag, index or pointer, acq_rel for CAS, seq_cst as the safe default. Covers SPSC ring buffers, seqlocks, refcounting and the ABA problem.", "verkada_relevance_ko": "2026-09-15 리크루터 Davis 의 안내 메일이 복습 주제로 mutex·condition variable 과 함께 **\"atomic operations\"를 이름까지 찍어서** 적어줬다. 즉 출제 범위 공지다. Connectivity 팀이 만드는 GC31-E 셀룰러 게이트웨이와 GW31-E Wi-Fi 게이트웨이의 펌웨어에는 mutex 를 쓸 수 없는 자리가 실제로 존재한다 — 모뎀 UART RX 인터럽트(블록 금지), 초당 수만 번 읽히는 링크 상태 스냅샷(RSRP/RSRQ/SIM 슬롯), Command 에서 내려오는 설정의 무중단 교체. 평가 기준이 '설계 결정과 trade-off 의 정당화'와 'concurrent 시스템의 견고성'이므로, lock-free 를 **쓸 줄 아는 것**보다 **언제 쓰면 안 되는지**(스핀락과 배터리, seqlock 과 data race, 근거 없는 lock-free 의 유지보수 비용)를 말하는 쪽이 점수가 높다. 또한 170개국 200만 대 fleet 규모에서는 '가끔 프레임이 비어요' 같은 조용한 손실이 추적 불가능하므로 drop/재시도 카운터를 원자적으로 세는 습관 자체가 설계 역량으로 읽힌다.", "concepts": [{"term": "atomic RMW (fetch_add / CAS)", "ko": "load-modify-store 가 쪼개지지 않는 단일 연산. 비원자 `c++` 는 3단계라 두 스레드 사이에서 증가가 통째로 유실된다(lost update).", "en": "A read-modify-write that cannot be split. A plain `c++` is three steps, so concurrent increments silently lose updates."}, {"term": "memory_order_relaxed", "ko": "원자성만 보장하고 다른 메모리 접근과의 순서는 보장하지 않는다. 순수 통계 카운터, 자기만 쓰는 인덱스 읽기, CAS 실패 경로에 쓴다.", "en": "Atomicity only, no ordering with respect to other memory. Use for pure statistics counters, self-owned index loads, and CAS failure paths."}, {"term": "acquire / release 짝", "ko": "release store 이전의 모든 쓰기는, 그 값을 acquire load 로 본 스레드에게 반드시 보인다(happens-before). 플래그·인덱스·포인터로 데이터를 publish 할 때의 표준 도구.", "en": "Everything written before a release store is visible to a thread that acquire-loads that value. This pair creates the happens-before edge used to publish data behind a flag, index or pointer."}, {"term": "seq_cst", "ko": "기본값. acquire+release 에 더해 모든 seq_cst 연산의 단일 전역 순서까지 보장한다. 확신이 없으면 여기서 시작하고 측정 근거가 생기면 낮춘다.", "en": "The default: acquire+release plus a single total order over all seq_cst operations. Start here when unsure and weaken only with a measurement."}, {"term": "volatile 의 한계", "ko": "최적화 억제일 뿐이다. ①원자성 없음 ②volatile 접근끼리의 순서만 지키고 주변 비-volatile 접근은 재배치됨 ③CPU 배리어(DMB)를 내보내지 않음. x86 에서는 우연히 동작해 더 위험하다.", "en": "volatile only prevents compiler caching: no atomicity, no ordering against non-volatile accesses, and no CPU barrier. It appears to work on x86 (TSO), which makes it more dangerous."}, {"term": "compare_exchange_weak / strong", "ko": "weak 는 값이 같아도 가짜 실패(spurious failure)가 있지만 ARM LL/SC 에서 더 싸다 → 루프 안에서는 weak. 실패하면 expected 에 현재 값이 자동으로 들어온다(다시 load 금지).", "en": "weak may fail spuriously but is cheaper on LL/SC machines, so use it inside a retry loop. On failure the expected operand is updated with the current value — never re-load."}, {"term": "SPSC lock-free ring", "ko": "생산자만 tail 을 쓰고 소비자만 head 를 쓴다 → write-write 경합이 구조적으로 없다. 남은 문제는 순서뿐이고 release/acquire 한 쌍이 해결한다. 한 칸을 비워 full/empty 를 구분.", "en": "Only the producer writes tail and only the consumer writes head, so write-write contention cannot occur; one release/acquire pair fixes ordering. One slot is left empty to distinguish full from empty."}, {"term": "power-of-two mask", "ko": "cap 이 2의 거듭제곱이면 `idx & (cap-1)` 은 `idx % cap` 과 동일하고 나눗셈이 없다(ISR 에서 중요). count 는 `(tail-head) & (cap-1)` — 부호 없는 뺄셈이라 랩되어도 정확.", "en": "With a power-of-two capacity, `& (cap-1)` equals `% cap` without a divide, which matters inside an ISR. count = (tail-head) & (cap-1) stays exact across wrap-around."}, {"term": "seqlock", "ko": "짝수/홀수 시퀀스로 latest-value 스냅샷을 공유. writer 는 절대 블록되지 않고 reader 가 재시도한다. C 표준상 data race 라 TSan 이 경고하며, 포인터를 담으면 안 된다(POD 전용).", "en": "An even/odd sequence counter publishes a latest-value snapshot; writers never block and readers retry. It is technically a data race under the C model (TSan flags it) and must hold POD only."}, {"term": "atomic refcount", "ko": "증가는 relaxed, 감소는 release 로 하고 마지막 참조(fetch_sub 가 1 반환)에서 acquire fence 를 건 뒤 free 한다. release 만으로는 '남의 접근이 나에게 보인다'가 보장되지 않는다.", "en": "Increment relaxed, decrement release; on the last reference insert an acquire fence before free, because release alone does not make other threads' accesses visible to the freeing thread."}, {"term": "ABA 문제 / tagged pointer", "ko": "CAS 는 값만 비교하고 이력을 모른다. 노드가 pop 됐다가 다시 push 되면 stale CAS 가 성공해 리스트가 깨진다. 해법: 버전 태그를 포인터와 함께 CAS, hazard pointer/RCU, 또는 그냥 mutex.", "en": "CAS compares a value, not its history: a node popped and pushed back lets a stale CAS succeed and corrupt the list. Fix with a version tag packed next to the pointer, hazard pointers/RCU, or just a mutex."}], "study_note_md": "# ⚛️ Atomic 연산 & Lock-free (Atomics & Lock-free Patterns) — Q21~30\n\n> 리크루터 Davis의 메일이 복습 주제로 **\"atomic operations\"를 이름까지 찍어서** 알려줬다.\n> 게이트웨이(GC31-E / GW31-E) 펌웨어에서 mutex를 쓸 수 없는 자리 — 모뎀 UART RX ISR,\n> 초당 수만 번 읽히는 링크 상태, 무중단 설정 교체 — 는 전부 atomic + memory order로 푼다.\n> 이 세트의 목표는 코드를 외우는 게 아니라 **\"왜 이 memory order인가\"를 말로 설명**하는 것이다.\n\n---\n\n## 1. 핵심 아이디어\n\n동시성 버그는 두 종류다. atomic은 그 둘을 각각 다른 도구로 막는다.\n\n| 문제 | 증상 | 도구 |\n|---|---|---|\n| **원자성 부족** | `c++`가 load/add/store 3단계라 증가가 유실(lost update) | `atomic_fetch_add`, CAS |\n| **순서/가시성 부족** | 인덱스는 갱신됐는데 데이터가 아직 안 보임 | `memory_order` (acquire/release) |\n\n`volatile`은 **둘 다 해결하지 못한다.** 이건 이 인터뷰에서 거의 확실히 나오는 질문이다.\n\n```\n  writer                        reader\n  ────────                      ────────\n  data = 42;          ①         if (load(flag, ACQUIRE))   ③\n  store(flag,1,RELEASE) ②           use(data);             ④\n\n  release(②) ─── happens-before ───> acquire(③)\n  ⇒ ①은 반드시 ④보다 먼저 보인다.\n```\n\n이 그림 하나가 Q22(stop 플래그), Q25(SPSC 링), Q27/28(seqlock), Q29(refcount)를 전부 설명한다.\n\n---\n\n## 2. memory_order 표 — 이게 이 세트의 전부다\n\n| order | 보장하는 것 | 언제 쓰나 | 이 세트의 예 |\n|---|---|---|---|\n| **relaxed** | 원자성만. 다른 메모리 접근과의 **순서 보장 없음**. 단일 변수의 modification order는 여전히 일관됨 | 순수 통계 카운터, 자기만 쓰는 인덱스 읽기, CAS 실패 경로 | Q21 `ctr_add`, Q25 `load(tail)` (생산자 자신), Q29 `rc_get` |\n| **acquire** (load 전용) | 이 load **이후**의 읽기/쓰기가 앞으로 못 넘어옴. 짝이 되는 release store 이전의 모든 쓰기가 보인다 | 플래그/인덱스/포인터를 **읽어서** 데이터를 쓰려 할 때 | Q22 `stop_requested`, Q24 `spin_lock`, Q25 `ring_pop` |\n| **release** (store 전용) | 이 store **이전**의 읽기/쓰기가 뒤로 못 넘어감. acquire로 이 값을 본 스레드에게 전부 보인다 | 데이터를 다 쓰고 **publish** 할 때 | Q22 `stop_request`, Q24 `spin_unlock`, Q25 `ring_push`, Q29 `rc_put` |\n| **acq_rel** (RMW 전용) | acquire + release 동시에 | 읽고-쓰는 한 연산이 양쪽 다 필요할 때 (락 획득 겸 publish) | Q30 `pool_pop`의 CAS |\n| **seq_cst** (기본값) | 위 전부 + **모든 seq_cst 연산에 대한 단일 전역 순서** | 확신이 없을 때의 기본값. 서로 다른 변수 두 개의 순서까지 필요할 때(Dekker 류) | 이 세트에는 필요 없음 |\n\n### 고르는 법 (30초 규칙)\n\n1. 이 atomic이 **다른 데이터를 publish**하는가? → store는 release, load는 acquire.\n2. **값만 맞으면 되는가**(카운터)? → relaxed.\n3. **모르겠는가?** → seq_cst로 시작하고 근거가 생기면 낮춘다. 면접에서 이 말은 **가점**이다.\n\n> ⚠️ x86(TSO)에서는 acquire/release가 **공짜**(일반 mov)라 잘못 써도 안 터진다. arm64\n> (Cortex-A 급 게이트웨이 SoC)는 weak memory model이라 `ldar/stlr`/`dmb`가 실제로 나간다.\n> **\"x86에서 됐으니 맞다\"는 필드 버그의 표준 레시피다.**\n\n### fence (`atomic_thread_fence`)\n\n변수가 아니라 **코드 지점**에 배리어를 세운다. \"매번 acquire를 거는 대신 마지막 한 번만\"이\n필요할 때 쓴다 → Q27 seqlock write, Q29 refcount free.\n`atomic_signal_fence`는 **컴파일러 배리어일 뿐** CPU 명령이 나가지 않는다.\n\n---\n\n## 3. 패턴별 요점\n\n### 3.1 카운터 (Q21)\n\n```c\natomic_fetch_add_explicit(&c->n, 1, memory_order_relaxed);  // 반환 = 더하기 '직전' 값\n```\n`fetch_*`가 **이전 값**을 준다는 걸 이용하면 \"슬롯 예약\"도 된다(`idx = fetch_add(&tail,1)`).\n\n### 3.2 stop 플래그 (Q22) — volatile 반례\n\n```c\n/* 틀린 코드 */\nvolatile int stop;\nsnprintf(reason, ...);   /* 비-volatile */\nstop = 1;                /* 컴파일러/CPU가 위보다 먼저 보이게 할 수 있다 */\n```\n`volatile`이 지키는 순서는 **volatile 접근끼리**뿐이다. `reason[]` 쓰기는 자유롭게 재배치된다.\n게다가 volatile은 배리어 명령을 내보내지 않으므로 arm64의 store buffer 앞에서 무력하다.\n\n### 3.3 CAS 루프 (Q23) — 모든 lock-free의 기본형\n\n```c\nunsigned cur = atomic_load_explicit(slot, memory_order_relaxed);\nwhile (candidate > cur) {\n    if (atomic_compare_exchange_weak_explicit(slot, &cur, candidate,\n            memory_order_release,   /* 성공 */\n            memory_order_relaxed))  /* 실패 */\n        return true;\n    /* 실패하면 cur에 '현재 값'이 자동으로 들어온다 — 다시 load 하지 말 것 */\n}\nreturn false;\n```\n\n| | weak | strong |\n|---|---|---|\n| 가짜 실패(spurious) | 있음 | 없음 |\n| 비용 | ARM LL/SC에서 더 쌈 | 내부적으로 재시도 루프 |\n| 쓰는 곳 | **루프 안 (거의 항상)** | 루프가 없는 단발 CAS |\n\n### 3.4 스핀락 (Q24) — 그리고 쓰면 안 되는 경우\n\n```c\nwhile (atomic_flag_test_and_set_explicit(&l->held, memory_order_acquire)) { /* spin */ }\n...                                    /* 임계구역: 평범한 데이터도 안전 */\natomic_flag_clear_explicit(&l->held, memory_order_release);\n```\n`atomic_flag`는 C11에서 **항상 lock-free가 보장되는 유일한 타입**이다.\n\n**쓰면 안 되는 경우 (이게 진짜 질문)**\n1. 임계구역이 길거나 그 안에서 블록/시스템콜/`malloc` → CPU를 태운다. 배터리로 도는 MT81 트레일러에서 스핀은 곧 주행거리다.\n2. 단일 코어 + 선점형 스케줄러 → 락 보유자가 선점되면 대기자가 타임슬라이스 전체를 태운다. 최악은 **우선순위 역전**으로 진행이 멈춘다 → mutex + priority inheritance가 정답.\n3. 유저스페이스 Linux에서 경합이 있으면 대개 `pthread_mutex`가 더 빠르다(futex라 무경합은 이미 유저스페이스에서 끝남).\n\n### 3.5 SPSC 링버퍼 (Q25/Q26)\n\n성립 근거 한 문장: **생산자만 tail을 쓰고 소비자만 head를 쓴다 → write-write 경합이 구조적으로 없다.**\n\n```c\nr->buf[t] = b;                                                /* ① 데이터 */\natomic_store_explicit(&r->tail, next, memory_order_release);  /* ② publish */\n```\n- 자기 인덱스는 `relaxed`로 읽어도 된다(나만 쓰니까). 상대 인덱스는 `acquire`.\n- **한 칸 비우기** → `head==tail`=empty, `next==head`=full, 용량 `CAP-1`. count 필드를 두면\n  양쪽이 쓰게 되어 SPSC의 이점이 사라진다.\n- `cap`이 2의 거듭제곱이면 `idx & (cap-1)` == `idx % cap`인데 나눗셈이 없다(ISR에서 중요).\n  `count = (tail - head) & (CAP-1)` — **부호 없는 뺄셈**이라 랩되어도 정확.\n- false sharing: 멀티코어라면 `head`/`tail`을 `_Alignas(64)`로 다른 캐시라인에.\n\n### 3.6 seqlock (Q27/Q28) — 정직함이 점수다\n\n```c\n/* write: 홀수(쓰는 중) → fence → 데이터 → 짝수(완료) */\nstore(seq, v+1, relaxed); atomic_thread_fence(release);\ns->data = *in;\nstore(seq, v+2, release);\n\n/* read: 재시도 루프 */\nfor (;;) {\n    before = load(seq, acquire);\n    if (before & 1) continue;\n    *out = s->data;                      /* 찢어진 값일 수 있다 */\n    atomic_thread_fence(acquire);\n    after = load(seq, relaxed);\n    if (before == after) return;         /* 유효 */\n}\n```\n\n**한계를 먼저 말할 것 (가산점)**\n- `*out = s->data`는 C 표준상 **data race**다. TSan이 정확히 여기를 지적한다 — 버그가 아니라\n  seqlock의 정의다. 실무 해법: ①필드별 relaxed atomic ②커널처럼 `READ_ONCE/WRITE_ONCE`.\n  (solutions/는 TSan 빌드일 때 seqlock **스레드 테스트만** 자동으로 끄고 단일 스레드로 같은\n  불변식을 검증한다. `-DVK_FORCE_SEQLOCK_THREADS`로 켜면 경고를 직접 볼 수 있다.)\n- 데이터에 **포인터/핸들이 있으면 쓰면 안 된다** — 찢어진 포인터를 역참조하면 죽는다. POD 전용.\n- reader starvation → 재시도 상한(`seq_try_read`) + 실패 시 mutex 경로로 fallback.\n- **\"그냥 mutex 쓰면 안 되나?\"의 정답은 '된다, 그리고 대개 그게 맞다'**이다. seqlock은\n  \"읽기가 초당 수만 번이고 writer 지연이 실시간 요구를 깬다\"는 **측정된 근거**가 있을 때만.\n\n### 3.7 refcount (Q29)\n\n```c\natomic_fetch_add_explicit(&c->refs, 1, memory_order_relaxed);   /* get */\n\nif (atomic_fetch_sub_explicit(&c->refs, 1, memory_order_release) == 1) {  /* put */\n    atomic_thread_fence(memory_order_acquire);   /* ★ 이게 없으면 use-after-free */\n    free(c);\n}\n```\n- **증가가 relaxed**: 이미 유효한 참조를 들고 있는 증가라 publish할 게 없다.\n- **감소가 release**: \"이제 안 본다\"를 알리려면 내 접근을 먼저 flush해야 한다.\n- **free 전에 acquire**: release는 \"내 접근이 남에게 보인다\"뿐이다. free하는 쪽은 반대로\n  **\"남들의 접근이 나에게 보인다\"**가 필요하다.\n- 참조 없이 `load(ptr)` → `fetch_add(refs)` 두 줄로 나누면 그 사이에 해제될 수 있다\n  (use-after-free). 닫는 법은 셋뿐: ①짧은 락으로 두 줄 원자화 ②hazard pointer ③RCU/epoch.\n\n### 3.8 ABA와 tagged pointer (Q30)\n\n> T1이 `top == A`를 읽고 선점된 사이, T2가 A를 pop, B를 pop, A를 다시 push한다.\n> top은 다시 A지만 **A->next는 완전히 다른 값**이다. T1의 `CAS(top, A, A->next_old)`는\n> \"값이 같은가\"만 보므로 **성공해버리고** 리스트가 깨진다.\n\n해법 3가지:\n1. **tagged pointer** — (포인터 \\| 버전 카운터)를 한 워드로 묶어 CAS. push/pop마다 tag++.\n   64비트 CAS로 `(32bit index | 32bit tag)`, 또는 DWCAS(x86 `cmpxchg16b`, ARM `CASP`).\n2. **hazard pointer / epoch / RCU** — 재사용 자체를 지연시킨다.\n3. **그냥 mutex** — 임베디드 코드 대부분에서 이게 정답이다.\n\n포인터 대신 **배열 인덱스**를 쓰면 32비트가 남아 태그를 공짜로 얻는다(Q30 구현이 이 방식).\n\n---\n\n## 4. 흔한 함정 (인터뷰 감점 포인트)\n\n1. **`volatile`로 충분하다고 답하기** — 즉사. 원자성도 순서도 보장하지 않는다.\n2. **CAS 실패 후 다시 `atomic_load`** — 실패 시 expected에 현재 값이 이미 실려 있다.\n3. **seqlock read를 `do/while`로 쓰기** — `continue`가 while 조건으로 점프해서 **아직 대입된 적\n   없는 `after`(쓰레기값)**와 비교한다. 운 나쁘면 `*out`을 한 번도 채우지 않고 리턴한다.\n   → `for (;;)` + 명시적 `return`. (흔한 예제 코드에 실제로 박혀 있는 버그)\n4. **seqlock write에서 첫 fence를 빼기** — reader가 '짝수 seq + 반쯤 쓰인 데이터'를 보고 통과한다.\n5. **refcount free 전에 acquire fence 없음** — release만으로는 남의 접근을 못 본다.\n6. **SPSC에 count 필드 추가** — 양쪽이 쓰게 되어 무락이 깨진다.\n7. **`is_pow2(0)`이 true** — `0 & (0-1) == 0`. `x != 0 &&`를 반드시 붙인다.\n8. **가득 찬 링에서 ISR이 재시도/대기** — 인터럽트를 막는다. **drop하고 카운터를 올린다.**\n9. **drop/실패를 조용히 삼키기** — 필드에서 가장 추적하기 어려운 버그다. 반드시 센다.\n10. **근거 없이 lock-free 선택** — \"측정했더니 mutex가 병목이었다\"가 없으면 유지보수 비용만 오른다.\n\n---\n\n## 5. 면접에서 말할 것 (한국어 + English)\n\n**① volatile vs atomic**\n- KO: \"`volatile`은 최적화 억제일 뿐, 원자성도 메모리 순서도 보장하지 않습니다. 공유 상태에는 `_Atomic`과 명시적 memory order를 씁니다.\"\n- EN: *\"`volatile` only stops the compiler from caching a load — it guarantees neither atomicity nor ordering. For shared state I use `_Atomic` with an explicit memory order.\"*\n\n**② acquire/release 한 문장 정의**\n- KO: \"release store 이전의 모든 쓰기는, 그 값을 acquire load로 본 스레드에게 반드시 보입니다. 그 한 쌍이 happens-before를 만듭니다.\"\n- EN: *\"Everything written before a release store becomes visible to any thread that acquire-loads that value. That pair is what creates the happens-before edge.\"*\n\n**③ 왜 relaxed인가**\n- KO: \"이 카운터는 다른 데이터를 publish하지 않고 값만 맞으면 되므로 relaxed로 충분합니다. 배리어 비용을 낼 이유가 없습니다.\"\n- EN: *\"This counter doesn't publish any other data — only the count has to be right — so relaxed is sufficient and I don't pay for a barrier.\"*\n\n**④ SPSC가 무락인 이유**\n- KO: \"생산자만 tail을 쓰고 소비자만 head를 씁니다. write-write 경합이 구조적으로 없으니 남는 문제는 순서뿐이고, 그건 release/acquire 한 쌍으로 끝납니다.\"\n- EN: *\"Only the producer writes tail and only the consumer writes head, so there is no write-write contention by construction. The only remaining problem is ordering, and one release/acquire pair solves it.\"*\n\n**⑤ 스핀락을 안 쓰는 이유**\n- KO: \"임계구역이 길거나 단일 코어에서 선점되면 스핀락은 CPU를 태우고 우선순위 역전을 만듭니다. 그런 경우엔 mutex에 priority inheritance를 씁니다.\"\n- EN: *\"If the critical section is long, or on a single core where the holder can be preempted, a spinlock just burns CPU and invites priority inversion. There I'd use a mutex with priority inheritance.\"*\n\n**⑥ seqlock의 한계를 먼저 말하기**\n- EN: *\"To be upfront: a seqlock is technically a data race under the C memory model — ThreadSanitizer will flag the payload copy. The real-world fixes are per-field relaxed atomics, or the kernel's `READ_ONCE`/`WRITE_ONCE`. And it's POD-only: never put a pointer in the payload.\"*\n\n**⑦ trade-off를 아는 시니어로 들리게**\n- KO: \"기본은 mutex + condition variable입니다. lock-free는 측정된 근거가 있을 때만 씁니다 — 없으면 유지보수 비용만 올라갑니다.\"\n- EN: *\"My default is a mutex and a condition variable. I only reach for lock-free when I have a measurement that says the lock is the bottleneck — otherwise it's just maintenance cost.\"*\n\n**⑧ ABA**\n- EN: *\"CAS only compares the value, not the history. If a node is popped and pushed back, a stale CAS succeeds and corrupts the list. I'd pack a version tag next to the pointer, or avoid reclamation entirely with hazard pointers or RCU.\"*\n\n---\n\n## 6. 체크리스트\n\n- [ ] `volatile`이 보장하는 것/못 하는 것을 3가지로 나눠 말할 수 있다\n- [ ] relaxed / acquire / release / acq_rel / seq_cst를 각각 \"언제 쓰나\"로 설명할 수 있다\n- [ ] release store ↔ acquire load가 happens-before를 만든다는 문장을 영어로 말할 수 있다\n- [ ] CAS 루프를 보지 않고 쓸 수 있고, 실패 시 expected가 갱신된다는 걸 안다\n- [ ] weak vs strong의 차이와 각각의 사용처를 안다\n- [ ] SPSC 링버퍼를 5분 안에 쓰고 \"왜 무락인지\" 한 문장으로 설명한다\n- [ ] 한 칸 비우기 / pow2 마스킹 / unsigned 뺄셈 count를 이유와 함께 말한다\n- [ ] seqlock write/read를 쓰고, **data race라는 한계를 먼저** 말한다\n- [ ] seqlock read를 `for(;;)`로 쓴다 (`do/while` + `continue` 함정을 안다)\n- [ ] refcount에서 감소=release, 마지막에 acquire fence인 이유를 설명한다\n- [ ] ABA 시나리오를 3문장으로 설명하고 해법 3가지를 댄다\n- [ ] \"그냥 mutex 쓰면 안 되나?\"에 **\"됩니다, 그리고 대개 그게 맞습니다\"**로 시작한다\n- [ ] TSan(`-fsanitize=thread`)으로 검증하는 습관을 언급한다\n", "problems": [{"num": 21, "slug": "atomic_counter_relaxed", "title_ko": "atomic 카운터 (relaxed) vs 비원자 카운터", "title_en": "Relaxed atomic counter vs a plain counter", "difficulty": "easy", "tags": ["atomic", "fetch_add", "relaxed", "lost-update"], "prompt_ko": "`atomic_fetch_add_explicit(..., memory_order_relaxed)` 로 카운터를 구현하라. 반환값은 '더하기 직전 값'이어야 한다. 그리고 비원자 `c++` 의 최악 인터리빙(T1 load → T2 load → T1 store → T2 store)을 지역 변수로 결정적으로 재현해, 증가 2회인데 결과가 start+1 이 되는 lost update 를 보여라.", "prompt_en": "Implement a relaxed atomic counter whose add returns the previous value, then deterministically reproduce the lost update of a non-atomic `++` by simulating the load/load/store/store interleaving with local variables.", "signature": "unsigned long long ctr_add(Counter *c, unsigned long long delta)", "examples": [{"in": "ctr_add(c,5); ctr_add(c,3)", "out": "0, 5 반환 / ctr_get(c)==8"}, {"in": "racy_interleave_demo(10)", "out": "11 (증가 2회인데 1회 유실)"}, {"in": "atomic_interleave_demo(10)", "out": "12 (유실 없음)"}], "hints": ["`c++` 는 한 연산이 아니라 load / add / store 세 연산이다.", "통계 카운터는 다른 데이터를 publish 하지 않는다 → 순서 보장이 필요 없다 → relaxed.", "`atomic_fetch_add_explicit(&c->n, delta, memory_order_relaxed)` 는 **더하기 직전 값**을 반환한다."], "solution": "void ctr_init(Counter *c) {\n    atomic_init(&c->n, 0ull);\n}\n\nunsigned long long ctr_add(Counter *c, unsigned long long delta) {\n    return atomic_fetch_add_explicit(&c->n, delta, memory_order_relaxed);\n}\n\nunsigned long long ctr_get(const Counter *c) {\n    return atomic_load_explicit(&c->n, memory_order_relaxed);\n}\n\nunsigned long long racy_interleave_demo(unsigned long long start) {\n    unsigned long long shared = start;\n    unsigned long long r1, r2;\n    r1 = shared;                 /* T1: load          */\n    r2 = shared;                 /* T2: load (끼어듦) */\n    r1 += 1; shared = r1;        /* T1: add + store   */\n    r2 += 1; shared = r2;        /* T2: add + store   */\n    return shared;               /* start + 1 (1회 유실) */\n}\n\nunsigned long long atomic_interleave_demo(unsigned long long start) {\n    _Atomic unsigned long long shared;\n    atomic_init(&shared, start);\n    atomic_fetch_add_explicit(&shared, 1ull, memory_order_relaxed);  /* T1 전체 */\n    atomic_fetch_add_explicit(&shared, 1ull, memory_order_relaxed);  /* T2 전체 */\n    return atomic_load_explicit(&shared, memory_order_relaxed);      /* start + 2 */\n}", "explanation_ko": "원자성과 순서는 별개의 문제다. 카운터에 필요한 것은 원자성뿐이므로 가장 싼 relaxed 를 고른다 — arm64 에서 배리어 명령이 나가지 않는다. fetch_add 가 '이전 값'을 돌려준다는 성질은 슬롯 예약(`idx = fetch_add(&tail,1)`)에도 그대로 쓰인다. 비원자 버전을 지역 변수로 흉내 낸 이유는 진짜 race 로는 결정적인 테스트를 만들 수 없기 때문이다(그리고 TSan 도 잡는다).", "complexity": "O(1) per op, lock-free (arm64 에서 LDADD 한 명령)", "pitfalls": ["`volatile unsigned c; c++` 로 충분하다고 답하기 — 원자성이 없다.", "relaxed 를 '느슨해서 값이 틀릴 수도 있다'로 오해하기 — 값은 정확하다. 보장되지 않는 건 **다른 메모리 접근과의 순서**뿐이다.", "fetch_add 반환값을 '더한 뒤 값'으로 착각하기."], "verkada_context": "GC31-E 의 LTE 재연결 횟수, 듀얼 SIM failover 횟수, 링버퍼 drop 카운터 — 여러 스레드가 올리고 텔레메트리로 업로드하는 통계값이 전부 이 패턴이다."}, {"num": 22, "slug": "stop_flag_release_acquire", "title_ko": "stop 플래그: release store / acquire load", "title_en": "Stop flag with release/acquire", "difficulty": "easy", "tags": ["atomic", "acquire-release", "volatile", "shutdown"], "prompt_ko": "종료 사유(reason 문자열 + seq)를 먼저 기록하고 stop 플래그를 `memory_order_release` 로 store 하라. 워커는 `memory_order_acquire` 로 load 해서 true 를 본 순간 reason/seq 가 완성된 상태로 보여야 한다. 같은 구조를 `volatile int` 로 만든 반례도 작성하고, 왜 그것이 틀렸는지 설명하라.", "prompt_en": "Publish a shutdown reason then release-store the stop flag; the worker acquire-loads it and must see the completed payload. Also write the volatile counter-example and explain why it is wrong.", "signature": "void stop_request(StopFlag *f, const char *reason, unsigned seq); bool stop_requested(const StopFlag *f)", "examples": [{"in": "stop_request(f, \"link-down\", 4242)", "out": "stop==true 를 본 워커는 reason==\"link-down\", seq==4242 를 반드시 본다"}], "hints": ["플래그는 '데이터가 준비됐다'는 신호다 — 데이터를 먼저 쓰고 플래그를 나중에 쓴다.", "store 는 release, load 는 acquire. 이 한 쌍이 happens-before 를 만든다.", "volatile 은 volatile 접근끼리의 순서만 지킨다. reason[] 은 비-volatile 이라 자유롭게 재배치된다."], "solution": "void stop_init(StopFlag *f) {\n    atomic_init(&f->stop, false);\n    f->reason[0] = '\\0';\n    f->seq = 0;\n}\n\nvoid stop_request(StopFlag *f, const char *reason, unsigned seq) {\n    snprintf(f->reason, sizeof f->reason, \"%s\", reason);\n    f->seq = seq;\n    atomic_store_explicit(&f->stop, true, memory_order_release);\n}\n\nbool stop_requested(const StopFlag *f) {\n    return atomic_load_explicit(&f->stop, memory_order_acquire);\n}", "explanation_ko": "release store 이전의 모든 쓰기는, 그 값을 acquire load 로 본 스레드에게 반드시 보인다. 이것이 acquire/release 의 유일한 정의이자 이 세트 전체(SPSC 링, seqlock, refcount)의 공통 뼈대다. 반대로 volatile 은 ①원자성 ②비-volatile 접근과의 순서 ③CPU 배리어 중 아무것도 주지 않는다. x86(TSO)에서는 store-store 재배치가 없어 우연히 동작하므로, 같은 코드를 Cortex-A 게이트웨이로 옮겼을 때만 터지는 최악의 버그가 된다.", "complexity": "O(1), 무락. arm64 에서 stlr / ldar 한 명령", "pitfalls": ["플래그를 먼저 세우고 데이터를 나중에 쓰기 — 순서가 뒤집히면 acquire/release 가 무의미해진다.", "`volatile bool stop` 으로 충분하다고 답하기 (이 인터뷰의 즉사 함정).", "스핀 루프에 상한이나 sleep 이 없어 CPU 를 태우기 — 배터리 제품에서 치명적.", "acquire load 없이 relaxed 로 읽고 payload 를 읽기 — 플래그만 보이고 데이터는 안 보일 수 있다."], "verkada_context": "GW31-E 는 '오프라인 30분이면 자가 재부팅'한다. 감시 스레드가 재부팅 사유를 남기고 워커들을 멈추는 경로가 정확히 이 패턴이며, 사유가 안 보이면 필드 디버깅이 불가능해진다."}, {"num": 23, "slug": "cas_max_update", "title_ko": "CAS 루프로 최대값 갱신", "title_en": "High-water mark with a CAS loop", "difficulty": "medium", "tags": ["CAS", "compare_exchange_weak", "lock-free", "high-water-mark"], "prompt_ko": "C11 에는 fetch_max 가 없다. `compare_exchange_weak` 루프로 atomic high-water mark 를 구현하라. candidate 가 현재 값보다 클 때만 갱신하고 true 를 반환한다. CAS 가 실패하면 expected 에 현재 값이 자동으로 들어온다는 규칙을 이용해 루프 안에서 절대 다시 load 하지 말 것.", "prompt_en": "There is no fetch_max in C11 — build one from a compare_exchange_weak loop. On failure the expected operand already holds the current value, so never re-load inside the loop.", "signature": "bool atomic_max_update(_Atomic unsigned *slot, unsigned candidate)", "examples": [{"in": "0 에 5,3,9,9 순서로 적용", "out": "true,false,true,false / 최종 9"}, {"in": "4스레드가 1..20000 을 무작위 순서로 밀어넣음", "out": "최종값 20000"}], "hints": ["CAS 는 '내가 읽은 값이 그대로면 바꿔라'다. 아니면 실패하고 **현재 값을 알려준다**.", "실패 후 다시 `atomic_load` 하면 안 된다 — expected(cur)가 이미 갱신되어 있다.", "성공 order 는 release(내 작업을 함께 publish), 실패 order 는 relaxed(아직 아무것도 publish 안 함). 루프 안이므로 weak."], "solution": "bool atomic_max_update(_Atomic unsigned *slot, unsigned candidate) {\n    unsigned cur = atomic_load_explicit(slot, memory_order_relaxed);\n    while (candidate > cur) {\n        // 성공: release (이 값 이전의 내 작업을 함께 publish)\n        // 실패: relaxed (아직 아무것도 publish하지 않았다) + cur에 현재값이 실린다\n        if (atomic_compare_exchange_weak_explicit(slot, &cur, candidate,\n                                                  memory_order_release,\n                                                  memory_order_relaxed))\n            return true;\n        /* 실패 → cur는 이미 갱신됨. 다시 load하지 말 것. while 조건이 재검사한다 */\n    }\n    return false;\n}", "explanation_ko": "CAS 루프는 모든 lock-free 알고리즘의 기본형이다. 'load → 새 값 계산 → CAS → 실패하면 재계산'. 여기서 핵심은 두 가지다. ① 실패 시 expected 가 자동 갱신되므로 재-load 는 불필요할 뿐 아니라 경쟁 창을 넓힌다. ② weak 는 값이 같아도 가짜 실패할 수 있지만 ARM 의 LDXR/STXR 에 그대로 매핑되어 더 싸다 — 어차피 루프 안이니 weak 가 정석이고, 루프 없는 단발 CAS 에서만 strong 을 쓴다. lock-free 지만 wait-free 는 아니다(이론상 무한 재시도 가능).", "complexity": "O(1) 기대, 경합 시 재시도. lock-free", "pitfalls": ["실패 후 `cur = atomic_load(slot)` 을 다시 호출 — 불필요하고 창만 넓힌다.", "`while (true)` 로 돌면서 `candidate \u003c= cur` 일 때 빠져나오는 조건을 빼먹기 → 무한 루프.", "weak 의 가짜 실패를 에러로 취급해 false 를 반환하기.", "실패 order 를 성공 order 보다 강하게 주기 (C 표준 위반)."], "verkada_context": "게이트웨이 텔레메트리의 '최대 큐 깊이', '최대 업로드 지연', '최저 RSRP' 같은 high-water mark. 여러 워커가 동시에 갱신하고 리포트 주기마다 읽어 올린다."}, {"num": 24, "slug": "spinlock_atomic_flag", "title_ko": "CAS 스핀락 (atomic_flag)", "title_en": "Spinlock on atomic_flag", "difficulty": "medium", "tags": ["spinlock", "atomic_flag", "acquire-release", "trade-off"], "prompt_ko": "`atomic_flag` 로 스핀락을 구현하라. lock 은 `test_and_set` 이 false 를 돌려줄 때까지 회전(acquire), unlock 은 `clear`(release). trylock 도 만든다. 그리고 **스핀락을 쓰면 안 되는 경우**를 세 가지 이상 설명하라 — 이쪽이 진짜 질문이다.", "prompt_en": "Implement a spinlock on atomic_flag with acquire on test_and_set and release on clear, plus trylock. Then explain at least three situations where a spinlock is the wrong tool.", "signature": "void spin_lock(SpinLock *l); void spin_unlock(SpinLock *l); bool spin_trylock(SpinLock *l)", "examples": [{"in": "trylock, trylock, unlock, trylock", "out": "true, false, -, true"}, {"in": "4스레드 × 100000 회 임계구역 증가", "out": "정확히 400000 (비원자 카운터인데도 안전)"}], "hints": ["`atomic_flag_test_and_set` 은 **이전 값**을 돌려준다. false 를 받았다면 내가 잡은 것이다.", "lock 은 acquire, unlock 은 release. 그래야 임계구역 안의 평범한 데이터가 보호된다.", "실전 스핀 루프에는 CPU 힌트를 넣는다: ARM `yield`/`wfe`, x86 `pause`."], "solution": "void spin_init(SpinLock *l) {\n    atomic_flag_clear_explicit(&l->held, memory_order_relaxed);\n}\n\nvoid spin_lock(SpinLock *l) {\n    // test_and_set: 이전 값을 돌려주고 true로 만든다. false를 받으면 내가 잡은 것.\n    while (atomic_flag_test_and_set_explicit(&l->held, memory_order_acquire)) {\n        /* 실전에서는 여기서 CPU 힌트를 준다: ARM `wfe`/`yield`, x86 `pause`.\n         * 이식성 때문에 여기서는 빈 루프로 둔다. */\n    }\n}\n\nbool spin_trylock(SpinLock *l) {\n    return !atomic_flag_test_and_set_explicit(&l->held, memory_order_acquire);\n}\n\nvoid spin_unlock(SpinLock *l) {\n    atomic_flag_clear_explicit(&l->held, memory_order_release);\n}", "explanation_ko": "`atomic_flag` 는 C11 에서 **항상 lock-free 가 보장되는 유일한 타입**이다(나머지는 `ATOMIC_*_LOCK_FREE` 로 확인해야 한다). acquire/release 짝 덕분에 스핀락 안의 비원자 데이터까지 안전해진다 — 락이 동기화 도구인 이유가 정확히 이것이다. 쓰면 안 되는 경우: ①임계구역이 길거나 그 안에서 블록/시스템콜/malloc → CPU 를 태운다(배터리로 도는 MT81 트레일러에서는 곧 주행거리다) ②단일 코어 + 선점형 스케줄러 → 락 보유자가 선점되면 대기자가 타임슬라이스 전체를 태우고, 최악은 우선순위 역전으로 진행 자체가 멈춘다 → mutex + priority inheritance ③유저스페이스 Linux 의 경합 상황 → futex 기반 pthread_mutex 가 대개 더 빠르다.", "complexity": "무경합 O(1), 경합 시 대기 시간만큼 CPU 소모. lock-free 가 아님(스핀락은 blocking)", "pitfalls": ["unlock 을 relaxed 로 하기 → 임계구역의 쓰기가 락 해제 뒤로 새어나간다.", "재진입(recursive) 가능하다고 생각하기 → 같은 스레드가 두 번 잡으면 즉시 데드락.", "임계구역 안에서 malloc/printf/시스템콜 호출.", "스핀 루프에 CPU 힌트(pause/yield) 없이 회전 → 하이퍼스레딩·전력에서 손해.", "ISR 과 태스크 사이에 스핀락을 쓰기 → 단일 코어면 즉시 데드락(태스크가 잡은 락을 ISR 이 기다린다)."], "verkada_context": "멀티코어 게이트웨이 SoC 에서 수십 나노초짜리 카운터/링크 상태 갱신처럼 아주 짧은 임계구역. 반대로 LTE 업로드나 파일 I/O 가 들어가는 경로는 절대 스핀락이 아니다."}, {"num": 25, "slug": "spsc_ring_push_pop", "title_ko": "SPSC 링버퍼 push/pop (release/acquire 짝)", "title_en": "Lock-free SPSC ring buffer", "difficulty": "medium", "tags": ["lock-free", "SPSC", "ring-buffer", "acquire-release", "ISR"], "prompt_ko": "모뎀 UART RX ISR(생산자 1)과 파서 태스크(소비자 1) 사이의 락 없는 링버퍼를 구현하라. 데이터 쓰기 뒤에 tail 을 release store 하고, 소비자는 tail 을 acquire load 한 뒤 데이터를 읽는다. 한 칸을 비워 full/empty 를 구분한다(용량 CAP-1). 가득 차면 false 를 반환하고 절대 블록하지 않는다.", "prompt_en": "Implement a lock-free single-producer/single-consumer ring: write the byte, then release-store the tail; the consumer acquire-loads the tail before reading. Leave one slot empty so full and empty are distinguishable. Never block — return false when full.", "signature": "bool ring_push(Ring *r, uint8_t b); bool ring_pop(Ring *r, uint8_t *out)", "examples": [{"in": "CAP=64 에 63개 push", "out": "전부 true, 64번째는 false"}, {"in": "생산자/소비자 스레드로 50000 바이트 전송", "out": "무손실, FIFO 순서 보존, 체크섬 일치"}], "hints": ["생산자는 tail 만 store 하고 소비자는 head 만 store 한다 → write-write 경합이 없다.", "자기 인덱스는 relaxed 로 읽어도 된다(나만 쓰니까). 상대 인덱스는 acquire.", "데이터 write 를 **먼저**, 인덱스 publish 를 **나중에**. 순서가 뒤집히면 소비자가 빈 칸을 읽는다."], "solution": "void ring_init(Ring *r) {\n    atomic_init(&r->head, 0u);\n    atomic_init(&r->tail, 0u);\n}\n\nbool ring_push(Ring *r, uint8_t b) {\n    unsigned t = atomic_load_explicit(&r->tail, memory_order_relaxed); /* 내가 쓴 값 */\n    unsigned next = (t + 1u) & (RING_CAP - 1u);\n    /* 소비자가 얼마나 비웠는지 본다 → acquire (소비자의 buf 읽기 완료를 본다) */\n    if (next == atomic_load_explicit(&r->head, memory_order_acquire))\n        return false;                     /* full */\n\n    r->buf[t] = b;                        /* ① 데이터 먼저 */\n    atomic_store_explicit(&r->tail, next, memory_order_release); /* ② 그 다음 publish */\n    return true;\n}\n\nbool ring_pop(Ring *r, uint8_t *out) {\n    unsigned h = atomic_load_explicit(&r->head, memory_order_relaxed); /* 내가 쓴 값 */\n    /* acquire: tail을 본 뒤에 buf를 읽어야 생산자의 데이터가 보인다 */\n    if (h == atomic_load_explicit(&r->tail, memory_order_acquire))\n        return false;                     /* empty */\n\n    *out = r->buf[h];\n    atomic_store_explicit(&r->head, (h + 1u) & (RING_CAP - 1u),\n                          memory_order_release);\n    return true;\n}", "explanation_ko": "무락이 성립하는 이유를 한 문장으로: **생산자만 tail 을 쓰고 소비자만 head 를 쓰므로 write-write 경합이 구조적으로 없다.** 남는 문제는 순서뿐이고, `buf[t] = b` 다음의 release store 와 소비자의 acquire load 한 쌍이 그것을 해결한다. 이게 없으면 컴파일러나 CPU 가 순서를 바꿔 소비자가 '인덱스는 늘었는데 데이터는 아직 안 쓰인' 상태를 본다. 한 칸을 비워두는 이유는 `head == tail` 이 empty 와 full 둘 다를 뜻하는 모호성을 없애기 위해서다 — count 필드를 두면 양쪽이 쓰게 되어 SPSC 의 이점이 사라진다. ISR 에서 가득 차면 재시도하면 안 되고 drop + 카운터 증가가 정답이다.", "complexity": "push/pop 각각 O(1), 무락(wait-free), 메모리 O(CAP)", "pitfalls": ["`volatile unsigned head/tail` 로 충분하다고 답하기 — 재배치/가시성이 보장되지 않는다.", "인덱스 하나 + count 를 공유하기 → count 를 양쪽이 쓰게 되어 원자 RMW 가 필요해진다.", "가득 찬 상태에서 ISR 이 재시도/대기 → 인터럽트를 막는다. drop 하고 센다.", "데이터 write 와 인덱스 publish 순서를 바꾸기.", "MPSC 로 쓰기 — 생산자가 둘이 되는 순간 이 구현은 깨진다(Vyukov 큐나 생산자별 큐가 필요)."], "verkada_context": "GC31-E 모뎀 제어 채널(AT 커맨드/URC)과 시리얼 센서 경로. ISR 컨텍스트에서는 mutex 를 잡을 수 없으므로 이 구조가 사실상 유일한 답이다."}, {"num": 26, "slug": "ring_count_pow2_mask", "title_ko": "링버퍼 count/full/empty + power-of-two 마스킹", "title_en": "Ring count/full/empty and power-of-two masking", "difficulty": "easy", "tags": ["ring-buffer", "bit-trick", "power-of-two", "embedded"], "prompt_ko": "`is_pow2`, `idx & (cap-1)` 마스킹, 그리고 `(tail-head) & (CAP-1)` 기반 count/is_empty/is_full 을 구현하라. cap 이 2의 거듭제곱일 때 `&` 가 `%` 와 완전히 동일함을 테스트로 보이고, `is_pow2(0)` 이 false 여야 함에 주의하라.", "prompt_en": "Implement is_pow2, index masking with `& (cap-1)`, and count/empty/full derived from the unsigned difference of the two indices. Show that masking equals modulo for power-of-two capacities, and remember is_pow2(0) is false.", "signature": "bool is_pow2(unsigned x); unsigned ring_mask_index(unsigned idx, unsigned cap); unsigned ring_count(const Ring *r)", "examples": [{"in": "is_pow2(64), is_pow2(63), is_pow2(0)", "out": "true, false, false"}, {"in": "ring_mask_index(65, 64)", "out": "1 (== 65 % 64)"}, {"in": "3개 push 후 1개 pop", "out": "count == 2, is_empty == false"}], "hints": ["2의 거듭제곱은 비트가 하나뿐이다 → `x & (x-1) == 0`. 단 0 은 예외이므로 `x != 0 &&` 를 붙인다.", "`%` 는 나눗셈 명령이 없는 MCU 에서 라이브러리 호출이 된다. `&` 는 1사이클.", "count 는 **부호 없는 뺄셈**으로 구한다 — 인덱스가 랩되어도 `(t - h) & mask` 는 정확하다."], "solution": "bool is_pow2(unsigned x) {\n    return x != 0u && (x & (x - 1u)) == 0u;\n}\n\nunsigned ring_mask_index(unsigned idx, unsigned cap) {\n    return idx & (cap - 1u);\n}\n\nunsigned ring_count(const Ring *r) {\n    unsigned t = atomic_load_explicit(&r->tail, memory_order_acquire);\n    unsigned h = atomic_load_explicit(&r->head, memory_order_acquire);\n    return (t - h) & (RING_CAP - 1u);     /* unsigned 뺄셈 → 랩되어도 정확 */\n}\n\nbool ring_is_empty(const Ring *r) {\n    return ring_count(r) == 0u;\n}\n\nbool ring_is_full(const Ring *r) {\n    return ring_count(r) == RING_CAP - 1u;   /* 한 칸은 항상 비워둔다 */\n}", "explanation_ko": "cap 이 2의 거듭제곱이면 `idx % cap` 과 `idx & (cap-1)` 은 **수학적으로 동일**하다(하위 log2(cap) 비트만 남긴다). ISR 안에서 바이트마다 도는 코드라 이 차이가 실제로 처리량을 바꾼다. count 를 `(tail - head) & (CAP-1)` 로 구하면 인덱스가 uint 범위를 랩해도 결과가 정확한데, 부호 없는 뺄셈이 모듈로 2^32 연산이기 때문이다. 한 칸을 비워두는 설계이므로 full 은 `count == CAP-1` 이다. `is_pow2(0)` 함정은 `0 & (0-1) == 0` 이라 0 을 2의 거듭제곱으로 착각하는 것 — init 에서 cap 을 검증하지 않으면 마스킹 전체가 무너진다.", "complexity": "전부 O(1), 분기·나눗셈 없음", "pitfalls": ["`is_pow2(0)` 이 true 가 되도록 짜기 (`x != 0 &&` 누락).", "cap 이 2의 거듭제곱인지 init 에서 검증하지 않기 → 마스킹이 조용히 틀린 인덱스를 준다.", "count 를 `tail >= head ? tail-head : cap-head+tail` 같은 분기로 짜기 — 랩 케이스에서 틀리기 쉽다.", "한 칸 비우기를 잊고 full 을 `count == CAP` 로 쓰기.", "동시 실행 중 count 를 '정확한 값'으로 믿기 — 스냅샷일 뿐이다(생산자/소비자 각자 자기 쪽에서는 정확)."], "verkada_context": "RX 링버퍼의 여유 공간을 매 바이트 확인하는 경로. 저전력 MCU(공기질 센서 SV 급)에는 하드웨어 나눗셈기가 없어 `%` 한 번이 수십 사이클이다."}, {"num": 27, "slug": "seqlock_write", "title_ko": "seqlock write (홀수/짝수 + release fence)", "title_en": "Seqlock write side", "difficulty": "medium", "tags": ["seqlock", "fence", "latest-value", "real-time"], "prompt_ko": "링크 상태(RSRP/RSRQ/uptime/SIM 슬롯)를 writer 1개가 갱신한다. seq 를 홀수로 올려 '쓰는 중'을 알리고, release fence 를 건 뒤 데이터를 기록하고, seq 를 짝수로 release store 한다. writer 는 reader 때문에 절대 지연되면 안 된다.", "prompt_en": "One writer publishes a link-status snapshot: bump seq to odd, release-fence, write the payload, then release-store an even seq. The writer must never be delayed by readers.", "signature": "void seq_write(SeqLock *s, const LinkStatus *in)", "examples": [{"in": "init 직후", "out": "seq == 0 (짝수 = 안정)"}, {"in": "seq_write 1회", "out": "seq == 2, seq_writing() == false"}], "hints": ["홀수 = 쓰는 중, 짝수 = 안정. write 1회당 seq 는 정확히 2 증가한다.", "첫 번째 fence 가 없으면 reader 가 '짝수 seq' 를 본 채로 반쯤 쓰인 데이터를 복사하고도 검증을 통과한다.", "마지막 store 는 release — 데이터 기록이 짝수 publish 보다 먼저 보여야 한다."], "solution": "void seq_init(SeqLock *s) {\n    atomic_init(&s->seq, 0u);\n    memset(&s->data, 0, sizeof s->data);\n}\n\nvoid seq_write(SeqLock *s, const LinkStatus *in) {\n    uint32_t v = atomic_load_explicit(&s->seq, memory_order_relaxed);\n    atomic_store_explicit(&s->seq, v + 1u, memory_order_relaxed);  /* 홀수: 쓰는 중 */\n    atomic_thread_fence(memory_order_release);   /* seq 증가가 데이터보다 먼저 보이게 */\n\n    s->data = *in;                               /* 평범한 쓰기 (여기가 race 지점) */\n\n    /* 데이터 기록이 짝수 publish보다 먼저 보이게 */\n    atomic_store_explicit(&s->seq, v + 2u, memory_order_release);  /* 짝수: 완료 */\n}\n\nbool seq_writing(const SeqLock *s) {\n    return (atomic_load_explicit(&s->seq, memory_order_relaxed) & 1u) != 0u;\n}", "explanation_ko": "seqlock 은 '읽기는 매우 잦고 쓰기는 드문' 상태 공유에서 writer 를 절대 막지 않는 패턴이다(writer 우선 정책, reader 가 재시도한다). 두 개의 배리어가 서로 다른 일을 한다. ① `store(seq, odd, relaxed)` 뒤의 **release fence**: 'seq 가 홀수가 된 사실'이 데이터 기록보다 먼저 보이게 해서, reader 가 진행 중인 쓰기를 놓치지 않게 한다. ② 마지막 **release store**: 데이터 기록이 '짝수 seq publish' 보다 먼저 보이게 한다. 둘 중 하나라도 빠지면 reader 의 검증이 통과하면서도 찢어진 값을 준다. writer 가 여러 명이면 writer 끼리는 mutex 로 직렬화해야 한다 — seqlock 은 reader 를 위한 도구지 writer 를 위한 도구가 아니다.", "complexity": "write O(sizeof payload), 블로킹 없음(wait-free)", "pitfalls": ["첫 release fence 를 빼기 → reader 가 짝수 seq + 반쯤 쓰인 데이터를 보고 통과한다.", "seq 를 1씩만 올려 홀짝 규약을 깨기.", "writer 를 여러 개로 늘리면서 writer 간 직렬화를 안 하기.", "payload 에 포인터/핸들을 넣기 — reader 가 찢어진 포인터를 역참조하면 죽는다. POD 전용.", "payload 를 `_Atomic` 구조체로 만들면 되겠지라고 생각하기 → 큰 구조체는 lock-free 가 아니라 내부 락이 붙는다."], "verkada_context": "GC31-E 링크 상태(RSRP/RSRQ, SIM 슬롯, uptime)를 1초마다 갱신하는 모뎀 스레드. HTTP 핸들러·CLI·텔레메트리 업로더가 수시로 읽지만 모뎀 스레드는 절대 그들을 기다리면 안 된다."}, {"num": 28, "slug": "seqlock_read", "title_ko": "seqlock read (재시도 루프) + data race 한계", "title_en": "Seqlock read side and its data-race caveat", "difficulty": "hard", "tags": ["seqlock", "retry-loop", "data-race", "TSan"], "prompt_ko": "seq 를 acquire load 해서 홀수면 재시도하고, 데이터를 복사한 뒤 acquire fence 를 걸고 seq 를 다시 읽어 두 값이 같을 때만 유효한 스냅샷으로 인정하는 reader 를 구현하라. 재시도 상한이 있는 `seq_try_read` 도 만든다. 이 코드가 C 표준상 **data race** 이며 TSan 이 경고한다는 사실을 명시적으로 설명할 것.", "prompt_en": "Implement the retry loop: acquire-load seq (retry while odd), copy the payload, acquire-fence, re-load seq, and accept only when both reads match. Add a bounded-retry variant, and state explicitly that this is a data race under the C model that ThreadSanitizer will flag.", "signature": "void seq_read(const SeqLock *s, LinkStatus *out); bool seq_try_read(const SeqLock *s, LinkStatus *out, unsigned max_tries)", "examples": [{"in": "write{-95,95,1,0} 직후 read", "out": "정확히 같은 값"}, {"in": "writer 120000회 + reader 3개 동시 실행", "out": "찢어진 스냅샷 0건 (불변식 rsrq == -rsrp)"}], "hints": ["두 번의 seq 읽기 사이에 데이터를 복사한다. 두 값이 다르면 그 사이에 write 가 있었다는 뜻이다.", "복사한 값이 찢어져 있어도 괜찮다 — 검증에서 걸러지고 버려진다.", "루프를 `do/while` 로 쓰면 안 된다. `continue` 가 while 조건으로 점프해서 아직 대입된 적 없는 `after` 와 비교한다 → `for(;;)` + 명시적 return."], "solution": "void seq_read(const SeqLock *s, LinkStatus *out) {\n    for (;;) {\n        uint32_t before = atomic_load_explicit(&s->seq, memory_order_acquire);\n        if (before & 1u) continue;               /* 쓰는 중 → 처음부터 다시 */\n\n        *out = s->data;                          /* 찢어진 값일 수 있다 */\n\n        atomic_thread_fence(memory_order_acquire); /* 복사가 after 로드보다 먼저 */\n        uint32_t after = atomic_load_explicit(&s->seq, memory_order_relaxed);\n        if (before == after) return;             /* 같으면 유효한 스냅샷 */\n    }\n}\n\nbool seq_try_read(const SeqLock *s, LinkStatus *out, unsigned max_tries) {\n    for (unsigned i = 0; i \u003c max_tries; i++) {\n        uint32_t before = atomic_load_explicit(&s->seq, memory_order_acquire);\n        if (before & 1u) continue;\n        *out = s->data;\n        atomic_thread_fence(memory_order_acquire);\n        uint32_t after = atomic_load_explicit(&s->seq, memory_order_relaxed);\n        if (before == after) return true;\n    }\n    return false;\n}", "explanation_ko": "reader 는 낙관적으로 읽고 사후 검증한다. 검증이 실패하면 버리고 다시 읽으므로 writer 를 막지 않는다. 정직하게 말해야 할 한계가 세 가지다. ① `*out = s->data` 는 비원자 객체를 writer 와 동시에 접근하므로 C 표준상 **data race** 이고 엄밀히는 UB 다 — `-fsanitize=thread` 로 빌드하면 TSan 이 정확히 이 줄을 지적한다. 실무 해법은 필드별 relaxed atomic 이나 Linux 커널의 READ_ONCE/WRITE_ONCE 다. ② payload 에 포인터가 있으면 찢어진 포인터를 잠시라도 역참조해 죽을 수 있다(POD 전용). ③ writer 가 너무 잦으면 reader 가 굶는다 → 재시도 상한 + mutex fallback. 이 한계들을 면접관이 묻기 전에 먼저 말하는 것이 이 문제의 핵심 득점 포인트다.", "complexity": "경합 없으면 O(sizeof payload) 1회, 경합 시 재시도. reader 는 lock-free 가 아니라 obstruction-free 에 가깝다", "pitfalls": ["`do { ... if (odd) continue; ... } while (before != after);` — `continue` 가 **초기화되지 않은 `after`** 와 비교한다. 운 나쁘면 *out 을 채우지 않고 리턴한다. 흔한 예제 코드의 실제 버그.", "홀수 검사를 빼기 → 진행 중인 write 를 그대로 복사한다.", "두 번째 seq 읽기를 데이터 복사보다 먼저 하기(또는 acquire fence 누락) → 검증이 무의미해진다.", "TSan 경고를 보고 '내 코드가 틀렸다'고 고치려다 seqlock 을 망가뜨리기 — 경고는 설계의 대가다. 스레드 테스트를 격리하거나 suppress 하고 그 사실을 문서화한다.", "재시도 상한 없이 실시간 경로에서 사용."], "verkada_context": "Command 로 올라가는 게이트웨이 상태 리포트, 로컬 진단 CLI, 웹 핸들러가 동시에 같은 링크 상태를 읽는다. 읽기 빈도가 쓰기보다 수백 배 높아 mutex 라면 모뎀 스레드가 계속 밀린다."}, {"num": 29, "slug": "atomic_refcount", "title_ko": "atomic refcount — 마지막 참조에서만 free", "title_en": "Atomic refcount with a release/acquire teardown", "difficulty": "medium", "tags": ["refcount", "release", "acquire-fence", "use-after-free", "RCU"], "prompt_ko": "불변(immutable) 설정 객체를 refcount 로 관리하라. 증가는 relaxed, 감소는 `fetch_sub(..., memory_order_release)`. 반환값이 1이면 내가 마지막 참조이므로 `atomic_thread_fence(memory_order_acquire)` 를 건 뒤에 free 한다. 왜 release 만으로는 안 되는지 설명할 것.", "prompt_en": "Manage an immutable config object with an atomic refcount: increment relaxed, decrement release, and on the last reference insert an acquire fence before free. Explain why release alone is not enough.", "signature": "void rc_get(RcConfig *c); bool rc_put(RcConfig *c, Counter *freed)", "examples": [{"in": "new → get → put → put", "out": "refs 1→2→1, 마지막 put 에서만 free(true)"}, {"in": "4스레드 × 20000 get/put, main 이 참조 1개 유지", "out": "끝나도 refs == 1, 조기 해제 0건"}], "hints": ["증가는 이미 살아있는 객체에 대한 것이라 publish 할 게 없다 → relaxed.", "감소는 '나는 이제 안 본다'는 알림이다 → 내 접근을 먼저 flush 해야 한다 → release.", "free 하는 쪽은 **남들의 접근이 나에게 보여야** 한다 → acquire. 매번 acq_rel 로 하는 대신 마지막 한 번만 fence 로 건다."], "solution": "RcConfig *rc_new(uint32_t version, const char *apn) {\n    RcConfig *c = calloc(1, sizeof *c);\n    if (!c) return NULL;\n    atomic_init(&c->refs, 1);                    /* 생성자가 참조 1개를 갖는다 */\n    c->version = version;\n    c->upload_period_ms = version * 10u;         /* 불변식: period == version*10 */\n    snprintf(c->apn, sizeof c->apn, \"%s\", apn);\n    return c;\n}\n\nvoid rc_get(RcConfig *c) {\n    atomic_fetch_add_explicit(&c->refs, 1, memory_order_relaxed);\n}\n\nbool rc_put(RcConfig *c, Counter *freed) {\n    if (atomic_fetch_sub_explicit(&c->refs, 1, memory_order_release) == 1) {\n        /* 내가 마지막 → 다른 스레드의 접근을 모두 본 뒤 해제 */\n        atomic_thread_fence(memory_order_acquire);\n        if (freed) ctr_add(freed, 1ull);\n        free(c);\n        return true;\n    }\n    return false;\n}\n\nint rc_count(const RcConfig *c) {\n    return atomic_load_explicit(&c->refs, memory_order_relaxed);\n}", "e
