de the closed range [lo,hi] and writes the start index.", "signature": "size_t ts_range(const uint64_t *ts, size_t n, uint64_t lo, uint64_t hi, size_t *out_begin);", "examples": [{"in": "{100,200,200,200,300,400,500}, [200,300]", "out": "begin=1, count=4"}, {"in": "[201,299] (사이에 아무것도 없음)", "out": "count=0"}], "hints": ["로그는 append-only 라 이미 정렬돼 있다. 그 사실을 쓰지 않으면 O(n) 스캔이 된다.", "두 함수의 차이는 비교 연산자 하나뿐이다: lower_bound 는 `\u003c`, upper_bound 는 `\u003c=`.", "중점은 `lo + (hi - lo) / 2` 로 — `(lo+hi)/2` 는 큰 인덱스에서 오버플로한다."], "solution": "size_t ts_lower_bound(const uint64_t *ts, size_t n, uint64_t key) {\n    size_t lo = 0, hi = n;                     /* 답은 항상 [lo, hi] 안에 있다 */\n    while (lo \u003c hi) {\n        size_t mid = lo + (hi - lo) / 2;       /* 오버플로 없는 중점 */\n        if (ts[mid] \u003c key) lo = mid + 1;\n        else               hi = mid;\n    }\n    return lo;\n}\nsize_t ts_upper_bound(const uint64_t *ts, size_t n, uint64_t key) {\n    size_t lo = 0, hi = n;\n    while (lo \u003c hi) {\n        size_t mid = lo + (hi - lo) / 2;\n        if (ts[mid] \u003c= key) lo = mid + 1;\n        else                hi = mid;\n    }\n    return lo;\n}\nsize_t ts_range(const uint64_t *ts, size_t n, uint64_t lo, uint64_t hi, size_t *out_begin) {\n    if (out_begin) *out_begin = 0;\n    if (!ts || n == 0 || lo > hi) return 0;\n    size_t b = ts_lower_bound(ts, n, lo);\n    size_t e = ts_upper_bound(ts, n, hi);\n    if (out_begin) *out_begin = b;\n    return (e > b) ? (e - b) : 0;\n}", "explanation_ko": "PATTERN: half-open binary search invariant. 구간 [lo,hi) 를 유지하며 '답은 항상 이 안에 있다'는 불변식으로 쓰면 off-by-one 이 사라진다. lower_bound 는 `ts[mid] \u003c key` 일 때만 lo 를 올리고, upper_bound 는 `\u003c=` 로 바꾸기만 하면 된다 — 이 한 글자 차이가 중복 타임스탬프 구간의 오른쪽 경계를 만든다. 두 경계의 차이가 곧 구간 원소 수라 별도 스캔이 필요 없다. O(log n) time, O(1) space. 캐시 관점에서도 200만 건 로그에서 선형 스캔 대비 접근 페이지 수가 압도적으로 적다.", "complexity": "O(log n) time, O(1) space", "pitfalls": ["`(lo+hi)/2` 오버플로", "lower/upper 를 같은 비교로 구현해 중복 타임스탬프에서 경계가 어긋남", "닫힌 구간/열린 구간 규약 혼동 (여기선 [lo,hi] 닫힘)", "lo > hi, 빈 배열, 범위 밖 질의 처리 누락"], "verkada_context": "\"지난 10분 로그를 줘\" 같은 Command 질의. 디바이스에 저장된 append-only 로그 링에서 시간 구간만 잘라 업로드한다."}, {"num": 78, "slug": "parse_log_line_strict", "title_ko": "로그 라인 파싱 (key=value, 잘못된 입력 거부)", "title_en": "Strict key=value log line parser", "difficulty": "medium", "tags": ["parsing", "input-validation", "no-mutation", "robustness"], "prompt_ko": "\"ts=1700000000 dev=GC31-0042 state=offline rssi=-97\" 한 줄을 구조체로 바꾼다. 입력은 신뢰할 수 없다 — 필드 누락, 모르는 키, 중복 키, 숫자 아닌 값, 범위를 벗어난 RSSI(-120..0 밖), 너무 긴 dev 는 전부 거부한다. 실패 시 *out 을 건드리지 않는다. 입력 버퍼를 변형하지 말 것(strtok_r 대신 const 포인터 수동 스캔).", "prompt_en": "Parse a key=value log line into a struct, rejecting missing/unknown/duplicate keys, malformed numbers and out-of-range RSSI, without mutating the input or leaving a partial result in *out.", "signature": "bool parse_log_line(const char *line, LogLine *out);", "examples": [{"in": "\"ts=1700000000 dev=GC31-0042 state=offline rssi=-97\"", "out": "true; ts=1700000000, dev=\"GC31-0042\", state=OFFLINE, rssi=-97"}, {"in": "\"ts=1 dev=A state=online\" (rssi 누락)", "out": "false, *out 불변"}], "hints": ["토큰 하나 = key '=' value. 공백을 건너뛰며 포인터 두 쌍(ks/ke, vs/ve)으로 잘라낸다.", "seen 비트마스크(ts=1 dev=2 state=4 rssi=8)로 중복 키를 잡고, 끝에서 0xF 인지 확인해 누락을 잡는다.", "atoi/strtol 은 실패와 0을 구분하지 못한다. 직접 스캔하며 비숫자·빈 값·오버플로를 거부하고, 전부 통과한 뒤에야 *out 에 커밋한다."], "solution": "static const char *skip_ws(const char *p) {\n    while (*p == ' ' || *p == '\\t') p++;\n    return p;\n}\nstatic bool key_is(const char *s, const char *e, const char *lit) {\n    size_t len = (size_t)(e - s);\n    return len == strlen(lit) && memcmp(s, lit, len) == 0;\n}\nstatic bool parse_u64_range(const char *s, const char *e, uint64_t *out) {\n    if (s >= e) return false;\n    uint64_t v = 0;\n    for (const char *p = s; p \u003c e; p++) {\n        if (*p \u003c '0' || *p > '9') return false;\n        uint64_t d = (uint64_t)(*p - '0');\n        if (v > (UINT64_MAX - d) / 10u) return false;\n        v = v * 10u + d;\n    }\n    *out = v;\n    return true;\n}\nstatic bool parse_i32_range(const char *s, const char *e, int *out) {\n    bool neg = false;\n    if (s \u003c e && (*s == '-' || *s == '+')) { neg = (*s == '-'); s++; }\n    uint64_t mag;\n    if (!parse_u64_range(s, e, &mag)) return false;\n    if (mag > 2147483647u) return false;\n    *out = neg ? -(int)mag : (int)mag;\n    return true;\n}\nstatic bool parse_state(const char *s, const char *e, DevState *out) {\n    static const struct { const char *name; DevState st; } tbl[] = {\n        { \"online\",   DEV_ONLINE   },\n        { \"offline\",  DEV_OFFLINE  },\n        { \"degraded\", DEV_DEGRADED },\n    };\n    for (size_t i = 0; i \u003c sizeof tbl / sizeof tbl[0]; i++) {\n        if (key_is(s, e, tbl[i].name)) { *out = tbl[i].st; return true; }\n    }\n    return false;\n}\nbool parse_log_line(const char *line, LogLine *out) {\n    if (!line || !out) return false;\n    LogLine tmp;\n    memset(&tmp, 0, sizeof tmp);\n    unsigned seen = 0;                            /* ts=1 dev=2 state=4 rssi=8 */\n\n    const char *p = skip_ws(line);\n    while (*p) {\n        const char *ks = p;\n        while (*p && *p != ' ' && *p != '\\t' && *p != '=') p++;\n        if (*p != '=') return false;              /* '=' 없는 토큰 */\n        const char *ke = p++;                     /* '=' 를 건너뛴다 */\n        const char *vs = p;\n        while (*p && *p != ' ' && *p != '\\t') p++;\n        const char *ve = p;\n        if (vs == ve) return false;               /* 값이 비었다 */\n\n        if (key_is(ks, ke, \"ts\")) {\n            if (seen & 1u) return false;          /* 중복 키 */\n            if (!parse_u64_range(vs, ve, &tmp.ts)) return false;\n            seen |= 1u;\n        } else if (key_is(ks, ke, \"dev\")) {\n            if (seen & 2u) return false;\n            size_t len = (size_t)(ve - vs);\n            if (len == 0 || len >= LOG_DEV_LEN) return false;   /* 잘림 대신 거부 */\n            memcpy(tmp.dev, vs, len);\n            tmp.dev[len] = '\\0';\n            seen |= 2u;\n        } else if (key_is(ks, ke, \"state\")) {\n            if (seen & 4u) return false;\n            if (!parse_state(vs, ve, &tmp.state)) return false;\n            seen |= 4u;\n        } else if (key_is(ks, ke, \"rssi\")) {\n            if (seen & 8u) return false;\n            if (!parse_i32_range(vs, ve, &tmp.rssi)) return false;\n            if (tmp.rssi > 0 || tmp.rssi \u003c -120) return false;  /* dBm 범위 검증 */\n            seen |= 8u;\n        } else {\n            return false;                          /* 모르는 키 */\n        }\n        p = skip_ws(p);\n    }\n    if (seen != 0xFu) return false;                /* 네 필드 모두 필수 */\n    *out = tmp;                                    /* 전부 통과한 뒤에만 커밋 */\n    return true;\n}", "explanation_ko": "PATTERN: single-pass tokenizer + commit-at-the-end. 파서는 신뢰 경계다 — 모뎀/에이전트가 뱉는 줄은 잘리거나 섞이거나 장비마다 필드가 다르다. ①const 포인터로 스캔해 입력 버퍼를 변형하지 않고(공유 링버퍼나 mmap 된 로그를 그대로 넘길 수 있다), ②임시 구조체에 채운 뒤 전부 검증되면 한 번에 *out 에 커밋하고, ③seen 비트마스크로 누락과 중복을 동시에 잡는다. 숫자 파싱을 직접 하는 이유는 atoi 가 실패와 0을 구분하지 못하기 때문이다. 오버플로도 곱하기 전에 검사한다. O(L) time, O(1) space — 줄 길이에 선형이고 버퍼를 새로 잡지 않는다.", "complexity": "O(L) time (L = line length), O(1) space (no allocation, input not mutated)", "pitfalls": ["strtok_r 로 입력 버퍼를 변형 — const/공유 버퍼면 파괴적", "실패 시 *out 에 부분 결과가 남음", "atoi/strtol 로 대충 파싱 — \"abc\" 가 0 이 된다", "중복 키를 마지막 값으로 덮어써서 조용히 통과", "모르는 키를 무시 — 스키마 변경을 놓친다", "고정 버퍼에 strcpy/snprintf 로 잘라 저장 (거부해야 한다)"], "verkada_context": "\"Extract IP Addresses\"/로그 파싱 유형. 모뎀·에이전트가 뱉는 key=value 텔레메트리 줄을 게이트웨이에서 구조체로 바꿔 업로드 전에 검증한다."}]}]}</script>
<script>

  solved:'verkada_solved_v1', theme:'verkada_theme', open:'verkada_open_v1'
};

/* ================= helpers ================= */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }

/* --- C syntax highlight (operates on raw source) --- */
const C_KW = new Set(['if','else','for','while','do','switch','case','default','break','continue','return','goto','sizeof','typedef','struct','union','enum','static','const','volatile','extern','register','inline','restrict','_Atomic','_Bool','_Static_assert']);
const C_TY = new Set(['int','char','short','long','float','double','void','unsigned','signed','bool','size_t','ssize_t','ptrdiff_t','intptr_t','uintptr_t','uint8_t','uint16_t','uint32_t','uint64_t','int8_t','int16_t','int32_t','int64_t','FILE','va_list']);
function hlC(code){
  let s = esc(code);
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(&quot;(?:[^&\\]|\\.|&(?!quot;))*?&quot;)|('(?:\\.|[^'])*')|(^[ \t]*#[^\n]*)|(\b0[xX][0-9a-fA-F]+[uUlL]*\b|\b\d+\.?\d*[uUlLfF]*\b)|([A-Za-z_]\w*)/gm;
  return s.replace(re,(m,cmt,str,chr,pre,num,word)=>{
    if(cmt) return '<span class="c-cmt">'+cmt+'</span>';
    if(str) return '<span class="c-str">'+str+'</span>';
    if(chr) return '<span class="c-str">'+chr+'</span>';
    if(pre) return '<span class="c-pre">'+pre+'</span>';
    if(num) return '<span class="c-num">'+num+'</span>';
    if(word){ if(C_KW.has(word)) return '<span class="c-kw">'+word+'</span>';
              if(C_TY.has(word)) return '<span class="c-ty">'+word+'</span>'; return word; }
    return m;
  });
}

/* --- minimal markdown (headings, code fences, tables, lists, quotes, inline) --- */
function mdInline(t){
  return t
    .replace(/`([^`]+)`/g,(m,c)=>'<code>'+c+'</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src){
  if(!src) return '';
  const lines = src.replace(/\r/g,'').split('\n');
  let out=[], i=0, para=[], listType=null, tbl=[];
  const flushP=()=>{ if(para.length){ out.push('<p>'+mdInline(esc(para.join(' ')))+'</p>'); para=[]; } };
  const flushL=()=>{ if(listType){ out.push('</'+listType+'>'); listType=null; } };
  const flushT=()=>{
    if(!tbl.length) return;
    const rows = tbl.filter(r=>!/^\s*\|?[\s:|-]+\|?\s*$/.test(r));
    const cells = r => r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim());
    let h='<table>';
    if(rows.length){ h+='<thead><tr>'+cells(rows[0]).map(c=>'<th>'+mdInline(esc(c))+'</th>').join('')+'</tr></thead>'; }
    h+='<tbody>';
    for(let k=1;k<rows.length;k++){ h+='<tr>'+cells(rows[k]).map(c=>'<td>'+mdInline(esc(c))+'</td>').join('')+'</tr>'; }
    h+='</tbody></table>'; out.push(h); tbl=[];
  };
  while(i<lines.length){
    let ln = lines[i];
    // fenced code
    const fence = ln.match(/^```(\w*)/);
    if(fence){ flushP(); flushL(); flushT();
      const lang=fence[1]; let buf=[]; i++;
      while(i<lines.length && !/^```/.test(lines[i])){ buf.push(lines[i]); i++; }
      i++; const raw=buf.join('\n');
      const body = (lang===''||/^c(pp|xx)?$/i.test(lang)) ? hlC(raw) : esc(raw);
      out.push('<pre class="code"><code>'+body+'</code></pre>'); continue;
    }
    if(/^\s*\|.*\|/.test(ln)){ flushP(); flushL(); tbl.push(ln); i++; continue; } else if(tbl.length) flushT();
    if(/^\s*$/.test(ln)){ flushP(); flushL(); i++; continue; }
    let m;
    if(m=ln.match(/^(#{1,6})\s+(.*)$/)){ flushP(); flushL(); const lv=m[1].length; out.push('<h'+lv+'>'+mdInline(esc(m[2]))+'</h'+lv+'>'); i++; continue; }
    if(/^\s*([-*_])\1{2,}\s*$/.test(ln)){ flushP(); flushL(); out.push('<hr>'); i++; continue; }
    if(m=ln.match(/^\s*>\s?(.*)$/)){ flushP(); flushL(); out.push('<blockquote>'+mdInline(esc(m[1]))+'</blockquote>'); i++; continue; }
    if(m=ln.match(/^\s*[-*+]\s+(.*)$/)){ flushP(); if(listType!=='ul'){ flushL(); out.push('<ul>'); listType='ul'; } out.push('<li>'+mdInline(esc(m[1]))+'</li>'); i++; continue; }
    if(m=ln.match(/^\s*\d+\.\s+(.*)$/)){ flushP(); if(listType!=='ol'){ flushL(); out.push('<ol>'); listType='ol'; } out.push('<li>'+mdInline(esc(m[1]))+'</li>'); i++; continue; }
    para.push(ln.trim()); i++;
  }
  flushP(); flushL(); flushT();
  return out.join('\n');
}

/* ================= progress ================= */
function topicSolved(t){ return t.problems.reduce((n,p)=> n + (solved.has(pkey(t.id,p.num))?1:0), 0); }
function allProblems(){ let a=[]; for(const t of TOPICS) for(const p of t.problems) a.push({t,p}); return a; }
function updateProgress(){
  const all=allProblems(); const tot=all.length; const sv=all.filter(x=>solved.has(pkey(x.t.id,x.p.num))).length;
  const pct = tot? Math.round(sv*100/tot):0;
  document.getElementById('ovSolved').textContent=sv;
  document.getElementById('ovTotal').textContent=tot;
  document.getElementById('mPct').textContent=pct;
  document.getElementById('mTotal').textContent=tot;
  document.getElementById('mEasy').textContent=all.filter(x=>x.p.difficulty==='easy').length;
  document.getElementById('mMed').textContent=all.filter(x=>x.p.difficulty==='medium').length;
  document.getElementById('mHard').textContent=all.filter(x=>x.p.difficulty==='hard').length;
  const C=131.9; document.getElementById('ovRing').style.strokeDashoffset = C*(1-pct/100);
  // rail bars
  document.querySelectorAll('.nav-item[data-topic]').forEach(n=>{
    const t=TOPICS.find(x=>x.id===n.dataset.topic); const s=topicSolved(t); const tt=t.problems.length;
    n.querySelector('.nav-count').innerHTML='<b>'+s+'</b>/'+tt;
    n.querySelector('.nav-bar > i').style.width=(tt?s*100/tt:0)+'%';
  });
}

/* ================= problem card ================= */
function difficultyRank(d){ return d==='easy'?0:d==='medium'?1:2; }
function card(t,p){
  const id=pkey(t.id,p.num); const isSolved=solved.has(id); const isOpen=openCards.has(id);
  const c=el('<div class="card'+(isSolved?' solved':'')+(isOpen?' open':'')+'"></div>');
  const tags=(p.tags||[]).slice(0,4).map(x=>'<span class="tag">'+esc(x)+'</span>').join('');
  const head=el('<div class="chead">'
    +'<span class="pnum">'+esc(t.icon)+' '+(p.num<10?('0'+p.num):p.num)+'</span>'
    +'<span class="diff '+esc(p.difficulty)+'">'+esc(p.difficulty)+'</span>'
    +'<span class="ctitles"><div class="ctitle">'+esc(p.title_ko)+'</div>'
      +'<div class="csub">'+esc(p.title_en)+(p.slug?(' · '+esc(p.slug)):'')+'</div></span>'
    +'<span class="ctags">'+tags+'</span>'
    +'<button class="solvebox" title="mark solved" aria-label="mark solved">'
      +'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>'
    +'<svg class="cchevron" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6" stroke-linecap="round"/></svg>'
    +'</div>');
  // solve toggle
  head.querySelector('.solvebox').addEventListener('click',(e)=>{
    e.stopPropagation();
    if(solved.has(id)) solved.delete(id); else solved.add(id);
    saveSolved(); c.classList.toggle('solved', solved.has(id)); updateProgress();
  });
  // expand toggle
  head.addEventListener('click',()=>{
    c.classList.toggle('open');
    if(c.classList.contains('open')) openCards.add(id); else openCards.delete(id);
    saveOpen();
    if(c.classList.contains('open') && !c.dataset.built){ c.appendChild(body()); c.dataset.built='1'; }
  });
  c.appendChild(head);
  function body(){
    const b=el('<div class="cbody"></div>');
    // prompt
    b.appendChild(el('<div class="sec"><span class="eyebrow lbl">Problem</span>'
      +'<div class="prompt-ko">'+esc(p.prompt_ko)+'</div>'
      +(p.prompt_en?'<div class="prompt-en">'+esc(p.prompt_en)+'</div>':'')+'</div>'));
    if(p.signature) b.appendChild(el('<div class="sec"><span class="eyebrow lbl">Signature</span><div class="sig">'+esc(p.signature)+'</div></div>'));
    if(p.examples&&p.examples.length){
      let rows=p.examples.map(e=>'<tr><td>'+esc(e.in)+'</td><td>'+esc(e.out)+'</td></tr>').join('');
      b.appendChild(el('<div class="sec"><span class="eyebrow lbl">Examples</span>'
        +'<table class="ex"><thead><tr><th>input</th><th>output</th></tr></thead><tbody>'+rows+'</tbody></table></div>'));
    }
    if(p.hints&&p.hints.length){
      const hs=el('<div class="sec"><span class="eyebrow lbl">Hints</span><div class="hints"></div></div>');
      const wrap=hs.querySelector('.hints');
      p.hints.forEach((h,idx)=>{
        const hi=el('<div class="hint"><button class="hb">hint '+(idx+1)+'</button><span class="ht">'+esc(h)+'</span></div>');
        hi.querySelector('.hb').addEventListener('click',()=>hi.classList.add('rev'));
        wrap.appendChild(hi);
      });
      b.appendChild(hs);
    }
    // solution
    const sol=el('<div class="sec"><span class="eyebrow lbl">Solution</span>'
      +'<button class="reveal-sol">▶ 정답 코드 보기 (reveal solution)</button>'
      +'<div class="solwrap"></div></div>');
    const sw=sol.querySelector('.solwrap');
    sol.querySelector('.reveal-sol').addEventListener('click',(e)=>{
      const shown=sw.classList.toggle('show'); e.target.textContent = shown?'▼ 정답 코드 숨기기 (hide)':'▶ 정답 코드 보기 (reveal solution)';
      if(shown && !sw.dataset.built){
        const box=el('<div class="codebox"><div class="codebar"><span class="fn">'+esc(p.slug||('problem_'+p.num))+'.c</span>'
          +'<button class="copybtn">copy</button></div><pre class="code"><code>'+hlC(p.solution||'')+'</code></pre></div>');
        box.querySelector('.copybtn').addEventListener('click',()=>{
          navigator.clipboard.writeText(p.solution||'').then(()=>{ const b2=box.querySelector('.copybtn'); b2.textContent='copied ✓'; setTimeout(()=>b2.textContent='copy',1400); });
        });
        sw.appendChild(box);
        if(p.explanation_ko) sw.appendChild(el('<div class="sec"><span class="eyebrow lbl">해설 · Explanation</span><div class="prompt-ko">'+esc(p.explanation_ko)+'</div></div>'));
        if(p.complexity) sw.appendChild(el('<div class="sec"><span class="eyebrow lbl">Complexity</span><div class="complexity">'+esc(p.complexity)+'</div></div>'));
        sw.dataset.built='1';
      }
    });
    b.appendChild(sol);
    if(p.pitfalls&&p.pitfalls.length){
      b.appendChild(el('<div class="sec"><span class="eyebrow lbl">함정 · Pitfalls</span><ul class="pit">'
        +p.pitfalls.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>'));
    }
    if(p.verkada_context){
      b.appendChild(el('<div class="sec"><div class="callout"><span class="eyebrow lbl">Verkada context</span>'+esc(p.verkada_context)+'</div></div>'));
    }
    return b;
  }
  if(isOpen){ c.appendChild(body()); c.dataset.built='1'; }
  return c;
}

/* ================= views ================= */
function passFilter(p){
  if(diffFilter!=='all' && p.difficulty!==diffFilter) return false;
  return true;
}
function toolbar(scopeLabel){
  const tb=el('<div class="toolbar"></div>');
  const chips=[['all','All'],['easy','Easy'],['medium','Med'],['hard','Hard']];
  for(const [v,lbl] of chips){
    const ch=el('<button class="chip d-'+v+(diffFilter===v?' on':'')+'">'+lbl+'</button>');
    ch.addEventListener('click',()=>{ diffFilter=v; render(); });
    tb.appendChild(ch);
  }
  const uns=el('<button class="chip'+(unsolvedOnly?' on':'')+'">미해결만 · unsolved</button>');
  uns.addEventListener('click',()=>{ unsolvedOnly=!unsolvedOnly; render(); });
  tb.appendChild(uns);
  tb.appendChild(el('<div class="tb-spacer"></div>'));
  tb.appendChild(el('<div class="tb-note">'+scopeLabel+'</div>'));
  return tb;
}
function renderCards(container, list){
  if(!list.length){ container.appendChild(el('<div class="empty">조건에 맞는 문제가 없습니다 · no problems match the filter</div>')); return; }
  const wrap=el('<div class="cards"></div>');
  for(const {t,p} of list) wrap.appendChild(card(t,p));
  container.appendChild(wrap);
}

function renderTopic(t){
  const c=document.getElementById('content'); c.innerHTML='';
  c.appendChild(el('<div class="view-head"><span class="eyebrow">'+esc(t.range||'')+' · Problem Set '+String(t.order).padStart(2,'0')+'</span>'
    +'<h1>'+esc(t.icon)+' '+esc(t.title_ko)+'</h1><div class="en">'+esc(t.title_en)+'</div>'
    +'<p>'+esc(t.summary_ko||'')+'</p>'
    +(t.verkada_relevance_ko?'<div class="callout" style="margin-top:14px"><span class="eyebrow lbl">왜 Verkada 면접에 나오나</span>'+esc(t.verkada_relevance_ko)+'</div>':'')
    +'</div>'));
  // concepts
  if(t.concepts&&t.concepts.length){
    const band=el('<div><div class="section-band"><span class="eyebrow">Concept cheatsheet</span><span class="bar"></span></div></div>');
    const g=el('<div class="concepts"></div>');
    for(const k of t.concepts) g.appendChild(el('<div class="concept"><div class="term">'+esc(k.term)+'</div>'
      +'<div class="ko">'+esc(k.ko||'')+'</div>'+(k.en?'<div class="en">'+esc(k.en)+'</div>':'')+'</div>'));
    band.appendChild(g); c.appendChild(band);
  }
  // problems
  let list=t.problems.filter(passFilter).filter(p=>!unsolvedOnly||!solved.has(pkey(t.id,p.num))).map(p=>({t,p}));
  const solvedN=topicSolved(t);
  c.appendChild(el('<div class="section-band"><span class="eyebrow">Problems · '+solvedN+'/'+t.problems.length+' solved</span><span class="bar"></span></div>'));
  c.appendChild(toolbar(list.length+' shown'));
  renderCards(c, list);
  // note
  if(t.study_note_md){
    c.appendChild(el('<div class="section-band"><span class="eyebrow">Study note</span><span class="bar"></span></div>'));
    c.appendChild(el('<div class="note">'+md(t.study_note_md)+'</div>'));
  }
  c.appendChild(foot());
}

function renderSearch(){
  const c=document.getElementById('content'); c.innerHTML='';
  const q=query.toLowerCase();
  const match=({t,p})=>{
    const hay=[p.title_ko,p.title_en,p.slug,(p.tags||[]).join(' '),p.prompt_ko,p.prompt_en,t.title_ko,t.title_en].join(' ').toLowerCase();
    return hay.includes(q);
  };
  let list=allProblems().filter(match).filter(x=>passFilter(x.p)).filter(x=>!unsolvedOnly||!solved.has(pkey(x.t.id,x.p.num)));
  c.appendChild(el('<div class="view-head"><span class="eyebrow">Search</span><h1>“'+esc(query)+'”</h1>'
    +'<div class="en">'+list.length+' matches across '+TOPICS.length+' problem sets</div></div>'));
  c.appendChild(toolbar(list.length+' shown'));
  renderCards(c, list);
  c.appendChild(foot());
}

/* ---- timed mock (45-min phone-screen simulation) ---- */
function fmtTime(s){ const m=Math.floor(s/60), ss=s%60; return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }
function stopMockInterval(){ if(mockTimer){ clearInterval(mockTimer); mockTimer=null; } }
function updateTimerUI(){
  const clk=document.getElementById('mockClock'); if(!clk) return;
  clk.textContent=fmtTime(mockRemaining);
  clk.classList.toggle('warn', mockRemaining<=300 && mockRemaining>0);
  clk.classList.toggle('over', mockRemaining===0);
  const st=document.getElementById('mockState');
  if(st) st.textContent = mockRemaining===0 ? 'TIME UP' : (mockRunning ? 'RUNNING' : 'PAUSED');
}
function tickMock(){ if(mockRemaining>0) mockRemaining--; if(mockRemaining===0){ stopMockInterval(); mockRunning=false; } updateTimerUI(); }
function startMock(){ if(mockRunning || mockRemaining===0) return; mockRunning=true; stopMockInterval(); mockTimer=setInterval(tickMock,1000); updateTimerUI(); }
function pauseMock(){ if(!mockRunning && !mockTimer) return; mockRunning=false; stopMockInterval(); updateTimerUI(); }
function resetMock(){ pauseMock(); mockRemaining=45*60; updateTimerUI(); }
function resolveRef(ref){ const t=TOPICS.find(x=>x.id===ref.topic); if(!t) return null; const p=t.problems.find(pp=>pp.num===ref.num); return p?{t,p}:null; }

function renderMock(){
  const c=document.getElementById('content'); c.innerHTML='';
  const sets=(DATA.mocks||[]);
  c.appendChild(el('<div class="view-head"><span class="eyebrow">Timed Mock · 45:00</span><h1>⏱️ 45분 모의고사</h1>'
    +'<div class="en">Phone-screen simulation — solve 3 escalating problems in 45 minutes</div>'
    +'<p>타이머를 켜고 시간 압박 속에서 연습하세요. 타이머를 켜고 정답을 보지 말고, 시간 압박 속에서 <b>3번까지 완주</b>하는 연습을 하세요. 각 문제는 카드로 열어 stub을 보고, 터미널에서 <span class="mono">make prob N=…</span> 로 실제 구현하세요.</p></div>'));
  if(!sets.length){ c.appendChild(el('<div class="empty">모의세트가 아직 없습니다. DSA 문제 생성 후 data/mocks.json 이 추가되면 여기에 나타납니다.</div>')); c.appendChild(foot()); return; }
  if(mockSetIdx>=sets.length) mockSetIdx=0;
  const bar=el('<div class="mockbar">'
    +'<div class="clockwrap"><div id="mockClock" class="clock">'+fmtTime(mockRemaining)+'</div><div id="mockState" class="eyebrow">PAUSED</div></div>'
    +'<div class="mockbtns"><button class="tbtn start">▶ 시작</button><button class="tbtn pause">⏸ 일시정지</button><button class="tbtn reset">↺ 리셋</button></div>'
    +'</div>');
  bar.querySelector('.start').addEventListener('click',startMock);
  bar.querySelector('.pause').addEventListener('click',pauseMock);
  bar.querySelector('.reset').addEventListener('click',resetMock);
  c.appendChild(bar);
  const sel=el('<div class="toolbar"></div>');

function renderDrill(){
  const c=document.getElementById('content'); c.innerHTML='';
  const guide = `# ⚡ 기계적 연습 가이드 (How to Drill)

문제 은행은 **stub → 직접 구현 → 컴파일 → PASS/FAIL 확인**의 반복 루프로 설계돼 있다. 손이 기억할 때까지 반복하는 것이 목표다.

## 파일 구조
- \`problems/NN_topic.c\` — **연습용 stub.** 함수 시그니처 + \`// TODO\` + 테스트 하네스. 여기에 직접 구현한다.
- \`solutions/NN_topic.c\` — **정답.** 막히면 참고. 모든 테스트 PASS.
- \`notes/NN_topic.md\` — 스터디 노트(이 대시보드의 Study note와 동일).
- \`data/*.json\` — 이 대시보드가 읽는 데이터.

## 하루 루틴 (권장)
1. 대시보드에서 오늘의 토픽을 열고 **개념 치트시트 + 노트**를 5분 훑는다.
2. 터미널에서 stub을 연다: \`problems/NN_topic.c\`
3. 함수를 위에서부터 직접 구현. **정답을 먼저 보지 말 것.**
4. 컴파일 + 실행:
   \`\`\`sh
   make prob N=01_bit_basics     # 내 연습 파일 실행 → FAIL이 PASS로 바뀌는지 확인
   \`\`\`
5. 3분 막히면 대시보드에서 **hint 1 → 2 → 3** 순서로만 연다.
6. 그래도 막히면 **정답 코드 보기**. 이해한 뒤 stub을 지우고 **다시 맨손으로** 구현.
7. 다 풀면 카드의 체크박스로 **solved** 표시 → 진행률이 저장된다(localStorage).

## 명령어
\`\`\`sh
make list                    # 토픽 목록
make prob N=05_circular_buffer   # 연습 파일 컴파일+실행
make sol  N=05_circular_buffer   # 정답 컴파일+실행 (전부 PASS 확인)
make test                    # 모든 정답 회귀 테스트
make clean
\`\`\`

## 우선순위 (2026-09-15 리크루터 안내 기준)
1. **02 동기화 & 큐** — bounded blocking queue는 거의 확실히 나온다. 백지에서 45분 안에.
2. **04 실시간 버퍼링** — 메일이 "double buffering"을 예시로 직접 언급했다.
3. **07 모듈화·테스트 설계** — "하드웨어 없이 어떻게 테스트하나"는 반드시 나온다.
4. **01 스레드 & 뮤텍스 / 03 atomic & lock-free** — volatile vs atomic, memory order 개념 질문.
5. **06 네트워크·프로토콜 파싱** — Connectivity 팀 도메인(IP, AT 커맨드, 프레이밍).
6. **05 임베디드 Linux I/O** — epoll/timerfd/EINTR. 게이트웨이 데몬의 실제 코드.
7. **08 실전 DSA** — LRU·인터벌·top-k. 보고된 코딩 문제 유형.

> **핵심:** 이 세션은 알고리즘 퍼즐이 아니라 **동시성 자료구조 구현 + 설계 설명**이다.
> 코드가 돌아가는 것만으로는 부족하고, *왜 이 설계인지*를 말로 설명해야 한다.
> 세트별 노트의 "면접에서 말할 것" 섹션을 소리 내어 연습할 것.`;
  c.appendChild(el('<div class="view-head"><span class="eyebrow">Briefing · 03</span><h1>⚡ 연습 가이드</h1><div class="en">How to Drill — mechanical practice loop</div></div>'));
  c.appendChild(el('<div class="note">'+md(guide)+'</div>'));
  c.appendChild(foot());
}

/* ================= router ================= */
function render(){
  if(view!=='mock') pauseMock();   // stop the countdown when navigating away
  markActiveNav();
  if(query){ renderSearch(); return; }
  if(view==='mock') return renderMock();
  if(view==='companies') return renderCompanies();
  if(view==='profile') return renderProfile();
  if(view==='overview') return renderOverview();
  if(view==='roles') return renderRoles();
  if(view==='interview') return renderInterview();
  if(view==='drill') return renderDrill();
  const t=TOPICS.find(x=>x.id===view);
  if(t) return renderTopic(t);
  renderOverview();
}
function setView(v){ view=v; window.scrollTo(0,0); document.querySelector('.content').scrollTop=0; render(); }
