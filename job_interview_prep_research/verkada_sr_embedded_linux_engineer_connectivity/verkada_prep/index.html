onst uint8_t TBL[AQ_S__COUNT][AQ_E__COUNT] = {\n    /*              START           DATA_RDY      DECODED       RETRY      FAIL        RECOVER      */\n    /* IDLE      */{AQ_S_MEASURING, AQ_S_INVALID, AQ_S_INVALID, AQ_S_IDLE, AQ_S_FAULT, AQ_S_INVALID},\n    /* MEASURING */{AQ_S_INVALID,   AQ_S_READY,   AQ_S_INVALID, AQ_S_IDLE, AQ_S_FAULT, AQ_S_INVALID},\n    /* READY     */{AQ_S_INVALID,   AQ_S_INVALID, AQ_S_IDLE,    AQ_S_IDLE, AQ_S_FAULT, AQ_S_INVALID},\n    /* FAULT     */{AQ_S_INVALID,   AQ_S_INVALID, AQ_S_INVALID, AQ_S_INVALID, AQ_S_FAULT, AQ_S_IDLE},\n};\n```\n\n`switch` 중첩 대비 장점: ① 전이 **전체**가 한 화면에 — 화이트보드에 그대로 그릴 수\n있다 ② 빈 칸 = **명시적으로 금지된 전이** → 잘못된 순서 호출을 조용히 삼키지 않고\n`bad_transitions++` 후 거부 ③ 상태·이벤트 추가가 코드 수정이 아니라 **데이터 수정**.\n\n단점도 말할 것: 전이마다 다른 **액션**이 필요하면 테이블에 함수 포인터 열이 붙으면서\n읽기 어려워진다. 상태가 5개 이하이고 액션이 단순하면 `switch`가 더 읽기 쉽다.\n\n### 4.3 출력 파라미터 오염 금지\n\n```c\nAqErr aq_decode(const uint8_t *raw3, int16_t *out_ppb) {\n    if (crc8(raw3, 2) != raw3[2]) return AQ_ECRC;   // ★ 검증 먼저, out 은 손대지 않는다\n    *out_ppb = (int16_t)((raw3[0] \u003c\u003c 8) | raw3[1]);\n    return AQ_OK;\n}\n```\n\n**\"성공했을 때만 출력을 쓴다\"**는 규칙 하나가, 호출자가 반환값을 무시했을 때\n쓰레기 PPM 값이 클라우드로 올라가는 사고를 막는다. 카메라/게이트웨이 fleet 200만\n대에서 이런 값 하나가 오탐 알림을 만든다.\n\n---\n\n## 5. 테스트 3층 — \"하드웨어 없이 어떻게 테스트하나\"의 뼈대\n\n| 층 | 무엇을 검증 | 어떻게 | 주기 | 하드웨어 |\n|---|---|---|---|---|\n| **단위 (Unit)** | 프로토콜 파싱, CRC, 재시도/백오프 정책, 전이 테이블, 설정 검증, 타임아웃 경계 | fake HAL + 가짜 시계. 이 세트의 87개 체크 | **매 커밋 / CI**, 수 ms | **0개** |\n| **통합 (Integration)** | 실제 I2C 버스 타이밍, 클럭 스트레칭, 진짜 센서의 NACK 패턴, 드라이버+애플리케이션 결합 | HIL 랙(보드 몇 장) + pytest 러너, 전원/버스 결함 주입기 | 야간 / PR 게이트 | 소수 |\n| **시스템 (HIL / soak)** | -40~50°C 챔버, 전원 사이클, LTE·Wi-Fi 링크 단절, PoE 부하, 30분 오프라인 자가 재부팅 | 챔버 자동화 + 네트워크 결함 주입 + 장시간 soak | 야간/주간 | 랙 전체 |\n\n> **Don 연결고리**: SSD 펌웨어 시절 온도 챔버 회귀 자동화와 RF/무선 통합 테스트\n> 경험이 그대로 3층에 대응한다. \"챔버 자동화 해봤다\"는 Verkada의 -40~50°C IP66\n> 게이트웨이 맥락에서 강력한 신호다.\n\n**핵심 메시지**: 단위 층이 커버 범위의 대부분을 가져가야 한다. HIL은 비싸고 느리고\n플래키하다 → **HIL은 \"현실과 fake가 여전히 같은가\"를 확인하는 층**이지, 로직 버그를\n잡는 층이 아니다.\n\n---\n\n## 6. 흔한 함정 (인터뷰 감점 포인트)\n\n1. **시간을 주입하지 않음** — 타임아웃 테스트가 실제로 10초 걸린다. CI에서 제일 먼저 꺼진다.\n2. **`now >= start + timeout`** — 32비트 tick 랩어라운드에서 영원히 만료되지 않는다.\n3. **에러를 로그만 찍고 삼킴** — `printf(\"i2c fail\"); return 0;`. 상위가 모른다.\n4. **드라이버 안에서 `assert()`/panic** — 센서 하나 때문에 게이트웨이가 리부팅한다.\n5. **검증 전에 출력 파라미터를 씀** — CRC 실패해도 쓰레기 값이 새어나간다.\n6. **fake를 \"mock 프레임워크\"라고 부르며 동작 검증을 안 함** — 반환값만 보고 **호출 횟수/레지스터/인자**를 단정하지 않으면 레지스터를 잘못 써도 테스트가 통과한다.\n7. **로그가 malloc을 쓰거나 무한 증가** — 고정 슬롯 링 + `dropped` 카운터로 상한을 둔다.\n8. **설정 검증 없음** — 클라우드에서 `period_ms = 0` 이 내려오면 장치가 조용히 미친다.\n9. **모든 것을 인터페이스로 추상화** — 반대 방향 과잉. 인터페이스는 **치환할 이유가 있는 경계**(HW, 시간, 네트워크, 파일시스템)에만.\n10. **테스트에 스레드를 씀** — 논블로킹 스텝 API면 테스트는 단일 스레드 결정적 시퀀스로 끝난다.\n\n---\n\n## 7. 추상화 비용 — 균형 잡힌 답변\n\n*\"함수 포인터로 감싸면 느려지지 않나?\"* 는 거의 반드시 나오는 follow-up이다.\n**비용을 인정하고 → 숫자로 맥락화하고 → 언제 바꿀지 말한다.**\n\n**비용은 실재한다**:\n- 간접 호출 = 로드 1회 + 간접 분기. Cortex-M에서 대략 **2~5 cycle**, 분기 예측 실패 시 더.\n- 더 큰 비용은 **인라인 불가 + 상수 전파 손실** — 컴파일러가 호출 너머를 못 본다.\n- ops 구조체가 RAM/ROM을 몇 워드 먹고, NULL 방어 코드가 붙는다.\n- LTO/devirtualization도 vtable이 런타임에 바뀔 수 있으면 손을 못 댄다.\n\n**맥락**:\n- I2C 트랜잭션 1회 = **100~900 µs**. 400 MHz Cortex-A에서 간접 호출 3 cycle ≈ **7.5 ns**.\n  → 오버헤드 **10⁻⁵ 수준**. 측정 불가능하다.\n- 얻는 것: CI에서 매 커밋 도는 회귀 테스트, 하드웨어 없이 재현되는 버그 리포트,\n  새 센서 SKU를 어댑터 한 장으로 붙이는 능력.\n\n**언제 바꾸나** (이게 진짜 답이다):\n- 초당 수십만 회 불리는 **증명된** 핫패스(ISR 내부 바이트 처리, DMA 완료 콜백)라면\n  컴파일 타임 치환(②/③)으로 내린다.\n- 단, **프로파일 먼저**. \"추상화가 느릴 것 같아서\" 지우는 건 최적화가 아니라 추측이다.\n- 실용적 절충: **경계는 유지하되 핫패스만 직접 호출** — 링 버퍼 push 같은 안쪽 루프는\n  인라인 함수로, 버스 트랜잭션 같은 바깥 경계만 ops로.\n\n---\n\n## 8. 면접에서 말할 것 (한국어 + 영어)\n\n### 8.1 \"하드웨어 없이 어떻게 테스트하나\" — 완성 스크립트 (60~90초)\n\n**KO**\n> \"드라이버가 HAL을 직접 부르지 않게 만드는 게 출발점입니다. I2C와 **시계**, 로그를\n> 함수 포인터 구조체로 주입받게 하면, 제품에서는 진짜 HAL을, 테스트에서는 fake를 꽂을\n> 수 있습니다. 시간을 주입하면 타임아웃 경로를 **실제로 기다리지 않고** 검증할 수 있고요 —\n> 가짜 시계를 1초 앞으로 돌리면 끝입니다.\n> 그다음 재시도·백오프·CRC·상태 전이 같은 **정책은 순수 함수와 전이 테이블로 분리**해서\n> 버스 없이 단위 테스트합니다. 에러는 값으로 반환하고 절대 삼키지 않습니다.\n> 그러면 '시작 → NACK 두 번 재시도 → 준비 → CRC 실패 → 재측정 → 성공 → 타임아웃 후\n> FAULT 고착' 같은 전체 시나리오를 fake만으로 한 테스트에 담아 **밀리초 단위로 매 커밋**\n> 돌릴 수 있습니다.\n> 물론 이게 전부는 아니고 3층으로 봅니다. 단위는 fake로 CI에서, 통합은 HIL 랙에서 실제\n> 버스와 실제 센서로 야간에, 시스템은 온도 챔버와 전원 사이클·링크 단절까지. HIL은\n> **'현실이 여전히 내 fake와 같은가'를 확인하는 층**이고, 로직 버그는 단위 층에서 잡습니다.\"\n\n**EN**\n> \"The starting point is that the driver never calls the HAL directly. I inject the I2C\n> bus, **the clock**, and the logger as structs of function pointers — production plugs in\n> the real HAL, tests plug in fakes. Injecting the clock is what lets me test the timeout\n> path **without actually waiting**: I just move the fake clock forward a second.\n> Then I pull the policy out of the I/O — retry/backoff, CRC, and the state transitions\n> become pure functions and a transition table, so they're unit-testable with no bus at\n> all. Errors are returned as values; the driver never panics and never swallows them —\n> the caller owns the policy.\n> With that, a whole scenario — start, two NACK retries, ready, CRC failure, re-measure,\n> success, then a timeout that latches into FAULT — is one deterministic test that runs\n> in milliseconds on every commit.\n> That's the unit layer. Above it I'd run integration on a HIL rack with real boards and\n> real sensors nightly, and system-level tests in a temperature chamber with power cycling\n> and link drops. The HIL layer exists to confirm **my fakes still match reality** — the\n> logic bugs should already be caught by the unit layer.\"\n\n### 8.2 짧은 한 방 문장들\n\n| 상황 | KO | EN |\n|---|---|---|\n| DI 정의 | \"C에서 의존성 주입은 결국 vtable을 손으로 만드는 일입니다.\" | \"Dependency injection in C is just hand-rolling a vtable.\" |\n| 시간 | \"시간은 의존성입니다. 주입하지 않으면 타임아웃은 테스트할 수 없고, 테스트가 실제로 느려집니다.\" | \"Time is a dependency. If you don't inject it, you can't test timeouts — and your tests get as slow as your timeouts.\" |\n| 에러 | \"드라이버는 정책을 정하지 않습니다. 에러를 값으로 올리고, 재시도할지 센서를 끌지는 호출자가 정합니다.\" | \"The driver doesn't set policy. It returns errors as values; the caller decides whether to retry or shut the sensor down.\" |\n| 오염 방지 | \"검증이 끝나기 전에는 출력 파라미터를 절대 쓰지 않습니다.\" | \"Never touch the output parameter until validation has passed.\" |\n| fake 품질 | \"반환값만 보는 테스트는 약합니다. 어떤 레지스터에 몇 번 썼는지까지 단정합니다.\" | \"Asserting only the return value is weak — I assert which registers were touched and how many times.\" |\n| 비용 | \"간접 호출 3 cycle 대 I2C 트랜잭션 수백 마이크로초. 측정하기 전엔 최적화하지 않습니다.\" | \"Three cycles of indirect call against a few hundred microseconds of I2C. I don't optimize what I haven't measured.\" |\n| 과잉 추상화 방어 | \"치환할 이유가 있는 경계에만 인터페이스를 둡니다 — 하드웨어, 시간, 네트워크, 파일시스템.\" | \"I put interfaces only where there's a reason to substitute: hardware, time, network, filesystem.\" |\n| 동시성 | \"논블로킹 스텝 API면 테스트에 스레드가 필요 없습니다. 결정적인 함수 호출 시퀀스가 됩니다.\" | \"With a non-blocking step API the tests need no threads at all — it becomes a deterministic call sequence.\" |\n\n### 8.3 예상 follow-up\n\n- *\"fake가 진짜 센서와 다르면?\"* → 그래서 3층이다. fake는 **데이터시트의 계약**을\n  구현하고, HIL 층이 그 계약이 현실과 맞는지 주기적으로 검증한다. 실제 버그를 하나\n  잡으면 **먼저 fake에 그 동작을 추가해 회귀 테스트를 만들고** 고친다.\n- *\"동시성은 어떻게 테스트하나?\"* → ① 불변식 기반 스트레스(produced == consumed + dropped)\n  ② CI에 **ThreadSanitizer** ③ 결정적 재현을 위한 스케줄 훅(특정 지점에 yield 주입)\n  ④ 장시간 soak. 그리고 애초에 **논블로킹 스텝 API로 만들어 동시성을 줄인다**.\n- *\"코드 커버리지는?\"* → 라인 커버리지보다 **경로 커버리지**. 이 드라이버는 에러 경로가\n  본체이므로 NACK/타임아웃/CRC/버스오류 각각에 테스트가 하나씩 있어야 한다.\n- *\"메모리는?\"* → malloc 0회. 로그는 고정 슬롯 링 + `dropped` 카운터, 버퍼는 호출자 제공.\n\n---\n\n## 9. 체크리스트\n\n- [ ] 드라이버 코드에 `HAL_`, `printf`, `sleep`, `time()` 문자열이 **하나도 없다**\n- [ ] ops 구조체를 **값으로** 복사해 보관한다 (호출자 지역변수 수명 문제 회피)\n- [ ] 주입 안 된 ops(NULL 함수 포인터)를 방어한다\n- [ ] `deadline_expired` 를 unsigned 뺄셈으로 써서 tick 랩어라운드에 안전하다\n- [ ] 일시적 오류(NACK)와 영구 오류(BUS_ERR)가 **다른 에러 코드**로 구분된다\n- [ ] 재시도에 **예산(max_attempts)과 상한 있는 백오프**가 있다\n- [ ] 모든 에러 코드에 문자열이 있고, 범위 밖 값은 \"UNKNOWN\"\n- [ ] 상태 전이가 테이블 한 곳에 선언되고, 금지된 전이는 **거부 + 카운트**된다\n- [ ] CRC 검증이 **출력 파라미터를 쓰기 전에** 일어난다\n- [ ] 로그는 malloc 없이 고정 슬롯, 넘치면 `dropped` 를 센다\n- [ ] 설정 검증이 순수 함수이고 **이유 코드**를 돌려준다 (주기 0, 타임아웃 > 주기, 예약 주소)\n- [ ] 테스트가 **반환값 + 호출 횟수 + 레지스터/인자**까지 단정한다\n- [ ] 전체 스위트가 **스레드 0개, 1초 미만**에 끝나고 결정적이다\n- [ ] \"하드웨어 없이 어떻게 테스트하나\" 90초 스크립트를 영어로 말할 수 있다\n- [ ] 추상화 비용(간접 호출)을 숫자로 맥락화하고, **언제 벗겨낼지**를 말할 수 있다\n", "problems": [{"num": 59, "slug": "ops_injection", "title_ko": "ops 구조체 정의와 주입", "title_en": "Define and inject the ops struct", "difficulty": "easy", "tags": ["dependency-injection", "function-pointer", "driver", "i2c"], "prompt_ko": "I2cOps/ClockOps(함수 포인터 구조체)를 값으로 받아 보관하는 aq_init 과, 주입된 read 로 WHOAMI 를 확인하는 aq_probe 를 구현하라. 드라이버 코드는 HAL 함수 이름을 단 하나도 알아서는 안 된다. ops 가 NULL 인 경우도 방어한다.", "prompt_en": "Implement aq_init (store the injected I2cOps/ClockOps by value) and aq_probe (check WHOAMI through the injected read). The driver must not name a single HAL function.", "signature": "void aq_init(AqDriver *d, I2cOps i2c, ClockOps clk, uint8_t addr, uint32_t timeout_ms); AqErr aq_probe(AqDriver *d)", "examples": [{"in": "fake.whoami=0x5A, aq_probe()", "out": "AQ_OK, reads==1, last_reg==REG_WHOAMI"}, {"in": "fake.whoami=0x11", "out": "AQ_ENODEV"}], "hints": ["ops 구조체를 포인터가 아니라 '값'으로 복사해 보관하면 호출자의 지역변수여도 안전하다.", "memset 으로 드라이버 전체를 0 으로 밀면 log 필드도 NULL 이 되어 aq_log 가 자동으로 no-op 이 된다.", "aq_probe: d->i2c.read(d->i2c.ctx, d->addr, REG_WHOAMI, &id, 1) → 실패면 io_errors++ 후 AQ_EIO, id != 0x5A 면 AQ_ENODEV."], "solution": "void aq_init(AqDriver *d, I2cOps i2c, ClockOps clk, uint8_t addr, uint32_t timeout_ms) {\n    if (!d) return;\n    memset(d, 0, sizeof *d);          // log 도 0 → aq_log 는 자동으로 no-op\n    d->i2c          = i2c;            // 구조체 '값' 복사: 호출자 지역변수여도 안전\n    d->clk          = clk;\n    d->addr         = addr;\n    d->timeout_ms   = timeout_ms;\n    d->max_attempts = 3;\n    d->state        = AQ_S_IDLE;\n    d->last_io      = IO_OK;\n}\n\nAqErr aq_probe(AqDriver *d) {\n    if (!d || !d->i2c.read) return AQ_EINVAL;      // 주입 안 된 ops 방어\n    uint8_t id = 0;\n    IoStatus st = d->i2c.read(d->i2c.ctx, d->addr, REG_WHOAMI, &id, 1);\n    d->last_io = st;\n    if (st != IO_OK) { d->io_errors++; return AQ_EIO; }\n    return (id == AQ_WHOAMI) ? AQ_OK : AQ_ENODEV;\n}", "explanation_ko": "C에는 인터페이스 키워드가 없으니 함수 포인터 구조체가 곧 vtable이다. ops 를 값으로 복사해 두면 호출자가 스택에 만든 I2cOps 를 넘겨도 수명 문제가 없다. aq_probe 는 '드라이버가 HAL을 직접 부르지 않는다'를 처음으로 증명하는 동작이며, 테스트는 실제 HAL 호출 카운터가 0인지 단정해 이를 기계적으로 검증한다.", "complexity": "O(1) time, O(1) space (I2C 트랜잭션 1회)", "pitfalls": ["ops 를 포인터로 들고 있다가 호출자 지역변수가 사라져 dangling.", "주입되지 않은(NULL) 함수 포인터를 확인 없이 호출.", "aq_probe 안에서 HAL 함수를 '한 줄만' 직접 부르는 순간 테스트 불가능해진다."], "verkada_context": "공기질 센서(SV)나 게이트웨이의 전원/온도 모니터 IC 드라이버가 부팅 시 칩 ID를 확인하는 단계. 보드 없이 CI에서 도는 첫 테스트."}, {"num": 60, "slug": "fake_i2c_happy_path", "title_ko": "fake I2C 로 정상 경로 테스트", "title_en": "Happy path with a fake I2C", "difficulty": "easy", "tags": ["fake", "unit-test", "call-count", "driver"], "prompt_ko": "aq_start_measure 를 구현하라. IDLE 이 아니면 I/O 조차 내지 말고 AQ_ESTATE. REG_CMD 에 CMD_START 를 쓰고, 성공하면 주입된 시계로 op_start_ms 를 찍고 MEASURING 으로 전이한다. 테스트는 반환값뿐 아니라 쓰기 횟수·레지스터·인자까지 단정한다.", "prompt_en": "Implement aq_start_measure: write CMD_START to REG_CMD, stamp op_start_ms from the injected clock, move to MEASURING; refuse unless IDLE.", "signature": "AqErr aq_start_measure(AqDriver *d)", "examples": [{"in": "clock=4321, IDLE 에서 호출", "out": "AQ_OK, writes==1, last_val==CMD_START, op_start_ms==4321"}, {"in": "이미 MEASURING 인 상태에서 재호출", "out": "AQ_ESTATE, writes 증가 없음"}], "hints": ["상태 가드를 I/O 앞에 둬야 '거부됐는데 버스는 이미 건드린' 상황이 생기지 않는다.", "실패 시 last_io 를 기록해 두면 Q62의 should_retry 가 그대로 쓸 수 있다.", "성공 경로: op_start_ms = d->clk.now_ms(d->clk.ctx); attempt = 0; state = AQ_S_MEASURING;"], "solution": "AqErr aq_start_measure(AqDriver *d) {\n    if (!d) return AQ_EINVAL;\n    if (d->state != AQ_S_IDLE) return AQ_ESTATE;   // FAULT/진행중이면 I/O 조차 안 낸다\n\n    IoStatus st = d->i2c.write(d->i2c.ctx, d->addr, REG_CMD, CMD_START);\n    d->last_io = st;\n    if (st != IO_OK) {\n        if (st == IO_BUS_ERR) d->io_errors++;\n        return io_to_err(st);                      // NACK → AQ_EAGAIN (재시도 가능)\n    }\n    d->op_start_ms = d->clk.now_ms(d->clk.ctx);    // ★ 주입된 시계\n    d->attempt     = 0;\n    d->state       = AQ_S_MEASURING;\n    return AQ_OK;\n}", "explanation_ko": "반환값만 보는 테스트는 약하다. 레지스터 주소를 잘못 써도 fake 는 IO_OK 를 돌려주므로 AQ_OK 가 나온다. 그래서 fake 에 reads/writes/last_reg/last_val 카운터를 심고 '어떤 트랜잭션이 몇 번 나갔는지'를 단정한다. 이것이 fake 를 단순 스텁이 아니라 회귀 테스트 장치로 만든다.", "complexity": "O(1) time, I2C write 1회", "pitfalls": ["상태 가드를 I/O 뒤에 둬서 거부 상황에도 버스 트랜잭션이 나간다.", "op_start_ms 를 실제 HAL_GetTick() 으로 찍어 Q61의 타임아웃 테스트가 불가능해진다.", "NACK 를 영구 실패로 처리해 재시도 여지를 없앤다."], "verkada_context": "주기적 공기질 샘플링의 시작 커맨드. 게이트웨이가 센서를 폴링하는 루프의 첫 트랜잭션."}, {"num": 61, "slug": "clock_injection_timeout", "title_ko": "시계 주입으로 타임아웃 테스트", "title_en": "Inject the clock, test timeouts", "difficulty": "medium", "tags": ["clock-injection", "timeout", "wraparound", "polling"], "prompt_ko": "deadline_expired(start, now, timeout) 를 tick 랩어라운드에 안전한 순수 함수로 구현하고, 그것을 쓰는 aq_wait_ready 를 구현하라. aq_wait_ready 는 STATUS 를 한 번만 폴링하고 절대 블로킹하지 않는다: RDY 면 AQ_OK, 버스 오류면 AQ_EIO, 그 외에는 데드라인을 보고 AQ_ETIMEDOUT 또는 AQ_EAGAIN.", "prompt_en": "Write a wrap-safe deadline_expired() and a non-blocking aq_wait_ready() that polls STATUS once and reports EAGAIN / ETIMEDOUT using the injected clock.", "signature": "bool deadline_expired(uint32_t start_ms, uint32_t now_ms, uint32_t timeout_ms); AqErr aq_wait_ready(AqDriver *d)", "examples": [{"in": "deadline_expired(0xFFFFFF00, 0x50, 300)", "out": "true (336ms 경과 — 랩어라운드 안전)"}, {"in": "not_ready 상태에서 fake clock 을 timeout 만큼 전진", "out": "AQ_ETIMEDOUT (실제 대기 0초)"}], "hints": ["`now >= start + timeout` 은 랩 근처에서 영원히 만료되지 않는다. unsigned 뺄셈을 쓸 것.", "NACK 는 '센서가 변환 중이라 바쁨'으로 보고 미준비와 같이 취급하되, 버스 오류는 즉시 AQ_EIO.", "(uint32_t)(now_ms - start_ms) >= timeout_ms — 이 한 줄이 전부다."], "solution": "bool deadline_expired(uint32_t start_ms, uint32_t now_ms, uint32_t timeout_ms) {\n    return (uint32_t)(now_ms - start_ms) >= timeout_ms;\n}\n\nAqErr aq_wait_ready(AqDriver *d) {\n    if (!d) return AQ_EINVAL;\n    if (d->state != AQ_S_MEASURING) return AQ_ESTATE;\n\n    uint8_t status = 0;\n    IoStatus st = d->i2c.read(d->i2c.ctx, d->addr, REG_STATUS, &status, 1);\n    d->last_io = st;\n\n    if (st == IO_BUS_ERR) { d->io_errors++; return AQ_EIO; }   // 영구 오류는 즉시 보고\n    if (st == IO_OK && (status & STATUS_RDY)) return AQ_OK;\n\n    // NACK(센서가 변환 중이라 바쁨) 또는 RDY 미설정 → 데드라인 확인\n    uint32_t now = d->clk.now_ms(d->clk.ctx);\n    if (deadline_expired(d->op_start_ms, now, d->timeout_ms)) return AQ_ETIMEDOUT;\n    return AQ_EAGAIN;\n}", "explanation_ko": "시간은 의존성이다. HAL_GetTick() 을 직접 부르면 타임아웃 하나 검증하는 데 실제로 1초를 기다려야 하고, 32비트 tick 랩어라운드는 49.7일을 기다려야 재현된다. now_ms 를 주입하면 두 경우 모두 대입문 한 줄로 만들어진다. 그리고 unsigned 뺄셈은 모듈러 산술이라 랩을 자동으로 처리한다 — 덧셈으로 쓰면 오버플로해서 조건이 영영 성립하지 않는다.", "complexity": "O(1) time, I2C read 1회 (블로킹 없음)", "pitfalls": ["`now >= start + timeout` 형태로 써서 tick 랩에서 무한 대기.", "함수 안에서 sleep/HAL_Delay 를 불러 테스트가 실제로 느려진다.", "timeout_ms == 0 이면 항상 즉시 만료됨 — 설정 검증(Q67)에서 막아야 한다.", "MEASURING 이 아닌 상태에서 폴링을 허용해 상태 규약이 무너진다."], "verkada_context": "센서가 응답하지 않을 때 게이트웨이가 몇 초 안에 포기하고 FAULT 를 올려야 한다. 이 경로는 현장에서만 재현되기 쉬운데, 시계 주입으로 CI에서 매 커밋 검증한다."}, {"num": 62, "slug": "retry_policy_pure", "title_ko": "재시도/백오프 정책 분리", "title_en": "Retry and backoff as pure functions", "difficulty": "medium", "tags": ["pure-function", "retry", "backoff", "policy"], "prompt_ko": "should_retry(st, attempt, max_attempts) 와 next_delay_ms(attempt, base_ms, cap_ms) 를 I/O 없는 순수 함수로 구현하라. 일시적 실패(IO_NACK)만 예산 안에서 재시도하고, 백오프는 지수 증가하되 cap 에서 포화하며 uint32 오버플로가 없어야 한다.", "prompt_en": "Implement should_retry() and an overflow-safe, capped exponential next_delay_ms() as pure functions — testable with no bus and no clock.", "signature": "bool should_retry(IoStatus st, unsigned attempt, unsigned max_attempts); uint32_t next_delay_ms(unsigned attempt, uint32_t base_ms, uint32_t cap_ms)", "examples": [{"in": "should_retry(IO_NACK, 1, 3) / should_retry(IO_BUS_ERR, 0, 3)", "out": "true / false"}, {"in": "next_delay_ms(0..5, base=10, cap=200)", "out": "10, 20, 40, 80, 160, 200"}], "hints": ["정책을 I/O 에서 떼면 표를 그대로 테스트로 옮길 수 있다 — 버스도 시계도 필요 없다.", "IO_BUS_ERR 는 영구 오류다. 재시도해도 같은 결과이므로 상위로 올려 사람이/상위 로직이 결정하게 한다.", "백오프는 곱셈 루프 안에서 `d >= cap || d > UINT32_MAX/2` 를 먼저 보고 나서 *=2 하면 오버플로가 없다."], "solution": "bool should_retry(IoStatus st, unsigned attempt, unsigned max_attempts) {\n    if (st == IO_OK)      return false;       // 성공은 재시도 대상이 아니다\n    if (st != IO_NACK)    return false;       // 버스 오류는 영구 → 상위로 올린다\n    return attempt \u003c max_attempts;\n}\n\nuint32_t next_delay_ms(unsigned attempt, uint32_t base_ms, uint32_t cap_ms) {\n    if (base_ms == 0) return 0;\n    uint32_t d = base_ms;\n    for (unsigned i = 0; i \u003c attempt; i++) {\n        if (d >= cap_ms || d > UINT32_MAX / 2) return cap_ms;   // 상한 도달/오버플로 방지\n        d *= 2;\n    }\n    return (d > cap_ms) ? cap_ms : d;\n}", "explanation_ko": "재시도는 정책이지 메커니즘이 아니다. 드라이버 본체에 섞어두면 '3번 재시도하는지'를 확인하려고 매번 fake 버스를 돌려야 한다. 순수 함수로 빼면 진리표를 그대로 단위 테스트로 옮길 수 있고, 제품마다 다른 정책(게이트웨이는 공격적으로, 배터리 트레일러는 보수적으로)을 같은 드라이버에 주입할 수 있다. cap 은 필수다 — 상한 없는 지수 백오프는 결국 장치를 응답 불능으로 만든다.", "complexity": "should_retry O(1); next_delay_ms O(attempt) — 상한 도달 시 조기 종료", "pitfalls": ["상한 없는 지수 백오프 → 대기시간이 분 단위로 폭주.", "1u \u003c\u003c attempt 를 그대로 써서 attempt >= 32 에서 UB.", "IO_OK 를 재시도 대상에 포함시켜 성공을 다시 시도.", "재시도 예산이 없어 죽은 센서에 영원히 매달린다."], "verkada_context": "170개국 200만 대 fleet에서 재시도 정책은 곧 트래픽이다. 셀룰러 게이트웨이의 백오프 상한이 없으면 대량 장애 후 복구 시 자기 자신을 DDoS 한다."}, {"num": 63, "slug": "error_propagation", "title_ko": "에러 전파 설계", "title_en": "Propagate errors as values", "difficulty": "easy", "tags": ["error-handling", "api-design", "strerror", "robustness"], "prompt_ko": "io_to_err(버스 상태 → 드라이버 에러), aq_strerror(코드 → 문자열), aq_read_raw(데이터 3바이트 읽기)를 구현하라. 일시적(NACK→AQ_EAGAIN)과 영구(BUS_ERR→AQ_EIO)를 구분하고, 실패는 통계에 남기되 반드시 호출자에게 값으로 올린다. 실패 시 출력 버퍼는 건드리지 않는다.", "prompt_en": "Implement io_to_err, aq_strerror and aq_read_raw: distinguish transient from permanent, never swallow an error, never touch the output buffer on failure.", "signature": "AqErr io_to_err(IoStatus st); const char *aq_strerror(AqErr e); AqErr aq_read_raw(AqDriver *d, uint8_t *raw3)", "examples": [{"in": "io_to_err(IO_NACK) / io_to_err(IO_BUS_ERR)", "out": "AQ_EAGAIN / AQ_EIO"}, {"in": "bus_error 인 fake 로 aq_read_raw", "out": "AQ_EIO, raw3 미변경, io_errors==1"}], "hints": ["드라이버는 정책을 정하지 않는다. '재시도할까 센서를 끌까'는 호출자의 몫이다.", "aq_strerror 는 반드시 정적 문자열을 돌려줘야 한다(지역 배열 주소 금지).", "범위 밖 코드에도 \"UNKNOWN\" 을 돌려주면 로그가 절대 깨지지 않는다."], "solution": "AqErr io_to_err(IoStatus st) {\n    switch (st) {\n        case IO_OK:      return AQ_OK;\n        case IO_NACK:    return AQ_EAGAIN;    // 일시적 — 재시도 가능\n        case IO_BUS_ERR: return AQ_EIO;       // 영구 — 상위 결정 필요\n        default:         return AQ_EIO;\n    }\n}\n\nconst char *aq_strerror(AqErr e);                                                            // Q63\nAqErr     aq_read_raw(AqDriver *d, uint8_t *raw3);                                           // Q63\nAqState   aq_next_state(AqState s, AqEvent e);                                               // Q64\nbool      aq_fsm_apply(AqDriver *d, AqEvent e);                                              // Q64\nuint8_t   crc8(const uint8_t *data, size_t n);                                               // Q65\nAqErr     aq_decode(const uint8_t *raw3, int16_t *out_ppb);                                  // Q65\nvoid      rlog_init(RingLog *rl);                                                            // Q66\nvoid      rlog_push(RingLog *rl, LogLevel lvl, const char *msg);                             // Q66\nsize_t    rlog_count(const RingLog *rl);                                                     // Q66\nconst char *rlog_at(const RingLog *rl, size_t i);                                            // Q66\nvoid      aq_set_logger(AqDriver *d, LogOps log);                                            // Q66\nvoid      aq_log(AqDriver *d, LogLevel lvl, const char *msg);                                // Q66\nCfgErr    aq_config_validate(const AqConfig *c);                                             // Q67\nAqErr     aq_service(AqDriver *d, int16_t *out_ppb);                                         // Q68\nvoid      aq_recover(AqDriver *d);                                                           // Q68\n\n// ===========================================================================\n// 제품용(real) HAL 어댑터 — 여기가 유일하게 하드웨어를 아는 곳.\n// ---------------------------------------------------------------------------\n// 단위 테스트는 이 함수를 **절대** 부르지 않는다. g_real_hal_calls 가 0인지\n// 단정하는 것만으로 \"드라이버가 HAL을 직접 부르지 않는다\"를 기계적으로 증명한다.\n// (제품 빌드에서는 aq_hal_i2c_ops() 가 진짜 버스를 물고 온다.)\n// ===========================================================================\nstatic unsigned g_real_hal_calls = 0;\n\nstatic IoStatus real_hal_read(void *ctx, uint8_t addr, uint8_t reg, uint8_t *buf, size_t n) {\n    (void)ctx; (void)addr; (void)reg; (void)buf; (void)n;\n    g_real_hal_calls++;                 // 실제로는 HAL_I2C_Mem_Read(...)\n    return IO_BUS_ERR;\n}\n\nAqErr aq_read_raw(AqDriver *d, uint8_t *raw3) {\n    if (!d || !raw3) return AQ_EINVAL;\n    IoStatus st = d->i2c.read(d->i2c.ctx, d->addr, REG_DATA, raw3, 3);\n    d->last_io = st;\n    if (st != IO_OK) {\n        d->io_errors++;                 // 통계는 남기되 에러는 그대로 올린다\n        return io_to_err(st);\n    }\n    return AQ_OK;\n}", "explanation_ko": "임베디드 드라이버가 저지르는 최악의 두 가지는 assert() 로 장치를 죽이는 것과 printf 로 로그만 찍고 성공을 반환하는 것이다. 전자는 센서 하나 때문에 게이트웨이가 리부팅하게 만들고, 후자는 상위 레이어가 문제를 영영 모르게 만든다. 에러를 값으로 올리면 호출자가 재시도·강등·알림 중 무엇을 할지 결정할 수 있다. 통계 카운터(io_errors)는 '삼키기'가 아니라 '관측'이다 — 에러는 그대로 반환된다.", "complexity": "O(1) 전부", "pitfalls": ["로그만 찍고 AQ_OK 반환 — 에러 삼키기.", "드라이버 안에서 assert()/panic → 장치 전체가 죽는다.", "일시적과 영구를 같은 코드로 뭉개 상위가 재시도 판단을 못 한다.", "실패 경로에서 출력 버퍼를 먼저 써서 쓰레기가 남는다."], "verkada_context": "Command 클라우드에 올라가는 장치 헬스 이벤트가 이 에러 코드/문자열에서 나온다. 코드가 뭉개져 있으면 현장 진단이 불가능해진다."}, {"num": 64, "slug": "transition_table_fsm", "title_ko": "전이 테이블 기반 상태머신", "title_en": "Table-driven state machine", "difficulty": "medium", "tags": ["fsm", "transition-table", "defensive", "design"], "prompt_ko": "switch 중첩 대신 [상태][이벤트] 2차원 테이블로 전이를 선언하는 aq_next_state 와, 그것을 적용하는 aq_fsm_apply 를 구현하라. 금지된 전이는 AQ_S_INVALID 이며, 적용 시 상태를 바꾸지 않고 bad_transitions 를 센 뒤 false 를 반환한다. 인덱스 범위도 방어한다.", "prompt_en": "Declare transitions in a [state][event] table; reject illegal transitions without changing state and count them.", "signature": "AqState aq_next_state(AqState s, AqEvent e); bool aq_fsm_apply(AqDriver *d, AqEvent e)", "examples": [{"in": "aq_next_state(AQ_S_IDLE, AQ_E_START)", "out": "AQ_S_MEASURING"}, {"in": "MEASURING 에서 다시 AQ_E_START 적용", "out": "false, state 는 MEASURING 그대로, bad_transitions==1"}], "hints": ["테이블은 static const 로 두면 ROM 에 들어가고 RAM 을 안 먹는다.", "AQ_S__COUNT / AQ_E__COUNT sentinel 을 enum 에 넣어두면 테이블 크기와 범위 검사를 동시에 얻는다.", "if ((unsigned)s >= AQ_S__COUNT || (unsigned)e >= AQ_E__COUNT) return AQ_S_INVALID;"], "solution": "AqState aq_next_state(AqState s, AqEvent e) {\n    // 행 = 현재 상태, 열 = 이벤트.  AQ_S_INVALID = 금지된 전이.\n    static const uint8_t TBL[AQ_S__COUNT][AQ_E__COUNT] = {\n        /*              START           DATA_RDY      DECODED     RETRY       FAIL        RECOVER      */\n        /* IDLE      */{AQ_S_MEASURING, AQ_S_INVALID, AQ_S_INVALID, AQ_S_IDLE, AQ_S_FAULT, AQ_S_INVALID},\n        /* MEASURING */{AQ_S_INVALID,   AQ_S_READY,   AQ_S_INVALID, AQ_S_IDLE, AQ_S_FAULT, AQ_S_INVALID},\n        /* READY     */{AQ_S_INVALID,   AQ_S_INVALID, AQ_S_IDLE,    AQ_S_IDLE, AQ_S_FAULT, AQ_S_INVALID},\n        /* FAULT     */{AQ_S_INVALID,   AQ_S_INVALID, AQ_S_INVALID, AQ_S_INVALID, AQ_S_FAULT, AQ_S_IDLE},\n    };\n    if ((unsigned)s >= AQ_S__COUNT || (unsigned)e >= AQ_E__COUNT) return AQ_S_INVALID;\n    return (AqState)TBL[s][e];\n}\n\nbool aq_fsm_apply(AqDriver *d, AqEvent e) {\n    if (!d) return false;\n    AqState ns = aq_next_state(d->state, e);\n    if (ns == AQ_S_INVALID) {           // 잘못된 전이: 상태를 바꾸지 않고 거부\n        d->bad_transitions++;\n        return false;\n    }\n    d->state = ns;\n    return true;\n}", "explanation_ko": "전이를 테이블로 선언하면 ① 전체 전이가 한 화면에 들어와 화이트보드에 그대로 옮길 수 있고 ② 빈 칸이 곧 '명시적으로 금지된 전이'가 되어 잘못된 순서의 호출을 조용히 삼키지 않으며 ③ 상태/이벤트 추가가 코드 수정이 아니라 데이터 수정이 된다. 반대로 전이마다 다른 액션이 필요하면 함수 포인터 열이 붙으면서 가독성이 떨어지므로, 상태 5개 이하 + 단순 액션이면 switch 가 낫다 — 이 트레이드오프를 말할 수 있어야 한다.", "complexity": "O(1) lookup, 테이블 크기 O(states × events) ROM", "pitfalls": ["테이블 인덱스 범위 검사 누락 → 배열 밖 읽기.", "금지된 전이를 조용히 무시(반환값 없음)해 버그가 숨는다.", "sentinel 없이 0 을 '무효'로 써서 실제 상태 0 과 충돌.", "전이 테이블과 실제 코드의 직접 전이가 따로 놀아 두 진실이 생긴다."], "verkada_context": "게이트웨이의 링크 상태(연결/재시도/오프라인 30분/자가 재부팅)나 SIM failover 같은 로직이 전부 같은 모양이다. 테이블로 선언하면 리뷰와 검증이 쉬워진다."}, {"num": 65, "slug": "crc_no_leak", "title_ko": "CRC 검증과 출력 오염 차단", "title_en": "CRC first, never leak corrupt data", "difficulty": "medium", "tags": ["crc", "validation", "output-parameter", "data-integrity"], "prompt_ko": "crc8(poly 0x31, init 0xFF)을 순수 함수로 구현하고, aq_decode(raw3, out) 에서 CRC 를 **먼저** 검증해 불일치면 *out 을 건드리지 않은 채 AQ_ECRC 를 반환하라. 통과하면 big-endian 으로 조립하되 음수 값도 정확히 복원해야 한다.", "prompt_en": "Implement CRC-8 (0x31/0xFF) and a decoder that validates before it writes: on mismatch return AQ_ECRC with the output untouched.", "signature": "uint8_t crc8(const uint8_t *data, size_t n); AqErr aq_decode(const uint8_t *raw3, int16_t *out_ppb)", "examples": [{"in": "crc8({0xBE,0xEF}, 2)", "out": "0x92"}, {"in": "{0x02,0xE6,crc} / crc 한 비트 뒤집기", "out": "742 / AQ_ECRC 이고 out 은 이전 값 그대로"}], "hints": ["crc8 은 부작용이 전혀 없는 순수 함수라 알려진 벡터 하나로 단독 검증할 수 있다.", "검증 → 조립 순서를 지키는 것이 이 문제의 전부다. 조립 후 검증은 이미 늦었다.", "uint16_t 로 조립한 뒤 int16_t 로 캐스팅해야 0xFFD8 이 -40 으로 복원된다."], "solution": "uint8_t crc8(const uint8_t *data, size_t n) {\n    uint8_t crc = 0xFF;\n    for (size_t i = 0; i \u003c n; i++) {\n        crc ^= data[i];\n        for (int b = 0; b \u003c 8; b++)\n            crc = (crc & 0x80) ? (uint8_t)((crc \u003c\u003c 1) ^ 0x31) : (uint8_t)(crc \u003c\u003c 1);\n    }\n    return crc;\n}\n\nAqErr aq_decode(const uint8_t *raw3, int16_t *out_ppb) {\n    if (!raw3 || !out_ppb) return AQ_EINVAL;\n    if (crc8(raw3, 2) != raw3[2]) return AQ_ECRC;      // ★ out 은 손대지 않는다\n    uint16_t u = (uint16_t)(((uint16_t)raw3[0] \u003c\u003c 8) | raw3[1]);\n    *out_ppb = (int16_t)u;                             // big-endian, 부호 있는 값\n    return AQ_OK;\n}", "explanation_ko": "드라이버 API의 계약은 '성공했을 때만 출력을 쓴다'이다. 조립부터 하고 나중에 검증하면, 호출자가 반환값을 무시하는 흔한 실수 하나로 오염된 값이 그대로 애플리케이션과 클라우드로 흘러간다. 200만 대 fleet에서 이런 값 하나가 오탐 알림이 된다. CRC 자체는 순수 함수로 빼두면 테스트 벡터 한 줄로 검증되고, fake 도 같은 함수로 올바른 프레임을 만들어 테스트가 자기모순에 빠지지 않는다.", "complexity": "crc8 O(8n) 비트 루프 (또는 256B 테이블로 O(n)); decode O(1)", "pitfalls": ["*out 을 먼저 쓰고 나중에 CRC 검사.", "crc8 의 init 값을 0x00 으로 써서 선행 0 바이트를 구분하지 못한다.", "shift 결과를 uint8_t 로 자르지 않아 상위 비트가 남는다.", "부호 없는 조립만 하고 int16_t 캐스팅을 빠뜨려 음수 값이 65496 같은 값이 된다."], "verkada_context": "공기질/온도 센서 프레임은 거의 항상 CRC를 포함한다. 긴 케이블·전기 노이즈 환경(트레일러, 옥외 게이트웨이)에서 CRC 실패는 정상적으로 발생하며, 조용히 재측정으로 흡수되어야 한다."}, {"num": 66, "slug": "ring_log_injection", "title_ko": "고정 크기 링 로그 + 로거 주입", "title_en": "Bounded ring log with an injected sink", "difficulty": "hard", "tags": ["logging", "ring-buffer", "dependency-injection", "no-malloc"], "prompt_ko": "malloc 없는 고정 슬롯 링 로그(rlog_init/push/count/at)와, 드라이버가 printf 대신 쓰는 로거 주입(aq_set_logger/aq_log)을 구현하라. 꽉 차면 가장 오래된 줄을 덮어쓰고 dropped 를 세며, 긴 메시지는 안전하게 잘린다. 로거 미주입 시 aq_log 는 조용한 no-op 이어야 한다.", "prompt_en": "A malloc-free fixed-slot ring log plus logger injection, so tests can assert on what the driver logged.", "signature": "void rlog_push(RingLog *rl, LogLevel lvl, const char *msg); const char *rlog_at(const RingLog *rl, size_t i); void aq_log(AqDriver *d, LogLevel lvl, const char *msg)", "examples": [{"in": "CAP=8 인 링에 m0..m9 push", "out": "count==8, dropped==2, at(0)==\"m2\""}, {"in": "200자 메시지 push", "out": "strlen == RLOG_MSG-1 (안전하게 잘림)"}], "hints": ["snprintf(dst, RLOG_MSG, \"%s\", msg) 는 항상 NUL 종료를 보장한다 — strncpy 보다 안전하다.", "가장 오래된 슬롯 = (head + RLOG_CAP - count) % RLOG_CAP.", "aq_log 는 d->log.write 가 NULL 이면 즉시 리턴 — 로거 주입 전에도 드라이버가 동작해야 한다."], "solution": "void rlog_init(RingLog *rl) {\n    if (!rl) return;\n    memset(rl, 0, sizeof *rl);\n}\n\nvoid rlog_push(RingLog *rl, LogLevel lvl, const char *msg) {\n    if (!rl) return;\n    if (!msg) msg = \"(null)\";\n    snprintf(rl->msg[rl->head], RLOG_MSG, \"%s\", msg);   // 항상 NUL 종료 + 잘림 안전\n    rl->lvl[rl->head] = lvl;\n    rl->head = (rl->head + 1) % RLOG_CAP;\n    if (rl->count \u003c RLOG_CAP) rl->count++;\n    else                      rl->dropped++;            // 가장 오래된 줄을 덮어썼다\n}\n\nsize_t rlog_count(const RingLog *rl) {\n    return rl ? rl->count : 0;\n}\n\nconst char *rlog_at(const RingLog *rl, size_t i);                                            // Q66\nvoid      aq_set_logger(AqDriver *d, LogOps log);                                            // Q66\nvoid      aq_log(AqDriver *d, LogLevel lvl, const char *msg);                                // Q66\nCfgErr    aq_config_validate(const AqConfig *c);                                             // Q67\nAqErr     aq_service(AqDriver *d, int16_t *out_ppb);                                         // Q68\nvoid      aq_recover(AqDriver *d);                                                           // Q68\n\n// ===========================================================================\n// 제품용(real) HAL 어댑터 — 여기가 유일하게 하드웨어를 아는 곳.\n// ---------------------------------------------------------------------------\n// 단위 테스트는 이 함수를 **절대** 부르지 않는다. g_real_hal_calls 가 0인지\n// 단정하는 것만으로 \"드라이버가 HAL을 직접 부르지 않는다\"를 기계적으로 증명한다.\n// (제품 빌드에서는 aq_hal_i2c_ops() 가 진짜 버스를 물고 온다.)\n// ===========================================================================\nstatic unsigned g_real_hal_calls = 0;\n\nstatic IoStatus real_hal_read(void *ctx, uint8_t addr, uint8_t reg, uint8_t *buf, size_t n) {\n    (void)ctx; (void)addr; (void)reg; (void)buf; (void)n;\n    g_real_hal_calls++;                 // 실제로는 HAL_I2C_Mem_Read(...)\n    return IO_BUS_ERR;\n}\n\nvoid aq_set_logger(AqDriver *d, LogOps log) {\n    if (!d) return;\n    d->log = log;\n}\n\nvoid aq_log(AqDriver *d, LogLevel lvl, const char *msg) {\n    if (!d || !d->log.write) return;      // 로거 미주입 = 조용한 no-op (크래시 금지)\n    d->log.write(d->log.ctx, lvl, msg);\n}", "explanation_ko": "로그도 의존성이다. 드라이버가 printf 를 직접 부르면 '타임아웃 시 경고가 남는가'를 눈으로 확인해야 하지만, LogOps 를 주입하면 테스트가 링 버퍼를 꽂고 log_has(&ring, \"timeout\") 으로 단정할 수 있다. 저장소를 고정 슬롯으로 두는 이유는 두 가지다: malloc 이 없는 MCU에서도 같은 코드가 돌고, 로그 폭주가 메모리를 먹어 장치를 죽이는 일이 없다. 넘친 줄은 지우되 dropped 로 '얼마나 놓쳤는지'는 남긴다.", "complexity": "push/count/at 모두 O(1), 메모리 O(CAP × MSG) 정적", "pitfalls": ["strncpy 로 복사해 정확히 꽉 찬 경우 NUL 종료가 빠진다.", "로그에 malloc/vsnprintf 동적 버퍼 사용 → 힙 단편화와 ISR 안전성 문제.", "dropped 를 세지 않아 '로그가 조용한 건지 놓친 건지' 알 수 없다.", "로거 미주입(NULL) 상태에서 함수 포인터를 그대로 호출해 크래시."], "verkada_context": "옥외 게이트웨이는 재부팅 후 원인 규명이 어렵다. 고정 크기 링 로그는 마지막 N줄을 NVM/클라우드로 올리는 크래시 덤프의 기본형이며, malloc 없는 설계가 -40°C 재부팅 루프에서 신뢰성을 준다."}, {"num": 67, "slug": "config_validation", "title_ko": "설정 검증 순수 함수", "title_en": "Config validation with reason codes", "difficulty": "medium", "tags": ["validation", "boundary", "pure-function", "configuration"], "prompt_ko": "aq_config_validate(c) 를 I/O 없는 순수 함수로 구현하라. NULL, I2C 예약 주소(0x08~0x77 밖), period_ms(100~3,600,000 밖), timeout_ms(0 이거나 period 초과), max_retries(>10)를 순서대로 검사하고 첫 위반의 이유 코드를 반환한다.", "prompt_en": "Validate a config purely, returning the first violated rule as a reason code (not just true/false).", "signature": "CfgErr aq_config_validate(const AqConfig *c)", "examples": [{"in": "{0x62, period=1000, timeout=1001, retries=3}", "out": "CFG_E_TIMEOUT"}, {"in": "{0x78, ...} / {0x08, ...}", "out": "CFG_E_ADDR / CFG_OK (경계값)"}], "hints": ["bool 대신 이유 코드를 돌려주면 '왜 거부됐는지'가 로그와 클라우드 이벤트에 그대로 남는다.", "타임아웃이 샘플링 주기보다 길면 샘플이 계속 밀린다 — 상호 관계도 검증 대상이다.", "I2C 7비트 주소에서 0x00~0x07 과 0x78~0x7F 는 예약 구간이다."], "solution": "CfgErr aq_config_validate(const AqConfig *c) {\n    if (!c) return CFG_E_NULL;\n    // 7비트 주소: 0x00~0x07 과 0x78~0x7F 는 I2C 예약 구간\n    if (c->i2c_addr \u003c 0x08 || c->i2c_addr > 0x77) return CFG_E_ADDR;\n    if (c->period_ms \u003c 100 || c->period_ms > 3600000u) return CFG_E_PERIOD;\n    // 타임아웃은 0 이면 안 되고, 주기를 넘으면 샘플이 밀린다\n    if (c->timeout_ms == 0 || c->timeout_ms > c->period_ms) return CFG_E_TIMEOUT;\n    if (c->max_retries > 10) return CFG_E_RETRIES;\n    return CFG_OK;\n}", "explanation_ko": "설정은 대개 외부(클라우드, NVM, 기술자)에서 온다. period_ms=0 이나 timeout=0 같은 값이 런타임에 들어오면 장치가 조용히 미쳐버리고, 원인은 현장에서만 드러난다. 검증을 I/O 없는 순수 함수로 두면 경계값 표(하한-1 / 하한 / 상한 / 상한+1)를 그대로 테스트로 옮길 수 있고, 같은 함수를 설정 적용 직전과 클라우드 수신 직후 양쪽에서 재사용할 수 있다. 이유 코드는 bool 보다 진단 가치가 훨씬 크다.", "complexity": "O(1), 부작용 없음", "pitfalls": ["bool 만 돌려줘서 거부 이유를 알 수 없다.", "필드를 개별로만 보고 timeout > period 같은 상호 관계를 놓친다.", "0 을 '기본값 사용'으로 슬쩍 해석해 조용히 다른 동작을 한다.", "부호 있는 타입으로 받아 음수 주기가 통과한다."], "verkada_context": "Command에서 원격으로 샘플링 주기를 바꾸는 시나리오. 잘못된 값이 200만 대에 배포되기 전에 장치 측에서도 거부해야 한다(클라우드 검증만 믿지 않는다)."}, {"num": 68, "slug": "integration_scenario", "title_ko": "통합 시나리오 테스트", "title_en": "Full scenario with fakes only", "difficulty": "hard", "tags": ["integration-test", "state-machine", "non-blocking", "scenario"], "prompt_ko": "논블로킹 aq_service(d, out) 한 틱과 aq_recover(d) 를 구현하라. 호출 1회 = I2C 트랜잭션 최대 1회. IDLE 은 측정 시작(실패 시 should_retry 로 재시도), MEASURING 은 준비 폴링, READY 는 읽기+디코드(CRC 실패면 AQ_E_RETRY 로 재측정), FAULT 는 명시적 복구 전까지 AQ_ESTATE. 하나의 테스트로 '시작 → NACK 재시도 → 준비 → CRC 실패 → 재측정 → 성공 → 타임아웃' 전체 흐름이 재현된다.", "prompt_en": "Implement one non-blocking service tick plus explicit recovery, so a single test can replay start → NACK retries → ready → CRC failure → re-measure → success → timeout.", "signature": "AqErr aq_service(AqDriver *d, int16_t *out_ppb); void aq_recover(AqDriver *d)", "examples": [{"in": "nack_writes=2, not_ready=2, corrupt_crc 후 해제", "out": "EAGAIN×2 → MEASURING → EAGAIN×2 → READY → AQ_ECRC → 재측정 → AQ_OK(742)"}, {"in": "센서가 영영 준비 안 됨 + 가짜 시계 +1000ms", "out": "AQ_ETIMEDOUT → FAULT 고착 → aq_recover 후 재개"}], "hints": ["한 틱에 트랜잭션 하나만 내면 메인 루프/이벤트 루프에 그대로 얹을 수 있고 테스트가 결정적이 된다.", "CRC 실패는 AQ_E_FAIL 이 아니라 AQ_E_RETRY 다 — 재측정으로 복구 가능한 오류다.", "FAULT 는 자동 복구하지 않는다. 상위가 aq_recover 를 부를 때만 IDLE 로 돌아간다."], "solution": "AqErr aq_service(AqDriver *d, int16_t *out_ppb) {\n    if (!d || !out_ppb) return AQ_EINVAL;\n\n    switch (d->state) {\n    case AQ_S_IDLE: {\n        AqErr e = aq_start_measure(d);\n        if (e == AQ_OK) return AQ_EAGAIN;            // 측정 시작됨 → 다음 틱에 폴링\n        d->attempt++;\n        if (should_retry(d->last_io, d->attempt, d->max_attempts)) {\n            d->retries++;\n            return AQ_EAGAIN;                        // 같은 상태로 남아 다음 틱에 재시도\n        }\n        aq_log(d, LOG_ERROR, \"start failed, giving up\");\n        aq_fsm_apply(d, AQ_E_FAIL);\n        return e;\n    }\n    case AQ_S_MEASURING: {\n        AqErr e = aq_wait_ready(d);\n        if (e == AQ_EAGAIN) return AQ_EAGAIN;\n        if (e == AQ_OK) { aq_fsm_apply(d, AQ_E_DATA_RDY); return AQ_EAGAIN; }\n        if (e == AQ_ETIMEDOUT) aq_log(d, LOG_ERROR, \"measure timeout\");\n        else                   aq_log(d, LOG_ERROR, \"bus error while polling\");\n        aq_fsm_apply(d, AQ_E_FAIL);\n        return e;\n    }\n    case AQ_S_READY: {\n        uint8_t raw[3];\n        AqErr e = aq_read_raw(d, raw);\n        if (e != AQ_OK) {\n            aq_log(d, LOG_ERROR, \"data read failed\");\n            aq_fsm_apply(d, AQ_E_FAIL);\n            return e;\n        }\n        e = aq_decode(raw, out_ppb);                 // 실패하면 out 은 그대로다\n        if (e == AQ_ECRC) {\n            d->crc_errors++;\n            aq_log(d, LOG_WARN, \"crc mismatch, remeasure\");\n            aq_fsm_apply(d, AQ_E_RETRY);             // → IDLE: 재측정으로 복구\n            return AQ_ECRC;\n        }\n        d->attempt = 0;\n        aq_fsm_apply(d, AQ_E_DECODED);               // → IDLE\n        return e;\n    }\n    case AQ_S_FAULT:\n    default:\n        return AQ_ESTATE;                            // 명시적 복구 전까지 고착\n    }\n}\n\nvoid aq_recover(AqDriver *d) {\n    if (!d) return;\n    if (aq_fsm_apply(d, AQ_E_RECOVER)) {\n        d->attempt = 0;\n        d->last_io = IO_OK;\n        aq_log(d, LOG_INFO, \"recovered to idle\");\n    }\n}", "explanation_ko": "여기서 앞의 9문제가 하나로 합쳐진다. 핵심은 블로킹을 없앤 것이다 — 폴링·재시도·타임아웃처럼 본질적으로 시간 축을 타는 로직이, 논블로킹 스텝 API + 주입된 시계 덕분에 완전히 결정적인 함수 호출 시퀀스가 된다. 그래서 이 통합 테스트에는 스레드도 sleep 도 없고, 전체가 밀리초 안에 끝나며 CI에서 절대 플래키하지 않다. 복구 불가 오류를 FAULT 에 '고착'시키는 것도 의도된 설계다: 자동 복구는 문제를 숨기고, 명시적 복구는 상위가 관측·보고할 기회를 준다.", "complexity": "틱당 O(1), I2C 트랜잭션 최대 1회. 측정 1회 = 최소 3틱", "pitfalls": ["한 틱에서 while 루프로 준비될 때까지 돌아 블로킹이 된다.", "CRC 실패를 FAULT 로 보내 정상적인 노이즈에 장치가 멈춘다.", "FAULT 에서 자동 복구해 실제 하드웨어 고장을 숨긴다.", "타임아웃/에러 경로에서 out 파라미터를 덮어써 이전 유효 샘플을 잃는다.", "테스트에서 스레드나 실제 sleep 을 써서 플래키해진다."], "verkada_context": "게이트웨이 메인 루프가 수십 개 센서를 한 스레드로 서비스하는 실제 구조. 이 시나리오 테스트 하나가 현장에서 몇 주에 걸쳐야 재현되는 NACK·CRC·타임아웃 조합을 매 커밋 밀리초 단위로 검증한다."}]}, {"id": "08_practical_dsa", "order": 8, "range": "Q69-78", "icon": "📊", "track": "dsa", "title_en": "Practical Data Structures for Event & Log Processing", "title_ko": "실전 자료구조 (이벤트·로그 처리)", "summary_ko": "Verkada 에서 실제로 보고된 코딩 문제(LRU, Merge Intervals, Non-overlapping Intervals, Camera Logs API, Camera States, Filter Alerts, top-k)는 퍼즐이 아니라 스트림·로그·인터벌 모양이다. 이 세트는 그 10가지를 게이트웨이/카메라 fleet 시나리오로 다시 쓰되, 전부 malloc 없이 고정 크기 저장소로 푼다 — 해시맵·이진 힙·이중 연결 리스트·순환 버퍼를 STL 없이 C로 직접 구현하고, 노드는 정적 풀에서 인덱스로 꺼내 쓴다. 시간(now_ms)은 인자로 주입해 sleep 없이 결정적으로 테스트한다. 핵심은 '어떤 자료구조를 왜 골랐는지'와 복잡도·trade-off 를 영어로 말하는 능력이다.", "summary_en": "The coding problems actually reported for Verkada are stream-, log- and interval-shaped rather than puzzle-shaped. This set reworks all ten into gateway and camera-fleet scenarios and solves them in C with zero malloc: hand-rolled hash maps, binary heaps, intrusive doubly linked lists and ring buffers over static node pools, plus an injected clock so every test is deterministic without sleeping.", "verkada_relevance_ko": "Verkada 지원자들이 보고한 코딩 문제 목록은 LRU 캐시, Extract IP Addresses, Merge Intervals, Non-overlapping Intervals, Basic Calculator, Camera Logs API, Camera States, Filter Alerts, top-k 다. 전부 이 세트가 다루는 형태이며, 우연이 아니다 — 170개국 200만 대 fleet 을 운영하는 회사의 실제 업무가 이벤트 스트림 집계, 로그 병합·범위 질의, 오프라인 구간 계산, 알람 억제, rate limiting 이기 때문이다. 거기에 이 자리는 Senior Embedded Linux Engineer(Connectivity)다. 같은 문제를 풀어도 고정 용량·노드 풀·정수 산술·시간 주입으로 풀면 '임베디드에서 이걸 실제로 돌려본 사람'으로 읽힌다. 리크루터 메일이 명시한 평가 기준(설계 결정과 trade-off 정당화, 깨끗한 코드, edge case 견고성, 커뮤니케이션 명료함)과 'modular, testable embedded software' 원칙이 그대로 채점표다. 특히 GC31-E/GW31-E 게이트웨이는 오프라인 30분 자가 재부팅, 듀얼 SIM failover, 제한된 LTE 업링크를 가지므로 오프라인 구간 병합·알람 억제·업로드 rate limit 은 억지 시나리오가 아니라 실제 코드다.", "concepts": [{"term": "LRU cache (hash + doubly linked list)", "ko": "해시맵은 O(1) 조회, 리스트는 O(1) 재배치 — 둘을 같은 노드에 얹어 get/put O(1)", "en": "hash gives O(1) lookup, list gives O(1) reordering; fuse them in one node"}, {"term": "node pool / free list", "ko": "고정 배열 + 배열 안에 엮은 free list. malloc 을 부팅 시점 한 번으로 대체", "en": "fixed array with an embedded free list; allocation becomes O(1) index pops"}, {"term": "intrusive index links", "ko": "포인터 대신 int 인덱스 — 노드가 작고 구조체가 위치 독립적, -1 이 NIL", "en": "int indices instead of pointers: smaller nodes, position-independent blocks"}, {"term": "open addressing + linear probing", "ko": "평평한 배열 해시맵. 2의 거듭제곱 슬롯 + & 마스킹, 탐사 루프에 cap 상한 필수", "en": "flat-array hash map; power-of-two slots, mask instead of modulo, bounded probe loop"}, {"term": "size-K min-heap (top-K)", "ko": "루트가 곧 탈락 후보 — 새 원소는 한 번만 비교. O(n log k)", "en": "the root is the current weakest of the top K; one comparison admits or rejects"}, {"term": "sweep after sort (intervals)", "ko": "병합은 start 정렬, 최소삭제 그리디는 end 정렬 — 정렬 기준이 알고리즘을 결정", "en": "merge sorts by start, the greedy removal sorts by end; the key choice is the algorithm"}, {"term": "greedy exchange argument", "ko": "가장 빨리 끝나는 구간을 남기는 선택은 어떤 최적해로도 교환 가능 → 최적", "en": "keeping the earliest-finishing interval can replace any optimal choice; hence optimal"}, {"term": "token bucket", "ko": "지속 rate 와 burst capacity 두 손잡이. 타이머 없이 경과 시간으로 lazy refill", "en": "two independent knobs (sustained rate, burst), refilled lazily from elapsed time"}, {"term": "clock injection (testability)", "ko": "now_ms 를 인자로 받으면 sleep 없는 결정적 테스트. modular/testable 설계의 핵심", "en": "pass the clock in as a parameter: deterministic tests with no sleeps, no flakes"}, {"term": "stable two-pointer merge", "ko": "정렬된 두 스트림을 O(n) 단일 패스로. 동점은 A 우선 = 재현 가능한 출력", "en": "single-pass O(n) merge of pre-sorted streams; ties favour stream A for stability"}, {"term": "ring buffer as a sliding window", "ko": "최근 N개 FIFO 창. 해시 체인을 슬롯에 얹으면 멤버십까지 O(1)", "en": "FIFO window of the last N items; add an intrusive hash chain for O(1) membership"}, {"term": "lower_bound / upper_bound", "ko": "첫 >= key / 첫 > key. 비교 연산자 한 글자 차이가 중복 값 구간의 양끝을 만든다", "en": "first >= key and first > key; one operator apart, together they bracket duplicates"}, {"term": "commit-at-the-end parsing", "ko": "임시 구조체에 채우고 전부 검증된 뒤에만 *out 에 커밋 — 부분 결과 금지", "en": "fill a local struct and commit to the caller only after every field validates"}, {"term": "count what you drop", "ko": "evictions / dropped / suppressed / rejected — 조용한 손실이 가장 디버깅하기 어렵다", "en": "silent loss is the hardest field bug; every discard path increments a counter"}], "study_note_md": "# 📊 실전 자료구조 (이벤트·로그 처리) (Practical Data Structures for Event & Log Processing) — Q69~Q78\n\n> Verkada 에서 실제로 보고된 코딩 문제는 퍼즐이 아니다 — LRU 캐시, Merge Intervals,\n> Non-overlapping Intervals, Extract IP Addresses, Camera Logs API, Camera States,\n> Filter Alerts, top-k. 전부 **스트림·로그·인터벌**을 다루는 \"제품에서 실제로 하는 일\"의\n> 모양이다. 이 세트는 그 10가지를 게이트웨이/카메라 fleet 시나리오로 다시 쓰되,\n> **malloc 없이 고정 크기 저장소**로 푼다. 임베디드 Linux 자리에서 이게 차별점이다.\n\n---\n\n## 1. 핵심 아이디어\n\n**LeetCode 답을 그대로 읊으면 점수가 안 오른다.** 이 자리는 Senior Embedded Linux\nEngineer(Connectivity)다. 같은 문제라도 다음 셋을 얹어야 시니어로 읽힌다.\n\n1. **저장소가 고정이다.** 용량을 미리 정하고 넘칠 때 무슨 일이 일어나는지 말한다\n   (drop-oldest? reject-newest? 그리고 **버린 건 반드시 카운트한다**).\n2. **표준 라이브러리가 없다.** `std::unordered_map` 도 `priority_queue` 도 없으니\n   해시맵·힙·이중 연결 리스트를 그 자리에서 짤 수 있어야 한다.\n3. **시간은 주입한다.** rate limiter/타임아웃/만료는 `now_ms` 를 인자로 받는다 — 리크루터\n   메일의 \"design principles for modular, **testable** embedded software\" 가 바로 이것.\n\n이 세트의 10문제 전부 **malloc/free 를 한 번도 호출하지 않는다.** 전부 구조체 안의\n고정 배열이고, 동적으로 보이는 구조(LRU 노드, dedup 창)는 인덱스 기반 노드 풀이다.\n\n---\n\n## 2. 어떤 자료구조를 언제 고르나 (판단표)\n\n| 요구사항 | 고르는 것 | 비용 | 이 세트 |\n|---|---|---|---|\n| \"가장 최근 K개만 기억\" (용량 고정) | 해시 + 이중 연결 리스트 = **LRU** | get/put O(1) | Q69 |\n| \"구간을 합쳐서 총량\" | 정렬 후 1-pass **sweep** | O(n log n) / O(1) | Q70 |\n| \"겹치지 않게 최소 삭제\" | 끝점 정렬 **그리디** | O(n log n) / O(1) | Q71 |\n| \"상위 K개만\" (n ≫ k) | 크기 **K min-heap** | O(n log k) / O(k) | Q72 |\n| \"키별 카운트/집계\" | **오픈 어드레싱 해시맵** | 평균 O(1) / O(slots) | Q73 |\n| \"초당 N개로 제한, 버스트 허용\" | **토큰 버킷** | O(1) / O(1) | Q74 |\n| \"정렬된 스트림 여러 개를 시간순\" | **two-pointer** (2개) / min-heap (k개) | O(n) / O(1) | Q75 |\n| \"최근 N개 안의 중복 억제\" | **순환 버퍼 + 해시** | 평균 O(1) / O(N) | Q76 |\n| \"정렬된 데이터의 범위 질의\" | **lower/upper_bound** | O(log n) / O(1) | Q77 |\n| \"텍스트 → 구조체\" | **수동 스캔 파서** | O(L) / O(1) | Q78 |\n\n> 표를 외우지 말고 **\"왜 이걸 골랐는지\"** 한 문장을 준비한다. 상위 K개에 전체 정렬은 버릴\n> 일을 다 하는 것이고, 정렬된 두 스트림을 다시 정렬하면 가진 정보를 버리는 것이다.\n\n---\n\n## 3. C에서 직접 짜는 정석 패턴\n\n### 3.1 오픈 어드레싱 해시맵 (선형 탐사)\n\n정수 키든 문자열 키든 뼈대는 같다. **슬롯 수는 2의 거듭제곱** → `% cap` 대신\n`& (cap-1)`. 나눗셈 명령이 느리거나 없는 MCU 에서 실질적인 차이가 난다.\n\n```c\n#define SLOTS 64                       /* 반드시 2의 거듭제곱 */\ntypedef struct { char key[16]; uint32_t val; bool used; } Slot;\n\nstatic uint32_t fnv1a(const char *s) { /* 문자열 키 */\n    uint32_t h = 2166136261u;\n    while (*s) { h ^= (uint8_t)*s++; h *= 16777619u; }\n    return h;\n}\nstatic uint32_t mix32(uint32_t x) {    /* 정수 키: Knuth 곱셈 해시 */\n    x *= 2654435761u; return x ^ (x >> 16);\n}\n\n/* 찾으면 그 슬롯, 없으면 삽입할 빈 슬롯. 포화면 SLOTS. */\nstatic size_t probe(const Slot *t, const char *key, bool *found) {\n    size_t i = fnv1a(key) & (SLOTS - 1);\n    for (size_t p = 0; p \u003c SLOTS; p++) {       /* ★ 탐사 횟수 상한 = 무한루프 방지 */\n        size_t j = (i + p) & (SLOTS - 1);\n        if (!t[j].used)                 { *found = false; return j; }\n        if (strcmp(t[j].key, key) == 0) { *found = true;  return j; }\n    }\n    *found = false; return SLOTS;              /* 테이블 포화 */\n}\n```\n\n기억할 세 가지: ①**탐사 루프에 `p \u003c cap` 상한**(없으면 포화 시 무한 루프) ②부하율\n0.7 을 넘으면 급격히 느려지므로 슬롯은 **기대 원소 수의 2배** ③**삭제가 잦으면\ntombstone 대신 체이닝**(아래 3.3).\n\n### 3.2 배열 이진 힙 (크기 K min-heap)\n\n```c\n/* 0-indexed: parent=(i-1)/2, left=2i+1, right=2i+2 */\nstatic void sift_up(Event *h, size_t i) {\n    while (i > 0) {\n        size_t p = (i - 1) / 2;\n        if (!better(&h[p], &h[i])) break;      /* 부모가 더 '낮으면' 정상 */\n        swap(&h[i], &h[p]); i = p;\n    }\n}\nstatic void sift_down(Event *h, size_t n, size_t i) {\n    for (;;) {\n        size_t l = 2*i+1, r = 2*i+2, low = i;\n        if (l \u003c n && better(&h[low], &h[l])) low = l;   /* ★ l\u003cn 가드를 비교보다 먼저 */\n        if (r \u003c n && better(&h[low], &h[r])) low = r;\n        if (low == i) break;\n        swap(&h[i], &h[low]); i = low;\n    }\n}\n```\n\ntop-K 의 핵심 관용구 — **힙에는 \"지금까지의 상위 K개\"만 있고 루트가 그중 최하위**다:\n\n```c\nif (cnt \u003c k)                      { h[cnt] = ev[i]; sift_up(h, cnt); cnt++; }\nelse if (better(&ev[i], &h[0]))   { h[0]   = ev[i]; sift_down(h, cnt, 0); }\n```\n\n> 힙 저장소로 **호출자가 준 out[] 을 그대로 쓴다** (Q72) — 할당 0, 마지막에 그 자리에서\n> 정렬만 하면 보고용 배열이 된다. 그리고 **동점 규칙을 반드시 정의한다**(score 동점이면\n> dev_id 오름차순). 없으면 출력이 힙 내부 순서에 좌우돼 테스트가 플래키해진다.\n\n### 3.3 침습적(intrusive) 이중 연결 리스트 + 체이닝 — 포인터 대신 인덱스\n\nLRU(Q69)와 dedup(Q76)의 공통 뼈대다. **노드 하나가 리스트 원소이자 해시 체인 노드**다.\n\n```c\ntypedef struct { int key, val; int prev, next; int hnext; bool used; } Node;\n/*                              ↑ LRU 리스트      ↑ 해시 버킷 체인 (둘 다 인덱스) */\ntypedef struct {\n    Node pool[CAP];        /* ★ 노드 풀 — malloc 이 여기로 대체된다 */\n    int  bucket[BUCKETS];  /* 전부 -1 로 초기화 */\n    int  head, tail, free_head, count;\n} Cache;\n```\n\n포인터 대신 `int` 인덱스를 쓰는 이유 (**면접에서 말할 것**):\n- 64비트 포인터 → 32비트(혹은 16비트) 인덱스 = 노드가 작아지고 캐시에 더 들어간다.\n- 구조체 전체가 **위치 독립적**이다. 통째로 복사·DMA·flash 저장이 가능하다.\n- `-1`(NIL)이 명확한 sentinel 이라 dangling pointer 가 원천적으로 없다.\n\n체인에서 노드를 빼는 정석 — **`int *link` 로 \"이전 노드의 next 필드\"를 가리킨다.**\nhead 인지 중간인지 분기할 필요가 없어진다:\n\n```c\nstatic void bucket_remove(Cache *c, int idx) {\n    int b = mix32(c->pool[idx].key) & (BUCKETS - 1);\n    int *link = &c->bucket[b];\n    while (*link != -1) {\n        if (*link == idx) { *link = c->pool[idx].hnext; return; }\n        link = &c->pool[*link].hnext;\n    }\n}\n```\n\n### 3.4 임베디드에서 malloc 을 피하는 법 — 노드 풀 (free list)\n\n왜 피하나: ①**단편화** — 수개월 가동하면 여유 총량은 남았는데 할당이 실패하는 상태에\n도달한다 ②**비결정적 지연** — glibc malloc 은 최악 지연을 보장하지 않아 실시간 경로에서\n금물 ③**실패 경로** — NULL 반환 경로는 대부분 테스트되지 않는다. 부팅 때 다 잡아두면\n그 경로 자체가 사라진다. 패턴은 항상 **고정 배열 + 그 안에 엮은 free list** 다:\n\n```c\nvoid pool_init(Cache *c, int cap) {\n    for (int i = 0; i \u003c cap; i++)\n        c->pool[i].next = (i + 1 \u003c cap) ? i + 1 : -1;  /* free list 를 미리 연결 */\n    c->free_head = 0;\n}\nstatic int pool_alloc(Cache *c) {                      /* O(1) */\n    int i = c->free_head;\n    if (i == -1) return -1;                            /* 고갈 = 정상적인 상태 */\n    c->free_head = c->pool[i].next;\n    return i;\n}\nstatic void pool_free(Cache *c, int i) {               /* O(1) */\n    c->pool[i].next = c->free_head; c->free_head = i;\n}\n```\n\n핵심: **고갈은 에러가 아니라 설계된 상태**다. `-1` 을 받으면 drop 하고 카운터를 올린다.\nLRU 에서는 고갈되기 전에 축출이 일어나므로 `pool_alloc` 이 실패할 수 없다 — 그게\n불변식이고, 주석으로 적어두면 리뷰어가 좋아한다.\n\n### 3.5 시간 주입 (dependency injection for the clock)\n\n```c\nbool tb_allow(TokenBucket *tb, uint64_t now_ms, uint32_t cost);   /* ← now 를 받는다 */\n```\n\n`clock_gettime()` 을 함수 안에서 부르면 \"1초 뒤\" 테스트가 `sleep(1)` 이 된다 — 느리고\n플래키하다. 인자로 받으면 `tb_allow(&tb, 1500, 1)` 로 **즉시·결정적**이고, 프로덕션에서는\n호출부가 `clock_gettime(CLOCK_MONOTONIC)` 을 한 번 읽어 넘긴다. 토큰도 **float 대신\nmilli-token 정수**로 들어 FPU 없는 파트에서 동일하게 돌고 반올림 오차가 없다.\n\n```c\ntb->tokens_milli += elapsed_ms * refill_per_sec;                         /* 1ms = rate/1000 토큰 */\nif (tb->tokens_milli > tb->cap_milli) tb->tokens_milli = tb->cap_milli;  /* 버스트 상한 clamp */\n```\n\n---\n\n## 4. 흔한 함정 (인터뷰 감점 포인트)\n\n| 함정 | 왜 틀렸나 | 올바른 답 |\n|---|---|---|\n| 인터벌 문제에서 **어느 끝점으로 정렬할지** 안 따짐 | 병합은 start, 최소삭제 그리디는 **end** | 문제마다 다르다. 이유를 말할 것 |\n| `[1,2]`, `[2,3]` 을 겹침으로 셈 | 규약을 안 물어봤다 | **\"경계가 닿는 건 겹침인가요?\"를 먼저 묻는다** |\n| top-K 에 max-heap 사용 | max-heap 은 \"버릴 것\"을 O(1)에 못 준다 | **min-heap** 의 루트가 곧 탈락 후보 |\n| 해시 탐사 루프에 상한 없음 | 가득 찬 테이블에서 무한 루프 | `for (p = 0; p \u003c cap; p++)` |\n| 파서가 **부분 결과를 out 에 남김** | 실패 시 호출자가 반쯤 채워진 구조체를 씀 | 임시 구조체에 채우고 **전부 통과 후 커밋** |\n| 파서가 `strtok_r` 로 **입력 버퍼를 변형** | const 로그 버퍼/공유 버퍼면 파괴적 | const 포인터 수동 스캔 |\n| 이진 탐색 `(lo+hi)/2` | 큰 인덱스에서 오버플로 | `lo + (hi - lo) / 2` |\n| 드롭/억제를 **조용히** 함 | 조용한 손실이 제일 디버깅이 어렵다 | `dropped`, `suppressed`, `evictions` 를 센다 |\n| 시계 역행(NTP step, 재부팅)을 무시 | 음수 elapsed → 거대한 토큰 충전 | `now \u003c= last` 면 충전 0, last 만 재동기화 |\n\n---\n\n## 5. 면접에서 말할 것 (한국어 + 영어)\n\n### 5.1 문제를 받자마자 (30초 요구사항 확인)\n\n- 한: \"용량은 고정인가요? 넘치면 가장 오래된 걸 버리나요, 새 걸 거절하나요?\"\n- 영: **\"Is the capacity fixed? When it overflows, do we drop the oldest or reject the newest? Either way I'll count what we dropped — silent data loss is the hardest thing to debug in the field.\"**\n- 한: \"구간의 경계가 맞닿는 경우는 겹치는 걸로 보나요?\"\n- 영: **\"Are touching endpoints — [1,2] and [2,3] — considered overlapping? It changes the comparison from `\u003c` to `\u003c=`, so I want to pin it down before I code.\"**\n\n### 5.2 복잡도와 trade-off 를 말로 (핵심)\n\n- LRU — 영: **\"A hash map gives O(1) lookup but no ordering; a doubly linked list gives O(1) reordering but no lookup. Combining them gives O(1) get and put, at the cost of one extra pointer pair per node. I'm using array indices instead of pointers so the whole cache is one contiguous, position-independent block — no malloc, no fragmentation over a six-month uptime.\"**\n- top-K — 영: **\"Sorting everything is O(n log n) and throws most of the work away. A size-K min-heap is O(n log k) time and O(k) space, and the root is always the weakest of the current top K, so deciding whether to admit a new event is a single comparison. With two million devices and k = 10, that's the difference that matters.\"**\n- 인터벌 — 영: **\"Sorting dominates at O(n log n); the sweep itself is O(n) and in place, so the extra space is O(1) apart from the sort's stack. For the greedy non-overlapping problem I sort by end time, not start — keeping the interval that finishes earliest always leaves the most room for the rest, and that exchange argument is why greedy is optimal here.\"**\n- 해시맵 — 영: **\"Open addressing with linear probing keeps everything in one flat array — great cache locality and no per-node allocation — but it degrades past about 70% load and deletion needs tombstones. If this had frequent deletes I'd switch to chaining with an intrusive `next` index, which is what I did for the LRU and the dedup window.\"**\n- 토큰 버킷 — 영: **\"A token bucket expresses two independent knobs: the sustained rate and the burst size. It's O(1) per call with no timer and no background thread — we just compute how many tokens the elapsed time earned. I keep tokens as integer milli-tokens so it runs identically on a part with no FPU.\"**\n- 병합 — 영: **\"Both streams are already sorted, so re-sorting would be O(n log n) for information we already have. A two-pointer merge is O(na + nb) and single-pass. I break ties toward stream A so the output is stable — same input, same order, every time.\"**\n\n### 5.3 테스트 전략 (리크루터가 적어준 \"testable\" 항목)\n\n- 한: \"시간을 인자로 주입했기 때문에 sleep 없이 rate limiter 를 테스트할 수 있습니다.\"\n- 영: **\"The clock is a parameter, not a call inside the function, so the rate limiter's tests run in microseconds and are fully deterministic — no sleeps, no flakes. In production the caller reads CLOCK_MONOTONIC once and passes it down.\"**\n- 한: \"엣지 케이스는 빈 입력, 용량 초과, 동일 타임스탬프, 잘못된 형식 네 가지를 먼저 씁니다.\"\n- 영: **\"My first four test cases are always: empty input, capacity exceeded, duplicate keys or identical timestamps, and malformed input. Those are where real device fleets actually break.\"**\n- 한: \"파서는 실패 시 출력 구조체를 건드리지 않습니다 — 전부 검증한 뒤에 커밋합니다.\"\n- 영: **\"The parser fills a local struct and only commits to the caller's output once every field validates. A half-parsed record that looks valid is worse than a rejected one.\"**\n\n### 5.4 확장 질문(follow-up) 대비\n\n- *\"k개 스트림 병합은?\"* → 스트림당 헤드 하나씩 담은 **크기 k min-heap**, O(N log k). two-pointer 는 k=2 의 특수화.\n- *\"LRU 대신 LFU 는?\"* → 빈도별 리스트 버킷(O(1) LFU). 단, 과거에 뜨거웠던 항목이 눌러앉으므로 **aging 필요**.\n- *\"멀티스레드로?\"* → 이 자료구조들은 **전부 스레드 안전이 아니다.** 소유 스레드 하나 + 앞단 bounded queue 가 1순위. 락을 건다면 LRU 는 전체 잠금(리스트 재연결 탓에 샤딩이 어렵다), 집계 해시맵은 키 샤딩.\n- *\"dedup 을 시간(30초) 기준으로?\"* → 링에 타임스탬프를 같이 넣고 앞에서 만료 제거. 여전히 amortized O(1).\n- *\"로그가 완전히 정렬돼 있지 않다면?\"* → 재정렬 창(reorder buffer) 또는 watermark 기반 지연 방출.\n\n---\n\n## 6. 체크리스트\n\n- [ ] LRU 를 **malloc 없이** 노드 풀 + 인덱스 링크로 20분 안에 짤 수 있다\n- [ ] LRU 축출 시 **리스트 unlink + 해시 remove + 풀 반납** 3종 세트를 빠뜨리지 않고, `get` 도 순서를 갱신한다\n- [ ] 병합은 start 정렬, 최소삭제 그리디는 **end 정렬**임을 이유와 함께 말한다\n- [ ] \"경계가 닿으면 겹침인가\"를 **코딩 전에 묻는다**\n- [ ] top-K 에 **min-heap** 을 쓰고 O(n log k) 를 말한다 (전체 정렬 금지)\n- [ ] sift_up / sift_down 을 0-indexed 공식으로 쓴다 (`(i-1)/2`, `2i+1`, `2i+2`) — 동점 규칙도 정의\n- [ ] 오픈 어드레싱 탐사 루프에 **`p \u003c cap` 상한**이 있고, 슬롯이 2의 거듭제곱 + `& (cap-1)` 인덱싱\n- [ ] 토큰 버킷을 **정수 milli-token + 주입된 시각**으로 구현한다\n- [ ] 시계 역행을 방어한다 (`now \u003c= last` → 충전 0)\n- [ ] 두 정렬 스트림 병합이 **stable** 하고 out_cap 을 넘지 않는다\n- [ ] 이진 탐색 중점은 `lo + (hi - lo) / 2`, lower/upper_bound 는 `\u003c` 와 `\u003c=` 로 구분\n- [ ] 파서가 입력 버퍼를 변형하지 않고, 실패 시 출력을 건드리지 않으며, 누락·모르는 키·중복 키·범위 밖 값을 전부 거부한다\n- [ ] 버린 것(`dropped` / `suppressed` / `evictions` / `rejected`)을 전부 센다\n- [ ] 각 함수의 시간·공간 복잡도를 영어 한 문장으로 말할 수 있다\n- [ ] 테스트를 빈 입력 / 용량 초과 / 동일 타임스탬프 / 잘못된 형식부터 쓴다\n", "problems": [{"num": 69, "slug": "lru_cache_node_pool", "title_ko": "LRU 캐시 (해시 + 이중 연결 리스트, 노드 풀)", "title_en": "LRU cache with a static node pool", "difficulty": "hard", "tags": ["lru", "hash-map", "doubly-linked-list", "node-pool", "no-malloc"], "prompt_ko": "고정 용량 LRU 캐시를 malloc 없이 구현한다. 노드는 정적 풀에서 free list 로 꺼내 쓰고, prev/next/hnext 는 포인터가 아니라 배열 인덱스다. 해시는 노드 안의 hnext 로 버킷 체이닝을 만들어 별도 할당이 전혀 없다. get/put 평균 O(1), 가득 차면 tail(LRU)을 축출하고 evictions 를 센다.", "prompt_en": "Implement a fixed-capacity LRU cache with zero malloc: an intrusive doubly linked list plus hash bucket chaining, both living in one static node pool of array indices. O(1) get/put; evict the tail when full and count evictions.", "signature": "bool lru_get(LruCache *c, int key, int *out); void lru_put(LruCache *c, int key, int val);", "examples": [{"in": "cap=3; put(1,100) put(2,200) put(3,300); get(1); put(4,400)", "out": "key 2 축출, MRU 순서 = 4,1,3 → 이후 get(3) 하면 3,4,1"}, {"in": "cap=2 에 50번 put", "out": "count==2, 노드 풀 재사용으로 최신 2개만 남음"}], "hints": ["해시맵은 O(1) 조회를, 이중 연결 리스트는 O(1) 재배치를 준다. 둘을 같은 노드에 얹는다.", "포인터 대신 int 인덱스를 쓰면 구조체 하나가 통째로 위치 독립적이 되고 -1 이 NIL sentinel 이 된다.", "축출은 3종 세트다: 해시 체인에서 제거 + 리스트 unlink + free list 로 반납. 하나라도 빠지면 유령 엔트리가 남는다."], "solution": "static uint32_t lru_mix(int key) {          /* Knuth 곱셈 해시 (음수 키 안전) */\n    uint32_t x = (uint32_t)key * 2654435761u;\n    return x ^ (x >> 16);\n}\nvoid lru_init(LruCache *c, int cap) {\n    if (!c) return;\n    if (cap \u003c 1) cap = 1;\n    if (cap > LRU_MAX_CAP) cap = LRU_MAX_CAP;\n    memset(c, 0, sizeof *c);\n    c->cap = cap;\n    c->head = c->tail = LRU_NIL;\n    for (int i = 0; i \u003c LRU_BUCKETS; i++) c->bucket[i] = LRU_NIL;\n    for (int i = 0; i \u003c cap; i++) {         /* free list 를 미리 엮어둔다 */\n        c->pool[i].next = (i + 1 \u003c cap) ? i + 1 : LRU_NIL;\n        c->pool[i].used = false;\n    }\n    c->free_head = 0;\n}\nstatic int lru_alloc(LruCache *c) {\n    int i = c->free_head;\n    if (i == LRU_NIL) return LRU_NIL;\n    c->free_head = c->pool[i].next;\n    c->pool[i].used = true;\n    return i;\n}\nstatic void lru_release(LruCache *c, int i) {\n    c->pool[i].used = false;\n    c->pool[i].next = c->free_head;\n    c->free_head = i;\n}\nstatic void lru_unlink(LruCache *c, int i) {\n    int p = c->pool[i].prev, n = c->pool[i].next;\n    if (p != LRU_NIL) c->pool[p].next = n; else c->head = n;\n    if (n != LRU_NIL) c->pool[n].prev = p; else c->tail = p;\n    c->pool[i].prev = c->pool[i].next = LRU_NIL;\n}\nstatic void lru_push_front(LruCache *c, int i) {\n    c->pool[i].prev = LRU_NIL;\n    c->pool[i].next = c->head;\n    if (c->head != LRU_NIL) c->pool[c->head].prev = i;\n    c->head = i;\n    if (c->tail == LRU_NIL) c->tail = i;\n}\nstatic int lru_find(const LruCache *c, int key) {\n    int b = (int)(lru_mix(key) & (LRU_BUCKETS - 1));\n    for (int i = c->bucket[b]; i != LRU_NIL; i = c->pool[i].hnext)\n        if (c->pool[i].key == key) return i;\n    return LRU_NIL;\n}\nstatic void lru_hash_insert(LruCache *c, int i) {\n    int b = (int)(lru_mix(c->pool[i].key) & (LRU_BUCKETS - 1));\n    c->pool[i].hnext = c->bucket[b];\n    c->bucket[b] = i;\n}\nstatic void lru_hash_remove(LruCache *c, int i) {\n    int b = (int)(lru_mix(c->pool[i].key) & (LRU_BUCKETS - 1));\n    int *link = &c->bucket[b];\n    while (*link != LRU_NIL) {\n        if (*link == i) { *link = c->pool[i].hnext; return; }\n        link = &c->pool[*link].hnext;\n    }\n}\nbool lru_get(LruCache *c, int key, int *out) {\n    if (!c || c->cap == 0) return false;\n    int i = lru_find(c, key);\n    if (i == LRU_NIL) return false;\n    lru_unlink(c, i);\n    lru_push_front(c, i);\n    if (out) *out = c->pool[i].val;\n    return true;\n}\nvoid lru_put(LruCache *c, int key, int val) {\n    if (!c || c->cap == 0) return;\n    int i = lru_find(c, key);\n    if (i != LRU_NIL) {                      /* 갱신도 \"사용\"이므로 MRU 로 */\n        c->pool[i].val = val;\n        lru_unlink(c, i);\n        lru_push_front(c, i);\n        return;\n    }\n    if (c->count == c->cap) {                /* 축출: tail 부터 */\n        int victim = c->tail;\n        lru_hash_remove(c, victim);\n        lru_unlink(c, victim);\n        lru_release(c, victim);\n        c->count--;\n        c->evictions++;\n    }\n    i = lru_alloc(c);\n    if (i == LRU_NIL) return;                /* 여기 도달하면 불변식 위반 */\n    c->pool[i].key = key;\n    c->pool[i].val = val;\n    lru_hash_insert(c, i);\n    lru_push_front(c, i);\n    c->count++;\n}\nsize_t lru_keys_mru_first(const LruCache *c, int *out, size_t out_cap) {\n    size_t n = 0;\n    if (!c || !out) return 0;\n    for (int i = c->head; i != LRU_NIL && n \u003c out_cap; i = c->pool[i].next)\n        out[n++] = c->pool[i].key;\n    return n;\n}", "explanation_ko": "PATTERN: 해시 + 침습적 이중 연결 리스트. 해시맵 단독은 순서를 모르고, 리스트 단독은 조회가 O(n)이다. 둘을 같은 노드에 심으면 get/put 이 모두 평균 O(1). 임베디드 변형의 핵심은 저장소다 — 부팅 때 pool[] 을 한 번 잡고 free list 로 엮어두면 런타임 할당이 0이라 수개월 가동해도 단편화가 없고 지연이 결정적이다. 갱신(put on existing)도 '사용'이므로 MRU 로 올려야 한다. 축출은 반드시 해시 제거 + 리스트 unlink + 풀 반납을 함께 한다.", "complexity": "O(1) average time for get/put, O(cap) space (static, no malloc)", "pitfalls": ["get 이 순서를 갱신하지 않음 — 조회도 '사용'이다", "축출 시 해시 체인에서 제거하지 않아 유령 엔트리가 남음", "포인터 노드를 매번 malloc/free — 장시간 가동 시 단편화", "head/tail 갱신 누락 (리스트가 비거나 하나뿐인 경계)"], "verkada_context": "Command 게이트웨이가 디바이스 메타데이터(마지막 상태, 펌웨어 버전)를 고정 메모리 안에서 캐시한다. LRU 는 Verkada 인터뷰에서 실제로 보고된 문제다."}, {"num": 70, "slug": "merge_offline_intervals", "title_ko": "인터벌 병합 — 디바이스 오프라인 구간 합치기", "title_en": "Merge intervals (device offline windows)", "difficulty": "easy", "tags": ["intervals", "sort", "sweep", "in-place"], "prompt_ko": "[start,end] 닫힌 구간 배열을 in-place 로 정렬·병합하고 병합 후 개수를 반환한다. 여러 소스(heartbeat 누락, 모뎀 로그, Command ping)가 겹치는 오프라인 구간을 보고하므로 합쳐야 총 다운타임이 나온다. 경계가 맞닿는 구간([100,200],[200,260])도 끊긴 적이 없으므로 병합한다.", "prompt_en": "Sort by start and sweep once, merging overlapping and touching intervals in place; return the merged count.", "signature": "size_t merge_intervals(Interval *iv, size_t n);", "examples": [{"in": "{{300,400},{100,200},{150,250},{900,1000}}", "out": "3개: [100,250],[300,400],[900,1000]"}, {"in": "{{100,200},{200,260}} (경계 접촉)", "out": "1개: [100,260]"}], "hints": ["정렬 없이는 어떤 구간이 이웃인지 알 수 없다. 무엇을 기준으로 정렬할지부터 정하라.", "start 오름차순으로 정렬하면 '다음 구간의 start 가 현재 end 이하'일 때만 겹친다.", "쓰기 커서 w 를 두고 iv[r].start \u003c= iv[w].end 면 iv[w].end 를 늘리고, 아니면 iv[++w] = iv[r]."], "solution": "static int iv_cmp_start(const void *pa, const void *pb) {\n    const Interval *a = (const Interval *)pa, *b = (const Interval *)pb;\n    if (a->start != b->start) return (a->start \u003c b->start) ? -1 : 1;\n    if (a->end   != b->end)   return (a->end   \u003c b->end)   ? -1 : 1;\n    return 0;\n}\nsize_t merge_intervals(Interval *iv, size_t n) {\n    if (!iv || n == 0) return 0;\n    qsort(iv, n, sizeof *iv, iv_cmp_start);\n    size_t w = 0;                                  /* 쓰기 커서 = 현재 병합 중인 구간 */\n    for (size_t r = 1; r \u003c n; r++) {\n        if (iv[r].start \u003c= iv[w].end) {            /* 겹치거나 맞닿음 → 흡수 */\n            if (iv[r].end > iv[w].end) iv[w].end = iv[r].end;\n        } else {\n            iv[++w] = iv[r];                       /* 새 구간 시작 */\n        }\n    }\n    return w + 1;\n}\nlong merged_total_seconds(const Interval *iv, size_t n) {\n    long sum = 0;\n    for (size_t i = 0; i \u003c n; i++) sum += iv[i].end - iv[i].start;\n    return sum;\n}", "explanation_ko": "PATTERN: sort + one-pass sweep. start 오름차순으로 정렬하면 '겹침 판정'이 직전 병합 구간의 end 하나만 보면 되는 지역적 검사가 된다. 쓰기 커서 w 를 두고 in-place 로 압축하므로 추가 버퍼가 없다. 비용은 정렬이 지배 — O(n log n) time, 추가 공간 O(1). `\u003c=` 인지 `\u003c` 인지가 '경계 접촉을 병합할 것인가'를 결정하며, 이건 요구사항이지 취향이 아니다. 다운타임은 끊긴 적 없는 구간이므로 여기선 `\u003c=`(병합)가 맞다.", "complexity": "O(n log n) time (sort-dominated), O(1) extra space (in-place)", "pitfalls": ["정렬을 빼먹고 입력이 정렬됐다고 가정", "경계 접촉 규약(`\u003c` vs `\u003c=`)을 물어보지 않음", "end 를 무조건 덮어써서 포함 관계([0,1000] 안의 [10,20])를 깨뜨림", "빈 입력/NULL 에서 n-1 언더플로"], "verkada_context": "GW31-E 는 오프라인 30분이면 자가 재부팅한다. 중복 보고된 오프라인 구간을 병합해야 진짜 다운타임과 재부팅 근거가 나온다."}, {"num": 71, "slug": "erase_overlap_windows", "title_ko": "겹치지 않게 만들기 — 제거해야 할 최소 인터벌 수", "title_en": "Non-overlapping intervals (minimum removals)", "difficulty": "medium", "tags": ["intervals", "greedy", "sort", "exchange-argument"], "prompt_ko": "유지보수 창(펌웨어 OTA, 채널 스캔)은 동시에 하나만 실행할 수 있다. 요청된 창 목록에서 겹침이 사라지도록 제거해야 하는 최소 개수를 반환한다. Q70 과 달리 맞닿는 구간([1,2],[2,3])은 겹치지 않는 것으로 본다.", "prompt_en": "Return the minimum number of intervals to remove so the rest are non-overlapping. Greedy by earliest end time; touching endpoints do not count as overlap.", "signature": "size_t erase_overlap_intervals(Interval *iv, size_t n);", "examples": [{"in": "{{1,2},{2,3},{3,4},{1,3}}", "out": "1 ([1,3] 하나만 제거)"}, {"in": "{{0,100},{1,2},{3,4},{5,6}}", "out": "1 (거대한 [0,100] 을 버린다)"}], "hints": ["'몇 개를 제거하나'는 '몇 개를 남길 수 있나'의 뒤집기다 — activity selection 문제.", "start 가 아니라 end 로 정렬한다. 빨리 끝나는 창을 남길수록 뒤에 남는 시간이 최대다.", "last_end 를 들고 훑으며 iv[i].start \u003c last_end 면 제거(카운트만), 아니면 last_end 를 갱신."], "solution": "static int iv_cmp_end(const void *pa, const void *pb) {\n    const Interval *a = (const Interval *)pa, *b = (const Interval *)pb;\n    if (a->end   != b->end)   return (a->end   \u003c b->end)   ? -1 : 1;\n    if (a->start != b->start) return (a->start \u003c b->start) ? -1 : 1;\n    return 0;\n}\nsize_t erase_overlap_intervals(Interval *iv, size_t n) {\n    if (!iv || n \u003c= 1) return 0;\n    qsort(iv, n, sizeof *iv, iv_cmp_end);\n    size_t removed = 0;\n    long last_end = iv[0].end;                 /* 가장 빨리 끝나는 창을 무조건 유지 */\n    for (size_t i = 1; i \u003c n; i++) {\n        if (iv[i].start \u003c last_end) removed++; /* 겹침 → 끝이 더 늦은 이쪽을 버린다 */\n        else last_end = iv[i].end;\n    }\n    return removed;\n}", "explanation_ko": "PATTERN: greedy + exchange argument. 끝나는 시각이 가장 빠른 창을 남기는 선택은 절대 손해가 아니다 — 어떤 최적해든 그 창으로 바꿔치기해도 여전히 최적이기 때문(교환 논증). 그래서 end 오름차순 정렬 후 last_end 만 들고 한 번 훑으면 된다. 겹치면 '끝이 더 늦은 쪽'을 버리므로, 버리는 건 항상 현재 원소다. 여기서는 맞닿는 구간을 겹치지 않는 것으로 보므로 비교가 `\u003c` 다(Q70 의 `\u003c=` 와 반대). 비용은 정렬이 지배한다.", "complexity": "O(n log n) time (sort-dominated), O(1) extra space", "pitfalls": ["start 로 정렬 — 긴 구간 하나가 뒤를 다 막아 최적해가 아니게 된다", "맞닿는 구간을 겹침으로 세어 답이 커짐 (`\u003c=` 오용)", "제거할 때 배열을 실제로 조작 — 카운트만 하면 된다", "n\u003c=1 경계에서 iv[0] 접근"], "verkada_context": "게이트웨이 유지보수 창은 동시에 하나만 돈다. 겹치는 OTA/스캔 요청 중 최소 개수만 취소해 나머지를 최대한 살린다."}, {"num": 72, "slug": "top_k_events_minheap", "title_ko": "top-K 이벤트 — 크기 K min-heap", "title_en": "Top-K events with a size-K min-heap", "difficulty": "medium", "tags": ["heap", "top-k", "priority-queue", "streaming"], "prompt_ko": "이벤트 n 개 중 상위 K 개만 out 에 내림차순으로 쓰고 개수를 반환한다. 전체 정렬 금지 — 크기 K 의 min-heap 을 유지해 O(n log K). 힙 저장소는 호출자가 준 out[] 을 그대로 써서 할당이 0이다. 동점 규칙: score 가 같으면 dev_id 가 작은 쪽이 상위(결정적 출력).", "prompt_en": "Keep only the K best events using a size-K min-heap built inside the caller's out[] buffer; O(n log K) with zero allocation. Ties break on smaller dev_id for determinism.", "signature": "size_t top_k_events(const Event *ev, size_t n, size_t k, Event *out);", "examples": [{"in": "scores {5,90,12,90,3,47,47,1}, k=3", "out": "dev1002(90), dev1004(90), dev1006(47)"}, {"in": "k > n", "out": "n 개 전부를 내림차순으로"}], "hints": ["상위 K개만 필요한데 전체를 정렬하면 버릴 일을 다 한 셈이다.", "min-heap 의 루트는 '지금 상위 K개 중 가장 약한 것' = 다음 탈락 후보다. 새 이벤트는 루트와 한 번만 비교하면 된다.", "힙이 K 미만이면 push(sift_up), K 가 차면 루트보다 나을 때만 루트를 덮고 sift_down."], "solution": "static bool ev_better(const Event *a, const Event *b) {\n    if (a->score != b->score) return a->score > b->score;\n    return a->dev_id \u003c b->dev_id;\n}\nstatic void ev_sift_up(Event *h, size_t i) {\n    while (i > 0) {\n        size_t p = (i - 1) / 2;\n        if (!ev_better(&h[p], &h[i])) break;   /* 부모가 더 낮으면 정상 */\n        Event t = h[i]; h[i] = h[p]; h[p] = t;\n        i = p;\n    }\n}\nstatic void ev_sift_down(Event *h, size_t n, size_t i) {\n    for (;;) {\n        size_t l = 2 * i + 1, r = 2 * i + 2, low = i;\n        if (l \u003c n && ev_better(&h[low], &h[l])) low = l;\n        if (r \u003c n && ev_better(&h[low], &h[r])) low = r;\n        if (low == i) break;\n        Event t = h[i]; h[i] = h[low]; h[low] = t;\n        i = low;\n    }\n}\nstatic int ev_cmp_desc(const void *pa, const void *pb) {\n    const Event *a = (const Event *)pa, *b = (const Event *)pb;\n    if (ev_better(a, b)) return -1;\n    if (ev_better(b, a)) return 1;\n    return 0;\n}\nsize_t top_k_events(const Event *ev, size_t n, size_t k, Event *out) {\n    if (!ev || !out || k == 0 || n == 0) return 0;\n    size_t cnt = 0;\n    for (size_t i = 0; i \u003c n; i++) {\n        if (cnt \u003c k) {                          /* 힙이 덜 찼으면 그냥 push */\n            out[cnt] = ev[i];\n            ev_sift_up(out, cnt);\n            cnt++;\n        } else if (ev_better(&ev[i], &out[0])) { /* 루트(최하위)보다 나으면 교체 */\n            out[0] = ev[i];\n            ev_sift_down(out, cnt, 0);\n        }\n    }\n    qsort(out, cnt, sizeof *out, ev_cmp_desc);  /* 보고용으로 상위부터 정렬 */\n    return cnt;\n}", "explanation_ko": "PATTERN: bounded min-heap (streaming top-K). 전체 정렬은 O(n log n)에 대부분의 일을 버린다. 크기 K 힙은 O(n log K) time, O(K) space 이고 K 를 상수로 보면 사실상 선형이다. 핵심 관용구는 '루트가 곧 탈락 후보'라는 것 — 새 원소는 루트와 단 한 번 비교해 통과/탈락이 결정된다. 힙 저장소를 호출자의 out[] 으로 삼으면 할당이 0이고 마지막에 그 자리에서 정렬만 하면 보고용 배열이 된다. 동점 규칙(dev_id 오름차순)을 정의해야 출력이 결정적이다 — 힙 내부 순서에 의존하면 테스트가 플래키해진다.", "complexity": "O(n log k) time, O(k) space (heap lives in the caller's out[])", "pitfalls": ["전체 정렬 후 앞 k개 — O(n log n) 으로 퇴보", "max-heap 사용 — 탈락 후보를 O(1)에 못 얻는다", "동점 규칙 미정의 → 출력이 비결정적", "sift_down 에서 l\u003cn 가드를 비교보다 뒤에 둠 (범위 밖 읽기)", "힙 배열 순서가 곧 정렬 순서라고 착각"], "verkada_context": "fleet 대시보드는 200만 대 중 '지금 가장 심각한 카메라 10대'만 보여준다. top-k 는 Verkada 인터뷰에서 보고된 유형이다."}, {"num": 73, "slug": "agg_open_addressing", "title_ko": "이벤트 스트림 집계 — 디바이스별 상태 카운트", "title_en": "Event stream aggregation with an open-addressing hash map", "difficulty": "medium", "tags": ["hash-map", "open-addressing", "linear-probing", "aggregation", "fixed-size"], "prompt_ko": "상태 변경 스트림을 받아 디바이스(문자열 키)별 online/offline/degraded 횟수를 센다. STL 이 없으므로 문자열 해시맵을 직접 짠다 — FNV-1a + 선형 탐사, 슬롯 수는 2의 거듭제곱(& 마스킹). 테이블 포화/빈 키/너무 긴 키는 조용히 버리지 말고 false + dropped++ 로 보고한다.", "prompt_en": "Hand-rolled fixed-size open-addressing string hash map that counts per-device state transitions; report saturation and bad keys instead of dropping silently.", "signature": "bool agg_record(Aggregator *a, const char *dev, DevState st); bool agg_get(const Aggregator *a, const char *dev, uint32_t out[DEV_STATE_COUNT]);", "examples": [{"in": "record(\"GC31-0042\", OFFLINE) x2, record(\"GC31-0042\", ONLINE)", "out": "counts[OFFLINE]==2, counts[ONLINE]==1"}, {"in": "64 슬롯을 모두 채운 뒤 65번째 디바이스", "out": "false, dropped==1"}], "hints": ["슬롯 수를 2의 거듭제곱으로 잡으면 `% cap` 이 `& (cap-1)` 이 된다 — 나눗셈 없는 MCU 에서 중요.", "탐사(probe) 루프에는 반드시 `p \u003c cap` 상한을 건다. 없으면 가득 찬 테이블에서 무한 루프.", "find 와 insert 를 같은 탐사 루프로 통일하라: '찾으면 그 슬롯, 없으면 첫 빈 슬롯, 포화면 cap'."], "solution": "static uint32_t fnv1a(const char *s) {\n    uint32_t h = 2166136261u;\n    while (*s) { h ^= (uint8_t)*s++; h *= 16777619u; }\n    return h;\n}\nstatic size_t agg_probe(const AggSlot *slots, const char *dev, bool *found) {\n    size_t i = (size_t)fnv1a(dev) & (AGG_SLOTS - 1);\n    for (size_t p = 0; p \u003c AGG_SLOTS; p++) {\n        size_t j = (i + p) & (AGG_SLOTS - 1);\n        if (!slots[j].used)                 { *found = false; return j; }\n        if (strcmp(slots[j].dev, dev) == 0) { *found = true;  return j; }\n    }\n    *found = false;\n    return AGG_SLOTS;                        /* 포화 */\n}\nvoid agg_init(Aggregator *a) { if (a) memset(a, 0, sizeof *a); }\nbool agg_record(Aggregator *a, const char *dev, DevState st) {\n    if (!a || !dev) return false;\n    if (st \u003c 0 || st >= DEV_STATE_COUNT) { a->dropped++; return false; }\n    size_t len = strlen(dev);\n    if (len == 0 || len >= AGG_DEV_LEN) { a->dropped++; return false; }  /* 잘림 금지 */\n\n    bool found = false;\n    size_t j = agg_probe(a->slot, dev, &found);\n    if (j == AGG_SLOTS) { a->dropped++; return false; }\n    if (!found) {\n        memcpy(a->slot[j].dev, dev, len + 1);\n        a->slot[j].used = true;\n        a->n_used++;\n    }\n    a->slot[j].counts[st]++;\n    return true;\n}\nbool agg_get(const Aggregator *a, const char *dev, uint32_t out[DEV_STATE_COUNT]) {\n    if (!a || !dev) return false;\n    bool found = false;\n    size_t j = agg_probe(a->slot, dev, &found);\n    if (!found || j == AGG_SLOTS) return false;\n    if (out) for (int s = 0; s \u003c DEV_STATE_COUNT; s++) out[s] = a->slot[j].counts[s];\n    return true;\n}", "explanation_ko": "PATTERN: open addressing + linear probing. 노드별 할당이 없어 하나의 평평한 배열에 들어가므로 캐시 지역성이 좋고 고정 메모리 예산에 딱 맞는다. 대가는 두 가지 — 부하율이 0.7 을 넘으면 탐사 거리가 급증하고, 삭제하려면 tombstone 이 필요하다(집계는 삭제가 없어 문제없다). 탐사 루프의 상한 `p \u003c cap` 이 포화 상태의 무한 루프를 막는 안전장치다. 키 길이 검증을 먼저 해서 '잘림으로 인한 가짜 충돌'을 원천 차단하고, 버린 이벤트는 dropped 로 센다 — 조용한 손실은 필드에서 가장 디버깅하기 어렵다.", "complexity": "O(1) average per record/get (O(slots) worst case), O(AGG_SLOTS) space (static)", "pitfalls": ["탐사 루프에 상한이 없어 포화 시 무한 루프", "슬롯 수가 2의 거듭제곱이 아니라 % 나눗셈 사용", "긴 키를 잘라서 저장 → 서로 다른 디바이스가 같은 키로 뭉침", "부하율을 무시하고 원소 수와 슬롯 수를 같게 잡음", "포화/거부를 조용히 무시 (dropped 카운터 없음)"], "verkada_context": "\"Camera States\" 유형. 카메라/게이트웨이 상태 변경 스트림을 디바이스별로 집계해 Command 에 올린다."}, {"num": 74, "slug": "token_bucket_limiter", "title_ko": "토큰 버킷 rate limiter (시간 주입)", "title_en": "Token bucket rate limiter with an injected clock", "difficulty": "medium", "tags": ["rate-limit", "token-bucket", "testability", "integer-math", "monotonic-clock"], "prompt_ko": "\"평균 R개/초, 순간 최대 C개\"를 보장하는 토큰 버킷을 구현한다. 부동소수점 없이 milli-token(1/1000 토큰) 정수로 계산한다. 시간은 인자로 주입(now_ms)해 sleep 없이 결정적으로 테스트한다. 시계가 뒤로 가면 충전하지 말고 재동기화만 한다.", "prompt_en": "Integer (milli-token) token bucket with the clock passed in as a parameter; O(1) per call, no timer thread, and monotonicity-safe.", "signature": "bool tb_allow(TokenBucket *tb, uint64_t now_ms, uint32_t cost);", "examples": [{"in": "cap=5, rate=2/s; t=1000 에서 6번 시도", "out": "5개 허용, 6번째 거부"}, {"in": "t=1500 (500ms 경과)", "out": "1개만 추가 허용 (2/s × 0.5s)"}], "hints": ["타이머 스레드는 필요 없다. '마지막 호출 이후 흐른 시간이 벌어들인 토큰'을 그때그때 계산하면 된다.", "float 대신 milli-token 정수로 들면 FPU 없는 파트에서도 같은 코드가 돌고 반올림 오차가 없다.", "clock_gettime 을 함수 안에서 부르지 말고 now_ms 를 인자로 받아라. 그래야 테스트가 sleep 없이 결정적이다."], "solution": "void tb_init(TokenBucket *tb, uint32_t capacity, uint32_t refill_per_sec, uint64_t now_ms) {\n    if (!tb) return;\n    memset(tb, 0, sizeof *tb);\n    tb->cap_milli      = (uint64_t)capacity * 1000u;\n    tb->tokens_milli   = tb->cap_milli;      /* 처음엔 가득 = 즉시 버스트 허용 */\n    tb->refill_per_sec = refill_per_sec;\n    tb->last_ms        = now_ms;\n}\nstatic void tb_refill(TokenBucket *tb, uint64_t now_ms) {\n    if (now_ms \u003c= tb->last_ms) { tb->last_ms = now_ms; return; }  /* 시계 역행 → 재동기화만 */\n    uint64_t elapsed = now_ms - tb->last_ms;\n    tb->tokens_milli += elapsed * (uint64_t)tb->refill_per_sec;\n    if (tb->tokens_milli > tb->cap_milli) tb->tokens_milli = tb->cap_milli;\n    tb->last_ms = now_ms;\n}\nbool tb_allow(TokenBucket *tb, uint64_t now_ms, uint32_t cost) {\n    if (!tb) return false;\n    tb_refill(tb, now_ms);\n    uint64_t need = (uint64_t)cost * 1000u;\n    if (tb->tokens_milli \u003c need) { tb->rejected++; return false; }\n    tb->tokens_milli -= need;\n    tb->allowed++;\n    return true;\n}\nuint32_t tb_available(const TokenBucket *tb) {\n    return tb ? (uint32_t)(tb->tokens_milli / 1000u) : 0u;\n}", "explanation_ko": "PATTERN: lazy refill + dependency injection. 토큰 버킷은 '지속 처리율(rate)'과 '버스트 크기(capacity)'라는 서로 독립적인 두 손잡이를 한 구조체로 표현한다. 백그라운드 타이머가 필요 없다 — 호출 시점에 경과 시간만큼 충전하고 cap 으로 clamp 하면 O(1). 정수 milli-token 으로 들어 FPU 가 없어도 같고, 1ms 당 refill_per_sec milli-token 이라 나눗셈조차 없다. 시각을 인자로 받는 것이 이 문제의 진짜 교훈이다: 하드웨어/커널 의존성을 경계 밖으로 밀어내면 단위 테스트가 마이크로초 만에 끝나고 절대 플래키하지 않다. 시계 역행(NTP step, 재부팅)은 충전 0 + last_ms 재동기화로 방어한다.", "complexity": "O(1) time per call, O(1) space", "pitfalls": ["함수 안에서 clock_gettime 호출 → 테스트가 sleep 에 의존하고 플래키", "CLOCK_REALTIME 사용 → NTP step 에 토큰이 튄다 (CLOCK_MONOTONIC 이어야 한다)", "시계 역행 시 음수 elapsed → 거대한 충전량", "cap clamp 누락 → 오래 쉰 뒤 무제한 버스트", "float 사용 → 반올림 오차로 경계 테스트가 흔들림"], "verkada_context": "링크가 살아나는 순간 큐에 쌓인 알람/업로드가 한꺼번에 터지면 LTE 업링크를 잡아먹는다. 토큰 버킷으로 평균과 버스트를 동시에 제한한다."}, {"num": 75, "slug": "merge_sorted_log_streams", "title_ko": "타임스탬프 정렬 병합 — 두 로그 스트림을 하나로", "title_en": "Stable merge of two timestamp-sorted log streams", "difficulty": "easy", "tags": ["two-pointer", "merge", "stable", "bounded-output"], "prompt_ko": "이미 ts 오름차순인 두 배열을 two-pointer 로 한 번에 병합한다(다시 정렬 금지). 안정성: ts 가 같으면 스트림 A 를 먼저 쓴다. out_cap 을 넘으면 잘라내고 실제로 쓴 개수를 반환한다. NULL 스트림은 길이 0으로 취급한다.", "prompt_en": "Two-pointer merge of two already-sorted log arrays into a capped output buffer; ties keep stream A first so the result is stable.", "signature": "size_t merge_logs(const LogRec *a, size_t na, const LogRec *b, size_t nb, LogRec *out, size_t out_cap);", "examples": [{"in": "A ts {10,30,50}, B ts {20,40}", "out": "10,20,30,40,50 (5개)"}, {"in": "A ts {7,7}, B ts {7}", "out": "A,A,B 순서 (stable)"}], "hints": ["두 입력이 이미 정렬돼 있다는 정보를 버리지 마라 — 다시 정렬하면 O(n log n) 이다.", "동점일 때 어느 쪽을 먼저 꺼내는지가 안정성을 결정한다. `b[j].ts \u003c a[i].ts` 로 비교하면 동점에 a 가 나간다.", "출력 버퍼 상한(out_cap)을 세 루프 모두에 넣어야 고정 버퍼가 안전하다."], "solution": "size_t merge_logs(const LogRec *a, size_t na, const LogRec *b, size_t nb,\n                  LogRec *out, size_t out_cap) {\n    if (!out || out_cap == 0) return 0;\n    if (!a) na = 0;\n    if (!b) nb = 0;\n    size_t i = 0, j = 0, w = 0;\n    while (i \u003c na && j \u003c nb && w \u003c out_cap) {\n        if (b[j].ts \u003c a[i].ts) out[w++] = b[j++];   /* 동점(==)이면 a 우선 = stable */\n        else                   out[w++] = a[i++];\n    }\n    while (i \u003c na && w \u003c out_cap) out[w++] = a[i++];\n    while (j \u003c nb && w \u003c out_cap) out[w++] = b[j++];\n    return w;\n}", "explanation_ko": "PATTERN: two-pointer merge (merge sort 의 merge 단계). 두 스트림이 이미 정렬돼 있으므로 다시 정렬하는 건 이미 가진 정보를 버리는 것이다 — 병합은 O(na+nb) 단일 패스이고 추가 공간이 없다. 비교를 `b[j].ts \u003c a[i].ts` 로 쓰면 동점일 때 a 가 먼저 나가 stable 하다. 안정성은 취향이 아니라 계약이다: 같은 입력이면 항상 같은 출력이어야 로그 뷰가 재현 가능하고 회귀 테스트가 성립한다. out_cap 을 세 루프 모두에서 검사해 고정 버퍼를 넘지 않는다. k개 스트림으로 확장하면 스트림당 헤드를 담은 크기 k min-heap 으로 O(N log k).", "complexity": "O(na + nb) time, O(1) extra space (writes into the caller's buffer)", "pitfalls": ["이어붙인 뒤 qsort — 정보를 버리고 O(n log n)", "동점 규칙 미정의 → 출력 순서가 비결정적", "꼬리 복사 루프에서 out_cap 검사 누락 → 버퍼 오버런", "NULL 스트림/길이 0 처리 누락"], "verkada_context": "\"Camera Logs API\" 유형. 게이트웨이 로컬 로그와 카메라 업로드 로그를 Command 에서 하나의 시간순 뷰로 합친다."}, {"num": 76, "slug": "recent_n_dedup", "title_ko": "최근 N개 기반 중복 제거 (순환 버퍼 + 해시)", "title_en": "Recent-N alarm deduplication (ring buffer + hash)", "difficulty": "hard", "tags": ["ring-buffer", "hash-chain", "dedup", "alarm-suppression", "no-malloc"], "prompt_ko": "최근 N개의 '서로 다른' 알람 키만 기억해, 그 창 안에 있으면 억제(false), 없으면 등록하고 내보낸다(true). 순환 버퍼(FIFO 창) + 해시(멤버십 O(1))의 조합이다. 창에서 밀려난 항목은 해시에서도 정확히 제거되어야 한다. 할당 금지 — 링 슬롯 자체가 해시 체인 노드다.", "prompt_en": "Suppress an alarm if its key is among the last N distinct keys. A ring buffer is the FIFO window and an intrusive hash chain gives O(1) membership; evicted entries must leave the hash too.", "signature": "bool dedup_should_emit(Dedup *d, uint32_t key);", "examples": [{"in": "A, A, B", "out": "emit, suppress, emit (suppressed==1)"}, {"in": "같은 알람 100회 연속", "out": "emitted==1, suppressed==99"}], "hints": ["창을 선형 스캔하면 O(N) 이다. '멤버십을 O(1)로 만들 수 있나?'가 반드시 follow-up 으로 온다.", "링 슬롯에 hnext 필드를 하나 얹으면 슬롯이 곧 해시 체인 노드가 된다 — 별도 할당이 없다.", "덮어쓸 슬롯이 이미 쓰였다면 **먼저** 그 키를 버킷 체인에서 빼야 한다. 순서를 바꾸면 유령 엔트리가 남는다."], "solution": "static uint32_t dd_mix(uint32_t x) { x *= 2654435761u; return x ^ (x >> 16); }\nstatic void dd_bucket_remove(Dedup *d, int idx) {\n    int b = (int)(dd_mix(d->ring[idx].key) & (DEDUP_SLOTS - 1));\n    int *link = &d->bucket[b];\n    while (*link != DEDUP_NIL) {\n        if (*link == idx) { *link = d->ring[idx].hnext; return; }\n        link = &d->ring[*link].hnext;\n    }\n}\nvoid dedup_init(Dedup *d) {\n    if (!d) return;\n    memset(d, 0, sizeof *d);\n    for (int i = 0; i \u003c DEDUP_SLOTS; i++) d->bucket[i] = DEDUP_NIL;\n    for (int i = 0; i \u003c DEDUP_WINDOW; i++) { d->ring[i].used = false; d->ring[i].hnext = DEDUP_NIL; }\n}\nbool dedup_should_emit(Dedup *d, uint32_t key) {\n    if (!d) return false;\n    int b = (int)(dd_mix(key) & (DEDUP_SLOTS - 1));\n    for (int i = d->bucket[b]; i != DEDUP_NIL; i = d->ring[i].hnext) {\n        if (d->ring[i].key == key) { d->suppressed++; return false; }\n    }\n    int slot = (int)d->pos;\n    if (d->ring[slot].used) dd_bucket_remove(d, slot);   /* 창 밖으로 밀려난 키 제거 */\n    d->ring[slot].key   = key;\n    d->ring[slot].used  = true;\n    d->ring[slot].hnext = d->bucket[b];\n    d->bucket[b] = slot;\n    d->pos = (d->pos + 1) % DEDUP_WINDOW;\n    d->emitted++;\n    return true;\n}", "explanation_ko": "PATTERN: fixed window + intrusive hash chain. 순환 버퍼가 'N개 창'이라는 만료 정책을 O(1)로 제공하고, 해시 체인이 '이 키가 창 안에 있나'를 O(1)로 제공한다. 억제된 키는 창에 다시 넣지 않으므로 창 안에 같은 키가 두 번 들어가는 일이 없다 — 덕분에 체인 제거가 단순해진다. 버킷 제거는 `int *link` 로 '이전 노드의 hnext 필드'를 가리키는 관용구를 쓰면 head/중간 분기가 사라진다. 저장소는 전부 구조체 안의 고정 배열이라 malloc 이 0이다. 시간 기준(예: 30초) 창이 필요하면 슬롯에 타임스탬프를 같이 넣고 앞에서 만료시키면 여전히 amortized O(1).", "complexity": "O(1) average time per alarm, O(N) space (static ring + buckets)", "pitfalls": ["창을 선형 스캔 — O(N) 이고 follow-up 에서 막힌다", "밀려난 항목을 해시에서 제거하지 않아 영원히 억제되는 유령 키 발생", "덮어쓰기와 체인 제거 순서를 바꿈", "억제 횟수를 세지 않음 — 억제는 '손실'이므로 관측 가능해야 한다"], "verkada_context": "\"Filter Alerts\" 유형. 링크 플래핑 중이면 'device offline' 알람이 초당 수십 번 올라온다. 최근 창 기반 억제로 Command 와 사용자 알림을 보호한다."}, {"num": 77, "slug": "ts_range_binary_search", "title_ko": "시간 범위 쿼리 (lower_bound / upper_bound)", "title_en": "Time-range query with lower_bound / upper_bound", "difficulty": "easy", "tags": ["binary-search", "lower-bound", "upper-bound", "range-query"], "prompt_ko": "append-only 로그는 이미 시간순이다. 선형 스캔 대신 lower_bound(첫 >= key)/upper_bound(첫 > key)를 직접 구현해 O(log n) 에 [lo,hi] 닫힌 구간을 잘라낸다. 중복 타임스탬프가 있어도 두 경계가 구간 전체를 정확히 감싸야 한다.", "prompt_en": "Hand-rolled lower_bound/upper_bound over a sorted timestamp array; ts_range returns the count insi
