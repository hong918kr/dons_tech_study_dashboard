<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" width="720" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6f6680"/></marker></defs>
<rect width="720" height="396" fill="#ffffff"/>
<text x="20" y="24" fill="#2e2939" font-weight="700" font-size="13">Pipeline for msb = 0xFF, lsb = 0xF0  (−0.0625 °C)</text>
<text x="430" y="24" fill="#c4554e" font-weight="700" font-size="13">Pitfalls (wrong answers)</text>
<rect x="20" y="40" width="360" height="42" rx="8" fill="#ffffff" stroke="#5677c9" stroke-width="1.5"/>
<text x="32" y="57" fill="#2e2939" font-weight="600">① bytes</text>
<text x="32" y="74" fill="#5677c9" font-weight="700">msb = 0xFF,  lsb = 0xF0</text>
<line x1="200.0" y1="82" x2="200.0" y2="95" stroke="#6f6680" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="20" y="96" width="360" height="42" rx="8" fill="#ffffff" stroke="#5677c9" stroke-width="1.5"/>
<text x="32" y="113" fill="#2e2939" font-weight="600">② reg = (msb &lt;&lt; 8) | (lsb &amp; 0xF0)</text>
<text x="32" y="130" fill="#5677c9" font-weight="700">0xFFF0  (uint16 65520)</text>
<line x1="200.0" y1="138" x2="200.0" y2="151" stroke="#6f6680" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="20" y="152" width="360" height="42" rx="8" fill="#ffffff" stroke="#5677c9" stroke-width="1.5"/>
<text x="32" y="169" fill="#2e2939" font-weight="600">③ s16 = (int16_t)reg</text>
<text x="32" y="186" fill="#5677c9" font-weight="700">−16</text>
<line x1="200.0" y1="194" x2="200.0" y2="207" stroke="#6f6680" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="20" y="208" width="360" height="42" rx="8" fill="#ffffff" stroke="#5677c9" stroke-width="1.5"/>
<text x="32" y="225" fill="#2e2939" font-weight="600">④ counts = s16 / 16</text>
<text x="32" y="242" fill="#5677c9" font-weight="700">−1   (exact: low 4 bits are 0)</text>
<line x1="200.0" y1="250" x2="200.0" y2="263" stroke="#6f6680" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="20" y="264" width="360" height="42" rx="8" fill="#ffffff" stroke="#5677c9" stroke-width="1.5"/>
<text x="32" y="281" fill="#2e2939" font-weight="600">⑤ num = counts × 625</text>
<text x="32" y="298" fill="#5677c9" font-weight="700">−625   (= −6.25 c100)</text>
<line x1="200.0" y1="306" x2="200.0" y2="319" stroke="#6f6680" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="20" y="320" width="360" height="42" rx="8" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="1.5"/>
<text x="32" y="337" fill="#2e2939" font-weight="600">⑥ (num − 50) / 100</text>
<text x="32" y="354" fill="#2f8a5f" font-weight="700">−675 / 100 → −6   ✓</text>
<rect x="430" y="96" width="270" height="42" rx="8" fill="#fce5e2" stroke="#c4554e" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="440" y="113" fill="#2e2939" font-weight="600">reg &gt;&gt; 4 on uint16</text>
<text x="440" y="130" fill="#c4554e" font-weight="700">0x0FFF = 4095 → 25594 (255.94 °C ✗)</text>
<line x1="380" y1="117.0" x2="428" y2="117.0" stroke="#c4554e" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ar)"/>
<rect x="430" y="152" width="270" height="42" rx="8" fill="#fcf0d6" stroke="#a9700f" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="440" y="169" fill="#2e2939" font-weight="600">s16 &gt;&gt; 4  (negative &gt;&gt;)</text>
<text x="440" y="186" fill="#a9700f" font-weight="700">implementation-defined in C ⚠</text>
<line x1="380" y1="173.0" x2="428" y2="173.0" stroke="#a9700f" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ar)"/>
<rect x="430" y="208" width="270" height="42" rx="8" fill="#fce5e2" stroke="#c4554e" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="440" y="225" fill="#2e2939" font-weight="600">forgot lsb &amp; 0xF0 (0xFF,0xFF)</text>
<text x="440" y="242" fill="#c4554e" font-weight="700">−1 / 16 = 0 → 0 instead of −6 ✗</text>
<line x1="380" y1="229.0" x2="428" y2="229.0" stroke="#c4554e" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ar)"/>
<rect x="430" y="320" width="270" height="42" rx="8" fill="#fce5e2" stroke="#c4554e" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="440" y="337" fill="#2e2939" font-weight="600">num / 100  (no ±50)</text>
<text x="440" y="354" fill="#c4554e" font-weight="700">−6 here, but 12.5 → 12 (want 13) ✗</text>
<line x1="380" y1="341.0" x2="428" y2="341.0" stroke="#c4554e" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ar)"/>
<text x="20" y="386" fill="#8a8297" font-size="11">C의 / 는 0 방향으로 자릅니다: −6.75 → −6. 그래서 음수는 −50, 양수는 +50 을 먼저 더해 "0에서 먼 쪽 반올림"을 만듭니다.</text>
</svg>
