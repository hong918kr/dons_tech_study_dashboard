<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
  <defs>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#a9700f"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2f8a5f"/></marker>
  </defs>
  <rect width="720" height="260" fill="#ffffff"/>
  <!-- legend -->
  <line x1="60" y1="26" x2="84" y2="26" stroke="#a9700f" stroke-width="2"/><text x="90" y="30" fill="#a9700f" font-weight="600">C '/' truncates toward zero</text>
  <line x1="330" y1="26" x2="354" y2="26" stroke="#2f8a5f" stroke-width="2"/><text x="360" y="30" fill="#2f8a5f" font-weight="600">round half away from zero (our rule)</text>
  <!-- left panel: x = 60 + 80*(v+9) -->
  <line x1="60" y1="110" x2="300" y2="110" stroke="#b9b0c6" stroke-width="1.5"/>
  <g stroke="#b9b0c6"><line x1="140" y1="104" x2="140" y2="116"/><line x1="220" y1="104" x2="220" y2="116"/></g>
  <text x="300" y="98" text-anchor="end" fill="#8a8297" font-size="11">toward 0 →</text>
  <path d="M180,102 C186,72 214,72 219,100" fill="none" stroke="#a9700f" stroke-width="1.8" marker-end="url(#aa)"/>
  <text x="200" y="68" text-anchor="middle" fill="#a9700f" font-weight="700">−7</text>
  <path d="M180,102 C174,72 146,72 141,100" fill="none" stroke="#2f8a5f" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="160" y="68" text-anchor="middle" fill="#2f8a5f" font-weight="700">−8</text>
  <circle cx="180" cy="110" r="5" fill="#5677c9" stroke="#fff" stroke-width="1.5"/>
  <g fill="#8a8297" text-anchor="middle"><text x="140" y="130">−8</text><text x="220" y="130">−7</text></g>
  <text x="180" y="152" text-anchor="middle" fill="#5677c9" font-weight="700">−15/2 = −7.5</text>
  <!-- right panel: x = 420 + 80*(v-6) -->
  <line x1="420" y1="110" x2="660" y2="110" stroke="#b9b0c6" stroke-width="1.5"/>
  <g stroke="#b9b0c6"><line x1="500" y1="104" x2="500" y2="116"/><line x1="580" y1="104" x2="580" y2="116"/></g>
  <text x="420" y="98" fill="#8a8297" font-size="11">← toward 0</text>
  <path d="M540,102 C534,72 506,72 501,100" fill="none" stroke="#a9700f" stroke-width="1.8" marker-end="url(#aa)"/>
  <text x="520" y="68" text-anchor="middle" fill="#a9700f" font-weight="700">7</text>
  <path d="M540,102 C546,72 574,72 579,100" fill="none" stroke="#2f8a5f" stroke-width="1.8" marker-end="url(#ag)"/>
  <text x="560" y="68" text-anchor="middle" fill="#2f8a5f" font-weight="700">8</text>
  <circle cx="540" cy="110" r="5" fill="#5677c9" stroke="#fff" stroke-width="1.5"/>
  <g fill="#8a8297" text-anchor="middle"><text x="500" y="130">7</text><text x="580" y="130">8</text></g>
  <text x="540" y="152" text-anchor="middle" fill="#5677c9" font-weight="700">15/2 = 7.5</text>
  <!-- formula box -->
  <rect x="56" y="186" width="608" height="62" rx="8" fill="#f0e7fb" stroke="#8a5cc0"/>
  <text x="80" y="208" fill="#8a5cc0" font-weight="600">sum ≥ 0:  (sum + cnt/2) / cnt</text>
  <text x="370" y="208" fill="#8a5cc0" font-weight="600">sum &lt; 0:  −((−sum + cnt/2) / cnt)</text>
  <text x="360" y="232" text-anchor="middle" fill="#c4554e">trap: using (sum + cnt/2) / cnt for sum = −15 gives (−15 + 1) / 2 = −7, not −8</text>
</svg>
