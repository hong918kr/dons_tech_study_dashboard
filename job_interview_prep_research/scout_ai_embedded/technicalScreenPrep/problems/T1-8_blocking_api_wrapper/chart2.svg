<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
<rect width="720" height="290" fill="#ffffff"/>
<text x="16" y="26" fill="#2f8a5f" font-weight="700" font-size="13">✓ lock only around the copy</text>
<rect x="16" y="38" width="330" height="192" rx="8" fill="#ffffff" stroke="#b9b0c6"/>
<rect x="22" y="134" width="318" height="66" rx="5" fill="#e2f4e9" stroke="#2f8a5f" stroke-dasharray="4 3"/>
<text x="30" y="61" fill="#2e2939" xml:space="preserve">while (running) {</text>
<text x="30" y="83" fill="#2e2939" xml:space="preserve">  v = read_temp();</text>
<text x="334" y="83" text-anchor="end" fill="#8a8297" font-size="11">≤ 1 s, no lock</text>
<text x="30" y="105" fill="#2e2939" xml:space="preserve">  if (v == TEMP_ERR) continue;</text>
<text x="30" y="127" fill="#2e2939" xml:space="preserve">  t = now_ms();</text>
<text x="30" y="149" fill="#2e2939" xml:space="preserve">  lock(&amp;g_mx);</text>
<text x="30" y="171" fill="#2e2939" xml:space="preserve">  latest = v; push(t, v);</text>
<text x="334" y="171" text-anchor="end" fill="#8a8297" font-size="11">µs</text>
<text x="30" y="193" fill="#2e2939" xml:space="preserve">  unlock(&amp;g_mx);</text>
<text x="30" y="215" fill="#2e2939" xml:space="preserve">}</text>
<text x="16" y="256" fill="#2f8a5f" font-size="12" font-weight="600">critical section = a few stores (µs)</text>
<text x="16" y="274" fill="#2f8a5f" font-size="12" font-weight="600">get_latest_temp() never waits for I2C</text>
<text x="372" y="26" fill="#c4554e" font-weight="700" font-size="13">✗ lock held across read_temp()</text>
<rect x="372" y="38" width="330" height="148" rx="8" fill="#ffffff" stroke="#b9b0c6"/>
<rect x="378" y="68" width="318" height="88" rx="5" fill="#fce5e2" stroke="#c4554e" stroke-dasharray="4 3"/>
<text x="386" y="61" fill="#2e2939" xml:space="preserve">while (running) {</text>
<text x="386" y="83" fill="#2e2939" xml:space="preserve">  lock(&amp;g_mx);</text>
<text x="386" y="105" fill="#2e2939" xml:space="preserve">  v = read_temp();</text>
<text x="690" y="105" text-anchor="end" fill="#8a8297" font-size="11">≤ 1 s, LOCKED</text>
<text x="386" y="127" fill="#2e2939" xml:space="preserve">  latest = v; push(t, v);</text>
<text x="386" y="149" fill="#2e2939" xml:space="preserve">  unlock(&amp;g_mx);</text>
<text x="386" y="171" fill="#2e2939" xml:space="preserve">}</text>
<text x="372" y="212" fill="#c4554e" font-size="12" font-weight="600">critical section = one sensor read (≤ 1 s)</text>
<text x="372" y="230" fill="#c4554e" font-size="12" font-weight="600">get_latest_temp() blocks up to 1 s ✗</text>
<text x="372" y="248" fill="#c4554e" font-size="12" font-weight="600">is_overheating() stalls the control loop ✗</text>
</svg>
