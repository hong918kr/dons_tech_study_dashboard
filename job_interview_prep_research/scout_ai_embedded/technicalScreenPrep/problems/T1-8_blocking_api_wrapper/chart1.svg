<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
<rect width="720" height="330" fill="#ffffff"/>
<text x="16" y="74" fill="#2e2939" font-weight="600">sampler thread</text>
<line x1="140" y1="70" x2="680" y2="70" stroke="#b9b0c6" stroke-opacity=".45"/>
<text x="16" y="144" fill="#2e2939" font-weight="600">caller A</text>
<line x1="140" y1="140" x2="680" y2="140" stroke="#b9b0c6" stroke-opacity=".45"/>
<text x="16" y="194" fill="#2e2939" font-weight="600">caller B</text>
<line x1="140" y1="190" x2="680" y2="190" stroke="#b9b0c6" stroke-opacity=".45"/>
<text x="16" y="250" fill="#2e2939" font-weight="600">mutex g_mx</text>
<line x1="140" y1="246" x2="680" y2="246" stroke="#b9b0c6" stroke-opacity=".45"/>
<line x1="140" y1="276" x2="680" y2="276" stroke="#b9b0c6"/>
<line x1="140" y1="272" x2="140" y2="280" stroke="#b9b0c6"/><text x="140" y="294" text-anchor="middle" fill="#8a8297" font-size="11">0 s</text>
<line x1="320" y1="272" x2="320" y2="280" stroke="#b9b0c6"/><text x="320" y="294" text-anchor="middle" fill="#8a8297" font-size="11">1 s</text>
<line x1="500" y1="272" x2="500" y2="280" stroke="#b9b0c6"/><text x="500" y="294" text-anchor="middle" fill="#8a8297" font-size="11">2 s</text>
<line x1="680" y1="272" x2="680" y2="280" stroke="#b9b0c6"/><text x="680" y="294" text-anchor="middle" fill="#8a8297" font-size="11">3 s</text>
<rect x="140.0" y="58" width="171.0" height="24" rx="5" fill="#fcf0d6" stroke="#a9700f"/>
<text x="225.5" y="74" text-anchor="middle" fill="#a9700f" font-weight="600" font-size="11">read_temp()  ~1 s, no lock</text>
<rect x="311.0" y="54" width="5" height="32" fill="#8a5cc0"/>
<rect x="316.4" y="58" width="165.6" height="24" rx="5" fill="#fcf0d6" stroke="#a9700f"/>
<text x="399.2" y="74" text-anchor="middle" fill="#a9700f" font-weight="600" font-size="11">read_temp()</text>
<rect x="482.0" y="54" width="5" height="32" fill="#8a5cc0"/>
<rect x="487.4" y="58" width="180.0" height="24" rx="5" fill="#fcf0d6" stroke="#a9700f"/>
<text x="577.4" y="74" text-anchor="middle" fill="#a9700f" font-weight="600" font-size="11">read_temp() → TEMP_ERR</text>
<text x="313.0" y="48" text-anchor="middle" fill="#8a5cc0" font-size="11" font-weight="700">publish v1</text>
<text x="484.0" y="48" text-anchor="middle" fill="#8a5cc0" font-size="11" font-weight="700">publish v2</text>
<text x="667.4" y="48" text-anchor="end" fill="#c4554e" font-size="11" font-weight="700">dropped, keep v2</text>
<rect x="209.0" y="130" width="6" height="20" fill="#2f8a5f"/>
<text x="220.0" y="144" fill="#2f8a5f" font-size="11">latest → false</text>
<rect x="371.0" y="130" width="6" height="20" fill="#2f8a5f"/>
<text x="382.0" y="144" fill="#2f8a5f" font-size="11">latest → v1</text>
<rect x="569.0" y="130" width="6" height="20" fill="#2f8a5f"/>
<text x="580.0" y="144" fill="#2f8a5f" font-size="11">latest → v2</text>
<rect x="263.0" y="180" width="6" height="20" fill="#2f8a5f"/>
<text x="274.0" y="194" fill="#2f8a5f" font-size="11">overheat?</text>
<rect x="506.0" y="180" width="6" height="20" fill="#2f8a5f"/>
<text x="517.0" y="194" fill="#2f8a5f" font-size="11">overheat?</text>
<rect x="614.0" y="180" width="6" height="20" fill="#2f8a5f"/>
<text x="625.0" y="194" fill="#2f8a5f" font-size="11">overheat?</text>
<rect x="311.0" y="238" width="5" height="16" fill="#8a5cc0"/>
<rect x="482.0" y="238" width="5" height="16" fill="#8a5cc0"/>
<rect x="209.0" y="238" width="6" height="16" fill="#2f8a5f"/>
<rect x="371.0" y="238" width="6" height="16" fill="#2f8a5f"/>
<rect x="569.0" y="238" width="6" height="16" fill="#2f8a5f"/>
<rect x="263.0" y="238" width="6" height="16" fill="#2f8a5f"/>
<rect x="506.0" y="238" width="6" height="16" fill="#2f8a5f"/>
<rect x="614.0" y="238" width="6" height="16" fill="#2f8a5f"/>
<text x="140" y="24" fill="#2e2939" font-weight="700" font-size="13">One sampler owns the sensor; callers only touch the cached copy</text>
<text x="140" y="316" fill="#8a8297" font-size="11">Mutex is held for a copy (µs), never during read_temp() — callers never wait for the sensor.</text>
</svg>
