<path d="M380,154 H302" fill="none" stroke="#6f6680" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="450" y="274" text-anchor="middle" fill="#8a8297" font-size="11">uint32_t subtraction → wrap-safe</text>
<rect x="370" y="286" width="370" height="100" rx="10" fill="#f0e7fb" stroke="#8a5cc0"/>
<text x="386" y="308" fill="#8a5cc0" font-weight="700">⟳ = one bus transfer with retry policy</text>
<text x="386" y="328" fill="#2e2939" font-size="11">• rc == 0 → continue</text>
<text x="386" y="344" fill="#2e2939" font-size="11">• rc == -EIO (NACK) → retry, at most 3 more times</text>
<text x="386" y="360" fill="#2e2939" font-size="11">• still -EIO after 4 attempts → return -EIO</text>
<text x="386" y="376" fill="#2e2939" font-size="11">• rc == -ETIMEDOUT (bus stuck) → return at once</text>
</svg>
