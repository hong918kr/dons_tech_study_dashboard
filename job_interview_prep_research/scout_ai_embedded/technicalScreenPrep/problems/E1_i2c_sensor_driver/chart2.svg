<text x="180" y="308" text-anchor="middle" fill="#2e2939" font-weight="600">burst-read TEMP (2 bytes)</text>
<circle cx="300" cy="286" r="9" fill="#f0e7fb" stroke="#8a5cc0"/>
<text x="300" y="290" text-anchor="middle" fill="#8a5cc0" font-size="11" font-weight="700">⟳</text>
<rect x="60" y="346" width="240" height="40" rx="8" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="1.6"/>
<text x="180" y="364" text-anchor="middle" fill="#2e2939" font-weight="600">return 0</text>
<text x="180" y="379" text-anchor="middle" fill="#8a8297" font-size="11">*out = raw_to_c100(msb, lsb)</text>
