<text x="180" y="158" text-anchor="middle" fill="#2e2939" font-weight="600">read STATUS</text>
<circle cx="300" cy="136" r="9" fill="#f0e7fb" stroke="#8a5cc0"/>
<text x="300" y="140" text-anchor="middle" fill="#8a5cc0" font-size="11" font-weight="700">⟳</text>
<path d="M180,190 L260,222 L180,254 L100,222 Z" fill="#fcf0d6" stroke="#a9700f" stroke-width="1.6"/>
<text x="180" y="226" text-anchor="middle" fill="#2e2939" font-weight="600">DRDY set?</text>
