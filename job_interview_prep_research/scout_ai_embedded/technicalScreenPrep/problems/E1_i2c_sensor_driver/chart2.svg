<path d="M180,112 V134" fill="none" stroke="#6f6680" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M180,172 V188" fill="none" stroke="#6f6680" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M180,254 V284" fill="none" stroke="#6f6680" stroke-width="1.5" marker-end="url(#ar)"/>
