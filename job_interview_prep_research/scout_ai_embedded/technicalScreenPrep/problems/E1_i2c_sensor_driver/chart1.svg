<text x="207" y="80" text-anchor="middle" font-weight="700" fill="#2f8a5f" font-size="13">A</text>
<text x="207" y="96" text-anchor="middle" fill="#8a8297" font-size="11">0</text>
<rect x="224" y="60" width="90" height="44" fill="#f0e7fb" stroke="#8a5cc0" stroke-width="1.5"/>
<text x="269" y="80" text-anchor="middle" font-weight="700" fill="#8a5cc0" font-size="13">0x00</text>
<text x="269" y="96" text-anchor="middle" fill="#8a8297" font-size="11">reg = TEMP</text>
<rect x="314" y="60" width="34" height="44" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="1.5"/>
<text x="331" y="80" text-anchor="middle" font-weight="700" fill="#2f8a5f" font-size="13">A</text>
<text x="331" y="96" text-anchor="middle" fill="#8a8297" font-size="11">0</text>
<rect x="348" y="60" width="50" height="44" fill="#fcf0d6" stroke="#a9700f" stroke-width="1.5"/>
<text x="373" y="80" text-anchor="middle" font-weight="700" fill="#a9700f" font-size="13">Sr</text>
<text x="373" y="96" text-anchor="middle" fill="#8a8297" font-size="11">restart</text>
<rect x="398" y="60" width="110" height="44" fill="#f0e7fb" stroke="#8a5cc0" stroke-width="1.5"/>
<text x="453" y="80" text-anchor="middle" font-weight="700" fill="#8a5cc0" font-size="13">0x48 · R</text>
<text x="453" y="96" text-anchor="middle" fill="#8a8297" font-size="11">7b addr + 1</text>
<rect x="508" y="60" width="34" height="44" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="1.5"/>
<text x="525" y="80" text-anchor="middle" font-weight="700" fill="#2f8a5f" font-size="13">A</text>
<text x="525" y="96" text-anchor="middle" fill="#8a8297" font-size="11">0</text>
<rect x="542" y="60" width="90" height="44" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="1.5"/>
<text x="587" y="80" text-anchor="middle" font-weight="700" fill="#2f8a5f" font-size="13">0x19</text>
<text x="587" y="96" text-anchor="middle" fill="#8a8297" font-size="11">data MSB</text>
<rect x="632" y="60" width="34" height="44" fill="#f0e7fb" stroke="#8a5cc0" stroke-width="1.5"/>
<text x="649" y="80" text-anchor="middle" font-weight="700" fill="#8a5cc0" font-size="13">A</text>
<text x="649" y="96" text-anchor="middle" fill="#8a8297" font-size="11">0</text>
<rect x="666" y="60" width="90" height="44" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="1.5"/>
<text x="711" y="80" text-anchor="middle" font-weight="700" fill="#2f8a5f" font-size="13">0x00</text>
<text x="711" y="96" text-anchor="middle" fill="#8a8297" font-size="11">data LSB</text>
<rect x="756" y="60" width="34" height="44" fill="#fce5e2" stroke="#c4554e" stroke-width="1.5"/>
<text x="773" y="80" text-anchor="middle" font-weight="700" fill="#c4554e" font-size="13">N</text>
<text x="773" y="96" text-anchor="middle" fill="#8a8297" font-size="11">1</text>
<rect x="790" y="60" width="50" height="44" fill="#fcf0d6" stroke="#a9700f" stroke-width="1.5"/>
<text x="815" y="80" text-anchor="middle" font-weight="700" fill="#a9700f" font-size="13">P</text>
<text x="815" y="96" text-anchor="middle" fill="#8a8297" font-size="11">STOP</text>
<path d="M30,50 V44 H348 V50" fill="none" stroke="#b9b0c6" stroke-width="1.5"/>
<text x="189" y="36" text-anchor="middle" fill="#2e2939" font-weight="600">write phase: set register pointer</text>
<path d="M348,50 V44 H840 V50" fill="none" stroke="#b9b0c6" stroke-width="1.5"/>
<text x="594" y="36" text-anchor="middle" fill="#2e2939" font-weight="600">read phase: no STOP before Sr → bus is not released</text>
<text x="135" y="124" text-anchor="middle" fill="#8a5cc0">on wire 0x90</text>
<text x="453" y="124" text-anchor="middle" fill="#8a5cc0">on wire 0x91</text>
<text x="649" y="124" text-anchor="middle" fill="#2f8a5f">0x1900 → 25.00 °C</text>
<text x="207" y="142" text-anchor="middle" fill="#c4554e" font-size="11">no ACK → -EIO</text>
<text x="840" y="142" text-anchor="end" fill="#c4554e" font-size="11">master NACKs last byte</text>
<text x="30" y="176" fill="#2e2939" font-family="Menlo,monospace" font-size="12">i2c_write_read(0x48, {0x00}, 1, rbuf, 2)   → the whole frame above, one call</text>
<text x="30" y="198" fill="#2e2939" font-family="Menlo,monospace" font-size="12">i2c_write(0x48, {0x01, cfg|OS}, 2)         → S · 0x90 · A · 0x01 · A · cfg|OS · A · P</text>
<rect x="30" y="226" width="16" height="12" fill="#f0e7fb" stroke="#8a5cc0"/>
<text x="52" y="236" fill="#2e2939" font-size="11">master drives SDA</text>
<rect x="220" y="226" width="16" height="12" fill="#e2f4e9" stroke="#2f8a5f"/>
<text x="242" y="236" fill="#2e2939" font-size="11">slave drives SDA</text>
<rect x="410" y="226" width="16" height="12" fill="#fcf0d6" stroke="#a9700f"/>
<text x="432" y="236" fill="#2e2939" font-size="11">START / STOP condition</text>
<rect x="600" y="226" width="16" height="12" fill="#fce5e2" stroke="#c4554e"/>
<text x="622" y="236" fill="#2e2939" font-size="11">NACK (SDA high)</text>
</svg>
