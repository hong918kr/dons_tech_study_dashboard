<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
  <rect width="720" height="300" fill="#ffffff"/>
  <!-- LEFT: slew -->
  <text x="60" y="24" fill="#2e2939" font-weight="700" font-size="13">SLEW · |err| = 2000 ≤ 128000</text>
  <line x1="60" y1="210" x2="320" y2="210" stroke="#b9b0c6"/>
  <line x1="60" y1="50" x2="60" y2="210" stroke="#b9b0c6"/>
  <g fill="#8a8297" text-anchor="end" font-size="11">
    <text x="54" y="204">5000</text><text x="54" y="134">6000</text><text x="54" y="64">7000</text>
  </g>
  <g fill="#8a8297" text-anchor="middle" font-size="11">
    <text x="60" y="226">0</text><text x="110" y="226">1</text><text x="160" y="226">2</text>
    <text x="210" y="226">3</text><text x="260" y="226">4</text><text x="310" y="226">5</text>
    <text x="320" y="242" text-anchor="end">local time (s)</text>
  </g>
  <!-- measured -->
  <polyline fill="none" stroke="#c4554e" stroke-width="1.6" stroke-dasharray="6 4" points="60,200 110,200 110,60 320,60"/>
  <text x="116" y="52" fill="#c4554e" font-size="11">measured 7000</text>
  <!-- applied -->
  <polyline fill="none" stroke="#5677c9" stroke-width="2.5" points="60,200 110,165 160,130 210,95 260,60 310,60"/>
  <g stroke="#fff" stroke-width="1.5" fill="#5677c9">
    <circle cx="60" cy="200" r="5"/><circle cx="110" cy="165" r="5"/><circle cx="160" cy="130" r="5"/>
    <circle cx="210" cy="95" r="5"/><circle cx="260" cy="60" r="5"/><circle cx="310" cy="60" r="5"/>
  </g>
  <g fill="#5677c9" font-size="11">
    <text x="118" y="180">5500</text><text x="168" y="145">6000</text><text x="218" y="110">6500</text>
    <text x="260" y="48" text-anchor="middle">7000</text>
  </g>
  <rect x="60" y="256" width="260" height="34" rx="6" fill="#e2f4e9" stroke="#2f8a5f"/>
  <text x="190" y="270" text-anchor="middle" fill="#2f8a5f" font-size="11" font-weight="600">+500 µs per 1 s (500 ppm) · no overshoot</text>
  <text x="190" y="284" text-anchor="middle" fill="#2f8a5f" font-size="11">timestamps stay monotonic</text>
  <!-- RIGHT: step -->
  <text x="400" y="24" fill="#2e2939" font-weight="700" font-size="13">STEP · |err| = 293000 &gt; 128000</text>
  <line x1="400" y1="210" x2="680" y2="210" stroke="#b9b0c6"/>
  <line x1="400" y1="50" x2="400" y2="210" stroke="#b9b0c6"/>
  <g fill="#8a8297" text-anchor="end" font-size="11">
    <text x="394" y="204">7000</text><text x="394" y="64">300000</text>
  </g>
  <g fill="#8a8297" text-anchor="middle" font-size="11">
    <text x="400" y="226">0</text><text x="520" y="226">1</text><text x="640" y="226">2</text>
    <text x="680" y="242" text-anchor="end">local time (s)</text>
  </g>
  <polyline fill="none" stroke="#c4554e" stroke-width="1.6" stroke-dasharray="6 4" points="520,60 680,60"/>
  <text x="600" y="50" fill="#c4554e" font-size="11" text-anchor="middle">measured 300000</text>
  <polyline fill="none" stroke="#5677c9" stroke-width="2.5" points="400,200 520,200 520,60 660,60"/>
  <g stroke="#fff" stroke-width="1.5" fill="#5677c9">
    <circle cx="400" cy="200" r="5"/><circle cx="520" cy="60" r="5"/>
  </g>
  <text x="528" y="140" fill="#a9700f" font-size="11" font-weight="600">jump at once</text>
  <text x="528" y="155" fill="#a9700f" font-size="11">(slew would need 586 s)</text>
  <rect x="400" y="256" width="280" height="34" rx="6" fill="#fcf0d6" stroke="#a9700f"/>
  <text x="540" y="270" text-anchor="middle" fill="#a9700f" font-size="11" font-weight="600">host time jumps by 293 ms</text>
  <text x="540" y="284" text-anchor="middle" fill="#a9700f" font-size="11">log it · tell consumers (fusion buffers)</text>
</svg>
