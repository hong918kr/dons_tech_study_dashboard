<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5677c9"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#8a5cc0"/></marker>
  </defs>
  <rect width="720" height="340" fill="#ffffff"/>
  <!-- lanes -->
  <text x="20" y="104" fill="#2e2939" font-weight="700">host</text>
  <text x="20" y="120" fill="#8a8297" font-size="11">clock</text>
  <text x="20" y="234" fill="#2e2939" font-weight="700">MCU</text>
  <text x="20" y="250" fill="#8a8297" font-size="11">clock</text>
  <line x1="80" y1="110" x2="680" y2="110" stroke="#b9b0c6" stroke-width="2"/>
  <line x1="80" y1="240" x2="680" y2="240" stroke="#b9b0c6" stroke-width="2"/>
  <!-- host processing -->
  <rect x="320" y="100" width="100" height="20" fill="#fcf0d6" stroke="#a9700f"/>
  <text x="370" y="137" text-anchor="middle" fill="#a9700f" font-size="11">host holds 100</text>
  <!-- messages -->
  <line x1="120" y1="240" x2="318" y2="112" stroke="#5677c9" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="420" y1="110" x2="618" y2="238" stroke="#5677c9" stroke-width="2" marker-end="url(#ab)"/>
  <text x="196" y="166" fill="#5677c9" font-size="11" text-anchor="end">request · 200 µs</text>
  <text x="546" y="166" fill="#5677c9" font-size="11">reply · 200 µs</text>
  <!-- points + labels -->
  <g stroke="#fff" stroke-width="1.5">
    <circle cx="120" cy="240" r="5" fill="#5677c9"/><circle cx="320" cy="110" r="5" fill="#5677c9"/>
    <circle cx="420" cy="110" r="5" fill="#5677c9"/><circle cx="620" cy="240" r="5" fill="#5677c9"/>
  </g>
  <g fill="#2e2939" font-weight="700" text-anchor="middle">
    <text x="320" y="92">t2 = 15200</text><text x="420" y="92">t3 = 15300</text>
    <text x="120" y="262">t1 = 10000</text><text x="620" y="262">t4 = 10500</text>
  </g>
  <!-- RTT bracket -->
  <line x1="120" y1="280" x2="620" y2="280" stroke="#8a5cc0" stroke-width="1.5" marker-end="url(#av)"/>
  <line x1="120" y1="274" x2="120" y2="286" stroke="#8a5cc0" stroke-width="1.5"/>
  <text x="370" y="298" text-anchor="middle" fill="#8a5cc0">t4 − t1 = 500 (round trip, MCU clock)</text>
  <!-- result box -->
  <rect x="80" y="308" width="600" height="26" rx="6" fill="#e2f4e9" stroke="#2f8a5f"/>
  <text x="380" y="326" text-anchor="middle" fill="#2f8a5f" font-weight="600" font-size="11">delay = 500 − 100 = 400 · offset = ((15200−10000) + (15300−10500)) / 2 = (5200 + 4800) / 2 = 5000</text>
  <!-- legend / note -->
  <text x="80" y="22" fill="#2e2939" font-weight="700" font-size="13">x-axis = true time · same message, two clocks</text>
  <text x="80" y="40" fill="#8a8297" font-size="11">host = MCU + 5000 µs. t2 − t1 = offset + up-delay · t3 − t4 = offset − down-delay</text>
  <text x="80" y="56" fill="#8a8297" font-size="11">→ averaging cancels the delays only if up == down (else error = (up − down)/2 ≤ delay/2)</text>
</svg>
