<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
  <rect x="0" y="0" width="720" height="300" fill="#ffffff"/>
  <!-- axes -->
  <line x1="70" y1="260" x2="470" y2="260" stroke="#b9b0c6"/>
  <line x1="70" y1="40" x2="70" y2="260" stroke="#b9b0c6"/>
  <g fill="#8a8297" text-anchor="end">
    <text x="62" y="264">400</text><text x="62" y="232">500</text><text x="62" y="168">700</text>
    <text x="62" y="104">900</text><text x="62" y="72">1000</text>
  </g>
  <text x="14" y="30" fill="#8a8297">permille</text>
  <g fill="#8a8297" text-anchor="middle">
    <text x="70" y="278">0</text><text x="203.3" y="278">60</text><text x="336.7" y="278">120</text><text x="470" y="278">180</text>
  </g>
  <text x="470" y="294" fill="#8a8297" text-anchor="end">t (s) · 18000 steps of 10 ms</text>
  <!-- naive -->
  <line x1="70" y1="68" x2="470" y2="68" stroke="#c4554e" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="270" y="58" fill="#c4554e" text-anchor="middle" font-weight="700">naive: stays at 1000 (every step rounds to 0)</text>
  <!-- correct -->
  <line x1="70" y1="68" x2="470" y2="228" stroke="#5677c9" stroke-width="2.5"/>
  <circle cx="470" cy="228" r="5" fill="#5677c9" stroke="#fff" stroke-width="1.5"/>
  <text x="462" y="216" fill="#5677c9" text-anchor="end" font-weight="700">mA·ms accumulator: 500</text>
  <!-- right panel -->
  <rect x="490" y="44" width="216" height="200" rx="8" fill="#f0e7fb" stroke="#8a5cc0"/>
  <text x="598" y="66" fill="#8a5cc0" text-anchor="middle" font-weight="700">one step (1 mAh pack)</text>
  <text x="502" y="90" fill="#2e2939">I·dt = 10 mA × 10 ms</text>
  <text x="502" y="108" fill="#2e2939">     = 100 mA·ms</text>
  <text x="502" y="134" fill="#c4554e" font-weight="600">naive:  100 / 3 600 000</text>
  <text x="502" y="152" fill="#c4554e">  = 0 mAh  → lost forever</text>
  <text x="502" y="178" fill="#2f8a5f" font-weight="600">accumulator:  rem −= 100</text>
  <text x="502" y="196" fill="#2f8a5f">  exact, divide only on read</text>
  <text x="502" y="226" fill="#8a8297" font-size="11">18000 × 100 = 1 800 000 = 0.5 mAh</text>
</svg>
