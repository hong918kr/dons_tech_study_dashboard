<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" width="720" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
  <rect x="0" y="0" width="720" height="310" fill="#ffffff"/>
  <!-- clamp zones -->
  <rect x="70" y="40" width="52.7" height="220" fill="#fce5e2" opacity=".7"/>
  <rect x="597.3" y="40" width="52.7" height="220" fill="#e2f4e9" opacity=".7"/>
  <text x="96.4" y="56" fill="#c4554e" text-anchor="middle" font-size="11">clamp 0</text>
  <text x="623.6" y="232" fill="#2f8a5f" text-anchor="middle" font-size="11">clamp</text>
  <text x="623.6" y="246" fill="#2f8a5f" text-anchor="middle" font-size="11">1000</text>
  <!-- axes -->
  <line x1="70" y1="260" x2="650" y2="260" stroke="#b9b0c6"/>
  <line x1="70" y1="40" x2="70" y2="260" stroke="#b9b0c6"/>
  <g fill="#8a8297" text-anchor="end">
    <text x="62" y="264">0</text><text x="62" y="209">250</text><text x="62" y="154">500</text>
    <text x="62" y="99">750</text><text x="62" y="44">1000</text>
  </g>
  <text x="14" y="26" fill="#8a8297">permille</text>
  <g fill="#8a8297" text-anchor="middle">
    <text x="122.7" y="278">3300</text><text x="228.2" y="278">3500</text><text x="333.6" y="278">3700</text>
    <text x="439.1" y="278">3900</text><text x="544.5" y="278">4100</text><text x="650" y="278">4300</text>
  </g>
  <text x="650" y="296" fill="#8a8297" text-anchor="end">cell mV (at rest)</text>
  <!-- clamped ends -->
  <line x1="70" y1="260" x2="122.7" y2="260" stroke="#c4554e" stroke-width="2.5" stroke-dasharray="5 4"/>
  <line x1="597.3" y1="40" x2="650" y2="40" stroke="#2f8a5f" stroke-width="2.5" stroke-dasharray="5 4"/>
  <!-- table curve -->
  <polyline fill="none" stroke="#5677c9" stroke-width="2.5" points="122.7,260 228.2,249 280.9,227 333.6,172 386.4,128 491.8,73 597.3,40"/>
  <g fill="#5677c9" stroke="#fff" stroke-width="1.5">
    <circle cx="122.7" cy="260" r="4.5"/><circle cx="228.2" cy="249" r="4.5"/><circle cx="280.9" cy="227" r="4.5"/>
    <circle cx="333.6" cy="172" r="4.5"/><circle cx="386.4" cy="128" r="4.5"/><circle cx="491.8" cy="73" r="4.5"/>
    <circle cx="597.3" cy="40" r="4.5"/>
  </g>
  <g font-size="11" fill="#4b4459">
    <text x="232" y="242">50</text><text x="286" y="234">150</text><text x="342" y="176">400</text>
    <text x="392" y="132">600</text><text x="476" y="66">850</text>
  </g>
  <!-- interpolated point 3650 -->
  <line x1="307.3" y1="199.5" x2="307.3" y2="260" stroke="#8a5cc0" stroke-dasharray="3 3"/>
  <line x1="70" y1="199.5" x2="307.3" y2="199.5" stroke="#8a5cc0" stroke-dasharray="3 3"/>
  <circle cx="307.3" cy="199.5" r="6" fill="#8a5cc0" stroke="#fff" stroke-width="1.5"/>
  <rect x="120" y="140" width="174" height="44" rx="6" fill="#f0e7fb" stroke="#8a5cc0"/>
  <text x="207" y="158" fill="#8a5cc0" text-anchor="middle" font-weight="700">3650 mV → 275 ‰</text>
  <text x="207" y="175" fill="#8a5cc0" text-anchor="middle" font-size="11">150 + 50·250/100</text>
  <!-- interpolated point 3900 -->
  <circle cx="439.1" cy="100.5" r="6" fill="#8a5cc0" stroke="#fff" stroke-width="1.5"/>
  <text x="452" y="108" fill="#8a5cc0" font-weight="700">3900 mV → 725 ‰</text>
  <text x="452" y="124" fill="#8a5cc0" font-size="11">600 + 100·250/200</text>
  <text x="300" y="30" fill="#2e2939" text-anchor="middle" font-weight="600">flat at both ends, steep in the middle (3600–3800 mV)</text>
</svg>
