<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
  <rect x="0" y="0" width="720" height="340" fill="#ffffff"/>
  <!-- hysteresis band 150..200 -->
  <rect x="70" y="150" width="580" height="50" fill="#fcf0d6" opacity=".9"/>
  <text x="80" y="180" fill="#a9700f" font-weight="600">hysteresis band (state holds)</text>
  <line x1="70" y1="200" x2="650" y2="200" stroke="#c4554e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="70" y1="150" x2="650" y2="150" stroke="#2f8a5f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="656" y="196" fill="#c4554e" font-weight="700">ON</text><text x="656" y="210" fill="#c4554e">≤ 150</text>
  <text x="656" y="146" fill="#2f8a5f" font-weight="700">OFF</text><text x="656" y="160" fill="#2f8a5f">≥ 200</text>
  <!-- axes -->
  <line x1="70" y1="250" x2="650" y2="250" stroke="#b9b0c6"/>
  <line x1="70" y1="40" x2="70" y2="250" stroke="#b9b0c6"/>
  <g fill="#8a8297" text-anchor="end">
    <text x="62" y="254">100</text><text x="62" y="204">150</text><text x="62" y="154">200</text>
    <text x="62" y="104">250</text><text x="62" y="54">300</text>
  </g>
  <text x="18" y="30" fill="#8a8297">permille</text>
  <g fill="#8a8297" text-anchor="middle">
    <text x="70" y="268">0</text><text x="186" y="268">5</text><text x="302" y="268">10</text>
    <text x="418" y="268">15</text><text x="534" y="268">20</text><text x="650" y="268">25</text>
  </g>
  <text x="650" y="284" fill="#8a8297" text-anchor="end">t (s)</text>
  <!-- phases -->
  <text x="230" y="80" fill="#5677c9" font-weight="600">discharge +360 mA → −10 ‰/s</text>
  <text x="470" y="236" fill="#2f8a5f" font-weight="600">charge −360 mA</text>
  <!-- SoC line -->
  <polyline fill="none" stroke="#5677c9" stroke-width="2.5" points="70,50 441.2,210 580.4,150 650,180"/>
  <!-- markers -->
  <circle cx="418" cy="200" r="6" fill="#c4554e" stroke="#fff" stroke-width="1.5"/>
  <text x="410" y="226" fill="#c4554e" font-weight="700" text-anchor="end">t=15 s: 150 → ON</text>
  <circle cx="441.2" cy="210" r="4" fill="#5677c9"/>
  <text x="446" y="222" fill="#4b4459" font-size="11">140</text>
  <circle cx="580.4" cy="150" r="6" fill="#2f8a5f" stroke="#fff" stroke-width="1.5"/>
  <text x="580.4" y="132" fill="#2f8a5f" font-weight="700" text-anchor="middle">t=22 s: 200 → OFF</text>
  <circle cx="650" cy="180" r="4" fill="#5677c9"/>
  <text x="520" y="100" fill="#8a5cc0" font-size="11">170: in band, no re-trigger</text>
  <line x1="640" y1="104" x2="648" y2="172" stroke="#8a5cc0" stroke-width="1"/>
  <!-- alert strip -->
  <text x="62" y="311" fill="#8a8297" text-anchor="end">alert</text>
  <rect x="70" y="298" width="348" height="18" fill="#e2f4e9"/>
  <rect x="418" y="298" width="162.4" height="18" fill="#fce5e2" stroke="#c4554e"/>
  <rect x="580.4" y="298" width="69.6" height="18" fill="#e2f4e9"/>
  <text x="244" y="311" fill="#2f8a5f" text-anchor="middle">off</text>
  <text x="499.2" y="311" fill="#c4554e" text-anchor="middle" font-weight="700">ON (holds in band)</text>
  <text x="615" y="311" fill="#2f8a5f" text-anchor="middle">off</text>
</svg>
