<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6f6680"/></marker>
  <marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#8a5cc0"/></marker>
  <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5677c9"/></marker></defs>
  <rect width="720" height="240" fill="#fff"/>
  <!-- timer -->
  <rect x="12" y="12" width="168" height="26" rx="8" fill="#fcf0d6" stroke="#a9700f"/>
  <text x="96" y="30" text-anchor="middle" fill="#a9700f" font-weight="600">timer tick every 10 ms</text>
  <!-- setpoint in -->
  <text x="14" y="104" fill="#2e2939" font-weight="700">r[k]</text>
  <line x1="44" y1="100" x2="82" y2="100" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
  <circle cx="100" cy="100" r="16" fill="#fff" stroke="#6f6680" stroke-width="1.6"/>
  <text x="100" y="105" text-anchor="middle" fill="#2e2939" font-size="14">Σ</text>
  <text x="74" y="92" fill="#2e2939" font-size="13">+</text>
  <text x="108" y="134" fill="#2e2939" font-size="14">−</text>
  <!-- error -->
  <line x1="116" y1="100" x2="168" y2="100" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="140" y="92" text-anchor="middle" fill="#2e2939">e</text>
  <!-- PID -->
  <rect x="170" y="70" width="160" height="60" rx="8" fill="#fff" stroke="#5677c9" stroke-width="2"/>
  <text x="250" y="92" text-anchor="middle" fill="#5677c9" font-weight="700" font-size="14">pid_step()</text>
  <text x="250" y="109" text-anchor="middle" fill="#2e2939">kp·e + integ − kd·dω/dt</text>
  <text x="250" y="124" text-anchor="middle" fill="#8a8297" font-size="11">integ += ki·e·dt</text>
  <!-- u_raw -->
  <line x1="330" y1="100" x2="388" y2="100" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="359" y="92" text-anchor="middle" fill="#2e2939">u_raw</text>
  <!-- saturation -->
  <rect x="390" y="70" width="100" height="60" rx="8" fill="#fcf0d6" stroke="#a9700f" stroke-width="2"/>
  <line x1="402" y1="118" x2="478" y2="118" stroke="#b9b0c6"/>
  <polyline fill="none" stroke="#a9700f" stroke-width="2" points="404,116 422,116 458,84 476,84"/>
  <text x="440" y="146" text-anchor="middle" fill="#a9700f" font-weight="600">clamp 0 … 12 V</text>
  <!-- u -->
  <line x1="490" y1="100" x2="548" y2="100" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="519" y="92" text-anchor="middle" fill="#2e2939">u [V]</text>
  <!-- motor -->
  <rect x="550" y="70" width="120" height="60" rx="8" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="2"/>
  <text x="610" y="92" text-anchor="middle" fill="#2f8a5f" font-weight="700" font-size="14">motor_step()</text>
  <text x="610" y="109" text-anchor="middle" fill="#2e2939">K / (τs + 1)</text>
  <text x="610" y="124" text-anchor="middle" fill="#8a8297" font-size="11">K = 10, τ = 0.5 s</text>
  <!-- output -->
  <line x1="670" y1="100" x2="708" y2="100" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="690" y="92" text-anchor="middle" fill="#2e2939" font-weight="700">ω</text>
  <!-- feedback -->
  <polyline fill="none" stroke="#6f6680" stroke-width="1.6" points="690,100 690,190 100,190 100,118" marker-end="url(#ar)"/>
  <text x="470" y="206" text-anchor="middle" fill="#2e2939">measured ω (encoder) → log[k]</text>
  <!-- D on measurement -->
  <line x1="250" y1="190" x2="250" y2="132" stroke="#5677c9" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arb)"/>
  <text x="258" y="168" fill="#5677c9">D uses ω, not e</text>
  <!-- anti-windup -->
  <path d="M440,70 C430,36 270,36 262,68" fill="none" stroke="#8a5cc0" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arv)"/>
  <text x="352" y="34" text-anchor="middle" fill="#8a5cc0" font-weight="600">saturated &amp; e pushes further → freeze integ</text>
</svg>
