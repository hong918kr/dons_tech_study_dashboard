<text x="340" y="156" fill="#8a8297">step lands off the circle and the error</text>
<text x="340" y="174" fill="#8a8297">shifts the collision time.</text>
<text x="340" y="204" fill="#8a8297">Exact: x += (v/ω)(sin θ1 − sin θ0)</text>
<text x="340" y="222" fill="#8a8297">       y += (v/ω)(cos θ0 − cos θ1)</text>
