<text x="296" y="172" fill="#8a8297" font-size="10">start (4,0)</text>
<text x="340" y="60" fill="#2f8a5f" font-weight="700">— exact arc update (on the circle)</text>
<text x="340" y="84" fill="#a9700f" font-weight="700">— Euler, dt = 0.5 s (x += v·cosθ·dt)</text>
<text x="340" y="114" fill="#c4554e">red: worst error 1.00 m (step 13)</text>
