<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
<rect width="700" height="320" fill="#ffffff"/>
<line x1="30.0" y1="280.0" x2="400.0" y2="280.0" stroke="#b9b0c6" stroke-width="1.2"/>
<polygon points="400.0,280.0 391.7,276.5 391.7,283.5" fill="#b9b0c6"/>
<line x1="30.0" y1="280.0" x2="30.0" y2="30.0" stroke="#b9b0c6" stroke-width="1.2"/>
<polygon points="30.0,30.0 26.5,38.3 33.5,38.3" fill="#b9b0c6"/>
<text x="392" y="298" fill="#8a8297">+x</text><text x="38" y="38" fill="#8a8297">+y</text>
<line x1="120" y1="230" x2="320" y2="230" stroke="#b9b0c6" stroke-dasharray="4 4"/>
<line x1="120" y1="230.5" x2="234.9" y2="230.5" stroke="#2f8a5f" stroke-width="2.5"/>
<line x1="234.9" y1="230" x2="234.9" y2="133.6" stroke="#2f8a5f" stroke-width="2.5" stroke-dasharray="6 3"/>
<text x="177.5" y="250" text-anchor="middle" fill="#2f8a5f">dx = speed·dt·cos(heading)</text>
<text x="242.9" y="185.8" fill="#2f8a5f">dy = speed·dt·sin(heading)</text>
<line x1="120.0" y1="230.0" x2="234.9" y2="133.6" stroke="#5677c9" stroke-width="3"/>
<polygon points="234.9,133.6 226.3,136.2 230.8,141.6" fill="#5677c9"/>
<text x="115.5" y="171.8" fill="#5677c9" font-weight="700">speed·dt</text>
<path d="M 160 230 A 40 40 0 0 0 150.6 204.3" fill="none" stroke="#a9700f" stroke-width="2"/>
<text x="166" y="222" fill="#a9700f" font-weight="700">heading θ</text>
<circle cx="120" cy="230" r="6" fill="#5677c9"/><text x="108" y="222" fill="#5677c9" text-anchor="end">(x, y) at t</text>
<circle cx="234.9" cy="133.6" r="6" fill="#c4554e"/>
<text x="224.9" y="119.6" fill="#c4554e" font-weight="700" text-anchor="end">next point at t + dt</text>
<line x1="234.9" y1="133.6" x2="288.5" y2="88.6" stroke="#b9b0c6" stroke-dasharray="4 3"/>
<line x1="234.9" y1="133.6" x2="264.5" y2="70.1" stroke="#8a5cc0" stroke-width="2.5"/>
<polygon points="264.5,70.1 257.8,76.2 264.2,79.1" fill="#8a5cc0"/>
<path d="M 269.4 104.7 A 45 45 0 0 0 253.9 92.8" fill="none" stroke="#8a5cc0" stroke-width="2"/>
<text x="284.5" y="88.1" fill="#8a5cc0" font-weight="700">turn by ω·dt</text>
<text x="284.5" y="104.1" fill="#8a5cc0">new heading</text>
<rect x="452" y="30" width="236" height="200" rx="8" fill="#f6f2fa" stroke="#e6e1ec"/>
<text x="466" y="58" fill="#2e2939" font-weight="700">t</text><text x="530" y="58" fill="#2e2939">time now (s), t = k·dt</text>
<text x="466" y="84" fill="#2e2939" font-weight="700">dt</text><text x="530" y="84" fill="#2e2939">one step, e.g. 0.01 s</text>
<text x="466" y="110" fill="#5677c9" font-weight="700">speed</text><text x="530" y="110" fill="#2e2939">m/s along heading</text>
<text x="466" y="136" fill="#a9700f" font-weight="700">heading</text><text x="530" y="136" fill="#2e2939">rad, 0 = +x, CCW +</text>
<text x="466" y="162" fill="#8a5cc0" font-weight="700">omega</text><text x="530" y="162" fill="#2e2939">rad/s heading turns</text>
<text x="466" y="188" fill="#8a8297" font-weight="700"></text><text x="530" y="188" fill="#2e2939">+ left (CCW), − right (CW)</text>
<text x="466" y="214" fill="#2e2939" font-weight="700">radius</text><text x="530" y="214" fill="#2e2939">not stored: speed/omega</text>
<line x1="452" y1="270" x2="688" y2="270" stroke="#b9b0c6"/>
<line x1="462" y1="264" x2="462" y2="276" stroke="#5677c9"/><text x="462" y="292" text-anchor="middle" fill="#8a8297" font-size="10.5">0</text>
<line x1="514" y1="264" x2="514" y2="276" stroke="#5677c9"/><text x="514" y="292" text-anchor="middle" fill="#8a8297" font-size="10.5">dt</text>
<line x1="566" y1="264" x2="566" y2="276" stroke="#5677c9"/><text x="566" y="292" text-anchor="middle" fill="#8a8297" font-size="10.5">2dt</text>
<line x1="618" y1="264" x2="618" y2="276" stroke="#5677c9"/><text x="618" y="292" text-anchor="middle" fill="#8a8297" font-size="10.5">3dt</text>
<line x1="670" y1="264" x2="670" y2="276" stroke="#5677c9"/><text x="670" y="292" text-anchor="middle" fill="#8a8297" font-size="10.5">k·dt</text>
<text x="452" y="256" fill="#8a8297" font-size="10.5">time steps (step number k)</text>
</svg>