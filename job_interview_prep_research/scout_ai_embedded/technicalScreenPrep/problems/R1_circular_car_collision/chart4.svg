<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
<rect width="700" height="300" fill="#ffffff"/>
<rect x="10" y="10" width="330" height="280" rx="10" fill="#e2f4e9" fill-opacity=".45" stroke="#2f8a5f"/>
<text x="24" y="34" fill="#2f8a5f" font-weight="700" font-size="13">Solution 1 · interviewer: state → next point</text>
<path d="M 55 225 Q 90 160 160 105" fill="none" stroke="#b9b0c6" stroke-dasharray="4 4"/>
<line x1="88.6" y1="174.6" x2="122" y2="133" stroke="#5677c9" stroke-width="2.5"/>
<polygon points="122,133 112.9,137.2 119.6,142.6" fill="#5677c9"/>
<circle cx="88.6" cy="174.6" r="5" fill="#5677c9"/>
<circle cx="127.2" cy="133.1" r="5" fill="#c4554e"/>
<text x="40" y="196" fill="#5677c9">(x, y) now</text>
<text x="128" y="160" fill="#5677c9">heading, speed</text>
<text x="138" y="128" fill="#c4554e" font-weight="700">next point</text>
<text x="150" y="98" fill="#8a5cc0">ω turns the heading</text>
<text x="190" y="205" fill="#2e2939" font-size="11.5">x += v·cos(heading)·dt</text>
<text x="190" y="223" fill="#2e2939" font-size="11.5">y += v·sin(heading)·dt</text>
<text x="190" y="241" fill="#2e2939" font-size="11.5">heading += ω·dt</text>
<text x="190" y="259" fill="#2e2939" font-size="11.5">→ loop: t += dt until collide</text>
<rect x="360" y="10" width="330" height="280" rx="10" fill="#f0e7fb" fill-opacity=".45" stroke="#8a5cc0"/>
<text x="374" y="34" fill="#8a5cc0" font-weight="700" font-size="13">Solution 2 · Don: circle (center, radius)</text>
<circle cx="525" cy="125" r="62" fill="none" stroke="#8a5cc0" stroke-width="2"/>
<circle cx="525" cy="125" r="3" fill="#8a5cc0"/><text x="497" y="143" fill="#8a5cc0">(cx, cy)</text>
<line x1="525" y1="125" x2="576.2" y2="90.0" stroke="#8a5cc0" stroke-dasharray="4 3"/>
<text x="542.6" y="101.5" fill="#8a5cc0">r</text>
<circle cx="576.2" cy="90.0" r="5" fill="#c4554e"/>
<text x="584.2" y="86.0" fill="#c4554e" font-weight="700">pos(t)</text>
<path d="M 545 125 A 20 20 0 0 0 541.5 113.7" fill="none" stroke="#a9700f"/>
<text x="549" y="129" fill="#a9700f" font-size="10.5">φ0 + ω·t</text>
<text x="525" y="215" fill="#2e2939" font-size="11.5" text-anchor="middle">r = |v/ω|, center from (x, y, heading)</text>
<text x="525" y="233" fill="#2e2939" font-size="11.5" text-anchor="middle">x(t) = cx + r·cos(φ0 + ω·t)</text>
<text x="525" y="251" fill="#2e2939" font-size="11.5" text-anchor="middle">y(t) = cy + r·sin(φ0 + ω·t)</text>
<text x="525" y="269" fill="#2e2939" font-size="11.5" text-anchor="middle">→ any t directly, no stepping</text>
</svg>