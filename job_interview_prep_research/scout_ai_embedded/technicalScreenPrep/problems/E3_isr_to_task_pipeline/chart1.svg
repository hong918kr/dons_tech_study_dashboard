<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6f6680"/></marker></defs>
<rect width="760" height="300" fill="#fff"/>
<rect x="10" y="10" width="292" height="200" rx="12" fill="#f0e7fb"/>
<text x="22" y="30" fill="#8a5cc0" font-weight="700">ISR context — µs, never blocks</text>
<rect x="470" y="10" width="280" height="200" rx="12" fill="#e2f4e9"/>
<text x="482" y="30" fill="#2f8a5f" font-weight="700">task context — ms, may be late</text>
<rect x="22" y="60" width="92" height="80" rx="8" fill="#fff" stroke="#5677c9" stroke-width="1.6"/>
<text x="68.0" y="80" text-anchor="middle" font-weight="700" fill="#5677c9">ADC</text>
<text x="68.0" y="98" text-anchor="middle" fill="#2e2939" font-size="11">DRDY every</text>
<text x="68.0" y="113" text-anchor="middle" fill="#2e2939" font-size="11">10 ms</text>
<text x="68.0" y="128" text-anchor="middle" fill="#2e2939" font-size="11">ADC_DATA reg</text>
<rect x="140" y="60" width="150" height="80" rx="8" fill="#fff" stroke="#8a5cc0" stroke-width="1.6"/>
<text x="215.0" y="80" text-anchor="middle" font-weight="700" fill="#8a5cc0">TEMP_DRDY_IRQ</text>
<text x="215.0" y="98" text-anchor="middle" fill="#2e2939" font-size="11">s = {millis(), ADC_DATA}</text>
<text x="215.0" y="113" text-anchor="middle" fill="#2e2939" font-size="11">ring_push(s)</text>
<text x="215.0" y="128" text-anchor="middle" fill="#2e2939" font-size="11">full → overrun++</text>
<rect x="318" y="60" width="132" height="80" rx="8" fill="#fff" stroke="#5677c9" stroke-width="1.6"/>
<text x="384" y="80" text-anchor="middle" font-weight="700" fill="#5677c9">SPSC ring (8)</text>
<rect x="326" y="90" width="13" height="18" fill="#dfe6f7" stroke="#5677c9" stroke-width="1"/>
<rect x="341" y="90" width="13" height="18" fill="#dfe6f7" stroke="#5677c9" stroke-width="1"/>
<rect x="356" y="90" width="13" height="18" fill="#dfe6f7" stroke="#5677c9" stroke-width="1"/>
<rect x="371" y="90" width="13" height="18" fill="#dfe6f7" stroke="#5677c9" stroke-width="1"/>
<rect x="386" y="90" width="13" height="18" fill="#dfe6f7" stroke="#5677c9" stroke-width="1"/>
<rect x="401" y="90" width="13" height="18" fill="#fff" stroke="#5677c9" stroke-width="1"/>
<rect x="416" y="90" width="13" height="18" fill="#fff" stroke="#5677c9" stroke-width="1"/>
<rect x="431" y="90" width="13" height="18" fill="#fff" stroke="#5677c9" stroke-width="1"/>
<text x="384" y="126" text-anchor="middle" fill="#2e2939" font-size="11">head: ISR · tail: task</text>
<rect x="482" y="60" width="150" height="80" rx="8" fill="#fff" stroke="#2f8a5f" stroke-width="1.6"/>
<text x="557.0" y="80" text-anchor="middle" font-weight="700" fill="#2f8a5f">temp_task_poll</text>
<text x="557.0" y="98" text-anchor="middle" fill="#2e2939" font-size="11">adc_to_c10 · stale check</text>
<text x="557.0" y="113" text-anchor="middle" fill="#2e2939" font-size="11">det_update (hyst ×3)</text>
<text x="557.0" y="128" text-anchor="middle" fill="#2e2939" font-size="11">log {t, c10, ev}</text>
<rect x="656" y="60" width="84" height="80" rx="8" fill="#fce5e2" stroke="#c4554e" stroke-width="1.6"/>
<text x="698.0" y="80" text-anchor="middle" font-weight="700" fill="#c4554e">fan_set</text>
<text x="698.0" y="98" text-anchor="middle" fill="#2e2939" font-size="11">on / off</text>
<text x="698.0" y="113" text-anchor="middle" fill="#2e2939" font-size="11">(GPIO)</text>
<line x1="114" y1="100" x2="138" y2="100" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="290" y1="100" x2="316" y2="100" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="450" y1="100" x2="480" y2="100" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="632" y1="100" x2="654" y2="100" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="127" y="94" text-anchor="middle" fill="#8a8297" font-size="11">IRQ</text>
<rect x="250" y="160" width="250" height="40" rx="8" fill="#fcf0d6" stroke="#a9700f" stroke-width="1.6"/>
<text x="375" y="178" text-anchor="middle" font-weight="700" fill="#a9700f">volatile g_overrun_count</text>
<text x="375" y="193" text-anchor="middle" fill="#a9700f" font-size="11">ISR: ++ · task: read-and-clear (IRQ masked)</text>
<path d="M215,140 L215,180 L248,180" fill="none" stroke="#a9700f" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M502,180 L557,180 L557,142" fill="none" stroke="#a9700f" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ar)"/>
<text x="563" y="170" fill="#a9700f" font-size="11">overruns_total += n</text>
<text x="22" y="240" fill="#8a5cc0" font-size="12">ISR: 캡처 + push + 카운트만 (변환·판정·로그 금지)</text>
<text x="22" y="260" fill="#2f8a5f" font-size="12">task: 변환, 히스테리시스, 팬 제어, 로그 — 시간이 걸려도 되는 일</text>
<text x="22" y="280" fill="#8a8297" font-size="12">timestamp는 ISR에서 찍음 → task가 늦게 돌아도 이벤트 시각은 캡처 시각</text>
</svg>
