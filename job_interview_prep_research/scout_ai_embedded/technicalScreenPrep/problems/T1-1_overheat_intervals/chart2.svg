<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 232" width="720" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6f6680"/></marker></defs>
  <rect width="720" height="232" fill="#fff"/>
  <rect x="70" y="80" width="150" height="66" rx="33" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="2"/>
  <text x="145" y="110" text-anchor="middle" font-weight="700" fill="#2f8a5f" font-size="14">COOL</text>
  <text x="145" y="128" text-anchor="middle" fill="#2f8a5f">in_hot = false</text>
  <rect x="440" y="80" width="170" height="66" rx="33" fill="#fce5e2" stroke="#c4554e" stroke-width="2"/>
  <text x="525" y="110" text-anchor="middle" font-weight="700" fill="#c4554e" font-size="14">HOT</text>
  <text x="525" y="128" text-anchor="middle" fill="#c4554e">in_hot = true</text>
  <path d="M220,96 C300,60 360,60 440,96" fill="none" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="330" y="52" text-anchor="middle" fill="#2e2939" font-weight="600">hot sample → OPEN</text>
  <text x="330" y="68" text-anchor="middle" fill="#8a8297">start = last_hot = t</text>
  <path d="M440,132 C360,170 300,170 220,132" fill="none" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="330" y="184" text-anchor="middle" fill="#2e2939" font-weight="600">cool sample → CLOSE</text>
  <text x="330" y="200" text-anchor="middle" fill="#8a8297">emit if last_hot − start ≥ min_ms</text>
  <path d="M600,90 C660,50 660,170 600,136" fill="none" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="650" y="64" text-anchor="middle" fill="#2e2939" font-weight="600">hot → EXTEND</text>
  <text x="650" y="80" text-anchor="middle" fill="#8a8297">last_hot = t</text>
  <path d="M80,92 C20,50 20,170 80,134" fill="none" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="40" y="64" text-anchor="middle" fill="#2e2939" font-weight="600">cool → stay</text>
  <rect x="440" y="196" width="230" height="28" rx="8" fill="#fcf0d6" stroke="#a9700f"/>
  <text x="555" y="215" text-anchor="middle" fill="#a9700f" font-weight="600">end of array while HOT → CLOSE too!</text>
</svg>
