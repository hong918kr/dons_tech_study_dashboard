<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
  <rect x="0" y="0" width="680" height="300" fill="#ffffff"/>
  <!-- kept interval -->
  <rect x="153.3" y="30" width="186.7" height="200" fill="#fce5e2" opacity=".85"/>
  <text x="246.7" y="46" text-anchor="middle" fill="#c4554e" font-weight="700">KEPT [500, 1500]</text>
  <text x="246.7" y="62" text-anchor="middle" fill="#c4554e">1000 ms ≥ min_ms ✓</text>
  <!-- dropped interval -->
  <line x1="526.7" y1="30" x2="526.7" y2="230" stroke="#a9700f" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="534" y="46" fill="#a9700f" font-weight="700">DROPPED [2500, 2500]</text>
  <text x="534" y="62" fill="#a9700f">0 ms &lt; 1000</text>
  <!-- alt definition -->
  <line x1="153.3" y1="250" x2="433.3" y2="250" stroke="#8a5cc0" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="153.3" cy="250" r="3" fill="#8a5cc0"/><circle cx="433.3" cy="250" r="3" fill="#8a5cc0"/>
  <text x="440" y="254" fill="#8a5cc0">if end = first cool sample → [500, 2000]</text>
  <!-- axes -->
  <line x1="60" y1="230" x2="630" y2="230" stroke="#b9b0c6"/>
  <line x1="60" y1="30" x2="60" y2="230" stroke="#b9b0c6"/>
  <g fill="#8a8297" text-anchor="middle">
    <text x="60" y="280">0</text><text x="153.3" y="280">500</text><text x="246.7" y="280">1000</text>
    <text x="340" y="280">1500</text><text x="433.3" y="280">2000</text><text x="526.7" y="280">2500</text>
    <text x="620" y="280">3000</text><text x="650" y="296" text-anchor="end">t_ms</text>
  </g>
  <g fill="#8a8297" text-anchor="end">
    <text x="54" y="74">850</text><text x="54" y="114">800</text><text x="54" y="154">750</text><text x="54" y="194">700</text>
  </g>
  <!-- threshold -->
  <line x1="60" y1="110" x2="630" y2="110" stroke="#c4554e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="634" y="106" fill="#c4554e" font-weight="700">thresh</text><text x="634" y="120" fill="#c4554e">800</text>
  <!-- data -->
  <polyline fill="none" stroke="#5677c9" stroke-width="2.5" points="60,150 153.3,102 246.7,94 340,86 433.3,118 526.7,70 620,190"/>
  <g stroke="#fff" stroke-width="1.5">
    <circle cx="60" cy="150" r="5" fill="#2f8a5f"/><circle cx="153.3" cy="102" r="5" fill="#c4554e"/>
    <circle cx="246.7" cy="94" r="5" fill="#c4554e"/><circle cx="340" cy="86" r="5" fill="#c4554e"/>
    <circle cx="433.3" cy="118" r="5" fill="#2f8a5f"/><circle cx="526.7" cy="70" r="5" fill="#c4554e"/>
    <circle cx="620" cy="190" r="5" fill="#2f8a5f"/>
  </g>
  <g font-size="11" fill="#4b4459" text-anchor="middle">
    <text x="60" y="168">750</text><text x="153.3" y="122">810</text><text x="246.7" y="84">820</text>
    <text x="340" y="106">830</text><text x="433.3" y="138">790</text><text x="526.7" y="90">850</text><text x="620" y="208">700</text>
  </g>
  <g font-size="11"><circle cx="72" cy="16" r="5" fill="#c4554e"/><text x="82" y="20" fill="#4b4459">HOT (≥ thresh)</text>
  <circle cx="182" cy="16" r="5" fill="#2f8a5f"/><text x="192" y="20" fill="#4b4459">cool</text></g>
</svg>
