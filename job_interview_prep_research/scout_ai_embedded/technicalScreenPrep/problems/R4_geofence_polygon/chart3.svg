<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 310" width="780" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
  <defs><marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2e2939"/></marker></defs>
  <rect width="780" height="310" fill="#ffffff"/>
  <!-- zoom: X = 80 + 18(x - 56), Y = 260 - 18(y - 28) -->
  <rect x="62" y="30" width="90" height="260" fill="#e2f4e9"/>
  <rect x="152" y="30" width="108" height="260" fill="#fce5e2"/>
  <text x="107" y="48" text-anchor="middle" fill="#2f8a5f" font-weight="700">left: cross &gt; 0</text>
  <text x="206" y="48" text-anchor="middle" fill="#c4554e" font-weight="700">right: cross &lt; 0</text>
  <!-- fence edge q1 -> q2 (x = 60, going north) -->
  <line x1="152" y1="290" x2="152" y2="62" stroke="#2e2939" stroke-width="2.5" marker-end="url(#ar3)"/>
  <text x="158" y="284" fill="#2e2939" font-size="11">q1 (60,0) ↓</text>
  <text x="146" y="74" text-anchor="end" fill="#2e2939" font-size="11">q2 (60,50) ↑</text>
  <!-- perpendicular distances -->
  <line x1="116" y1="224" x2="152" y2="224" stroke="#2f8a5f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="134" y="242" text-anchor="middle" fill="#2f8a5f" font-size="11">2 m</text>
  <line x1="152" y1="80" x2="224" y2="80" stroke="#c4554e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="188" y="96" text-anchor="middle" fill="#c4554e" font-size="11">4 m</text>
  <!-- track segment p1 -> p2 -->
  <line x1="116" y1="224" x2="224" y2="80" stroke="#5677c9" stroke-width="2.5"/>
  <circle cx="116" cy="224" r="5" fill="#a9700f" stroke="#fff" stroke-width="1.5"/>
  <circle cx="224" cy="80" r="5" fill="#c4554e" stroke="#fff" stroke-width="1.5"/>
  <text x="108" y="214" text-anchor="end" fill="#2e2939">p1 (58,30)</text>
  <text x="108" y="228" text-anchor="end" fill="#8a8297" font-size="11">t = 5000</text>
  <text x="232" y="122" fill="#2e2939">p2 (64,38)</text>
  <text x="232" y="136" fill="#8a8297" font-size="11">t = 6000</text>
  <path d="M146,170 l12,12 m0,-12 l-12,12" stroke="#c4554e" stroke-width="3"/>
  <text x="164" y="196" fill="#c4554e" font-weight="700">u = 1/3</text>
  <!-- explanation -->
  <g font-size="13" fill="#2e2939">
    <text x="310" y="56" font-weight="700">cross(o, a, b) = (a − o) × (b − o)</text>
    <text x="310" y="86">d1 = cross(q1, q2, p1) = <tspan fill="#2f8a5f" font-weight="700">+100</tspan>  (p1 left)</text>
    <text x="310" y="108">d2 = cross(q1, q2, p2) = <tspan fill="#c4554e" font-weight="700">−200</tspan>  (p2 right)</text>
    <text x="310" y="130">d3 = cross(p1, p2, q1) = −196,  d4 = cross(p1, p2, q2) = +104</text>
    <text x="310" y="152" fill="#8a8297">both pairs have opposite signs → the segments cross</text>
    <text x="310" y="186" font-weight="700">u = d1 / (d1 − d2) = 100 / 300 = 1/3</text>
    <text x="310" y="208" fill="#8a8297">(|cross| = 50 m × distance to the line, so 2 m : 4 m)</text>
    <text x="310" y="238" fill="#c4554e" font-weight="700">breach_t = 5000 + (1/3)·(6000 − 5000) = 5333 ms</text>
    <text x="310" y="270" fill="#a9700f">same sign → no hit · d1 = d2 = 0 → collinear → false</text>
  </g>
</svg>
