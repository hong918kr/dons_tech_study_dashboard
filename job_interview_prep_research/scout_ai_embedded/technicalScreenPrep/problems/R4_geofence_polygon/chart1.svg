<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" width="780" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
  <defs><marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5677c9"/></marker></defs>
  <rect width="780" height="450" fill="#ffffff"/>
  <!-- scale: X = 50 + 7x, Y = 400 - 7y (meters) -->
  <!-- U fence = warn band colour, inner (5 m offset) = inside colour -->
  <polygon points="50,400 470,400 470,50 330,50 330,260 190,260 190,50 50,50" fill="#fcf0d6" stroke="#2e2939" stroke-width="2"/>
  <path d="M85,365 L435,365 L435,85 L365,85 L365,260 A35,35 0 0 1 330,295 L190,295 A35,35 0 0 1 155,260 L155,85 L85,85 Z" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="260" y="40" text-anchor="middle" fill="#8a8297">notch (outside)</text>
  <!-- axes ticks -->
  <g fill="#8a8297" font-size="11" text-anchor="middle">
    <text x="50" y="418">0</text><text x="190" y="418">20</text><text x="330" y="418">40</text><text x="470" y="418">60</text>
    <text x="560" y="418">x east (m)</text>
  </g>
  <g fill="#8a8297" font-size="11" text-anchor="end">
    <text x="42" y="404">0</text><text x="42" y="264">20</text><text x="42" y="54">50</text>
    <text x="8" y="30" text-anchor="start">y north (m)</text>
  </g>
  <!-- test 8: notch transit -->
  <line x1="120" y1="120" x2="400" y2="120" stroke="#8a5cc0" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="120" cy="120" r="4" fill="#8a5cc0"/><circle cx="400" cy="120" r="4" fill="#8a5cc0"/>
  <path d="M185,115 l10,10 m0,-10 l-10,10 M325,115 l10,10 m0,-10 l-10,10" stroke="#8a5cc0" stroke-width="2"/>
  <text x="260" y="102" text-anchor="middle" fill="#8a5cc0" font-weight="700">test 8: TRANSIT, u = 0.25 / 0.75</text>
  <text x="260" y="140" text-anchor="middle" fill="#8a5cc0">fixes inside, crossed twice → t = 250</text>
  <!-- main track -->
  <polyline fill="none" stroke="#5677c9" stroke-width="2.5" points="120,330 260,344 400,330 442,260 456,190 498,134 484,120 435,120 431.5,155 400,190" marker-end="url(#ar1)"/>
  <g stroke="#ffffff" stroke-width="1.5">
    <circle cx="120" cy="330" r="5" fill="#2f8a5f"/><circle cx="260" cy="344" r="5" fill="#2f8a5f"/>
    <circle cx="400" cy="330" r="5" fill="#2f8a5f"/><circle cx="442" cy="260" r="5" fill="#a9700f"/>
    <circle cx="456" cy="190" r="5" fill="#a9700f"/><circle cx="498" cy="134" r="5" fill="#c4554e"/>
    <circle cx="484" cy="120" r="5" fill="#c4554e"/><circle cx="435" cy="120" r="5" fill="#a9700f"/>
    <circle cx="431.5" cy="155" r="5" fill="#a9700f"/><circle cx="400" cy="190" r="5" fill="#2f8a5f"/>
  </g>
  <g font-size="11" fill="#2e2939">
    <text x="120" y="350" text-anchor="middle">1000</text>
    <text x="260" y="360" text-anchor="middle">2000</text>
    <text x="400" y="350" text-anchor="middle">3000</text>
    <text x="478" y="264">4000 WARN</text>
    <text x="448" y="194" text-anchor="end">5000</text>
    <text x="506" y="138">6000</text>
    <text x="490" y="112">7000</text>
    <text x="428" y="112" text-anchor="end">8000 WARN</text>
    <text x="424" y="159" text-anchor="end">9000 (5.5 m)</text>
    <text x="400" y="210" text-anchor="middle">10000 INSIDE</text>
  </g>
  <!-- breach point -->
  <path d="M464,165.3 l12,12 m0,-12 l-12,12" stroke="#c4554e" stroke-width="3"/>
  <text x="482" y="194" fill="#c4554e" font-weight="700">BREACH at (60, 32.67)</text>
  <text x="482" y="208" fill="#c4554e">t = 5000 + ⅓·1000 = 5333 ms</text>
  <!-- legend -->
  <g font-size="12">
    <rect x="570" y="250" width="16" height="12" fill="#e2f4e9" stroke="#2f8a5f"/><text x="594" y="260" fill="#2e2939">INSIDE (dist ≥ 5 m)</text>
    <rect x="570" y="274" width="16" height="12" fill="#fcf0d6" stroke="#a9700f"/><text x="594" y="284" fill="#2e2939">WARN band (dist &lt; 5 m)</text>
    <rect x="570" y="298" width="16" height="12" fill="#ffffff" stroke="#b9b0c6"/><text x="594" y="308" fill="#2e2939">outside → BREACH</text>
    <line x1="570" y1="328" x2="586" y2="328" stroke="#8a5cc0" stroke-width="2" stroke-dasharray="4 3"/><text x="594" y="332" fill="#2e2939">notch transit (test 8)</text>
    <text x="570" y="360" fill="#8a8297">leave WARN only at ≥ 6 m</text>
    <text x="570" y="376" fill="#8a8297">(warn 5 m + hyst 1 m)</text>
  </g>
</svg>
