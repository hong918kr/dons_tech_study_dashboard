<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" width="780" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
  <defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6f6680"/></marker></defs>
  <rect width="780" height="320" fill="#ffffff"/>
  <!-- left panel: U fence, X = 30 + 4x, Y = 250 - 4y -->
  <text x="160" y="26" text-anchor="middle" fill="#2e2939" font-weight="700" font-size="13">Even-odd ray casting (+x ray)</text>
  <polygon points="30,250 270,250 270,50 190,50 190,170 110,170 110,50 30,50" fill="#e2f4e9" stroke="#2e2939" stroke-width="2"/>
  <!-- point A on y = 20, ray through two vertices -->
  <line x1="70" y1="170" x2="320" y2="170" stroke="#6f6680" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar2)"/>
  <circle cx="70" cy="170" r="5" fill="#2f8a5f" stroke="#fff" stroke-width="1.5"/>
  <text x="70" y="190" text-anchor="middle" fill="#2f8a5f" font-weight="700">A (10,20)</text>
  <g fill="#ffffff" stroke="#2f8a5f" stroke-width="2"><circle cx="110" cy="170" r="6"/><circle cx="190" cy="170" r="6"/><circle cx="270" cy="170" r="6"/></g>
  <g fill="#2f8a5f" font-size="11" font-weight="700" text-anchor="middle"><text x="110" y="190">1</text><text x="190" y="190">2</text><text x="282" y="190">3</text></g>
  <!-- point B in the notch -->
  <line x1="150" y1="110" x2="320" y2="110" stroke="#6f6680" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar2)"/>
  <circle cx="150" cy="110" r="5" fill="#c4554e" stroke="#fff" stroke-width="1.5"/>
  <text x="150" y="98" text-anchor="middle" fill="#c4554e" font-weight="700">B (30,35)</text>
  <g fill="#ffffff" stroke="#c4554e" stroke-width="2"><circle cx="190" cy="110" r="6"/><circle cx="270" cy="110" r="6"/></g>
  <g fill="#c4554e" font-size="11" font-weight="700" text-anchor="middle"><text x="202" y="98">1</text><text x="282" y="98">2</text></g>
  <text x="30" y="276" fill="#2f8a5f" font-weight="600">A: 3 crossings → odd → inside ✓</text>
  <text x="30" y="294" fill="#c4554e" font-weight="600">B: 2 crossings → even → outside (notch)</text>
  <text x="30" y="312" fill="#8a8297" font-size="11">A's ray runs along the notch floor (horizontal edge: skipped)</text>
  <!-- right panel: diamond, vertex on the ray. X = 560 + 8x, Y = 160 - 8y -->
  <text x="590" y="26" text-anchor="middle" fill="#2e2939" font-weight="700" font-size="13">Ray through a vertex</text>
  <polygon points="560,240 640,160 560,80 480,160" fill="#e2f4e9" stroke="#2e2939" stroke-width="2"/>
  <line x1="560" y1="160" x2="740" y2="160" stroke="#6f6680" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar2)"/>
  <circle cx="560" cy="160" r="5" fill="#2f8a5f" stroke="#fff" stroke-width="1.5"/>
  <text x="552" y="178" text-anchor="end" fill="#2f8a5f" font-weight="700">C (0,0)</text>
  <circle cx="640" cy="160" r="7" fill="#fcf0d6" stroke="#a9700f" stroke-width="2"/>
  <text x="650" y="150" fill="#a9700f" font-weight="700">vertex (10,0)</text>
  <text x="604" y="110" fill="#2f8a5f" font-size="11">upper edge: counts</text>
  <text x="604" y="218" fill="#8a8297" font-size="11">lower edge: y ∈ [−10, 0) → skip</text>
  <text x="430" y="276" fill="#c4554e" font-weight="600">naive (y in [min,max]): both edges → 2 → outside ✗</text>
  <text x="430" y="294" fill="#2f8a5f" font-weight="600">half-open: (a.y &gt; p.y) != (b.y &gt; p.y) → 1 → inside ✓</text>
  <text x="430" y="312" fill="#8a8297" font-size="11">each vertex counted once; horizontal edges never count</text>
</svg>
