<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" width="740" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
  <defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2e2939"/></marker></defs>
  <rect width="740" height="330" fill="#ffffff"/>
  <text x="20" y="22" font-weight="700" fill="#2e2939" font-size="13">Differential drive: both wheels turn about the ICR</text>
  <!-- axle line extended to ICR -->
  <line x1="90" y1="260" x2="310" y2="260" stroke="#b9b0c6" stroke-dasharray="4 3"/>
  <line x1="90" y1="260" x2="243.2" y2="131.4" stroke="#b9b0c6" stroke-dasharray="4 3"/>
  <!-- arcs: left r=100, center r=150, right r=200, 40 deg CCW -->
  <path d="M190,260 A100,100 0 0 0 166.6,195.7" fill="none" stroke="#5677c9" stroke-width="2.2"/>
  <path d="M240,260 A150,150 0 0 0 204.9,163.6" fill="none" stroke="#8a5cc0" stroke-width="2.2" stroke-dasharray="5 3"/>
  <path d="M290,260 A200,200 0 0 0 243.2,131.4" fill="none" stroke="#2f8a5f" stroke-width="2.2"/>
  <text x="150" y="232" fill="#5677c9" font-weight="700">dl</text>
  <text x="232" y="196" fill="#8a5cc0" font-weight="700">d</text>
  <text x="282" y="186" fill="#2f8a5f" font-weight="700">dr</text>
  <!-- d-theta angle at ICR -->
  <path d="M125,260 A35,35 0 0 0 116.8,237.5" fill="none" stroke="#a9700f" stroke-width="1.8"/>
  <text x="130" y="246" fill="#a9700f" font-weight="700">dθ</text>
  <!-- ICR -->
  <circle cx="90" cy="260" r="4.5" fill="#c4554e"/>
  <text x="84" y="282" text-anchor="middle" fill="#c4554e" font-weight="700">ICR</text>
  <!-- start robot: wheels + body + heading -->
  <rect x="200" y="246" width="80" height="28" rx="5" fill="#f0e7fb" stroke="#8a5cc0"/>
  <rect x="184" y="246" width="12" height="28" rx="2" fill="#2e2939"/>
  <rect x="284" y="246" width="12" height="28" rx="2" fill="#2e2939"/>
  <circle cx="240" cy="260" r="3.5" fill="#2e2939"/>
  <line x1="240" y1="256" x2="240" y2="214" stroke="#2e2939" stroke-width="1.6" marker-end="url(#ak)"/>
  <text x="246" y="226" fill="#2e2939" font-size="11">θ</text>
  <!-- end robot (ghost), rotated 40 deg about its center -->
  <g transform="rotate(-40 204.9 163.6)" opacity=".75">
    <rect x="164.9" y="149.6" width="80" height="28" rx="5" fill="#f0e7fb" stroke="#8a5cc0" stroke-dasharray="3 2"/>
    <rect x="148.9" y="149.6" width="12" height="28" rx="2" fill="#8a8297"/>
    <rect x="248.9" y="149.6" width="12" height="28" rx="2" fill="#8a8297"/>
    <line x1="204.9" y1="159.6" x2="204.9" y2="121.6" stroke="#8a8297" stroke-width="1.6" marker-end="url(#ak)"/>
  </g>
  <!-- track width dimension -->
  <line x1="190" y1="296" x2="290" y2="296" stroke="#8a8297"/>
  <line x1="190" y1="290" x2="190" y2="302" stroke="#8a8297"/>
  <line x1="290" y1="290" x2="290" y2="302" stroke="#8a8297"/>
  <text x="240" y="316" text-anchor="middle" fill="#8a8297" font-size="11">track_width</text>
  <!-- R dimension -->
  <text x="165" y="276" text-anchor="middle" fill="#8a8297" font-size="11">R</text>
  <!-- formula box -->
  <rect x="360" y="40" width="364" height="276" rx="10" fill="#ffffff" stroke="#b9b0c6"/>
  <g fill="#2e2939" font-size="12">
    <text x="376" y="64">m_per_tick = 2π · wheel_radius / ticks_per_rev</text>
    <text x="376" y="86"><tspan fill="#5677c9" font-weight="700">dl</tspan> = dl_ticks · m_per_tick,  <tspan fill="#2f8a5f" font-weight="700">dr</tspan> = dr_ticks · m_per_tick</text>
    <text x="376" y="108"><tspan fill="#8a5cc0" font-weight="700">d</tspan> = (dl + dr) / 2</text>
    <text x="376" y="130"><tspan fill="#a9700f" font-weight="700">dθ</tspan> = (dr − dl) / track_width</text>
    <text x="376" y="152">R = d / dθ = (track / 2) · (dr + dl) / (dr − dl)</text>
    <text x="376" y="180" font-weight="700">midpoint:</text>
    <text x="446" y="180">x += d · cos(θ + dθ/2)</text>
    <text x="446" y="198">y += d · sin(θ + dθ/2)</text>
    <text x="446" y="216">θ  = wrap(θ + dθ)</text>
    <text x="376" y="242" font-weight="700">exact arc:</text>
    <text x="446" y="242">use chord = d · sin(dθ/2) / (dθ/2)</text>
  </g>
  <g font-size="11" fill="#8a8297">
    <text x="376" y="270">dl = dr → straight (R = ∞)  ·  dl = −dr → spin (d = 0)</text>
    <text x="376" y="290">example robot: 2048 ticks/rev · r = 0.10 m · track = 0.50 m</text>
    <text x="376" y="306">→ 1 tick = 0.307 mm · 1 rev = 0.628319 m</text>
  </g>
</svg>
