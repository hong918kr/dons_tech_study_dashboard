<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
<rect width="720" height="230" fill="#fff"/>
<text x="12" y="22" fill="#2e2939" font-weight="700" font-size="13">Closed intervals: when do two of them merge?</text>
<text x="12" y="62" fill="#2f8a5f" font-weight="700">touch</text><text x="12" y="78" fill="#8a8297" font-size="11">200 ≤ 200</text>
<rect x="140.0" y="52" width="120.0" height="16" rx="3" fill="#5677c9" opacity=".85"/>
<text x="200.0" y="48" text-anchor="middle" fill="#5677c9" font-size="11">[100, 200]</text>
<rect x="260.0" y="52" width="120.0" height="16" rx="3" fill="#8a5cc0" opacity=".85"/>
<text x="320.0" y="48" text-anchor="middle" fill="#8a5cc0" font-size="11">[200, 300]</text>
<line x1="260.0" y1="44" x2="260.0" y2="76" stroke="#2e2939" stroke-dasharray="2 2"/>
<text x="400.0" y="64" fill="#2f8a5f" font-weight="600">→ merge</text>
<rect x="470.0" y="52" width="120.0" height="16" rx="3" fill="#c4554e"/>
<text x="530.0" y="48" text-anchor="middle" fill="#c4554e" font-weight="700" font-size="11">[100, 300]</text>
<text x="12" y="142" fill="#a9700f" font-weight="700">1 ms gap</text><text x="12" y="158" fill="#8a8297" font-size="11">301 &gt; 300</text>
<rect x="140.0" y="132" width="240.0" height="16" rx="3" fill="#5677c9" opacity=".85"/>
<text x="260.0" y="128" text-anchor="middle" fill="#5677c9" font-size="11">[100, 300]</text>
<rect x="390.0" y="132" width="120.0" height="16" rx="3" fill="#8a5cc0" opacity=".85"/>
<text x="450.0" y="128" text-anchor="middle" fill="#8a5cc0" font-size="11">[301, 400]</text>
<text x="530.0" y="144" fill="#a9700f" font-weight="600">→ stay separate</text>
<text x="385.0" y="168" text-anchor="middle" fill="#8a8297" font-size="10">gap drawn wider</text>
<rect x="12" y="188" width="696" height="30" rx="8" fill="#e2f4e9" stroke="#2f8a5f"/>
<text x="360" y="208" text-anchor="middle" fill="#2f8a5f" font-weight="600">rule after sorting by start: if next.start ≤ cur.end → cur.end = max(cur.end, next.end), else start a new interval</text>
</svg>
