<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" width="740" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
<rect width="740" height="330" fill="#ffffff"/>
<text x="20" y="22" fill="#2e2939" font-weight="700" font-size="14">STATUS = 0x00002A35</text>
<text x="200" y="22" fill="#8a8297">(bits 31..16 = 0, shown as one box)</text>
<rect x="20" y="50" width="80" height="36" fill="#ffffff" stroke="#b9b0c6"/>
<text x="60" y="73" text-anchor="middle" fill="#8a8297">0 … 0</text>
<text x="60" y="42" text-anchor="middle" fill="#8a8297" font-size="11">31..16</text>
<rect x="110" y="50" width="38" height="36" fill="#fcf0d6" stroke="#a9700f"/>
<text x="129" y="74" text-anchor="middle" fill="#a9700f" font-weight="700" font-size="14">0</text>
<text x="129" y="42" text-anchor="middle" fill="#8a8297" font-size="11">15</text>
<rect x="148" y="50" width="38" height="36" fill="#fcf0d6" stroke="#a9700f"/>
<text x="167" y="74" text-anchor="middle" fill="#a9700f" font-weight="700" font-size="14">0</text>
<text x="167" y="42" text-anchor="middle" fill="#8a8297" font-size="11">14</text>
<rect x="186" y="50" width="38" height="36" fill="#fcf0d6" stroke="#a9700f"/>
<text x="205" y="74" text-anchor="middle" fill="#a9700f" font-weight="700" font-size="14">1</text>
<text x="205" y="42" text-anchor="middle" fill="#8a8297" font-size="11">13</text>
<rect x="224" y="50" width="38" height="36" fill="#fcf0d6" stroke="#a9700f"/>
<text x="243" y="74" text-anchor="middle" fill="#a9700f" font-weight="700" font-size="14">0</text>
<text x="243" y="42" text-anchor="middle" fill="#8a8297" font-size="11">12</text>
<rect x="262" y="50" width="38" height="36" fill="#fcf0d6" stroke="#a9700f"/>
<text x="281" y="74" text-anchor="middle" fill="#a9700f" font-weight="700" font-size="14">1</text>
<text x="281" y="42" text-anchor="middle" fill="#8a8297" font-size="11">11</text>
<rect x="300" y="50" width="38" height="36" fill="#fcf0d6" stroke="#a9700f"/>
<text x="319" y="74" text-anchor="middle" fill="#a9700f" font-weight="700" font-size="14">0</text>
<text x="319" y="42" text-anchor="middle" fill="#8a8297" font-size="11">10</text>
<rect x="338" y="50" width="38" height="36" fill="#fcf0d6" stroke="#a9700f"/>
<text x="357" y="74" text-anchor="middle" fill="#a9700f" font-weight="700" font-size="14">1</text>
<text x="357" y="42" text-anchor="middle" fill="#8a8297" font-size="11">9</text>
<rect x="376" y="50" width="38" height="36" fill="#fcf0d6" stroke="#a9700f"/>
<text x="395" y="74" text-anchor="middle" fill="#a9700f" font-weight="700" font-size="14">0</text>
<text x="395" y="42" text-anchor="middle" fill="#8a8297" font-size="11">8</text>
<rect x="414" y="50" width="38" height="36" fill="#ffffff" stroke="#b9b0c6"/>
<text x="433" y="74" text-anchor="middle" fill="#b9b0c6" font-weight="700" font-size="14">0</text>
<text x="433" y="42" text-anchor="middle" fill="#8a8297" font-size="11">7</text>
<rect x="452" y="50" width="38" height="36" fill="#f0e7fb" stroke="#8a5cc0"/>
<text x="471" y="74" text-anchor="middle" fill="#8a5cc0" font-weight="700" font-size="14">0</text>
<text x="471" y="42" text-anchor="middle" fill="#8a8297" font-size="11">6</text>
<rect x="490" y="50" width="38" height="36" fill="#f0e7fb" stroke="#8a5cc0"/>
<text x="509" y="74" text-anchor="middle" fill="#8a5cc0" font-weight="700" font-size="14">1</text>
<text x="509" y="42" text-anchor="middle" fill="#8a8297" font-size="11">5</text>
<rect x="528" y="50" width="38" height="36" fill="#f0e7fb" stroke="#8a5cc0"/>
<text x="547" y="74" text-anchor="middle" fill="#8a5cc0" font-weight="700" font-size="14">1</text>
<text x="547" y="42" text-anchor="middle" fill="#8a8297" font-size="11">4</text>
<rect x="566" y="50" width="38" height="36" fill="#e2f4e9" stroke="#2f8a5f"/>
<text x="585" y="74" text-anchor="middle" fill="#2f8a5f" font-weight="700" font-size="14">0</text>
<text x="585" y="42" text-anchor="middle" fill="#8a8297" font-size="11">3</text>
<rect x="604" y="50" width="38" height="36" fill="#fce5e2" stroke="#c4554e"/>
<text x="623" y="74" text-anchor="middle" fill="#c4554e" font-weight="700" font-size="14">1</text>
<text x="623" y="42" text-anchor="middle" fill="#8a8297" font-size="11">2</text>
<rect x="642" y="50" width="38" height="36" fill="#fce5e2" stroke="#c4554e"/>
<text x="661" y="74" text-anchor="middle" fill="#c4554e" font-weight="700" font-size="14">0</text>
<text x="661" y="42" text-anchor="middle" fill="#8a8297" font-size="11">1</text>
<rect x="680" y="50" width="38" height="36" fill="#fce5e2" stroke="#c4554e"/>
<text x="699" y="74" text-anchor="middle" fill="#c4554e" font-weight="700" font-size="14">1</text>
<text x="699" y="42" text-anchor="middle" fill="#8a8297" font-size="11">0</text>
<path d="M112,96 V104 H412 V96" fill="none" stroke="#a9700f" stroke-width="1.5"/>
<text x="262.0" y="120" text-anchor="middle" fill="#a9700f" font-weight="700">FIFO_LVL (pos 8, w 8)</text>
<text x="262" y="136" text-anchor="middle" fill="#a9700f">0x2A = 42</text>
<path d="M454,96 V104 H564 V96" fill="none" stroke="#8a5cc0" stroke-width="1.5"/>
<text x="509.0" y="120" text-anchor="middle" fill="#8a5cc0" font-weight="700">MODE (4, 3)</text>
<text x="509" y="136" text-anchor="middle" fill="#8a5cc0">0b011 = 3</text>
<text x="433" y="120" text-anchor="middle" fill="#8a8297" font-size="11">rsv</text>
<text x="585" y="112" text-anchor="middle" fill="#2f8a5f" font-size="11" font-weight="700">RDY</text>
<text x="623" y="112" text-anchor="middle" fill="#c4554e" font-size="11" font-weight="700">CRC</text>
<text x="661" y="112" text-anchor="middle" fill="#c4554e" font-size="11" font-weight="700">UV</text>
<text x="699" y="112" text-anchor="middle" fill="#c4554e" font-size="11" font-weight="700">OT</text>
<path d="M606,124 V130 H716 V124" fill="none" stroke="#c4554e" stroke-width="1.5"/>
<text x="661" y="146" text-anchor="middle" fill="#c4554e" font-size="11">popcount(reg &amp; 0x7) = 2</text>
<line x1="20" y1="166" x2="720" y2="166" stroke="#b9b0c6" stroke-dasharray="3 3"/>
<text x="20" y="190" fill="#2e2939" font-family="Menlo,monospace" font-size="12" xml:space="preserve">mask = field_mask(3) &lt;&lt; 4</text>
<text x="400" y="190" fill="#2e2939" font-family="Menlo,monospace" font-size="12" font-weight="700">0x00000070</text>
<text x="20" y="212" fill="#2e2939" font-family="Menlo,monospace" font-size="12" xml:space="preserve">get: (0x2A35 &gt;&gt; 4) &amp; 0x7</text>
<text x="400" y="212" fill="#8a5cc0" font-family="Menlo,monospace" font-size="12" font-weight="700">0x2A3 &amp; 0x7 = 3</text>
<text x="20" y="234" fill="#2e2939" font-family="Menlo,monospace" font-size="12" xml:space="preserve">set MODE=6: reg &amp; ~mask</text>
<text x="400" y="234" fill="#2e2939" font-family="Menlo,monospace" font-size="12" font-weight="700">0x00002A05</text>
<text x="20" y="256" fill="#2e2939" font-family="Menlo,monospace" font-size="12" xml:space="preserve">        | ((6 &lt;&lt; 4) &amp; mask)</text>
<text x="400" y="256" fill="#8a5cc0" font-family="Menlo,monospace" font-size="12" font-weight="700">0x00002A05 | 0x60 = 0x00002A65</text>
<text x="20" y="278" fill="#2e2939" font-family="Menlo,monospace" font-size="12" xml:space="preserve">set MODE=9 (0b1001): (9 &lt;&lt; 4) &amp; mask</text>
<text x="400" y="278" fill="#a9700f" font-family="Menlo,monospace" font-size="12" font-weight="700">0x10 → 0x00002A15 (extra bit dropped)</text>
<text x="20" y="300" fill="#2e2939" font-family="Menlo,monospace" font-size="12" xml:space="preserve">width = 32: field_mask returns 0xFFFFFFFF</text>
<text x="400" y="300" fill="#c4554e" font-family="Menlo,monospace" font-size="12" font-weight="700">never evaluate 1u &lt;&lt; 32 (UB)</text>
</svg>
