<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6f6680"/></marker></defs>
<rect width="780" height="330" fill="#fff"/>
<rect x="30" y="102" width="120" height="56" rx="28" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="2"/>
<text x="90.0" y="127" text-anchor="middle" font-weight="700" fill="#2f8a5f" font-size="14">SYNC</text>
<text x="90.0" y="145" text-anchor="middle" fill="#2f8a5f" font-size="11">hunt for 0xAA</text>
<rect x="230" y="102" width="120" height="56" rx="28" fill="#fcf0d6" stroke="#a9700f" stroke-width="2"/>
<text x="290.0" y="127" text-anchor="middle" font-weight="700" fill="#a9700f" font-size="14">LEN</text>
<text x="290.0" y="145" text-anchor="middle" fill="#a9700f" font-size="11">check 1..16</text>
<rect x="430" y="102" width="130" height="56" rx="28" fill="#ffffff" stroke="#5677c9" stroke-width="2"/>
<text x="495.0" y="127" text-anchor="middle" font-weight="700" fill="#5677c9" font-size="14">PAYLOAD</text>
<text x="495.0" y="145" text-anchor="middle" fill="#5677c9" font-size="11">idx &lt; len</text>
<rect x="640" y="102" width="110" height="56" rx="28" fill="#f0e7fb" stroke="#8a5cc0" stroke-width="2"/>
<text x="695.0" y="127" text-anchor="middle" font-weight="700" fill="#8a5cc0" font-size="14">CHK</text>
<text x="695.0" y="145" text-anchor="middle" fill="#8a5cc0" font-size="11">compare XOR</text>
<line x1="150" y1="130" x2="228" y2="130" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="190.0" y="122" text-anchor="middle" fill="#2e2939" font-weight="600" font-size="11">0xAA</text>
<line x1="350" y1="130" x2="428" y2="130" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="390.0" y="122" text-anchor="middle" fill="#2e2939" font-weight="600" font-size="11">1 ≤ b ≤ 16</text>
<line x1="560" y1="130" x2="638" y2="130" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="600.0" y="122" text-anchor="middle" fill="#2e2939" font-weight="600" font-size="11">idx == len</text>
<path d="M68,102 C60,62 120,62 112,100" fill="none" stroke="#6f6680" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="90" y="40" text-anchor="middle" fill="#2e2939" font-weight="600" font-size="11">other byte</text>
<text x="90" y="54" text-anchor="middle" fill="#8a8297" font-size="11">skip (noise)</text>
<path d="M268,102 C260,62 320,62 312,100" fill="none" stroke="#6f6680" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="290" y="40" text-anchor="middle" fill="#2e2939" font-weight="600" font-size="11">b == 0xAA</text>
<text x="290" y="54" text-anchor="middle" fill="#8a8297" font-size="11">bad len, but new SYNC</text>
<path d="M473,102 C465,62 525,62 517,100" fill="none" stroke="#6f6680" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="495" y="40" text-anchor="middle" fill="#2e2939" font-weight="600" font-size="11">store b</text>
<text x="495" y="54" text-anchor="middle" fill="#8a8297" font-size="11">chk ^= b, idx++</text>
<text x="290" y="22" text-anchor="middle" fill="#8a8297" font-size="11">on valid len: len = b, idx = 0, chk = b</text>
<path d="M270,158 C270,200 110,200 110,160" fill="none" stroke="#c4554e" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="170" y="210" text-anchor="start" fill="#c4554e" font-size="11">bad len (0 or &gt; 16) → bad_frames++</text>
<path d="M695,158 C695,300 70,300 70,160" fill="none" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="382" y="300" text-anchor="middle" fill="#2f8a5f" font-weight="700">b == chk → EMIT packet, return true</text>
<text x="382" y="318" text-anchor="middle" fill="#c4554e" font-weight="600">b != chk → bad_frames++ (drop)</text>
</svg>
