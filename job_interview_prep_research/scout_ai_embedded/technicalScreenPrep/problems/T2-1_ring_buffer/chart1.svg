<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6f6680"/></marker></defs>
<rect width="720" height="250" fill="#fff"/>
<text x="360" y="22" text-anchor="middle" fill="#2e2939" font-weight="700" font-size="13">free-running counters: tail = 6, head = 11 → count = head − tail = 5</text>
<rect x="120" y="90" width="60" height="50" fill="#f0e7fb" stroke="#8a5cc0" stroke-width="1.5"/>
<text x="150" y="114" text-anchor="middle" fill="#2e2939" font-weight="700" font-size="13">820</text>
<text x="150" y="131" text-anchor="middle" fill="#8a5cc0" font-size="11">#8</text>
<text x="150" y="156" text-anchor="middle" fill="#8a8297" font-size="11">[0]</text>
<rect x="180" y="90" width="60" height="50" fill="#f0e7fb" stroke="#8a5cc0" stroke-width="1.5"/>
<text x="210" y="114" text-anchor="middle" fill="#2e2939" font-weight="700" font-size="13">818</text>
<text x="210" y="131" text-anchor="middle" fill="#8a5cc0" font-size="11">#9</text>
<text x="210" y="156" text-anchor="middle" fill="#8a8297" font-size="11">[1]</text>
<rect x="240" y="90" width="60" height="50" fill="#f0e7fb" stroke="#8a5cc0" stroke-width="1.5"/>
<text x="270" y="114" text-anchor="middle" fill="#2e2939" font-weight="700" font-size="13">816</text>
<text x="270" y="131" text-anchor="middle" fill="#8a5cc0" font-size="11">#10</text>
<text x="270" y="156" text-anchor="middle" fill="#8a8297" font-size="11">[2]</text>
<rect x="300" y="90" width="60" height="50" fill="#fff" stroke="#b9b0c6" stroke-width="1.5"/>
<text x="330" y="120" text-anchor="middle" fill="#b9b0c6" font-size="11">free</text>
<text x="330" y="156" text-anchor="middle" fill="#8a8297" font-size="11">[3]</text>
<rect x="360" y="90" width="60" height="50" fill="#fff" stroke="#b9b0c6" stroke-width="1.5"/>
<text x="390" y="120" text-anchor="middle" fill="#b9b0c6" font-size="11">free</text>
<text x="390" y="156" text-anchor="middle" fill="#8a8297" font-size="11">[4]</text>
<rect x="420" y="90" width="60" height="50" fill="#fff" stroke="#b9b0c6" stroke-width="1.5"/>
<text x="450" y="120" text-anchor="middle" fill="#b9b0c6" font-size="11">free</text>
<text x="450" y="156" text-anchor="middle" fill="#8a8297" font-size="11">[5]</text>
<rect x="480" y="90" width="60" height="50" fill="#f0e7fb" stroke="#8a5cc0" stroke-width="1.5"/>
<text x="510" y="114" text-anchor="middle" fill="#2e2939" font-weight="700" font-size="13">812</text>
<text x="510" y="131" text-anchor="middle" fill="#8a5cc0" font-size="11">#6</text>
<text x="510" y="156" text-anchor="middle" fill="#8a8297" font-size="11">[6]</text>
<rect x="540" y="90" width="60" height="50" fill="#f0e7fb" stroke="#8a5cc0" stroke-width="1.5"/>
<text x="570" y="114" text-anchor="middle" fill="#2e2939" font-weight="700" font-size="13">815</text>
<text x="570" y="131" text-anchor="middle" fill="#8a5cc0" font-size="11">#7</text>
<text x="570" y="156" text-anchor="middle" fill="#8a8297" font-size="11">[7]</text>
<path d="M570,88 C570,30 150,30 150,88" fill="none" stroke="#8a5cc0" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="360" y="68" text-anchor="middle" fill="#8a5cc0" font-weight="600">slot index wraps 7 → 0  (counter 7 → 8, 8 &amp; 7 = 0)</text>
<line x1="510" y1="198" x2="510" y2="164" stroke="#2f8a5f" stroke-width="2" marker-end="url(#ar)"/>
<text x="510" y="214" text-anchor="middle" fill="#2f8a5f" font-weight="700">tail = 6 → 6 &amp; 7 = 6</text>
<text x="510" y="230" text-anchor="middle" fill="#8a8297">next pop: oldest 812</text>
<line x1="330" y1="198" x2="330" y2="164" stroke="#c4554e" stroke-width="2" marker-end="url(#ar)"/>
<text x="330" y="214" text-anchor="middle" fill="#c4554e" font-weight="700">head = 11 → 11 &amp; 7 = 3</text>
<text x="330" y="230" text-anchor="middle" fill="#8a8297">next push goes here</text>
<rect x="20" y="96" width="12" height="12" fill="#f0e7fb" stroke="#8a5cc0"/><text x="38" y="106" fill="#4b4459" font-size="11">data</text>
<text x="20" y="128" fill="#8a5cc0" font-size="11">#n = counter</text>
