<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6f6680"/></marker></defs>
  <rect width="760" height="270" fill="#fff"/>
  <rect x="160" y="96" width="160" height="66" rx="33" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="2"/>
  <text x="240" y="126" text-anchor="middle" font-weight="700" fill="#2f8a5f" font-size="14">NORMAL</text>
  <text x="240" y="144" text-anchor="middle" fill="#2f8a5f">overheated = false</text>
  <rect x="440" y="96" width="170" height="66" rx="33" fill="#fce5e2" stroke="#c4554e" stroke-width="2"/>
  <text x="525" y="126" text-anchor="middle" font-weight="700" fill="#c4554e" font-size="14">OVERHEATED</text>
  <text x="525" y="144" text-anchor="middle" fill="#c4554e">overheated = true</text>
  <path d="M320,112 C360,76 400,76 440,112" fill="none" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="380" y="50" text-anchor="middle" fill="#2e2939" font-weight="600">streak hits n_confirm</text>
  <text x="380" y="66" text-anchor="middle" fill="#c4554e" font-weight="700">return EV_OVERHEAT</text>
  <path d="M440,146 C400,182 360,182 320,146" fill="none" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="380" y="200" text-anchor="middle" fill="#2e2939" font-weight="600">streak hits n_confirm</text>
  <text x="380" y="216" text-anchor="middle" fill="#2f8a5f" font-weight="700">return EV_RECOVERED</text>
  <path d="M170,108 C110,66 110,192 170,150" fill="none" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="90" y="44" text-anchor="middle" fill="#2e2939" font-weight="600">temp ≥ high: streak++</text>
  <text x="90" y="60" text-anchor="middle" fill="#8a8297">else: streak = 0</text>
  <path d="M600,108 C660,66 660,192 600,150" fill="none" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="670" y="44" text-anchor="middle" fill="#2e2939" font-weight="600">temp ≤ low: streak++</text>
  <text x="670" y="60" text-anchor="middle" fill="#8a8297">else: streak = 0</text>
  <rect x="160" y="232" width="450" height="28" rx="8" fill="#fcf0d6" stroke="#a9700f"/>
  <text x="385" y="251" text-anchor="middle" fill="#a9700f" font-weight="600">transition → streak = 0 · TEMP_INVALID → streak = 0, EV_NONE (both states)</text>
</svg>
