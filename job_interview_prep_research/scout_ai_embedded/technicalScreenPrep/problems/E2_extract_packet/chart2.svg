<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6f6680"/></marker></defs>
<rect width="760" height="430" fill="#fff"/>
<rect x="40" y="16" width="300" height="42" rx="8" fill="#fff" stroke="#5677c9" stroke-width="1.6"/>
<text x="190.0" y="34" text-anchor="middle" fill="#2e2939" font-weight="700">scan for AA 55 starting at i</text>
<text x="190.0" y="50" text-anchor="middle" fill="#8a8297" font-size="11">from i = 0</text>
<rect x="430" y="16" width="300" height="42" rx="8" fill="#fcf0d6" stroke="#a9700f" stroke-width="1.6"/>
<text x="580.0" y="34" text-anchor="middle" fill="#a9700f" font-weight="700">NEED_MORE</text>
<text x="580.0" y="50" text-anchor="middle" fill="#2e2939" font-size="11">consumed = len (lone AA at end: len − 1)</text>
<line x1="340" y1="37.0" x2="428" y2="37.0" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="385.0" y="31.0" text-anchor="middle" fill="#8a8297" font-size="11">none</text>
<line x1="190.0" y1="58" x2="190.0" y2="76" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="198.0" y="72" fill="#8a8297" font-size="11">sync at i</text>
<rect x="40" y="78" width="300" height="42" rx="8" fill="#fff" stroke="#5677c9" stroke-width="1.6"/>
<text x="190.0" y="96" text-anchor="middle" fill="#2e2939" font-weight="700">len − i ≥ 4 ?</text>
<text x="190.0" y="112" text-anchor="middle" fill="#8a8297" font-size="11">full header (AA 55 TYPE LEN) here?</text>
<rect x="430" y="78" width="300" height="42" rx="8" fill="#fcf0d6" stroke="#a9700f" stroke-width="1.6"/>
<text x="580.0" y="96" text-anchor="middle" fill="#a9700f" font-weight="700">NEED_MORE</text>
<text x="580.0" y="112" text-anchor="middle" fill="#2e2939" font-size="11">consumed = i  (drop garbage, keep header)</text>
<line x1="340" y1="99.0" x2="428" y2="99.0" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="385.0" y="93.0" text-anchor="middle" fill="#8a8297" font-size="11">no</text>
<line x1="190.0" y1="120" x2="190.0" y2="138" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="198.0" y="134" fill="#8a8297" font-size="11">yes</text>
<rect x="40" y="140" width="300" height="42" rx="8" fill="#fff" stroke="#5677c9" stroke-width="1.6"/>
<text x="190.0" y="158" text-anchor="middle" fill="#2e2939" font-weight="700">LEN ≤ 32 ?</text>
<text x="190.0" y="174" text-anchor="middle" fill="#8a8297" font-size="11">MAX_PAYLOAD</text>
<rect x="430" y="140" width="300" height="42" rx="8" fill="#fce5e2" stroke="#c4554e" stroke-width="1.6"/>
<text x="580.0" y="158" text-anchor="middle" fill="#c4554e" font-weight="700">BAD_LEN</text>
<text x="580.0" y="174" text-anchor="middle" fill="#2e2939" font-size="11">consumed = i + 1  (skip only the AA)</text>
<line x1="340" y1="161.0" x2="428" y2="161.0" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="385.0" y="155.0" text-anchor="middle" fill="#8a8297" font-size="11">no</text>
<line x1="190.0" y1="182" x2="190.0" y2="200" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="198.0" y="196" fill="#8a8297" font-size="11">yes</text>
<rect x="40" y="202" width="300" height="42" rx="8" fill="#fff" stroke="#5677c9" stroke-width="1.6"/>
<text x="190.0" y="220" text-anchor="middle" fill="#2e2939" font-weight="700">len − i ≥ 6 + LEN ?</text>
<text x="190.0" y="236" text-anchor="middle" fill="#8a8297" font-size="11">whole frame here?</text>
<rect x="430" y="202" width="300" height="42" rx="8" fill="#fcf0d6" stroke="#a9700f" stroke-width="1.6"/>
<text x="580.0" y="220" text-anchor="middle" fill="#a9700f" font-weight="700">NEED_MORE</text>
<text x="580.0" y="236" text-anchor="middle" fill="#2e2939" font-size="11">consumed = i  (keep partial frame)</text>
<line x1="340" y1="223.0" x2="428" y2="223.0" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="385.0" y="217.0" text-anchor="middle" fill="#8a8297" font-size="11">no</text>
<line x1="190.0" y1="244" x2="190.0" y2="262" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="198.0" y="258" fill="#8a8297" font-size="11">yes</text>
<rect x="40" y="264" width="300" height="42" rx="8" fill="#fff" stroke="#5677c9" stroke-width="1.6"/>
<text x="190.0" y="282" text-anchor="middle" fill="#2e2939" font-weight="700">CRC matches ?</text>
<text x="190.0" y="298" text-anchor="middle" fill="#8a8297" font-size="11">crc16(TYPE,LEN,PAYLOAD) vs LO | HI&lt;&lt;8</text>
<rect x="430" y="264" width="300" height="42" rx="8" fill="#fce5e2" stroke="#c4554e" stroke-width="1.6"/>
<text x="580.0" y="282" text-anchor="middle" fill="#c4554e" font-weight="700">BAD_CRC</text>
<text x="580.0" y="298" text-anchor="middle" fill="#2e2939" font-size="11">consumed = i + 1  (skip only the AA)</text>
<line x1="340" y1="285.0" x2="428" y2="285.0" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="385.0" y="279.0" text-anchor="middle" fill="#8a8297" font-size="11">no</text>
<line x1="190.0" y1="306" x2="190.0" y2="324" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="198.0" y="320" fill="#8a8297" font-size="11">yes</text>
<rect x="40" y="326" width="300" height="42" rx="8" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="1.8"/>
<text x="190.0" y="344" text-anchor="middle" fill="#2f8a5f" font-weight="700">FOUND → fill *out</text>
<text x="190.0" y="360" text-anchor="middle" fill="#2e2939" font-size="11">consumed = i + 6 + LEN</text>
<rect x="430" y="326" width="300" height="42" rx="8" fill="#f0e7fb" stroke="#8a5cc0" stroke-width="1.4"/>
<text x="580.0" y="344" text-anchor="middle" fill="#8a5cc0" font-weight="700">caller: pos += consumed</text>
<text x="580.0" y="360" text-anchor="middle" fill="#2e2939" font-size="11">loop until NEED_MORE, then memmove tail</text>
<text x="40" y="398" fill="#a9700f" font-weight="600">NEED_MORE never drops a possible frame start.</text>
<text x="40" y="416" fill="#c4554e" font-weight="600">FOUND / BAD_* always consume ≥ 1 byte → the caller loop always ends.</text>
</svg>
