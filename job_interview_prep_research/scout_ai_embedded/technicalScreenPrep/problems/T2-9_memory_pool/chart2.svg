<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
<defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6f6680"/></marker></defs>
<rect width="720" height="300" fill="#ffffff"/>
<text x="20" y="22" fill="#2e2939" font-weight="700" font-size="13">pool_free(ptr): offset = ptr − base</text>
<rect x="80" y="70" width="70" height="34" fill="#f0e7fb" stroke="#8a5cc0"/>
<text x="115" y="91" text-anchor="middle" fill="#8a5cc0" font-weight="700">B0</text>
<text x="80" y="120" text-anchor="middle" fill="#8a8297" font-size="10">0</text>
<rect x="150" y="70" width="70" height="34" fill="#e2f4e9" stroke="#2f8a5f"/>
<text x="185" y="91" text-anchor="middle" fill="#2f8a5f" font-weight="700">B1</text>
<text x="150" y="120" text-anchor="middle" fill="#8a8297" font-size="10">32</text>
<rect x="220" y="70" width="70" height="34" fill="#f0e7fb" stroke="#8a5cc0"/>
<text x="255" y="91" text-anchor="middle" fill="#8a5cc0" font-weight="700">B2</text>
<text x="220" y="120" text-anchor="middle" fill="#8a8297" font-size="10">64</text>
<rect x="290" y="70" width="70" height="34" fill="#e2f4e9" stroke="#2f8a5f"/>
<text x="325" y="91" text-anchor="middle" fill="#2f8a5f" font-weight="700">B3</text>
<text x="290" y="120" text-anchor="middle" fill="#8a8297" font-size="10">96</text>
<rect x="360" y="70" width="70" height="34" fill="#e2f4e9" stroke="#2f8a5f"/>
<text x="395" y="91" text-anchor="middle" fill="#2f8a5f" font-weight="700">B4</text>
<text x="360" y="120" text-anchor="middle" fill="#8a8297" font-size="10">128</text>
<rect x="430" y="70" width="70" height="34" fill="#e2f4e9" stroke="#2f8a5f"/>
<text x="465" y="91" text-anchor="middle" fill="#2f8a5f" font-weight="700">B5</text>
<text x="430" y="120" text-anchor="middle" fill="#8a8297" font-size="10">160</text>
<rect x="500" y="70" width="70" height="34" fill="#e2f4e9" stroke="#2f8a5f"/>
<text x="535" y="91" text-anchor="middle" fill="#2f8a5f" font-weight="700">B6</text>
<text x="500" y="120" text-anchor="middle" fill="#8a8297" font-size="10">192</text>
<rect x="570" y="70" width="70" height="34" fill="#e2f4e9" stroke="#2f8a5f"/>
<text x="605" y="91" text-anchor="middle" fill="#2f8a5f" font-weight="700">B7</text>
<text x="570" y="120" text-anchor="middle" fill="#8a8297" font-size="10">224</text>
<text x="640" y="120" text-anchor="middle" fill="#8a8297" font-size="10">256</text>
<text x="40" y="120" text-anchor="end" fill="#8a8297" font-size="10">offset</text>
<text x="80" y="60" text-anchor="middle" fill="#8a8297" font-size="10">base</text>
<line x1="220" y1="40" x2="220" y2="68" stroke="#2f8a5f" stroke-width="1.6" marker-end="url(#a2)"/>
<line x1="292.2" y1="40" x2="292.2" y2="68" stroke="#c4554e" stroke-width="1.6" marker-end="url(#a2)"/>
<line x1="640" y1="40" x2="640" y2="68" stroke="#c4554e" stroke-width="1.6" marker-end="url(#a2)"/>
<text x="216" y="36" text-anchor="end" fill="#2f8a5f" font-size="11" font-weight="700">base+64</text>
<text x="298" y="36" text-anchor="start" fill="#c4554e" font-size="11" font-weight="700">base+97</text>
<text x="636" y="36" text-anchor="end" fill="#c4554e" font-size="11" font-weight="700">base+256</text>
<circle cx="30" cy="156" r="9" fill="#f0e7fb"/><text x="30" y="160" text-anchor="middle" fill="#8a5cc0" font-size="11" font-weight="700">1</text>
<text x="48" y="160" fill="#2e2939" font-family="Menlo,monospace" font-size="11">ptr == NULL</text>
<text x="380" y="160" fill="#8a8297" font-size="12" font-weight="600">→ return OK (no-op)</text>
<circle cx="30" cy="182" r="9" fill="#f0e7fb"/><text x="30" y="186" text-anchor="middle" fill="#8a5cc0" font-size="11" font-weight="700">2</text>
<text x="48" y="186" fill="#2e2939" font-family="Menlo,monospace" font-size="11">offset &lt; 0 or offset ≥ 8 × 32</text>
<text x="380" y="186" fill="#c4554e" font-size="12" font-weight="600">→ FOREIGN   (e.g. &amp;on_stack, base+256)</text>
<circle cx="30" cy="208" r="9" fill="#f0e7fb"/><text x="30" y="212" text-anchor="middle" fill="#8a5cc0" font-size="11" font-weight="700">3</text>
<text x="48" y="212" fill="#2e2939" font-family="Menlo,monospace" font-size="11">offset % 32 ≠ 0</text>
<text x="380" y="212" fill="#c4554e" font-size="12" font-weight="600">→ FOREIGN   (e.g. base+97, mid-block)</text>
<circle cx="30" cy="234" r="9" fill="#f0e7fb"/><text x="30" y="238" text-anchor="middle" fill="#8a5cc0" font-size="11" font-weight="700">4</text>
<text x="48" y="238" fill="#2e2939" font-family="Menlo,monospace" font-size="11">i = offset / 32;  !(used &amp; (1u &lt;&lt; i))</text>
<text x="380" y="238" fill="#a9700f" font-size="12" font-weight="600">→ DOUBLE    (e.g. free B3 while used = 0x05)</text>
<circle cx="30" cy="260" r="9" fill="#f0e7fb"/><text x="30" y="264" text-anchor="middle" fill="#8a5cc0" font-size="11" font-weight="700">5</text>
<text x="48" y="264" fill="#2e2939" font-family="Menlo,monospace" font-size="11">used &amp;= ~bit;  b-&gt;next = head;  head = b</text>
<text x="380" y="264" fill="#2f8a5f" font-size="12" font-weight="600">→ OK, O(1)</text>
<text x="20" y="298" fill="#8a8297" font-size="11">used = 0x05 → bits 0 and 2 set (B0, B2 in use); compare addresses as uintptr_t, not as pointers</text>
</svg>
