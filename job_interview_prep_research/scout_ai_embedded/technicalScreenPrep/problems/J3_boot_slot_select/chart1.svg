<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 384" width="780" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
  <rect width="780" height="384" fill="#fff"/>
  <text x="16" y="24" fill="#2e2939" font-weight="700" font-size="13">Flash map — two 4096-byte slots (example from test 1, not to scale)</text>
  <!-- offsets -->
  <g fill="#8a8297" font-size="11">
    <text x="112" y="51">+0</text><text x="192" y="51">+4</text><text x="272" y="51">+8</text><text x="352" y="51">+12</text>
    <text x="432" y="51">+16</text><text x="522" y="51">+20</text><text x="612" y="51">+24</text><text x="692" y="51">+528</text>
  </g>
  <!-- slot A -->
  <text x="16" y="76" fill="#2e2939" font-weight="700" font-size="13">Slot A</text>
  <text x="16" y="93" fill="#8a8297" font-size="11">0x08004000</text>
  <g stroke="#8a5cc0" fill="#f0e7fb">
    <rect x="110" y="56" width="80" height="46"/><rect x="190" y="56" width="80" height="46"/>
    <rect x="270" y="56" width="80" height="46"/><rect x="350" y="56" width="80" height="46"/>
  </g>
  <g stroke="#2f8a5f" fill="#e2f4e9"><rect x="430" y="56" width="90" height="46"/><rect x="520" y="56" width="90" height="46"/></g>
  <rect x="610" y="56" width="80" height="46" fill="#fff" stroke="#b9b0c6"/>
  <rect x="690" y="56" width="76" height="46" fill="#fff" stroke="#b9b0c6" stroke-dasharray="4 3"/>
  <g text-anchor="middle" font-size="11">
    <g fill="#8a5cc0" font-weight="600"><text x="150" y="74">magic</text><text x="230" y="74">version</text><text x="310" y="74">image_size</text><text x="390" y="74">crc32</text></g>
    <g fill="#2e2939"><text x="150" y="92">0x544F4F42</text><text x="230" y="92">1</text><text x="310" y="92">512</text><text x="390" y="92">0x4AF3A0F3</text></g>
    <g fill="#2f8a5f" font-weight="600"><text x="475" y="74">word0: SP</text><text x="565" y="74">word1: Reset</text></g>
    <g fill="#2e2939"><text x="475" y="92">0x20020000</text><text x="565" y="92">0x08004051</text></g>
    <text x="650" y="83" fill="#8a8297">code / data</text><text x="728" y="83" fill="#8a8297">0xFF (erased)</text>
  </g>
  <!-- raw bytes -->
  <g text-anchor="middle" font-family="Menlo,monospace" font-size="10.5" fill="#5677c9">
    <text x="150" y="118">42 4F 4F 54</text><text x="230" y="118">01 00 00 00</text><text x="310" y="118">00 02 00 00</text>
    <text x="390" y="118">F3 A0 F3 4A</text><text x="475" y="118">00 00 02 20</text><text x="565" y="118">51 40 00 08</text>
  </g>
  <text x="16" y="118" fill="#5677c9" font-size="11">bytes (LE)</text>
  <!-- brackets -->
  <path d="M112,126 V132 H428 V126" fill="none" stroke="#8a5cc0"/>
  <text x="270" y="147" text-anchor="middle" fill="#8a5cc0" font-size="11">header 16 B (not covered by CRC)</text>
  <path d="M432,126 V132 H688 V126" fill="none" stroke="#2f8a5f"/>
  <text x="560" y="147" text-anchor="middle" fill="#2f8a5f" font-size="11">image 512 B = what crc32() covers · image_base = 0x08004010</text>
  <!-- slot B -->
  <text x="16" y="190" fill="#2e2939" font-weight="700" font-size="13">Slot B</text>
  <text x="16" y="207" fill="#8a8297" font-size="11">0x08024000</text>
  <g stroke="#8a5cc0" fill="#f0e7fb">
    <rect x="110" y="170" width="80" height="46"/><rect x="190" y="170" width="80" height="46"/>
    <rect x="270" y="170" width="80" height="46"/><rect x="350" y="170" width="80" height="46"/>
  </g>
  <g stroke="#2f8a5f" fill="#e2f4e9"><rect x="430" y="170" width="90" height="46"/><rect x="520" y="170" width="90" height="46"/></g>
  <rect x="610" y="170" width="80" height="46" fill="#fff" stroke="#b9b0c6"/>
  <rect x="690" y="170" width="76" height="46" fill="#fff" stroke="#b9b0c6" stroke-dasharray="4 3"/>
  <g text-anchor="middle" font-size="11">
    <g fill="#8a5cc0" font-weight="600"><text x="150" y="188">magic</text><text x="230" y="188">version</text><text x="310" y="188">image_size</text><text x="390" y="188">crc32</text></g>
    <g fill="#2e2939"><text x="150" y="206">0x544F4F42</text><text x="230" y="206" font-weight="700">2</text><text x="310" y="206">512</text><text x="390" y="206">0xB5EDD439</text></g>
    <g fill="#2f8a5f" font-weight="600"><text x="475" y="188">word0: SP</text><text x="565" y="188">word1: Reset</text></g>
    <g fill="#2e2939"><text x="475" y="206">0x20020000</text><text x="565" y="206">0x08024051</text></g>
    <text x="650" y="197" fill="#8a8297">code / data</text><text x="728" y="197" fill="#8a8297">0xFF (erased)</text>
  </g>
  <text x="110" y="236" fill="#8a8297" font-size="11">B is linked for its own address: reset must be in [0x08024010, 0x08024210); A's 0x08004051 here → BAD_VECTOR</text>
  <!-- checks box -->
  <rect x="16" y="252" width="750" height="120" rx="8" fill="#fcf0d6" stroke="#a9700f"/>
  <text x="30" y="274" fill="#a9700f" font-weight="700">image_check() on slot A, in order (first failure wins)</text>
  <g fill="#2e2939" font-size="11">
    <text x="30" y="296">1. magic: bytes 42 4F 4F 54 → rd32le = 0x544F4F42 ✓ (erased 0xFFFFFFFF or big-endian 0x424F4F54 → BAD_MAGIC)</text>
    <text x="30" y="316">2. size: 8 ≤ 512 ≤ 4096 − 16 = 4080 ✓ — check BEFORE reading the image, or CRC runs past the slot</text>
    <text x="30" y="336">3. crc32(slot + 16, 512) = 0x4AF3A0F3 = header ✓ (flip one bit at image[300] in B → 0xEBD66D8D ≠ 0xB5EDD439 → BAD_CRC)</text>
    <text x="30" y="356">4. SP 0x20020000 in [0x20000000, 0x20020000], 4-aligned ✓ · Reset bit0 = 1 ✓, 0x08004050 − 0x08004010 = 0x40 &lt; 512 ✓</text>
  </g>
</svg>
