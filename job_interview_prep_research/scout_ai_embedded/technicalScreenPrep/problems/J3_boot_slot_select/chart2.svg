<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" width="780" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6f6680"/></marker></defs>
  <rect width="780" height="350" fill="#fff"/>
  <!-- DFU -->
  <rect x="30" y="30" width="150" height="44" rx="10" fill="#fce5e2" stroke="#c4554e" stroke-width="2"/>
  <text x="105" y="50" text-anchor="middle" fill="#c4554e" font-weight="700" font-size="13">DFU</text>
  <text x="105" y="66" text-anchor="middle" fill="#c4554e" font-size="11">return -1, wait for host</text>
  <!-- NORMAL -->
  <rect x="30" y="130" width="170" height="70" rx="12" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="2"/>
  <text x="115" y="152" text-anchor="middle" fill="#2f8a5f" font-weight="700" font-size="13">NORMAL</text>
  <text x="115" y="170" text-anchor="middle" fill="#2f8a5f" font-size="11">pending = none</text>
  <text x="115" y="187" text-anchor="middle" fill="#2f8a5f" font-size="11">newest valid, tie → active</text>
  <!-- TRIAL -->
  <rect x="310" y="130" width="170" height="70" rx="12" fill="#fcf0d6" stroke="#a9700f" stroke-width="2"/>
  <text x="395" y="152" text-anchor="middle" fill="#a9700f" font-weight="700" font-size="13">TRIAL</text>
  <text x="395" y="170" text-anchor="middle" fill="#a9700f" font-size="11">pending = B</text>
  <text x="395" y="187" text-anchor="middle" fill="#a9700f" font-size="11">attempts++ then boot B</text>
  <!-- ROLLBACK -->
  <rect x="590" y="30" width="170" height="70" rx="12" fill="#fce5e2" stroke="#c4554e" stroke-width="2"/>
  <text x="675" y="52" text-anchor="middle" fill="#c4554e" font-weight="700" font-size="13">ROLLBACK</text>
  <text x="675" y="70" text-anchor="middle" fill="#c4554e" font-size="11">bad_mask |= 1 &lt;&lt; B</text>
  <text x="675" y="87" text-anchor="middle" fill="#c4554e" font-size="11">pending = none, attempts = 0</text>
  <!-- CONFIRMED -->
  <rect x="590" y="230" width="170" height="70" rx="12" fill="#f0e7fb" stroke="#8a5cc0" stroke-width="2"/>
  <text x="675" y="252" text-anchor="middle" fill="#8a5cc0" font-weight="700" font-size="13">CONFIRMED</text>
  <text x="675" y="270" text-anchor="middle" fill="#8a5cc0" font-size="11">active = B</text>
  <text x="675" y="287" text-anchor="middle" fill="#8a5cc0" font-size="11">pending = none, attempts = 0</text>
  <!-- arrows -->
  <path d="M200,158 H308" fill="none" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="255" y="135" text-anchor="middle" fill="#2e2939" font-weight="600" font-size="11">OTA written</text>
  <text x="255" y="149" text-anchor="middle" fill="#8a8297" font-size="11">pending = B</text>

  <path d="M370,200 C345,252 445,252 420,202" fill="none" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="395" y="264" text-anchor="middle" fill="#2e2939" font-weight="600" font-size="11">reset without confirm (crash / WDT)</text>
  <text x="395" y="279" text-anchor="middle" fill="#8a8297" font-size="11">attempts &lt; 3 → try B again</text>

  <path d="M480,145 L588,82" fill="none" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="468" y="102" width="132" height="16" fill="#fff"/>
  <text x="534" y="114" text-anchor="middle" fill="#c4554e" font-weight="600" font-size="11">attempts == 3 or B invalid</text>

  <path d="M480,185 L588,252" fill="none" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="490" y="210" width="90" height="16" fill="#fff"/>
  <text x="535" y="222" text-anchor="middle" fill="#8a5cc0" font-weight="600" font-size="11">boot_confirm()</text>

  <path d="M590,60 C450,60 260,90 172,128" fill="none" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="365" y="40" text-anchor="middle" fill="#2e2939" font-weight="600" font-size="11">fall back: boot A (B is never retried)</text>

  <path d="M590,272 C420,335 180,335 115,202" fill="none" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="300" y="338" text-anchor="middle" fill="#2e2939" font-weight="600" font-size="11">next reboot: B is active and newest → NORMAL boots B</text>

  <path d="M70,130 V76" fill="none" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="78" y="106" fill="#c4554e" font-weight="600" font-size="11">no valid slot</text>
</svg>
