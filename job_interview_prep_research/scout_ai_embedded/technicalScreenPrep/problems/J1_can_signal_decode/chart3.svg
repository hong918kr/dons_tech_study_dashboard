<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
<rect width="760" height="250" fill="#ffffff"/>
<text x="30" y="24" fill="#2e2939" font-weight="700" font-size="13">uint32 ms timer wraps: last = 0xFFFFFF00, timeout = 500</text>
<line x1="70.0" y1="130" x2="703.6" y2="130" stroke="#b9b0c6" stroke-width="1.5"/>
<rect x="98.8" y="108" width="360.0" height="22" fill="#e2f4e9"/>
<text x="371.0" y="123" text-anchor="middle" fill="#2f8a5f" font-size="11">alive: now − last ≤ 500</text>
<rect x="458.8" y="108" width="244.8" height="22" fill="#fce5e2"/>
<text x="581.2" y="123" text-anchor="middle" fill="#c4554e" font-size="11">timed out</text>
<line x1="283.1" y1="90" x2="283.1" y2="142" stroke="#a9700f" stroke-width="2"/>
<text x="283.1" y="84" text-anchor="middle" fill="#a9700f" font-weight="600" font-size="11">wrap: 0xFFFFFFFF → 0x00000000</text>
<circle cx="98.8" cy="130" r="5" fill="#2e2939" stroke="#fff" stroke-width="1.5"/>
<text x="98.8" y="154" text-anchor="middle" fill="#2e2939" font-weight="600" font-size="11">last</text>
<text x="98.8" y="169" text-anchor="middle" fill="#8a8297" font-size="11">0xFFFFFF00</text>
<circle cx="191.0" cy="130" r="5" fill="#5677c9" stroke="#fff" stroke-width="1.5"/>
<text x="191.0" y="154" text-anchor="middle" fill="#5677c9" font-weight="600" font-size="11">now</text>
<text x="191.0" y="169" text-anchor="middle" fill="#8a8297" font-size="11">0xFFFFFF80</text>
<text x="191.0" y="184" text-anchor="middle" fill="#5677c9" font-size="11">now − last = 128 → 0x00</text>
<circle cx="355.1" cy="130" r="5" fill="#5677c9" stroke="#fff" stroke-width="1.5"/>
<text x="355.1" y="154" text-anchor="middle" fill="#5677c9" font-weight="600" font-size="11">now</text>
<text x="355.1" y="169" text-anchor="middle" fill="#8a8297" font-size="11">0x00000064</text>
<text x="355.1" y="184" text-anchor="middle" fill="#5677c9" font-size="11">now − last = 356 → 0x00</text>
<circle cx="651.8" cy="130" r="5" fill="#c4554e" stroke="#fff" stroke-width="1.5"/>
<text x="651.8" y="154" text-anchor="middle" fill="#c4554e" font-weight="600" font-size="11">now</text>
<text x="651.8" y="169" text-anchor="middle" fill="#8a8297" font-size="11">0x00000200</text>
<text x="651.8" y="184" text-anchor="middle" fill="#c4554e" font-size="11">now − last = 768 → 0x10</text>
<text x="30" y="225" fill="#c4554e" font-size="11">✗ naive: deadline = last + 500 = 0x000000F4 (wrapped) → now 0xFFFFFF80 &gt; 0xF4 → false "timeout" at only 128 ms</text>
<text x="30" y="242" fill="#2f8a5f" font-size="11">✓ wrap-safe: (uint32_t)(now − last) &gt; timeout — the subtraction wraps back to the true elapsed time</text>
</svg>
