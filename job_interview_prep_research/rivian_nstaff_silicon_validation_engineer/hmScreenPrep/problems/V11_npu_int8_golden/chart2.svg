<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
<rect width="860" height="380" fill="#ffffff"/>
<text x="20" y="20" font-size="14" font-weight="700" fill="#2e2939">Quantized GEMM data path: int8 × int8 → int32 → requant → int8</text>
<rect x="20" y="46" width="120" height="78" rx="8" fill="#f0e7fb" stroke="#8a5cc0" stroke-width="1.5"/>
<text x="80.0" y="68" text-anchor="middle" font-weight="700" fill="#8a5cc0" font-size="12">A − a_zp, B</text>
<text x="80.0" y="88" text-anchor="middle" fill="#2e2939" font-size="12">int8 → int9</text>
<text x="80.0" y="108" text-anchor="middle" fill="#8a8297" font-size="10">[−255, 255] × [−128, 127]</text>
<path d="M142 85.0 H155" stroke="#b9b0c6" stroke-width="1.6"/><path d="M156 85.0 l-6 -4 v8 z" fill="#b9b0c6"/>
<rect x="158" y="46" width="120" height="78" rx="8" fill="#f0e7fb" stroke="#8a5cc0" stroke-width="1.5"/>
<text x="218.0" y="68" text-anchor="middle" font-weight="700" fill="#8a5cc0" font-size="12">multiply</text>
<text x="218.0" y="88" text-anchor="middle" fill="#2e2939" font-size="12">int17 product</text>
<text x="218.0" y="108" text-anchor="middle" fill="#8a8297" font-size="10">|p| ≤ 32 640</text>
<path d="M280 85.0 H293" stroke="#b9b0c6" stroke-width="1.6"/><path d="M294 85.0 l-6 -4 v8 z" fill="#b9b0c6"/>
<rect x="296" y="46" width="120" height="78" rx="8" fill="#eef2fb" stroke="#5677c9" stroke-width="1.5"/>
<text x="356.0" y="68" text-anchor="middle" font-weight="700" fill="#5677c9" font-size="12">Σk + bias[n]</text>
<text x="356.0" y="88" text-anchor="middle" fill="#2e2939" font-size="12">int32 acc</text>
<text x="356.0" y="108" text-anchor="middle" fill="#8a8297" font-size="10">17 + log2(K=32) = 22 b</text>
<path d="M418 85.0 H431" stroke="#b9b0c6" stroke-width="1.6"/><path d="M432 85.0 l-6 -4 v8 z" fill="#b9b0c6"/>
<rect x="434" y="46" width="120" height="78" rx="8" fill="#fcf0d6" stroke="#a9700f" stroke-width="1.5"/>
<text x="494.0" y="68" text-anchor="middle" font-weight="700" fill="#a9700f" font-size="12">SRDHM(acc, mult)</text>
<text x="494.0" y="88" text-anchor="middle" fill="#2e2939" font-size="12">× mult / 2^31</text>
<text x="494.0" y="108" text-anchor="middle" fill="#8a8297" font-size="10">rounded high mul</text>
<path d="M556 85.0 H569" stroke="#b9b0c6" stroke-width="1.6"/><path d="M570 85.0 l-6 -4 v8 z" fill="#b9b0c6"/>
<rect x="572" y="46" width="120" height="78" rx="8" fill="#fcf0d6" stroke="#a9700f" stroke-width="1.5"/>
<text x="632.0" y="68" text-anchor="middle" font-weight="700" fill="#a9700f" font-size="12">RDBPOT(·, shift)</text>
<text x="632.0" y="88" text-anchor="middle" fill="#2e2939" font-size="12">÷ 2^shift</text>
<text x="632.0" y="108" text-anchor="middle" fill="#8a8297" font-size="10">rounded shift</text>
<path d="M694 85.0 H707" stroke="#b9b0c6" stroke-width="1.6"/><path d="M708 85.0 l-6 -4 v8 z" fill="#b9b0c6"/>
<rect x="710" y="46" width="120" height="78" rx="8" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="1.5"/>
<text x="770.0" y="68" text-anchor="middle" font-weight="700" fill="#2f8a5f" font-size="12">+ out_zp, clamp</text>
<text x="770.0" y="88" text-anchor="middle" fill="#2e2939" font-size="12">int8 C</text>
<text x="770.0" y="108" text-anchor="middle" fill="#8a8297" font-size="10">[act_min, 127]</text>
<circle cx="30" cy="36" r="7" fill="#ffffff" stroke="#8a8297"/><text x="30" y="39.5" text-anchor="middle" fill="#8a8297" font-size="9" font-weight="700">1</text>
<circle cx="168" cy="36" r="7" fill="#ffffff" stroke="#8a8297"/><text x="168" y="39.5" text-anchor="middle" fill="#8a8297" font-size="9" font-weight="700">2</text>
<circle cx="306" cy="36" r="7" fill="#ffffff" stroke="#8a8297"/><text x="306" y="39.5" text-anchor="middle" fill="#8a8297" font-size="9" font-weight="700">3</text>
<circle cx="444" cy="36" r="7" fill="#ffffff" stroke="#8a8297"/><text x="444" y="39.5" text-anchor="middle" fill="#8a8297" font-size="9" font-weight="700">4</text>
<circle cx="582" cy="36" r="7" fill="#ffffff" stroke="#8a8297"/><text x="582" y="39.5" text-anchor="middle" fill="#8a8297" font-size="9" font-weight="700">5</text>
<circle cx="720" cy="36" r="7" fill="#ffffff" stroke="#8a8297"/><text x="720" y="39.5" text-anchor="middle" fill="#8a8297" font-size="9" font-weight="700">6</text>
<text x="20" y="160" font-size="13" font-weight="700" fill="#2e2939">Worked element (test 2): C[0][0], a_zp = 1, scale = 0.5 · 2^−1 = 0.25, out_zp = −1</text>
<rect x="20" y="172" width="120" height="34" rx="6" fill="#ffffff" stroke="#b9b0c6"/>
<text x="80.0" y="194" text-anchor="middle" fill="#4b4459" font-size="11">(10, 20, 30)·(1, 2, 3)</text>
<rect x="158" y="172" width="120" height="34" rx="6" fill="#ffffff" stroke="#b9b0c6"/>
<text x="218.0" y="194" text-anchor="middle" fill="#4b4459" font-size="11">10 + 40 + 90</text>
<rect x="296" y="172" width="120" height="34" rx="6" fill="#ffffff" stroke="#b9b0c6"/>
<text x="356.0" y="194" text-anchor="middle" fill="#4b4459" font-size="11">140 + 10 = 150</text>
<rect x="434" y="172" width="120" height="34" rx="6" fill="#ffffff" stroke="#b9b0c6"/>
<text x="494.0" y="194" text-anchor="middle" fill="#4b4459" font-size="11">150·0.5 = 75</text>
<rect x="572" y="172" width="120" height="34" rx="6" fill="#ffffff" stroke="#b9b0c6"/>
<text x="632.0" y="194" text-anchor="middle" fill="#4b4459" font-size="11">75 / 2 = 37.5 → 38</text>
<rect x="710" y="172" width="120" height="34" rx="6" fill="#ffffff" stroke="#b9b0c6"/>
<text x="770.0" y="194" text-anchor="middle" fill="#4b4459" font-size="11">38 − 1 = 37</text>
<text x="20" y="242" font-size="13" font-weight="700" fill="#2e2939">Where each injected NPU bug lives (test 5, M=6 K=32 N=12)</text>
<rect x="236" y="256" width="130" height="84" rx="8" fill="#fce5e2" stroke="#c4554e" stroke-width="1.2"/>
<text x="301" y="274" text-anchor="middle" font-weight="700" fill="#c4554e" font-size="11">BUG_ACC16</text>
<text x="301" y="292" text-anchor="middle" fill="#4b4459" font-size="10">stage 3: wrap at 16 b</text>
<text x="301" y="308" text-anchor="middle" fill="#4b4459" font-size="10">27 bad: |acc| &gt; 32767</text>
<text x="301" y="324" text-anchor="middle" fill="#4b4459" font-size="10">max |d| 86</text>
<rect x="376" y="256" width="130" height="84" rx="8" fill="#fce5e2" stroke="#c4554e" stroke-width="1.2"/>
<text x="441" y="274" text-anchor="middle" font-weight="700" fill="#c4554e" font-size="11">BUG_NO_BIAS_CH</text>
<text x="441" y="292" text-anchor="middle" fill="#4b4459" font-size="10">stage 3: bias[5] dropped</text>
<text x="441" y="308" text-anchor="middle" fill="#4b4459" font-size="10">6 bad, all in col 5</text>
<text x="441" y="324" text-anchor="middle" fill="#4b4459" font-size="10">max |d| 3</text>
<rect x="514" y="256" width="130" height="84" rx="8" fill="#fce5e2" stroke="#c4554e" stroke-width="1.2"/>
<text x="579" y="274" text-anchor="middle" font-weight="700" fill="#c4554e" font-size="11">BUG_TRUNC_ROUND</text>
<text x="579" y="292" text-anchor="middle" fill="#4b4459" font-size="10">stage 4+5: floor</text>
<text x="579" y="308" text-anchor="middle" fill="#4b4459" font-size="10">37 bad, |d| = 1 only</text>
<text x="579" y="324" text-anchor="middle" fill="#4b4459" font-size="10">passes TOL1</text>
<rect x="710" y="256" width="130" height="84" rx="8" fill="#fce5e2" stroke="#c4554e" stroke-width="1.2"/>
<text x="775" y="274" text-anchor="middle" font-weight="700" fill="#c4554e" font-size="11">BUG_TILE_EDGE</text>
<text x="775" y="292" text-anchor="middle" fill="#4b4459" font-size="10">loop: last tile k&lt;K−1</text>
<text x="775" y="308" text-anchor="middle" fill="#4b4459" font-size="10">16 bad, cols 8–11</text>
<text x="775" y="324" text-anchor="middle" fill="#4b4459" font-size="10">first (0, 8)</text>
<text x="430" y="368" text-anchor="middle" fill="#8a8297" font-size="11">bit-exact (CMP_BITEXACT) catches all four; CMP_TOL1 would let BUG_TRUNC_ROUND through</text>
</svg>
