<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
<rect width="820" height="300" fill="#ffffff"/>
<text x="40.0" y="24.0" text-anchor="start" fill="#2e2939" font-weight="700">What one 64-byte frame costs on the wire (PRE = preamble; 8 px = 1 byte)</text>
<rect x="60" y="70" width="56" height="40" fill="#f0e7fb" stroke="#8a5cc0" stroke-width="1.3"/>
<text x="88.0" y="95.0" text-anchor="middle" fill="#8a5cc0" font-size="11" font-weight="600">PRE 7</text>
<rect x="116" y="70" width="8" height="40" fill="#f0e7fb" stroke="#8a5cc0" stroke-width="1.3"/>
<line x1="120" y1="70" x2="120" y2="58" stroke="#8a5cc0"/>
<text x="120.0" y="54.0" text-anchor="middle" fill="#8a5cc0" font-size="11" font-weight="600">SFD 1</text>
<rect x="124" y="70" width="512" height="40" fill="#e3e9f7" stroke="#5677c9" stroke-width="1.3"/>
<text x="380.0" y="95.0" text-anchor="middle" fill="#5677c9" font-size="12" font-weight="600">frame 64 B: DA 6 · SA 6 · type 2 · payload 46 · FCS 4</text>
<rect x="636" y="70" width="96" height="40" fill="#fcf0d6" stroke="#a9700f" stroke-width="1.3"/>
<text x="684.0" y="95.0" text-anchor="middle" fill="#a9700f" font-size="11" font-weight="600">IFG 12</text>
<line x1="60" y1="124" x2="732" y2="124" stroke="#2e2939" stroke-width="1"/>
<line x1="60" y1="119" x2="60" y2="129" stroke="#2e2939"/><line x1="732" y1="119" x2="732" y2="129" stroke="#2e2939"/>
<text x="396.0" y="142.0" text-anchor="middle" fill="#2e2939" font-size="12" font-weight="600">84 B = 672 bit per frame slot → at 10 Gb/s one slot = 67.2 ns</text>
<text x="396.0" y="160.0" text-anchor="middle" fill="#5677c9" font-size="12" font-weight="600">10,000,000,000 / 672 = 14,880,952.4 → 14,880,952 fps (floor)</text>
<text x="60.0" y="215.0" text-anchor="start" fill="#2e2939" font-size="12" font-weight="600">64 B</text>
<rect x="120" y="200" width="426.7" height="20" fill="#e3e9f7" stroke="#5677c9"/>
<rect x="546.7" y="200" width="133.3" height="20" fill="#fcf0d6" stroke="#a9700f"/>
<text x="126.0" y="214.0" text-anchor="start" fill="#5677c9" font-size="11" font-weight="600">frame 64 / 84 = 76.2 % of the wire</text>
<text x="688.0" y="214.0" text-anchor="start" fill="#a9700f" font-size="11" font-weight="600">overhead 20 B</text>
<text x="60.0" y="249.0" text-anchor="start" fill="#2e2939" font-size="12" font-weight="600">1518 B</text>
<rect x="120" y="234" width="552.7" height="20" fill="#e3e9f7" stroke="#5677c9"/>
<rect x="672.7" y="234" width="7.3" height="20" fill="#fcf0d6" stroke="#a9700f"/>
<text x="126.0" y="248.0" text-anchor="start" fill="#5677c9" font-size="11" font-weight="600">frame 1518 / 1538 = 98.7 % of the wire</text>
<text x="688.0" y="248.0" text-anchor="start" fill="#a9700f" font-size="11" font-weight="600">overhead 20 B</text>
<text x="60.0" y="290.0" text-anchor="start" fill="#8a8297" font-size="11">L2 bit rate at line rate: 64 B → 7.62 Gb/s of frames, 1518 B → 9.87 Gb/s. Leave out the 20 B and you over-promise by up to 31 %.</text>
</svg>
