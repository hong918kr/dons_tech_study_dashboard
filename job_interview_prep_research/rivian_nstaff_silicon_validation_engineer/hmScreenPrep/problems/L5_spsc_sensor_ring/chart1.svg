<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6f6680"/></marker></defs>
<rect width="760" height="340" fill="#ffffff"/>
<text x="30" y="24" fill="#2e2939" font-weight="700">cap = 8 · start 0xFFFFFFFE · after 5 pushes (seq 0..4)</text>
<text x="730" y="24" text-anchor="end" fill="#8a8297">used = 5 · free = 3</text>
<rect x="62" y="100" width="76" height="62" rx="6" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="1.6"/>
<text x="100" y="116" text-anchor="middle" fill="#8a8297" font-size="11">slot 0</text>
<text x="100" y="135" text-anchor="middle" fill="#2f8a5f" font-weight="700">seq 2</text>
<text x="100" y="153" text-anchor="middle" fill="#2e2939" font-size="11">0x00000000</text>
<rect x="142" y="100" width="76" height="62" rx="6" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="1.6"/>
<text x="180" y="116" text-anchor="middle" fill="#8a8297" font-size="11">slot 1</text>
<text x="180" y="135" text-anchor="middle" fill="#2f8a5f" font-weight="700">seq 3</text>
<text x="180" y="153" text-anchor="middle" fill="#2e2939" font-size="11">0x00000001</text>
<rect x="222" y="100" width="76" height="62" rx="6" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="1.6"/>
<text x="260" y="116" text-anchor="middle" fill="#8a8297" font-size="11">slot 2</text>
<text x="260" y="135" text-anchor="middle" fill="#2f8a5f" font-weight="700">seq 4</text>
<text x="260" y="153" text-anchor="middle" fill="#2e2939" font-size="11">0x00000002</text>
<rect x="302" y="100" width="76" height="62" rx="6" fill="#ffffff" stroke="#b9b0c6" stroke-width="1.6"/>
<text x="340" y="116" text-anchor="middle" fill="#8a8297" font-size="11">slot 3</text>
<text x="340" y="135" text-anchor="middle" fill="#b9b0c6" font-weight="700">free</text>
<rect x="382" y="100" width="76" height="62" rx="6" fill="#ffffff" stroke="#b9b0c6" stroke-width="1.6"/>
<text x="420" y="116" text-anchor="middle" fill="#8a8297" font-size="11">slot 4</text>
<text x="420" y="135" text-anchor="middle" fill="#b9b0c6" font-weight="700">free</text>
<rect x="462" y="100" width="76" height="62" rx="6" fill="#ffffff" stroke="#b9b0c6" stroke-width="1.6"/>
<text x="500" y="116" text-anchor="middle" fill="#8a8297" font-size="11">slot 5</text>
<text x="500" y="135" text-anchor="middle" fill="#b9b0c6" font-weight="700">free</text>
<rect x="542" y="100" width="76" height="62" rx="6" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="1.6"/>
<text x="580" y="116" text-anchor="middle" fill="#8a8297" font-size="11">slot 6</text>
<text x="580" y="135" text-anchor="middle" fill="#2f8a5f" font-weight="700">seq 0</text>
<text x="580" y="153" text-anchor="middle" fill="#2e2939" font-size="11">0xFFFFFFFE</text>
<rect x="622" y="100" width="76" height="62" rx="6" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="1.6"/>
<text x="660" y="116" text-anchor="middle" fill="#8a8297" font-size="11">slot 7</text>
<text x="660" y="135" text-anchor="middle" fill="#2f8a5f" font-weight="700">seq 1</text>
<text x="660" y="153" text-anchor="middle" fill="#2e2939" font-size="11">0xFFFFFFFF</text>
<text x="340" y="62" text-anchor="middle" fill="#5677c9" font-weight="700">head = 3 → slot 3</text>
<path d="M340,68 V97" stroke="#5677c9" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="580" y="62" text-anchor="middle" fill="#2f8a5f" font-weight="700">tail = 0xFFFFFFFE → slot 6</text>
<path d="M580,68 V97" stroke="#2f8a5f" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="340" y="182" text-anchor="middle" fill="#8a8297" font-size="11">ring_push() writes here (producer)</text>
<text x="580" y="182" text-anchor="middle" fill="#8a8297" font-size="11">ring_pop_batch() reads here (consumer)</text>
<path d="M702,131 H732 V198 H30 V131 H58" fill="none" stroke="#b9b0c6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="380" y="216" text-anchor="middle" fill="#8a8297">wrap: slot = idx &amp; 7 · idx 0xFFFFFFFF → 0x00000000 is just slot 7 → slot 0</text>
<text x="30" y="246" fill="#2e2939" font-weight="700">used = head − tail = 0x00000003 − 0xFFFFFFFE = 5   (uint32_t, mod 2^32)</text>
<text x="30" y="266" fill="#2e2939">empty: used == 0 · full: used == cap · no "keep one slot empty" trick needed</text>
<text x="30" y="290" fill="#c4554e">✗ if (head &gt;= tail) used = head − tail; else …  → here head (3) &lt; tail, the special case is wrong</text>
<text x="30" y="308" fill="#c4554e">✗ cap = 6 with idx % 6 → 2^32 is not a multiple of 6, so the slot jumps when idx wraps</text>
<rect x="200" y="320" width="14" height="14" rx="3" fill="#e2f4e9" stroke="#2f8a5f"/>
<text x="220" y="331" fill="#2e2939" font-size="11">written + published, not popped yet</text>
<rect x="450" y="320" width="14" height="14" rx="3" fill="#ffffff" stroke="#b9b0c6"/>
<text x="470" y="331" fill="#2e2939" font-size="11">free (producer may write)</text>
</svg>
