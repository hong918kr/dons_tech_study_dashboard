<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
<defs><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2f8a5f"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#b9b0c6"/></marker></defs>
<rect width="900" height="350" fill="#ffffff"/>
<path d="M620,20 H870" stroke="#b9b0c6" stroke-width="1.5" marker-end="url(#am)"/>
<text x="612" y="24" text-anchor="end" fill="#8a8297" font-size="11">time</text>
<text x="20" y="50" fill="#5677c9" font-weight="700">Producer (capture / ISR)</text>
<text x="20" y="200" fill="#8a5cc0" font-weight="700">Consumer (logger)</text>
<rect x="20" y="60" width="150" height="46" rx="7" fill="#ffffff" stroke="#5677c9" stroke-width="1.5"/>
<text x="95.0" y="79" text-anchor="middle" fill="#2e2939" font-weight="600">① load tail</text>
<text x="95.0" y="95" text-anchor="middle" fill="#8a8297" font-size="11">acquire · is there room?</text>
<rect x="180" y="60" width="170" height="46" rx="7" fill="#ffffff" stroke="#5677c9" stroke-width="1.5"/>
<text x="265.0" y="79" text-anchor="middle" fill="#2e2939" font-weight="600">② buf[h &amp; mask] = *rec</text>
<text x="265.0" y="95" text-anchor="middle" fill="#8a8297" font-size="11">64-byte record (plain stores)</text>
<rect x="360" y="60" width="160" height="46" rx="7" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="1.5"/>
<text x="440.0" y="79" text-anchor="middle" fill="#2e2939" font-weight="600">③ store head = h+1</text>
<text x="440.0" y="95" text-anchor="middle" fill="#8a8297" font-size="11">release · publish</text>
<rect x="740" y="60" width="140" height="46" rx="7" fill="#ffffff" stroke="#5677c9" stroke-width="1.5"/>
<text x="810.0" y="79" text-anchor="middle" fill="#2e2939" font-weight="600">⑦ next push: load tail</text>
<text x="810.0" y="95" text-anchor="middle" fill="#8a8297" font-size="11">acquire · reuse slot?</text>
<text x="630" y="88" text-anchor="middle" fill="#8a8297" font-size="11">… more pushes …</text>
<rect x="420" y="210" width="150" height="46" rx="7" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="1.5"/>
<text x="495.0" y="229" text-anchor="middle" fill="#2e2939" font-weight="600">④ load head</text>
<text x="495.0" y="245" text-anchor="middle" fill="#8a8297" font-size="11">acquire · sees h+1</text>
<rect x="580" y="210" width="140" height="46" rx="7" fill="#ffffff" stroke="#8a5cc0" stroke-width="1.5"/>
<text x="650.0" y="229" text-anchor="middle" fill="#2e2939" font-weight="600">⑤ out[i] = buf[…]</text>
<text x="650.0" y="245" text-anchor="middle" fill="#8a8297" font-size="11">copy the batch</text>
<rect x="730" y="210" width="150" height="46" rx="7" fill="#f0e7fb" stroke="#8a5cc0" stroke-width="1.5"/>
<text x="805.0" y="229" text-anchor="middle" fill="#2e2939" font-weight="600">⑥ store tail = t+n</text>
<text x="805.0" y="245" text-anchor="middle" fill="#8a8297" font-size="11">release · free slots</text>
<path d="M440,106 L490,208" stroke="#2f8a5f" stroke-width="1.8" marker-end="url(#ag)"/>
<text x="478" y="140" fill="#2f8a5f" font-weight="700">synchronizes-with</text>
<text x="478" y="156" fill="#2f8a5f" font-size="11">② is visible after ④</text>
<path d="M805,210 L810,108" stroke="#2f8a5f" stroke-width="1.8" marker-end="url(#ag)"/>
<text x="796" y="150" text-anchor="end" fill="#2f8a5f" font-weight="700">synchronizes-with</text>
<text x="796" y="166" text-anchor="end" fill="#2f8a5f" font-size="11">⑤ reads done before ⑦ overwrites</text>
<rect x="20" y="276" width="860" height="62" rx="8" fill="#fce5e2" stroke="#c4554e" stroke-width="1.4"/>
<text x="34" y="296" fill="#c4554e" font-weight="700">relaxed instead of ③ release / ④ acquire, on Arm: ③ can become visible before ②, or ⑤ can read ahead of ④ → stale record</text>
<text x="34" y="314" fill="#2e2939" font-size="11">On an arm64 M-series Mac the relaxed-head variant fails test 6 (bad records, checksum mismatch). x86 (TSO) keeps store→store and</text>
<text x="34" y="329" fill="#2e2939" font-size="11">load→load order, so the same bug usually passes there — the compiler may still reorder it. volatile adds no barrier either.</text>
</svg>
