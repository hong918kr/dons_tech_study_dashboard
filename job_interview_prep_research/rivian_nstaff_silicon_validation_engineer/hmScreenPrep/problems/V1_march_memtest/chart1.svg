<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 256" width="720" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#8a8297"/></marker></defs>
  <rect width="720" height="256" fill="#ffffff"/>
  <!-- element labels -->
  <g text-anchor="middle" font-weight="700" fill="#2e2939">
    <text x="75" y="34">M0</text><text x="189" y="34">M1</text><text x="303" y="34">M2</text>
    <text x="417" y="34">M3</text><text x="531" y="34">M4</text><text x="645" y="34">M5</text>
  </g>
  <!-- boxes: either-order violet, up blue, down amber -->
  <rect x="25"  y="44" width="100" height="70" rx="10" fill="#f0e7fb" stroke="#8a5cc0" stroke-width="1.6"/>
  <rect x="139" y="44" width="100" height="70" rx="10" fill="#e8eefa" stroke="#5677c9" stroke-width="1.6"/>
  <rect x="253" y="44" width="100" height="70" rx="10" fill="#e8eefa" stroke="#5677c9" stroke-width="1.6"/>
  <rect x="367" y="44" width="100" height="70" rx="10" fill="#fcf0d6" stroke="#a9700f" stroke-width="1.6"/>
  <rect x="481" y="44" width="100" height="70" rx="10" fill="#fcf0d6" stroke="#a9700f" stroke-width="1.6"/>
  <rect x="595" y="44" width="100" height="70" rx="10" fill="#f0e7fb" stroke="#8a5cc0" stroke-width="1.6"/>
  <g text-anchor="middle" font-size="22" font-weight="700">
    <text x="75"  y="76" fill="#8a5cc0">⇕</text><text x="189" y="76" fill="#5677c9">⇑</text>
    <text x="303" y="76" fill="#5677c9">⇑</text><text x="417" y="76" fill="#a9700f">⇓</text>
    <text x="531" y="76" fill="#a9700f">⇓</text><text x="645" y="76" fill="#8a5cc0">⇕</text>
  </g>
  <g text-anchor="middle" font-size="13" fill="#2e2939" font-family="Menlo,monospace">
    <text x="75" y="102">(w0)</text><text x="189" y="102">(r0,w1)</text><text x="303" y="102">(r1,w0)</text>
    <text x="417" y="102">(r0,w1)</text><text x="531" y="102">(r1,w0)</text><text x="645" y="102">(r0)</text>
  </g>
  <!-- arrows between elements -->
  <g stroke="#8a8297" stroke-width="1.4" marker-end="url(#ar)">
    <line x1="126" y1="79" x2="138" y2="79"/><line x1="240" y1="79" x2="252" y2="79"/>
    <line x1="354" y1="79" x2="366" y2="79"/><line x1="468" y1="79" x2="480" y2="79"/>
    <line x1="582" y1="79" x2="594" y2="79"/>
  </g>
  <!-- background after each element -->
  <text x="20" y="144" fill="#8a8297" font-size="11" text-anchor="start">after:</text>
  <rect x="45"  y="128" width="60" height="22" rx="6" fill="#e2f4e9"/><text x="75"  y="143" text-anchor="middle" fill="#2f8a5f" font-weight="600">all 0</text>
  <rect x="159" y="128" width="60" height="22" rx="6" fill="#f0e7fb"/><text x="189" y="143" text-anchor="middle" fill="#8a5cc0" font-weight="600">all 1</text>
  <rect x="273" y="128" width="60" height="22" rx="6" fill="#e2f4e9"/><text x="303" y="143" text-anchor="middle" fill="#2f8a5f" font-weight="600">all 0</text>
  <rect x="387" y="128" width="60" height="22" rx="6" fill="#f0e7fb"/><text x="417" y="143" text-anchor="middle" fill="#8a5cc0" font-weight="600">all 1</text>
  <rect x="501" y="128" width="60" height="22" rx="6" fill="#e2f4e9"/><text x="531" y="143" text-anchor="middle" fill="#2f8a5f" font-weight="600">all 0</text>
  <rect x="615" y="128" width="60" height="22" rx="6" fill="#e2f4e9"/><text x="645" y="143" text-anchor="middle" fill="#2f8a5f" font-weight="600">all 0</text>
  <!-- access counts -->
  <g text-anchor="middle" fill="#8a8297" font-family="Menlo,monospace">
    <text x="75" y="174">N</text><text x="189" y="174">2N</text><text x="303" y="174">2N</text>
    <text x="417" y="174">2N</text><text x="531" y="174">2N</text><text x="645" y="174">N</text>
  </g>
  <!-- faults caught in the tests -->
  <g text-anchor="middle" font-size="11">
    <text x="189" y="196" fill="#c4554e">SA1 · CF(A&lt;V)</text>
    <text x="189" y="210" fill="#c4554e">addr alias</text>
    <text x="303" y="196" fill="#c4554e">SA0 · CF(A&gt;V)</text>
  </g>
  <text x="360" y="242" text-anchor="middle" fill="#2e2939" font-weight="600">total = N + 4×2N + N = 10N accesses  (5N reads · 5N writes)</text>
</svg>
