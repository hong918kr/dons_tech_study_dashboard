<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
  <rect width="720" height="290" fill="#ffffff"/>
  <!-- address bus bits -->
  <g font-family="Menlo,monospace" font-size="12" text-anchor="middle">
    <rect x="200" y="12" width="36" height="26" rx="5" fill="#ffffff" stroke="#b9b0c6"/><text x="218" y="30" fill="#2e2939">A7</text>
    <rect x="240" y="12" width="36" height="26" rx="5" fill="#ffffff" stroke="#b9b0c6"/><text x="258" y="30" fill="#2e2939">A6</text>
    <rect x="280" y="12" width="36" height="26" rx="5" fill="#ffffff" stroke="#b9b0c6"/><text x="298" y="30" fill="#2e2939">A5</text>
    <rect x="320" y="12" width="36" height="26" rx="5" fill="#ffffff" stroke="#b9b0c6"/><text x="338" y="30" fill="#2e2939">A4</text>
    <rect x="360" y="12" width="36" height="26" rx="5" fill="#fce5e2" stroke="#c4554e" stroke-width="2"/><text x="378" y="30" fill="#c4554e" font-weight="700">A3</text>
    <rect x="400" y="12" width="36" height="26" rx="5" fill="#ffffff" stroke="#b9b0c6"/><text x="418" y="30" fill="#2e2939">A2</text>
    <rect x="440" y="12" width="36" height="26" rx="5" fill="#ffffff" stroke="#b9b0c6"/><text x="458" y="30" fill="#2e2939">A1</text>
    <rect x="480" y="12" width="36" height="26" rx="5" fill="#ffffff" stroke="#b9b0c6"/><text x="498" y="30" fill="#2e2939">A0</text>
  </g>
  <text x="440" y="58" text-anchor="middle" fill="#c4554e" font-weight="600">A3 shorted to GND → phys = addr &amp; ~0x08</text>
  <!-- logical row -->
  <text x="40" y="72" fill="#8a8297">logical (CPU) address</text>
  <g font-family="Menlo,monospace" font-size="11" text-anchor="middle">
    <rect x="40"  y="80" width="36" height="26" rx="4" fill="#e8eefa" stroke="#5677c9"/><text x="58"  y="97" fill="#2e2939">0</text>
    <rect x="80"  y="80" width="36" height="26" rx="4" fill="#e8eefa" stroke="#5677c9"/><text x="98"  y="97" fill="#2e2939">1</text>
    <rect x="120" y="80" width="36" height="26" rx="4" fill="#e8eefa" stroke="#5677c9"/><text x="138" y="97" fill="#2e2939">2</text>
    <rect x="160" y="80" width="36" height="26" rx="4" fill="#e8eefa" stroke="#5677c9"/><text x="178" y="97" fill="#2e2939">3</text>
    <rect x="200" y="80" width="36" height="26" rx="4" fill="#e8eefa" stroke="#5677c9"/><text x="218" y="97" fill="#2e2939">4</text>
    <rect x="240" y="80" width="36" height="26" rx="4" fill="#e8eefa" stroke="#5677c9"/><text x="258" y="97" fill="#2e2939">5</text>
    <rect x="280" y="80" width="36" height="26" rx="4" fill="#e8eefa" stroke="#5677c9"/><text x="298" y="97" fill="#2e2939">6</text>
    <rect x="320" y="80" width="36" height="26" rx="4" fill="#e8eefa" stroke="#5677c9"/><text x="338" y="97" fill="#2e2939">7</text>
    <rect x="360" y="80" width="36" height="26" rx="4" fill="#fce5e2" stroke="#c4554e"/><text x="378" y="97" fill="#c4554e">8</text>
    <rect x="400" y="80" width="36" height="26" rx="4" fill="#fce5e2" stroke="#c4554e"/><text x="418" y="97" fill="#c4554e">9</text>
    <rect x="440" y="80" width="36" height="26" rx="4" fill="#fce5e2" stroke="#c4554e"/><text x="458" y="97" fill="#c4554e">10</text>
    <rect x="480" y="80" width="36" height="26" rx="4" fill="#fce5e2" stroke="#c4554e"/><text x="498" y="97" fill="#c4554e">11</text>
    <rect x="520" y="80" width="36" height="26" rx="4" fill="#fce5e2" stroke="#c4554e"/><text x="538" y="97" fill="#c4554e">12</text>
    <rect x="560" y="80" width="36" height="26" rx="4" fill="#fce5e2" stroke="#c4554e"/><text x="578" y="97" fill="#c4554e">13</text>
    <rect x="600" y="80" width="36" height="26" rx="4" fill="#fce5e2" stroke="#c4554e"/><text x="618" y="97" fill="#c4554e">14</text>
    <rect x="640" y="80" width="36" height="26" rx="4" fill="#fce5e2" stroke="#c4554e"/><text x="658" y="97" fill="#c4554e">15</text>
  </g>
  <!-- mapping lines -->
  <g stroke="#5677c9" stroke-width="1.4">
    <line x1="58" y1="106" x2="58" y2="190"/><line x1="98" y1="106" x2="98" y2="190"/>
    <line x1="138" y1="106" x2="138" y2="190"/><line x1="178" y1="106" x2="178" y2="190"/>
    <line x1="218" y1="106" x2="218" y2="190"/><line x1="258" y1="106" x2="258" y2="190"/>
    <line x1="298" y1="106" x2="298" y2="190"/><line x1="338" y1="106" x2="338" y2="190"/>
  </g>
  <g stroke="#c4554e" stroke-width="1.4" stroke-dasharray="5 3">
    <line x1="378" y1="106" x2="58" y2="190"/><line x1="418" y1="106" x2="98" y2="190"/>
    <line x1="458" y1="106" x2="138" y2="190"/><line x1="498" y1="106" x2="178" y2="190"/>
    <line x1="538" y1="106" x2="218" y2="190"/><line x1="578" y1="106" x2="258" y2="190"/>
    <line x1="618" y1="106" x2="298" y2="190"/><line x1="658" y1="106" x2="338" y2="190"/>
  </g>
  <!-- physical row -->
  <g font-family="Menlo,monospace" font-size="11" text-anchor="middle">
    <rect x="40"  y="190" width="36" height="26" rx="4" fill="#e2f4e9" stroke="#2f8a5f"/><text x="58"  y="207" fill="#2e2939">0</text>
    <rect x="80"  y="190" width="36" height="26" rx="4" fill="#e2f4e9" stroke="#2f8a5f"/><text x="98"  y="207" fill="#2e2939">1</text>
    <rect x="120" y="190" width="36" height="26" rx="4" fill="#e2f4e9" stroke="#2f8a5f"/><text x="138" y="207" fill="#2e2939">2</text>
    <rect x="160" y="190" width="36" height="26" rx="4" fill="#e2f4e9" stroke="#2f8a5f"/><text x="178" y="207" fill="#2e2939">3</text>
    <rect x="200" y="190" width="36" height="26" rx="4" fill="#e2f4e9" stroke="#2f8a5f"/><text x="218" y="207" fill="#2e2939">4</text>
    <rect x="240" y="190" width="36" height="26" rx="4" fill="#e2f4e9" stroke="#2f8a5f"/><text x="258" y="207" fill="#2e2939">5</text>
    <rect x="280" y="190" width="36" height="26" rx="4" fill="#e2f4e9" stroke="#2f8a5f"/><text x="298" y="207" fill="#2e2939">6</text>
    <rect x="320" y="190" width="36" height="26" rx="4" fill="#e2f4e9" stroke="#2f8a5f"/><text x="338" y="207" fill="#2e2939">7</text>
    <rect x="360" y="190" width="316" height="26" rx="4" fill="#ffffff" stroke="#b9b0c6" stroke-dasharray="4 3"/>
    <text x="518" y="207" fill="#8a8297">cells 8–15: never reached</text>
  </g>
  <text x="40" y="234" fill="#8a8297">physical cell</text>
  <!-- detection note -->
  <rect x="40" y="246" width="636" height="34" rx="8" fill="#fcf0d6"/>
  <text x="358" y="261" text-anchor="middle" fill="#a9700f" font-weight="600">addrbus step 2: write 0x55555555 @0, then read @8 → 0x55555555 ≠ 0xAAAAAAAA</text>
  <text x="358" y="275" text-anchor="middle" fill="#a9700f">→ offset 8 = 1&lt;&lt;3 aliases base → bad_bit = 3  (4 reads, 10 writes)</text>
</svg>
