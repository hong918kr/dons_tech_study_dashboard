  <text x="595" y="222" text-anchor="middle" fill="#8a8297">→</text>
  <text x="595" y="244" text-anchor="middle" font-family="Menlo,monospace" font-weight="700" fill="#5677c9">0</text>
  <text x="40" y="270" fill="#2e2939">first byte (MSB first) = 0000 0010 = 0x02 · PRBS31: same shape, 31 cells, taps s30 ⊕ s27</text>
