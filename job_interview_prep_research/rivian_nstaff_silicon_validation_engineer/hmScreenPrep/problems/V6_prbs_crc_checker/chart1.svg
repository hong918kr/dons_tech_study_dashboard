  <text x="704" y="72" text-anchor="end" fill="#2e2939" font-weight="600">out</text>
  <text x="236" y="42" fill="#8a5cc0">new = s6 ⊕ s5 = 1 ⊕ 1 = 0</text>
  <text x="648" y="142" fill="#8a8297" font-size="11">shift in</text>
  <text x="340" y="190" text-anchor="middle" fill="#8a8297">◀ shift left every clock · s0 = newest bit · state = ((state &lt;&lt; 1) | new) &amp; 0x7F</text>
