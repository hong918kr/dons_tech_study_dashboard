<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6f6680"/></marker></defs>
<rect width="800" height="320" fill="#ffffff"/>
<text x="40" y="24" fill="#2e2939" font-weight="700">regmap_open(phys = 0xA001_0F00, len = 0x200) on 4 KiB pages → mmap 2 pages</text>
<text x="60" y="52" fill="#5677c9" font-weight="700">map (page-aligned)</text>
<path d="M66,58 V83" stroke="#5677c9" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="300" y="52" text-anchor="middle" fill="#8a5cc0" font-weight="700">base = map + 0xF00</text>
<path d="M300,58 V83" stroke="#8a5cc0" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="60" y="86" width="240" height="60" fill="#ffffff" stroke="#b9b0c6" stroke-width="1.5"/>
<text x="180" y="112" text-anchor="middle" fill="#8a8297">page 0: mapped,</text>
<text x="180" y="128" text-anchor="middle" fill="#8a8297">not part of the window</text>
<rect x="300" y="86" width="170" height="60" fill="#f0e7fb" stroke="#8a5cc0" stroke-width="1.6"/>
<text x="385" y="110" text-anchor="middle" fill="#8a5cc0" font-weight="700">registers</text>
<text x="385" y="128" text-anchor="middle" fill="#2e2939" font-size="11">off 0x000 – 0x1FC</text>
<rect x="470" y="86" width="270" height="60" fill="#fcf0d6" stroke="#a9700f" stroke-width="1.5"/>
<text x="605" y="110" text-anchor="middle" fill="#a9700f" font-weight="700">slack: mapped, but off ≥ len</text>
<text x="605" y="128" text-anchor="middle" fill="#2e2939" font-size="11">reg_rd32 → REG_BAD, reg_wr32 dropped</text>
<line x1="400" y1="80" x2="400" y2="170" stroke="#2e2939" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="60" y1="146" x2="60" y2="153" stroke="#b9b0c6"/>
<line x1="300" y1="146" x2="300" y2="153" stroke="#b9b0c6"/>
<line x1="470" y1="146" x2="470" y2="153" stroke="#b9b0c6"/>
<line x1="740" y1="146" x2="740" y2="170" stroke="#b9b0c6"/>
<text x="60" y="166" fill="#2e2939" font-size="11">0xA001_0000</text>
<text x="300" y="166" text-anchor="middle" fill="#8a5cc0" font-size="11">0xA001_0F00 (phys)</text>
<text x="470" y="166" text-anchor="middle" fill="#8a5cc0" font-size="11">0xA001_1100 (phys+len)</text>
<text x="400" y="184" text-anchor="middle" fill="#2e2939" font-size="11">0xA001_1000 · 4 KiB page boundary</text>
<text x="740" y="184" text-anchor="end" fill="#2e2939" font-size="11">0xA001_2000</text>
<path d="M300,198 V204 H470 V198" fill="none" stroke="#8a5cc0" stroke-width="1.6"/>
<text x="385" y="220" text-anchor="middle" fill="#8a5cc0" font-weight="700">len = 0x200</text>
<path d="M60,234 V240 H740 V234" fill="none" stroke="#5677c9" stroke-width="1.6"/>
<text x="400" y="256" text-anchor="middle" fill="#5677c9" font-weight="700">map_len = roundup(0xF00 + 0x200, 4 KiB) = 0x2000 (2 pages)</text>
<text x="40" y="284" fill="#8a8297" font-size="11">page_base = phys &amp; ~(page − 1) = 0xA001_0000 · delta = 0xF00 · mmap(NULL, 0x2000, …, fd, 0xA001_0000)</text>
<text x="40" y="304" fill="#8a8297" font-size="11">macOS harness, 16 KiB pages: map_len = 0x4000, delta still 0xF00 · reg 0x100 = phys 0xA001_1000 = page boundary</text>
</svg>
