<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6f6680"/></marker></defs>
<rect width="900" height="390" fill="#ffffff"/>
<text x="20" y="22" fill="#2e2939" font-weight="700">uio_wait_irq(): one call = ① → ⑤ · the caller does ⑥ before the next call</text>
<text x="20" y="62" fill="#5677c9" font-weight="700">tool (user)</text>
<text x="20" y="142" fill="#8a8297" font-weight="700">kernel uio</text>
<text x="20" y="158" fill="#8a8297" font-size="11">uio_pdrv_genirq</text>
<text x="20" y="222" fill="#8a5cc0" font-weight="700">PL IP</text>
<rect x="150" y="40" width="110" height="44" rx="7" fill="#ffffff" stroke="#5677c9" stroke-width="1.5"/>
<text x="205" y="58" text-anchor="middle" fill="#2e2939" font-weight="600">① write(fd, 1)</text>
<text x="205" y="74" text-anchor="middle" fill="#8a8297" font-size="11">4 bytes = unmask</text>
<rect x="270" y="40" width="270" height="44" rx="7" fill="#ffffff" stroke="#5677c9" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="405" y="58" text-anchor="middle" fill="#2e2939" font-weight="600">② poll(fd, POLLIN, timeout)</text>
<text x="405" y="74" text-anchor="middle" fill="#8a8297" font-size="11">sleeping · no CPU · timeout → -ETIMEDOUT</text>
<rect x="560" y="40" width="130" height="44" rx="7" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="1.5"/>
<text x="625" y="58" text-anchor="middle" fill="#2e2939" font-weight="600">⑤ read(fd) → N</text>
<text x="625" y="74" text-anchor="middle" fill="#8a8297" font-size="11">missed = N − last − 1</text>
<rect x="700" y="40" width="180" height="44" rx="7" fill="#fcf0d6" stroke="#a9700f" stroke-width="1.5"/>
<text x="790" y="58" text-anchor="middle" fill="#2e2939" font-weight="600">⑥ clear IP status (W1C)</text>
<text x="790" y="74" text-anchor="middle" fill="#8a8297" font-size="11">via mmio → IRQ line low</text>
<rect x="150" y="122" width="110" height="44" rx="7" fill="#ffffff" stroke="#b9b0c6" stroke-width="1.5"/>
<text x="205" y="140" text-anchor="middle" fill="#2e2939" font-weight="600">irqcontrol(1)</text>
<text x="205" y="156" text-anchor="middle" fill="#8a8297" font-size="11">enable_irq()</text>
<rect x="400" y="122" width="160" height="44" rx="7" fill="#ffffff" stroke="#b9b0c6" stroke-width="1.5"/>
<text x="480" y="140" text-anchor="middle" fill="#2e2939" font-weight="600">④ IRQ handler</text>
<text x="480" y="156" text-anchor="middle" fill="#8a8297" font-size="11">mask · count++ · wake</text>
<rect x="290" y="202" width="100" height="44" rx="7" fill="#fce5e2" stroke="#c4554e" stroke-width="1.5"/>
<text x="340" y="220" text-anchor="middle" fill="#2e2939" font-weight="600">③ IRQ</text>
<text x="340" y="236" text-anchor="middle" fill="#8a8297" font-size="11">level high</text>
<path d="M205,84 V119" stroke="#6f6680" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M390,212 L418,169" stroke="#6f6680" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M560,128 L590,87" stroke="#6f6680" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="586" y="116" fill="#8a8297" font-size="11">POLLIN</text>
<text x="20" y="286" fill="#c4554e" font-weight="700">IRQ line</text>
<polyline fill="none" stroke="#c4554e" stroke-width="2" points="150,292 340,292 340,272 790,272 790,292 880,292"/>
<text x="565" y="266" text-anchor="middle" fill="#c4554e" font-size="11">high until the source is cleared at ⑥</text>
<text x="20" y="328" fill="#2f8a5f" font-weight="700">IRQ enabled</text>
<polyline fill="none" stroke="#2f8a5f" stroke-width="2" points="150,334 205,334 205,314 470,314 470,334 880,334"/>
<text x="178" y="328" text-anchor="middle" fill="#8a8297" font-size="11">masked</text>
<text x="337" y="328" text-anchor="middle" fill="#2f8a5f" font-size="11">enabled</text>
<text x="675" y="328" text-anchor="middle" fill="#8a8297" font-size="11">masked again by ④ (no IRQ storm while line is high)</text>
<line x1="150" y1="354" x2="880" y2="354" stroke="#b9b0c6"/><path d="M872,349 L882,354 L872,359" fill="none" stroke="#b9b0c6"/>
<text x="880" y="372" text-anchor="end" fill="#8a8297">time →</text>
<text x="20" y="380" fill="#8a8297" font-size="11">skip ⑥ and the next ① re-fires at once: count jumps by 1 with no new event</text>
</svg>
