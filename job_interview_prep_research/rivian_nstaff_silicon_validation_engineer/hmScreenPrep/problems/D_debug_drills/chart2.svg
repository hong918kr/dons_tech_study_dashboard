<text x="400" y="291" text-anchor="middle" fill="#2f8a5f" font-size="11" font-weight="600">miss → refill 0x27270505 ✓</text>
<text x="20" y="340" text-anchor="start" fill="#2e2939" font-size="12">Rule: clean before the device READS memory, invalidate before the CPU READS what the device wrote</text>
