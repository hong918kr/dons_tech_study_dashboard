<text x="310" y="204" text-anchor="start" fill="#c4554e" font-size="11" font-weight="600">HIT → 0x16160505 (run 1) ✗</text>
<line x1="20" y1="226" x2="700" y2="226" stroke="#e7e2ee"/>
<text x="20" y="246" text-anchor="start" fill="#2f8a5f" font-size="12" font-weight="700">Fixed</text>
