<rect width="720" height="354" fill="#fff"/>
<text x="20" y="22" text-anchor="start" fill="#2e2939" font-size="13" font-weight="700">D3 run 2 (seed 0x22220000) · dst word 5 · cache is write-back, DMA is not coherent</text>
