<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 346" width="720" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
<rect width="720" height="346" fill="#fff"/>
<text x="20" y="24" text-anchor="start" fill="#2e2939" font-size="13" font-weight="700">uint32_t timer as a circle (not to scale) · start = 0xFFFFF000, timeout = 50000</text>
<circle cx="190" cy="180" r="120" fill="none" stroke="#b9b0c6" stroke-width="2"/>
<path d="M112.9,88.1 A120,120 0 0 1 281.9,102.9" fill="none" stroke="#2f8a5f" stroke-width="8" opacity=".45"/>
<line x1="190.0" y1="70.0" x2="190.0" y2="50.0" stroke="#8a5cc0" stroke-width="2"/>
<text x="190" y="44" text-anchor="middle" fill="#8a5cc0" font-size="11" font-weight="600">0xFFFFFFFF → 0</text>
<circle cx="112.9" cy="88.1" r="6" fill="#5677c9"/>
<text x="101.3" y="78.3" text-anchor="end" fill="#5677c9" font-size="11" font-weight="700">start 0xFFFFF000</text>
<circle cx="145.0" cy="68.7" r="6" fill="#a9700f"/>
<text x="138.3" y="56.0" text-anchor="end" fill="#a9700f" font-size="11" font-weight="700">now 0xFFFFF3E8</text>
<circle cx="281.9" cy="102.9" r="6" fill="#2f8a5f"/>
<text x="307.7" y="95.3" text-anchor="start" fill="#2f8a5f" font-size="11" font-weight="700"></text>
<text x="295.92533317427734" y="122.86548683761528" text-anchor="start" fill="#2f8a5f" font-size="11" font-weight="700">start+timeout</text>
<text x="295.92533317427734" y="137.86548683761526" text-anchor="start" fill="#2f8a5f" font-size="11" font-weight="700">= 0x0000B350</text>
<text x="190" y="174" text-anchor="middle" fill="#8a8297" font-size="11">elapsed =</text>
<text x="190" y="190" text-anchor="middle" fill="#8a8297" font-size="11">now − start</text>
<text x="190" y="206" text-anchor="middle" fill="#8a8297" font-size="11">(mod 2^32)</text>
<rect x="400" y="70" width="300" height="92" rx="8" fill="#fce5e2"/>
<text x="412" y="92" text-anchor="start" fill="#c4554e" font-size="12" font-weight="700">buggy: now &gt; start + timeout</text>
<text x="412" y="112" text-anchor="start" fill="#c4554e" font-size="11">start + timeout wraps to 0x0000B350 (45904)</text>
<text x="412" y="130" text-anchor="start" fill="#c4554e" font-size="11">0xFFFFF3E8 &gt; 45904 → timeout after 1000 ticks</text>
<text x="412" y="148" text-anchor="start" fill="#c4554e" font-size="11">d5_elapsed = 1000 (PLL never got its 50000)</text>
<rect x="400" y="178" width="300" height="92" rx="8" fill="#e2f4e9"/>
<text x="412" y="200" text-anchor="start" fill="#2f8a5f" font-size="12" font-weight="700">fixed: (uint32_t)(now − start) &gt;= timeout</text>
<text x="412" y="220" text-anchor="start" fill="#2f8a5f" font-size="11">first poll: 0xFFFFF3E8 − 0xFFFFF000 = 1000</text>
<text x="412" y="238" text-anchor="start" fill="#2f8a5f" font-size="11">keeps waiting across the wrap</text>
<text x="412" y="256" text-anchor="start" fill="#2f8a5f" font-size="11">fires at elapsed 50000 (now = 0x0000B350)</text>
<rect x="20" y="324" width="14" height="8" fill="#2f8a5f" opacity=".45"/>
<text x="40" y="332" text-anchor="start" fill="#2f8a5f" font-size="11" font-weight="600">real wait window (50000 ticks)</text>
</svg>
