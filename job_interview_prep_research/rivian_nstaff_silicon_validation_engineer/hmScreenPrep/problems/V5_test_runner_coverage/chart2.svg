<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" width="780" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
  <rect x="0" y="0" width="780" height="350" fill="#ffffff"/>
  <!-- column headers (tests) -->
  <g font-size="10.5" fill="#2e2939" text-anchor="middle" font-weight="700">
    <text x="198" y="40">PCIE-LINK-001</text><text x="294" y="40">PCIE-LINK-002</text><text x="390" y="40">PCIE-GEN4-003</text>
    <text x="486" y="40">DDR-TRAIN-001</text><text x="582" y="40">DDR-STRESS-002</text><text x="678" y="40">OTP-BURN-001</text>
  </g>
  <g font-size="10" fill="#8a8297" text-anchor="middle">
    <text x="390" y="54">SKIP_ON_FPGA</text><text x="678" y="54">DESTRUCTIVE</text>
  </g>
  <text x="751" y="40" text-anchor="middle" fill="#2e2939" font-weight="700" font-size="10">covered</text>
  <text x="20" y="40" fill="#8a8297" font-size="11">requirement ↓ · test →</text>
  <!-- grid -->
  <g stroke="#b9b0c6" stroke-width="1" fill="none">
    <rect x="150" y="62" width="576" height="210"/>
    <line x1="246" y1="62" x2="246" y2="272"/><line x1="342" y1="62" x2="342" y2="272"/>
    <line x1="438" y1="62" x2="438" y2="272"/><line x1="534" y1="62" x2="534" y2="272"/>
    <line x1="630" y1="62" x2="630" y2="272"/>
  </g>
  <g stroke="#b9b0c6" stroke-width="1" stroke-dasharray="3 3">
    <line x1="20" y1="92" x2="772" y2="92"/><line x1="20" y1="122" x2="772" y2="122"/>
    <line x1="20" y1="182" x2="772" y2="182"/><line x1="20" y1="242" x2="772" y2="242"/>
  </g>
  <g stroke="#8a8297" stroke-width="1.2">
    <line x1="20" y1="152" x2="772" y2="152"/><line x1="20" y1="212" x2="772" y2="212"/>
  </g>
  <!-- row labels -->
  <g fill="#2e2939" font-size="11.5">
    <text x="20" y="81">REQ-PCIE-001</text><text x="20" y="111">REQ-PCIE-002</text><text x="20" y="141">REQ-PCIE-003</text>
    <text x="20" y="171">REQ-DDR-001</text><text x="20" y="201">REQ-DDR-002</text>
    <text x="20" y="231">REQ-OTP-001</text><text x="20" y="261">REQ-ISP-001</text>
  </g>
  <!-- cells (FPGA run) -->
  <g font-size="11" font-weight="700" text-anchor="middle">
    <rect x="154" y="66" width="88" height="22" rx="5" fill="#e2f4e9"/><text x="198" y="81" fill="#2f8a5f">PASS 12ms</text>
    <rect x="250" y="96" width="88" height="22" rx="5" fill="#fce5e2"/><text x="294" y="111" fill="#c4554e">FAIL −5</text>
    <rect x="346" y="126" width="88" height="22" rx="5" fill="#f0e7fb"/><text x="390" y="141" fill="#8a5cc0">SKIP</text>
    <rect x="442" y="156" width="88" height="22" rx="5" fill="#e2f4e9"/><text x="486" y="171" fill="#2f8a5f">PASS 40ms</text>
    <rect x="538" y="186" width="88" height="22" rx="5" fill="#fcf0d6"/><text x="582" y="201" fill="#a9700f">TIMEOUT 600</text>
    <rect x="634" y="216" width="88" height="22" rx="5" fill="#f0e7fb"/><text x="678" y="231" fill="#8a5cc0">SKIP</text>
    <text x="438" y="261" fill="#c4554e" font-weight="400">no test mapped — 아직 테스트가 없음</text>
  </g>
  <!-- covered column -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <text x="753" y="82" fill="#2f8a5f">✓</text><text x="753" y="112" fill="#c4554e">✗</text><text x="753" y="142" fill="#c4554e">✗</text>
    <text x="753" y="172" fill="#2f8a5f">✓</text><text x="753" y="202" fill="#c4554e">✗</text>
    <text x="753" y="232" fill="#c4554e">✗</text><text x="753" y="262" fill="#c4554e">✗</text>
  </g>
  <!-- footer -->
  <text x="20" y="300" fill="#2e2939" font-weight="700">FPGA run:</text>
  <text x="96" y="300" fill="#2e2939">PCIE 1/3 (33%) · DDR 1/2 (50%) · OTP 0/1 · ISP 0/1 · <tspan font-weight="700">ALL 2/7 (28%)</tspan></text>
  <text x="20" y="322" fill="#2e2939" font-weight="700">Silicon run:</text>
  <text x="96" y="322" fill="#2e2939">GEN4 · OTP → PASS: PCIE 2/3 (66%) · OTP 1/1 · <tspan font-weight="700">ALL 4/7 (57%)</tspan></text>
  <text x="20" y="342" fill="#8a8297" font-size="11">covered = 그 requirement에 연결된 테스트 중 PASS가 1개 이상. FAIL / SKIP / TIMEOUT은 covered가 아님</text>
</svg>
