<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8297"/></marker></defs>
  <text x="20" y="24" fill="#8a8297" font-size="11" font-weight="700">TARGET (bare-metal image, FPGA or silicon)</text>
  <!-- row 1 -->
  <rect x="20" y="40" width="120" height="70" rx="10" fill="#f0e7fb" stroke="#8a5cc0"/>
  <text x="80" y="66" text-anchor="middle" fill="#8a5cc0" font-weight="700">Registry</text>
  <text x="80" y="84" text-anchor="middle" fill="#2e2939" font-size="11">const TestCase[]</text>
  <text x="80" y="100" text-anchor="middle" fill="#8a8297" font-size="11">6 tests</text>
  <rect x="164" y="40" width="120" height="70" rx="10" fill="#fcf0d6" stroke="#a9700f"/>
  <text x="224" y="66" text-anchor="middle" fill="#a9700f" font-weight="700">Filter</text>
  <text x="224" y="84" text-anchor="middle" fill="#2e2939" font-size="11">block · platform · flags</text>
  <text x="224" y="100" text-anchor="middle" fill="#8a8297" font-size="11">6 selected, 2 SKIP</text>
  <rect x="308" y="40" width="120" height="70" rx="10" fill="#e2f4e9" stroke="#2f8a5f"/>
  <text x="368" y="66" text-anchor="middle" fill="#2f8a5f" font-weight="700">Run + time</text>
  <text x="368" y="84" text-anchor="middle" fill="#2e2939" font-size="11">now() − start</text>
  <text x="368" y="100" text-anchor="middle" fill="#8a8297" font-size="11">4 called</text>
  <rect x="452" y="40" width="120" height="70" rx="10" fill="#e2f4e9" stroke="#2f8a5f"/>
  <text x="512" y="66" text-anchor="middle" fill="#2f8a5f" font-weight="700">Results[]</text>
  <text x="512" y="84" text-anchor="middle" fill="#2e2939" font-size="11">status · rc · ms</text>
  <text x="512" y="100" text-anchor="middle" fill="#8a8297" font-size="11">2P 1F 2S 1T</text>
  <rect x="596" y="40" width="144" height="70" rx="10" fill="#fce5e2" stroke="#c4554e"/>
  <text x="668" y="66" text-anchor="middle" fill="#c4554e" font-weight="700">Report</text>
  <text x="668" y="84" text-anchor="middle" fill="#2e2939" font-size="11">bounded char buf</text>
  <text x="668" y="100" text-anchor="middle" fill="#8a8297" font-size="11">17 lines · 451 B</text>
  <g stroke="#8a8297" stroke-width="1.5" marker-end="url(#ar)">
    <line x1="140" y1="75" x2="162" y2="75"/><line x1="284" y1="75" x2="306" y2="75"/>
    <line x1="428" y1="75" x2="450" y2="75"/><line x1="572" y1="75" x2="594" y2="75"/>
    <line x1="668" y1="110" x2="668" y2="178"/>
  </g>
  <text x="676" y="148" fill="#8a8297" font-size="11">UART / JTAG</text>
  <!-- divider -->
  <line x1="20" y1="160" x2="740" y2="160" stroke="#b9b0c6" stroke-dasharray="5 4"/>
  <text x="20" y="178" fill="#8a8297" font-size="11" font-weight="700">HOST (Python)</text>
  <!-- row 2 -->
  <rect x="596" y="180" width="144" height="70" rx="10" fill="#ffffff" stroke="#5677c9"/>
  <text x="668" y="206" text-anchor="middle" fill="#5677c9" font-weight="700">Log parser</text>
  <text x="668" y="224" text-anchor="middle" fill="#2e2939" font-size="11">line.split(",")</text>
  <text x="668" y="240" text-anchor="middle" fill="#8a8297" font-size="11">RESULT / COVERAGE</text>
  <rect x="404" y="180" width="168" height="70" rx="10" fill="#ffffff" stroke="#5677c9"/>
  <text x="488" y="206" text-anchor="middle" fill="#5677c9" font-weight="700">Results DB</text>
  <text x="488" y="224" text-anchor="middle" fill="#2e2939" font-size="11">board · build · plat · PVT</text>
  <text x="488" y="240" text-anchor="middle" fill="#8a8297" font-size="11">history, flaky rate</text>
  <rect x="212" y="180" width="168" height="70" rx="10" fill="#ffffff" stroke="#5677c9"/>
  <text x="296" y="206" text-anchor="middle" fill="#5677c9" font-weight="700">Traceability</text>
  <text x="296" y="224" text-anchor="middle" fill="#2e2939" font-size="11">req ↔ test ↔ result</text>
  <text x="296" y="240" text-anchor="middle" fill="#8a8297" font-size="11">Jira / Polarion</text>
  <rect x="20" y="180" width="168" height="70" rx="10" fill="#ffffff" stroke="#5677c9"/>
  <text x="104" y="206" text-anchor="middle" fill="#5677c9" font-weight="700">Coverage dashboard</text>
  <text x="104" y="224" text-anchor="middle" fill="#2e2939" font-size="11">per block / milestone</text>
  <text x="104" y="240" text-anchor="middle" fill="#8a8297" font-size="11">ALL 2/7 = 28%</text>
  <g stroke="#8a8297" stroke-width="1.5" marker-end="url(#ar)">
    <line x1="596" y1="215" x2="574" y2="215"/><line x1="404" y1="215" x2="382" y2="215"/>
    <line x1="212" y1="215" x2="190" y2="215"/>
  </g>
  <text x="380" y="284" text-anchor="middle" fill="#8a8297" font-size="11">숫자는 테스트 1번(FPGA, 필터 없음, destructive 금지) 결과</text>
</svg>
