<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
<rect width="900" height="330" fill="#ffffff"/>
<text x="20" y="44" fill="#5677c9" font-weight="700">SW (CPU)</text>
<text x="20" y="126" fill="#8a8297" font-weight="700">ctrl.OWN in the descriptor (DDR)</text>
<text x="20" y="212" fill="#8a5cc0" font-weight="700">HW (DMA engine)</text>
<line x1="320" y1="30" x2="320" y2="286" stroke="#b9b0c6" stroke-dasharray="4 4"/>
<line x1="745" y1="30" x2="745" y2="286" stroke="#b9b0c6" stroke-dasharray="4 4"/>
<rect x="20" y="54" width="104" height="46" rx="7" fill="#ffffff" stroke="#5677c9" stroke-width="1.5"/>
<text x="72" y="73" text-anchor="middle" fill="#2e2939" font-weight="600">① fill fields</text>
<text x="72" y="89" text-anchor="middle" fill="#8a8297" font-size="11">src,dst,len,status</text>
<rect x="132" y="54" width="90" height="46" rx="7" fill="#fcf0d6" stroke="#a9700f" stroke-width="1.5"/>
<text x="177" y="73" text-anchor="middle" fill="#2e2939" font-weight="600">② dma_wmb()</text>
<text x="177" y="89" text-anchor="middle" fill="#8a8297" font-size="11">release</text>
<rect x="230" y="54" width="86" height="46" rx="7" fill="#ffffff" stroke="#5677c9" stroke-width="1.5"/>
<text x="273" y="73" text-anchor="middle" fill="#2e2939" font-weight="600">③ set OWN</text>
<text x="273" y="89" text-anchor="middle" fill="#8a8297" font-size="11">EOP|IRQ|OWN</text>
<rect x="340" y="220" width="90" height="46" rx="7" fill="#ffffff" stroke="#8a5cc0" stroke-width="1.5"/>
<text x="385.0" y="239" text-anchor="middle" fill="#2e2939" font-weight="600">④ fetch desc</text>
<text x="385.0" y="255" text-anchor="middle" fill="#8a8297" font-size="11">sees OWN=1</text>
<rect x="440" y="220" width="110" height="46" rx="7" fill="#ffffff" stroke="#8a5cc0" stroke-width="1.5"/>
<text x="495.0" y="239" text-anchor="middle" fill="#2e2939" font-weight="600">⑤ copy</text>
<text x="495.0" y="255" text-anchor="middle" fill="#8a8297" font-size="11">AXI read → write</text>
<rect x="560" y="220" width="90" height="46" rx="7" fill="#ffffff" stroke="#8a5cc0" stroke-width="1.5"/>
<text x="605.0" y="239" text-anchor="middle" fill="#2e2939" font-weight="600">⑥ write status</text>
<text x="605.0" y="255" text-anchor="middle" fill="#8a8297" font-size="11">DONE | ERR</text>
<rect x="660" y="220" width="80" height="46" rx="7" fill="#ffffff" stroke="#8a5cc0" stroke-width="1.5"/>
<text x="700.0" y="239" text-anchor="middle" fill="#2e2939" font-weight="600">⑦ clear OWN</text>
<text x="700.0" y="255" text-anchor="middle" fill="#8a8297" font-size="11">ctrl &amp;= ~OWN</text>
<rect x="752" y="54" width="133" height="46" rx="7" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="1.5"/>
<text x="818.5" y="73" text-anchor="middle" fill="#2e2939" font-weight="600">⑧ OWN==0 → rmb</text>
<text x="818.5" y="89" text-anchor="middle" fill="#8a8297" font-size="11">read status → cb()</text>
<rect x="20" y="136" width="300" height="48" fill="#e2f4e9" opacity=".7"/>
<rect x="320" y="136" width="425" height="48" fill="#f0e7fb" opacity=".8"/>
<rect x="745" y="136" width="140" height="48" fill="#e2f4e9" opacity=".7"/>
<polyline fill="none" stroke="#2e2939" stroke-width="2" points="20,178 320,178 320,142 745,142 745,178 885,178"/>
<text x="170" y="168" text-anchor="middle" fill="#2f8a5f" font-weight="700">SW owns (OWN=0)</text>
<text x="532" y="166" text-anchor="middle" fill="#8a5cc0" font-weight="700">HW owns (OWN=1): SW must not touch</text>
<text x="815" y="168" text-anchor="middle" fill="#2f8a5f" font-weight="700">SW owns</text>
<text x="700" y="284" text-anchor="middle" fill="#c4554e" font-size="11">IRQ if CTRL_IRQ → ⑧</text>
<text x="270" y="284" text-anchor="middle" fill="#8a8297" font-size="11">(doorbell write here on real HW)</text>
<line x1="20" y1="306" x2="880" y2="306" stroke="#b9b0c6"/><path d="M872,301 L882,306 L872,311" fill="none" stroke="#b9b0c6"/>
<text x="880" y="324" text-anchor="end" fill="#8a8297">time →</text>
<text x="20" y="324" fill="#8a8297" font-size="11">① must be globally visible before ③ · ⑥ before ⑦ (HW side) · ⑧ reads status only after seeing OWN=0</text>
</svg>
