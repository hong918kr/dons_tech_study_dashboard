<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6f6680"/></marker></defs>
<rect width="760" height="320" fill="#ffffff"/>
