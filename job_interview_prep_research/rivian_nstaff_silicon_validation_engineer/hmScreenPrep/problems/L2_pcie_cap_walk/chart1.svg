<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6f6680"/></marker></defs>
<rect width="760" height="420" fill="#ffffff"/>
<text x="30" y="26" text-anchor="start" fill="#5677c9" font-size="12" font-weight="700">01:00.0 standard list (0x40–0xFF, 8-bit next)</text>
<text x="410" y="26" text-anchor="start" fill="#8a5cc0" font-size="12" font-weight="700">extended list (0x100–0xFFF, 12-bit next)</text>
<rect x="30" y="40" width="300" height="84" rx="7" fill="#ffffff" stroke="#b9b0c6" stroke-width="1.5"/>
<text x="42" y="60" text-anchor="start" fill="#2e2939" font-size="12" font-weight="700">0x000  Type 0 header (64 B)</text>
<text x="42" y="80" text-anchor="start" fill="#2e2939" font-size="11">0x06 Status = 0x0010 → bit 4 Cap List = 1</text>
<text x="42" y="97" text-anchor="start" fill="#2e2939" font-size="11">0x0E Header Type = 0x00 · 0x10–0x24 BAR0–5</text>
<text x="42" y="114" text-anchor="start" fill="#5677c9" font-size="11" font-weight="700">0x34 Cap Ptr = 0x40</text>
<path d="M180,124 L180,146" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="30" y="148" width="300" height="50" rx="7" fill="#ffffff" stroke="#b9b0c6" stroke-width="1.5"/>
<text x="42" y="168" text-anchor="start" fill="#2e2939" font-size="12" font-weight="700">0x040  Power Mgmt · ID 0x01</text>
<text x="42" y="186" text-anchor="start" fill="#8a8297" font-size="11">dword 0x00035001 → next 0x50</text>
<rect x="30" y="222" width="300" height="50" rx="7" fill="#ffffff" stroke="#b9b0c6" stroke-width="1.5"/>
<text x="42" y="242" text-anchor="start" fill="#2e2939" font-size="12" font-weight="700">0x050  MSI-X · ID 0x11</text>
<text x="42" y="260" text-anchor="start" fill="#8a8297" font-size="11">dword 0x001F7011 → next 0x70</text>
<path d="M180,198 L180,220" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M180,272 L180,294" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="30" y="296" width="300" height="70" rx="7" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="1.5"/>
<text x="42" y="316" text-anchor="start" fill="#2f8a5f" font-size="12" font-weight="700">0x070  PCI Express · ID 0x10  ✓ found</text>
<text x="42" y="334" text-anchor="start" fill="#8a8297" font-size="11">dword 0x00020010 → next 0x00 (end)</text>
<text x="42" y="354" text-anchor="start" fill="#2e2939" font-size="11">+0x0C LnkCap 0x00400C44 · +0x12 LnkSta 0x1044</text>
<rect x="410" y="40" width="320" height="50" rx="7" fill="#f0e7fb" stroke="#8a5cc0" stroke-width="1.5"/>
<text x="422" y="60" text-anchor="start" fill="#2e2939" font-size="12" font-weight="700">0x100  AER · ID 0x0001 v2</text>
<text x="422" y="78" text-anchor="start" fill="#8a8297" font-size="11">0x14820001 → next 0x148</text>
<rect x="410" y="114" width="320" height="50" rx="7" fill="#ffffff" stroke="#b9b0c6" stroke-width="1.5"/>
<text x="422" y="134" text-anchor="start" fill="#2e2939" font-size="12" font-weight="700">0x148  Device Serial No. · ID 0x0003</text>
<text x="422" y="152" text-anchor="start" fill="#8a8297" font-size="11">0x15810003 → next 0x158</text>
<rect x="410" y="188" width="320" height="50" rx="7" fill="#ffffff" stroke="#b9b0c6" stroke-width="1.5"/>
<text x="422" y="208" text-anchor="start" fill="#2e2939" font-size="12" font-weight="700">0x158  Secondary PCIe · ID 0x0019</text>
<text x="422" y="226" text-anchor="start" fill="#8a8297" font-size="11">0x00010019 → next 0x000 (end)</text>
<path d="M570,90 L570,112" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M570,164 L570,186" stroke="#6f6680" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="410" y="262" text-anchor="start" fill="#8a8297" font-size="11">ext cap header dword</text>
<rect x="410" y="268" width="120" height="26" fill="#fcf0d6" stroke="#a9700f" stroke-width="1.2"/>
<text x="470.0" y="285" text-anchor="middle" fill="#2e2939" font-size="11">next [31:20]</text>
<rect x="530" y="268" width="40" height="26" fill="#ffffff" stroke="#b9b0c6" stroke-width="1.2"/>
<text x="550.0" y="285" text-anchor="middle" fill="#2e2939" font-size="11">ver</text>
<rect x="570" y="268" width="160" height="26" fill="#f0e7fb" stroke="#8a5cc0" stroke-width="1.2"/>
<text x="650.0" y="285" text-anchor="middle" fill="#2e2939" font-size="11">cap ID [15:0]</text>
<text x="410" y="310" text-anchor="start" fill="#8a8297" font-size="11">next = (hdr >> 20) &amp; 0xFFC · std: next = byte1 &amp; 0xFC</text>
<rect x="410" y="322" width="320" height="44" rx="7" fill="#fce5e2" stroke="#c4554e" stroke-width="1.5"/>
<text x="422" y="340" text-anchor="start" fill="#c4554e" font-size="11" font-weight="700">03:00.0: 0x40 → (0x53 &amp; 0xFC) 0x50 → 0x40 → …</text>
<text x="422" y="357" text-anchor="start" fill="#c4554e" font-size="11">48 hops → -ELOOP · ext 0x100 ↔ 0x110: 480 hops</text>
<text x="30" y="392" text-anchor="start" fill="#2e2939" font-size="11">규칙: low 2 bits mask · std ptr &lt; 0x40 → -EINVAL · ext next &lt; 0x100 → -EINVAL</text>
<text x="30" y="410" text-anchor="start" fill="#2e2939" font-size="11">next = 0 → 끝(-ENOENT) · 0x100이 0 또는 0xFFFFFFFF → ext cap 없음(-ENOENT)</text>
</svg>
