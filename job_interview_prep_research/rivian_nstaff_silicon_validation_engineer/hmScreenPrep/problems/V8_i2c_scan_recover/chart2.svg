<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
<rect width="800" height="280" fill="#ffffff"/>
<rect x="90" y="128" width="420" height="62" fill="#fce5e2"/>
<text x="300" y="206" text-anchor="middle" fill="#c4554e" font-size="11">stuck slave holds SDA low (finishing a read byte it started before the reset)</text>
<rect x="594" y="40" width="126" height="150" fill="#fcf0d6"/>
<text x="657" y="34" text-anchor="middle" font-weight="700" fill="#a9700f">STOP</text>
<polyline fill="none" stroke="#5677c9" stroke-width="2.5" points="90,60 171,60 177,100 213,100 219,60 255,60 261,100 297,100 303,60 339,60 345,100 381,100 387,60 423,60 429,100 465,100 471,60 507,60 513,100 549,100 555,60 591,60 597,100 633,100 639,60 762,60"/>
<polyline fill="none" stroke="#5677c9" stroke-width="2.5" points="90,180 513.3,180 519.3,140 597.3,140 603.3,180 675,180 681,140 762,140"/>
<line x1="90" y1="180" x2="513.3" y2="180" stroke="#c4554e" stroke-width="4"/>
<text x="195" y="118" text-anchor="middle" font-weight="700" fill="#5677c9">1</text>

<text x="279" y="118" text-anchor="middle" font-weight="700" fill="#5677c9">2</text>

<text x="363" y="118" text-anchor="middle" font-weight="700" fill="#5677c9">3</text>

<text x="447" y="118" text-anchor="middle" font-weight="700" fill="#5677c9">4</text>

<text x="531" y="118" text-anchor="middle" font-weight="700" fill="#5677c9">5</text>

<line x1="237" y1="110" x2="237" y2="150" stroke="#c4554e" stroke-dasharray="2 3"/>
<line x1="321" y1="110" x2="321" y2="150" stroke="#c4554e" stroke-dasharray="2 3"/>
<line x1="405" y1="110" x2="405" y2="150" stroke="#c4554e" stroke-dasharray="2 3"/>
<line x1="489" y1="110" x2="489" y2="150" stroke="#c4554e" stroke-dasharray="2 3"/>
<line x1="573" y1="133" x2="573" y2="150" stroke="#2f8a5f" stroke-dasharray="2 3"/>
<text x="573" y="128" text-anchor="middle" fill="#2f8a5f" font-size="10">high ✓</text>
<text x="514" y="222" fill="#2f8a5f" font-size="11">↑ released on fall #5 → stop pulsing</text>
<text x="40" y="85" font-weight="700" fill="#2e2939" font-size="14">SCL</text><text x="40" y="165" font-weight="700" fill="#2e2939" font-size="14">SDA</text>
<text x="363" y="34" text-anchor="middle" font-weight="700" fill="#5677c9">pulse SCL, check SDA after each pulse (max 9)</text>
<text x="400" y="240" text-anchor="middle" fill="#8a8297" font-size="11">i2c_bus_recover() = 5 · 5 pulses × 10 us + STOP 15 us = 65 us · dashed = SDA check after each pulse</text>
<text x="400" y="258" text-anchor="middle" fill="#8a8297" font-size="11">worst case: 8 data bits + 1 ACK slot left = 9 clocks · SDA still low after 9 → -EIO (short to GND / dead slave)</text>
</svg>
