<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
<defs><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c4554e"/></marker></defs>
<rect width="760" height="330" fill="#fff"/>
<rect x="20" y="70" width="75" height="46" fill="#f0e7fb" stroke="#8a5cc0" stroke-width="1.5"/>
<text x="57.5" y="90" text-anchor="middle" fill="#8a5cc0" font-weight="700" font-size="12">Preamble</text>
<text x="57.5" y="106" text-anchor="middle" fill="#8a8297" font-size="11">7 B</text>
<rect x="95" y="70" width="35" height="46" fill="#f0e7fb" stroke="#8a5cc0" stroke-width="1.5"/>
<text x="112.5" y="90" text-anchor="middle" fill="#8a5cc0" font-weight="700" font-size="12">SFD</text>
<text x="112.5" y="106" text-anchor="middle" fill="#8a8297" font-size="11">1 B</text>
<rect x="130" y="70" width="70" height="46" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="1.5"/>
<text x="165.0" y="90" text-anchor="middle" fill="#2f8a5f" font-weight="700" font-size="12">DA</text>
<text x="165.0" y="106" text-anchor="middle" fill="#8a8297" font-size="11">6 B</text>
<rect x="200" y="70" width="70" height="46" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="1.5"/>
<text x="235.0" y="90" text-anchor="middle" fill="#2f8a5f" font-weight="700" font-size="12">SA</text>
<text x="235.0" y="106" text-anchor="middle" fill="#8a8297" font-size="11">6 B</text>
<rect x="270" y="70" width="80" height="46" fill="#fcf0d6" stroke="#a9700f" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="310.0" y="90" text-anchor="middle" fill="#a9700f" font-weight="700" font-size="11">802.1Q tag</text>
<text x="310.0" y="106" text-anchor="middle" fill="#8a8297" font-size="11">4 B (opt.)</text>
<rect x="350" y="70" width="60" height="46" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="1.5"/>
<text x="380.0" y="90" text-anchor="middle" fill="#2f8a5f" font-weight="700" font-size="12">Type</text>
<text x="380.0" y="106" text-anchor="middle" fill="#8a8297" font-size="11">2 B</text>
<rect x="410" y="70" width="180" height="46" fill="#ffffff" stroke="#5677c9" stroke-width="1.5"/>
<text x="500.0" y="90" text-anchor="middle" fill="#5677c9" font-weight="700" font-size="11">Payload + pad</text>
<text x="500.0" y="106" text-anchor="middle" fill="#8a8297" font-size="11">46–1500 B</text>
<rect x="590" y="70" width="60" height="46" fill="#fce5e2" stroke="#c4554e" stroke-width="1.5"/>
<text x="620.0" y="90" text-anchor="middle" fill="#c4554e" font-weight="700" font-size="12">FCS</text>
<text x="620.0" y="106" text-anchor="middle" fill="#8a8297" font-size="11">4 B</text>
<rect x="650" y="70" width="80" height="46" fill="#ffffff" stroke="#b9b0c6" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="690.0" y="90" text-anchor="middle" fill="#b9b0c6" font-weight="700" font-size="12">IFG</text>
<text x="690.0" y="106" text-anchor="middle" fill="#8a8297" font-size="11">12 B</text>
<path d="M130,64 L130,58 L650,58 L650,64" fill="none" stroke="#2e2939" stroke-width="1.3"/>
<text x="390.0" y="52" text-anchor="middle" fill="#2e2939" font-size="11" font-weight="600">MAC frame: 64 … 1518 B (1522 with tag) — what eth_build_frame produces</text>
<path d="M20,46 L20,40 L130,40 L130,46" fill="none" stroke="#8a5cc0" stroke-width="1.3"/>
<text x="75.0" y="34" text-anchor="middle" fill="#8a5cc0" font-size="11" font-weight="600">wire only (PHY/MAC adds)</text>
<path d="M650,46 L650,40 L730,40 L730,46" fill="none" stroke="#8a8297" stroke-width="1.3"/>
<text x="690.0" y="34" text-anchor="middle" fill="#8a8297" font-size="11" font-weight="600">idle gap</text>
<path d="M130,122 L130,128 L590,128 L590,122" fill="none" stroke="#c4554e" stroke-width="1.3"/>
<text x="360.0" y="143" text-anchor="middle" fill="#c4554e" font-size="11" font-weight="600">FCS = CRC-32 over DA … pad (pad so DA..pad ≥ 60 B)</text>
<path d="M590,134 C610,134 620,128 620,120" fill="none" stroke="#c4554e" stroke-width="1.3" marker-end="url(#fa)"/>
<path d="M270,116 L200,186 M350,116 L520,186" stroke="#a9700f" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
<text x="130" y="180" text-anchor="end" fill="#a9700f" font-weight="700" font-size="11">tag = TPID 0x8100</text>
<text x="130" y="196" text-anchor="end" fill="#a9700f" font-weight="700" font-size="11">+ TCI (2 B, BE):</text>
<rect x="200" y="186" width="60" height="30" fill="#fcf0d6" stroke="#a9700f"/>
<text x="230.0" y="205" text-anchor="middle" fill="#a9700f" font-size="11" font-weight="600">PCP 3 b</text>
<rect x="260" y="186" width="20" height="30" fill="#fcf0d6" stroke="#a9700f"/>
<text x="270.0" y="205" text-anchor="middle" fill="#a9700f" font-size="11" font-weight="600">DEI </text>
<rect x="280" y="186" width="240" height="30" fill="#fcf0d6" stroke="#a9700f"/>
<text x="400.0" y="205" text-anchor="middle" fill="#a9700f" font-size="11" font-weight="600">VID 12 b</text>
<text x="530" y="197" fill="#2e2939" font-size="11">PCP 5, DEI 0, VID 100</text>
<text x="530" y="212" fill="#2e2939" font-size="11">→ TCI = 0xA064 → bytes A0 64</text>
<rect x="20" y="236" width="720" height="82" rx="10" fill="#f0e7fb" fill-opacity=".45" stroke="#d9cdea"/>
<text x="34" y="258" fill="#2e2939" font-size="12" font-weight="500">Example (test 2): DA ff×6 · SA 02:00:00:00:00:01 · type 0800 · "hello" 5 B · pad 41 × 00 → 60 B</text>
<text x="34" y="280" fill="#c4554e" font-size="12" font-weight="600">FCS = CRC32(60 B) = 0x32DD79F1 → sent LSB first: F1 79 DD 32 → 64 B frame</text>
<text x="34" y="302" fill="#5677c9" font-size="12" font-weight="600">Line rate: 64 B frame + 8 B preamble/SFD + 12 B IFG = 84 B = 672 bit → 10 Gb/s ÷ 672 = 14.88 Mpps</text>
</svg>
