<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="860" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
  <rect width="860" height="460" fill="#ffffff"/>
  <text x="20" y="24" font-size="14" font-weight="700" fill="#2e2939">Test 10 — one byte stream, two virtual channels interleaved (80 bytes, 9 packets)</text>

  <!-- lane labels -->
  <g font-weight="700" font-size="12">
    <text x="20" y="72" fill="#8a5cc0">VC0</text><text x="20" y="86" fill="#8a8297" font-size="10" font-weight="400">RAW10 8×2</text>
    <text x="20" y="142" fill="#5677c9">VC1</text><text x="20" y="156" fill="#8a8297" font-size="10" font-weight="400">YUV422 4×2</text>
    <text x="20" y="206" fill="#a9700f">VC2</text><text x="20" y="220" fill="#8a8297" font-size="10" font-weight="400">not configured</text>
  </g>

  <!-- in-frame bands -->
  <rect x="110" y="50" width="608" height="50" fill="#e2f4e9" opacity=".55"/>
  <rect x="142" y="120" width="608" height="50" fill="#e2f4e9" opacity=".55"/>
  <text x="414" y="113" text-anchor="middle" fill="#2f8a5f" font-size="11">VC0 IN_FRAME (fn 1)</text>
  <text x="446" y="183" text-anchor="middle" fill="#2f8a5f" font-size="11">VC1 IN_FRAME (fn 7)</text>

  <!-- VC0 packets -->
  <rect x="110" y="58" width="32" height="34" fill="#fcf0d6" stroke="#a9700f"/><text x="126" y="79" text-anchor="middle" fill="#a9700f" font-weight="700" font-size="11">FS</text>
  <rect x="174" y="58" width="128" height="34" fill="#f0e7fb" stroke="#8a5cc0"/><text x="238" y="79" text-anchor="middle" fill="#8a5cc0" font-weight="700" font-size="11">line · WC 10</text>
  <rect x="446" y="58" width="128" height="34" fill="#f0e7fb" stroke="#8a5cc0"/><text x="510" y="79" text-anchor="middle" fill="#8a5cc0" font-weight="700" font-size="11">line · WC 10</text>
  <rect x="686" y="58" width="32" height="34" fill="#fcf0d6" stroke="#a9700f"/><text x="702" y="79" text-anchor="middle" fill="#a9700f" font-weight="700" font-size="11">FE</text>

  <!-- VC1 packets -->
  <rect x="142" y="128" width="32" height="34" fill="#fcf0d6" stroke="#a9700f"/><text x="158" y="149" text-anchor="middle" fill="#a9700f" font-weight="700" font-size="11">FS</text>
  <rect x="302" y="128" width="112" height="34" fill="#eef2fb" stroke="#5677c9"/><text x="358" y="149" text-anchor="middle" fill="#5677c9" font-weight="700" font-size="11">line · WC 8</text>
  <rect x="574" y="128" width="112" height="34" fill="#eef2fb" stroke="#5677c9"/><text x="630" y="149" text-anchor="middle" fill="#5677c9" font-weight="700" font-size="11">line · WC 8</text>
  <rect x="718" y="128" width="32" height="34" fill="#fcf0d6" stroke="#a9700f"/><text x="734" y="149" text-anchor="middle" fill="#a9700f" font-weight="700" font-size="11">FE</text>

  <!-- VC2 stray -->
  <rect x="414" y="196" width="32" height="30" fill="#fce5e2" stroke="#c4554e"/><text x="430" y="215" text-anchor="middle" fill="#c4554e" font-weight="700" font-size="11">LS</text>
  <text x="456" y="215" fill="#c4554e" font-size="11">unexpected_vc++</text>

  <!-- byte offset axis -->
  <line x1="110" y1="246" x2="750" y2="246" stroke="#b9b0c6"/>
  <g fill="#8a8297" font-size="10" text-anchor="middle">
    <line x1="110" y1="242" x2="110" y2="250" stroke="#b9b0c6"/><text x="110" y="262">0</text>
    <line x1="174" y1="242" x2="174" y2="250" stroke="#b9b0c6"/><text x="174" y="262">8</text>
    <line x1="302" y1="242" x2="302" y2="250" stroke="#b9b0c6"/><text x="302" y="262">24</text>
    <line x1="414" y1="242" x2="414" y2="250" stroke="#b9b0c6"/><text x="414" y="262">38</text>
    <line x1="446" y1="242" x2="446" y2="250" stroke="#b9b0c6"/><text x="446" y="262">42</text>
    <line x1="574" y1="242" x2="574" y2="250" stroke="#b9b0c6"/><text x="574" y="262">58</text>
    <line x1="686" y1="242" x2="686" y2="250" stroke="#b9b0c6"/><text x="686" y="262">72</text>
    <line x1="750" y1="242" x2="750" y2="250" stroke="#b9b0c6"/><text x="750" y="262">80</text>
  </g>
  <text x="790" y="262" fill="#8a8297" font-size="10">byte off</text>
  <text x="430" y="282" text-anchor="middle" fill="#4b4459" font-size="11">short = 4 B · long = 4 + WC + 2 B · each VC keeps its own state; packets of other VCs never close your frame</text>

  <!-- ===== per-VC state machine ===== -->
  <text x="20" y="314" font-size="14" font-weight="700" fill="#2e2939">Per-VC receiver state machine</text>
  <rect x="140" y="350" width="130" height="56" rx="28" fill="#f4f1f8" stroke="#8a8297" stroke-width="1.5"/>
  <text x="205" y="383" text-anchor="middle" font-weight="700" fill="#2e2939" font-size="13">IDLE</text>
  <rect x="520" y="350" width="150" height="56" rx="28" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="1.5"/>
  <text x="595" y="376" text-anchor="middle" font-weight="700" fill="#2f8a5f" font-size="13">IN_FRAME</text>
  <text x="595" y="394" text-anchor="middle" fill="#8a8297" font-size="10">lines, frame_num, frame_bad</text>
  <path d="M270 364 H516" stroke="#2f8a5f" stroke-width="1.6" fill="none"/>
  <path d="M516 364 l-9 -4 v8 z" fill="#2f8a5f"/>
  <text x="393" y="356" text-anchor="middle" fill="#2f8a5f" font-size="11">FS: check fn == prev+1</text>
  <path d="M520 394 H274" stroke="#5677c9" stroke-width="1.6" fill="none"/>
  <path d="M274 394 l9 -4 v8 z" fill="#5677c9"/>
  <text x="397" y="412" text-anchor="middle" fill="#5677c9" font-size="11">FE: lines == height &amp;&amp; fn match → frames_ok</text>
  <!-- self loops -->
  <path d="M570 350 C 560 322, 630 322, 620 350" stroke="#8a5cc0" stroke-width="1.5" fill="none"/>
  <path d="M620 350 l-1 -10 l7 5 z" fill="#8a5cc0"/>
  <text x="684" y="330" fill="#8a5cc0" font-size="11">long ok → lines++</text>
  <text x="684" y="346" fill="#c4554e" font-size="11">bad DT/WC/CRC → err++</text>
  <text x="684" y="372" fill="#c4554e" font-size="11">FS again → missing_fe++</text>
  <text x="684" y="388" fill="#c4554e" font-size="11">frames_bad++, restart</text>
  <path d="M180 350 C 170 322, 240 322, 230 350" stroke="#c4554e" stroke-width="1.5" fill="none"/>
  <path d="M230 350 l-1 -10 l7 5 z" fill="#c4554e"/>
  <text x="20" y="336" fill="#c4554e" font-size="11">long / FE →</text>
  <text x="20" y="352" fill="#c4554e" font-size="11">no_fs_pkts++</text>
  <text x="430" y="446" text-anchor="middle" fill="#8a8297" font-size="11">end of buffer or lost sync (uncorrectable header / truncated) with a frame open → missing_fe++, frames_bad++</text>
</svg>
