<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
  <rect width="860" height="400" fill="#ffffff"/>

  <!-- ===== short packet ===== -->
  <text x="20" y="28" font-size="14" font-weight="700" fill="#2e2939">Short packet (4 B) — FS, VC0, frame number 1</text>
  <rect x="20" y="40" width="110" height="46" fill="#f0e7fb" stroke="#8a5cc0" stroke-width="1.5"/>
  <text x="75" y="60" text-anchor="middle" font-weight="700" fill="#8a5cc0" font-size="13">DI = 0x00</text>
  <text x="75" y="77" text-anchor="middle" fill="#8a8297" font-size="11">VC 0 · DT 0x00 FS</text>
  <rect x="130" y="40" width="110" height="46" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="1.5"/>
  <text x="185" y="60" text-anchor="middle" font-weight="700" fill="#2f8a5f" font-size="13">0x01</text>
  <text x="185" y="77" text-anchor="middle" fill="#8a8297" font-size="11">data[7:0]</text>
  <rect x="240" y="40" width="110" height="46" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="1.5"/>
  <text x="295" y="60" text-anchor="middle" font-weight="700" fill="#2f8a5f" font-size="13">0x00</text>
  <text x="295" y="77" text-anchor="middle" fill="#8a8297" font-size="11">data[15:8]</text>
  <rect x="350" y="40" width="110" height="46" fill="#fcf0d6" stroke="#a9700f" stroke-width="1.5"/>
  <text x="405" y="60" text-anchor="middle" font-weight="700" fill="#a9700f" font-size="13">ECC = 0x1A</text>
  <text x="405" y="77" text-anchor="middle" fill="#8a8297" font-size="11">00 P5..P0</text>
  <text x="480" y="60" fill="#4b4459">data = frame number (FS/FE)</text>
  <text x="480" y="77" fill="#4b4459">or line number (LS/LE)</text>

  <!-- ===== long packet ===== -->
  <text x="20" y="126" font-size="14" font-weight="700" fill="#2e2939">Long packet — RAW10, VC0, WC = 10 (8 px × 10 bit / 8)</text>
  <rect x="20" y="138" width="90" height="46" fill="#f0e7fb" stroke="#8a5cc0" stroke-width="1.5"/>
  <text x="65" y="158" text-anchor="middle" font-weight="700" fill="#8a5cc0" font-size="13">DI = 0x2B</text>
  <text x="65" y="175" text-anchor="middle" fill="#8a8297" font-size="11">VC 0 · RAW10</text>
  <rect x="110" y="138" width="80" height="46" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="1.5"/>
  <text x="150" y="158" text-anchor="middle" font-weight="700" fill="#2f8a5f" font-size="13">0x0A</text>
  <text x="150" y="175" text-anchor="middle" fill="#8a8297" font-size="11">WC[7:0]</text>
  <rect x="190" y="138" width="80" height="46" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="1.5"/>
  <text x="230" y="158" text-anchor="middle" font-weight="700" fill="#2f8a5f" font-size="13">0x00</text>
  <text x="230" y="175" text-anchor="middle" fill="#8a8297" font-size="11">WC[15:8]</text>
  <rect x="270" y="138" width="90" height="46" fill="#fcf0d6" stroke="#a9700f" stroke-width="1.5"/>
  <text x="315" y="158" text-anchor="middle" font-weight="700" fill="#a9700f" font-size="13">ECC = 0x2E</text>
  <text x="315" y="175" text-anchor="middle" fill="#8a8297" font-size="11">P5..P0</text>
  <rect x="360" y="138" width="300" height="46" fill="#eef2fb" stroke="#5677c9" stroke-width="1.5"/>
  <text x="510" y="158" text-anchor="middle" font-weight="700" fill="#5677c9" font-size="13">payload: WC = 10 bytes</text>
  <text x="510" y="175" text-anchor="middle" fill="#8a8297" font-size="11">10 17 1E 25 2C 33 3A 41 48 4F</text>
  <rect x="660" y="138" width="80" height="46" fill="#fce5e2" stroke="#c4554e" stroke-width="1.5"/>
  <text x="700" y="158" text-anchor="middle" font-weight="700" fill="#c4554e" font-size="13">0xDC</text>
  <text x="700" y="175" text-anchor="middle" fill="#8a8297" font-size="11">CRC[7:0]</text>
  <rect x="740" y="138" width="80" height="46" fill="#fce5e2" stroke="#c4554e" stroke-width="1.5"/>
  <text x="780" y="158" text-anchor="middle" font-weight="700" fill="#c4554e" font-size="13">0x23</text>
  <text x="780" y="175" text-anchor="middle" fill="#8a8297" font-size="11">CRC[15:8]</text>

  <!-- coverage brackets -->
  <path d="M20 194 V202 H270 V194" fill="none" stroke="#a9700f" stroke-width="1.5"/>
  <text x="145" y="218" text-anchor="middle" fill="#a9700f" font-weight="700">ECC protects D[23:0] (SEC-DED)</text>
  <path d="M360 194 V202 H660 V194" fill="none" stroke="#c4554e" stroke-width="1.5"/>
  <text x="510" y="218" text-anchor="middle" fill="#c4554e" font-weight="700">CRC-16 over payload only (detect, no fix)</text>
  <text x="740" y="218" text-anchor="middle" fill="#8a8297" font-size="11">CRC = 0x23DC, LSB first</text>

  <!-- ===== DI bit field ===== -->
  <text x="20" y="258" font-size="14" font-weight="700" fill="#2e2939">Data Identifier byte (DI)</text>
  <g font-size="12" text-anchor="middle">
    <rect x="20" y="270" width="80" height="34" fill="#f0e7fb" stroke="#8a5cc0"/><text x="60" y="292" fill="#8a5cc0" font-weight="700">VC[1]</text>
    <rect x="100" y="270" width="80" height="34" fill="#f0e7fb" stroke="#8a5cc0"/><text x="140" y="292" fill="#8a5cc0" font-weight="700">VC[0]</text>
    <rect x="180" y="270" width="480" height="34" fill="#eef2fb" stroke="#5677c9"/><text x="420" y="292" fill="#5677c9" font-weight="700">DT[5:0]   0x00–0x0F short · 0x10–0x3F long</text>
  </g>
  <g fill="#8a8297" font-size="11" text-anchor="middle">
    <text x="60" y="320">bit 7</text><text x="140" y="320">bit 6</text><text x="200" y="320">bit 5</text><text x="640" y="320">bit 0</text>
  </g>
  <text x="680" y="284" fill="#4b4459" font-size="11">0x6B = VC1 + 0x2B</text>
  <text x="680" y="300" fill="#4b4459" font-size="11">(vc &lt;&lt; 6) | dt</text>

  <!-- ===== DT legend ===== -->
  <g font-size="11" fill="#4b4459">
    <text x="20" y="352">DT: 0x00 FS · 0x01 FE · 0x02 LS · 0x03 LE · 0x1E YUV422-8 (16 bpp) · 0x2A RAW8 · 0x2B RAW10 · 0x2C RAW12</text>
    <text x="20" y="372">expected WC = width × bpp / 8 :  RAW10 1920 → 2400 · RAW12 1920 → 2880 · YUV422 1920 → 3840 · RAW10 1918 → 0 (not byte aligned)</text>
    <text x="20" y="392" fill="#8a8297">RAW10 packing: 4 pixels → 5 bytes (4 × MSB[9:2], then 1 byte of the four 2-bit LSBs)</text>
  </g>
</svg>
