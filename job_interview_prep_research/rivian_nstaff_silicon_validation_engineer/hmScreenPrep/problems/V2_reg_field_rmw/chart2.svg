<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
<rect width="760" height="330" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b9b0c6"/></marker></defs>
<text x="195" y="26" text-anchor="middle" font-weight="700" fill="#c4554e" font-size="14">naive RMW</text>
<text x="565" y="26" text-anchor="middle" font-weight="700" fill="#2f8a5f" font-size="14">field_write (W1C masked out)</text>
<text x="380" y="46" text-anchor="middle" fill="#8a8297" font-size="11">goal: IRQ_EN = 5 · HW already latched pending = 0b111 (IRQ = 0x00000007)</text>
<rect x="30" y="62" width="330" height="48" rx="8" fill="#ffffff" stroke="#5677c9" stroke-width="1.5"/>
<text x="195" y="82" text-anchor="middle" font-weight="700" fill="#2e2939">1. read IRQ</text>
<text x="195" y="100" text-anchor="middle" fill="#2e2939" font-family="ui-monospace,Menlo,monospace" font-size="12">0x0000_0007   pending = 111</text>
<line x1="195" y1="110" x2="195" y2="126" stroke="#b9b0c6" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="30" y="128" width="330" height="48" rx="8" fill="#ffffff" stroke="#5677c9" stroke-width="1.5"/>
<text x="195" y="148" text-anchor="middle" font-weight="700" fill="#2e2939">2. (v &amp; ~IRQ_EN) | 5&lt;&lt;16</text>
<text x="195" y="166" text-anchor="middle" fill="#5677c9" font-family="ui-monospace,Menlo,monospace" font-size="12">0x0005_0007</text>
<line x1="195" y1="176" x2="195" y2="192" stroke="#b9b0c6" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="30" y="194" width="330" height="48" rx="8" fill="#fcf0d6" stroke="#a9700f" stroke-width="1.5"/>
<text x="195" y="214" text-anchor="middle" font-weight="700" fill="#2e2939">3. write 0x0005_0007</text>
<text x="195" y="232" text-anchor="middle" fill="#a9700f" font-family="ui-monospace,Menlo,monospace" font-size="12">1s land on W1C bits [2:0] → cleared</text>
<line x1="195" y1="242" x2="195" y2="258" stroke="#b9b0c6" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="30" y="260" width="330" height="48" rx="8" fill="#fce5e2" stroke="#c4554e" stroke-width="1.5"/>
<text x="195" y="280" text-anchor="middle" font-weight="700" fill="#2e2939">result 0x0005_0000</text>
<text x="195" y="298" text-anchor="middle" fill="#c4554e" font-family="ui-monospace,Menlo,monospace" font-size="12">3 pending interrupts lost ✗</text>
<rect x="400" y="62" width="330" height="48" rx="8" fill="#ffffff" stroke="#5677c9" stroke-width="1.5"/>
<text x="565" y="82" text-anchor="middle" font-weight="700" fill="#2e2939">1. read IRQ</text>
<text x="565" y="100" text-anchor="middle" fill="#2e2939" font-family="ui-monospace,Menlo,monospace" font-size="12">0x0000_0007   pending = 111</text>
<line x1="565" y1="110" x2="565" y2="126" stroke="#b9b0c6" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="400" y="128" width="330" height="48" rx="8" fill="#ffffff" stroke="#5677c9" stroke-width="1.5"/>
<text x="565" y="148" text-anchor="middle" font-weight="700" fill="#2e2939">2. (v &amp; ~(IRQ_EN | W1C)) | 5&lt;&lt;16</text>
<text x="565" y="166" text-anchor="middle" fill="#5677c9" font-family="ui-monospace,Menlo,monospace" font-size="12">0x0005_0000</text>
<line x1="565" y1="176" x2="565" y2="192" stroke="#b9b0c6" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="400" y="194" width="330" height="48" rx="8" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="1.5"/>
<text x="565" y="214" text-anchor="middle" font-weight="700" fill="#2e2939">3. write 0x0005_0000</text>
<text x="565" y="232" text-anchor="middle" fill="#2f8a5f" font-family="ui-monospace,Menlo,monospace" font-size="12">0s on W1C bits → untouched</text>
<line x1="565" y1="242" x2="565" y2="258" stroke="#b9b0c6" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="400" y="260" width="330" height="48" rx="8" fill="#e2f4e9" stroke="#2f8a5f" stroke-width="1.5"/>
<text x="565" y="280" text-anchor="middle" font-weight="700" fill="#2e2939">result 0x0005_0007</text>
<text x="565" y="298" text-anchor="middle" fill="#2f8a5f" font-family="ui-monospace,Menlo,monospace" font-size="12">pending kept ✓  IRQ_EN = 5</text>
<text x="380" y="322" text-anchor="middle" fill="#8a8297" font-size="11">same rule for SOFT_RST (SC): never echo a 1 you did not mean to write</text>
</svg>
