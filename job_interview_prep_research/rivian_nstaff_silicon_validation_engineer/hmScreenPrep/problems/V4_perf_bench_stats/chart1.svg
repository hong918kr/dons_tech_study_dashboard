<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310" width="700" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
  <rect x="0" y="0" width="700" height="310" fill="#ffffff"/>
  <!-- outlier region: > p50 * 2 = 2000 -->
  <rect x="270.9" y="40" width="369.1" height="210" fill="#fcf0d6" opacity=".8"/>
  <text x="455" y="150" text-anchor="middle" fill="#a9700f" font-weight="700">outliers: &gt; p50 × 2 = 2000</text>
  <text x="455" y="166" text-anchor="middle" fill="#a9700f">count = 2</text>
  <!-- axes -->
  <line x1="60" y1="250" x2="640" y2="250" stroke="#b9b0c6"/>
  <line x1="60" y1="40" x2="60" y2="250" stroke="#b9b0c6"/>
  <g fill="#8a8297" text-anchor="end" font-size="11">
    <text x="54" y="254">0</text><text x="54" y="204">25</text><text x="54" y="154">50</text>
    <text x="54" y="104">75</text><text x="54" y="54">100</text>
  </g>
  <text x="20" y="150" fill="#8a8297" font-size="11" transform="rotate(-90 20 150)" text-anchor="middle">samples</text>
  <g fill="#8a8297" text-anchor="middle" font-size="11">
    <text x="60" y="268">0</text><text x="165.5" y="268">1000</text><text x="270.9" y="268">2000</text>
    <text x="376.4" y="268">3000</text><text x="481.8" y="268">4000</text><text x="587.3" y="268">5000</text>
  </g>
  <text x="350" y="292" fill="#8a8297" text-anchor="middle" font-size="11">cycles per iteration (overhead removed) · n = 100</text>
  <!-- bars -->
  <rect x="152.5" y="60" width="26" height="190" fill="#5677c9" rx="2"/>
  <text x="165.5" y="160" fill="#ffffff" text-anchor="middle" font-weight="700" transform="rotate(-90 165.5 160)">95 × 1000</text>
  <rect x="205.2" y="244" width="26" height="6" fill="#5677c9" rx="1"/>
  <text x="218.2" y="238" fill="#2e2939" text-anchor="middle" font-size="11">3 × 1500</text>
  <rect x="574.3" y="246" width="26" height="4" fill="#c4554e" rx="1"/>
  <text x="587.3" y="238" fill="#c4554e" text-anchor="middle" font-size="11">2 × 5000</text>
  <!-- markers -->
  <line x1="165.5" y1="40" x2="165.5" y2="60" stroke="#2f8a5f" stroke-width="2"/>
  <text x="160" y="34" fill="#2f8a5f" text-anchor="end" font-weight="700">p50 = 1000</text>
  <line x1="175.5" y1="40" x2="175.5" y2="250" stroke="#8a5cc0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="181" y="34" fill="#8a5cc0" font-weight="700">mean = 1095</text>
  <line x1="270.9" y1="40" x2="270.9" y2="250" stroke="#a9700f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="587.3" y1="40" x2="587.3" y2="232" stroke="#c4554e" stroke-width="2"/>
  <text x="582" y="34" fill="#c4554e" text-anchor="end" font-weight="700">p99 = 5000 (rank ⌈0.99·100⌉ = 99)</text>
</svg>
