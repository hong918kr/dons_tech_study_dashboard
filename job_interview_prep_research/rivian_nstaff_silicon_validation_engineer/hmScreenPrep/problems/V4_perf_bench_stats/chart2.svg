<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" font-family="-apple-system,'Apple SD Gothic Neo',sans-serif" font-size="12">
  <rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
  <!-- counter circle -->
  <circle cx="200" cy="180" r="110" fill="none" stroke="#b9b0c6" stroke-width="2"/>
  <path d="M 129.3 95.7 A 110 110 0 0 1 295.3 125" fill="none" stroke="#2f8a5f" stroke-width="6" stroke-linecap="round"/>
  <!-- wrap point -->
  <line x1="200" y1="60" x2="200" y2="80" stroke="#c4554e" stroke-width="2"/>
  <text x="200" y="40" text-anchor="middle" fill="#c4554e" font-weight="700">wrap: 0xFFFFFFFF → 0x00000000</text>
  <text x="200" y="54" text-anchor="middle" fill="#8a8297" font-size="11">(not to scale)</text>
  <!-- t0 / t1 -->
  <circle cx="129.3" cy="95.7" r="6" fill="#5677c9" stroke="#fff" stroke-width="1.5"/>
  <text x="118" y="88" text-anchor="end" fill="#5677c9" font-weight="700">t0 = 0xFFFFFF9C</text>
  <circle cx="295.3" cy="125" r="6" fill="#5677c9" stroke="#fff" stroke-width="1.5"/>
  <text x="306" y="122" fill="#5677c9" font-weight="700">t1 = 0x000000DC</text>
  <text x="212" y="118" text-anchor="middle" fill="#2f8a5f" font-weight="700">320 cycles</text>
  <text x="200" y="182" text-anchor="middle" fill="#2e2939" font-weight="700">32-bit cycle counter</text>
  <text x="200" y="198" text-anchor="middle" fill="#8a8297" font-size="11">wraps every 2^32 / 1.5 GHz ≈ 2.86 s</text>
  <text x="200" y="214" text-anchor="middle" fill="#8a8297" font-size="11">counts clockwise ↻</text>
  <!-- right panel -->
  <g font-family="ui-monospace,Menlo,monospace" font-size="12">
    <text x="420" y="90" fill="#2e2939" font-weight="700">uint32_t raw = t1 - t0;</text>
    <text x="420" y="112" fill="#2e2939">0x000000DC − 0xFFFFFF9C</text>
    <text x="420" y="132" fill="#2f8a5f" font-weight="700">= 0x00000140 = 320 ✓</text>
    <text x="420" y="154" fill="#2e2939">raw − overhead(20) = 300</text>
    <text x="420" y="196" fill="#c4554e" font-weight="700">(int64_t)t1 − (int64_t)t0</text>
    <text x="420" y="216" fill="#c4554e">= 220 − 4294967196</text>
    <text x="420" y="236" fill="#c4554e">= −4294966976 ✗</text>
  </g>
  <text x="420" y="276" fill="#8a8297" font-size="11">조건: 실제 Δ &lt; 2^32 cycles (한 번만 wrap)</text>
  <text x="420" y="292" fill="#8a8297" font-size="11">더 길면 64-bit counter(CNTVCT) 또는 overflow IRQ</text>
</svg>
