# TOOL-M06 build settings — sourced by check.sh (bash syntax). Change only the values.
# check.sh compiles foo.c + foo_util.c into the library, app.c + app_util.c into the app:
#   Mac: cc $LIB_CFLAGS -c ...; cc $MAC_LIB_LDFLAGS *.o -o <build>/libfoo.dylib
#        cc app.c app_util.c -L<build> -lfoo $MAC_APP_LDFLAGS -o <build>/app
#   VM:  gcc $LIB_CFLAGS -c ...; gcc $ELF_LIB_LDFLAGS *.o -o <build>/libfoo.so.$LIB_VERSION
#        (+ libfoo.so dev link, ldconfig -n) ; gcc app.c app_util.c -L<build> -lfoo $ELF_APP_LDFLAGS
# The app is then installed as  <bundle>/bin/app  and the library into  <bundle>/lib/ .
LIB_VERSION=1.2.0

LIB_CFLAGS="-O2 -fPIC -fvisibility=hidden"
MAC_LIB_LDFLAGS="-dynamiclib -install_name @rpath/libfoo.dylib -compatibility_version 1.0 -current_version 1.2.0"
MAC_APP_LDFLAGS="-Wl,-rpath,@loader_path/../lib"
ELF_LIB_LDFLAGS="-shared -Wl,-soname,libfoo.so.1"
ELF_APP_LDFLAGS='-Wl,-rpath,$ORIGIN/../lib'
