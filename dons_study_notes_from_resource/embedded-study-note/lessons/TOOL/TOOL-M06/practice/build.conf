# TOOL-M06 build settings — sourced by check.sh (bash syntax). Change only the values.
# check.sh compiles foo.c + foo_util.c into the library, app.c + app_util.c into the app:
#   Mac: cc $LIB_CFLAGS -c ...; cc $MAC_LIB_LDFLAGS *.o -o <build>/libfoo.dylib
#        cc app.c app_util.c -L<build> -lfoo $MAC_APP_LDFLAGS -o <build>/app
#   VM:  gcc $LIB_CFLAGS -c ...; gcc $ELF_LIB_LDFLAGS *.o -o <build>/libfoo.so.$LIB_VERSION
#        (+ libfoo.so dev link, ldconfig -n) ; gcc app.c app_util.c -L<build> -lfoo $ELF_APP_LDFLAGS
# The app is then installed as  <bundle>/bin/app  and the library into  <bundle>/lib/ .
LIB_VERSION=1.2.0

LIB_CFLAGS="-O2 -fPIC -fvisibility=hidden"
MAC_LIB_LDFLAGS="-dynamiclib -install_name @rpath/libfoo.1.dylib -compatibility_version 1.0 -current_version 1.2.0"
MAC_APP_LDFLAGS="-Wl,-rpath,@loader_path/../lib"
ELF_LIB_LDFLAGS="-shared -Wl,-soname,libfoo.so.1 -Wl,--version-script=foo.map"
ELF_APP_LDFLAGS='-Wl,-rpath,$ORIGIN/../lib'

# ---- practice 1: repair an already-built package (absolute install name) without relinking ----
fixup_legacy() { # fixup_legacy <bundle>/bin/app <bundle>/lib/libfoo.dylib
	local old
	old=$(otool -D "$2" | sed -n 2p)
	install_name_tool -id @rpath/libfoo.dylib "$2"
	install_name_tool -change "$old" @rpath/libfoo.dylib -add_rpath @loader_path/../lib "$1"
}

# ---- practice 2: libfoo 2.0.0 (ABI 2) installed NEXT TO 1.x: new major = new name ----
LIB2_VERSION=2.0.0
MAC_LIB2_LDFLAGS="-dynamiclib -install_name @rpath/libfoo.2.dylib -compatibility_version 2.0 -current_version 2.0.0"
ELF_LIB2_LDFLAGS="-shared -Wl,-soname,libfoo.so.2"
