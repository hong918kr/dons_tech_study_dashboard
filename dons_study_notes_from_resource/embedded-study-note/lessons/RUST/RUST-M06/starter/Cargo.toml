[package]
name = "rust_m06_starter"
version = "0.1.0"
edition = "2024"
publish = false

# 라이브러리 본체는 #![no_std] — thumbv7em-none-eabihf 로도 빌드된다.
# 칩에서는 바이너리 크레이트가 critical-section 구현체를 고른다
#   (예: cortex-m = { version = "0.7", features = ["critical-section-single-core"] }).
[dependencies]
critical-section = "1.2"

# 호스트 테스트: critical-section 의 std 구현 (전역 std::sync::Mutex + 스레드별 중첩 플래그)
[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }
