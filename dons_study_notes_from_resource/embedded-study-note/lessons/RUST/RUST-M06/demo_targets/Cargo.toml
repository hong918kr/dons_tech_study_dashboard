[package]
name = "rust_m06_demo_targets"
version = "0.1.0"
edition = "2024"
publish = false

# 크로스 빌드 관찰용 no_std 라이브러리 (링크하지 않으므로 critical-section 구현체 불필요)
[features]
default = []
pa-cs = ["dep:portable-atomic", "portable-atomic/critical-section"]       # M0: CAS 를 critical section 으로
pa-single = ["dep:portable-atomic", "portable-atomic/unsafe-assume-single-core"] # M0: 직접 PRIMASK (단일 코어 가정)
try-u64 = []                                                              # core::sync::atomic::AtomicU64 시도

[dependencies]
critical-section = "1.2"
portable-atomic = { version = "1.15", optional = true, default-features = false }

[profile.release]
opt-level = "s"
