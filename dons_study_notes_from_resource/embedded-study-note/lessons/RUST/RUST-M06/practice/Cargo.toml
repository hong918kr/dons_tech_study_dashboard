[package]
name = "rust_m06_practice"
version = "0.1.0"
edition = "2024"
publish = false

# 추가 연습. 라이브러리 본체는 #![no_std] 이고 thumbv6m-none-eabi(Cortex-M0+) 에서도 빌드된다 (연습 4).
[dependencies]
critical-section = "1.2"

# 연습 4: CAS 가 없는 타깃(thumbv6m)에서만 portable-atomic 을 쓴다.
# 칩 바이너리는 critical-section 구현체(예: cortex-m 의 critical-section-single-core)를 함께 링크해야 한다.
[target.'cfg(not(target_has_atomic = "32"))'.dependencies]
portable-atomic = { version = "1.15", default-features = false, features = ["critical-section"] }

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }
