[package]
name = "rust_m06_demo_race"
version = "0.1.0"
edition = "2024"
publish = false

# 진짜 스레드를 ISR 로 삼아 "주어진 naive 버전" 이 실제로 깨지는지 세어 보는 관찰용 바이너리.
# 결과는 실행마다 다르다 (체크 테스트가 아니다). 실행: cargo run --release
[dependencies]
rust_m06_solution = { path = "../solution" }
critical-section = { version = "1.2", features = ["std"] }
