[package]
name = "rust_m07_demo_types"
version = "0.1.0"
edition = "2024"
publish = false

# "단일 생산자/소비자" 가 타입 성질이라는 것을 실제 컴파일 오류로 보는 관찰용 바이너리.
# cargo run                          → 정상 (split → 생산자를 스레드로 이동)
# cargo build --features split-twice → E0499
# cargo build --features clone-producer → E0599
# cargo build --features outlive     → E0597
# cargo build --features rc-to-isr   → E0277
# cargo build --features shared-producer → E0596 (&Producer 로는 enqueue 못 함)
[features]
split-twice = []
clone-producer = []
outlive = []
rc-to-isr = []
shared-producer = []

[dependencies]
spsc_m07 = { path = "../solution", package = "rust_m07_solution" }
