[package]
name = "rust_m07_solution"
version = "0.1.0"
edition = "2024"
publish = false

# starter / solution 이 같은 라이브러리 이름을 쓴다 → 문서 테스트·loom 테스트 코드가 두 크레이트에서 글자 그대로 같다.
[lib]
name = "spsc_m07"

# 라이브러리 본체는 #![no_std] 이고 load/store atomic 만 쓴다
#   → thumbv7em-none-eabihf (Cortex-M4F) 와 thumbv6m-none-eabi (Cortex-M0+, CAS 없음) 둘 다 빌드된다.
# loom: RUSTFLAGS="--cfg loom" 일 때만 일반 의존성이 된다 (라이브러리가 loom 의 AtomicUsize/UnsafeCell 로 바뀜).
[target.'cfg(loom)'.dependencies]
loom = "0.7"

# 호스트 테스트: heapless::spsc 와 용량·동작 비교 (c4)
[dev-dependencies]
heapless = "0.9"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
