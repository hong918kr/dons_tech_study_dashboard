[package]
name = "rust_m07_demo_targets"
version = "0.1.0"
edition = "2024"
publish = false

# 크로스 빌드 + asm 관찰용 no_std 라이브러리. solution 의 제네릭 큐를 u8/64 로 구체화해 심볼을 만든다.
# cargo rustc --release --lib --target thumbv7em-none-eabihf -- --emit asm
# cargo rustc --release --lib --target thumbv6m-none-eabi   -- --emit asm
[dependencies]
spsc_m07 = { path = "../solution", package = "rust_m07_solution" }

[profile.release]
opt-level = "s"
