[package]
name = "rust_m07_demo_loom"
version = "0.1.0"
edition = "2024"
publish = false

# loom 이 "Relaxed 로 약화한 SPSC" 의 실패 인터리빙을 찾는지 보는 관찰용 크레이트.
# 실행: RUSTFLAGS="--cfg loom" cargo test --release [--features <아래 중 하나>]
[features]
default = []
weak-tail = []        # 생산자 tail store + 소비자 tail load 모두 Relaxed (데이터 게시 깨짐)
weak-tail-store = []  # 생산자 tail store 만 Relaxed (소비자는 Acquire 그대로)
weak-tail-load = []   # 소비자 tail load 만 Relaxed (생산자는 Release 그대로)
weak-head = []        # 소비자 head store + 생산자 head load 모두 Relaxed (슬롯 반납 깨짐)
atomic-slots = []     # 슬롯을 UnsafeCell 대신 AtomicU64(Relaxed) 로 — loom 의 UnsafeCell 검사 없이 "옛 값 읽기" 를 찾나?

[dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
