# SIV-M12 nightly test list — SoC A0 EVB
# YAML 부분집합만 쓴다 (md §5 Part A): 매핑 / 리스트 / 한 줄 [a, b] / 스칼라 / 주석.
# 앵커(&, *), 블록 문자열(|, >), 여러 문서(---), {a: 1} 은 파서가 거부한다.
run:
  name: nightly-a0-1108
  board: EVB-A0 sn0042
  fw: "siv-0.4.10"        # 버전은 항상 따옴표: 따옴표 없는 1.10 은 float 1.1 이 된다
  seed: 0x5EE9

limits:                   # 장비 보호 한계 — 리스트 검증 단계에서 거부 (PSU OVP 는 그 다음 방어선)
  vdd_mv_max: 950
  temp_c_min: -45
  temp_c_max: 125

corners:
  - name: NOM_25C
    vdd_mv: 800
    temp_c: 25
  - name: LV_HOT
    vdd_mv: 720
    temp_c: 105
  - name: NOM_COLD
    vdd_mv: 800
    temp_c: -40

tests:
  - name: reg.id
    func: id_check
    timeout_s: 2
    params:
      expect_id: 0x5A1000A0
  - name: reg.reset
    func: reg_reset
    requires: [reg.id]
  - name: sram.march
    func: sram_march
    requires: [reg.id]
    params:
      words: 1024
  - name: i2c.loopback
    func: i2c_loopback
    retries: 2
    requires: [reg.id]
    params:
      bytes: 8
  - name: pll.lock
    func: pll_lock
    runner: binary        # max_polls 0 = 무한 대기 → 행 위험 → 프로세스 격리 + 타임아웃
    timeout_s: 0.5
    requires: [reg.id]
    params:
      max_polls: 0
  - name: dma.ring
    func: dma_desc
    runner: binary        # 링 오버런 → 버스 폴트(크래시) 위험 → 프로세스 격리
    timeout_s: 2
    requires: [pll.lock]
    params:
      desc_count: 24
