# ELX-B13 practice drop-in: /run/systemd/system/esn-b13-sensord-@TAG@.service.d/practice.conf
[Service]
# P2: 6 s calibration > TimeoutStartSec=4 -> only works with EXTEND_TIMEOUT_USEC
Environment=ESN_CALIB_MS=6000
# P1: exit 3 = "sensor missing" -> restarting cannot help, fail at once
RestartPreventExitStatus=3
