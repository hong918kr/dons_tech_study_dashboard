<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Study Dashboard{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<div class="shell">

  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-icon">📚</span>
      <span class="brand-text">Study Dashboard</span>
    </a>
    <nav class="topnav">
      {% for n in nav %}
      <a href="{{ n.href }}" class="topnav-link {% if n.key == active %}active{% endif %}">
        <span class="ico">{{ n.icon }}</span><span class="lbl">{{ n.label }}</span>
      </a>
      {% endfor %}
    </nav>
  </header>

  {% block body %}{% endblock %}

</div>
{% block scripts %}{% endblock %}
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
